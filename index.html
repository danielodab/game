<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0d10">
<!-- O favicon embutido cala o 404 que o navegador dispara sozinho — foi a
     UNICA linha vermelha no console do Daniel numa tela preta, e ele leu o
     vermelho como a causa. Erro que nao e erro nao pode ficar gritando. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0d10'/%3E%3Ctext x='16' y='23' font-family='Georgia' font-size='19' font-weight='bold' text-anchor='middle' fill='%23c9a227'%3ES%3C/text%3E%3C/svg%3E">
<title>SOTERRA 2.0</title>
<script>
  // Cache: o jogo é local e roda com os arquivos do disco. Marcar a versão à mão
  // (?v=6) falhou duas vezes — o número ficava parado enquanto os arquivos mudavam,
  // e o navegador servia código velho enquanto os testes passavam com o novo.
  // Agora a marca é o instante do carregamento: sempre pega o que está no disco.
  //
  // Isto vale para o CÓDIGO. Os modelos (21 MB de .glb) NÃO levam esta marca:
  // eles têm a marca do manifesto, senão cada F5 baixaria os 21 MB de novo.
  window.__V = '?v=' + Date.now();
  window.__T0 = Date.now();
  document.write('<link rel="stylesheet" href="css/style.css' + window.__V + '">');

  // `?sandbox=1` manda o save viver na MEMÓRIA, sem tocar o disco. Existe para
  // `tests/celular.html`, que abre este mesmo index.html dentro de um quadro de
  // 390x844 para medir a interface: sem isto, medir a tela apagaria o jogo de
  // quem estivesse jogando pelo servidor. Uma linha, e só liga quando pedido.
  if (/[?&]sandbox=1/.test(location.search)) {
    document.write('<scr' + 'ipt src="tests/save_sandbox.js' + window.__V + '"><\/scr' + 'ipt>');
  }
</script>
</head>
<body>
<div id="app">
  <canvas id="game-canvas"></canvas>
  <div id="ui-root"></div>
  <div id="carga" hidden>
    <div class="carga-marca">SOTERRA</div>
    <div class="carga-trilho"><div class="carga-barra" id="carga-barra"></div></div>
    <div class="carga-txt" id="carga-txt">preparando…</div>
  </div>
</div>

<!--
  SOTERRA 2.0 — tabuleiro 3D (Three.js) com modelos CC0 do KayKit e do Quaternius.
  Alternativas:  index2d.html (isométrico 2D em PixiJS)  ·  v1_3d.html (linha 3D da v1)

  A arte do Sumô desenhada pelo usuário está preservada em assets/embedded/sprites-sumo.js.
  Ela ficou fora da lista porque a classe virou um Bárbaro de machado na migração 3D e o
  retrato desenhado não combinaria com o modelo em campo. Para trazê-la de volta, acrescente
  'assets/embedded/sprites-sumo.js' e 'js/render2d/spriteart.js' à lista abaixo, nesta ordem,
  logo antes de 'js/render3d/portraits3d.js' — ela tem prioridade sobre o retrato 3D.
-->
<script>
  // O carregador de modelos precisa existir antes da decisão abaixo.
  document.write('<scr' + 'ipt src="js/assets_bundle.js' + window.__V + '"><\/scr' + 'ipt>');
</script>
<script>
  (function () {
    // A ORDEM DESTA LISTA É A ÁRVORE DE DEPENDÊNCIAS. Não há bundler para avisar
    // se você errar: um arquivo que use JOGO.Engine tem de vir depois de engine.js.
    var arquivos = [
      'js/mobile.js',                  // detecta toque/celular — todo o resto consulta

      'vendor/three.min.js', 'vendor/GLTFLoader.js', 'vendor/CopyShader.js',
      'vendor/LuminosityHighPassShader.js', 'vendor/EffectComposer.js',
      'vendor/RenderPass.js', 'vendor/ShaderPass.js', 'vendor/UnrealBloomPass.js',

      'js/core/data/elements.js', 'js/core/data/classes.js', 'js/core/data/spells.js',
      'js/core/data/progression.js', 'js/core/data/monsters.js', 'js/core/data/dungeons.js',
      'js/core/data/fusions.js', 'js/core/data/pets.js', 'js/core/data/items.js',
      'js/core/data/items_extra.js',   // ADITIVO: 3º conjunto por calabouço + avulsos (depende de items.js)

      'js/core/contas.js',             // o Banco de Contas: decide a conta DESTA janela (?conta=)
      'js/core/db.js',                 // conta local (moedas, cofre, historicos) — API assincrona
      'js/core/missoes.js',            // diarias + conquistas + titulos (le e escreve no DB)
      'js/core/mercado.js',            // o Mercadinho: ofertas, mercador-fantasma, taxa
      'js/core/rede.js',               // presenca e chat entre abas (BroadcastChannel)
      'js/core/brasa.js',              // o ranking da arena: Elo e a escada das coroas
      'assets/embedded/coroas-pvp.js', // as 10 coroas do ranking, arte do usuario
      'js/core/troca.js',              // a mesa de troca: ofertas, trancas, execucao
      'js/core/engine.js', 'js/core/fusion.js', 'js/core/ai.js',
      'js/core/progress.js', 'js/core/game.js',

      // ---- daqui para baixo, precisa dos MODELOS carregados ----

      // cenário: kit KayKit Dungeon embutido + montador de salas
      'assets/embedded/env-kit.js', 'js/render3d/models3d.js',

      // personagens e monstros: modelos CC0 + banco único de animações
      'assets/embedded/fx-atlas.js',
      'assets/embedded/fx-placas.js',
      'assets/embedded/fx-anim.js',
      'assets/embedded/fx-cgheven.js',
      'assets/embedded/models-anims.js', 'assets/embedded/models-heroes.js',
      'assets/embedded/models-meshy.js',
      'assets/embedded/models-meshy-sum.js',
      'assets/embedded/models-meshy-jardim.js',
      'assets/embedded/models-fusoes-sumo.js',
      'assets/embedded/models-fusoes-minotauro.js',
      'assets/embedded/models-fusoes-cacador.js',
      'assets/embedded/models-fusoes-curandeira.js',
      'assets/embedded/models-fusao-bruxo-ladino.js',
      'assets/embedded/cenario-jardim.js',
      'assets/embedded/muro-escudo.js',
      'assets/embedded/sons.js',
      'assets/embedded/models-monsters.js',
      'assets/embedded/models-bosses.js',
      'assets/embedded/models-summons.js',

      'js/render3d/models3d_v2.js', 'js/render3d/fx3d_v2.js', 'js/render3d/renderer3d_v2.js',
      'js/render3d/hub3d.js',          // o Acampamento: mapa aberto com os portais

      // ícones e retratos da interface
      'js/render2d/art.js',
      'assets/embedded/icones-itens.js', // os 90 icones de item, arte do usuario
      'js/render2d/icones_itens.js',     // embrulha Art.itemIcon com eles
      'js/render3d/portraits3d.js',

      'js/audio.js', 'js/ui/hud.js', 'js/ui/debug.js', 'js/main.js'
    ];

    // Os embutidos que VIRARAM ARQUIVO (tools/extrai_assets.py). `fx-atlas.js` e
    // `fx-placas.js` continuam embutidos de propósito: somam 0,8 MB e têm outro dono.
    // `muro-escudo` nasceu DEPOIS da regra e ficou de fora: o caminho servido
    // o lia em dobro (base64 parseado E binario baixado pelo bundle). Entra.
    //
    // `cenario-jardim` TAMBEM e lido em dobro (16 MB), mas NAO pode entrar
    // aqui: alem dos modelos, ele define as tabelas JOGO.CENARIO e
    // CENARIO_NOME, que o bundle nao carrega — cortar o arquivo cortaria as
    // tabelas e o cenario da Estufa sumiria no jogo servido. O conserto de
    // verdade e o extrai_assets separar tabela de modelo num arquivo proprio;
    // ate la, os 16 MB em dobro sao o preco de nao quebrar nada.
    var EMBUTIDO = /^assets\/embedded\/(env-kit|models-|muro-)/;
    var B = window.JOGO && window.JOGO.Bundle;

    function escreve(lista) {
      for (var i = 0; i < lista.length; i++) {
        document.write('<scr' + 'ipt src="' + lista[i] + window.__V + '"><\/scr' + 'ipt>');
      }
    }

    // ---- CAMINHO 1: dois cliques no index.html (file://) --------------------
    // `fetch`/XHR de .glb é bloqueado aqui, então os embutidos entram como
    // código — hoje 110 MB de base64. É lento, e é o preço de abrir sem
    // servidor, que o usuário faz questão de manter.
    //
    // O que NÃO pode é pagar esse preço NO ESCURO: ficou uma tela preta de
    // minutos e o usuário concluiu que o jogo quebrou ("não abriu nada") —
    // quando ele estava carregando, sem um pixel de aviso. A #carga que o
    // caminho servido sempre teve passa a aparecer aqui também, e entre um
    // arquivo pesado e o próximo um script de uma linha move a barra: o
    // navegador pinta entre scripts, então o progresso anda de verdade.
    if (!B || !B.servido) {
      var cx1 = document.getElementById('carga');
      if (cx1) cx1.hidden = false;
      var PESADO = /^assets\/embedded\//;
      var pesados = [], i1;
      for (i1 = 0; i1 < arquivos.length; i1++) {
        if (PESADO.test(arquivos[i1])) pesados.push(arquivos[i1]);
      }
      window.__cargaPasso = function (nome, idx, total) {
        var b1 = document.getElementById('carga-barra');
        var t1 = document.getElementById('carga-txt');
        if (b1) b1.style.width = Math.round(100 * idx / total) + '%';
        if (t1) t1.textContent = 'lendo ' + nome + ' (' + idx + ' de ' + total + ')';
      };
      var visto = 0;
      for (i1 = 0; i1 < arquivos.length; i1++) {
        var f1 = arquivos[i1];
        if (PESADO.test(f1)) {
          visto++;
          document.write('<scr' + 'ipt>__cargaPasso(' +
            JSON.stringify(f1.split('/').pop()) + ',' + visto + ',' + pesados.length +
            ')<\/scr' + 'ipt>');
        }
        document.write('<scr' + 'ipt src="' + f1 + window.__V + '"><\/scr' + 'ipt>');
      }
      document.write('<scr' + 'ipt>(function(){var c=document.getElementById("carga");' +
        'if(c)c.hidden=true;window.__BOOT_MS=Date.now()-window.__T0;})()<\/scr' + 'ipt>');
      return;
    }

    // ---- CAMINHO 2: servido (http://, e o https://localhost do APK) ---------
    // Fase A (vendor + regra de jogo) desce JÁ, enquanto os 21 MB de modelo
    // vêm por XHR. Fase B (render + HUD) só entra quando os modelos chegaram,
    // porque models3d.js lê JOGO.ASSETS no instante em que é avaliado.
    var corte = 0;
    while (corte < arquivos.length && !EMBUTIDO.test(arquivos[corte])) corte++;
    var faseA = arquivos.slice(0, corte);
    var faseB = arquivos.slice(corte).filter(function (f) { return !EMBUTIDO.test(f); });

    escreve(faseA);
    B.aquece(faseB, '');

    var caixa = document.getElementById('carga');
    var barra = document.getElementById('carga-barra');
    var texto = document.getElementById('carga-txt');
    if (caixa) caixa.hidden = false;

    B.busca({
      base: '',
      progresso: function (feitos, total) {
        var p = Math.round(100 * feitos / total);
        if (barra) barra.style.width = p + '%';
        if (texto) texto.textContent = 'modelos ' + feitos + '/' + total;
      },
      pronto: function (err) {
        if (err) {
          if (texto) texto.textContent = 'falhou: ' + err.message + ' — rode tools/extrai_assets.py';
          if (console && console.error) console.error('[Bundle]', err);
        }
        if (texto) texto.textContent = 'montando a sala…';
        B.injeta(faseB, '', function () {
          if (caixa) caixa.hidden = true;
          window.__BOOT_MS = Date.now() - window.__T0;
        });
      }
    });
  })();
</script>
</body>
</html>
