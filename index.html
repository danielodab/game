<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0d10">
<title>SOTERRA 2.0</title>
<script>
  // Cache: o jogo é local e roda com os arquivos do disco. Marcar a versão à mão
  // (?v=6) falhou duas vezes — o número ficava parado enquanto os arquivos mudavam,
  // e o navegador servia código velho enquanto os testes passavam com o novo.
  // Agora a marca é o instante do carregamento: sempre pega o que está no disco.
  window.__V = '?v=' + Date.now();
  document.write('<link rel="stylesheet" href="css/style.css' + window.__V + '">');
</script>
</head>
<body>
<div id="app">
  <canvas id="game-canvas"></canvas>
  <div id="ui-root"></div>
</div>

<!--
  SOTERRA 2.0 — tabuleiro 3D (Three.js) com modelos CC0 do KayKit e do Quaternius.
  Alternativas:  index2d.html (isométrico 2D em PixiJS)  ·  v1_3d.html (linha 3D da v1)

  A arte do Sumô desenhada pelo usuário está preservada em assets/embedded/sprites-sumo.js.
  Ela ficou fora da lista porque a classe virou um Bárbaro de machado na migração 3D e o
  retrato desenhado não combinaria com o modelo em campo. Para trazê-la de volta, acrescente
  'assets/embedded/sprites-sumo.js' e 'js/render2d/spriteart.js' à lista abaixo, nesta ordem,
  logo antes de 'js/render3d/portraits3d.js' — ela tem prioridade sobre o retrato 3D.
-->
<script>
  (function () {
    var arquivos = [
      'vendor/three.min.js', 'vendor/GLTFLoader.js', 'vendor/CopyShader.js',
      'vendor/LuminosityHighPassShader.js', 'vendor/EffectComposer.js',
      'vendor/RenderPass.js', 'vendor/ShaderPass.js', 'vendor/UnrealBloomPass.js',

      'js/core/data/elements.js', 'js/core/data/classes.js', 'js/core/data/spells.js',
      'js/core/data/progression.js', 'js/core/data/monsters.js', 'js/core/data/dungeons.js',
      'js/core/data/fusions.js', 'js/core/data/pets.js', 'js/core/data/items.js',
      'js/core/data/items_extra.js',   // ADITIVO: 3º conjunto por calabouço + avulsos (depende de items.js)

      'js/core/engine.js', 'js/core/fusion.js', 'js/core/ai.js',
      'js/core/progress.js', 'js/core/game.js',

      // cenário: kit KayKit Dungeon embutido + montador de salas
      'assets/embedded/env-kit.js', 'js/render3d/models3d.js',

      // personagens e monstros: modelos CC0 + banco único de animações
      'assets/embedded/fx-atlas.js',
      'assets/embedded/fx-placas.js',
      'assets/embedded/models-anims.js', 'assets/embedded/models-heroes.js',
      'assets/embedded/models-monsters.js',
      'assets/embedded/models-bosses.js',
      'assets/embedded/models-summons.js',

      'js/render3d/models3d_v2.js', 'js/render3d/fx3d_v2.js', 'js/render3d/renderer3d_v2.js',

      // ícones e retratos da interface
      'js/render2d/art.js', 'js/render3d/portraits3d.js',

      'js/ui/hud.js', 'js/ui/debug.js', 'js/main.js'
    ];
    for (var i = 0; i < arquivos.length; i++) {
      document.write('<script src="' + arquivos[i] + window.__V + '"><\/script>');
    }
  })();
</script>
</body>
</html>
