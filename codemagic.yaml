# SOTERRA — a compilação do aplicativo de iPhone na nuvem (Codemagic), sem Mac.
# O passo a passo inteiro (a conta da Apple, a chave da API, o primeiro build) está em docs/APP_STORE.md §2 e §3.
#
# Este arquivo NÃO tem segredo nenhum: a chave da API do App Store Connect, o certificado e o perfil de
# assinatura ficam guardados no Codemagic (Team settings), nunca no Git.
#
# Escrito em 25/10/2026 pela documentação do Codemagic, sem ter rodado ainda. Se o primeiro build falhar, o log
# mostra em qual passo — e é ali que se mexe.

workflows:
  ios-testflight:
    name: SOTERRA iPhone para o TestFlight
    instance_type: mac_mini_m2          # o Mac da conta gratuita (500 minutos por mês)
    max_build_duration: 60
    integrations:
      app_store_connect: SOTERRA        # o NOME que a chave da API ganhou no Codemagic (docs/APP_STORE.md §3.2)
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: br.com.soterra.jogo
      vars:
        APP_STORE_APPLE_ID: "6826929117"  # o "ID da Apple" do app (App Store Connect → o app → Informações do app)
      node: 22                          # o Capacitor 8 pede Node 22 ou mais novo
      xcode: latest                     # a Apple exige o Xcode 26 (SDK do iOS 26) desde 28/04/2026
    scripts:
      - name: As dependências (o Capacitor e os plugins, nas versões do package-lock.json)
        script: npm ci
      - name: A www/ e o projeto do iPhone
        script: |
          python3 tools/empacota_www.py
          npx cap sync ios
      - name: A prova da casca do iPhone
        script: python3 tests/app_ios.py
      - name: A assinatura (o certificado e o perfil guardados no Codemagic)
        script: xcode-project use-profiles
      - name: O número do build (o último do TestFlight + 1; só nesta máquina, nada volta para o Git)
        script: |
          ULTIMO=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          case "$ULTIMO" in ''|*[!0-9]*) ULTIMO=0 ;; esac
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $((ULTIMO + 1));/" ios/App/App.xcodeproj/project.pbxproj
          echo "build $((ULTIMO + 1))"
      - name: Compilar o IPA
        script: xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
