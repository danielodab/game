<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Validação do MUNDO — SOTERRA 2.0</title>
<style>
  body { background: #14181c; color: #d8dee4; font-family: Consolas, monospace; padding: 20px; }
  h1 { font-size: 18px; color: #ffd76b; margin: 0 0 4px; }
  h2 { font-size: 13px; color: #8ab4d8; margin: 16px 0 4px; }
  .sub { color: #6b7684; font-size: 12px; margin-bottom: 12px; }
  #summary { font-size: 16px; margin: 12px 0; padding: 10px; border-radius: 6px; }
  #summary.ok { background: #15351b; color: #7be08a; }
  #summary.bad { background: #3a1515; color: #ff8a8a; }
  .fail { color: #ff8a8a; }
  .pass { color: #6fae76; }
  ul { list-style: none; padding: 0; margin: 0; font-size: 12px; }
  li { padding: 1px 0; }
  details { margin-top: 12px; }
  summary { cursor: pointer; color: #8ab4d8; }
  table { border-collapse: collapse; font-size: 12px; margin-top: 8px; }
  td, th { border: 1px solid #2a323b; padding: 2px 8px; text-align: left; }
  th { color: #ffd76b; }
</style>
</head>
<body>
<h1>Validação do MUNDO — SOTERRA 2.0</h1>
<div class="sub">Elementos e climas · bestiário · 6 calabouços, cenário e eventos de terreno. (Criativo Mundo)</div>
<div id="summary">Carregando…</div>
<div id="failList"></div>
<div id="stats"></div>
<details><summary>Todas as checagens</summary><ul id="allList"></ul></details>

<script>
// Cache-buster: o servidor estático guarda os arquivos com unhas e dentes.
(function () {
  var v = '?v=' + Date.now();
  var files = [
    '../js/core/data/elements.js',
    '../js/core/data/monsters.js',
    '../js/core/data/dungeons.js',
    '../js/core/data/arenas.js',     // 02/10: a Câmara do Eco mora lá (seção 9)
    '../js/core/data/eco.js',        // 02/10: o Eco Primordial (seção 9)
    '../js/core/data/santuario.js',  // 03/10: o Santuário dos Elementos (seção 10)
    '../js/core/data/items.js',      // dono: Criativo Fusão (só leitura, p/ cruzar lootTable)
    '../js/core/data/items_extra.js', // dono: Criativo Itens (aditivo; idem)
    '../js/core/data/spells.js',     // dono: Criativo Classes (só leitura, p/ cruzar summons)
    '../js/core/data/classes.js',    // dono: Criativo Classes (só leitura, p/ cruzar cardDrops)
    '../js/core/data/progression.js' // dono: Criativo Classes (só leitura, DATA.cards)
  ];
  for (var i = 0; i < files.length; i++) {
    document.write('<scr' + 'ipt src="' + files[i] + v + '"><\/scr' + 'ipt>');
  }
})();
</script>

<script>
(function () {
  'use strict';

  var results = [];
  function check(name, ok, detail) {
    results.push({ name: name, ok: !!ok, detail: detail || '' });
    if (!ok) { console.error('FAIL: ' + name + (detail ? ' — ' + detail : '')); }
    return !!ok;
  }

  // ---------------------------------------------------------------- vocabulário
  var ELEMENTS = ['neutro', 'fogo', 'agua', 'terra', 'ar'];
  var SHAPES = ['single', 'cross', 'circle', 'line', 'cone', 'ring'];
  var AIS = ['melee', 'ranged', 'support', 'boss'];
  var BUFF_STATS = ['pa', 'pp', 'power', 'initiative', 'dodge', 'lock'];
  var SIDES = ['any', 'enemy', 'ally', 'self'];
  var EVENT_KINDS = ['buff', 'mystery', 'portal', 'drain', 'fountain'];
  var CLASS_IDS = ['sumo', 'arqueiro', 'bruxo', 'espadachim', 'curandeiro', 'invocador'];
  var DUNGEON_IDS = ['greenhouse', 'cistern', 'emberlock', 'windscaffold', 'quakemine', 'brokenheart'];
  // 03/10: os calabouços ESPECIAIS (o Santuário dos Elementos) moram em DATA.especiais, fora dos seis portais:
  // os monstros deles apontam para lá, e as salas passam pela seção 10
  var ESPECIAIS_IDS = ['elementsanctum'];
  var ITEM_PREFIX = {
    greenhouse: 'gh-', cistern: 'ci-', emberlock: 'em-',
    windscaffold: 'av-', quakemine: 'mt-', brokenheart: 'cp-'
  };
  var REQUIRED_SUMMONS = ['sum-familiar', 'sum-ember-hound', 'sum-magma-colossus', 'sum-tide-nymph',
                          'sum-stone-sentinel', 'sum-mountain-golem', 'sum-storm-falcon'];
  var HEX = /^#[0-9a-fA-F]{6}$/;

  var EFFECT_REQ = {
    damage: ['element', 'min', 'max'],
    heal: ['min', 'max'],
    shield: ['value', 'duration'],
    buff: ['stat', 'value', 'duration'],
    resist: ['element', 'value', 'duration'],
    push: ['tiles'],
    pull: ['tiles'],
    teleport: [],
    swap: [],
    poison: ['element', 'min', 'max', 'duration'],
    regen: ['min', 'max', 'duration'],
    summon: ['monsterId'],
    taunt: ['duration'],
    invisible: ['duration'],
    root: ['duration'],
    mark: ['value', 'duration', 'max'],
    detonateMarks: ['mult'],
    trap: ['trapId', 'duration'],
    weatherShift: ['weather'],
    cleanse: ['kinds'],
    reflect: ['pct', 'duration'],
    dispelShield: [],
    moveTo: ['maxTiles'],
    chain: ['jumps', 'falloff', 'element', 'min', 'max']
  };
  var TRAIT_REQ = {
    explodeOnDeath: ['element', 'damage', 'radius'],
    split: ['monsterId', 'count'],
    enrage: ['hpPct', 'power'],
    pushImmune: [],
    regenAura: ['value', 'radius'],
    // 02/10: os quatro traços dos Colossos do Poço (a regra em js/core/poco.js)
    rastroBrasa: ['spellId', 'duration'],
    mare: ['cura', 'duration'],
    couraca: ['pontos', 'reducao'],
    ventania: ['tiles'],
    // 03/10: o guardião do Fogo do Santuário enxerga (e mira) no escuro como quem é do Fogo (js/core/santuario.js)
    veNoEscuro: []
  };

  function has(o, k) { return o && Object.prototype.hasOwnProperty.call(o, k) && o[k] !== undefined && o[k] !== null; }
  function inList(v, list) { return list.indexOf(v) !== -1; }
  function keys(o) { var r = []; for (var k in o) { if (o.hasOwnProperty(k)) { r.push(k); } } return r; }

  var D = (typeof JOGO !== 'undefined') && JOGO.DATA;
  if (!check('JOGO.DATA existe', !!D)) { render(); return; }

  // =========================================================================
  // 1. ELEMENTOS E RIVALIDADES
  // =========================================================================
  check('DATA.elements tem os 5 elementos exatos',
    !!D.elements && D.elements.length === 5 && ELEMENTS.every(function (e) { return D.elements.indexOf(e) !== -1; }),
    JSON.stringify(D.elements));

  check('DATA.rivals existe', !!D.rivals);
  if (D.rivals) {
    check('rivals: fogo ⚔ agua', D.rivals.fogo === 'agua' && D.rivals.agua === 'fogo');
    check('rivals: terra ⚔ ar', D.rivals.terra === 'ar' && D.rivals.ar === 'terra');
    check('rivals: neutro sem rival', D.rivals.neutro === null);
  }

  // =========================================================================
  // 2. CLIMAS — os 5 obrigatórios, com favors/harms coerentes com as rivalidades
  // =========================================================================
  var W = D.weathers || {};
  var REQUIRED_WEATHERS = {
    calmo: [null, null], chuva: ['agua', 'fogo'], estiagem: ['fogo', 'agua'],
    vendaval: ['ar', 'terra'], tremor: ['terra', 'ar']
  };
  check('DATA.weathers tem exatamente 5 climas', keys(W).length === 5, 'tem ' + keys(W).length);
  for (var wid in REQUIRED_WEATHERS) {
    if (!REQUIRED_WEATHERS.hasOwnProperty(wid)) { continue; }
    var w = W[wid];
    if (!check('clima ' + wid + ' existe', !!w)) { continue; }
    var exp = REQUIRED_WEATHERS[wid];
    check('clima ' + wid + ': id bate com a chave', w.id === wid);
    check('clima ' + wid + ': nome pt-BR', typeof w.name === 'string' && w.name.length > 0);
    check('clima ' + wid + ': descrição saborosa (≥40 chars)', typeof w.description === 'string' && w.description.length >= 40);
    check('clima ' + wid + ': fxKey', typeof w.fxKey === 'string' && w.fxKey.length > 0);
    check('clima ' + wid + ': favors = ' + exp[0], w.favors === exp[0], String(w.favors));
    check('clima ' + wid + ': harms = ' + exp[1], w.harms === exp[1], String(w.harms));
    // coerência estrutural: quem é prejudicado é SEMPRE o rival do favorecido
    check('clima ' + wid + ': harms é o rival de favors',
      w.favors === null ? w.harms === null : (D.rivals[w.favors] === w.harms));
    check('clima ' + wid + ': palette completa e em hex',
      !!w.palette && ['tint', 'ambient', 'accent', 'particle'].every(function (k) { return HEX.test(w.palette[k]); }),
      JSON.stringify(w.palette));
  }

  // =========================================================================
  // 3. FEITIÇOS DE MONSTRO (DATA.monsterSpells)
  // =========================================================================
  var MS = D.monsterSpells || {};
  var MON = D.monsters || {};
  check('DATA.monsterSpells existe e não está vazio', keys(MS).length > 0, keys(MS).length + ' feitiços');
  check('DATA.monsterSpells não colide com DATA.spells (prefixo m-/sum-)',
    keys(MS).every(function (id) { return id.indexOf('m-') === 0; }),
    keys(MS).filter(function (id) { return id.indexOf('m-') !== 0; }).join(', '));
  if (D.spells) {
    var collide = keys(MS).filter(function (id) { return has(D.spells, id); });
    check('nenhum id de feitiço de monstro colide com DATA.spells (Criativo Classes)',
      collide.length === 0, collide.join(', '));
    // 19/09: a mesma régua da visão para os feitiços de classe (só leitura aqui; a prova por mapa é
    // tests/visao_mapas.js, que também cobre pets, itens e as fusões compostas)
    var semLos = keys(D.spells).filter(function (id) {
      var r = D.spells[id] && D.spells[id].range;
      return !!r && r.max > 0 && r.los !== true && id !== 'gm-julgamento';
    });
    check('DATA.spells: todo feitiço com alcance > 0 exige los:true (exceção nomeada: gm-julgamento)',
      semLos.length === 0, semLos.join(', '));
  }

  function validateEffects(label, effects) {
    if (!check(label + ': effects é array não-vazio', Array.isArray(effects) && effects.length > 0)) { return; }
    effects.forEach(function (ef, i) {
      var tag = label + ' efeito#' + i;
      if (!check(tag + ': tipo do vocabulário fechado', has(EFFECT_REQ, ef.type), String(ef.type))) { return; }
      EFFECT_REQ[ef.type].forEach(function (f) {
        check(tag + ' (' + ef.type + '): campo ' + f, has(ef, f));
      });
      if (ef.type === 'damage' || ef.type === 'poison' || ef.type === 'resist' || ef.type === 'chain') {
        check(tag + ': element válido', inList(ef.element, ELEMENTS), String(ef.element));
      }
      if (ef.type === 'buff') {
        check(tag + ': stat válido (nada de pm)', inList(ef.stat, BUFF_STATS), String(ef.stat));
      }
      if (ef.type === 'weatherShift') {
        check(tag + ': weather existe', has(W, ef.weather), String(ef.weather));
      }
      if (ef.type === 'summon') {
        check(tag + ': monsterId existe em DATA.monsters', has(MON, ef.monsterId), String(ef.monsterId));
      }
      if (ef.type === 'trap') {
        check(tag + ': trapId existe em DATA.monsterSpells', has(MS, ef.trapId), String(ef.trapId));
      }
      if (ef.type === 'cleanse') {
        check(tag + ': kinds é array não-vazio', Array.isArray(ef.kinds) && ef.kinds.length > 0);
      }
    });
  }

  keys(MS).forEach(function (id) {
    var s = MS[id];
    var L = 'feitiço ' + id;
    check(L + ': id bate com a chave', s.id === id);
    check(L + ': nome pt-BR', typeof s.name === 'string' && s.name.length > 0);
    check(L + ': element válido', inList(s.element, ELEMENTS), String(s.element));
    check(L + ': classId null (é de monstro)', s.classId === null);
    check(L + ': paCost numérico ≥ 0', typeof s.paCost === 'number' && s.paCost >= 0);
    check(L + ': cooldown numérico ≥ 0', typeof s.cooldown === 'number' && s.cooldown >= 0);
    check(L + ': castsPerTurn numérico ≥ 0', typeof s.castsPerTurn === 'number' && s.castsPerTurn >= 0);
    check(L + ': range completo',
      !!s.range && typeof s.range.min === 'number' && typeof s.range.max === 'number' &&
      s.range.max >= s.range.min && typeof s.range.line === 'boolean' && typeof s.range.los === 'boolean');
    // 19/09: alcance > 0 EXIGE linha de visão — a regra valia por disciplina de autoria (3.388/3.388) e nenhum
    // validador cobrava; um monstro novo com los:false e alcance 5 passaria a atirar através de paredes sem aviso.
    // A única exceção nomeada é o Julgamento do Mestre (gm.js), que nem mora aqui.
    check(L + ': alcance > 0 ⇒ los:true (exceção nomeada: gm-julgamento)',
      !s.range || !(s.range.max > 0) || s.range.los === true || id === 'gm-julgamento',
      s.range && ('alcance ' + s.range.min + '–' + s.range.max + ' com los ' + s.range.los));
    check(L + ': aoe.shape válido', !!s.aoe && inList(s.aoe.shape, SHAPES), s.aoe && String(s.aoe.shape));
    check(L + ': aoe.size numérico', !!s.aoe && typeof s.aoe.size === 'number');
    check(L + ': needsEmptyTile booleano', typeof s.needsEmptyTile === 'boolean');
    check(L + ': targetSide válido', inList(s.targetSide, SIDES), String(s.targetSide));
    check(L + ': description', typeof s.description === 'string' && s.description.length > 10);
    check(L + ': fxKey', typeof s.fxKey === 'string' && s.fxKey.length > 0);
    validateEffects(L, s.effects);
  });

  // =========================================================================
  // 4. MONSTROS
  // =========================================================================
  var monIds = keys(MON);
  var bosses = monIds.filter(function (id) { return MON[id].boss; });
  var commons = monIds.filter(function (id) { return !MON[id].boss; });
  check('bestiário: ≥ 40 monstros comuns', commons.length >= 40, commons.length + ' comuns');
  check('bestiário: exatamente 6 chefes', bosses.length === 6, bosses.length + ' — ' + bosses.join(', '));

  // A roda tem de ser um CICLO FECHADO sobre os quatro elementos: se não for,
  // algum elemento fica sem nada que o vença (invencível) ou sem nada para
  // vencer (inútil), e a regra inteira desanda.
  (function () {
    var quatro = ['fogo', 'agua', 'terra', 'ar'];
    check('DATA.beats existe', !!D.beats);
    check('DATA.beatenBy existe', !!D.beatenBy);
    if (!D.beats || !D.beatenBy) return;
    var visto = {}, at = 'fogo', passos = 0;
    while (!visto[at] && passos <= 4) { visto[at] = 1; at = D.beats[at]; passos++; }
    check('a roda é um ciclo que passa pelos quatro elementos',
      passos === 4 && at === 'fogo' && quatro.every(function (e) { return visto[e]; }),
      'voltou a ' + at + ' em ' + passos + ' passos');
    check('beatenBy é o inverso exato de beats',
      quatro.every(function (e) { return D.beatenBy[D.beats[e]] === e; }));
    check('nenhum elemento vence a si mesmo',
      quatro.every(function (e) { return D.beats[e] !== e; }));
    check('neutro fica fora da roda', !D.beats.neutro && !D.beatenBy.neutro);
  })();

  monIds.forEach(function (id) {
    var m = MON[id];
    var L = 'monstro ' + id;
    check(L + ': id bate com a chave', m.id === id);
    check(L + ': nome pt-BR', typeof m.name === 'string' && m.name.length > 0);
    check(L + ': family', typeof m.family === 'string' && m.family.length > 0);
    check(L + ': element válido', inList(m.element, ELEMENTS), String(m.element));
    check(L + ': description', typeof m.description === 'string' && m.description.length > 20);
    check(L + ': xp numérico ≥ 0', typeof m.xp === 'number' && m.xp >= 0);
    check(L + ': ai válida', inList(m.ai, AIS), String(m.ai));
    check(L + ': boss booleano', typeof m.boss === 'boolean');
    check(L + ': summonOnly booleano', typeof m.summonOnly === 'boolean');

    var st = m.stats;
    if (check(L + ': stats existe', !!st)) {
      ['hp', 'pa', 'pp', 'initiative', 'power', 'dodge', 'lock'].forEach(function (f) {
        check(L + ': stats.' + f + ' numérico', typeof st[f] === 'number');
      });
      check(L + ': stats.hp > 0', st.hp > 0);
      check(L + ': stats.pa ≥ 1', st.pa >= 1);
      check(L + ': stats.pp ≥ 0', st.pp >= 0);
      check(L + ': sem campo pm nos stats', !has(st, 'pm'));
      // A RODA — fogo > ar > terra > agua > fogo (DATA.beats, em elements.js).
      //
      // Um bicho resiste ao elemento que o SEU elemento vence, e é fraco contra
      // quem o vence. O próprio elemento passa NORMAL: quem é de água não se
      // defende de água, se defende de fogo — que é a água apagando o fogo.
      //
      // Até a v3 a convenção era a INVERSA: 58 dos 60 monstros resistiam ao
      // próprio elemento e 44 eram fracos ao rival. A inversão foi pedida de
      // propósito, e esta checagem existe porque é fácil demais escrever "sou
      // de fogo, resisto a fogo" no automático e reintroduzir a convenção velha
      // num monstro novo sem ninguém perceber.
      if (st.resists && D.beats && D.beats[m.element]) {
        var venceEl = D.beats[m.element], venceMe = D.beatenBy[m.element];
        check(L + ': resiste ao que seu elemento vence (' + venceEl + ')',
          st.resists[venceEl] > 0, m.element + '→' + venceEl + ' = ' + st.resists[venceEl]);
        check(L + ': fraco contra quem o vence (' + venceMe + ')',
          st.resists[venceMe] < 0, venceMe + '→' + m.element + ' = ' + st.resists[venceMe]);
        check(L + ': NÃO resiste ao próprio elemento (' + m.element + ')',
          !(st.resists[m.element] > 0), m.element + ' = ' + st.resists[m.element]);
      }
      check(L + ': resists com as 5 chaves numéricas',
        !!st.resists && ELEMENTS.every(function (e) { return typeof st.resists[e] === 'number'; }),
        JSON.stringify(st.resists));
      check(L + ': resists sem elemento fora do vocabulário',
        !!st.resists && keys(st.resists).every(function (k) { return inList(k, ELEMENTS); }),
        keys(st.resists || {}).join(','));
    }

    if (check(L + ': spells é array não-vazio', Array.isArray(m.spells) && m.spells.length > 0)) {
      m.spells.forEach(function (sid) {
        check(L + ': feitiço ' + sid + ' existe em DATA.monsterSpells', has(MS, sid));
      });
    }

    if (check(L + ': traits é array', Array.isArray(m.traits))) {
      m.traits.forEach(function (t, i) {
        var tag = L + ' traço#' + i;
        if (!check(tag + ': tipo do vocabulário fechado', has(TRAIT_REQ, t.type), String(t.type))) { return; }
        TRAIT_REQ[t.type].forEach(function (f) { check(tag + ' (' + t.type + '): campo ' + f, has(t, f)); });
        if (t.type === 'split') {
          check(tag + ': monsterId ' + t.monsterId + ' existe', has(MON, t.monsterId));
        }
        if (t.type === 'rastroBrasa') {
          check(tag + ': o feitiço do rastro ' + t.spellId + ' existe em DATA.monsterSpells', has(MS, t.spellId));
        }
        if (t.type === 'explodeOnDeath') {
          check(tag + ': element válido', inList(t.element, ELEMENTS), String(t.element));
        }
      });
    }

    if (m.boss) {
      check(L + ' (chefe): hp entre 300 e 600', st && st.hp >= 300 && st.hp <= 600, st && String(st.hp));
      check(L + ' (chefe): pa entre 7 e 10', st && st.pa >= 7 && st.pa <= 10, st && String(st.pa));
    }
    if (m.dungeonId !== null && m.dungeonId !== undefined) {
      check(L + ': dungeonId conhecido', inList(m.dungeonId, DUNGEON_IDS) || inList(m.dungeonId, ESPECIAIS_IDS), String(m.dungeonId));
    }

    // ---- PEDRAS DE FORJA (adendo v2.1) ------------------------------------
    if (m.summonOnly) {
      check(L + ' (invocação): stoneDrop null — invocação não vira minério',
        m.stoneDrop === null, JSON.stringify(m.stoneDrop));
    } else {
      var sd = m.stoneDrop;
      if (check(L + ': tem stoneDrop (objeto)', !!sd && typeof sd === 'object', String(sd))) {
        check(L + ' stoneDrop: chance entre 0 e 1',
          typeof sd.chance === 'number' && sd.chance > 0 && sd.chance <= 1, String(sd.chance));
        check(L + ' stoneDrop: min inteiro ≥ 1',
          typeof sd.min === 'number' && sd.min >= 1 && sd.min === Math.floor(sd.min), String(sd.min));
        check(L + ' stoneDrop: max inteiro ≥ min',
          typeof sd.max === 'number' && sd.max >= sd.min && sd.max === Math.floor(sd.max),
          sd.min + '..' + sd.max);
        check(L + ' stoneDrop: sem campo de elemento (sai do element do monstro)',
          !has(sd, 'element') && !has(sd, 'stoneId'));
        // a pedra derrubada é a do PRÓPRIO elemento: precisa existir em DATA.stones
        if (D.stones) {
          var sid = keys(D.stones).filter(function (s) { return D.stones[s].element === m.element; })[0];
          check(L + ' stoneDrop: existe pedra de ' + m.element + ' em DATA.stones (Criativo Fusão)', !!sid, sid || '—');
        }
        if (m.boss) {
          check(L + ' (chefe) stoneDrop: cai sempre (chance 1)', sd.chance === 1, String(sd.chance));
          check(L + ' (chefe) stoneDrop: mínimo generoso (≥ 6)', sd.min >= 6, String(sd.min));
        } else {
          check(L + ' stoneDrop: comum não derruba mais que um chefe raso (max ≤ 6)', sd.max <= 6, String(sd.max));
        }
      }
    }
  });

  // --- as 5 pedras existem, uma por elemento, e todas têm de onde cair -------
  (function () {
    if (!check('DATA.stones existe (items.js, Criativo Fusão)', !!D.stones)) { return; }
    var byEl = {};
    keys(D.stones).forEach(function (s) { byEl[D.stones[s].element] = s; });
    // 5 de elemento + a ÂNCORA DE FORJA (element 'forja', segura o nível na
    // batida falhada — rodada da forja de risco). A régua velha dizia 5 e
    // reprovava uma pedra legítima.
    check('DATA.stones tem 6 pedras (5 de elemento + a Âncora)', keys(D.stones).length === 6, keys(D.stones).length + '');
    ELEMENTS.forEach(function (e) {
      check('DATA.stones: existe pedra de ' + e, !!byEl[e]);
      var sources = monIds.filter(function (i) {
        return MON[i].element === e && !MON[i].summonOnly && MON[i].stoneDrop;
      });
      check('pedra de ' + e + ': tem ≥ 2 monstros que a derrubam', sources.length >= 2, sources.length + ' fontes');
      var bossSrc = sources.filter(function (i) { return MON[i].boss; });
      check('pedra de ' + e + ': tem ≥ 1 CHEFE que a derruba (farm confiável)', bossSrc.length >= 1, bossSrc.join(', '));
    });
  })();

  // chefes com hp crescente por ordem de calabouço
  // (verificado depois de ler DATA.dungeons, mais abaixo)

  // --- as 7 invocações exigidas pelo Criativo Classes ----------------------
  REQUIRED_SUMMONS.forEach(function (id) {
    if (check('invocação obrigatória ' + id + ' existe em DATA.monsters', has(MON, id))) {
      check('invocação ' + id + ': summonOnly = true', MON[id].summonOnly === true);
      check('invocação ' + id + ': xp 0 (invocação do jogador não dá XP)', MON[id].xp === 0, String(MON[id].xp));
    }
  });

  // --- todo summon referenciado por spells.js (Classes) precisa existir ----
  if (D.spells) {
    var missingFromClasses = [];
    keys(D.spells).forEach(function (sid) {
      var eff = D.spells[sid].effects || [];
      eff.forEach(function (ef) {
        if (ef.type === 'summon' && !has(MON, ef.monsterId)) { missingFromClasses.push(sid + '→' + ef.monsterId); }
      });
    });
    check('todo summon de DATA.spells (Classes) existe em DATA.monsters',
      missingFromClasses.length === 0, missingFromClasses.join(', '));
  }

  // =========================================================================
  // 5. CALABOUÇOS
  // =========================================================================
  var DG = D.dungeons || [];
  check('DATA.dungeons tem 6 calabouços', DG.length === 6, DG.length + '');
  check('ids dos calabouços exatos e na ordem de dificuldade',
    DG.map(function (d) { return d.id; }).join(',') === DUNGEON_IDS.join(','),
    DG.map(function (d) { return d.id; }).join(','));

  var seenOrders = {};
  DG.forEach(function (d, di) {
    var L = 'calabouço ' + d.id;
    check(L + ': name', typeof d.name === 'string' && d.name.length > 0);
    check(L + ': theme', typeof d.theme === 'string' && d.theme.length > 0);
    check(L + ': description saborosa', typeof d.description === 'string' && d.description.length >= 60);
    check(L + ': order = ' + (di + 1), d.order === di + 1, String(d.order));
    check(L + ': order único', !seenOrders[d.order]); seenOrders[d.order] = true;
    check(L + ': difficulty numérico crescente', d.difficulty === di + 1, String(d.difficulty));
    check(L + ': palette em hex',
      !!d.palette && ['primary', 'secondary', 'accent', 'floor1', 'floor2', 'wall'].every(function (k) { return HEX.test(d.palette[k]); }),
      JSON.stringify(d.palette));
    check(L + ': defaultWeather existe em DATA.weathers', has(W, d.defaultWeather), String(d.defaultWeather));
    check(L + ': weatherShiftEveryRounds numérico ≥ 0',
      typeof d.weatherShiftEveryRounds === 'number' && d.weatherShiftEveryRounds >= 0);
    check(L + ': tileEventRate entre 0 e 1',
      typeof d.tileEventRate === 'number' && d.tileEventRate > 0 && d.tileEventRate <= 1, String(d.tileEventRate));
    check(L + ': recommendedLevel inteiro entre 1 e 30 (adendo v2.3)',
      typeof d.recommendedLevel === 'number' && d.recommendedLevel >= 1 &&
      d.recommendedLevel <= 30 && d.recommendedLevel === Math.floor(d.recommendedLevel),
      String(d.recommendedLevel));
    check(L + ': theme existe em DATA.scenery', has(D.scenery || {}, d.theme), String(d.theme));

    // ---- salas ----
    if (!check(L + ': 3 salas (2 + chefe)', Array.isArray(d.rooms) && d.rooms.length === 3, d.rooms && d.rooms.length)) { return; }
    d.rooms.forEach(function (r, ri) {
      var RL = L + ' sala ' + ri + ' (' + r.name + ')';
      check(RL + ': name', typeof r.name === 'string' && r.name.length > 0);
      check(RL + ': weather existe em DATA.weathers', has(W, r.weather), String(r.weather));
      check(RL + ': sceneryTheme existe em DATA.scenery', has(D.scenery || {}, r.sceneryTheme), String(r.sceneryTheme));

      var lay = r.layout;
      if (!check(RL + ': layout é array de strings', Array.isArray(lay) && lay.length > 0)) { return; }
      var wdt = lay[0].length, hgt = lay.length;
      check(RL + ': todas as linhas do mesmo comprimento',
        lay.every(function (row) { return typeof row === 'string' && row.length === wdt; }),
        'larguras: ' + lay.map(function (row) { return row.length; }).join(','));
      // faixa ampliada a pedido do usuário. Primeiro "achei os mapas pequenos"
      // (13×11–17×15 → 17×15–23×19), depois "é pequena demais" (→ 21×17–27×23).
      check(RL + ': largura entre 21 e 27 (é ' + wdt + ')', wdt >= 21 && wdt <= 27);
      check(RL + ': altura entre 17 e 23 (é ' + hgt + ')', hgt >= 17 && hgt <= 23);

      var counts = {};
      lay.forEach(function (row) {
        for (var i = 0; i < row.length; i++) { counts[row[i]] = (counts[row[i]] || 0) + 1; }
      });
      // adendo v2.1: o grupo caiu para 1–2 heróis, então ≥ 2 spawns bastam
      // (os layouts trazem 4; sobra é ignorada pela engine).
      check(RL + ': ≥ 2 spawns de herói (P) — grupo de 1 a 2', (counts.P || 0) >= 2, 'P=' + (counts.P || 0));
      check(RL + ': usa obstáculo BAIXO "=" (novidade tática)', (counts['='] || 0) >= 6, '= ' + (counts['='] || 0));
      check(RL + ': só caracteres válidos',
        keys(counts).every(function (c) { return '.,#=~P'.indexOf(c) !== -1 || /^[a-z]$/.test(c); }),
        keys(counts).join(''));

      var letters = keys(counts).filter(function (c) { return /^[a-z]$/.test(c); }).sort();
      var mapped = keys(r.monsters || {}).sort();
      check(RL + ': todas as letras do layout estão mapeadas em monsters',
        letters.every(function (c) { return mapped.indexOf(c) !== -1; }),
        'layout=[' + letters + '] mapeadas=[' + mapped + ']');
      check(RL + ': todas as letras mapeadas aparecem no layout',
        mapped.every(function (c) { return letters.indexOf(c) !== -1; }),
        'layout=[' + letters + '] mapeadas=[' + mapped + ']');
      mapped.forEach(function (c) {
        check(RL + ': monsterId "' + r.monsters[c] + '" (letra ' + c + ') existe', has(MON, r.monsters[c]));
        if (has(MON, r.monsters[c])) {
          check(RL + ': "' + r.monsters[c] + '" não é summonOnly', MON[r.monsters[c]].summonOnly === false);
        }
      });

      // ---- DENSIDADE: mapa grande vazio é pior que mapa pequeno -------------
      // Conta só o INTERIOR (fora o anel de parede): é o que ocupa o campo de
      // batalha. O anel sozinho já seria 18–24% do total e mascararia tudo.
      (function () {
        var inner = 0, obst = 0;
        for (var y = 1; y < hgt - 1; y++) {
          for (var x = 1; x < wdt - 1; x++) {
            inner++;
            if (lay[y][x] === '#' || lay[y][x] === '=') { obst++; }
          }
        }
        var dens = obst / inner;
        check(RL + ': densidade de obstáculo entre 12% e 30% do interior',
          dens >= 0.12 && dens <= 0.30, (Math.round(dens * 1000) / 10) + '% (' + obst + '/' + inner + ')');
        check(RL + ': mistura obstáculo ALTO e BAIXO (não é só parede)',
          (counts['#'] || 0) - (2 * wdt + 2 * hgt - 4) > 0 && (counts['='] || 0) > 0,
          '# interno=' + ((counts['#'] || 0) - (2 * wdt + 2 * hgt - 4)) + ' = ' + (counts['='] || 0));
      })();

      // ---- RITMO: o primeiro grupo tem de estar a 4–7 células ---------------
      // Com 3 a 4 PP, um mapa de 23×19 viraria duas rodadas de caminhada se os
      // spawns ficassem em cantos opostos. Mede a distância (Manhattan, que é
      // como a unidade anda) de cada 'P' até o monstro mais próximo.
      (function () {
        var Ps = [], Ms = [];
        for (var y = 0; y < hgt; y++) {
          for (var x = 0; x < wdt; x++) {
            var ch = lay[y][x];
            if (ch === 'P') { Ps.push([y, x]); }
            else if (/^[a-z]$/.test(ch)) { Ms.push([y, x]); }
          }
        }
        if (!Ps.length || !Ms.length) { return; }
        var sum = 0, worst = 0;
        Ps.forEach(function (p) {
          var best = Infinity;
          Ms.forEach(function (mm) { var d = Math.abs(p[0] - mm[0]) + Math.abs(p[1] - mm[1]); if (d < best) { best = d; } });
          sum += best; if (best > worst) { worst = best; }
        });
        var avg = sum / Ps.length;
        check(RL + ': distância média herói→monstro mais próximo entre 4 e 7',
          avg >= 4 && avg <= 7, 'média ' + (Math.round(avg * 100) / 100) + ' · pior ' + worst);
        check(RL + ': nenhum herói começa a mais de 10 células do primeiro monstro',
          worst <= 10, 'pior ' + worst);
        // 2 ou 3 grupos: os monstros não podem estar todos colados num bloco só
        var far = 0;
        Ms.forEach(function (mm) {
          var near = Ms.some(function (o) {
            return o !== mm && Math.abs(o[0] - mm[0]) + Math.abs(o[1] - mm[1]) <= 3;
          });
          if (!near) { far++; }
        });
        check(RL + ': monstros distribuídos, não empilhados num bloco único',
          Ms.length >= 4, Ms.length + ' spawns');
      })();

      var roomBosses = mapped.filter(function (c) { return has(MON, r.monsters[c]) && MON[r.monsters[c]].boss; });
      if (ri === 2) {
        check(RL + ': sala 3 tem exatamente 1 chefe', roomBosses.length === 1, roomBosses.join(','));
      } else {
        check(RL + ': salas 1–2 sem chefe', roomBosses.length === 0, roomBosses.join(','));
      }
    });

    // ---- tamanho das salas cresce com a profundidade, chefe na maior ------
    (function () {
      if (!Array.isArray(d.rooms) || d.rooms.length !== 3) { return; }
      var areas = d.rooms.map(function (r) { return r.layout[0].length * r.layout.length; });
      check(L + ': a sala do chefe é a maior do calabouço (arena, não corredor)',
        areas[2] >= areas[0] && areas[2] >= areas[1], areas.join(' · '));
    })();

    // ---- lootTable ----
    if (check(L + ': lootTable é array não-vazio', Array.isArray(d.lootTable) && d.lootTable.length > 0)) {
      d.lootTable.forEach(function (e) {
        var tag = L + ' loot ' + e.itemId;
        check(tag + ': weight > 0', typeof e.weight === 'number' && e.weight > 0);
        check(tag + ': minRoom entre 0 e 2', typeof e.minRoom === 'number' && e.minRoom >= 0 && e.minRoom <= 2);
        check(tag + ': prefixo do item bate com o calabouço',
          typeof e.itemId === 'string' && e.itemId.indexOf(ITEM_PREFIX[d.id]) === 0,
          'esperado ' + ITEM_PREFIX[d.id]);
        if (D.items) {
          check(tag + ': item existe em DATA.items (Criativo Fusão)', has(D.items, e.itemId));
          if (has(D.items, e.itemId)) {
            check(tag + ': item pertence a este calabouço', D.items[e.itemId].dungeonId === d.id,
              String(D.items[e.itemId].dungeonId));
          }
        }
      });
      var epics = d.lootTable.filter(function (e) { return D.items && has(D.items, e.itemId) && D.items[e.itemId].rarity === 'epico'; });
      check(L + ': todo item épico só cai na sala do chefe (minRoom 2)',
        epics.every(function (e) { return e.minRoom === 2; }),
        epics.map(function (e) { return e.itemId + '@' + e.minRoom; }).join(', '));
    }
    if (D.items) {
      var all = keys(D.items).filter(function (i) { return D.items[i].dungeonId === d.id; });
      var listed = d.lootTable.map(function (e) { return e.itemId; });
      check(L + ': lootTable cobre todos os itens do calabouço',
        all.every(function (i) { return listed.indexOf(i) !== -1; }),
        'faltando: ' + all.filter(function (i) { return listed.indexOf(i) === -1; }).join(', '));
    }

    // ---- cardDrops ----
    if (check(L + ': cardDrops é array não-vazio', Array.isArray(d.cardDrops) && d.cardDrops.length > 0)) {
      d.cardDrops.forEach(function (c) {
        check(L + ' carta ' + c.classId + ': classId válido', inList(c.classId, CLASS_IDS), String(c.classId));
        check(L + ' carta ' + c.classId + ': weight > 0', typeof c.weight === 'number' && c.weight > 0);
        if (D.classes) {
          check(L + ' carta ' + c.classId + ': classe existe em DATA.classes', has(D.classes, c.classId));
        }
      });
    }
  });

  // chefes com vida crescente ao longo dos calabouços
  (function () {
    var hps = DG.map(function (d) {
      var r = d.rooms && d.rooms[2];
      if (!r) { return 0; }
      var bid = keys(r.monsters || {}).map(function (c) { return r.monsters[c]; })
        .filter(function (id) { return has(MON, id) && MON[id].boss; })[0];
      return bid ? MON[bid].stats.hp : 0;
    });
    var growing = true;
    for (var i = 1; i < hps.length; i++) { if (hps[i] <= hps[i - 1]) { growing = false; } }
    check('chefes com vida crescendo por calabouço', growing, hps.join(' → '));
  })();

  // --- CARTAS ACUMULATIVAS (adendo v2.1): nenhuma entrada INERTE ------------
  // Regras de DATA.cards (progression.js, Criativo Classes). Uma entrada de
  // `cardDrops` é INERTE — ocupa peso na tabela e nunca cai — se:
  //   · a classe não existe em DATA.classes/DATA.cards;
  //   · o `dropWeight` da classe é 0;
  //   · o `minDungeon` dela (ÍNDICE 0-based do calabouço mais raso) ainda não
  //     alcançou este calabouço, isto é `minDungeon > order - 1`.
  // Cartas repetidas nunca são lixo: o excedente ao `unlockCost` vira estrela,
  // então as classes iniciais também têm peso — só não desbloqueiam nada.
  (function () {
    var CARDS = D.cards;
    check('DATA.cards existe (progression.js, Criativo Classes)', !!CARDS);
    if (!CARDS) { return; }

    // esquema do adendo: custo acumulativo + trilha de estrelas
    CLASS_IDS.forEach(function (c) {
      if (!check('DATA.cards.' + c + ' existe', has(CARDS, c))) { return; }
      var card = CARDS[c];
      check('DATA.cards.' + c + ': unlockCost numérico ≥ 0',
        typeof card.unlockCost === 'number' && card.unlockCost >= 0, String(card.unlockCost));
      check('DATA.cards.' + c + ': dropWeight > 0 (nenhuma carta inútil)',
        typeof card.dropWeight === 'number' && card.dropWeight > 0, String(card.dropWeight));
      check('DATA.cards.' + c + ': minDungeon é índice válido (0..5)',
        typeof card.minDungeon === 'number' && card.minDungeon >= 0 && card.minDungeon <= 5,
        String(card.minDungeon));
      check('DATA.cards.' + c + ': starCosts com 5 degraus crescentes',
        Array.isArray(card.starCosts) && card.starCosts.length === 5 &&
        card.starCosts.every(function (v, i) { return typeof v === 'number' && (i === 0 || v > card.starCosts[i - 1]); }),
        JSON.stringify(card.starCosts));
    });
    // custos fixados pelo usuário no adendo 9-B
    var EXPECTED_COST = { sumo: 0, curandeiro: 0, invocador: 10, bruxo: 10, espadachim: 20, arqueiro: 25 };
    for (var cid in EXPECTED_COST) {
      if (!EXPECTED_COST.hasOwnProperty(cid)) { continue; }
      check('custo de desbloqueio de ' + cid + ' = ' + EXPECTED_COST[cid],
        has(CARDS, cid) && CARDS[cid].unlockCost === EXPECTED_COST[cid],
        has(CARDS, cid) ? String(CARDS[cid].unlockCost) : 'ausente');
    }
    check('exatamente 2 classes iniciais (unlockCost 0): sumo e curandeiro',
      CLASS_IDS.filter(function (c) { return has(CARDS, c) && CARDS[c].unlockCost === 0; }).sort().join(',') ===
      'curandeiro,sumo');

    // ---- nenhuma entrada inerte, calabouço a calabouço ----
    DG.forEach(function (d) {
      var obtainable = 0, unlockers = 0, seen = {};
      (d.cardDrops || []).forEach(function (c) {
        var tag = 'calabouço ' + d.id + ' carta ' + c.classId;
        check(tag + ': sem entrada duplicada', !seen[c.classId]); seen[c.classId] = true;
        if (!check(tag + ': existe em DATA.cards', has(CARDS, c.classId))) { return; }
        var card = CARDS[c.classId];
        var wOk = check(tag + ': dropWeight > 0 em DATA.cards', card.dropWeight > 0,
          'dropWeight=' + card.dropWeight);
        var mOk = check(tag + ': minDungeon (' + card.minDungeon + ') alcança este calabouço (order ' + d.order + ')',
          card.minDungeon <= d.order - 1);
        if (wOk && mOk) {
          obtainable++;
          if (card.unlockCost > 0) { unlockers++; }
        }
      });
      check('calabouço ' + d.id + ': o chefe tem ≥ 1 carta realmente obtenível', obtainable >= 1,
        obtainable + ' obteníveis');
      // do 2º calabouço em diante sempre existe carta que LIBERA alguma classe
      if (d.order >= 2) {
        check('calabouço ' + d.id + ': ≥ 1 carta de classe ainda trancada', unlockers >= 1, unlockers + '');
      }
      var sum = (d.cardDrops || []).reduce(function (a, c) { return a + (c.weight || 0); }, 0);
      check('calabouço ' + d.id + ': pesos de carta somam 100 (leem-se como %)', sum === 100, 'soma=' + sum);
    });

    // ---- escada: quanto mais cara a classe, mais fundo ela começa a cair ----
    var firstSeen = {};
    DG.forEach(function (d) {
      (d.cardDrops || []).forEach(function (c) {
        if (firstSeen[c.classId] === undefined) { firstSeen[c.classId] = d.order; }
      });
    });
    check('arqueiro (25 cartas, o mais caro) só a partir do 5º calabouço',
      firstSeen.arqueiro >= 5, 'estreia no ' + firstSeen.arqueiro);
    check('espadachim (20 cartas) só a partir do 4º calabouço',
      firstSeen.espadachim >= 4, 'estreia no ' + firstSeen.espadachim);
    check('invocador (10 cartas) colecionável cedo (até o 2º calabouço)',
      firstSeen.invocador <= 2, 'estreia no ' + firstSeen.invocador);
    check('bruxo (10 cartas) colecionável no meio (até o 3º calabouço)',
      firstSeen.bruxo <= 3, 'estreia no ' + firstSeen.bruxo);

    // O troféu da coleção só fica mais provável quanto mais fundo se desce.
    (function () {
      var series = DG.map(function (d) {
        var e = (d.cardDrops || []).filter(function (x) { return x.classId === 'arqueiro'; })[0];
        return e ? e.weight : 0;
      }).filter(function (w) { return w > 0; });
      check('peso do arqueiro (o troféu) só cresce nos calabouços fundos',
        series.every(function (w, i) { return i === 0 || w >= series[i - 1]; }), series.join(' → '));
    })();
    // Nos calabouços fundos, a carta MAIS provável é sempre de classe cara
    // (unlockCost ≥ 20): é o que justifica repetir a descida.
    DG.forEach(function (d) {
      if (d.order < 4) { return; }
      var top = 0;
      (d.cardDrops || []).forEach(function (c) { if (c.weight > top) { top = c.weight; } });
      var leaders = (d.cardDrops || []).filter(function (c) { return c.weight === top; });
      check('calabouço ' + d.id + ': a carta mais provável é de classe cara (custo ≥ 20)',
        leaders.every(function (c) { return has(CARDS, c.classId) && CARDS[c.classId].unlockCost >= 20; }),
        leaders.map(function (c) { return c.classId + '=' + c.weight; }).join(', '));
    });
    // nenhuma entrada simbólica: peso mínimo de 5 em qualquer calabouço
    DG.forEach(function (d) {
      (d.cardDrops || []).forEach(function (c) {
        check('calabouço ' + d.id + ' carta ' + c.classId + ': peso ≥ 5 (nada de entrada simbólica)',
          c.weight >= 5, String(c.weight));
      });
    });
    // o último calabouço espelha exatamente os dropWeight de DATA.cards
    (function () {
      var last = DG[DG.length - 1] || {};
      var ok = (last.cardDrops || []).every(function (c) { return CARDS[c.classId].dropWeight === c.weight; }) &&
               (last.cardDrops || []).length === CLASS_IDS.length;
      check('último calabouço: cardDrops espelha os dropWeight de DATA.cards (todas as 6 classes)', ok,
        (last.cardDrops || []).map(function (c) { return c.classId + '=' + c.weight; }).join(' '));
    })();

    // toda classe sorteável precisa cair em algum lugar
    var listed = {};
    DG.forEach(function (d) { (d.cardDrops || []).forEach(function (c) { listed[c.classId] = true; }); });
    var droppable = CLASS_IDS.filter(function (c) { return has(CARDS, c) && CARDS[c].dropWeight > 0; });
    check('toda classe com dropWeight > 0 tem carta em algum calabouço',
      droppable.every(function (c) { return listed[c]; }),
      droppable.filter(function (c) { return !listed[c]; }).join(', '));
    check('nenhuma classe fora do elenco aparece em cardDrops',
      keys(listed).every(function (c) { return inList(c, CLASS_IDS); }), keys(listed).join(', '));

    // ---- DATA.stars: a trilha de 5 estrelas do adendo ----
    if (check('DATA.stars existe (progression.js)', !!D.stars)) {
      check('DATA.stars.max = 5', D.stars.max === 5, String(D.stars.max));
      check('DATA.stars: 5 degraus de bônus', keys(D.stars.bonuses || {}).length === 5);
      keys(D.stars.bonuses || {}).forEach(function (k) {
        check('estrela ' + k + ': só bônus de stat conhecido',
          keys(D.stars.bonuses[k]).every(function (s) { return inList(s, BUFF_STATS) || s === 'hp' || s === 'resists'; }),
          keys(D.stars.bonuses[k]).join(','));
      });
    }
  })();

  // =========================================================================
  // 5-B. PROGRESSÃO (adendo v2.3) — subir de nível custa, e o fundo paga
  // =========================================================================
  // Mede UMA descida completa (as 3 salas, contando cada spawn do layout) e
  // cruza com DATA.leveling.xpTable, do Criativo Classes. As duas tabelas são
  // de donos diferentes: esta seção existe justamente para acusar divergência
  // se uma andar sem a outra.
  var descent = null;
  (function () {
    var EXPECTED_REC = [3, 7, 11, 16, 22, 28];

    function roomStats(d) {
      var xp = 0, spawns = 0, hp = 0, pow = 0, commons = 0, bossHp = 0;
      (d.rooms || []).forEach(function (r) {
        keys(r.monsters || {}).forEach(function (c) {
          var m = MON[r.monsters[c]];
          if (!m) { return; }
          var n = 0;
          r.layout.forEach(function (row) { for (var i = 0; i < row.length; i++) { if (row[i] === c) { n++; } } });
          xp += n * m.xp; spawns += n;
          if (m.boss) { bossHp = m.stats.hp; } else { hp += n * m.stats.hp; commons += n; pow += n * m.stats.power; }
        });
      });
      return { xp: xp, spawns: spawns, avgHp: commons ? Math.round(hp / commons) : 0,
               avgPower: commons ? Math.round(pow / commons) : 0, bossHp: bossHp };
    }
    descent = DG.map(roomStats);

    // ---- recommendedLevel: exatamente a escada fixada no adendo ----
    DG.forEach(function (d, i) {
      check('calabouço ' + d.id + ': recommendedLevel = ' + EXPECTED_REC[i],
        d.recommendedLevel === EXPECTED_REC[i], String(d.recommendedLevel));
    });
    check('recommendedLevel estritamente crescente pelos 6 calabouços',
      DG.every(function (d, i) { return i === 0 || d.recommendedLevel > DG[i - 1].recommendedLevel; }),
      DG.map(function (d) { return d.recommendedLevel; }).join(' → '));

    // ---- XP: cresce de forma MARCANTE a cada calabouço ----
    check('XP por descida estritamente crescente',
      descent.every(function (s, i) { return i === 0 || s.xp > descent[i - 1].xp; }),
      descent.map(function (s) { return s.xp; }).join(' → '));
    descent.forEach(function (s, i) {
      if (i === 0) { return; }
      var ratio = s.xp / descent[i - 1].xp;
      check('XP do calabouço ' + DG[i].id + ' é ao menos 1,15× a do anterior',
        ratio >= 1.15, 'razão ' + (Math.round(ratio * 100) / 100) + '×');
    });

    // ---- XP × xpTable: ~1 nível cedo, ~1/3 de nível do 25 em diante ----
    var LV = D.leveling;
    if (check('DATA.leveling.xpTable existe (progression.js, Criativo Classes)',
      !!LV && Array.isArray(LV.xpTable) && LV.xpTable.length === 30)) {
      // degrau para SAIR do nível n (1-based): xpTable[n] - xpTable[n-1]
      var step = function (n) { return LV.xpTable[n] - LV.xpTable[n - 1]; };
      check('xpTable: degraus sempre crescentes (subir sempre custa mais)',
        LV.xpTable.every(function (v, i) { return i < 2 || step(i) > step(i - 1); }));

      // ---- OS DOIS CENÁRIOS DE GRUPO (adendo v2.1 + game.js) --------------
      // `game.js` faz `xpGanho = floor(xpTotal / partySize)`: quem joga SOLO
      // leva a descida inteira e a DUPLA parte ao meio. Medir só a dupla foi
      // a lacuna que deixou o solo render 1,89 nível na Estufa — então as
      // duas contas são checadas, e o SOLO é o que tem de caber na faixa,
      // porque é o teto.
      var PARTY = [{ size: 1, nome: 'SOLO' }, { size: 2, nome: 'DUPLA' }];
      var fracBy = {};
      PARTY.forEach(function (p) {
        fracBy[p.size] = DG.map(function (d, i) {
          return Math.floor(descent[i].xp / p.size) / step(d.recommendedLevel);
        });
      });
      var frac = fracBy[1];   // solo = caso de referência

      PARTY.forEach(function (p) {
        var f = fracBy[p.size];
        var linha = f.map(function (v) { return Math.round(v * 100) / 100; }).join(' → ');
        check(p.nome + ': a fração de nível por descida NUNCA cresce com a profundidade ' +
              '(a XP sobe, a exigência sobe mais)',
          f.every(function (v, i) { return i === 0 || v <= f[i - 1] + 0.001; }), linha);
        check(p.nome + ': nenhum calabouço rende mais de 1,4 nível por descida ' +
              '(nada de upar de graça)',
          f.every(function (v) { return v <= 1.4; }), linha);
        check(p.nome + ': nenhum calabouço rende tão pouco que vire moagem (≥ 0,10 de nível)',
          f.every(function (v) { return v >= 0.10; }), linha);
      });

      check('SOLO na Estufa (nível 3): uma descida rende ~1 nível (entre 0,7 e 1,4)',
        frac[0] >= 0.7 && frac[0] <= 1.4, 'rende ' + (Math.round(frac[0] * 100) / 100) + ' nível');
      check('SOLO na Mina (nível 22): uma descida rende cerca de 1/3 de nível (entre 0,25 e 0,55)',
        frac[4] >= 0.25 && frac[4] <= 0.55, 'rende ' + (Math.round(frac[4] * 100) / 100) + ' nível');
      check('SOLO no Coração (nível 28): uma descida rende cerca de 1/3 de nível (entre 0,25 e 0,55)',
        frac[5] >= 0.25 && frac[5] <= 0.55, 'rende ' + (Math.round(frac[5] * 100) / 100) + ' nível');

      // a dupla recebe metade por herói — é a regra do contrato, não um bug,
      // mas precisa ser metade DE FATO (e não, por exemplo, a mesma coisa).
      DG.forEach(function (d, i) {
        var solo = Math.floor(descent[i].xp), duo = Math.floor(descent[i].xp / 2);
        check('calabouço ' + d.id + ': a dupla recebe metade da XP do solo (por herói)',
          Math.abs(duo - solo / 2) <= 0.5, 'solo ' + solo + ' · dupla ' + duo);
      });
      check('DUPLA: a Estufa ainda entrega pelo menos meio nível por descida',
        fracBy[2][0] >= 0.35, 'rende ' + (Math.round(fracBy[2][0] * 100) / 100) + ' nível');

      // A XP absoluta não pode crescer mais do que a xpTable permite: se a
      // fração de nível tem de CAIR com a profundidade, o crescimento máximo
      // da XP é a razão entre os degraus dos níveis recomendados. Esta
      // checagem cobra que a calibragem use quase todo esse teto — se sobrar
      // folga, é XP jogada fora; se estourar, a fração subiu.
      DG.forEach(function (d, i) {
        if (i === 0) { return; }
        var stepRatio = step(d.recommendedLevel) / step(DG[i - 1].recommendedLevel);
        var xpRatio = descent[i].xp / descent[i - 1].xp;
        check('calabouço ' + d.id + ': XP cresce quase o máximo que a xpTable permite',
          xpRatio >= stepRatio * 0.72 && xpRatio <= stepRatio,
          'XP ×' + (Math.round(xpRatio * 100) / 100) + ' · teto da xpTable ×' + (Math.round(stepRatio * 100) / 100));
      });

      // ---- O QUE FAZ A PROFUNDIDADE PAGAR: o xpFalloff do adendo v2.3 ------
      // A razão bruta entre o 1º e o 6º calabouço é modesta (a xpTable limita).
      // O que torna "descer mais fundo o único caminho eficiente" é o falloff:
      // moer conteúdo raso com o herói graúdo rende uma fração do que rendia.
      if (check('DATA.leveling.xpFalloff existe (adendo v2.3)', !!LV.xpFalloff)) {
        var F = LV.xpFalloff;
        check('xpFalloff: graceLevels ≥ 0', F.graceLevels >= 0, String(F.graceLevels));
        check('xpFalloff: factorPerLevel entre 0 e 1',
          F.factorPerLevel > 0 && F.factorPerLevel < 1, String(F.factorPerLevel));
        check('xpFalloff: floor entre 0 e 1', F.floor > 0 && F.floor < 1, String(F.floor));

        var mult = function (level, rec) {
          var over = level - rec - F.graceLevels;
          if (over <= 0) { return 1; }
          return Math.max(F.floor, Math.pow(F.factorPerLevel, over));
        };
        // no nível recomendado de cada calabouço, ele rende cheio
        DG.forEach(function (d, i) {
          check('calabouço ' + d.id + ': rende XP cheia no nível recomendado',
            mult(d.recommendedLevel, d.recommendedLevel) === 1);
        });
        // com o herói no nível 22, descer fundo tem de pagar muito mais
        var effAt22 = DG.map(function (d, i) { return descent[i].xp * mult(22, d.recommendedLevel); });
        check('no nível 22, a Mina rende ao menos 10× o que render moer a Estufa',
          effAt22[4] >= effAt22[0] * 10,
          'Estufa ' + Math.round(effAt22[0]) + ' XP · Mina ' + Math.round(effAt22[4]) + ' XP');
        check('no nível 22, a XP efetiva cresce a cada calabouço (descer sempre compensa)',
          effAt22.every(function (v, i) { return i === 0 || v > effAt22[i - 1]; }),
          effAt22.map(function (v) { return Math.round(v); }).join(' → '));
        check('moer o 1º calabouço no nível 28 cai ao piso do falloff (mas nunca a zero)',
          Math.abs(mult(28, DG[0].recommendedLevel) - F.floor) < 1e-9 && F.floor > 0,
          '×' + mult(28, DG[0].recommendedLevel));
      }
    }

    // ---- DIFICULDADE: o fundo é mesmo mais duro ----
    check('vida média dos comuns cresce a cada calabouço',
      descent.every(function (s, i) { return i === 0 || s.avgHp > descent[i - 1].avgHp; }),
      descent.map(function (s) { return s.avgHp; }).join(' → '));
    check('poder dos comuns não decresce e chega a ≥ 100 no último calabouço',
      descent.every(function (s, i) { return i === 0 || s.avgPower >= descent[i - 1].avgPower; }) &&
      descent[5].avgPower >= 100,
      descent.map(function (s) { return s.avgPower; }).join(' → '));
    check('vida do chefe cresce a cada calabouço e respeita o teto de 600',
      descent.every(function (s, i) { return (i === 0 || s.bossHp > descent[i - 1].bossHp) && s.bossHp <= 600; }),
      descent.map(function (s) { return s.bossHp; }).join(' → '));
    check('calabouços fundos (4–6) têm comuns mais duros que os rasos (1–3)',
      descent[3].avgHp > descent[2].avgHp && descent[4].avgHp > descent[3].avgHp &&
      descent[5].avgHp > descent[4].avgHp);
    check('nº de spawns por descida não diminui com a profundidade',
      descent.every(function (s, i) { return i === 0 || s.spawns >= descent[i - 1].spawns - 1; }),
      descent.map(function (s) { return s.spawns; }).join(' → '));
    // as invocações do jogador NÃO podem ter sido escaladas por engano
    REQUIRED_SUMMONS.forEach(function (id) {
      if (!has(MON, id)) { return; }
      check('invocação ' + id + ': poder 0 (não leva escala de profundidade)',
        MON[id].stats.power === 0, String(MON[id].stats.power));
    });
  })();

  // --- ECONOMIA DAS PEDRAS: um +10 custa 107 pedras (DATA.upgrade) ----------
  // Estima o rendimento de UMA descida completa (3 salas) por calabouço, em
  // pedras de todos os elementos somados, e cobra a escada: quanto mais fundo,
  // mais paga. Sem isso, nada impede a Estufa render igual ao Coração.
  (function () {
    if (D.upgrade && Array.isArray(D.upgrade.stoneCost)) {
      var total = D.upgrade.stoneCost.reduce(function (a, b) { return a + b; }, 0);
      check('DATA.upgrade: levar um item ao +10 custa 107 pedras', total === 107, 'soma=' + total);
    }
    var yields = DG.map(function (d) {
      var y = 0;
      (d.rooms || []).forEach(function (r) {
        keys(r.monsters || {}).forEach(function (c) {
          var m = MON[r.monsters[c]];
          if (!m || !m.stoneDrop) { return; }
          // cada letra do layout pode aparecer várias vezes na sala
          var n = 0;
          r.layout.forEach(function (row) { for (var i = 0; i < row.length; i++) { if (row[i] === c) { n++; } } });
          y += n * m.stoneDrop.chance * (m.stoneDrop.min + m.stoneDrop.max) / 2;
        });
      });
      return Math.round(y);
    });
    check('rendimento de pedras cresce a cada calabouço',
      yields.every(function (v, i) { return i === 0 || v > yields[i - 1]; }), yields.join(' → '));
    check('um +10 (107 pedras) exige várias descidas mesmo no calabouço mais fundo',
      yields[yields.length - 1] < 107, 'descida mais rica rende ~' + yields[yields.length - 1]);
    check('a descida mais rasa já rende alguma coisa (≥ 10 pedras)', yields[0] >= 10, yields[0] + '');
  })();

  // --- SALAS MAIORES: a escada de tamanho ao longo dos 6 calabouços --------
  (function () {
    var areas = DG.map(function (d) {
      return d.rooms.reduce(function (a, r) { return a + r.layout[0].length * r.layout.length; }, 0);
    });
    check('área total das salas cresce (ou empata) a cada calabouço',
      areas.every(function (v, i) { return i === 0 || v >= areas[i - 1]; }), areas.join(' → '));
    check('o último calabouço é sensivelmente maior que o primeiro (≥ 1,5×)',
      areas[5] >= areas[0] * 1.5, areas[0] + ' → ' + areas[5]);
    var biggest = 0, smallest = Infinity;
    DG.forEach(function (d) {
      d.rooms.forEach(function (r) {
        var a = r.layout[0].length * r.layout.length;
        if (a > biggest) { biggest = a; }
        if (a < smallest) { smallest = a; }
      });
    });
    check('a menor sala do jogo já é ≥ 21×17 (357 células)', smallest >= 357, smallest + '');
    check('a maior sala do jogo é 27×23 (621 células)', biggest === 621, biggest + '');
    check('a sala do chefe final é a maior de todas',
      DG[5].rooms[2].layout[0].length * DG[5].rooms[2].layout.length === biggest);
  })();

  check('O Coração Partido muda de clima a cada 3 rodadas',
    DG.length === 6 && DG[5].weatherShiftEveryRounds === 3, DG[5] && String(DG[5].weatherShiftEveryRounds));

  // =========================================================================
  // 6. CENÁRIO
  // =========================================================================
  var SC = D.scenery || {};
  check('DATA.scenery existe com ≥ 6 temas', keys(SC).length >= 6, keys(SC).length + '');
  keys(SC).forEach(function (t) {
    ['high', 'low', 'floor', 'props'].forEach(function (k) {
      check('cenário ' + t + ': ' + k + ' é array de nomes visuais',
        Array.isArray(SC[t][k]) && SC[t][k].length >= 3 &&
        SC[t][k].every(function (n) { return typeof n === 'string' && n.length > 2; }));
    });
  });

  // =========================================================================
  // 7. EVENTOS DE TERRENO
  // =========================================================================
  var TE = D.tileEvents || {};
  var teIds = keys(TE);
  check('DATA.tileEvents existe', teIds.length > 0, teIds.length + ' eventos');
  var byKind = {};
  teIds.forEach(function (id) {
    var e = TE[id];
    var L = 'evento ' + id;
    check(L + ': id bate com a chave', e.id === id);
    check(L + ': name pt-BR', typeof e.name === 'string' && e.name.length > 0);
    check(L + ': kind válido', inList(e.kind, EVENT_KINDS), String(e.kind));
    check(L + ': icon', typeof e.icon === 'string' && e.icon.length > 0);
    check(L + ': weight > 0', typeof e.weight === 'number' && e.weight > 0);
    check(L + ': duration > 0', typeof e.duration === 'number' && e.duration > 0);
    check(L + ': description', typeof e.description === 'string' && e.description.length > 15);
    byKind[e.kind] = (byKind[e.kind] || 0) + 1;

    if (e.kind === 'mystery') {
      if (check(L + ': mystery tem outcomes (≥5)', Array.isArray(e.outcomes) && e.outcomes.length >= 5,
        e.outcomes && e.outcomes.length)) {
        var sum = 0;
        e.outcomes.forEach(function (o, i) {
          check(L + ' outcome#' + i + ': weight > 0', typeof o.weight === 'number' && o.weight > 0);
          check(L + ' outcome#' + i + ': text', typeof o.text === 'string' && o.text.length > 5);
          sum += (o.weight || 0);
          validateEffects(L + ' outcome#' + i, o.effects);
        });
        check(L + ': soma dos pesos dos outcomes > 0', sum > 0, 'soma=' + sum);
        var good = e.outcomes.filter(function (o) {
          return (o.effects || []).some(function (f) { return f.type === 'heal' || f.type === 'buff' || f.type === 'shield' || f.type === 'regen'; });
        }).length;
        var bad = e.outcomes.filter(function (o) {
          return (o.effects || []).some(function (f) { return f.type === 'damage' || f.type === 'poison' || f.type === 'root'; });
        }).length;
        check(L + ': tem outcomes bons E ruins', good > 0 && bad > 0, 'bons=' + good + ' ruins=' + bad);
      }
    } else {
      validateEffects(L, e.effects);
    }
  });
  check('eventos: ≥ 3 do tipo buff', (byKind.buff || 0) >= 3, (byKind.buff || 0) + '');
  check('eventos: ≥ 1 mystery', (byKind.mystery || 0) >= 1);
  check('eventos: ≥ 1 portal', (byKind.portal || 0) >= 1);
  check('eventos: ≥ 1 drain', (byKind.drain || 0) >= 1);
  check('eventos: ≥ 1 fountain', (byKind.fountain || 0) >= 1);

  // =========================================================================
  // 8. NOMENCLATURA — o antigo "pm" não existe em lugar nenhum
  // =========================================================================
  (function () {
    var blob = JSON.stringify({
      elements: D.elements, rivals: D.rivals, weathers: D.weathers, elementInfo: D.elementInfo,
      monsters: D.monsters, monsterSpells: D.monsterSpells,
      dungeons: D.dungeons, scenery: D.scenery, tileEvents: D.tileEvents
    });
    check('dados do Mundo: nenhuma menção a "pm"', !/(^|[^a-zA-Z])pm([^a-zA-Z]|$)/i.test(blob),
      (blob.match(/.{0,30}(^|[^a-zA-Z])pm([^a-zA-Z]|$).{0,30}/i) || [''])[0]);

    var badKeys = [];
    (function walk(o, path) {
      if (!o || typeof o !== 'object') { return; }
      for (var k in o) {
        if (!o.hasOwnProperty(k)) { continue; }
        if (k.toLowerCase() === 'pm') { badKeys.push(path + '.' + k); }
        walk(o[k], path + '.' + k);
      }
    })({ m: D.monsters, s: D.monsterSpells, d: D.dungeons, w: D.weathers, t: D.tileEvents }, '');
    check('nenhum campo chamado "pm" em nenhuma profundidade', badKeys.length === 0, badKeys.join(', '));

    // varredura do CÓDIGO-FONTE (comentários inclusive), quando servido por http
    var srcs = ['../js/core/data/elements.js', '../js/core/data/monsters.js', '../js/core/data/dungeons.js'];
    var scanned = 0, hits = [];
    srcs.forEach(function (u) {
      try {
        var x = new XMLHttpRequest();
        x.open('GET', u + '?v=' + Date.now(), false); // síncrono de propósito: a página roda tudo no load
        x.send(null);
        if (x.status >= 200 && x.status < 400) {
          scanned++;
          if (/(^|[^a-zA-Z])pm([^a-zA-Z]|$)/i.test(x.responseText)) { hits.push(u); }
        }
      } catch (err) { /* file:// bloqueia XHR — a checagem de dados acima já cobre o essencial */ }
    });
    if (scanned === srcs.length) {
      check('código-fonte dos 3 arquivos: nenhuma menção a "pm" (nem em comentário)', hits.length === 0, hits.join(', '));
    } else {
      check('código-fonte: varredura de "pm" (requer http://, ' + scanned + '/3 lidos)', scanned === srcs.length,
        'abra a página pelo servidor para esta checagem');
    }
  })();

  // =========================================================================
  // 9. O ECO PRIMORDIAL (02/10) — o chefe supremo e a Câmara do Eco
  // =========================================================================
  // O elenco dele mora em DATA.ecoMonstros, fora do bestiário (js/core/data/eco.js diz por quê), e por
  // isso as réguas da seção 4 não o veem: aqui ele passa pelas MESMAS (campos, feitiços, a roda) e pelas
  // que só ele tem (porte 2, imóvel, as fases na ordem do dono, um golpe por fase, a câmara).
  (function () {
    var C = D.eco, EM = D.ecoMonstros || {};
    if (!check('DATA.eco e DATA.ecoMonstros existem', !!C && keys(EM).length > 0)) { return; }
    var FASES = ['fogo', 'agua', 'terra', 'ar'];
    check('Eco: as fases são Fogo → Água → Terra → Ar (a ordem do dono)', JSON.stringify(C.fases) === JSON.stringify(FASES),
      JSON.stringify(C.fases));
    check('Eco: 12 rodadas por tentativa', C.rodadas === 12, String(C.rodadas));
    check('Eco: nenhum id do elenco colide com o bestiário de calabouço',
      keys(EM).every(function (id) { return !has(MON, id); }), keys(EM).filter(function (id) { return has(MON, id); }).join(', '));
    keys(EM).forEach(function (id) {
      var m = EM[id], L = 'eco ' + id, st = m.stats || {};
      check(L + ': id bate com a chave', m.id === id);
      check(L + ': nome e descrição', typeof m.name === 'string' && m.name.length > 0 &&
        typeof m.description === 'string' && m.description.length > 20);
      check(L + ': element válido', inList(m.element, ELEMENTS), String(m.element));
      check(L + ': ai válida', inList(m.ai, AIS), String(m.ai));
      check(L + ': stats completos', ['hp', 'pa', 'pp', 'initiative', 'power', 'dodge', 'lock'].every(function (f) {
        return typeof st[f] === 'number'; }) && st.hp > 0 && st.pa >= 1);
      check(L + ': resists com as 5 chaves', !!st.resists && ELEMENTS.every(function (e) { return typeof st.resists[e] === 'number'; }));
      check(L + ': feitiços existem em DATA.monsterSpells', Array.isArray(m.spells) && m.spells.length > 0 &&
        m.spells.every(function (sid) { return has(MS, sid); }), JSON.stringify(m.spells));
      check(L + ': traços do vocabulário fechado', Array.isArray(m.traits) &&
        m.traits.every(function (t) { return has(TRAIT_REQ, t.type); }));
      check(L + ': não derruba pedra nem dá XP (o Eco paga pelo placar)', m.stoneDrop === null && m.xp === 0);
      if (id !== C.chefe && D.beats && D.beats[m.element]) {
        check(L + ': resiste ao que seu elemento vence e é fraco contra quem o vence (a roda)',
          st.resists[D.beats[m.element]] > 0 && st.resists[D.beatenBy[m.element]] < 0 && !(st.resists[m.element] > 0),
          JSON.stringify(st.resists));
      }
    });
    var eco = EM[C.chefe];
    if (check('Eco: o chefe (' + C.chefe + ') existe no elenco', !!eco)) {
      check('Eco: ocupa 2×2 (porte 2) e não anda (PP 0)', eco.porte === 2 && eco.stats.pp === 0);
      check('Eco: é chefe supremo, não invocação', eco.boss === true && eco.supremo === true && eco.summonOnly === false);
      check('Eco: imune a empurrão por escrito (a IA lê o traço)',
        eco.traits.some(function (t) { return t.type === 'pushImmune'; }));
      check('Eco: a fase de começo é a do elemento dele (Fogo)', eco.element === FASES[0]);
    }
    (C.comuns || []).forEach(function (sid) { check('Eco: o feitiço comum ' + sid + ' existe', has(MS, sid)); });
    FASES.forEach(function (el) {
      var fs = (C.feiticosFase || {})[el] || [];
      check('Eco/' + el + ': feitiços da fase existem e são do elemento dela', fs.length > 0 &&
        fs.every(function (sid) { return has(MS, sid) && MS[sid].element === el; }), JSON.stringify(fs));
      var mid = (C.menores || {})[el];
      check('Eco/' + el + ': o Eco Menor da fase existe, é do elemento e é só invocação',
        has(EM, mid) && EM[mid].element === el && EM[mid].summonOnly === true, String(mid));
      var g = (C.golpes || {})[el];
      check('Eco/' + el + ': o golpe grande tem padrão conhecido, nome e dano', !!g &&
        inList(g.padrao, ['alvos', 'onda', 'cruz', 'anel']) && typeof g.nome === 'string' && g.nome.length > 2 &&
        typeof g.min === 'number' && g.max >= g.min && g.min > 0, JSON.stringify(g));
      if (g && (g.padrao === 'onda' || g.padrao === 'anel')) {
        check('Eco/' + el + ': a faixa do golpe é 1 ≤ de ≤ ate', g.de >= 1 && g.ate >= g.de, JSON.stringify(g));
      }
    });
    check('Eco: o aviso tem ritmo (golpeACada ≥ 1) e o bônus de derrubar é uma fração',
      C.golpeACada >= 1 && C.bonusDerrubada > 0 && C.bonusDerrubada <= 1);

    // a Câmara do Eco
    var ar = null;
    (D.arenas || []).forEach(function (a) { if (a && a.id === C.arena) { ar = a; } });
    if (!check('Câmara: ' + C.arena + ' existe em DATA.arenas, marcada modo eco', !!ar && ar.modo === 'eco')) { return; }
    check('Câmara: não é calabouço (não vira portal nem palco do Poço)',
      !(D.dungeons || []).some(function (d) { return d.id === C.arena; }));
    var r = ar.rooms && ar.rooms[0], lay = r && r.layout;
    if (!check('Câmara: uma sala com layout', Array.isArray(lay) && lay.length > 0)) { return; }
    var w = lay[0].length;
    check('Câmara: retângulo', lay.every(function (row) { return row.length === w; }));
    var letras = [], Ps = [], ok = true;
    lay.forEach(function (row, y) {
      for (var x = 0; x < row.length; x++) {
        var ch = row.charAt(x);
        if ('.,#=~P'.indexOf(ch) < 0 && !/^[a-z]$/.test(ch)) { ok = false; }
        if (ch === 'P') { Ps.push([x, y]); }
        if (/^[a-z]$/.test(ch)) { letras.push([ch, x, y]); }
      }
    });
    check('Câmara: só caracteres da legenda', ok);
    check('Câmara: uma letra só, e ela é o Eco', letras.length === 1 && r.monsters[letras[0][0]] === C.chefe,
      JSON.stringify(letras));
    if (letras.length === 1) {
      var ax = letras[0][1], ay = letras[0][2], p = eco ? eco.porte : 2, livres = true;
      for (var dy = 0; dy < p; dy++) {
        for (var dx = 0; dx < p; dx++) {
          if (dx === 0 && dy === 0) { continue; }
          var c = (lay[ay + dy] || '').charAt(ax + dx);
          if (c !== '.' && c !== ',') { livres = false; }
        }
      }
      check('Câmara: as outras casas do corpo 2×2 são chão (a letra marca o canto noroeste)', livres);
      check('Câmara: 4 nascimentos de herói, todos a 6 ou mais passos do corpo', Ps.length === 4 &&
        Ps.every(function (q) {
          var cx = Math.max(ax, Math.min(ax + p - 1, q[0])), cy = Math.max(ay, Math.min(ay + p - 1, q[1]));
          return Math.abs(cx - q[0]) + Math.abs(cy - q[1]) >= 6;
        }), JSON.stringify(Ps));
      var altos = 0;
      lay.forEach(function (row) { for (var i = 0; i < row.length; i++) { if (row.charAt(i) === '#') { altos++; } } });
      check('Câmara: tem pilares altos para abrigar do golpe (≥ 8)', altos >= 8, String(altos));
    }
  })();

  // =========================================================================
  // 10. O SANTUÁRIO DOS ELEMENTOS (03/10) — o calabouço especial
  // =========================================================================
  // Mora em DATA.especiais (js/core/data/santuario.js diz por quê), então a seção 5 não o vê. Aqui as
  // cinco salas passam pelas MESMAS réguas de mapa das salas dos seis portais (tamanho, nascimentos,
  // obstáculo alto e baixo, densidade, ritmo) e pelas que só ele tem: sem chefe, sem armadilha, uma regra
  // por sala, a máscara do tamanho do layout com cada marca na casa certa, e o elenco de cada quadrante.
  (function () {
    var S = D.santuario, esp = null;
    (D.especiais || []).forEach(function (d) { if (d && d.id === 'elementsanctum') { esp = d; } });
    if (!check('Santuário: DATA.santuario e o calabouço especial elementsanctum existem', !!S && !!esp)) { return; }
    check('Santuário: ids de DATA.especiais são os desta régua',
      (D.especiais || []).map(function (d) { return d.id; }).join(',') === ESPECIAIS_IDS.join(','));
    check('Santuário: NÃO é um dos seis portais (não entra em DATA.dungeons nem em DATA.arenas)',
      !DG.some(function (d) { return d.id === esp.id; }) && !(D.arenas || []).some(function (a) { return a.id === esp.id; }));
    check('Santuário: DATA.calabouco acha os seis e o especial pelo id',
      typeof D.calabouco === 'function' && D.calabouco('elementsanctum') === esp && D.calabouco('cistern') === DG[1] &&
      D.calabouco('nao-existe') === null);
    check('Santuário: name e description saborosa', typeof esp.name === 'string' && esp.name.length > 0 &&
      typeof esp.description === 'string' && esp.description.length >= 60);
    check('Santuário: é fim de jogo — recommendedLevel 30 e mais difícil que os seis',
      esp.recommendedLevel === 30 && esp.difficulty > DG.length, esp.recommendedLevel + ' / ' + esp.difficulty);
    check('Santuário: palette em hex', !!esp.palette &&
      ['primary', 'secondary', 'accent', 'floor1', 'floor2', 'wall'].every(function (k) { return HEX.test(esp.palette[k]); }));
    check('Santuário: clima calmo e parado (a regra da sala é o clima dele)',
      esp.defaultWeather === 'calmo' && has(W, 'calmo') && esp.weatherShiftEveryRounds === 0);
    check('Santuário: SEM evento de chão ao acaso e sem armadilha (tileEventRate 0)', esp.tileEventRate === 0);
    check('Santuário: sem chefe não há carta (cardDrops é a lista vazia, de propósito)',
      Array.isArray(esp.cardDrops) && esp.cardDrops.length === 0);
    check('Santuário: o saque emprestado vem de um dos seis (saqueDe)', inList(esp.saqueDe, DUNGEON_IDS), String(esp.saqueDe));
    check('Santuário: theme tem nomes em DATA.scenery', has(D.scenery || {}, esp.theme), String(esp.theme));
    check('Santuário: o tema de reserva (enquanto o kit não chega) é o de um dos seis',
      DG.some(function (d) { return d.theme === esp.temaReserva; }), String(esp.temaReserva));

    // os números das quatro regras
    check('Santuário/Fogo: quem não é do Fogo vê 2 casas no escuro; o braseiro clareia um raio ≥ 1',
      !!S.escuro && S.escuro.visao === 2 && S.escuro.raio >= 1, JSON.stringify(S.escuro));
    check('Santuário/Água: casa alagada custa 2 PP (1 para a Água); a correnteza troca de bica num ritmo',
      !!S.agua && S.agua.custo === 2 && S.agua.custoAgua === 1 && S.agua.trocaACada >= 1, JSON.stringify(S.agua));
    check('Santuário/Terra: os pilares trocam a cada 2 rodadas', !!S.pilares && S.pilares.periodo === 2, JSON.stringify(S.pilares));
    check('Santuário/Ar: a rajada gira a cada 2 rodadas pelas quatro direções e o Ar alcança +1',
      !!S.vento && S.vento.giraACada === 2 && S.vento.alcance === 1 &&
      (S.vento.ordem || []).slice().sort().join('') === 'lnos', JSON.stringify(S.vento));

    // o elenco: dois por quadrante, nenhum chefe
    var ELENCO = { fogo: ['el_fogo_1', 'el_fogo_2'], agua: ['el_agua_1', 'el_agua_2'],
                   terra: ['el_terra_1', 'el_terra_2'], ar: ['el_ar_1', 'el_ar_2'] };
    var todos = [];
    keys(ELENCO).forEach(function (el) {
      ELENCO[el].forEach(function (id) {
        todos.push(id);
        var m = MON[id];
        if (!check('Santuário: o guardião ' + id + ' existe no bestiário', !!m)) { return; }
        check('Santuário: ' + id + ' é do elemento do quadrante (' + el + '), do Santuário e não é chefe',
          m.element === el && m.dungeonId === 'elementsanctum' && !m.boss && m.summonOnly === false,
          m.element + ' / ' + m.dungeonId);
        check('Santuário: ' + id + ' derruba pedra (a paga a mais do Santuário é pedra do quadrante)',
          !!m.stoneDrop && m.stoneDrop.chance > 0 && m.stoneDrop.min >= 1, JSON.stringify(m.stoneDrop));
      });
    });
    check('Santuário: o bestiário não tem outro monstro com dungeonId elementsanctum',
      monIds.filter(function (id) { return MON[id].dungeonId === 'elementsanctum'; }).sort().join(',') === todos.slice().sort().join(','));
    check('Santuário: o Vigia de Pavio enxerga no escuro (traço veNoEscuro)',
      !!MON.el_fogo_1 && (MON.el_fogo_1.traits || []).some(function (t) { return t.type === 'veNoEscuro'; }));
    check('Santuário: o Pilarete não é empurrado (traço pushImmune)',
      !!MON.el_terra_1 && (MON.el_terra_1.traits || []).some(function (t) { return t.type === 'pushImmune'; }));

    // as salas
    var REGRAS = ['fogo', 'agua', 'terra', 'ar', 'altar'];
    if (!check('Santuário: 5 salas (uma por quadrante + o Altar dos Quatro)', Array.isArray(esp.rooms) && esp.rooms.length === 5)) { return; }
    check('Santuário: as regras das salas, na ordem, são Fogo, Água, Terra, Ar e o Altar',
      esp.rooms.map(function (r) { return r.santuario && r.santuario.regra; }).join(',') === REGRAS.join(','));
    // o que a máscara marca e sobre que casa do layout cada marca tem de estar
    var MARCA = { B: '=', b: '=', r: '=', N: '#', S: '#', L: '#', O: '#', V: '#', C: '#', M: '#' };
    var DA_REGRA = { fogo: 'Bb', agua: 'apNSLO', terra: 'Vv', ar: 'rC', altar: 'BbapNSLOVvrCM' };
    function dentro(z, x, y) { return x >= z[0] && y >= z[1] && x <= z[2] && y <= z[3]; }
    esp.rooms.forEach(function (r, ri) {
      var RL = 'Santuário sala ' + ri + ' (' + r.name + ')', sa = r.santuario || {}, regra = sa.regra;
      check(RL + ': name, weather e sceneryTheme', typeof r.name === 'string' && r.name.length > 0 && has(W, r.weather) &&
        has(D.scenery || {}, r.sceneryTheme), r.weather + ' / ' + r.sceneryTheme);
      var lay = r.layout;
      if (!check(RL + ': layout é array de strings', Array.isArray(lay) && lay.length > 0)) { return; }
      var wdt = lay[0].length, hgt = lay.length;
      check(RL + ': todas as linhas do mesmo comprimento', lay.every(function (row) { return typeof row === 'string' && row.length === wdt; }));
      check(RL + ': largura entre 21 e 27 (é ' + wdt + ')', wdt >= 21 && wdt <= 27);
      check(RL + ': altura entre 17 e 23 (é ' + hgt + ')', hgt >= 17 && hgt <= 23);
      var counts = {}, Ps = [], Ms = [];
      lay.forEach(function (row, y) {
        for (var x = 0; x < row.length; x++) {
          var ch = row.charAt(x);
          counts[ch] = (counts[ch] || 0) + 1;
          if (ch === 'P') { Ps.push([y, x]); } else if (/^[a-z]$/.test(ch)) { Ms.push([y, x]); }
        }
      });
      check(RL + ': ≥ 2 spawns de herói (P)', (counts.P || 0) >= 2, 'P=' + (counts.P || 0));
      check(RL + ': usa obstáculo BAIXO "="', (counts['='] || 0) >= 6, '= ' + (counts['='] || 0));
      check(RL + ': só caracteres válidos',
        keys(counts).every(function (c) { return '.,#=~P'.indexOf(c) !== -1 || /^[a-z]$/.test(c); }), keys(counts).join(''));
      var letters = keys(counts).filter(function (c) { return /^[a-z]$/.test(c); }).sort();
      var mapped = keys(r.monsters || {}).sort();
      check(RL + ': letras do layout e de monsters são as mesmas', letters.join('') === mapped.join(''),
        'layout=[' + letters + '] mapeadas=[' + mapped + ']');
      var daSala = mapped.map(function (c) { return r.monsters[c]; }).sort();
      var esperado = (regra === 'altar' ? todos : (ELENCO[regra] || [])).slice().sort();
      check(RL + ': o elenco é ' + (regra === 'altar' ? 'os oito guardiões misturados' : 'os dois guardiões do quadrante'),
        daSala.join(',') === esperado.join(','), daSala.join(','));
      check(RL + ': sem chefe', daSala.every(function (id) { return has(MON, id) && !MON[id].boss; }));
      check(RL + ': monstros distribuídos (≥ 4 nascimentos)', Ms.length >= 4, Ms.length + ' spawns');
      (function () {
        var inner = 0, obst = 0;
        for (var y = 1; y < hgt - 1; y++) { for (var x = 1; x < wdt - 1; x++) { inner++; if (lay[y][x] === '#' || lay[y][x] === '=') { obst++; } } }
        var dens = obst / inner;
        check(RL + ': densidade de obstáculo entre 12% e 30% do interior', dens >= 0.12 && dens <= 0.30,
          (Math.round(dens * 1000) / 10) + '% (' + obst + '/' + inner + ')');
        check(RL + ': mistura obstáculo ALTO e BAIXO', (counts['#'] || 0) - (2 * wdt + 2 * hgt - 4) > 0 && (counts['='] || 0) > 0);
        var sum = 0, worst = 0;
        Ps.forEach(function (p) {
          var best = Infinity;
          Ms.forEach(function (mm) { var d = Math.abs(p[0] - mm[0]) + Math.abs(p[1] - mm[1]); if (d < best) { best = d; } });
          sum += best; if (best > worst) { worst = best; }
        });
        var avg = Ps.length ? sum / Ps.length : 0;
        check(RL + ': distância média herói→monstro mais próximo entre 4 e 7', avg >= 4 && avg <= 7,
          'média ' + (Math.round(avg * 100) / 100) + ' · pior ' + worst);
        check(RL + ': nenhum herói começa a mais de 10 células do primeiro monstro', worst <= 10, 'pior ' + worst);
      })();

      // ---- a máscara da regra -------------------------------------------------
      var mapa = sa.mapa;
      if (!check(RL + ': a máscara (santuario.mapa) tem o tamanho do layout',
        Array.isArray(mapa) && mapa.length === hgt && mapa.every(function (row) { return typeof row === 'string' && row.length === wdt; }))) { return; }
      var marcas = {}, fora = [], casaErrada = [];
      mapa.forEach(function (row, y) {
        for (var x = 0; x < wdt; x++) {
          var m = row.charAt(x), c = lay[y].charAt(x);
          if (m === '.') { continue; }
          marcas[m] = (marcas[m] || 0) + 1;
          if ((DA_REGRA[regra] || '').indexOf(m) < 0) { fora.push(m + '@' + x + ',' + y); continue; }
          // a casa do layout por baixo de cada marca: toda ferramenta que só lê o layout tem de ver muro onde
          // há bica, pilar de pé, cata-vento e altar; mureta onde há braseiro e respiro; e CHÃO onde há água,
          // ponte e soquete. Guardião pode nascer na água ou na ponte (é chão); no soquete não — o pilar
          // esperaria por ele já na primeira troca — e herói não nasce em marca nenhuma
          var quer = MARCA[m];
          var chao = c === '.' || c === ',' || (m !== 'v' && /^[a-z]$/.test(c));
          if (quer ? c !== quer : !chao) { casaErrada.push(m + ' sobre "' + c + '" @' + x + ',' + y); }
        }
      });
      check(RL + ': a máscara só usa as marcas da regra da sala', fora.length === 0, fora.slice(0, 6).join(' '));
      check(RL + ': cada marca está sobre a casa certa do layout', casaErrada.length === 0, casaErrada.slice(0, 6).join(' · '));
      var zonaE = sa.escuro || [], zonaV = sa.vento || [];
      [['escuro', zonaE], ['vento', zonaV]].forEach(function (par) {
        check(RL + ': as zonas de ' + par[0] + ' são retângulos dentro da sala',
          par[1].every(function (z) { return z.length === 4 && z[0] >= 0 && z[1] >= 0 && z[2] < wdt && z[3] < hgt && z[0] <= z[2] && z[1] <= z[3]; }),
          JSON.stringify(par[1]));
      });
      var temFogo = regra === 'fogo' || regra === 'altar', temAgua = regra === 'agua' || regra === 'altar';
      var temTerra = regra === 'terra' || regra === 'altar', temAr = regra === 'ar' || regra === 'altar';
      if (temFogo) {
        check(RL + ': há zona de escuro, com braseiro aceso E apagado para o jogador mexer',
