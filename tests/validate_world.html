          zonaE.length >= 1 && (marcas.B || 0) >= 1 && (marcas.b || 0) >= 1, JSON.stringify(marcas));
        check(RL + ': os heróis NÃO nascem no escuro (a regra é avisada antes de valer)',
          Ps.every(function (p) { return !zonaE.some(function (z) { return dentro(z, p[1], p[0]); }); }));
      } else { check(RL + ': sem escuro fora do Fogo', zonaE.length === 0); }
      if (temAgua) {
        var bicas = (marcas.N || 0) + (marcas.S || 0) + (marcas.L || 0) + (marcas.O || 0);
        check(RL + ': há água, ponte seca e ≥ 2 bicas (a correnteza troca de direção)',
          (marcas.a || 0) >= 8 && (marcas.p || 0) >= 1 && bicas >= 2, JSON.stringify(marcas));
        check(RL + ': os heróis NÃO nascem na água', Ps.every(function (p) { return mapa[p[0]].charAt(p[1]) === '.'; }));
      }
      if (temTerra) {
        check(RL + ': há pilares de pé E baixos (a troca muda o mapa nas duas direções)',
          (marcas.V || 0) >= 2 && (marcas.v || 0) >= 2, JSON.stringify(marcas));
      }
      if (temAr) {
        check(RL + ': há zona de vento, cata-vento à vista e respiros de calmaria',
          zonaV.length >= 1 && (marcas.C || 0) >= 1 && (marcas.r || 0) >= 2, JSON.stringify(marcas));
        check(RL + ': os heróis NÃO nascem no vento',
          Ps.every(function (p) { return !zonaV.some(function (z) { return dentro(z, p[1], p[0]); }); }));
      } else { check(RL + ': sem vento fora do Ar', zonaV.length === 0); }
      if (regra === 'altar') {
        var Q = sa.quadrantes || {};
        check(RL + ': os quatro quadrantes existem e não se sobrepõem', ['fogo', 'agua', 'terra', 'ar'].every(function (el) {
          return Array.isArray(Q[el]) && Q[el].length === 4;
        }) && ['fogo', 'agua', 'terra', 'ar'].every(function (a, i, l) {
          return l.every(function (b) {
            return a === b || Q[a][2] < Q[b][0] || Q[b][2] < Q[a][0] || Q[a][3] < Q[b][1] || Q[b][3] < Q[a][1];
          });
        }), JSON.stringify(Q));
        check(RL + ': o escuro é o quadrante do Fogo e o vento é o do Ar',
          JSON.stringify(zonaE) === JSON.stringify([Q.fogo]) && JSON.stringify(zonaV) === JSON.stringify([Q.ar]));
        check(RL + ': o altar está no meio (marca M)', (marcas.M || 0) >= 1, JSON.stringify(marcas));
        check(RL + ': cada marca mora no quadrante da regra dela', (function () {
          var DE = { B: 'fogo', b: 'fogo', a: 'agua', p: 'agua', N: 'agua', S: 'agua', L: 'agua', O: 'agua',
                     V: 'terra', v: 'terra', r: 'ar', C: 'ar' }, ok = true;
          mapa.forEach(function (row, y) {
            for (var x = 0; x < wdt; x++) {
              var m = row.charAt(x), el = DE[m];
              // a bica e o cata-vento são do muro: podem estar na parede que fecha o quadrante (1 casa para fora)
              if (el && !dentro([Q[el][0] - 1, Q[el][1] - 1, Q[el][2] + 1, Q[el][3] + 1], x, y)) { ok = false; }
            }
          });
          return ok;
        })());
      }
      // ---- as regiões (aparência): cobrem a sala e dizem um elemento válido ----
      var reg = r.regioes;
      check(RL + ': regioes é uma lista de { x, y, w, h, elemento } dentro da sala', Array.isArray(reg) && reg.length >= 1 &&
        reg.every(function (g) {
          return g.x >= 0 && g.y >= 0 && g.w > 0 && g.h > 0 && g.x + g.w <= wdt && g.y + g.h <= hgt &&
                 inList(g.elemento, ['fogo', 'agua', 'terra', 'ar']);
        }), JSON.stringify(reg));
      if (regra !== 'altar') {
        check(RL + ': a região é a sala inteira, do elemento da regra',
          Array.isArray(reg) && reg.length === 1 && reg[0].elemento === regra && reg[0].w === wdt && reg[0].h === hgt);
      } else {
        check(RL + ': uma região por elemento, cada uma por cima do quadrante dele', Array.isArray(reg) && reg.length === 4 &&
          reg.every(function (g) {
            var q = (sa.quadrantes || {})[g.elemento];
            return q && g.x <= q[0] && g.y <= q[1] && g.x + g.w - 1 >= q[2] && g.y + g.h - 1 >= q[3];
          }));
      }
    });
    // o Altar é a maior sala (o fim da descida é arena, não corredor)
    var areasS = esp.rooms.map(function (r) { return r.layout[0].length * r.layout.length; });
    check('Santuário: o Altar dos Quatro é a maior sala', areasS[4] >= Math.max.apply(null, areasS.slice(0, 4)), areasS.join(' · '));
  })();

  // =========================================================================
  // RENDER
  // =========================================================================
  function render() {
    var passed = 0, failed = 0, failures = [];
    results.forEach(function (r) {
      if (r.ok) { passed++; } else { failed++; failures.push(r.name + (r.detail ? ' — ' + r.detail : '')); }
    });
    window.TEST_RESULTS = { passed: passed, failed: failed, failures: failures };

    var sum = document.getElementById('summary');
    sum.className = failed === 0 ? 'ok' : 'bad';
    sum.textContent = failed === 0
      ? '✔ 100% PASS — ' + passed + ' checagens, 0 falhas.'
      : '✘ ' + failed + ' FALHA(S) de ' + (passed + failed) + ' checagens.';

    if (failed) {
      var fl = document.getElementById('failList');
      fl.innerHTML = '<h2>Falhas</h2><ul>' + failures.map(function (f) {
        return '<li class="fail">✘ ' + f.replace(/</g, '&lt;') + '</li>';
      }).join('') + '</ul>';
    }

    var all = document.getElementById('allList');
    all.innerHTML = results.map(function (r) {
      return '<li class="' + (r.ok ? 'pass' : 'fail') + '">' + (r.ok ? '✔' : '✘') + ' ' +
        (r.name + (r.detail && !r.ok ? ' — ' + r.detail : '')).replace(/</g, '&lt;') + '</li>';
    }).join('');

    // painel de resumo do conteúdo (útil para o relatório)
    if (D && D.monsters && D.dungeons) {
      var rows = D.dungeons.map(function (d) {
        var n = keys(D.monsters).filter(function (i) { return D.monsters[i].dungeonId === d.id; });
        var b = n.filter(function (i) { return D.monsters[i].boss; })[0];
        return '<tr><td>' + d.order + '</td><td>' + d.name + '</td><td>' + d.id + '</td><td>' + d.theme +
          '</td><td>' + d.defaultWeather + '</td><td>' + d.rooms.map(function (r) { return r.weather; }).join(' / ') +
          '</td><td>' + n.length + '</td><td>' + (b ? D.monsters[b].name + ' (' + D.monsters[b].stats.hp + ' PV)' : '—') + '</td></tr>';
      }).join('');
      // --- economia: pedras por descida e cartas por chefe ------------------
      var econ = D.dungeons.map(function (d) {
        var y = {}, tot = 0;
        (d.rooms || []).forEach(function (r) {
          keys(r.monsters || {}).forEach(function (c) {
            var m = D.monsters[r.monsters[c]];
            if (!m || !m.stoneDrop) { return; }
            var n = 0;
            r.layout.forEach(function (row) { for (var i = 0; i < row.length; i++) { if (row[i] === c) { n++; } } });
            var v = n * m.stoneDrop.chance * (m.stoneDrop.min + m.stoneDrop.max) / 2;
            y[m.element] = (y[m.element] || 0) + v; tot += v;
          });
        });
        var best = '', bestV = 0;
        keys(y).forEach(function (e) { if (y[e] > bestV) { bestV = y[e]; best = e; } });
        var bossId = keys(d.rooms[2].monsters).map(function (c) { return d.rooms[2].monsters[c]; })
          .filter(function (i) { return D.monsters[i] && D.monsters[i].boss; })[0];
        var bsd = bossId && D.monsters[bossId].stoneDrop;
        return '<tr><td>' + d.order + '</td><td>' + d.name + '</td><td>' + Math.round(tot) +
          '</td><td>' + best + ' ~' + Math.round(bestV) + '</td><td>' + Math.ceil(107 / (bestV || 1)) +
          '</td><td>' + (bsd ? bsd.min + '–' + bsd.max : '—') + '</td><td>' +
          d.cardDrops.map(function (c) { return c.classId + ' ' + c.weight + '%'; }).join(' · ') + '</td></tr>';
      }).join('');

      document.getElementById('stats').innerHTML =
        '<h2>Resumo do mundo</h2><table><tr><th>#</th><th>Calabouço</th><th>id</th><th>tema</th>' +
        '<th>clima base</th><th>clima das salas</th><th>bichos</th><th>chefe</th></tr>' + rows + '</table>' +
        '<div class="sub">' + keys(D.monsters).length + ' monstros (' +
        keys(D.monsters).filter(function (i) { return !D.monsters[i].boss; }).length + ' comuns + ' +
        keys(D.monsters).filter(function (i) { return D.monsters[i].boss; }).length + ' chefes) · ' +
        keys(D.monsterSpells).length + ' feitiços de monstro · ' +
        keys(D.tileEvents).length + ' eventos de terreno · ' + keys(D.scenery).length + ' temas de cenário</div>' +
        (descent ? ('<h2>Progressão: XP por descida e dificuldade (adendo v2.3)</h2><table><tr>' +
          '<th>#</th><th>Calabouço</th><th>nível rec.</th><th>degrau</th><th>XP/descida</th>' +
          '<th>× o anterior</th><th>níveis SOLO</th><th>níveis DUPLA</th>' +
          '<th>XP solo no nível 22</th><th>PV médio comum</th><th>poder</th>' +
          '<th>chefe PV</th><th>spawns</th></tr>' +
          D.dungeons.map(function (d, i) {
            var LV = D.leveling, s = descent[i];
            var stp = LV.xpTable[d.recommendedLevel] - LV.xpTable[d.recommendedLevel - 1];
            var F = LV.xpFalloff, over = 22 - d.recommendedLevel - (F ? F.graceLevels : 4);
            var mu = (!F || over <= 0) ? 1 : Math.max(F.floor, Math.pow(F.factorPerLevel, over));
            var solo = Math.floor(s.xp), duo = Math.floor(s.xp / 2);
            return '<tr><td>' + d.order + '</td><td>' + d.name + '</td><td>' + d.recommendedLevel +
              '</td><td>' + stp + '</td><td>' + s.xp +
              '</td><td>' + (i === 0 ? '—' : (Math.round(s.xp / descent[i - 1].xp * 100) / 100) + '×') +
              '</td><td>' + (Math.round(solo / stp * 100) / 100) +
              '</td><td>' + (Math.round(duo / stp * 100) / 100) +
              '</td><td>' + Math.round(solo * mu) +
              ' <span style="color:#6b7684">(×' + (Math.round(mu * 100) / 100) + ')</span></td><td>' + s.avgHp +
              '</td><td>+' + s.avgPower + '</td><td>' + s.bossHp + '</td><td>' + s.spawns + '</td></tr>';
          }).join('') + '</table>' +
          '<div class="sub">Uma descida = as 3 salas, contando cada spawn do layout. ' +
          '<code>game.js</code> faz <code>xpGanho = floor(xpTotal / partySize)</code>: o <b>solo</b> ' +
          'leva a descida inteira, a <b>dupla</b> parte ao meio por herói. "Níveis" = essa XP ÷ o degrau ' +
          'da xpTable no nível recomendado; o alvo do adendo v2.3 (~1 no começo, ~1/3 do nível 25 em ' +
          'diante) é medido no SOLO, que é o teto. A coluna "XP solo no nível 22" aplica o ' +
          '<code>xpFalloff</code> — é ela que mostra por que moer calabouço raso deixa de compensar.</div>') : '') +
        '<h2>Salas: tamanho, divisórias e ritmo</h2><table><tr><th>#</th><th>Sala</th><th>tema</th>' +
        '<th>tamanho</th><th>células</th><th>densidade</th><th>alto/baixo</th>' +
        '<th>dist. herói→monstro</th><th>P</th><th>monstros</th></tr>' +
        D.dungeons.map(function (d) {
          return d.rooms.map(function (r, ri) {
            var lay = r.layout, w = lay[0].length, h = lay.length;
            var inner = 0, obst = 0, hi = 0, lo = 0, Ps = [], Ms = [];
            for (var y = 0; y < h; y++) {
              for (var x = 0; x < w; x++) {
                var ch = lay[y][x];
                if (y > 0 && y < h - 1 && x > 0 && x < w - 1) {
                  inner++;
                  if (ch === '#') { obst++; hi++; }
                  if (ch === '=') { obst++; lo++; }
                }
                if (ch === 'P') { Ps.push([y, x]); }
                else if (/^[a-z]$/.test(ch)) { Ms.push([y, x]); }
              }
            }
            var sum = 0;
            Ps.forEach(function (p) {
              var best = Infinity;
              Ms.forEach(function (mm) { var dd = Math.abs(p[0] - mm[0]) + Math.abs(p[1] - mm[1]); if (dd < best) { best = dd; } });
              sum += best;
            });
            return '<tr><td>' + d.order + '.' + (ri + 1) + '</td><td>' + r.name +
              (ri === 2 ? ' <span style="color:#ffd76b">(chefe)</span>' : '') + '</td><td>' + r.sceneryTheme +
              '</td><td>' + w + '×' + h + '</td><td>' + (w * h) + '</td><td>' +
              (Math.round(obst / inner * 1000) / 10) + '%</td><td>' + hi + ' / ' + lo +
              '</td><td>' + (Math.round(sum / Ps.length * 100) / 100) + '</td><td>' + Ps.length +
              '</td><td>' + Ms.length + '</td></tr>';
          }).join('');
        }).join('') + '</table>' +
        '<div class="sub">Densidade conta só o interior (fora o anel de parede). ' +
        '"alto/baixo" = células internas de <code>#</code> e de <code>=</code>. ' +
        'Distância = média, em passos Manhattan, de cada spawn de herói até o monstro mais próximo ' +
        '(alvo 4–7: perto o bastante para a luta começar na 1ª rodada).</div>' +
        '<h2>Economia: pedras de forja e cartas</h2><table><tr><th>#</th><th>Calabouço</th>' +
        '<th>pedras/descida</th><th>elemento principal</th><th>descidas p/ um +10 (107)</th>' +
        '<th>chefe derruba</th><th>cartas do chefe</th></tr>' + econ + '</table>' +
        '<div class="sub">Estimativa: soma de chance × média(min..max) de cada spawn das 3 salas. ' +
        'Um item vai a +10 com 107 pedras do elemento dele (DATA.upgrade.stoneCost).</div>';
    }
  }

  render();
})();
</script>
</body>
</html>
