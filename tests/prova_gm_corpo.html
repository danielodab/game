<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>prova: o Cavaleiro Negro na praça</title>
<style>html,body{margin:0;height:100%;background:#0f1216}iframe{width:100%;height:100%;border:0}</style>
</head>
<body>
<!-- PÁGINA DE PROVA (foto): o Mestre do Fundo com o corpo do Cavaleiro Negro
     (03/09) andando na praça. Só existe com a chave do dono na URL.
     ?dist=&tilt=&ang= enquadram a foto. -->
<iframe id="f" src="../index.html?prova-gm-corpo&gm=mestre-do-fundo"></iframe>
<script>
var f = document.getElementById('f');
f.onload = function () {
  var w = f.contentWindow, d = w.document;
  var voltas = 0;
  (function espera() {
    var menu = d.querySelector('.screen-menu.is-on');
    if (!menu && ++voltas < 100) return setTimeout(espera, 800);
    try {
      w.JOGO.GM.aparelha();
      w.JOGO.UI.selection(['gm']);
      // batiza antes: sem nome a praça abre o cartão de batismo em cima do corpo
      try { w.JOGO.DB.batizar('O Mestre'); } catch (e4) {}
      w.JOGO.UI.showScreen('hub');
      var v2 = 0;
      (function aguarda() {
        var e2 = null;
        try { e2 = w.JOGO.Hub._estado(); } catch (err) {}
        if ((e2 && e2.construcoes && e2.enfeites) || ++v2 > 200) {
          var Q = {};
          location.search.replace(/[?&]([^=&]+)=([^&]*)/g,
            function (_, k, v3) { Q[k] = parseFloat(v3); });
          if (w.JOGO.Hub._cam && (Q.dist || Q.tilt || Q.ang != null)) {
            w.JOGO.Hub._cam({ dist: Q.dist, tilt: Q.tilt, ang: Q.ang });
          }
          // fecha o cartão do Tutor para a foto mostrar o corpo inteiro
          try {
            [].slice.call(d.querySelectorAll('button')).filter(function (b2) {
              return /Entendi/.test(b2.textContent);
            })[0].click();
          } catch (e3) {}
          setTimeout(function () { window.__pronto = true; }, 1500);
          return;
        }
        setTimeout(aguarda, 400);
      })();
    } catch (e) { document.title = 'ERRO ' + e.message; }
  })();
};
</script>
</body>
</html>
