<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>SOTERRA 2.0 — mirar com o dedo</title>
<style>
  body{margin:0;background:#0f1216;color:#e8eef6;font:13px/1.6 system-ui,Segoe UI,sans-serif}
  #saida{position:fixed;right:0;top:0;width:520px;height:100%;overflow:auto;z-index:99;
         background:#0f1216;border-left:1px solid #2b3542;padding:10px;font:12px/1.5 monospace}
  #summary{padding:6px 10px;border-radius:6px;background:#1b222c;color:#cdd6e2;margin-bottom:8px}
  .ok{color:#7fe08a} .fail{color:#ff8477;font-weight:700}
  #app{position:fixed;left:0;top:0;width:390px;height:844px}
</style>
</head>
<body>
<div id="app"><canvas id="game-canvas"></canvas><div id="ui-root"></div></div>
<div id="saida"><div id="summary">rodando…</div><pre id="log"></pre></div>

<script src="save_sandbox.js"></script>
<script>
  window.__V = '?v=' + Date.now();
  var arquivos = [
    'js/mobile.js',
    'vendor/three.min.js','vendor/GLTFLoader.js','vendor/CopyShader.js',
    'vendor/LuminosityHighPassShader.js','vendor/EffectComposer.js',
    'vendor/RenderPass.js','vendor/ShaderPass.js','vendor/UnrealBloomPass.js',
    'js/core/data/elements.js','js/core/data/classes.js','js/core/data/spells.js',
    'js/core/data/progression.js','js/core/data/monsters.js','js/core/data/dungeons.js',
    'js/core/data/fusions.js','js/core/data/pets.js','js/core/data/items.js',
    'js/core/data/items_extra.js',
    'js/core/engine.js','js/core/fusion.js','js/core/ai.js','js/core/progress.js','js/core/game.js',
    'assets/embedded/env-kit.js','js/render3d/models3d.js',
    'assets/embedded/fx-atlas.js','assets/embedded/fx-placas.js','assets/embedded/models-anims.js',
    'assets/embedded/models-heroes.js','assets/embedded/models-meshy.js',
    'assets/embedded/models-meshy-jardim.js','assets/embedded/models-monsters.js','assets/embedded/models-bosses.js','assets/embedded/models-summons.js',
    'js/render3d/models3d_v2.js','js/render3d/fx3d_v2.js','js/render3d/renderer3d_v2.js',
    'js/render2d/art.js','js/render3d/portraits3d.js','js/ui/hud.js'];
  for (var i = 0; i < arquivos.length; i++)
    document.write('<scr' + 'ipt src="../' + arquivos[i] + window.__V + '"></scr' + 'ipt>');
</script>

<script>
(function () {
  'use strict';
  var NL = String.fromCharCode(10);
  var linhas = [], falhas = 0, testes = 0;
  function diz(t) { linhas.push(t); }
  function checa(nome, cond, detalhe) {
    testes++;
    if (!cond) falhas++;
    linhas.push((cond ? '  ok   ' : '  FALHA') + '  ' + nome + (detalhe ? '   [' + detalhe + ']' : ''));
  }

  var canvas, R, G, E, U;

  /* Um toque de verdade: pointerdown + pointerup no mesmo lugar, com
   * pointerType 'touch'. É por aí que o renderer decide se vale o modo de mira. */
  function toca(sx, sy, tipo) {
    var r = canvas.getBoundingClientRect();
    var comum = { bubbles: true, cancelable: true, pointerId: 7,
                  pointerType: tipo || 'touch', isPrimary: true,
                  clientX: r.left + sx, clientY: r.top + sy };
    canvas.dispatchEvent(new PointerEvent('pointerdown', comum));
    canvas.dispatchEvent(new PointerEvent('pointerup', comum));
  }
  function telaDe(gx, gy) {
    var p = R.project(gx, gy, 0);
    return { x: p.x, y: p.y };
  }
  function ativo() { return E.activeUnit(G.state); }

  function quadros(n) {
    for (var i = 0; i < (n || 6); i++) { G.update(0.016); U.update(0.016); R.render(0.016); }
  }
  /* O laço de quadro do jogo é rAF, e rAF não roda em headless. Então BOMBEAMOS
   * os quadros à mão até a condição valer — é assim que as outras páginas de
   * teste fazem, e é o que deixa a IA jogar o turno dela. */
  function ate(cond, cb, gasto) {
    gasto = gasto || 0;
    quadros(4);
    var ok = false;
    try { ok = cond(); } catch (e) {}
    if (ok) return cb();
    if (gasto > 20000) { diz('tempo esgotado esperando: ' + cond); return cb(); }
    setTimeout(function () { ate(cond, cb, gasto + 50); }, 50);
  }
  function esperaLivre(cb) {
    ate(function () { return !R.isBusy() && G.isPlayerTurn(); }, cb);
  }

  function fim() {
    document.getElementById('log').textContent = linhas.join(NL);
    var s = document.getElementById('summary');
    s.className = falhas ? 'fail' : 'ok';
    s.textContent = (falhas ? 'FAIL' : 'PASS') + ' · ' + (testes - falhas) + '/' + testes + ' verificações';
    window.__pronto = true;
  }

  window.addEventListener('DOMContentLoaded', function () {
    canvas = document.getElementById('game-canvas');
    R = JOGO.Renderer; G = JOGO.Game; E = JOGO.Engine; U = JOGO.UI;
    R.init(canvas);
    try { U.init(); } catch (e) {}
    try { G.init(); } catch (e) {}

    var t0 = Date.now();
    (function espera() {
      var pronto = false;
      try { pronto = JOGO.Models3D2.isReady() && JOGO.Models3D.isReady() && R.isReady(); } catch (e) {}
      if (!pronto && Date.now() - t0 < 90000) return setTimeout(espera, 200);

      var ids = JOGO.Progress.heroIds();
      while (ids.length < 2) {
        JOGO.Progress.createHero(ids.length ? 'curandeiro' : 'sumo');
        ids = JOGO.Progress.heroIds();
      }
      G.startRun(ids.slice(0, 2), 'greenhouse');
      quadros(30);

      diz('JOGO.Mobile: toque=' + (JOGO.Mobile ? JOGO.Mobile.toque() : '?') +
          '  celular=' + (JOGO.Mobile ? JOGO.Mobile.celular() : '?') +
          '  forcado=' + (JOGO.Mobile ? JOGO.Mobile.forcado : '?'));
      checa('js/mobile.js carregou', !!(JOGO.Mobile && JOGO.Mobile.toque));
      esperaLivre(corre);
    })();
  });

  function corre() {
    var u = ativo();
    if (!u || !G.isPlayerTurn()) { diz('não é turno do jogador — nada a testar'); return fim(); }

    // ---------------------------------------------------- 1) ANDAR em dois toques
    var alcance = E.reachable(G.state, u.uid) || [];
    var destino = null;
    for (var i = 0; i < alcance.length; i++) {
      var d = Math.abs(alcance[i].x - u.x) + Math.abs(alcance[i].y - u.y);
      if (d >= 2 && !E.unitAt(G.state, alcance[i].x, alcance[i].y)) { destino = alcance[i]; break; }
    }
    if (!destino) { diz('sem casa alcançável a 2 passos — pulei o teste de andar'); return parteFeitico(); }

    var antes = { x: u.x, y: u.y };
    var p = telaDe(destino.x, destino.y);
    toca(p.x, p.y);
    quadros(6);
    var u2 = ativo();
    checa('1º toque NÃO move', u2.x === antes.x && u2.y === antes.y,
          'ficou em ' + u2.x + ',' + u2.y);
    checa('1º toque acende a prévia (Game.hoverTile)',
          !!G.hoverTile && G.hoverTile.x === destino.x && G.hoverTile.y === destino.y,
          JSON.stringify(G.hoverTile));
    checa('o renderer guarda a mira', !!(R.mira && R.mira() &&
          R.mira().x === destino.x && R.mira().y === destino.y));

    toca(p.x, p.y);
    quadros(6);
    var u3 = ativo();
    checa('2º toque na MESMA casa move', u3.x === destino.x && u3.y === destino.y,
          'foi para ' + u3.x + ',' + u3.y);
    checa('a mira some depois de confirmar', !(R.mira && R.mira()));

    esperaLivre(parteFeitico);
  }

  function parteFeitico() {
    var u = ativo();
    if (!u || !G.isPlayerTurn()) { diz('turno mudou — pulei a parte do feitiço'); return parteMouse(); }

    // ------------------------------------------- 2) FEITIÇO em dois toques
    var sid = null, alvos = null;
    var lista = u.spells || [];
    for (var i = 0; i < lista.length; i++) {
      var t = null;
      try { t = E.castTargets(G.state, u.uid, lista[i]) || []; } catch (e) { t = []; }
      if (t.length) { sid = lista[i]; alvos = t; break; }
    }
    if (!sid) { diz('nenhum feitiço com alvo válido daqui — pulei'); return parteMouse(); }

    G.selectSpell(sid);
    quadros(4);
    var paAntes = ativo().pa;
    var alvo = alvos[0];
    var p = telaDe(alvo.x, alvo.y);

    toca(p.x, p.y);
    quadros(6);
    checa('1º toque NÃO lança o feitiço (PA intacto)', ativo().pa === paAntes,
          'PA ' + ativo().pa + ' de ' + paAntes);
    checa('1º toque mostra a ÁREA (hoverTile no alvo)',
          !!G.hoverTile && G.hoverTile.x === alvo.x && G.hoverTile.y === alvo.y);
    checa('o feitiço continua escolhido', G.selectedSpellId === sid);

    toca(p.x, p.y);
    quadros(6);
    checa('2º toque lança (PA gasto ou feitiço solto)',
          ativo().pa < paAntes || G.selectedSpellId === null,
          'PA ' + ativo().pa + ' de ' + paAntes + ', sel=' + G.selectedSpellId);

    esperaLivre(parteMouse);
  }

  function parteMouse() {
    // ------------------------------------------- 3) O MOUSE NÃO REGREDIU
    // Com ponteiro de mouse, um clique continua agindo de primeira: quem joga
    // no computador não deve ter de clicar duas vezes em nada.
    var u = ativo();
    if (JOGO.Mobile && JOGO.Mobile.forcado === true) {
      diz('?mobile=1 força o modo toque também para o mouse — parte do mouse pulada');
      return fim();
    }
    if (!u || !G.isPlayerTurn()) { diz('turno mudou — pulei a parte do mouse'); return fim(); }
    var alcance = E.reachable(G.state, u.uid) || [];
    var destino = null;
    for (var i = 0; i < alcance.length; i++) {
      if (!E.unitAt(G.state, alcance[i].x, alcance[i].y) &&
          (alcance[i].x !== u.x || alcance[i].y !== u.y)) { destino = alcance[i]; break; }
    }
    if (!destino) { diz('sem casa livre — pulei o teste de mouse'); return fim(); }
    diz('mouse: de ' + u.x + ',' + u.y + ' para ' + destino.x + ',' + destino.y +
        '  (PP ' + u.pp + ', ocupado=' + JOGO.Renderer.isBusy() + ')');
    var p = telaDe(destino.x, destino.y);
    toca(p.x, p.y, 'mouse');
    quadros(6);
    var u2 = ativo();
    checa('mouse: UM clique já move', u2.x === destino.x && u2.y === destino.y,
          'foi para ' + u2.x + ',' + u2.y);
    checa('mouse não deixa mira pendurada', !(R.mira && R.mira()));
    fim();
  }
})();
</script>
</body>
</html>
