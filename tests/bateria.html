<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>SOTERRA — a bateria de suítes</title>
<style>
  body{margin:0;background:#0f1216;color:#e8eef6;font:13px system-ui,Segoe UI,sans-serif;padding:14px}
  h1{font-size:15px;margin:0 0 8px}
  #summary{font:13px monospace;padding:6px 10px;border-radius:6px;margin-bottom:10px}
  .allpass{background:#16241b;color:#7fe08a} .fail{background:#3d1414;color:#f77}
  table{border-collapse:collapse;font:12px monospace}
  td,th{border:1px solid #2b3542;padding:3px 9px;text-align:left}
  td.ok{color:#7fe08a} td.mau{color:#f77} td.roda{color:#e8c25a}
  #palco{position:absolute;left:-4000px;top:0;width:1000px;height:800px}
</style>
</head>
<body>
<h1>A bateria — todas as suítes DOM, uma por vez, com portão de onload</h1>
<div id="summary">rodando…</div>
<table id="tab"><tr><th>suíte</th><th>resultado</th></tr></table>
<div id="palco"></div>

<script>
(function () {
  'use strict';
  /* A LIÇÃO DO PORTÃO (25/08): ler o iframe sem esperar o onload devolve o
   * DOCUMENTO ANTERIOR e a bateria mente. Aqui cada suíte só é lida depois
   * do onload E de __pronto/__done (ou do resumo pintado), com prazo. */
  var SUITES = [
    'contas', 'conta_db', 'rede', 'moderacao', 'brasa', 'temporada', 'duelo',
    'troca', 'mercado', 'missoes', 'desafios', 'forja_risco', 'saco_limite',
    'trajes', 'diario', 'poco', 'tutor', 'selos', 'guilda', 'fantasmas_teto',
    'icones_itens', 'icones_extras', 'insignias', 'estrelas_caminhos', 'gm', 'gm_corpo', 'pets_nivel',
    'posicao', 'antessala_rede', 'portais_fechados',
    'instancias', 'nuvem', 'gm_sessao',   // 10/09: o número de série por cópia e o save no cartório
    'prova_gm_batalha',  // a vitória de verdade (index inteiro) tem de virar recompensa sem erro
    'agenda', 'agenda_funil', 'gm_agenda',  // 10/09: os eventos do mundo — cache, funil e a ficha do Mestre
    'pergaminho', 'loja',  // Fase C: os pergaminhos da loja do site e a entrega dos pedidos no jogo
    'site_fase_c',         // Fase C: a conta no site (senha, e-mail, esqueci a senha) e a loja, com fetch de mentira
    'nivel_uso', 'nivel_uso_equipar',  // 10/09: a régua do nível de uso (dado) e a cobrança ao equipar (Progress)
    'nivel_uso_ficha',   // e a ficha: o Nv. fora das reticências, o cadeado fora dos botões, o aviso uma vez só
    'nomes_jogo',  // 10/09: a lei dos nomes no batismo e na guilda (GM/Admin recusados; o Mestre pode)
    'troca_cartorio',  // 10/09: peça com série só muda de mão se o cartório espelha (o relé tira o nuvem de quem não conferiu)
    'boot_seguro',  // 10/09: a marca de abertura — onde a última parou, as três saídas e o vigia
    'grupo', 'coop_motor',  // 11/09: o multijogador — o grupo/duelo/sussurro (dublê de Rede) e o motor da batalha em dupla
    'grupo_hud',  // 11/09: a HUD do multijogador no celular (achados 22 a 28), no index de verdade a 390x844
    'guerra_motor',  // 15/09: a guerra de guilda 2×2 — o lockstep de QUATRO (hash nos quatro, quem cai é marcado pelo parceiro de guilda, W.O. do lado)
    'guerra_hud',  // 15/09: a guerra de guilda na HUD — o bloco da Sede (a fila, as duas duplas, os quatro confirmando), o topo e o fim
    'pvp_hud',  // 14/09: a Arena (o quadro, a inscrição com os dois, o adversário encontrado) e o Campo de PvP (a dupla em ordem, a coroa travada, o toque que ataca)
    'tempo_turno',  // 11/09: a barra do tempo do turno na lateral (index de verdade a 390x844, relógio de mentira)
    'tela_cheia',  // 11/09: o ⛶/✕ do canto (API de tela cheia de mentira), retrato, paisagem e o aparelho virando
    'coroa_praca',  // 11/09: a coroa 3D da praça no jogo SERVIDO (pedida na hora, o bilhete vira 3D e gira)
    'toque_jogador',  // 11/09: tocar no CORPO de outro jogador (clique de verdade no canvas) abre o painel dele
    'balao_praca',  // 11/09: a frase do chat sobe num balão em cima de quem falou (e some sozinha)
    'guilda_servidor',  // 11/09: com sessão, a guilda fala com /api/guilda/* (a prova do servidor é tests/guilda_api.py)
    'vida',  // 14/09: a vida única de cada herói (JOGO.Vida, o relógio, o servidor) e o duelo que nasce com a vida de cada lado
    'vida_praca',  // 14/09: o cartão da vida na praça — a foto, o coração com o PV e o %, e a poção para o herói escolhido
    'prova_praca_tatica',  // 14/09: o duelo na praça — o tabuleiro no tema 'praca' veste árvore, portais, obras e barracas
    'prova_sede_tatica',  // 15/09: a guerra de guilda no Salão da Sede — tábuas, paredes com recorte, trono, lareiras acesas, 4×4 à vista
    'prova_camera_calabouco',  // 15/09: o ajuste de câmera dos mapas de duelo não vaza — Estufa e Cisterna na distância de antes
    'campo_pvp',  // 14/09: a cena do Campo de PvP — entra/sai, a aparência, os muros, a zona dos fantasmas e o teto; 19/09: a arte do dono veste muros, borda e enfeites (pedida ao Bundle no servido), chão de lajotas, braseiros, custo de desenho
    'pocoes_hud'  // 13/09: as poções de vida — a banca, os Consumíveis e a vida entre as salas (a barra subindo, o gole e a porta que espera 1 PV) no index inteiro
  ];
  /* o prazo por suíte: 120 s, e mais para quem abre o index inteiro
   * (essas se dão 110 s só para o jogo abrir) */
  var PRAZO = { grupo_hud: 300000, pvp_hud: 300000, guerra_hud: 300000, guerra_motor: 600000, tempo_turno: 300000, tela_cheia: 300000, coroa_praca: 300000, toque_jogador: 300000,
                balao_praca: 300000, pocoes_hud: 300000, vida_praca: 300000, prova_praca_tatica: 300000, prova_sede_tatica: 300000,campo_pvp: 300000 };
  var tab = document.getElementById('tab');
  var linhas = {};
  SUITES.forEach(function (s) {
    var tr = document.createElement('tr');
    var td1 = document.createElement('td'); td1.textContent = s;
    var td2 = document.createElement('td'); td2.textContent = 'na fila';
    tr.appendChild(td1); tr.appendChild(td2);
    tab.appendChild(tr);
    linhas[s] = td2;
  });

  var palco = document.getElementById('palco');
  var i = 0, falhas = 0, totalOk = 0;

  function roda() {
    if (i >= SUITES.length) {
      var sum = document.getElementById('summary');
      sum.className = falhas ? 'fail' : 'allpass';
      sum.textContent = (falhas ? 'FALHOU — ' : 'TUDO PASSOU — ') +
        totalOk + ' suíte(s) verdes, ' + falhas + ' com falha.';
      window.__done = true;
      window.__fail = falhas;
      return;
    }
    var nome = SUITES[i++];
    linhas[nome].textContent = 'rodando…';
    linhas[nome].className = 'roda';
    var fr = document.createElement('iframe');
    fr.width = '1000'; fr.height = '800';
    var carregou = false;
    fr.onload = function () { carregou = true; };
    fr.src = nome + '.html?bateria=' + Date.now();
    palco.appendChild(fr);

    var t0 = Date.now();
    (function espera() {
      var w = fr.contentWindow, d = null;
      try { d = w && w.document; } catch (e) {}
      var pronto = false, resumo = '';
      if (carregou && d) {
        var el2 = d.getElementById('summary') || d.querySelector('.allpass, .fail');
        resumo = el2 ? el2.textContent : '';
        pronto = (w.__pronto === true) || (w.__done === true) ||
                 /passou|FALHOU|falharam|PASS/i.test(resumo);
      }
      if (!pronto && Date.now() - t0 < (PRAZO[nome] || 120000)) return setTimeout(espera, 700);
      var mau = !pronto || /FALHOU|falharam|✘/i.test(resumo) ||
                (typeof fr.contentWindow.__fail === 'number' && fr.contentWindow.__fail > 0);
      linhas[nome].textContent = pronto ? (resumo || 'sem resumo').slice(0, 90)
                                        : 'ESTOUROU O TEMPO';
      linhas[nome].className = mau ? 'mau' : 'ok';
      if (mau) falhas++; else totalOk++;
      fr.remove();
      setTimeout(roda, 120);
    })();
  }
  roda();
})();
</script>
</body>
</html>
