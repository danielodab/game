<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>SOTERRA — a bateria de suítes</title>
<style>
  body{margin:0;background:#0f1216;color:#e8eef6;font:13px system-ui,Segoe UI,sans-serif;padding:14px}
  h1{font-size:15px;margin:0 0 8px}
  #summary{font:13px monospace;padding:6px 10px;border-radius:6px;margin-bottom:10px}
  .allpass{background:#16241b;color:#7fe08a} .fail{background:#3d1414;color:#f77}
  table{border-collapse:collapse;font:12px monospace}
  td,th{border:1px solid #2b3542;padding:3px 9px;text-align:left}
  td.ok{color:#7fe08a} td.mau{color:#f77} td.roda{color:#e8c25a}
  #palco{position:absolute;left:-4000px;top:0;width:1000px;height:800px}
</style>
</head>
<body>
<h1>A bateria — todas as suítes DOM, uma por vez, com portão de onload</h1>
<div id="summary">rodando…</div>
<table id="tab"><tr><th>suíte</th><th>resultado</th></tr></table>
<div id="palco"></div>

<script>
(function () {
  'use strict';
  /* A LIÇÃO DO PORTÃO (25/08): ler o iframe sem esperar o onload devolve o
   * DOCUMENTO ANTERIOR e a bateria mente. Aqui cada suíte só é lida depois
   * do onload E de __pronto/__done (ou do resumo pintado), com prazo. */
  var SUITES = [
    'contas', 'conta_db', 'rede', 'moderacao', 'brasa', 'temporada', 'duelo',
    'troca', 'mercado', 'missoes', 'desafios', 'forja_risco', 'saco_limite',
    'trajes', 'diario', 'poco', 'tutor', 'selos', 'guilda', 'fantasmas_teto',
    'icones_itens', 'insignias', 'estrelas_caminhos'
  ];
  var tab = document.getElementById('tab');
  var linhas = {};
  SUITES.forEach(function (s) {
    var tr = document.createElement('tr');
    var td1 = document.createElement('td'); td1.textContent = s;
    var td2 = document.createElement('td'); td2.textContent = 'na fila';
    tr.appendChild(td1); tr.appendChild(td2);
    tab.appendChild(tr);
    linhas[s] = td2;
  });

  var palco = document.getElementById('palco');
  var i = 0, falhas = 0, totalOk = 0;

  function roda() {
    if (i >= SUITES.length) {
      var sum = document.getElementById('summary');
      sum.className = falhas ? 'fail' : 'allpass';
      sum.textContent = (falhas ? 'FALHOU — ' : 'TUDO PASSOU — ') +
        totalOk + ' suíte(s) verdes, ' + falhas + ' com falha.';
      window.__done = true;
      window.__fail = falhas;
      return;
    }
    var nome = SUITES[i++];
    linhas[nome].textContent = 'rodando…';
    linhas[nome].className = 'roda';
    var fr = document.createElement('iframe');
    fr.width = '1000'; fr.height = '800';
    var carregou = false;
    fr.onload = function () { carregou = true; };
    fr.src = nome + '.html?bateria=' + Date.now();
    palco.appendChild(fr);

    var t0 = Date.now();
    (function espera() {
      var w = fr.contentWindow, d = null;
      try { d = w && w.document; } catch (e) {}
      var pronto = false, resumo = '';
      if (carregou && d) {
        var el2 = d.getElementById('summary') || d.querySelector('.allpass, .fail');
        resumo = el2 ? el2.textContent : '';
        pronto = (w.__pronto === true) || (w.__done === true) ||
                 /passou|FALHOU|falharam|PASS/i.test(resumo);
      }
      if (!pronto && Date.now() - t0 < 120000) return setTimeout(espera, 700);
      var mau = !pronto || /FALHOU|falharam|✘/i.test(resumo) ||
                (typeof fr.contentWindow.__fail === 'number' && fr.contentWindow.__fail > 0);
      linhas[nome].textContent = pronto ? (resumo || 'sem resumo').slice(0, 90)
                                        : 'ESTOUROU O TEMPO';
      linhas[nome].className = mau ? 'mau' : 'ok';
      if (mau) falhas++; else totalOk++;
      fr.remove();
      setTimeout(roda, 120);
    })();
  }
  roda();
})();
</script>
</body>
</html>
