<!--
  SOTERRA 2.0 — apresentação em 3D (Three.js r147).
  Entrada alternativa ao index.html (que serve a apresentação 2D em PixiJS).
  Para trocar a entrada padrão, o Orquestrador copia esta ordem de scripts.

  Ordem obrigatória:
    vendor 3D → dados → núcleo → cenário (env-kit + montador da v1) →
    modelos embutidos → camada 3D → arte 2D da HUD → retratos 3D → interface → loop

  A camada 2D (js/render2d/renderer.js e fx.js) NÃO entra aqui: `JOGO.Renderer`
  e `JOGO.FX` são fornecidos pela camada 3D. `js/render2d/art.js` continua
  entrando porque a HUD usa `JOGO.Art` para ícones e retratos.
-->

<!-- SOMENTE TESTE: inicia uma descida e tira a captura sincrona (?auto=1) -->
<script>
(function () {
  var Q = new URLSearchParams(location.search);
  if (!Q.get('auto')) return;
  function boot() {
    var J = window.JOGO;
    if (!J || !J.Progress || !J.Game || !J.Models3D2 || !J.Models3D2.isReady() ||
        !(J.Models3D && J.Models3D.isReady())) { setTimeout(boot, 200); return; }
    try {
      var ids = J.Progress.heroIds();
      if (ids.length < 2) { J.Progress.createHero('sumo'); J.Progress.createHero('curandeira'); ids = J.Progress.heroIds(); }
      J.Game.startRun(ids.slice(0, 2), Q.get('d') || 'greenhouse');
      if (Q.get('w')) { J.Game.state.weather = Q.get('w'); J.Renderer.handleEvent({ type: 'weatherShift', weather: Q.get('w') }); }
      var n = +(Q.get('frames') || 60);
      for (var i = 0; i < n; i++) J.Renderer.render(0.016);
      window.AUTO_OK = true;
    } catch (e) { document.title = 'ERRO ' + e.message; window.AUTO_ERR = String(e); }
  }
  if (document.readyState === 'complete') setTimeout(boot, 300);
  else window.addEventListener('load', function () { setTimeout(boot, 300); });
})();
</script>
