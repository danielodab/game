<script>
(function () {
  'use strict';

  /* ------------------------------------------------------------ utilidades */
  var results = [];
  function check(name, ok, detail) {
    results.push({ name: name, ok: !!ok, detail: detail === undefined ? '' : String(detail) });
  }
  function isNum(v) { return typeof v === 'number' && isFinite(v); }
  function isStr(v) { return typeof v === 'string' && v.length > 0; }
  function has(o, k) { return o && Object.prototype.hasOwnProperty.call(o, k); }

  /* ------------------------------------------------------------- vocabulário */
  // SETE classes desde a reestruturacao (docs/CLASSES_V3.md): a Paladina virou o
  // Curandeiro e entrou o Minotauro, dono do verbo BARRAR.
  var CLASS_IDS = ['sumo', 'arqueiro', 'bruxo', 'espadachim', 'curandeiro',
                   'invocador', 'minotauro'];
  /* adendo v2.1: iniciais e custos de desbloqueio fixados pelo usuário */
  var STARTERS = ['sumo', 'curandeiro'];
  // 12/10: Bárbaro e Curandeiro custam 5 desde as duas iniciais LIVRES (08/10) — ninguém custa 0
  var UNLOCK_COST = { sumo: 5, curandeiro: 5, invocador: 10, bruxo: 10, espadachim: 20,
                      arqueiro: 25, minotauro: 30 };
  var ELEMENTS = ['neutro', 'fogo', 'agua', 'terra', 'ar'];
  var PATH_ELEMENTS = ['fogo', 'agua', 'terra', 'ar'];
  var SHAPES = ['single', 'cross', 'circle', 'line', 'cone', 'ring'];
  var SIDES = ['any', 'enemy', 'ally', 'self'];
  var BUFF_STATS = ['pa', 'pp', 'power', 'initiative', 'dodge', 'lock'];
  var WEATHERS = ['calmo', 'chuva', 'estiagem', 'vendaval', 'tremor'];
  var RARITIES = ['comum', 'raro', 'epico'];
  var HEX = /^#[0-9a-fA-F]{6}$/;
  var PM_RE = /\bpm\b/i;

  /* tipos de efeito FECHADOS (contrato v2: v1 + os 10 novos) e campos obrigatórios */
  var EFFECT_REQ = {
    // MURO INVOCADO (v3): endurece uma celula por N turnos. Ver o verbo
    // BARRAR em docs/CLASSES_V3.md e o efeito em engine.js.
    wall: ['duration'],
    damage:         ['element', 'min', 'max'],
    heal:           ['min', 'max'],
    shield:         ['value', 'duration'],
    buff:           ['stat', 'value', 'duration'],
    resist:         ['element', 'value', 'duration'],
    push:           ['tiles'],
    pull:           ['tiles'],
    teleport:       [],
    swap:           [],
    poison:         ['element', 'min', 'max', 'duration'],
    regen:          ['min', 'max', 'duration'],
    summon:         ['monsterId'],
    taunt:          ['duration'],
    invisible:      ['duration'],
    root:           ['duration'],
    mark:           ['value', 'duration', 'max'],
    detonateMarks:  ['mult'],
    trap:           ['trapId', 'duration'],
    weatherShift:   ['weather'],
    cleanse:        ['kinds'],
    reflect:        ['pct', 'duration'],
    dispelShield:   [],
    moveTo:         ['maxTiles'],
    chain:          ['jumps', 'falloff', 'element', 'min', 'max']
  };
  var NUM_FIELDS = { min: 1, max: 1, value: 1, duration: 1, tiles: 1, mult: 1, pct: 1, maxTiles: 1, jumps: 1, falloff: 1 };

  /* ------------------------------------------------------------------ dados */
  var D = (typeof JOGO !== 'undefined') && JOGO.DATA;
  check('JOGO.DATA existe', !!D);
  if (!D) { render(); return; }
  check('DATA.classes existe', !!D.classes);
  check('DATA.spells existe', !!D.spells);
  check('DATA.unlockTiers existe', !!D.unlockTiers);
  check('DATA.leveling existe', !!D.leveling);
  check('DATA.cards existe', !!D.cards);
  check('DATA.stars existe (adendo v2.1)', !!D.stars);
  if (!D.classes || !D.spells || !D.unlockTiers || !D.leveling || !D.cards) { render(); return; }

  var classIds = Object.keys(D.classes);
  var spellIds = Object.keys(D.spells);
  var TIERS = D.unlockTiers;

  /* ===================================================== 1. unlockTiers ==== */
  check('unlockTiers = [5,10,12,15,20,30]',
    TIERS.length === 6 && TIERS.join(',') === '5,10,12,15,20,30', TIERS.join(','));

  /* ========================================================= 2. classes ==== */
  check('tantas classes quantas o contrato lista', classIds.length === CLASS_IDS.length, 'tem ' + classIds.length);
  CLASS_IDS.forEach(function (cid) { check('classe ' + cid + ' existe', !!D.classes[cid]); });
  classIds.forEach(function (cid) {
    check('classe ' + cid + ' é um dos ids do contrato', CLASS_IDS.indexOf(cid) >= 0);
  });

  var unlockedCount = 0;
  var referenced = {};        // spellId -> true (referenciado por baseSpells/paths)
  var perClassSpells = {};

  CLASS_IDS.forEach(function (cid) {
    var c = D.classes[cid];
    if (!c) return;
    var p = 'classe ' + cid + ' ';
    check(p + 'id == chave', c.id === cid, c.id);
    ['name', 'role', 'description', 'lore'].forEach(function (f) {
      check(p + 'campo ' + f, isStr(c[f]));
    });
    ['primary', 'secondary', 'accent'].forEach(function (k) {
      check(p + 'palette.' + k + ' hex', c.palette && HEX.test(c.palette[k]), c.palette && c.palette[k]);
    });
    check(p + 'cardRarity válida', RARITIES.indexOf(c.cardRarity) >= 0, c.cardRarity);
    check(p + 'startsUnlocked booleano', typeof c.startsUnlocked === 'boolean');
    if (c.startsUnlocked) unlockedCount++;

    /* stats */
    var st = c.stats || {};
    check(p + 'hp 90–150', isNum(st.hp) && st.hp >= 90 && st.hp <= 150, st.hp);
    check(p + 'pa = 6', st.pa === 6, st.pa);
    check(p + 'pp 3–4', st.pp === 3 || st.pp === 4, st.pp);
    check(p + 'initiative 10–90', isNum(st.initiative) && st.initiative >= 10 && st.initiative <= 90, st.initiative);
    check(p + 'power = 0', st.power === 0, st.power);
    check(p + 'dodge 0–40', isNum(st.dodge) && st.dodge >= 0 && st.dodge <= 40, st.dodge);
    check(p + 'lock 0–40', isNum(st.lock) && st.lock >= 0 && st.lock <= 40, st.lock);
    check(p + 'resists com os 5 elementos',
      !!st.resists && ELEMENTS.every(function (e) { return isNum(st.resists[e]); }));
    check(p + 'sem campo pm em stats', !has(st, 'pm'));

    /* baseSpells */
    var bs = c.baseSpells || [];
    check(p + 'exatamente 3 baseSpells', bs.length === 3, 'tem ' + bs.length);
    bs.forEach(function (sid, i) {
      var s = D.spells[sid];
      check(p + 'baseSpell[' + i + '] ' + sid + ' existe', !!s);
      if (!s) return;
      referenced[sid] = true;
      check(p + 'baseSpell ' + sid + ' é neutro', s.element === 'neutro', s.element);
      check(p + 'baseSpell ' + sid + ' unlockLevel 0', s.unlockLevel === 0, s.unlockLevel);
      check(p + 'baseSpell ' + sid + ' classId ' + cid, s.classId === cid, s.classId);
    });

    /* paths */
    var paths = c.paths || {};
    check(p + 'tem os 4 caminhos elementais',
      PATH_ELEMENTS.every(function (e) { return !!paths[e]; }) && Object.keys(paths).length === 4,
      Object.keys(paths).join(','));
    PATH_ELEMENTS.forEach(function (el) {
      var arr = paths[el] || [];
      check(p + 'caminho ' + el + ' com 6 feitiços', arr.length === 6, 'tem ' + arr.length);
      arr.forEach(function (sid, i) {
        var s = D.spells[sid];
        check(p + el + '[' + i + '] ' + sid + ' existe', !!s);
        if (!s) return;
        referenced[sid] = true;
        check(p + el + ' ' + sid + ' element == ' + el, s.element === el, s.element);
        check(p + el + ' ' + sid + ' classId == ' + cid, s.classId === cid, s.classId);
        check(p + el + ' ' + sid + ' unlockLevel == ' + TIERS[i], s.unlockLevel === TIERS[i], s.unlockLevel);
      });
    });

    perClassSpells[cid] = bs.length + PATH_ELEMENTS.reduce(function (n, e) { return n + (paths[e] || []).length; }, 0);
    check(p + 'total de 27 feitiços (3 + 4×6)', perClassSpells[cid] === 27, perClassSpells[cid]);
  });

  check('exatamente 2 classes com startsUnlocked', unlockedCount === 2, 'tem ' + unlockedCount);
  STARTERS.forEach(function (cid) {
    check('classe inicial é ' + cid + ' (adendo v2.1)', !!D.classes[cid] && D.classes[cid].startsUnlocked === true);
  });
  CLASS_IDS.forEach(function (cid) {
    if (STARTERS.indexOf(cid) >= 0) return;
    check('classe ' + cid + ' começa travada', !!D.classes[cid] && D.classes[cid].startsUnlocked === false);
  });

  /* =============================================== 3. contagem de feitiços = */
  var refCount = Object.keys(referenced).length;
  check('feitiços jogáveis = 27 por classe (3 neutros + 4 caminhos × 6)', refCount === (CLASS_IDS.length * 27), 'tem ' + refCount);

  var trapPayloadIds = {};
  spellIds.forEach(function (sid) {
    var s = D.spells[sid];
    (s.effects || []).forEach(function (ef) {
      if (ef && ef.type === 'trap' && ef.trapId) trapPayloadIds[ef.trapId] = true;
    });
  });
  var orphans = spellIds.filter(function (sid) { return !referenced[sid] && !trapPayloadIds[sid]; });
  check('nenhum feitiço órfão (não referenciado por classe nem por armadilha)', orphans.length === 0, orphans.join(', '));

  /* ================================================= 4. cada feitiço ======= */
  var nameSeen = {}, dupNames = [];
  spellIds.forEach(function (sid) {
    var s = D.spells[sid];
    var p = 'spell ' + sid + ' ';
    var isTrapPayload = !!trapPayloadIds[sid] && !referenced[sid];

    check(p + 'id == chave', s.id === sid, s.id);
    ['name', 'description', 'flavor', 'fxKey'].forEach(function (f) { check(p + 'campo ' + f, isStr(s[f])); });
    check(p + 'element válido', ELEMENTS.indexOf(s.element) >= 0, s.element);
    check(p + 'classId de classe existente', s.classId === null || CLASS_IDS.indexOf(s.classId) >= 0, s.classId);
    check(p + 'unlockLevel numérico', isNum(s.unlockLevel) && s.unlockLevel >= 0 && s.unlockLevel <= 30, s.unlockLevel);
    if (!isTrapPayload && s.unlockLevel !== 0) {
      check(p + 'unlockLevel é um tier', TIERS.indexOf(s.unlockLevel) >= 0, s.unlockLevel);
    }

    /* custos */
    if (isTrapPayload) {
      check(p + 'carga de armadilha custa 0 PA', s.paCost === 0, s.paCost);
    } else {
      check(p + 'paCost 2–6', isNum(s.paCost) && s.paCost >= 2 && s.paCost <= 6, s.paCost);
    }
    check(p + 'cooldown 0–5', isNum(s.cooldown) && s.cooldown >= 0 && s.cooldown <= 5, s.cooldown);
    check(p + 'castsPerTurn 0–3', isNum(s.castsPerTurn) && s.castsPerTurn >= 0 && s.castsPerTurn <= 3, s.castsPerTurn);

    /* alcance / área */
    var r = s.range || {};
    check(p + 'range completo',
      isNum(r.min) && isNum(r.max) && typeof r.line === 'boolean' &&
      typeof r.los === 'boolean' && typeof r.movable === 'boolean');
    check(p + 'range coerente (0 ≤ min ≤ max ≤ 10)', r.min >= 0 && r.min <= r.max && r.max <= 10, r.min + '–' + r.max);
    var a = s.aoe || {};
    check(p + 'aoe válido', SHAPES.indexOf(a.shape) >= 0 && isNum(a.size) && a.size >= 0, a.shape + '/' + a.size);
    check(p + 'aoe single ⇒ size 0', a.shape !== 'single' || a.size === 0, a.size);
    check(p + 'needsEmptyTile booleano', typeof s.needsEmptyTile === 'boolean');
    check(p + 'targetSide válido', SIDES.indexOf(s.targetSide) >= 0, s.targetSide);
    check(p + 'targetSide self ⇒ alcance 0', s.targetSide !== 'self' || (r.min === 0 && r.max === 0), r.min + '–' + r.max);
    check(p + 'aoe line ⇒ range.line', a.shape !== 'line' || r.line === true);

    /* efeitos */
    var effs = s.effects;
    check(p + 'effects é lista não vazia', Object.prototype.toString.call(effs) === '[object Array]' && effs.length > 0);
    (effs || []).forEach(function (ef, i) {
      var q = p + 'efeito[' + i + '] ';
      var req = EFFECT_REQ[ef && ef.type];
      check(q + 'tipo do vocabulário fechado', !!req, ef && ef.type);
      if (!req) return;
      req.forEach(function (f) {
        var ok = has(ef, f) && ef[f] !== null && ef[f] !== undefined;
        if (ok && NUM_FIELDS[f]) ok = isNum(ef[f]);
        check(q + ef.type + ' campo ' + f, ok, ef[f]);
      });
      if (has(ef, 'element')) check(q + 'element válido', ELEMENTS.indexOf(ef.element) >= 0, ef.element);
      if (has(ef, 'min') && has(ef, 'max')) check(q + 'min ≤ max', ef.min <= ef.max, ef.min + '–' + ef.max);
      if (ef.type === 'buff') check(q + 'stat válido', BUFF_STATS.indexOf(ef.stat) >= 0, ef.stat);
      if (ef.type === 'weatherShift') check(q + 'weather válido', WEATHERS.indexOf(ef.weather) >= 0, ef.weather);
      if (ef.type === 'cleanse') {
        check(q + 'kinds é lista não vazia',
          Object.prototype.toString.call(ef.kinds) === '[object Array]' && ef.kinds.length > 0);
        (ef.kinds || []).forEach(function (k) {
          check(q + 'kind "' + k + '" pertence ao vocabulário', !!EFFECT_REQ[k], k);
        });
      }
      if (ef.type === 'trap') check(q + 'trapId ' + ef.trapId + ' existe em DATA.spells', !!D.spells[ef.trapId]);
      if (ef.type === 'summon') check(q + 'monsterId é string', isStr(ef.monsterId), ef.monsterId);
      if (ef.type === 'mark') check(q + 'mark value 5 / max ≤ 5', ef.value === 5 && ef.max <= 5, ef.value + '/' + ef.max);
      if (ef.type === 'reflect') check(q + 'reflect pct 1–100', ef.pct > 0 && ef.pct <= 100, ef.pct);
      if (ef.type === 'chain') check(q + 'chain falloff 0–1 e jumps 1–6', ef.falloff > 0 && ef.falloff < 1 && ef.jumps >= 1 && ef.jumps <= 6, ef.jumps + '/' + ef.falloff);
      if (ef.type === 'push' || ef.type === 'pull') check(q + 'tiles 1–6', ef.tiles >= 1 && ef.tiles <= 6, ef.tiles);
    });

    /* nomes distintos entre feitiços jogáveis */
    if (!isTrapPayload) {
      if (nameSeen[s.name]) dupNames.push(s.name); else nameSeen[s.name] = true;
    }
  });
  check('nomes de feitiços jogáveis são todos distintos', dupNames.length === 0, dupNames.join(', '));

  /* ============================================ 5. sanidade de balanceamento */
  var dmgOut = [], healOut = [];
  spellIds.forEach(function (sid) {
    var s = D.spells[sid];
    if (!s.paCost) return;
    var effs = s.effects || [];
    var onlyDamage = effs.length >= 1 && effs.every(function (e) {
      return e.type === 'damage' || e.type === 'push' || e.type === 'pull' || e.type === 'root' || e.type === 'mark';
    });
    var dmg = effs.filter(function (e) { return e.type === 'damage'; });
    if (onlyDamage && dmg.length === 1 && s.aoe.shape === 'single') {
      var perPa = ((dmg[0].min + dmg[0].max) / 2) / s.paCost;
      if (perPa < 4 || perPa > 20) dmgOut.push(sid + ' (' + perPa.toFixed(1) + '/PA)');
    }
    var heals = effs.filter(function (e) { return e.type === 'heal'; });
    if (heals.length === 1) {
      var hPa = ((heals[0].min + heals[0].max) / 2) / s.paCost;
      if (hPa < 6 || hPa > 16) healOut.push(sid + ' (' + hPa.toFixed(1) + '/PA)');
    }
  });
  check('dano alvo único dentro de 4–20 por PA', dmgOut.length === 0, dmgOut.join(', '));
  check('cura dentro de 6–16 por PA', healOut.length === 0, healOut.join(', '));

  /* escala: o feitiço de nível 30 tem de valer MUITO mais que o de nível 5 do mesmo
   * caminho (alvo ~2,2×; piso de 1,7×). Peso = soma dos efeitos × fator de área.
   * Caminhos cujo topo ou base é uma INVOCAÇÃO ficam de fora: a força da criatura
   * mora em DATA.monsters (outro dono) e não é mensurável aqui. */
  function spellWeight(s, depth) {
    var t = 0;
    (s.effects || []).forEach(function (e) {
      switch (e.type) {
        case 'damage': case 'heal': t += (e.min + e.max) / 2; break;
        case 'poison': case 'regen': t += (e.min + e.max) / 2 * e.duration; break;
        case 'shield': t += e.value; break;
        case 'chain': t += (e.min + e.max) / 2 * (1 + e.jumps * (1 - e.falloff)); break;
        case 'detonateMarks': t += e.mult * 5; break;
        case 'buff': t += Math.abs(e.value) * e.duration * 0.6; break;
        case 'resist': t += e.value * e.duration * 0.6; break;
        case 'reflect': t += e.pct * e.duration * 0.5; break;
        case 'mark': t += 8; break;
        case 'summon': t += 90; break;
        case 'trap': t += (depth < 1 && D.spells[e.trapId]) ? spellWeight(D.spells[e.trapId], depth + 1) : 30; break;
        default: t += 6; break;   // root, push, pull, taunt, cleanse, teleport, swap, moveTo, dispelShield, weatherShift
      }
    });
    var shape = s.aoe.shape, size = s.aoe.size;
    var af = shape === 'single' ? 1 : (shape === 'line' || shape === 'cone') ? 1.6 : (1 + 0.6 * Math.max(1, size));
    return t * af;
  }
  var scaleOut = [], scaleSkipped = [], scaleSeen = [];
  CLASS_IDS.forEach(function (cid) {
    var c = D.classes[cid]; if (!c) return;
    PATH_ELEMENTS.forEach(function (el) {
      var arr = (c.paths || {})[el] || [];
      var a5 = D.spells[arr[0]], a30 = D.spells[arr[5]];
      if (!a5 || !a30) return;
      var hasSummon = function (s) {
        return (s.effects || []).some(function (e) { return e.type === 'summon'; });
      };
      if (hasSummon(a5) || hasSummon(a30)) { scaleSkipped.push(cid + '/' + el); return; }
      var ratio = spellWeight(a30, 0) / Math.max(1, spellWeight(a5, 0));
      scaleSeen.push(cid + '/' + el + ' ×' + ratio.toFixed(1));
      if (ratio < 1.7) scaleOut.push(cid + '/' + el + ' ×' + ratio.toFixed(2));
    });
  });
  check('nível 30 vale ≥ 1,7× o nível 5 em todos os caminhos mensuráveis', scaleOut.length === 0, scaleOut.join(', '));
  check('caminhos com invocação no topo/base ficam fora da métrica (força vive em DATA.monsters)',
    scaleSkipped.length <= 4, scaleSkipped.join(', '));
  var capstoneBad = [];
  CLASS_IDS.forEach(function (cid) {
    PATH_ELEMENTS.forEach(function (el) {
      var s = D.spells[D.classes[cid].paths[el][5]];
      if (!s || s.paCost < 5) capstoneBad.push(cid + '/' + el + ' (' + (s && s.paCost) + ' PA)');
    });
  });
  check('capstone de nível 30 custa 5–6 PA nos 24 caminhos', capstoneBad.length === 0, capstoneBad.join(', '));

  /* ============================================== 6. leveling / cards ====== */
  var L = D.leveling;
  check('leveling.maxLevel = 30', L.maxLevel === 30, L.maxLevel);
  check('leveling.elementChoiceLevel = 5', L.elementChoiceLevel === 5, L.elementChoiceLevel);
  /* adendo v2.2 — dois ganhos por nível: genérico antes da escolha, elemental depois */
  check('leveling.perLevel {hp:5, power:3}',
    !!L.perLevel && L.perLevel.hp === 5 && L.perLevel.power === 3, JSON.stringify(L.perLevel));
  check('leveling.perLevelElement {hp:5, elemPower:3}',
    !!L.perLevelElement && L.perLevelElement.hp === 5 && L.perLevelElement.elemPower === 3,
    JSON.stringify(L.perLevelElement));
  check('perLevel sem elemPower e perLevelElement sem power (papéis distintos)',
    !!L.perLevel && !!L.perLevelElement &&
    L.perLevel.elemPower === undefined && L.perLevelElement.power === undefined);
  check('os dois ganhos dão o mesmo PV (+5 por nível, sempre)',
    !!L.perLevel && !!L.perLevelElement && L.perLevel.hp === L.perLevelElement.hp);

  /* simulação nível 1 → 30: níveis 2→5 usam perLevel; 6→30 usam perLevelElement */
  var sim = [], accHp = 0, accPower = 0, accElem = 0;
  for (var lv = 2; lv <= L.maxLevel; lv++) {
    var gain = (lv <= L.elementChoiceLevel) ? L.perLevel : L.perLevelElement;
    accHp += gain.hp || 0;
    accPower += gain.power || 0;
    accElem += gain.elemPower || 0;
    sim.push({ level: lv, hp: accHp, power: accPower, elemPower: accElem, xp: L.xpTable[lv - 1] });
  }
  var last = sim[sim.length - 1];
  check('simulação chega ao nível 30 com +145 PV', last.hp === 145, last.hp);
  check('simulação chega ao nível 30 com +12 de poder genérico', last.power === 12, last.power);
  check('simulação chega ao nível 30 com +75 de dano elemental', last.elemPower === 75, last.elemPower);
  check('multiplicador de dano no próprio elemento no nível 30 é 1,87×',
    Math.abs((100 + last.power + last.elemPower) / 100 - 1.87) < 0.001,
    ((100 + last.power + last.elemPower) / 100).toFixed(2));
  check('fora do elemento o nível 30 só ganha 1,12× (a escolha importa)',
    Math.abs((100 + last.power) / 100 - 1.12) < 0.001, ((100 + last.power) / 100).toFixed(2));
  check('nenhum nível da simulação perde PV ou dano', (function () {
    for (var i4 = 1; i4 < sim.length; i4++) {
      if (sim[i4].hp < sim[i4 - 1].hp || sim[i4].power < sim[i4 - 1].power ||
          sim[i4].elemPower < sim[i4 - 1].elemPower) return false;
    }
    return true;
  })());
  /* saúde contra os chefes (300 → 600 PV, entregues pelo Criativo Mundo):
   * o capstone mais forte, no nível 30 e no próprio elemento, não pode derrubar
   * um chefe sozinho nem virar irrelevante. */
  var bestCapstone = 0, bestCapstoneId = '';
  CLASS_IDS.forEach(function (cid) {
    PATH_ELEMENTS.forEach(function (el) {
      var s30 = D.spells[D.classes[cid].paths[el][5]];
      (s30.effects || []).forEach(function (e) {
        if (e.type === 'damage' && (e.min + e.max) / 2 > bestCapstone) {
          bestCapstone = (e.min + e.max) / 2; bestCapstoneId = s30.id;
        }
      });
    });
  });
  var capstoneAt30 = bestCapstone * (100 + last.power + last.elemPower) / 100;
  check('capstone mais forte no nível 30 fica entre 25% e 80% do chefe mais fraco (300 PV)',
    capstoneAt30 >= 75 && capstoneAt30 <= 240,
    bestCapstoneId + ' ≈ ' + Math.round(capstoneAt30) + ' de dano');
  check('capstone mais forte no nível 30 não passa de 40% do chefe final (600 PV)',
    capstoneAt30 <= 240, Math.round(capstoneAt30) + '/600');
  check('xpTable com 30 entradas', L.xpTable && L.xpTable.length === 30, L.xpTable && L.xpTable.length);
  check('xpTable[0] = 0', L.xpTable && L.xpTable[0] === 0, L.xpTable && L.xpTable[0]);
  var incOk = true, incBad = '';
  for (var i = 1; i < (L.xpTable || []).length; i++) {
    if (!(L.xpTable[i] > L.xpTable[i - 1])) { incOk = false; incBad = 'índice ' + i; break; }
  }
  check('xpTable estritamente crescente', incOk, incBad);
  var stepsOk = true, stepsBad = '';
  for (var j = 2; j < (L.xpTable || []).length; j++) {
    var s1 = L.xpTable[j] - L.xpTable[j - 1], s0 = L.xpTable[j - 1] - L.xpTable[j - 2];
    if (s1 < s0) { stepsOk = false; stepsBad = 'nível ' + (j + 1); break; }
  }
  check('degraus de XP não decrescem (curva suave)', stepsOk, stepsBad);

  /* ---------------- coleção de cartas e estrelas (adendo v2.1) ------------- */
  /* ============ progressão × profundidade (adendo v2.3) =================== */
  /* XP de GRUPO de uma descida completa (3 salas), medida somando os spawns de
   * dungeons.js com o `xp` de monsters.js. Se os dois arquivos estiverem carregados,
   * recalculamos ao vivo e comparamos: divergência > 20% significa que o Criativo Mundo
   * mexeu na XP e esta curva precisa ser recalibrada. */
  var DUNGEON_XP = [35.7, 104, 209.2, 374.3, 588.8, 944.9];
  var REC_LEVEL = [3, 7, 11, 16, 22, 28];
  var liveXp = null;
  if (D.dungeons && D.monsters && D.dungeons.length === 6) {
    liveXp = D.dungeons.map(function (dg) {
      var tot = 0;
      (dg.rooms || []).forEach(function (rm) {
        var counts = {};
        (rm.layout || []).forEach(function (line) {
          for (var i = 0; i < line.length; i++) {
            var ch = line[i];
            if (rm.monsters && rm.monsters[ch]) counts[ch] = (counts[ch] || 0) + 1;
          }
        });
        Object.keys(counts).forEach(function (ch) {
          var m = D.monsters[rm.monsters[ch]];
          tot += (m && m.xp ? m.xp : 0) * counts[ch];
        });
      });
      return tot;
    });
    D.dungeons.forEach(function (dg, i) {
      if (isNum(dg.recommendedLevel)) REC_LEVEL[i] = dg.recommendedLevel;
    });
    var drift = [];
    liveXp.forEach(function (v, i) {
      if (Math.abs(v - DUNGEON_XP[i]) > DUNGEON_XP[i] * 0.2) drift.push('D' + (i + 1) + ' ' + DUNGEON_XP[i] + '→' + v);
    });
    check('XP dos calabouços continua próxima da usada na calibragem da xpTable',
      drift.length === 0, drift.join(', ') + (drift.length ? ' — recalibrar xpTable' : ''));
    DUNGEON_XP = liveXp;
  } else {
    check('dungeons/monsters ausentes — usando a XP medida na calibragem', true, DUNGEON_XP.join(' · '));
  }

  /* --------- fúria da sala: antídoto contra empate por sustentação -------- */
  var RF = L.roomFury;
  check('leveling.roomFury existe', !!RF);
  if (RF) {
    check('roomFury.afterRound inteiro positivo',
      isNum(RF.afterRound) && RF.afterRound > 0 && RF.afterRound % 1 === 0, RF.afterRound);
    check('roomFury.maxRounds inteiro positivo',
      isNum(RF.maxRounds) && RF.maxRounds > 0 && RF.maxRounds % 1 === 0, RF.maxRounds);
    check('roomFury.afterRound < maxRounds (a fúria tem tempo de agir)',
      RF.afterRound < RF.maxRounds, RF.afterRound + ' < ' + RF.maxRounds);
    check('roomFury.powerPerRound > 0', isNum(RF.powerPerRound) && RF.powerPerRound > 0, RF.powerPerRound);
    check('roomFury.healCutPerRound entre 0 e 1',
      isNum(RF.healCutPerRound) && RF.healCutPerRound > 0 && RF.healCutPerRound <= 1, RF.healCutPerRound);
    /* a fúria não pode disparar dentro do combate normal (mediana medida: 5 rodadas)
     * nem demorar tanto que o empate nunca resolva */
    check('roomFury só começa bem depois do combate normal (afterRound ≥ 15)',
      RF.afterRound >= 15, RF.afterRound);
    check('roomFury zera a cura antes do fim da batalha',
      RF.afterRound + Math.ceil(1 / RF.healCutPerRound) <= RF.maxRounds,
      'cura zera na rodada ' + (RF.afterRound + Math.ceil(1 / RF.healCutPerRound)) + ' de ' + RF.maxRounds);
    check('roomFury acumula poder suficiente para resolver a sala (≥ +100 até o fim)',
      (RF.maxRounds - RF.afterRound) * RF.powerPerRound >= 100,
      '+' + (RF.maxRounds - RF.afterRound) * RF.powerPerRound + ' de poder na rodada ' + RF.maxRounds);
  }

  /* ---- §9-H: defesa de posição por nível, com ritmo por PAPEL --------------
   * A esquiva era estatística morta: igual no nível 1 e no 30, sem item nenhum
   * que a mexesse, contra fixação de monstro que vai de 4 a 55. A tabela abaixo
   * dá a cada PAPEL um destino no nível máximo; a base da classe continua sendo
   * o nível 1. Estas checagens guardam as três coisas que não podem quebrar:
   * (a) todo papel do elenco está na tabela; (b) as duas classes de esquiva
   * lideram e o tanque lidera a fixação; (c) ninguém encosta na fixação de
   * chefe — o chefe segurar é temático e fica de pé. */
  var DBR = L.defenseByRole;
  check('leveling.defenseByRole existe (§9-H)', !!DBR);
  if (DBR) {
    var papeis = {}, maiorEsquiva30 = 0, maiorFix30 = 0, donoEsquiva = '', donoFix = '';
    CLASS_IDS.forEach(function (cid) {
      var c = D.classes[cid];
      if (!c) return;
      papeis[c.role] = cid;
      var row = DBR[c.role];
      check('defenseByRole tem o papel "' + c.role + '" (classe ' + cid + ')', !!row);
      if (!row) return;
      check('defenseByRole.' + c.role + '.dodge inteiro 0–60',
        isNum(row.dodge) && row.dodge >= 0 && row.dodge <= 60 && row.dodge % 1 === 0, row.dodge);
      check('defenseByRole.' + c.role + '.lock inteiro 0–80',
        isNum(row.lock) && row.lock >= 0 && row.lock <= 80 && row.lock % 1 === 0, row.lock);
      check('defenseByRole.' + c.role + ': a esquiva do nível 30 não fica ABAIXO da base da classe',
        row.dodge >= c.stats.dodge, row.dodge + ' vs base ' + c.stats.dodge);
      check('defenseByRole.' + c.role + ': a fixação do nível 30 não fica ABAIXO da base da classe',
        row.lock >= c.stats.lock, row.lock + ' vs base ' + c.stats.lock);
      check('classe ' + cid + ': a esquiva CRESCE com o nível (deixou de ser estatística morta)',
        row.dodge > c.stats.dodge || row.lock > c.stats.lock,
        c.stats.dodge + '→' + row.dodge + ' · ' + c.stats.lock + '→' + row.lock);
      if (row.dodge > maiorEsquiva30) { maiorEsquiva30 = row.dodge; donoEsquiva = c.role; }
      if (row.lock > maiorFix30) { maiorFix30 = row.lock; donoFix = c.role; }
    });
    check('§9-H: quem mais esquiva no nível 30 é atirador ou assassino',
      donoEsquiva === 'atirador' || donoEsquiva === 'assassino', donoEsquiva + ' (' + maiorEsquiva30 + ')');
    check('§9-H: quem mais PRENDE no nível 30 é o tanque', donoFix === 'tanque',
      donoFix + ' (' + maiorFix30 + ')');
    if (DBR.tanque && DBR.atirador && DBR.assassino) {
      check('§9-H: o tanque tem a MENOR esquiva de nível 30 do elenco',
        Object.keys(papeis).every(function (r) {
          return r === 'tanque' || !DBR[r] || DBR[r].dodge > DBR.tanque.dodge;
        }), 'tanque ' + DBR.tanque.dodge);
      check('§9-H: as duas classes de esquiva passam das do meio',
        ['mago', 'suporte', 'invocador'].every(function (r) {
          return !DBR[r] || (DBR.atirador.dodge > DBR[r].dodge && DBR.assassino.dodge > DBR[r].dodge);
        }), 'atirador ' + DBR.atirador.dodge + ' · assassino ' + DBR.assassino.dodge);
      /* Teto: a fórmula do contrato (§2) é 0,35 + (esquiva − fixação)×0,02, com piso
       * 0,10 e teto 0,90. Com a fixação do chefe mais forte, ninguém pode chegar a
       * uma moeda honesta SEM equipamento — senão o chefe deixa de ser um compromisso. */
      var fixChefe = 55;
      if (D.monsters) {
        fixChefe = 0;
        Object.keys(D.monsters).forEach(function (mid) {
          var m = D.monsters[mid];
          if (m && m.boss && m.stats && m.stats.lock > fixChefe) fixChefe = m.stats.lock;
        });
        if (!fixChefe) fixChefe = 55;
      }
      var pior = 0, quem = '';
      Object.keys(papeis).forEach(function (r) {
        if (!DBR[r]) return;
        var c = 0.35 + (DBR[r].dodge - fixChefe) * 0.02 + 0.30;   // caso elemental mais generoso
        c = Math.max(0.10, Math.min(0.90, c));
        if (c > pior) { pior = c; quem = r; }
      });
      check('§9-H: contra o chefe mais forte (fixação ' + fixChefe + '), nenhum papel sem ' +
        'equipamento passa de 50% de escapar', pior <= 0.50,
        quem + ' ' + Math.round(pior * 100) + '%');
    }
  }

  var F = L.xpFalloff;
  check('leveling.xpFalloff existe', !!F);
  check('xpFalloff.graceLevels = 4', !!F && F.graceLevels === 4, F && F.graceLevels);
  check('xpFalloff.factorPerLevel = 0.75', !!F && F.factorPerLevel === 0.75, F && F.factorPerLevel);
  check('xpFalloff.floor = 0.10', !!F && Math.abs(F.floor - 0.10) < 1e-9, F && F.floor);
  check('xpFalloff coerente (0 < floor < factorPerLevel < 1, graça ≥ 1)',
    !!F && F.floor > 0 && F.floor < F.factorPerLevel && F.factorPerLevel < 1 && F.graceLevels >= 1);

  function xpMult(heroLevel, recommended) {
    if (!F) return 1;
    var over = heroLevel - (recommended + F.graceLevels);
    if (over <= 0) return 1;
    return Math.max(F.floor, Math.pow(F.factorPerLevel, over));
  }
  function stepTo(level) { return L.xpTable[level - 1] - L.xpTable[level - 2]; }   // XP para ir de level-1 a level
  function descentsPerLevel(di, heroLevel, party) {
    return stepTo(heroLevel + 1) / ((DUNGEON_XP[di] / party) * xpMult(heroLevel, REC_LEVEL[di]));
  }

  /* CASO DE REFERÊNCIA = SOLO. `game.js` faz `xpGanho = floor(xpTotal / partySize)`:
   * o solo leva a descida inteira e é, portanto, o TETO da progressão — é ele que precisa
   * ficar em ~1 nível por descida no começo. Medir pela dupla (como esta página fazia até
   * 17/08) deixava o solo subir ~1,9 nível por descida na Estufa. O `validate_world.html`
   * do Criativo Mundo usa a mesma referência; as duas páginas concordam.
   * Faixa aceita: ~1 descida por nível no começo, subindo até ~3 no fim. */
  var BANDS = [[0.7, 1.6], [1.0, 2.0], [1.3, 2.4], [1.6, 2.8], [2.0, 3.2], [2.4, 4.0]];
  var progression = [];
  for (var di = 0; di < 6; di++) {
    var lvl = REC_LEVEL[di];
    var duoD = descentsPerLevel(di, lvl, 2), soloD = descentsPerLevel(di, lvl, 1);
    progression.push({ d: di + 1, rec: lvl, xp: DUNGEON_XP[di], step: stepTo(lvl + 1), duo: duoD, solo: soloD });
    check('calabouço ' + (di + 1) + ' (nível ' + lvl + '): SOLO sobe 1 nível em ' +
      BANDS[di][0] + '–' + BANDS[di][1] + ' descidas',
      soloD >= BANDS[di][0] && soloD <= BANDS[di][1], soloD.toFixed(2) + ' descidas');
    check('calabouço ' + (di + 1) + ': a dupla precisa do dobro de descidas (XP dividida)',
      Math.abs(duoD - soloD * 2) < 0.01, 'solo ' + soloD.toFixed(2) + ' · dupla ' + duoD.toFixed(2));
  }
  var monoProg = true;
  for (var pi = 1; pi < progression.length; pi++) {
    if (progression[pi].solo < progression[pi - 1].solo) monoProg = false;
  }
  check('subir fica progressivamente mais caro a cada calabouço', monoProg,
    progression.map(function (r) { return 'D' + r.d + ' ' + r.solo.toFixed(2); }).join(' '));
  check('no começo (calabouço 1, nível recomendado) uma descida solo rende ~1 nível',
    Math.abs(progression[0].solo - 1) <= 0.35, progression[0].solo.toFixed(2));
  check('do nível 25 em diante uma descida solo rende ≈1/3 de nível (≥ 2,2 descidas)',
    descentsPerLevel(5, 28, 1) >= 2.2 && descentsPerLevel(4, 25, 1) >= 2.2,
    'D6@28 ' + descentsPerLevel(5, 28, 1).toFixed(2) + ' · D5@25 ' + descentsPerLevel(4, 25, 1).toFixed(2));

  /* moer o calabouço 1 até o nível 30 tem de ser absurdo; descer fundo, viável */
  function runsToThirty(fixedDungeon, party) {
    var xp = L.xpTable[2], lv = 3, runs = 0;   // começa no nível 3, o recomendado do calabouço 1
    while (lv < L.maxLevel && runs < 100000) {
      var di2 = (fixedDungeon >= 0) ? fixedDungeon : (function () {
        var best = 0;
        for (var k = 0; k < 6; k++) { if (lv >= REC_LEVEL[k]) best = k; }
        return best;
      })();
      xp += (DUNGEON_XP[di2] / party) * xpMult(lv, REC_LEVEL[di2]);
      runs++;
      while (lv < L.maxLevel && xp >= L.xpTable[lv]) lv++;
    }
    return runs;
  }
  var grindD1duo = runsToThirty(0, 2), grindD1solo = runsToThirty(0, 1);
  var deepDuo = runsToThirty(-1, 2), deepSolo = runsToThirty(-1, 1);
  check('moer só o calabouço 1 até o nível 30 é proibitivo (> 300 descidas, mesmo solo)',
    grindD1solo > 300, grindD1solo + ' descidas solo · ' + grindD1duo + ' em dupla');
  check('descer sempre no calabouço mais fundo liberado leva 30–120 descidas (solo)',
    deepSolo >= 30 && deepSolo <= 120, deepSolo + ' descidas solo · ' + deepDuo + ' em dupla');
  check('profundidade é pelo menos 5× mais eficiente que moer o calabouço 1',
    grindD1solo / deepSolo >= 5, (grindD1solo / deepSolo).toFixed(1) + '×');
  check('solo chega ao 30 mais rápido que a dupla, nos dois cenários',
    deepSolo < deepDuo && grindD1solo < grindD1duo, deepSolo + '/' + deepDuo);

  /* TRIPWIRE DA TABELA CONGELADA — a `xpTable` foi congelada por coordenação (18/08):
   * ela e o `xp` dos monstros descrevem a mesma economia por pontas opostas, e mexer
   * num lado sozinho derruba a validação do outro dono. Se este teste falhar, alguém
   * (inclusive eu) alterou a curva fora de uma rodada coordenada. */
  var FROZEN_XP_TABLE = [0, 15, 40, 75, 125, 195, 295, 435, 615, 845, 1145, 1525, 1965,
    2485, 3095, 3805, 4635, 5555, 6580, 7705, 8955, 10355, 11905, 13605, 15480, 17555,
    19830, 22355, 25130, 28180];
  check('xpTable continua CONGELADA nos valores acordados (não alterar sem rodada coordenada)',
    L.xpTable.length === FROZEN_XP_TABLE.length &&
    L.xpTable.every(function (v, i) { return v === FROZEN_XP_TABLE[i]; }),
    'total ' + L.xpTable[L.xpTable.length - 1] + ' (esperado ' + FROZEN_XP_TABLE[29] + ')');

  var cardIds = Object.keys(D.cards);
  check('cards cobre todas as classes', cardIds.length === CLASS_IDS.length &&
    CLASS_IDS.every(function (c) { return !!D.cards[c]; }), cardIds.join(','));
  cardIds.forEach(function (cid) {
    var cd = D.cards[cid], cls = D.classes[cid];
    var p = 'card ' + cid + ' ';
    check(p + 'unlockCost = ' + UNLOCK_COST[cid] + ' (fixado pelo usuário)', cd.unlockCost === UNLOCK_COST[cid], cd.unlockCost);
    check(p + 'classe inicial (startsUnlocked) custa 5; as outras, 10 ou mais',
      !!cls && (cls.startsUnlocked === true ? cd.unlockCost === 5 : cd.unlockCost >= 10),
      cd.unlockCost + '/' + (cls && cls.startsUnlocked));
    check(p + 'dropWeight > 0 (excedente vira estrela, nenhuma carta é inútil)',
      isNum(cd.dropWeight) && cd.dropWeight > 0, cd.dropWeight);
    check(p + 'minDungeon 0–5', isNum(cd.minDungeon) && cd.minDungeon >= 0 && cd.minDungeon <= 5, cd.minDungeon);
    check(p + 'starCosts com 5 entradas', !!cd.starCosts && cd.starCosts.length === 5, cd.starCosts && cd.starCosts.length);
    check(p + 'starCosts = [5,15,35,65,110] (a escada de 30/08)', !!cd.starCosts && cd.starCosts.join(',') === '5,15,35,65,110',
      cd.starCosts && cd.starCosts.join(','));
    var scOk = true;
    for (var k = 1; k < (cd.starCosts || []).length; k++) {
      if (!(cd.starCosts[k] > cd.starCosts[k - 1])) scOk = false;
    }
    check(p + 'starCosts estritamente crescente', scOk, cd.starCosts && cd.starCosts.join(','));
    check(p + 'starCosts com ' + (D.stars ? D.stars.max : '?') + ' degraus (= DATA.stars.max)',
      !!D.stars && cd.starCosts.length === D.stars.max);
    if (cls) {
      check(p + 'raridade coerente com o custo',
        (cd.unlockCost <= 5 && cls.cardRarity === 'comum') ||
        (cd.unlockCost > 5 && cd.unlockCost <= 10 && cls.cardRarity === 'raro') ||
        (cd.unlockCost > 10 && cls.cardRarity === 'epico'),
        cd.unlockCost + '/' + cls.cardRarity);
    }
  });
  /* classe mais cara ⇒ nunca mais rasa nem mais leve que uma mais barata */
  var ordered = cardIds.slice().sort(function (a, b) { return D.cards[a].unlockCost - D.cards[b].unlockCost; });
  var monoDepth = true, monoWeight = true;
  for (var oi = 1; oi < ordered.length; oi++) {
    var prev = D.cards[ordered[oi - 1]], cur = D.cards[ordered[oi]];
    if (cur.minDungeon < prev.minDungeon) monoDepth = false;
    if (cur.dropWeight < prev.dropWeight) monoWeight = false;
  }
  check('quanto mais cara a classe, mais fundo o calabouço mínimo', monoDepth,
    ordered.map(function (c) { return c + ':' + D.cards[c].minDungeon; }).join(' '));
  check('quanto mais cara a classe, maior o peso de saque (evita moagem infinita)', monoWeight,
    ordered.map(function (c) { return c + ':' + D.cards[c].dropWeight; }).join(' '));

  /* ------------------------------- DATA.stars ----------------------------- */
  check('DATA.stars existe', !!D.stars);
  if (D.stars) {
    check('stars.max = 5', D.stars.max === 5, D.stars.max);
    check('stars.bonuses existe', !!D.stars.bonuses);
    var STAR_FIELDS = ['hp', 'pa', 'pp', 'power', 'dodge', 'lock', 'initiative', 'resists'];
    for (var s = 1; s <= 5; s++) {
      var b = D.stars.bonuses && D.stars.bonuses[s];
      var q = 'estrela ★' + s + ' ';
      check(q + 'tem bônus definido', !!b && Object.keys(b).length > 0);
      if (!b) continue;
      Object.keys(b).forEach(function (f) {
        check(q + 'campo ' + f + ' pertence ao vocabulário de stats', STAR_FIELDS.indexOf(f) >= 0, f);
        if (f === 'resists') {
          check(q + 'resists com elementos válidos', Object.keys(b[f]).every(function (e) {
            return ELEMENTS.indexOf(e) >= 0 && isNum(b[f][e]);
          }));
        } else {
          check(q + 'campo ' + f + ' numérico e positivo', isNum(b[f]) && b[f] > 0, b[f]);
        }
      });
    }
    var b3 = D.stars.bonuses[3] || {}, b5 = D.stars.bonuses[5] || {}, b1 = D.stars.bonuses[1] || {};
    check('★1 dá bônus de vida (pedido do usuário)', b1.hp > 0, b1.hp);
    check('★3 dá +1 PP fixo (pedido do usuário)', b3.pp === 1, b3.pp);
    check('★5 dá +1 PA fixo (pedido do usuário)', b5.pa === 1, b5.pa);
    check('★3 não dá PA nem ★5 dá PP (os dois prêmios são distintos)',
      b3.pa === undefined && b5.pp === undefined);
    check('nenhuma estrela concede mais de +1 PA ou +1 PP', (function () {
      for (var i2 = 1; i2 <= 5; i2++) {
        var bb = D.stars.bonuses[i2] || {};
        if ((bb.pa || 0) > 1 || (bb.pp || 0) > 1) return false;
      }
      return true;
    })());
    var totalPa = 0, totalPp = 0;
    for (var i3 = 1; i3 <= 5; i3++) {
      var bb2 = D.stars.bonuses[i3] || {};
      totalPa += bb2.pa || 0; totalPp += bb2.pp || 0;
    }
    check('trilha completa concede no máximo +1 PA e +1 PP', totalPa === 1 && totalPp === 1, totalPa + ' PA / ' + totalPp + ' PP');
  }

  /* =================================================== 7. proibição de "pm"  */
  var pmHits = [];
  (function walk(node, path) {
    if (node === null || node === undefined) return;
    if (typeof node === 'string') { if (PM_RE.test(node)) pmHits.push(path + ' = "' + node + '"'); return; }
    if (typeof node !== 'object') return;
    for (var k in node) {
      if (!Object.prototype.hasOwnProperty.call(node, k)) continue;
      if (/^pm$/i.test(k)) pmHits.push(path + '.' + k + ' (chave)');
      walk(node[k], path + '.' + k);
    }
  })({ classes: D.classes, spells: D.spells, leveling: D.leveling, cards: D.cards, unlockTiers: D.unlockTiers }, 'DATA');
  check('nenhuma menção a "pm" nos dados (só PA/PP)', pmHits.length === 0, pmHits.slice(0, 5).join(' | '));

  /* varredura do código-fonte (só funciona por http; em file:// é pulada) */
  var srcScan = { done: false, hits: [] };
  ['../js/core/data/classes.js', '../js/core/data/spells.js', '../js/core/data/progression.js'].forEach(function (f) {
    try {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', f + '?v=' + window.__V, false);
      xhr.send(null);
      if (xhr.status === 200 || xhr.status === 0 && xhr.responseText) {
        srcScan.done = true;
        var txt = xhr.responseText || '';
        var m = txt.match(/\bpm\b/i);
        if (m) srcScan.hits.push(f);
      }
    } catch (e) { /* file:// bloqueia XHR síncrono — checagem de dados acima já cobre */ }
  });
  if (srcScan.done) {
    check('nenhuma menção a "pm" no código-fonte dos 3 arquivos', srcScan.hits.length === 0, srcScan.hits.join(', '));
  } else {
    check('varredura do código-fonte (pulada em file://) — dados já validados', true, 'skip');
  }

  /* ================================================= 8. inventário (info) == */
  function buildReport() {
    var html = '';
    var byEffect = {};
    spellIds.forEach(function (sid) {
      (D.spells[sid].effects || []).forEach(function (e) { byEffect[e.type] = (byEffect[e.type] || 0) + 1; });
    });

    html += '<h2>Classes</h2><table><tr><th>id</th><th>papel</th><th>PV</th><th>PA</th><th>PP</th>' +
      '<th>ini</th><th>esq</th><th>fix</th><th>inicial</th><th>carta</th><th>feitiços</th></tr>';
    CLASS_IDS.forEach(function (cid) {
      var c = D.classes[cid], s = c.stats;
      html += '<tr><td>' + cid + '</td><td>' + c.role + '</td><td>' + s.hp + '</td><td>' + s.pa + '</td><td>' + s.pp +
        '</td><td>' + s.initiative + '</td><td>' + s.dodge + '</td><td>' + s.lock + '</td><td>' +
        (c.startsUnlocked ? 'sim' : 'não') + '</td><td>' + c.cardRarity + '</td><td>' + perClassSpells[cid] + '</td></tr>';
    });
    html += '</table>';

    html += '<h2>Coleção — cartas e estrelas</h2><table><tr><th>classe</th><th>libera com</th>' +
      '<th>peso</th><th>calabouço mín.</th><th>★1</th><th>★2</th><th>★3</th><th>★4</th><th>★5</th><th>total ★5</th></tr>';
    CLASS_IDS.slice().sort(function (a, b) { return D.cards[a].unlockCost - D.cards[b].unlockCost; }).forEach(function (cid) {
      var cd = D.cards[cid];
      html += '<tr><td>' + cid + '</td><td>' + (cd.unlockCost === 0 ? 'inicial' : cd.unlockCost + ' cartas') +
        '</td><td>' + cd.dropWeight + '</td><td>' + cd.minDungeon + '</td>';
      cd.starCosts.forEach(function (sc) { html += '<td>' + (cd.unlockCost + sc) + '</td>'; });
      html += '<td>' + (cd.unlockCost + cd.starCosts[4]) + ' cartas</td></tr>';
    });
    html += '</table>';

    if (D.stars) {
      html += '<h2>Bônus de estrela (fixos e permanentes)</h2><ul class="info">';
      for (var st2 = 1; st2 <= D.stars.max; st2++) {
        var bb3 = D.stars.bonuses[st2] || {};
        html += '<li>★' + st2 + ' · ' + Object.keys(bb3).map(function (k) { return '+' + bb3[k] + ' ' + k; }).join(', ') + '</li>';
      }
      html += '</ul>';
    }

    html += '<h2>Progressão do nível 1 ao 30 (adendo v2.2)</h2>' +
      '<div class="info">Níveis 2→5 usam <code>perLevel</code> (poder genérico); 6→30 usam ' +
      '<code>perLevelElement</code> (dano no elemento escolhido). Multiplicador = (100 + poder + elemental)/100, ' +
      'e o elemental só entra em feitiço do elemento do herói.</div>' +
      '<table><tr><th>nível</th><th>XP acumulada</th><th>+PV</th><th>+poder</th><th>+elemental</th>' +
      '<th>× no elemento</th><th>× fora dele</th></tr>';
    html += '<tr><td>1</td><td>0</td><td>0</td><td>0</td><td>0</td><td>1.00×</td><td>1.00×</td></tr>';
    sim.forEach(function (row) {
      html += '<tr><td>' + row.level + '</td><td>' + row.xp + '</td><td>+' + row.hp + '</td><td>+' + row.power +
        '</td><td>+' + row.elemPower + '</td><td>' + ((100 + row.power + row.elemPower) / 100).toFixed(2) + '×</td><td>' +
        ((100 + row.power) / 100).toFixed(2) + '×</td></tr>';
    });
    html += '</table>';

    html += '<h2>Subir de nível × profundidade (adendo v2.3)</h2>' +
      '<div class="info">Descida completa = 3 salas. <code>game.js</code> divide a XP pelo tamanho do grupo, ' +
      'então o <b>solo</b> leva a descida inteira e é o caso de referência (o teto); a dupla leva metade por herói. ' +
      'Falloff: ×1,0 até nível recomendado +' + (F ? F.graceLevels : '?') + ', depois ×' +
      (F ? F.factorPerLevel : '?') + ' por nível, piso ×' + (F ? F.floor : '?') + '.</div>' +
      '<table><tr><th>calabouço</th><th>nível rec.</th><th>XP da descida (grupo)</th>' +
      '<th>XP do próximo nível</th><th>descidas p/ 1 nível — SOLO</th><th>— dupla</th>' +
      '<th>níveis por descida (solo)</th></tr>';
    progression.forEach(function (r) {
      html += '<tr><td>' + r.d + '</td><td>' + r.rec + '</td><td>' + r.xp + '</td><td>' + r.step +
        '</td><td><b>' + r.solo.toFixed(2) + '</b></td><td>' + r.duo.toFixed(2) + '</td><td>' +
        (1 / r.solo).toFixed(2) + '</td></tr>';
    });
    html += '</table><ul class="info">' +
      '<li>Moendo <b>só o calabouço 1</b> do nível 3 ao 30: <b>' + grindD1solo + '</b> descidas solo · ' + grindD1duo + ' em dupla.</li>' +
      '<li>Descendo sempre no <b>calabouço mais fundo liberado</b>: <b>' + deepSolo + '</b> descidas solo · ' + deepDuo + ' em dupla.</li>' +
      '<li>Profundidade é <b>' + (grindD1solo / deepSolo).toFixed(1) + '× mais eficiente</b> que repetir o raso.</li>' +
      '<li>XP total do nível 1 ao 30: <b>' + L.xpTable[29] + '</b> — <b>tabela congelada</b> (18/08): só muda em rodada coordenada com <code>monsters.js</code>.</li></ul>';

    html += '<h2>PV total por classe no nível 30 (base + ' + last.hp + ')</h2><ul class="info">';
    CLASS_IDS.forEach(function (cid) {
      html += '<li>' + cid + ': ' + D.classes[cid].stats.hp + ' → <b>' + (D.classes[cid].stats.hp + last.hp) +
        ' PV</b> (com ★5: ' + (D.classes[cid].stats.hp + last.hp + 40) + ')</li>';
    });
    html += '</ul>';

    html += '<h2>Uso dos tipos de efeito (' + spellIds.length + ' entradas em DATA.spells)</h2><ul class="info">';
    Object.keys(byEffect).sort().forEach(function (k) { html += '<li>' + k + ': ' + byEffect[k] + '</li>'; });
    html += '</ul>';

    var monsters = {};
    spellIds.forEach(function (sid) {
      (D.spells[sid].effects || []).forEach(function (e) { if (e.type === 'summon') monsters[e.monsterId] = true; });
    });
    html += '<h2>Dependência externa — ids de criatura esperados em DATA.monsters</h2><ul class="info"><li>' +
      Object.keys(monsters).sort().join(' · ') + '</li></ul>';

    html += '<h2>Feitiços de nível 30</h2><table><tr><th>classe</th><th>elemento</th><th>nome</th><th>PA</th><th>recarga</th></tr>';
    CLASS_IDS.forEach(function (cid) {
      PATH_ELEMENTS.forEach(function (el) {
        var s = D.spells[D.classes[cid].paths[el][5]];
        html += '<tr><td>' + cid + '</td><td>' + el + '</td><td>' + s.name + '</td><td>' + s.paCost + '</td><td>' + s.cooldown + '</td></tr>';
      });
    });
    html += '</table>';
    document.getElementById('report').innerHTML = html;
  }

  /* ==================================================== render dos testes == */
  function render() {
    var passed = 0, failed = 0, failures = [];
    var allHtml = '', failHtml = '';
    for (var i = 0; i < results.length; i++) {
      var r = results[i];
      var line = r.name + (r.detail ? ' — ' + r.detail : '');
      if (r.ok) {
        passed++;
        allHtml += '<li class="pass">PASS · ' + line + '</li>';
      } else {
        failed++;
        failures.push(line);
        allHtml += '<li class="fail">FAIL · ' + line + '</li>';
        failHtml += '<li class="fail">FAIL · ' + line + '</li>';
      }
    }
    var sum = document.getElementById('summary');
    sum.className = failed === 0 ? 'ok' : 'bad';
    sum.textContent = (failed === 0 ? '100% PASS · ' : 'FALHOU · ') + passed + ' checagens OK, ' + failed + ' falhas';
    document.getElementById('failList').innerHTML = failed ? '<h2>Falhas</h2><ul>' + failHtml + '</ul>' : '';
    document.getElementById('allList').innerHTML = allHtml;
    window.TEST_RESULTS = { passed: passed, failed: failed, failures: failures };
    if (failed) console.error('validate_classes: ' + failed + ' falhas', failures);
    else console.log('validate_classes: 100% PASS (' + passed + ' checagens)');
  }

  try { buildReport(); } catch (e) { check('montagem do inventário', false, e.message); }
  render();
})();
</script>
</body>
</html>
