<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>prova: a coroa 3D na praça</title>
<style>html,body{margin:0;height:100%;background:#0f1216}iframe{width:100%;height:100%;border:0}</style>
</head>
<body>
<!-- PÁGINA DE PROVA (foto): a coroa do ranking em 3D girando acima da cabeça
     na praça (30/08) — Coroa IX (1850 pts, sem exigir topo), no lugar do
     bilhete PNG. -->
<iframe id="f" src="../index.html?prova-coroa"></iframe>
<script>
var f = document.getElementById('f');
f.onload = function () {
  var w = f.contentWindow, d = w.document;
  var t0 = Date.now();
  (function espera() {
    var menu = d.querySelector('.screen-menu.is-on');
    if (!menu && Date.now() - t0 < 40000) return setTimeout(espera, 800);
    try {
      w.JOGO.DB.definirBrasa(1850, 12);
      w.JOGO.DB.batizar('Rainha da Arena').then(function () {
        w.JOGO.UI.showScreen('hub');
        setTimeout(function () { window.__pronto = true; }, 2500);
      });
    } catch (e) { document.title = 'ERRO ' + e.message; }
  })();
};
</script>
</body>
</html>
