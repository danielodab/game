<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>prova: o cais do Acampamento</title>
<style>html,body{margin:0;height:100%;background:#0f1216}iframe{width:100%;height:100%;border:0}</style>
</head>
<body>
<!-- PÁGINA DE PROVA (foto, não teste): abre o jogo num iframe e entra no
     Acampamento, para a foto sair com o CAIS — o menu inferior centralizado
     que substituiu o "Personagens" de abas (pedido do usuário, 25/08). -->
<iframe id="f" src="../index.html?prova-cais"></iframe>
<script>
var f = document.getElementById('f');
f.onload = function () {
  var w = f.contentWindow, d = w.document;
  var t0 = Date.now();
  (function espera() {
    var menu = d.querySelector('.screen-menu.is-on');
    if (!menu && Date.now() - t0 < 40000) return setTimeout(espera, 800);
    try { w.JOGO.UI.showScreen('hub'); } catch (e) { document.title = 'ERRO ' + e.message; }
    setTimeout(function () { window.__pronto = true; }, 1500);
  })();
};
</script>
</body>
</html>
