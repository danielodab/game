<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>prova: o Traje do Colecionador vestido</title>
<style>html,body{margin:0;height:100%;background:#0f1216}iframe{width:100%;height:100%;border:0}</style>
</head>
<body>
<!-- PÁGINA DE PROVA (foto): o Bárbaro com as quatro peças do Traje do
     Colecionador vestidas (03/09) — a arte do cavaleiro branco e ouro da
     pasta icones itens/raro nos slots, com os nomes novos (Lâmina Alva,
     Grevas de Marfim, Couraça do Cavaleiro Branco, Selo Primeiro). -->
<iframe id="f" src="../index.html?prova-colecionador"></iframe>
<script>
var f = document.getElementById('f');
f.onload = function () {
  // roda uma vez só; e ATENÇÃO ao fotografar: o perfil do Chrome headless
  // guarda o save entre fotos (o index NÃO é sandboxado) — na segunda foto o
  // traje já estava vestido e a prova empurrava cópias novas no saco. Por
  // isso o guarda abaixo olha também o que o herói já veste; e a foto limpa
  // pede --user-data-dir novo.
  if (window.__rodou) return;
  window.__rodou = true;
  var w = f.contentWindow, d = w.document;
  var voltas = 0;
  (function espera() {
    var menu = d.querySelector('.screen-menu.is-on');
    if (!menu && ++voltas < 100) return setTimeout(espera, 800);
    try {
      var P = w.JOGO.Progress;
      var PECAS = ['sl-cetro', 'sl-botas', 'sl-cofre', 'sl-selo-primeiro'];
      var h = P.hero('sumo');
      PECAS.forEach(function (id) {
        var slot = w.JOGO.DATA.items[id].slot;
        var vestida = !!(h && h.items && h.items[slot] === id);
        var noSaco = P.state.inventory.some(function (e) { return e.itemId === id; });
        if (!vestida && !noSaco) P.state.inventory.push({ itemId: id, level: 0, stars: 0 });
      });
      // o traje pede o nível 30 (nível de uso, 10/09): o Bárbaro do perfil
      // novo sobe ao topo antes de vestir (o addXp prende no teto). O equip
      // recusado devolve false, não lança: a recusa vira ERRO no título.
      P.addXp('sumo', 1e9);
      PECAS.forEach(function (id) {
        var vestiu = false;
        try { vestiu = P.equip('sumo', id); } catch (e) {}
        if (!vestiu) document.title = 'ERRO ' + id + ': ' + ((P.ultimaRecusa && P.ultimaRecusa.motivo) || 'não vestiu');
      });
      if (P.save) P.save();
      w.JOGO.DB.batizar('Colecionador').then(function () {
        w.JOGO.UI.selection(['sumo']);
        w.JOGO.UI.showScreen('hub');
        w.JOGO.UI.openSheet('inventory');
        // fecha o cartão do Tutor, que cobre duas das quatro peças na foto
        setTimeout(function () {
          try {
            [].slice.call(d.querySelectorAll('button')).filter(function (b2) {
              return /Entendi/.test(b2.textContent);
            })[0].click();
          } catch (e3) {}
        }, 1200);
        setTimeout(function () { window.__pronto = true; }, 2500);
      });
    } catch (e) { document.title = 'ERRO ' + e.message; }
  })();
};
</script>
</body>
</html>
