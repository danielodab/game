<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>foto: a coroa do Mestre na praça</title>
<style>html,body{margin:0;height:100%;background:#0f1216}iframe{width:100%;height:100%;border:0}</style>
</head>
<body>
<!-- PÁGINA DE FOTO E PROVA (08/10 à noite): a COROA DO MESTRE acima da cabeça, na praça, do jeito que todo
     mundo a vê. O dono: "fiz a arte da coroa do GM que deve ser liberada somente para ele.. e o brilho no
     meio deve ser vermelho". O boot é o de tests/foto_auras.html. Na praça ficam três corpos lado a lado:
       · o HERÓI como Mestre (JOGO.GM.ativo forçado antes de entrar — é a conta do Mestre que a HUD pendura);
       · um vizinho carimbado `mestre: true` (o que o Relé faz com a conta gm), no corpo do Cavaleiro Negro;
       · um vizinho comum de Coroa VII (1650 pontos), para a diferença aparecer na mesma foto.
     A coroa do Mestre desce SOB DEMANDA (Bundle.pede, grupo `coroas`): a página espera até 30 s pelo modelo
     3D. O título diz quantas das cobranças passaram (COROA GM n/n) e o que falhou; `window.__pronto` sobe
     no fim. `?dist=`, `?tilt=` e `?t=` (segundos de giro antes da foto) como nas outras fotos. -->
<iframe id="tela"></iframe>
<script>
(function () {
  'use strict';
  var Q = {};
  location.search.replace(/[?&]([^=&]+)=([^&]*)/g, function (_, k, v) { Q[k] = decodeURIComponent(v); });
  var quadro = document.getElementById('tela');
  quadro.src = '../index.html?sandbox=1&snap=1&graficos=alta&foto-coroa-gm';
  var J, U, H, R, t0 = Date.now();
  var VERMELHO = /^#ff[0-3][0-9a-f][0-3][0-9a-f]$/i;        // o halo da coroa do Mestre: vermelho vivo
  function fim(checks, extra) {
    var ok = checks.filter(function (c) { return c[1]; }).length;
    var falhas = checks.filter(function (c) { return !c[1]; }).map(function (c) { return c[0]; });
    document.title = 'COROA GM ' + ok + '/' + checks.length + (falhas.length ? ' | FALHOU: ' + falhas.join('; ') : ' | tudo passou') +
                     (extra ? ' | ' + extra : '');
    window.__checks = checks;
    window.__fail = checks.length - ok;
    window.__pronto = true;
  }
  (function espera() {
    var pronto = false;
    try {
      J = quadro.contentWindow.JOGO;
      pronto = !!(J && J.Models3D2 && J.Models3D2.isReady() && J.Renderer && J.Renderer.isReady() && J.UI && J.Hub && J.Rede && J.DB && J.GM && J.Brasa);
    } catch (e) {}
    if (!pronto) {
      if (Date.now() - t0 > 110000) { document.title = 'ERRO sem jogo'; window.__pronto = true; return; }
      return setTimeout(espera, 250);
    }
    U = J.UI; H = J.Hub; R = J.Rede;
    try {
      var suf = (J.Contas && J.Contas.sufixo) ? J.Contas.sufixo() : '';
      quadro.contentWindow.localStorage.setItem('soterra-tutor-v1' + suf, JSON.stringify({ vistos: {}, off: true }));
    } catch (e) {}
    var P = J.Progress;
    var ids = P.heroIds().filter(function (h) { return h !== 'gm'; });
    U.selection(ids.slice(0, 1));
    R.entrar = function () { return true; };
    R.pares = function () { return []; };
    R.mover = function () {};
    J.Loja.auraEscolhida = function () { return null; };
    // o HERÓI é o Mestre: é o JOGO.GM.ativo() que a HUD consulta (coroaDoMestre) para pendurar a coroa dele
    J.GM.ativo = function () { return true; };
    var souMestreAntes = null;
    J.DB.batizar('GM').then(function () {
      U.showScreen('hub');
      var v = 0;
      (function praca() {
        var e = null;
        try { e = H._estado(); } catch (e1) {}
        if (!(e && e.pos && e.plaquinha) && ++v < 160) return setTimeout(praca, 250);
        var hp = e.pos;
        H.aura(false);
        var resumoBase = { classes: { sumo: 3 }, total: 3, brasa: 1000, partidas: 0, coroaOculta: false };
        // o vizinho MESTRE — o `mestre: true` é o carimbo do Relé (só a conta gm o recebe); corpo do Cavaleiro Negro
        H.fantasmaEntra('m1', { id: 'm1', nome: 'GM', titulo: '', moldura: 'auto', classe: 'gm', sala: null, aura: false, mestre: true,
                                resumo: resumoBase, x: hp.x - 3.2, z: hp.z - 3 });
        // o vizinho COMUM de Coroa VII, para a diferença aparecer na mesma foto
        H.fantasmaEntra('c1', { id: 'c1', nome: 'Capitã Ana', titulo: '', moldura: 'auto', classe: 'sumo', sala: null, aura: false,
                                resumo: { classes: { sumo: 9 }, total: 9, brasa: 1650, partidas: 12, coroaOculta: false }, x: hp.x + 3.2, z: hp.z - 3 });
        try { H._cam({ dist: Number(Q.dist) || 9, tilt: Number(Q.tilt) || 0.5 }); } catch (e2) {}
        // a coroa do Mestre desce sob demanda: espera a 3D abrir no herói e no vizinho (até 30 s)
        var t1 = Date.now();
        (function esperaCoroa() {
          var eh = null, fm = null;
          try { eh = H._estado(); fm = H._coroaFantasma('m1'); } catch (e3) {}
          var chegou = !!(eh && eh.coroa3d && fm && fm.d3);
          if (!chegou && Date.now() - t1 < 30000) return setTimeout(esperaCoroa, 250);
          var g1 = eh ? eh.coroaGiro : null;
          setTimeout(function () {
            var e2 = H._estado(), m = H._coroaFantasma('m1'), c = H._coroaFantasma('c1');
            var checks = [
              ['o herói (Mestre) carrega a coroa do Mestre', !!(e2.coroaVisivel && e2.coroaMestre && e2.coroaNivel === 'gm')],
              ['a coroa do herói é o modelo 3D (coroa_gm desceu e abriu)', !!e2.coroa3d],
              ['o brilho do herói é VERMELHO', !!(e2.coroaHalo && VERMELHO.test(e2.coroaHalo))],
              ['a coroa gira', g1 !== null && e2.coroaGiro !== null && g1 !== e2.coroaGiro],
              ['o vizinho carimbado mestre carrega a coroa do Mestre (chave coroa_gm), em 3D', !!(m && m.visivel && m.mestre && m.chave === 'coroa_gm' && m.d3)],
              ['o brilho do vizinho Mestre é VERMELHO e inteiro', !!(m && m.halo && VERMELHO.test(m.halo) && m.haloForca === 1)],
              ['o vizinho comum de 1650 pontos segue com a Coroa VII (dourada), nunca a do Mestre', !!(c && c.visivel && !c.mestre && c.chave === 'coroa_pvp_n7' && c.halo && !VERMELHO.test(c.halo))],
              ['a coroa do Mestre fica acima da pilha do nome (baseY acima da placa)', !!(m && typeof m.baseY === 'number' && m.baseY > 2.4)]
            ];
            fim(checks, JSON.stringify({ heroi: { halo: e2.coroaHalo, giro: e2.coroaGiro }, m1: m, c1: c }));
          }, (Number(Q.t) || 2) * 1000);
        })();
      })();
    });
  })();
})();
</script>
</body>
</html>
