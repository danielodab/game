<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liberação de feitiços — nível a nível</title>
<style>
  :root{ --bg:#0b0d10; --pan:#141920; --pan2:#1b222c; --lin:#2b3542; --tx:#e8eef6; --dim:#8895a6;
         --on:#7fe08a; --fogo:#ff7a45; --agua:#4fb8ff; --terra:#c9a24a; --ar:#9ee7c8; --neutro:#a8b3c2; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,Segoe UI,sans-serif}
  header{position:sticky;top:0;z-index:9;background:#0b0d10f2;
         border-bottom:1px solid var(--lin);padding:12px 16px}
  h1{margin:0 0 8px;font-size:17px;letter-spacing:.02em}
  h2{margin:26px 0 10px;font-size:15px;color:#cfe0f5;border-left:3px solid #4a7bd0;padding-left:9px}
  .ctl{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .ctl label{font-size:12px;color:var(--dim)}
  input[type=range]{width:min(420px,46vw)}
  select{background:var(--pan2);color:var(--tx);border:1px solid var(--lin);border-radius:6px;padding:4px 7px}
  #nv{font:600 22px/1 system-ui;color:#ffd479;min-width:2.2em;display:inline-block;text-align:right}
  main{padding:0 16px 60px;max-width:1500px;margin:0 auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
  .card{background:var(--pan);border:1px solid var(--lin);border-radius:10px;padding:10px 11px}
  .card h3{margin:0 0 8px;font-size:13px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .card h3 b{font-weight:600}
  .cnt{font:600 11px/1 monospace;color:var(--dim);background:#0e131a;border:1px solid var(--lin);
       border-radius:20px;padding:4px 8px;white-space:nowrap}
  .sp{display:flex;gap:8px;align-items:center;padding:4px 5px;border-radius:6px;margin:2px 0;
      border:1px solid transparent}
  .sp canvas{width:30px;height:30px;flex:0 0 30px;border-radius:5px;background:#0d1117}
  .sp .nm{flex:1;min-width:0;overflow:hidden}
  .sp .nm>div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
  .sp .lv{font:600 10px/1 monospace;padding:3px 6px;border-radius:4px;background:#222b36;color:var(--dim)}
  .sp.on{background:#16241a;border-color:#2c5233}
  .sp.on .lv{background:#2c5233;color:var(--on)}
  .sp.novo{background:#2a2413;border-color:#7a6320;box-shadow:0 0 0 1px #7a632055}
  .sp.novo .lv{background:#7a6320;color:#ffd479}
  .sp.off{opacity:.34;filter:grayscale(1)}
  .fx{font-size:10.5px;color:var(--dim);font-family:monospace}
  .tag{display:inline-block;font-size:10px;padding:2px 6px;border-radius:4px;margin-left:6px}
  .e-fogo{background:#3a1d12;color:var(--fogo)} .e-agua{background:#0f2a3d;color:var(--agua)}
  .e-terra{background:#2f2711;color:var(--terra)} .e-ar{background:#122e26;color:var(--ar)}
  .e-neutro{background:#20262e;color:var(--neutro)}
  table.res{border-collapse:collapse;font-size:12px;margin-top:6px}
  table.res th,table.res td{border:1px solid var(--lin);padding:4px 9px;text-align:center}
  table.res th{background:var(--pan2);color:var(--dim);font-weight:600}
  table.res td.k{text-align:left;color:#cfe0f5}
  #erro{color:#ff8a7a;font-family:monospace;white-space:pre-wrap;padding:12px}
</style>
</head>
<body>
<header>
  <h1>Liberação de feitiços — nível a nível <span style="color:var(--dim);font-weight:400">· lido dos dados reais do jogo</span></h1>
  <div class="ctl">
    <label>Nível <span id="nv">1</span></label>
    <input id="sl" type="range" min="1" max="30" value="1" step="1">
    <label>Elemento do 1º <select id="eA"></select></label>
    <label>Elemento do 2º <select id="eB"></select></label>
    <label><input id="soLib" type="checkbox"> só o que já liberou</label>
  </div>
</header>
<main>
  <h2>As 6 classes — feitiços próprios</h2>
  <div id="classes" class="grid"></div>
  <h2>As 15 fusões — feitiços compostos</h2>
  <div id="fusoes" class="grid"></div>
  <h2>Resumo: quantos feitiços cada um tem em cada nível</h2>
  <div id="resumo"></div>
</main>
<div id="erro"></div>

<script src="save_sandbox.js"></script>
<script>
  window.__V = '?v=' + Date.now();
  var arqs = ['js/core/data/elements.js','js/core/data/classes.js','js/core/data/spells.js',
    'js/core/data/progression.js','js/core/data/monsters.js','js/core/data/dungeons.js',
    'js/core/data/fusions.js','js/core/data/pets.js','js/core/data/items.js','js/core/data/items_extra.js',
    'js/core/engine.js','js/core/fusion.js','js/core/ai.js','js/core/progress.js',
    'js/render2d/art.js'];
  for (var i = 0; i < arqs.length; i++) {
    document.write('<scr' + 'ipt src="../' + arqs[i] + window.__V + '"></scr' + 'ipt>');
  }
</script>

<script>
(function () {
  var ELS = ['neutro', 'fogo', 'agua', 'terra', 'ar'];
  var CLS, PARES = [], elA = 'fogo', elB = 'agua', nivel = 1, soLib = false;

  function el(id) { return document.getElementById(id); }
  function nomeClasse(id) { var d = JOGO.DATA.classes[id]; return (d && d.name) || id; }

  function resumoEf(s) {
    return (s.effects || []).map(function (e) {
      return e.type + (e.element && e.element !== 'neutro' ? ':' + e.element : '');
    }).join(' · ');
  }

  // Feitiços da classe: os 3 neutros (nível 0) + o caminho elemental escolhido.
  function feiticosDaClasse(cid, elem) {
    var d = JOGO.DATA.classes[cid], out = [];
    (d.baseSpells || []).forEach(function (sid) {
      var s = JOGO.Engine.spell(sid) || {};
      out.push({ id: sid, nome: s.name || sid, lvl: 0, elemento: s.element || 'neutro', efeitos: resumoEf(s) });
    });
    ((d.paths && d.paths[elem]) || []).forEach(function (sid) {
      var s = JOGO.Engine.spell(sid) || {};
      out.push({ id: sid, nome: s.name || sid, lvl: s.unlockLevel || 0, elemento: s.element || elem, efeitos: resumoEf(s) });
    });
    out.sort(function (a, b) { return a.lvl - b.lvl; });
    return out;
  }

  // Feitiços da fusão: pede o conjunto do nível 30 (todos) e marca o tier de cada um.
  function feiticosDaFusao(a, b, ea, eb) {
    return JOGO.Fusion.spellsFor(a + '+' + b, ea + '+' + eb, 30).map(function (s) {
      return { id: s.id, nome: s.name, lvl: s.tier || 0, elemento: s.element || 'neutro',
               efeitos: resumoEf(s), obj: s };
    }).sort(function (x, y) { return x.lvl - y.lvl; });
  }

  function liberado(f, nv) { return f.lvl === 0 || nv >= f.lvl; }

  function linha(f) {
    var lib = liberado(f, nivel);
    var novo = lib && f.lvl > 0 && nivel === f.lvl;
    if (soLib && !lib) return null;
    var d = document.createElement('div');
    d.className = 'sp ' + (novo ? 'novo' : lib ? 'on' : 'off');
    var cv = null;
    try { cv = JOGO.Art.spellIcon(f.obj || f.id, 30); } catch (e) { cv = null; }
    if (cv) { cv.style.width = '30px'; cv.style.height = '30px'; d.appendChild(cv); }
    var n = document.createElement('div'); n.className = 'nm';
    n.innerHTML = '<div>' + f.nome + '<span class="tag e-' + f.elemento + '">' + f.elemento + '</span></div>' +
                  '<div class="fx">' + (f.efeitos || '—') + '</div>';
    d.appendChild(n);
    var lv = document.createElement('div'); lv.className = 'lv';
    lv.textContent = f.lvl === 0 ? 'inicial' : 'nv ' + f.lvl;
    d.appendChild(lv);
    return d;
  }

  function cartao(titulo, sub, feiticos) {
    var c = document.createElement('div'); c.className = 'card';
    var libs = feiticos.filter(function (f) { return liberado(f, nivel); }).length;
    var h = document.createElement('h3');
    h.innerHTML = '<b>' + titulo + '</b>' +
      (sub ? '<span style="color:var(--dim);font-weight:400">' + sub + '</span>' : '') +
      '<span class="cnt">' + libs + ' / ' + feiticos.length + '</span>';
    c.appendChild(h);
    feiticos.forEach(function (f) { var L = linha(f); if (L) c.appendChild(L); });
    return c;
  }

  function desenha() {
    el('nv').textContent = nivel;
    var gc = el('classes'); gc.innerHTML = '';
    CLS.forEach(function (cid) {
      var e = (nivel >= 5) ? elA : 'neutro';
      gc.appendChild(cartao(nomeClasse(cid),
        nivel < 5 ? ' · elemento só no nv 5' : ' · ' + e, feiticosDaClasse(cid, e)));
    });
    var gf = el('fusoes'); gf.innerHTML = '';
    PARES.forEach(function (p) {
      gf.appendChild(cartao(nomeClasse(p[0]) + ' + ' + nomeClasse(p[1]),
        ' · ' + elA + '+' + elB, feiticosDaFusao(p[0], p[1], elA, elB)));
    });
    resumo();
  }

  function resumo() {
    var marcos = [1, 4, 5, 9, 10, 11, 12, 14, 15, 19, 20, 29, 30];
    var h = '<table class="res"><tr><th>quem</th>' +
      marcos.map(function (m) { return '<th>nv ' + m + '</th>'; }).join('') + '</tr>';
    CLS.forEach(function (cid) {
      h += '<tr><td class="k">' + nomeClasse(cid) + '</td>' + marcos.map(function (m) {
        var e = m >= 5 ? elA : 'neutro';
        var n = feiticosDaClasse(cid, e).filter(function (f) { return liberado(f, m); }).length;
        return '<td>' + n + '</td>';
      }).join('') + '</tr>';
    });
    h += '<tr><td class="k" style="color:var(--dim)">— fusões —</td><td colspan="' + marcos.length + '"></td></tr>';
    PARES.forEach(function (p) {
      var fs = feiticosDaFusao(p[0], p[1], elA, elB);
      h += '<tr><td class="k">' + nomeClasse(p[0]) + ' + ' + nomeClasse(p[1]) + '</td>' + marcos.map(function (m) {
        return '<td>' + fs.filter(function (f) { return liberado(f, m); }).length + '</td>';
      }).join('') + '</tr>';
    });
    el('resumo').innerHTML = h + '</table>';
  }

  window.addEventListener('DOMContentLoaded', function () {
    try {
      // ?nivel=12&ea=fogo&eb=agua — o headless não tem como mexer no controle,
      // e as capturas precisam abrir já no nível certo.
      var qs = {};
      location.search.replace(/[?&]([^=&]+)=([^&]*)/g, function (_, k, v) { qs[k] = decodeURIComponent(v); });
      if (qs.nivel) nivel = Math.max(1, Math.min(30, parseInt(qs.nivel, 10) || 1));
      if (qs.ea) elA = qs.ea;
      if (qs.eb) elB = qs.eb;
      if (qs.so) soLib = qs.so === '1';

      CLS = Object.keys(JOGO.DATA.classes);
      for (var i = 0; i < CLS.length; i++) {
        for (var j = i + 1; j < CLS.length; j++) PARES.push([CLS[i], CLS[j]]);
      }
      ['eA', 'eB'].forEach(function (k, idx) {
        var s = el(k);
        ELS.forEach(function (e) {
          var o = document.createElement('option'); o.value = e; o.textContent = e; s.appendChild(o);
        });
        s.value = idx === 0 ? elA : elB;
        s.onchange = function () { if (idx === 0) elA = s.value; else elB = s.value; desenha(); };
      });
      el('sl').value = nivel;
      el('soLib').checked = soLib;
      el('sl').oninput = function () { nivel = +this.value; desenha(); };
      el('soLib').onchange = function () { soLib = this.checked; desenha(); };
      desenha();
      window.__pronto = true;
    } catch (e) {
      el('erro').textContent = 'ERRO: ' + e.message + '\n' + e.stack;
    }
  });
})();
</script>
</body>
</html>
