<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>prova: o retrato 3D do pet na ficha</title>
<style>html,body{margin:0;height:100%;background:#0f1216}iframe{width:100%;height:100%;border:0}</style>
</head>
<body>
<!-- PÁGINA DE PROVA (foto): o BICHO no inventário com o retrato 3D do
     próprio pet (31/08) — o desenho 2D de emergência era a queixa. -->
<iframe id="f" src="../index.html?prova-pet"></iframe>
<script>
var f = document.getElementById('f');
f.onload = function () {
  var w = f.contentWindow, d = w.document;
  var t0 = Date.now();
  (function espera() {
    var menu = d.querySelector('.screen-menu.is-on');
    if (!menu && Date.now() - t0 < 40000) return setTimeout(espera, 800);
    try {
      var P = w.JOGO.Progress;
      P.hero('sumo');
      P.addPet('pet-emberling');
      P.addPet('pet-heartshard');
      P.addPet('pet-lodestone');
      P.equipPet('sumo', 'pet-emberling');
      w.JOGO.DB.batizar('Domadora').then(function () {
        w.JOGO.UI.selection(['sumo']);
        w.JOGO.UI.showScreen('hub');
        w.JOGO.UI.openSheet('inventory');
        // os retratos 3D instalam quando os modelos abrem e a UI repinta
        setTimeout(function () { window.__pronto = true; }, 4000);
      });
    } catch (e) { document.title = 'ERRO ' + e.message; }
  })();
};
</script>
</body>
</html>
