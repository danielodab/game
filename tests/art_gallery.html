<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOTERRA 2.0 — Galeria de Arte (JOGO.Art)</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --ink:#e8e0d0; --dim:#8b93a0; --ok:#5fd08a; --bad:#ff6b5a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.45 'Segoe UI', system-ui, Arial, sans-serif; }
  header { position:sticky; top:0; z-index:10; background:#0b0e12; border-bottom:1px solid #262d38;
           padding:10px 16px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  h1 { font:600 17px Georgia, serif; margin:0; letter-spacing:.02em; }
  #verdict { font-weight:700; padding:4px 12px; border-radius:6px; }
  #verdict.pass { background:rgba(95,208,138,.16); color:var(--ok); border:1px solid var(--ok); }
  #verdict.fail { background:rgba(255,107,90,.16); color:var(--bad); border:1px solid var(--bad); }
  .meta { color:var(--dim); font-size:12px; }
  section { padding:14px 16px 22px; border-bottom:1px solid #1e242e; }
  h2 { font:600 15px Georgia, serif; margin:0 0 4px; color:#ffd08a; }
  .hint { color:var(--dim); font-size:12px; margin-bottom:10px; }
  .grid { display:flex; flex-wrap:wrap; gap:10px; }
  .cell { background:var(--panel); border:1px solid #262d38; border-radius:8px; padding:6px;
          text-align:center; }
  .cell canvas { display:block; margin:0 auto; image-rendering:auto; }
  .cap { font-size:10px; color:var(--dim); margin-top:4px; max-width:180px;
         overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cap b { color:#e8e0d0; font-weight:600; }
  .stage { background:
      radial-gradient(ellipse 60% 45% at 50% 78%, rgba(0,0,0,.45), transparent 70%),
      linear-gradient(180deg, #202834 0%, #131922 100%); }
  .stage.t-estufa   { background:linear-gradient(180deg,#2a3a20,#141c12); }
  .stage.t-cisterna { background:linear-gradient(180deg,#1c2f38,#101a20); }
  .stage.t-brasa    { background:linear-gradient(180deg,#3a1e14,#1a0e0a); }
  .stage.t-vento    { background:linear-gradient(180deg,#2c2a3c,#15141e); }
  .stage.t-mina     { background:linear-gradient(180deg,#332c20,#1a1610); }
  .stage.t-coracao  { background:linear-gradient(180deg,#2a2440,#14111f); }
  .row-title { color:#9fb0c0; font-size:12px; width:100%; margin:8px 0 2px;
               border-top:1px dashed #2a323e; padding-top:8px; }
  #results { padding:12px 16px; font-size:12px; color:var(--dim); }
  #results .f { color:var(--bad); }
  .sizecmp { display:flex; align-items:flex-end; gap:14px; }
</style>
</head>
<body>
<header>
  <h1>Galeria de Arte — <span style="color:#9fb0c0">JOGO.Art</span></h1>
  <span id="verdict">…</span>
  <span class="meta" id="meta"></span>
</header>
<div id="app"></div>
<div id="results"></div>

<script src="../js/core/data/elements.js?v=1"></script>
<script src="../js/core/data/classes.js?v=1"></script>
<script src="../js/core/data/progression.js?v=1"></script>
<script src="../js/core/data/spells.js?v=1" onerror="window.__noSpells=1"></script>
<script src="../js/core/data/monsters.js?v=1" onerror="window.__noMonsters=1"></script>
<script src="../js/core/data/dungeons.js?v=1" onerror="window.__noDungeons=1"></script>
<script src="../js/core/data/fusions.js?v=1" onerror="window.__noFusions=1"></script>
<script src="../js/core/data/pets.js?v=1" onerror="window.__noPets=1"></script>
<script src="../js/core/data/items.js?v=1" onerror="window.__noItems=1"></script>
<script src="../js/render2d/art.js?v=1"></script>
<script>
(function () {
  var app = document.getElementById('app');
  var R = { passed: 0, failed: 0, failures: [] };
  var Art = JOGO.Art;
  var D = JOGO.DATA || {};

  function check(name, cond, detail) {
    if (cond) R.passed++;
    else { R.failed++; R.failures.push(name + (detail ? ' — ' + detail : '')); }
    return !!cond;
  }
  function el(t, c, h) { var e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; }
  function sec(title, hint) {
    var s = el('section');
    s.appendChild(el('h2', null, title));
    if (hint) s.appendChild(el('div', 'hint', hint));
    var g = el('div', 'grid');
    s.appendChild(g); app.appendChild(s);
    return g;
  }
  // valida que o canvas não saiu vazio (o teste real de "desenhou alguma coisa")
  function inked(cv) {
    try {
      var w = Math.min(cv.width, 220), h = Math.min(cv.height, 260);
      var g = cv.getContext('2d');
      var d = g.getImageData(0, 0, w, h).data, i, n = 0;
      for (i = 3; i < d.length; i += 4 * 7) if (d[i] > 24) n++;
      return n > 24;
    } catch (e) { return false; }
  }
  function show(grid, cv, caption, stageCls, testName, w) {
    var c = el('div', 'cell ' + (stageCls || 'stage'));
    if (testName) check(testName, inked(cv), 'canvas em branco');
    // canvases do Art são CACHEADOS: sempre inserir uma cópia no DOM
    var node = Art.node(cv, w || undefined);
    c.appendChild(node);
    c.appendChild(el('div', 'cap', caption));
    grid.appendChild(c);
    return c;
  }
  function rowTitle(grid, t) { grid.appendChild(el('div', 'row-title', t)); }

  var t0 = performance.now();
  var CLASSES = Art.classIds();
  var ELEMS = Art.elementIds();
  var DIRNAME = ['SE frente-dir', 'SW frente-esq', 'NW costas-esq', 'NE costas-dir'];

  check('6 classes disponíveis', CLASSES.length >= 6, CLASSES.join(','));
  check('5 elementos', ELEMS.length === 5, ELEMS.join(','));

  // ---------------------------------------------------------------- 1. CLASSES
  var g1 = sec('1 · As 6 classes × 4 direções (elemento neutro)',
    'Vista base do herói recém-criado. Direções discretas: SE e NE são desenhadas, SW e NW são espelhos.');
  CLASSES.forEach(function (cid) {
    rowTitle(g1, (D.classes && D.classes[cid] ? D.classes[cid].name : cid) + ' — ' + cid);
    for (var d = 0; d < 4; d++) {
      var cv = Art.unit(cid, { element: 'neutro', dir: d, scale: 0.8 });
      show(g1, cv, '<b>' + cid + '</b> · ' + DIRNAME[d], 'stage', 'unit ' + cid + ' dir' + d);
    }
  });

  // ------------------------------------------------------- 2. CLASSES × ELEMENTO
  var g2 = sec('2 · Cada classe nos 4 elementos (vista SE)',
    'Mesma silhueta, paleta e adereço elemental distintos: chamas, gotas, lascas de pedra, penas.');
  CLASSES.forEach(function (cid) {
    rowTitle(g2, (D.classes && D.classes[cid] ? D.classes[cid].name : cid));
    ELEMS.forEach(function (e) {
      var cv = Art.unit(cid, { element: e, dir: 0, scale: 0.8 });
      show(g2, cv, '<b>' + cid + '</b> · ' + e, 'stage', 'unit ' + cid + ' ' + e);
    });
  });

  // ---------------------------------------------------------------- 3. FUSÕES
  var pairs = Art.fusionPairs();
  var g3 = sec('3 · As ' + pairs.length + ' fusões (dupla de classes)',
    'Corpo da classe de silhueta dominante + adereços-assinatura da outra + paleta mista. ' +
    'Ex.: sumo+bruxo = sumô de chapéu, manto e cajado; arqueiro+invocador = elfo com totem nas costas.');
  check('15 duplas de classe', pairs.length === 15, 'obtidas: ' + pairs.length);
  pairs.forEach(function (pr) {
    var id = 'fus:' + pr;
    var cv = Art.unit(id, { element: 'neutro', dir: 0, scale: 0.8 });
    show(g3, cv, '<b>' + pr + '</b>', 'stage', 'fusão ' + pr);
  });

  // ------------------------------------------------- 4. FUSÕES × PARES ELEMENTAIS
  var g4 = sec('4 · Fusão com dois elementos (amostra) + costas',
    'A fusão recebe os dois elementos: o primeiro tinge o corpo, o segundo aparece no eco da aura.');
  [['sumo+bruxo', 'fogo', 'ar'], ['arqueiro+invocador', 'terra', 'agua'],
   ['curandeira+espadachim', 'agua', 'fogo'], ['bruxo+curandeira', 'ar', 'terra'],
   ['espadachim+sumo', 'terra', 'fogo'], ['arqueiro+bruxo', 'agua', 'ar']].forEach(function (t) {
    for (var d = 0; d < 4; d += 3) {
      var cv = Art.unit('fus:' + t[0], { elements: [t[1], t[2]], dir: d, scale: 0.8 });
      show(g4, cv, '<b>' + t[0] + '</b><br>' + t[1] + '+' + t[2] + ' · ' + DIRNAME[d], 'stage',
           'fusão elemental ' + t[0] + ' ' + t[1] + t[2] + ' d' + d);
    }
  });

  // ------------------------------------------------------------- 5. TAMANHO REAL
  var g5 = sec('5 · Tamanho de jogo (1 célula = 128 px de largura)',
    'Teste de legibilidade: é assim que o jogador vê. Silhueta deve ser reconhecível sem zoom.');
  var stage = el('div', 'cell stage sizecmp');
  stage.style.padding = '0 12px 6px';
  CLASSES.concat(['fus:sumo+bruxo', 'fus:arqueiro+invocador']).forEach(function (cid) {
    var cv = Art.unit(cid, { element: /^fus/.test(cid) ? 'fogo' : 'neutro', dir: 0 });
    var d = el('div');
    d.style.textAlign = 'center';
    d.style.position = 'relative';
    var tl = Art.node(Art.tile('estufa', 0), 128);
    tl.style.position = 'absolute';
    tl.style.left = '16px'; tl.style.bottom = '18px';
    d.appendChild(tl);
    var n = Art.node(cv, 160);
    n.style.position = 'relative';
    d.appendChild(n);
    d.appendChild(el('div', 'cap', cid));
    stage.appendChild(d);
  });
  g5.appendChild(stage);

  // ------------------------------------------------------------- 6. RETRATOS
  var g6 = sec('6 · Retratos (HUD, timeline, cartas)', 'Enquadrados no rosto, sempre de frente.');
  CLASSES.forEach(function (cid) {
    show(g6, Art.portrait(cid, { element: 'neutro', size: 96 }), '<b>' + cid + '</b>', 'stage', 'retrato ' + cid);
  });
  ['fogo', 'agua', 'terra', 'ar'].forEach(function (e) {
    show(g6, Art.portrait('bruxo', { element: e, size: 96 }), 'bruxo · ' + e, 'stage', 'retrato bruxo ' + e);
  });
  show(g6, Art.portrait('fus:sumo+bruxo', { elements: ['fogo', 'ar'], size: 96 }), 'fusão sumo+bruxo', 'stage', 'retrato fusão');

  // ------------------------------------------------------------- 7. CENÁRIO
  var THEMES = Art.themeIds();
  var g7 = sec('7 · Cenário por tema — chão, obstáculo alto (bloqueia visão), obstáculo baixo (cobertura)',
    'Temas: ' + THEMES.join(' · ') + (D.dungeons ? ' — paletas cruzadas com DATA.dungeons' : ' — DATA.dungeons ainda não existe'));
  THEMES.forEach(function (th) {
    rowTitle(g7, 'tema ' + th);
    for (var v = 0; v < 4; v++) {
      show(g7, Art.tile(th, v), 'chão v' + v, 'stage t-' + th, 'tile ' + th + ' ' + v);
    }
    show(g7, Art.obstacleHigh(th), 'ALTO', 'stage t-' + th, 'alto ' + th);
    show(g7, Art.obstacleLow(th), 'baixo', 'stage t-' + th, 'baixo ' + th);
    Art.themePalette(th).props.forEach(function (pk) {
      show(g7, Art.prop(th, pk), 'prop ' + pk, 'stage t-' + th, 'prop ' + th + ' ' + pk);
    });
  });

  // -------------------------------------------------------- 8. MONSTROS E PETS
  var mons = D.monsters ? Object.keys(D.monsters) : [];
  var g8 = sec('8 · Monstros' + (mons.length ? ' (' + mons.length + ' de DATA.monsters)' : ' — DATA.monsters ainda não existe: arquétipos de demonstração'),
    'Arquétipo derivado de palavras-chave do id/nome (ou do hash). Chefes ganham coroa e escala maior.');
  var demo = mons.length ? mons.slice(0, 40)
    : ['lodo-da-estufa', 'raiz-andarilha', 'verme-de-cinza', 'eco-afogado', 'golem-de-entulho',
       'lobo-de-brasa', 'capataz-do-fecho', 'flor-carnivora', 'aranha-do-poco', 'cristal-vivo'];
  demo.forEach(function (id) {
    var md = D.monsters && D.monsters[id];
    var cv = Art.unit(id, { element: (md && md.element) || null, dir: 0, scale: 0.75 });
    show(g8, cv, '<b>' + id + '</b>' + (md && md.boss ? ' ♛' : ''), 'stage', 'monstro ' + id);
  });
  var pets = D.pets ? Object.keys(D.pets) : [];
  var g8b = sec('9 · Pets' + (pets.length ? ' (' + pets.length + ')' : ' — DATA.pets ainda não existe: demonstração'),
    'O pet entra em campo junto do dono; ícone usado no espaço de pet do painel de equipamento.');
  (pets.length ? pets : ['dragaozinho-de-brasa', 'planta-mordedora', 'aguia-do-vendaval', 'bolha-curandeira', 'bicho-de-pedra'])
    .forEach(function (id) {
      show(g8b, Art.unit(id, { dir: 0, scale: 0.7 }), '<b>' + id + '</b>', 'stage', 'pet unidade ' + id);
      show(g8b, Art.petIcon(id, 64), 'ícone ' + id, 'stage', 'pet ícone ' + id);
    });

  // ------------------------------------------------------------- 10. ÍCONES
  var spells = D.spells ? Object.keys(D.spells) : [];
  var g9 = sec('10 · Ícones de feitiço' + (spells.length ? ' (' + spells.length + ' em DATA.spells — amostra de 48)' : ' — DATA.spells ainda não existe: derivados do id'),
    'Forma escolhida pelo efeito principal; cor pelo elemento.');
  var sList = spells.length ? spells.filter(function (_, i) { return i % Math.ceil(spells.length / 48) === 0; })
    : ['sumo-neutro-1', 'sumo-fogo-5', 'arqueiro-agua-10', 'bruxo-terra-12', 'espadachim-ar-15',
       'curandeira-fogo-20', 'invocador-agua-30', 'bruxo-neutro-2'];
  sList.forEach(function (sid) {
    var sp = D.spells && D.spells[sid];
    show(g9, Art.spellIcon(sp || sid, 52), (sp ? sp.name : sid), 'stage', 'ícone feitiço ' + sid);
  });

  var items = D.items ? Object.keys(D.items) : [];
  var g10 = sec('11 · Ícones de item (4 espaços)' + (items.length ? ' (' + items.length + ')' : ' — DATA.items ainda não existe: 4 espaços de demonstração'),
    'Espaços: PA (manopla) · PP (bota) · Vida (coração) · Especial (orbe). A borda mostra a raridade.');
  (items.length ? items : ['demo-pa', 'demo-pp', 'demo-vida', 'demo-especial']).forEach(function (id) {
    var it = D.items && D.items[id];
    show(g10, Art.itemIcon(id, 56), (it ? it.name + ' · ' + it.slot + '/' + it.rarity : id), 'stage', 'ícone item ' + id);
  });

  var g11 = sec('12 · Eventos de terreno e cartas de personagem',
    'Marcadores que aparecem no chão a cada rodada + a carta que desbloqueia uma classe.');
  Art.eventKinds().forEach(function (k) {
    show(g11, Art.tileEventIcon(k, 64), k, 'stage', 'evento ' + k);
  });
  CLASSES.forEach(function (cid) {
    show(g11, Art.classCard(cid, 116, 164), 'carta ' + cid, 'stage', 'carta ' + cid);
  });

  // ------------------------------------------------------------- COBERTURA
  var need = {
    'classes × elementos × direções': CLASSES.length * ELEMS.length,
    'fusões': pairs.length,
    'temas de cenário': THEMES.length
  };
  check('cobertura: 6 classes desenhadas', CLASSES.length === 6);
  check('cobertura: 4 direções por classe', true);
  check('cobertura: 15 fusões desenhadas', pairs.length === 15);
  check('cobertura: 6 temas de cenário', THEMES.length === 6);
  check('API Art.unit', typeof Art.unit === 'function');
  check('API Art.tile', typeof Art.tile === 'function');
  check('API Art.obstacleHigh', typeof Art.obstacleHigh === 'function');
  check('API Art.obstacleLow', typeof Art.obstacleLow === 'function');
  check('API Art.prop', typeof Art.prop === 'function');
  check('API Art.portrait', typeof Art.portrait === 'function');
  check('API Art.spellIcon', typeof Art.spellIcon === 'function');
  check('API Art.itemIcon', typeof Art.itemIcon === 'function');
  check('API Art.petIcon', typeof Art.petIcon === 'function');
  check('API Art.tileEventIcon', typeof Art.tileEventIcon === 'function');
  check('API Art.rarityColor', typeof Art.rarityColor === 'function' && /^#/.test(Art.rarityColor('epico')));
  check('API Art.texture', typeof Art.texture === 'function');
  check('texture() devolve canvas', (function () {
    var t = Art.texture('unit:sumo:fogo:0');
    return t && t.tagName === 'CANVAS';
  })());
  check('texture() aceita fusão', (function () {
    var t = Art.texture('unit:fus:sumo+bruxo:fogo:0');
    return t && t.tagName === 'CANVAS';
  })());
  check('cache reaproveita', Art.unit('sumo', { element: 'fogo', dir: 0 }) === Art.unit('sumo', { element: 'fogo', dir: 0 }));
  check('canvas traz __anchor', !!Art.unit('sumo', {}).__anchor);
  check('canvas traz __res', Art.unit('sumo', {}).__res >= 1);
  check('ancoragem do herói nos pés', Art.unit('sumo', {}).__anchor[1] > 0.7);

  var dt = Math.round(performance.now() - t0);
  var st = Art.stats();
  document.getElementById('meta').textContent =
    R.passed + ' ok · ' + R.failed + ' falhas · ' + dt + ' ms · ' +
    st.entries + ' texturas em cache (~' + st.megabytes + ' MB)';
  var v = document.getElementById('verdict');
  v.textContent = R.failed === 0 ? 'PASS' : 'FAIL (' + R.failed + ')';
  v.className = R.failed === 0 ? 'pass' : 'fail';
  document.getElementById('results').innerHTML =
    R.failures.length ? '<b>Falhas:</b><br>' + R.failures.map(function (f) { return '<span class="f">✕ ' + f + '</span>'; }).join('<br>')
                      : 'Todas as verificações passaram.';
  window.TEST_RESULTS = R;
  window.ART_READY = true;

  // ?only=1,3 — isola seções para captura headless legível
  var only = (location.search.match(/[?&]only=([^&]+)/) || [])[1];
  if (only) {
    var keep = only.split(',').map(function (n) { return parseInt(n, 10); });
    var secs = document.querySelectorAll('section');
    for (var i = 0; i < secs.length; i++) {
      if (keep.indexOf(i + 1) < 0) secs[i].style.display = 'none';
    }
  }
  if (/[?&]nobg=1/.test(location.search)) {
    var st = document.createElement('style');
    st.textContent = '.cell{background:#f0ece4 !important}.cap{color:#333}';
    document.head.appendChild(st);
  }
})();
</script>
</body>
</html>
