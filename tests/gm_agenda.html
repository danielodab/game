<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>SOTERRA 3.0 — a ficha dos Eventos do mundo no Painel do Mestre</title>
<style>html,body{margin:0;background:#0f1216;color:#e8eef6;font:12px monospace}
iframe{width:1100px;height:760px;border:0;display:block}
#summary{padding:6px 10px;border-radius:6px;margin:8px}
.allpass{background:#16241b;color:#7fe08a} .fail{background:#3d1414;color:#f77}
#log{padding:8px;white-space:pre-wrap}</style>
</head>
<body>
<!-- A FICHA gmagenda (10/09) no jogo INTEIRO — desde 03/10 a aba EVENTOS do painel único do Mestre
     (js/ui/painel_mestre.js; o openSheet('gmagenda') de antes abre a aba). O index num quadro, com a chave
     do Mestre e o save na memória (?sandbox=1), e o servidor de mentira no
     gancho Sessao._fetch. Sem sessão do site a ficha é só leitura, com a nota;
     com a sessão marcada (gm:true) o POST de 201 põe o evento na lista. Espera
     por VOLTAS, nunca pelo relógio (o tempo virtual do headless dispara). -->
<div id="summary">rodando…</div>
<div id="log"></div>
<script src="save_sandbox.js"></script>
<iframe id="f"></iframe>
<script>
(function () {
  'use strict';
  var f = document.getElementById('f'), logEl = document.getElementById('log');
  var falhas = 0, total = 0, linhas = [];
  function check(nome, ok, extra) {
    total++;
    if (!ok) falhas++;
    linhas.push((ok ? 'PASSOU · ' : 'FALHOU · ') + nome + (extra ? ' — ' + extra : ''));
    logEl.textContent = linhas.join('\n');
  }
  function fim() {
    var sum = document.getElementById('summary');
    sum.className = falhas ? 'fail' : 'allpass';
    sum.textContent = falhas ? ('FALHOU — ' + falhas + ' de ' + total) : ('tudo passou (' + total + ')');
    window.__done = true; window.__fail = falhas; window.__pronto = true;
  }
  var AGORA = 1789041600;                       // qui 10/09/2026 09:00 de Brasília
  function exemplo() {
    return {
      ok: true, agora: AGORA, fusoMin: -180, janelaDias: 14,
      tetos: { xp: 20.0, vintem: 10.0, pedras: 10.0, saque: 10.0, aviso: 1.0 },
      ativos: [{ id: 'e12', origem: 'pontual', regra: null, tipo: 'xp', multiplicador: 2.0, calabouco: null,
                 titulo: 'Quinta do XP', texto: 'Toda sala paga o dobro de experiência.', inicio: 1789038000, fim: 1789092000 }],
      proximos: [{ id: 'r3@1789218000', origem: 'calendario', regra: 3, tipo: 'saque', multiplicador: 1.5,
                   calabouco: 'cistern', titulo: 'Maré da Cisterna', texto: '', inicio: 1789218000, fim: 1789261200 }],
      regras: [{ id: 3, tipo: 'saque', multiplicador: 1.5, calabouco: 'cistern', titulo: 'Maré da Cisterna', texto: '',
                 dias: [6], hora: '10:00', duracaoMin: 720, vigenteDe: null, vigenteAte: null }],
      fatores: { geral: { xp: 2.0 }, porCalabouco: {} }
    };
  }
  function clica(b) { if (b) b.click(); }
  function esperaAte(fn, max) {
    return new Promise(function (pronto) {
      var v = 0;
      (function volta() {
        var r = false;
        try { r = !!fn(); } catch (e) { r = false; }
        if (r) return pronto(true);
        if (++v >= max) return pronto(false);
        setTimeout(volta, 250);
      })();
    });
  }

  f.onload = function () {
    if (window.__rodou) return;
    window.__rodou = true;
    var w = f.contentWindow, d = w.document;
    var erros = [];
    w.addEventListener('error', function (e) { erros.push(e.message + ' @' + String(e.filename || '').split('/').pop() + ':' + e.lineno); });
    var voltas = 0;
    (function espera() {
      var menu = d.querySelector('.screen-menu.is-on');
      var ok = !!(menu && w.JOGO && w.JOGO.UI && w.JOGO.UI.openSheet && w.JOGO.Agenda);
      if (!ok && ++voltas < 150) return setTimeout(espera, 800);
      if (!ok) { check('o jogo abriu no menu com a agenda carregada', false, 'estourou as voltas'); return fim(); }
      try { roda(w, d, erros); }
      catch (e) { check('a prova não lançou exceção', false, e.message); fim(); }
    })();
  };
  f.src = '../index.html?sandbox=1&gm=mestre-do-fundo&prova-gm-agenda&v=' + Date.now();

  function roda(w, d, erros) {
    var J = w.JOGO, S = J.Sessao, Ag = J.Agenda, UI = J.UI;
    check('o index carregou a agenda (depois do Diario)', typeof Ag.fator === 'function' && !!J.Diario);
    check('o modo Mestre está ligado pela chave local', !!J.GM && J.GM.ativo() === true);
    S.esquece();
    Ag._agora = function () { return AGORA * 1000; };

    // ---- o servidor de mentira
    var mundo = exemplo(), chamadas = [], fora = false, seq = 100;
    function http(st, j) {
      return Promise.resolve({ status: st, json: function () { return Promise.resolve(JSON.parse(JSON.stringify(j))); } });
    }
    S._fetch = function (url, pedido) {
      var corpo = pedido.body ? JSON.parse(pedido.body) : null;
      var auth = (pedido.headers || {}).Authorization || null;
      chamadas.push({ url: url, method: pedido.method, auth: auth, body: corpo });
      if (fora) return Promise.reject(new Error('rede fora'));
      if (pedido.method === 'GET' && /\/api\/eventos$/.test(url)) return http(200, mundo);
      if (pedido.method !== 'POST') return http(404, { ok: false, erro: 'rota desconhecida' });
      if (!auth) return http(401, { ok: false, erro: 'entre primeiro' });
      if (/\/api\/eventos$/.test(url)) {
        var novo = { id: 'e' + (++seq), origem: 'pontual', regra: null, tipo: corpo.tipo,
                     multiplicador: corpo.multiplicador || 1, calabouco: corpo.calabouco || null, titulo: corpo.titulo,
                     texto: corpo.texto || '', inicio: corpo.inicio || AGORA, fim: corpo.fim };
        (novo.inicio <= AGORA ? mundo.ativos : mundo.proximos).push(novo);
        return http(201, { ok: true, evento: novo });
      }
      if (/\/api\/eventos\/cancelar$/.test(url)) {
        var alvo = 'e' + corpo.id, antes = mundo.ativos.length + mundo.proximos.length;
        mundo.ativos = mundo.ativos.filter(function (e) { return e.id !== alvo; });
        mundo.proximos = mundo.proximos.filter(function (e) { return e.id !== alvo; });
        return http(200, { ok: true, cancelado: mundo.ativos.length + mundo.proximos.length < antes });
      }
      return http(404, { ok: false, erro: 'rota desconhecida' });
    };
    function posts() { return chamadas.filter(function (c) { return c.method === 'POST'; }); }
    function painel() { return d.querySelector('.pm-capa .pm-corpo'); }   // 03/10: a aba Eventos do painel único
    function aba(nome) {
      return [].slice.call(painel().querySelectorAll('.ag-aba')).filter(function (b) { return b.textContent.trim() === nome; })[0];
    }

    Ag.atualizar().then(function (r) {
      check('a agenda buscou no servidor de mentira', r.ok === true && Ag.noAr() === true, JSON.stringify(r));

      // ---- 1. sem sessão: só leitura, com a nota
      UI.openSheet('gmagenda');
      var p = painel();
      var abaOn = d.querySelector('.pm-capa .pm-aba.is-on');
      check('openSheet("gmagenda") abre a aba Eventos do painel único do Mestre (e nenhuma ficha da HUD)',
            !!p && J.PainelMestre.aba() === 'eventos' && !!abaOn && abaOn.textContent === 'Eventos' &&
            !!p.querySelector('.ag-sub') && !d.querySelector('#ui-root .ui-sheet.is-on'), abaOn && abaOn.textContent);
      var nomes = [].slice.call(p.querySelectorAll('.ag-aba')).map(function (b) { return b.textContent.trim(); });
      check('as três abas: Agora, Agendar, Calendário', nomes.join('|') === 'Agora|Agendar|Calendário', nomes.join('|'));
      var nota = p.querySelector('.ag-nota');
      check('sem sessão aparece a nota do Mestre',
            !!nota && nota.textContent.indexOf('Para ligar evento, entre no site com a conta do Mestre: o servidor confere a marca.') >= 0,
            nota && nota.textContent);
      var envia = p.querySelector('.ag-envia');
      check('sem sessão o botão de ligar fica desligado', !!envia && envia.disabled === true);
      var linhaE12 = p.querySelector('[data-evento="e12"]');
      check('a lista aparece só para leitura: a Quinta do XP no ar, com "Encerrar" desligado',
            !!linhaE12 && /Quinta do XP/.test(linhaE12.textContent) && linhaE12.querySelector('.ag-cancela').disabled === true);

      clica(aba('Calendário'));
      p = painel();
      check('Calendário: a regra da Cisterna em texto (a lista "Toda semana")', /Todo sábado, 10:00–22:00 \(Brasília\)/.test(p.textContent));
      // 08/10 à noite: o CALENDÁRIO EM GRADE (dono: "em formato de calendário, não em linhas") — um mês,
      // 7 colunas, tudo em Brasília pelo relógio do servidor: setembro de 2026, o dia 10 (quinta) aceso
      var cabs = [].slice.call(p.querySelectorAll('.ag-cal-grade .ag-cal-cab')).map(function (x) { return x.textContent; });
      check('Calendário: a grade tem 7 colunas, de dom a sáb', cabs.join('|') === 'dom|seg|ter|qua|qui|sex|sáb', cabs.join('|'));
      var mesEl = p.querySelector('.ag-cal-mes');
      check('Calendário: o mês no alto é setembro de 2026 (o relógio do servidor, em Brasília)',
            !!mesEl && mesEl.textContent === 'setembro 2026', mesEl && mesEl.textContent);
      var celulas = [].slice.call(p.querySelectorAll('.ag-cal-dia[data-dia]'));
      check('Calendário: 30 células de dia, de 01 a 30, cada uma na coluna do seu dia da semana',
            celulas.length === 30 && celulas[0].getAttribute('data-dia') === '2026-09-01' && celulas[29].getAttribute('data-dia') === '2026-09-30' &&
            p.querySelectorAll('.ag-cal-grade .ag-cal-dia.is-vazio').length === 2 + 3,   // 1/9 é terça: 2 vazias antes; 30/9 é quarta: 3 depois
            celulas.length + ' células, ' + p.querySelectorAll('.ag-cal-grade .ag-cal-dia.is-vazio').length + ' vazias');
      var acesos = [].slice.call(p.querySelectorAll('.ag-cal-dia.is-hoje')).map(function (x) { return x.getAttribute('data-dia'); });
      check('Calendário: só o dia de hoje (qui 10/09) fica aceso', acesos.join(',') === '2026-09-10', acesos.join(','));
      function cel(dia) { return p.querySelector('.ag-cal-dia[data-dia="' + dia + '"]'); }
      var sabados = ['2026-09-05', '2026-09-12', '2026-09-19', '2026-09-26'];
      check('Calendário: a Maré da Cisterna (todo sábado, 10:00) é um chip nos quatro sábados, com a hora e a cor do saque',
            sabados.every(function (s) {
              var ch = cel(s) && cel(s).querySelector('.ag-cal-chip.ag-t-saque');
              return !!ch && ch.textContent === '10:00' && /Maré da Cisterna/.test(ch.title);
            }));
      check('Calendário: ... e em nenhum outro dia (a ocorrência já expandida pelo servidor não entra duas vezes)',
            celulas.every(function (c) {
              return sabados.indexOf(c.getAttribute('data-dia')) >= 0 || !c.querySelector('.ag-cal-chip.ag-t-saque');
            }) && cel('2026-09-12').querySelectorAll('.ag-cal-chip').length === 1);
      var chipXp = cel('2026-09-10') && cel('2026-09-10').querySelector('.ag-cal-chip.ag-t-xp');
      check('Calendário: a Quinta do XP (no ar hoje) é um chip ×2 no dia 10, e só nele',
            !!chipXp && chipXp.textContent === '×2' && !cel('2026-09-11').querySelector('.ag-cal-chip.ag-t-xp'), chipXp && chipXp.textContent);
      // os 14 Calabouços do Dia de hoje em diante: o sorteio pela chave do dia de Brasília (diario.js), célula a célula
      var certos = 0, errados = [];
      for (var k = 0; k < 14; k++) {
        var tsK = Date.UTC(2026, 8, 10 + k, 15);                   // o meio-dia de Brasília daquele dia
        var esperado = J.Diario.hoje(tsK);
        var cK = cel('2026-09-' + (10 + k));
        var sg = cK && cK.querySelector('.ag-cal-cal');
        if (cK && esperado && cK.getAttribute('data-calabouco') === esperado.dungeonId && !!sg &&
            sg.title === 'Calabouço do Dia: ' + Ag.nomeCalabouco(esperado.dungeonId) && /^☀ [A-ZÁÉÍÓÚÂÊÔÃÕÇ]{1,3}$/.test(sg.textContent)) certos++;
        else errados.push((10 + k) + ':' + (cK && cK.getAttribute('data-calabouco')) + '≠' + (esperado && esperado.dungeonId));
      }
      check('Calendário: os 14 Calabouços do Dia estão nas células certas — a sigla na célula e o nome inteiro no title', certos === 14, errados.join(' '));
      check('Calendário: o Calabouço do Dia nunca é portal fechado', celulas.every(function (c) {
        var id = c.getAttribute('data-calabouco');
        return !!id && !J.DATA.portalFechado(id);
      }));
      // os detalhes: o dia de hoje já vem aberto embaixo da grade, com as linhas de sempre
      var det = p.querySelector('.ag-cal-det');
      check('Calendário: os detalhes de hoje vêm abertos — o Calabouço do Dia e a Quinta do XP no ar, com "Encerrar" desligado',
            !!det && det.getAttribute('data-dia-det') === '2026-09-10' && /Calabouço do Dia/.test(det.textContent) &&
            !!det.querySelector('[data-evento="e12"]') && det.querySelector('[data-evento="e12"] .ag-cancela').disabled === true,
            det && det.textContent.slice(0, 160));
      // o toque no sábado 12 marca a célula e abre a regra da Cisterna
      clica(cel('2026-09-12'));
      p = painel();
      det = p.querySelector('.ag-cal-det');
      check('Calendário: o toque no sábado 12 marca a célula e abre os detalhes com a regra da Cisterna (Cancelar desligado)',
            !!det && det.getAttribute('data-dia-det') === '2026-09-12' && !!cel('2026-09-12') && cel('2026-09-12').classList.contains('is-sel') &&
            !cel('2026-09-10').classList.contains('is-sel') && !!det.querySelector('[data-regra="3"]') &&
            /Maré da Cisterna/.test(det.textContent) && /Todo sábado, 10:00–22:00/.test(det.textContent) &&
            det.querySelector('[data-regra="3"] .ag-cancela').disabled === true, det && det.textContent.slice(0, 160));
      // as setas: outubro não tem dia aceso e ganha o botão Hoje; a regra segue nos sábados de lá (3/10)
      clica(p.querySelector('.ag-cal-prox'));
      p = painel();
      check('Calendário: › vai para outubro de 2026 — sem dia aceso, com o botão Hoje, e a regra segue nos sábados de lá',
            p.querySelector('.ag-cal-mes').textContent === 'outubro 2026' && !p.querySelector('.ag-cal-dia.is-hoje') &&
            !!p.querySelector('.ag-cal-hoje') && !!p.querySelector('.ag-cal-dia[data-dia="2026-10-03"] .ag-cal-chip.ag-t-saque') &&
            !p.querySelector('.ag-cal-dia[data-dia="2026-10-02"] .ag-cal-chip'), p.querySelector('.ag-cal-mes').textContent);
      clica(p.querySelector('.ag-cal-hoje'));
      p = painel();
      check('Calendário: "Hoje" volta a setembro, com o 10 aceso e tocado de novo',
            p.querySelector('.ag-cal-mes').textContent === 'setembro 2026' && !!p.querySelector('.ag-cal-dia.is-hoje.is-sel[data-dia="2026-09-10"]'));
      // o formulário da regra nova fica recolhido num botão, para a grade ter espaço
      check('Calendário: o formulário da regra nova vem recolhido (sem o seletor de calabouço nem o "Pôr no calendário")',
            !p.querySelector('select.ag-sel') && !p.querySelector('.ag-envia') && !!p.querySelector('.ag-cal-nova'));
      clica(p.querySelector('.ag-cal-nova'));
      p = painel();
      check('Calendário: "Nova regra de toda semana" abre o formulário com os sete dias e o "Pôr no calendário" (desligado sem sessão)',
            p.querySelectorAll('.ag-dia-b').length === 7 && !!p.querySelector('.ag-envia') && p.querySelector('.ag-envia').disabled === true &&
            /Pôr no calendário/.test(p.querySelector('.ag-envia').textContent));
      var selCal = [].slice.call(p.querySelectorAll('select.ag-sel')).filter(function (s2) {
        return [].slice.call(s2.options).some(function (o) { return o.value === 'poco'; });
      })[0];
      var ofertas = selCal ? [].slice.call(selCal.options).map(function (o) { return o.value; }) : [];
      check('o seletor de calabouço oferece "todos", os abertos e o Poço — nenhum fechado',
            ofertas[0] === '' && ofertas.indexOf('poco') > 0 && ofertas.indexOf('greenhouse') > 0 &&
            ofertas.every(function (id) { return !id || id === 'poco' || !J.DATA.portalFechado(id); }), ofertas.join(','));
      clica(aba('Agendar'));
      check('Agendar: início e fim em datetime-local', painel().querySelectorAll('input[type="datetime-local"]').length === 2);

      // ---- 2. a marca do Mestre, mas o servidor fora: só leitura também
      S.guarda({ token: 'tok-m', conta: { id: 1, nome: 'Dono', gm: true } });
      fora = true;
      return Ag.atualizar();
    }).then(function () {
      UI.openSheet('gmagenda');
      var p = painel();
      var nota = p.querySelector('.ag-nota');
      check('com a marca e o servidor fora: a nota diz que o servidor está fora, e os botões desligam',
            !!nota && /servidor está fora/.test(nota.textContent) && p.querySelector('.ag-envia').disabled === true);
      fora = false;
      return Ag.atualizar();
    }).then(function () {
      // ---- 3. a marca e o servidor no ar: liga de verdade
      UI.openSheet('gmagenda');
      clica(aba('Agora'));
      var p = painel();
      check('com a sessão do Mestre: sem nota, e o botão de ligar liga', !p.querySelector('.ag-nota') &&
            p.querySelector('.ag-envia').disabled === false);
      var selTipo = p.querySelector('select.ag-sel');               // o primeiro é o Tipo
      selTipo.value = 'pedras';
      selTipo.dispatchEvent(new w.Event('change'));                 // o tipo repinta a ficha
      p = painel();
      var tit = p.querySelector('input.ag-in[type="text"]');
      tit.value = 'Sábado de Pedra';
      tit.dispatchEvent(new w.Event('input'));
      var n0 = posts().length;
      clica(p.querySelector('.ag-envia'));
      return esperaAte(function () {
        var p2 = painel();
        return p2 && /Sábado de Pedra/.test(p2.textContent) && /Liga agora/.test(p2.textContent);
      }, 80).then(function (apareceu) {
        var c = posts()[posts().length - 1] || {};
        check('o POST foi um só, com Authorization, sem início (liga agora) e fim = agora + 2 h',
              posts().length === n0 + 1 && c.auth === 'Bearer tok-m' && /\/api\/eventos$/.test(c.url) &&
              c.body.tipo === 'pedras' && c.body.multiplicador === 2 && c.body.inicio === undefined &&
              c.body.fim === AGORA + 2 * 3600 && c.body.titulo === 'Sábado de Pedra', JSON.stringify(c.body));
        check('o 201 faz o evento aparecer na lista da ficha', apareceu);
        check('... e ele já vale na agenda: pedras ×2', Ag.fator('pedras', 'greenhouse') === 2);
      });
    }).then(function () {
      // ---- 4. encerrar a Quinta do XP (com a pergunta antes)
      var b = painel().querySelector('[data-evento="e12"] .ag-cancela');
      check('com a sessão, "Encerrar" fica ligado', !!b && b.disabled === false && /Encerrar/.test(b.textContent));
      clica(b);
      // a pergunta é uma janela POR CIMA do painel (a ficha da HUD ficaria por baixo dele)
      var conf = [].slice.call(d.querySelectorAll('.mod-capa button')).filter(function (x) { return /Confirmar/.test(x.textContent); })[0];
      check('encerrar pergunta antes, numa janela por cima do painel', !!conf);
      clica(conf);
      return esperaAte(function () {
        var p2 = painel();
        return p2 && /Liga agora/.test(p2.textContent) && !p2.querySelector('[data-evento="e12"]');
      }, 80).then(function (saiu) {
        var c = posts()[posts().length - 1] || {};
        check('encerrar: POST /api/eventos/cancelar {alvo:"evento", id:12}',
              /\/api\/eventos\/cancelar$/.test(c.url) && c.body.alvo === 'evento' && c.body.id === 12, JSON.stringify(c.body));
        check('... e a Quinta do XP saiu da lista', saiu);
        check('... e da agenda: o XP volta a 1', Ag.fator('xp', 'greenhouse') === 1);
      });
    }).then(function () {
      // ---- 5. o que o JOGADOR vê: a faixa no Acampamento, o painel do portal e
      // os chips da recompensa. O nome vem antes: sem ele a praça pede o nome
      // e o pedido toma o painel do portal.
      UI.closeSheet();
      J.PainelMestre.fechar();
      return J.DB.batizar('Mestre da Prova').then(function () {
        UI.showScreen('hub');
        return esperaAte(function () {
          var nm = d.querySelector('.screen-hub .hub-nome');
          return nm && nm.textContent === 'Mestre da Prova';
        }, 60);
      }).then(function () {
        var fx = d.querySelector('.screen-hub .hub-evento');
        var link = fx && fx.querySelector('a');
        check('Acampamento: a faixa mostra o evento no ar, quanto falta e o link do calendário',
              !!fx && !fx.classList.contains('is-off') && /Pedras de forja ×2/.test(fx.textContent) &&
              /Sábado de Pedra/.test(fx.textContent) && /termina em 2 h/.test(fx.textContent) &&
              !!link && /site\/eventos\.html$/.test(link.getAttribute('href')), fx && fx.textContent);
        // o Mestre liga mais um (saque só na Estufa): a faixa repinta sozinha, pelo aoMudar
        mundo.ativos.push({ id: 'e300', origem: 'pontual', regra: null, tipo: 'saque', multiplicador: 1.5,
                            calabouco: 'greenhouse', titulo: 'Chuva de Peças', texto: '', inicio: AGORA - 60, fim: AGORA + 3600 });
        return Ag.atualizar();
      }).then(function () {
        var fx = d.querySelector('.screen-hub .hub-evento');
        check('a faixa repinta sozinha quando a agenda muda (aoMudar), e diz onde vale',
              !!fx && /Chuva de Peças/.test(fx.textContent) && /só na Estufa Soterrada/.test(fx.textContent), fx && fx.textContent);
        // o portal da Estufa, sendo ele o Calabouço do Dia: o saque do evento não soma
        var ehOrig = J.Diario.ehHoje;
        J.Diario.ehHoje = function (id) { return id === 'greenhouse'; };
        J.Hub.aoAproximar({ tipo: 'portal', id: 'greenhouse', nome: 'A Estufa Soterrada' });
        var pn = d.querySelector('.screen-hub .hub-painel');
        var dia = pn && pn.querySelector('.hub-dia');
        var linhas = pn ? [].slice.call(pn.querySelectorAll('.hub-evento-linha')).map(function (x) { return x.textContent; }) : [];
        check('portal: o "+50%" do Dia vem do Diario, não do texto', !!dia && /\+50% de saque/.test(dia.textContent), dia && dia.textContent);
        check('portal: uma linha por evento que vale ali (o geral e o da Estufa)',
              linhas.length === 2 && linhas.some(function (t) { return /Sábado de Pedra/.test(t); }) &&
              linhas.some(function (t) { return /Chuva de Peças/.test(t); }), linhas.join(' | '));
        check('portal: saque do evento junto do Calabouço do Dia diz "vale o maior"',
              linhas.some(function (t) { return /Chuva de Peças/.test(t) && /vale o maior/.test(t); }));
        J.Diario.ehHoje = ehOrig;
        J.Hub.aoAproximar({ tipo: 'portal', id: 'cistern', nome: 'A Cisterna dos Afogados' });
        pn = d.querySelector('.screen-hub .hub-painel');
        check('portal da Cisterna: o evento da Estufa não aparece, o geral sim',
              !!pn && !/Chuva de Peças/.test(pn.textContent) && /Sábado de Pedra/.test(pn.textContent), pn && pn.textContent);
        // a tela de recompensa de uma sala SEM peça: os Vinténs aparecem, com o chip
        UI.showScreen('roomClear', { xpGanho: 40, xpMult: {}, xpPorHeroi: {}, levelUps: [], moedas: 12,
          drops: [], stones: {}, selos: {}, insignias: 0, cards: [], pets: [], petCards: [], petXp: {}, petLevelUps: [],
          desafio: null, dizimo: null, elementChoices: [],
          eventos: [{ id: 'e12', titulo: 'Quinta do XP', tipo: 'xp', fator: 2 },
                    { id: 'e7', titulo: 'Vintém Dobrado', tipo: 'vintem', fator: 1.5 }] });
        var tela = d.querySelector('.screen-roomClear') || d;
        var blocos = [].slice.call(tela.querySelectorAll('.rw-block'));
        function bloco(t) { return blocos.filter(function (b) { var h = b.querySelector('h3'); return h && h.textContent === t; })[0]; }
        var bXp = bloco('Experiência'), bV = bloco('Vinténs');
        check('recompensa: o chip do evento no bloco de XP', !!bXp && !!bXp.querySelector('.rw-evento') &&
              /Quinta do XP · XP ×2/.test(bXp.querySelector('.rw-evento').textContent), bXp && bXp.textContent);
        check('recompensa: sala sem peça ainda mostra os Vinténs, com o chip do evento',
              !!bV && /Vintém Dobrado · Vinténs ×1,5/.test(bV.textContent) && !bloco('Saque'), bV ? bV.textContent : 'sem o bloco');
        // o redesenho de quando os modelos 3D terminam de carregar não zera a tela (10/09)
        UI.repaint();
        tela = d.querySelector('.screen-roomClear') || d;
        blocos = [].slice.call(tela.querySelectorAll('.rw-block'));
        bXp = bloco('Experiência');
        check('recompensa: depois do UI.repaint o chip do evento continua no bloco de XP',
              !!bXp && !!bXp.querySelector('.rw-evento') && /Quinta do XP · XP ×2/.test(bXp.querySelector('.rw-evento').textContent),
              bXp && bXp.textContent);
      });
    }).then(function () {
      check('nenhum erro de JS no jogo durante a prova', erros.length === 0, erros.join(' | '));
      S.esquece();
      fim();
    }, function (e) {
      check('a prova não lançou exceção', false, e && e.message);
      fim();
    });
  }
})();
</script>
</body>
</html>
