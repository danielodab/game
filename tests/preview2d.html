<!DOCTYPE html>
<html lang="pt-BR">
<head>

<style>
  html, body { margin:0; padding:0; height:100%; background:#07090c; overflow:hidden;
    font-family: 'Trebuchet MS', Verdana, sans-serif; color:#e8e2d4; }
  #stage { position:fixed; inset:0; }
  #game-canvas { display:block; width:100%; height:100%; }
  #ui-root { position:fixed; inset:0; pointer-events:none; z-index:10; }
  #ui-root > .panel { pointer-events:auto; }
  .panel { position:absolute; left:0; right:0; bottom:0;
    background:linear-gradient(180deg, rgba(10,12,16,.55), rgba(10,12,16,.94));
    border-top:1px solid #2a3038; padding:6px 8px 8px; }
  .row { display:flex; flex-wrap:wrap; gap:5px; align-items:center; }
  button { font:inherit; font-size:12px; padding:8px 10px; min-height:36px;
    background:#1d232c; color:#e8e2d4; border:1px solid #39424e; border-radius:7px; cursor:pointer; }
  button:hover { background:#2a323e; }
  button.el { border-color:#5a4a3a; }
  #hud { position:absolute; top:0; left:0; padding:6px 9px; font-size:12px; line-height:1.45;
    background:rgba(8,10,14,.7); border-bottom-right-radius:8px; pointer-events:none; }
  #test-status { font-weight:bold; color:#8fe0a0; }
  .tag { color:#8fa0b0; }
  @media (max-width:520px) { button { font-size:11px; padding:7px 8px; } }
</style>
</head>

<!-- 1) STUB COMPLETO de JOGO.Game / JOGO.Engine / JOGO.DATA no formato do

<script>
var JOGO = (window.JOGO = window.JOGO || {});

// ------------------------------- DATA -------------------------------------
JOGO.DATA = {

    arqueiro:    { id:'arqueiro',    name:'Elfo Arqueiro',role:'atirador', palette:{ primary:'#7fc06a', secondary:'#33562e', accent:'#e8f0a0' } },
    bruxo:       { id:'bruxo',       name:'Bruxo',       role:'mago',      palette:{ primary:'#8a6ad0', secondary:'#3a2a5a', accent:'#c8a8ff' } },
    espadachim:  { id:'espadachim',  name:'Espadachim',  role:'assassino', palette:{ primary:'#5aa0c0', secondary:'#24485a', accent:'#a0e8ff' } },
    curandeira:  { id:'curandeira',  name:'Curandeira',  role:'suporte',   palette:{ primary:'#e0b8d0', secondary:'#7a4a68', accent:'#ffe0f0' } },
    invocador:   { id:'invocador',   name:'Invocador',   role:'invocador', palette:{ primary:'#c0a860', secondary:'#5a4a20', accent:'#ffe8a0' } }
  },

  spells: {
    'brasa':     { id:'brasa',    name:'Brasa',       element:'fogo',  paCost:3, cooldown:0, castsPerTurn:0,
                   range:{min:1,max:6,line:false,los:true}, aoe:{shape:'circle',size:1}, targetSide:'enemy', fxKey:'bolt',
                   effects:[{type:'damage',element:'fogo',min:14,max:22}], description:'Uma bola de brasa.' },
    'maremoto':  { id:'maremoto', name:'Maremoto',    element:'agua',  paCost:4, cooldown:2, castsPerTurn:1,
                   range:{min:1,max:5,line:false,los:true}, aoe:{shape:'cross',size:2}, targetSide:'any', fxKey:'nova',
                   effects:[{type:'damage',element:'agua',min:10,max:16},{type:'push',tiles:1}], description:'A água sobe.' },
    'lascas':    { id:'lascas',   name:'Lascas',      element:'terra', paCost:3, cooldown:0, castsPerTurn:0,
                   range:{min:1,max:4,line:true,los:true}, aoe:{shape:'line',size:3}, targetSide:'enemy', fxKey:'slam',
                   effects:[{type:'damage',element:'terra',min:12,max:20}], description:'Pedras em linha.' },
    'rajada':    { id:'rajada',   name:'Rajada',      element:'ar',    paCost:2, cooldown:0, castsPerTurn:0,
                   range:{min:1,max:7,line:false,los:true}, aoe:{shape:'single',size:0}, targetSide:'enemy', fxKey:'gust',
                   effects:[{type:'damage',element:'ar',min:8,max:12},{type:'push',tiles:2}], description:'Vento que empurra.' },
    'aparo':     { id:'aparo',    name:'Aparo',       element:'neutro',paCost:2, cooldown:0, castsPerTurn:0,
                   range:{min:1,max:1,line:false,los:false}, aoe:{shape:'single',size:0}, targetSide:'enemy', fxKey:'melee',
                   effects:[{type:'damage',element:'neutro',min:10,max:14}], description:'Corpo a corpo.' },
    'orvalho':   { id:'orvalho',  name:'Orvalho',     element:'agua',  paCost:3, cooldown:1, castsPerTurn:0,
                   range:{min:0,max:5,line:false,los:true}, aoe:{shape:'circle',size:1}, targetSide:'ally', fxKey:'heal',
                   effects:[{type:'heal',min:14,max:20}], description:'Cura em área.' }
  },

  monsters: {
    'raiz-torta':  { id:'raiz-torta',  name:'Raiz Torta',  element:'terra', palette:{ primary:'#7a9a4a', secondary:'#3a4a20', accent:'#d8e08a' }, stats:{ hp:60 } },
    'bafo-quente': { id:'bafo-quente', name:'Bafo Quente', element:'fogo',  palette:{ primary:'#e08a4a', secondary:'#6a2a12', accent:'#ffd06a' }, stats:{ hp:48 } },
    'lodo':        { id:'lodo',        name:'Lodo',        element:'agua',  palette:{ primary:'#5ab0a0', secondary:'#1a4a48', accent:'#a0f0e0' }, stats:{ hp:52 } },
    'mestre-cipo': { id:'mestre-cipo', name:'Mestre-Cipó', element:'terra', boss:true, palette:{ primary:'#9a7ad0', secondary:'#3a2a58', accent:'#ffd0ff' }, stats:{ hp:180 } }
  },

  pets: {
    'brasinha': { id:'brasinha', name:'Brasinha', element:'fogo', behavior:'attack', range:3, followDistance:2,
                  palette:{ primary:'#ff9a5a', secondary:'#8a3010', accent:'#ffe0a0' },
                  bonuses:{ power:5 }, spells:['brasa'], description:'Dragãozinho.' }
  },

  tileEvents: {
    'bencao':   { id:'bencao',   name:'Bênção',      kind:'buff',     icon:'⚡', weight:3, duration:3, effects:[{type:'buff',stat:'power',value:20,duration:1}] },
    'surpresa': { id:'surpresa', name:'Surpresa',    kind:'mystery',  icon:'❓', weight:3, duration:3, outcomes:[{weight:1,effects:[],text:'Nada!'}] },
    'portal':   { id:'portal',   name:'Portal',      kind:'portal',   icon:'🌀', weight:2, duration:4, effects:[{type:'teleport'}] },
    'sangue':   { id:'sangue',   name:'Sanguessuga', kind:'drain',    icon:'🩸', weight:2, duration:3, effects:[{type:'damage',element:'neutro',min:6,max:10}] },
    'fonte':    { id:'fonte',    name:'Fonte',       kind:'fountain', icon:'💧', weight:2, duration:3, effects:[{type:'heal',min:10,max:16}] }
  },

  scenery: {
    estufa: { high:['canteiro','coluna-quebrada'], low:['grade','muro-baixo'], floor:['laje','terra'], props:['vaso','samambaia'] }
  },

  dungeons: [{
    id:'estufa', name:'A Estufa Soterrada', theme:'estufa', order:1, difficulty:1,
    palette:{ primary:'#5f7a4a', secondary:'#38492c', accent:'#ffd98a', floor1:'#4e6440', floor2:'#42583a', wall:'#3a4a2a' },
    defaultWeather:'chuva', weatherShiftEveryRounds:0, tileEventRate:0.5,
    rooms:[{
      name:'Estufa — sala 1', weather:'chuva', sceneryTheme:'estufa',
      layout:[
        "...............",
        ".P...,,...#....",
        ".P..===..###..a",
        "...............",
        "..~~...,,....b.",
        ".P.~~....==....",
        "...............",
        "..###....~~....",
        "..###..,,~~..c.",
        "...=......=....",
        "...............",
        ".,,....###...d.",
        "..............."
      ],
      monsters: { a:'raiz-torta', b:'bafo-quente', c:'lodo', d:'mestre-cipo' }
    }]
  }]
};

// ------------------------------ ENGINE (stub) ------------------------------
(function () {
  var DATA = JOGO.DATA;
  var Engine = { events: [] };
  function emit(ev) { Engine.events.push(ev); }
  JOGO.__emit = emit;

  function tile(st, x, y) {
    if (!st.grid || y < 0 || x < 0 || y >= st.grid.h || x >= st.grid.w) return null;
    return st.grid.tiles[y][x];
  }
  function walkable(st, x, y) {
    var t = tile(st, x, y);
    if (!t) return false;
    if (t.type !== 'floor') return false;
    return !Engine.unitAt(st, x, y);
  }
  function seeThrough(st, x, y) {
    var t = tile(st, x, y);
    return !!t && t.type !== 'wall';
  }

  Engine.unitAt = function (st, x, y) {
    for (var i = 0; i < st.units.length; i++) {
      var u = st.units[i];
      if (u.alive && u.x === x && u.y === y) return u;
    }
    return null;
  };
  Engine.activeUnit = function (st) {
    if (!st.order || !st.order.length) return null;
    for (var i = 0; i < st.order.length; i++) {
      var uid = st.order[(st.activeIdx + i) % st.order.length];
      var u = unitById(st, uid);
      if (u && u.alive) return u;
    }
    return null;
  };
  function unitById(st, uid) {
    for (var i = 0; i < st.units.length; i++) if (st.units[i].uid === uid) return st.units[i];
    return null;
  }
  Engine.unitById = unitById;

  function adjacentEnemy(st, x, y, side) {
    var d = [[1,0],[-1,0],[0,1],[0,-1]];
    for (var i = 0; i < 4; i++) {
      var u = Engine.unitAt(st, x + d[i][0], y + d[i][1]);
      if (u && u.alive && u.side !== side) return u;
    }
    return null;
  }

  // BFS de alcance; marca RISCO de esquiva (célula vizinha a inimigo vivo)
  Engine.reachable = function (st, uid) {
    var u = unitById(st, uid);
    if (!u) return [];
    var out = [], seen = {}, q = [{ x: u.x, y: u.y, c: 0 }];
    seen[u.x + ',' + u.y] = true;
    var d = [[1,0],[-1,0],[0,1],[0,-1]];
    while (q.length) {
      var n = q.shift();
      if (n.c >= (u.pp || 0)) continue;
      for (var i = 0; i < 4; i++) {
        var nx = n.x + d[i][0], ny = n.y + d[i][1], k = nx + ',' + ny;
        if (seen[k] || !walkable(st, nx, ny)) continue;
        seen[k] = true;
        var risky = !!adjacentEnemy(st, n.x, n.y, u.side);
        out.push({ x: nx, y: ny, cost: n.c + 1, risky: risky });
        q.push({ x: nx, y: ny, c: n.c + 1 });
      }
    }
    return out;
  };

  Engine.path = function (st, uid, tx, ty) {
    var u = unitById(st, uid);
    if (!u || !walkable(st, tx, ty)) return null;
    var prev = {}, seen = {}, q = [{ x: u.x, y: u.y }];
    seen[u.x + ',' + u.y] = true;
    var d = [[1,0],[-1,0],[0,1],[0,-1]], found = false;
    while (q.length && !found) {
      var n = q.shift();
      for (var i = 0; i < 4; i++) {
        var nx = n.x + d[i][0], ny = n.y + d[i][1], k = nx + ',' + ny;
        if (seen[k] || !walkable(st, nx, ny)) continue;
        seen[k] = true; prev[k] = n;
        if (nx === tx && ny === ty) { found = true; break; }
        q.push({ x: nx, y: ny });
      }
    }
    if (!found) return null;
    var path = [], cur = { x: tx, y: ty };
    while (cur && !(cur.x === u.x && cur.y === u.y)) {
      path.unshift({ x: cur.x, y: cur.y });
      cur = prev[cur.x + ',' + cur.y];
    }
    if (path.length > (u.pp || 0)) path = path.slice(0, u.pp || 0);
    return path.length ? path : null;
  };

  Engine.castTargets = function (st, uid, spellId) {
    var u = unitById(st, uid), sp = DATA.spells[spellId];
    if (!u || !sp) return [];
    var out = [], r = sp.range;
    for (var y = 0; y < st.grid.h; y++) {
      for (var x = 0; x < st.grid.w; x++) {
        var dist = Math.abs(x - u.x) + Math.abs(y - u.y);
        if (dist < r.min || dist > r.max) continue;
        var t = tile(st, x, y);
        if (!t || t.type === 'wall') continue;
        if (r.line && x !== u.x && y !== u.y) continue;
        out.push({ x: x, y: y });
      }
    }
    return out;
  };

  Engine.aoeTiles = function (st, spellId, ax, ay, x, y) {
    var sp = DATA.spells[spellId];
    if (!sp) return [{ x: x, y: y }];
    var a = sp.aoe || { shape: 'single', size: 0 }, out = [], i, j;
    if (a.shape === 'single') out.push({ x: x, y: y });
    else if (a.shape === 'cross') {
      out.push({ x: x, y: y });
      for (i = 1; i <= a.size; i++) {
        out.push({ x: x + i, y: y }, { x: x - i, y: y }, { x: x, y: y + i }, { x: x, y: y - i });
      }
    } else if (a.shape === 'circle') {
      for (i = -a.size; i <= a.size; i++) for (j = -a.size; j <= a.size; j++) {
        if (Math.abs(i) + Math.abs(j) <= a.size) out.push({ x: x + i, y: y + j });
      }
    } else if (a.shape === 'line') {
      var dx = Math.sign(x - ax), dy = Math.sign(y - ay);
      for (i = 0; i < a.size; i++) out.push({ x: x + dx * i, y: y + dy * i });
    } else if (a.shape === 'ring') {
      for (i = -a.size; i <= a.size; i++) for (j = -a.size; j <= a.size; j++) {
        if (Math.abs(i) + Math.abs(j) === a.size) out.push({ x: x + i, y: y + j });
      }
    } else out.push({ x: x, y: y });
    return out.filter(function (t) {
      var tt = tile(st, t.x, t.y);
      return tt && tt.type !== 'wall';
    });
  };

  // ---- criação da batalha (formato exato do contrato) ----
  Engine.createBattle = function (dungeonId, roomIndex) {
    var dg = null;
    for (var i = 0; i < DATA.dungeons.length; i++) if (DATA.dungeons[i].id === dungeonId) dg = DATA.dungeons[i];
    var room = dg.rooms[roomIndex];
    var layout = room.layout, h = layout.length, w = layout[0].length;
    var tiles = [], heroSpawns = [], monsterSpawns = [];
    for (var y = 0; y < h; y++) {
      var row = [];
      for (var x = 0; x < w; x++) {
        var ch = layout[y].charAt(x);
        if (ch === '#') row.push({ type: 'wall', deco: false });
        else if (ch === '=') row.push({ type: 'low', deco: false });      // obstáculo BAIXO
        else if (ch === '~') row.push({ type: 'hole', deco: false });
        else if (ch === ',') row.push({ type: 'floor', deco: true });
        else row.push({ type: 'floor', deco: false });
        if (ch === 'P') heroSpawns.push({ x: x, y: y });
        else if (ch >= 'a' && ch <= 'z') monsterSpawns.push({ x: x, y: y, letter: ch });
      }
      tiles.push(row);
    }
    var st = {
      dungeonId: dungeonId, roomIndex: roomIndex, round: 1, phase: 'playing',
      grid: { w: w, h: h, tiles: tiles },
      units: [], order: [], activeIdx: 0,
      weather: room.weather || dg.defaultWeather || 'calmo',
      tileEventsActive: [], _uid: 0
    };

    // ADENDO v2.1: o grupo é de 1 ou 2 heróis. Spawns 'P' sobrando são ignorados.
    var heroDefs = [
      { defId:'sumo', name:'Repique', element:'terra', hp:110, pa:6, pp:3 },
      { defId:'curandeira', name:'Rosácea', element:'agua', hp:84, pa:6, pp:4 }
    ];
    for (var hi = 0; hi < heroDefs.length && hi < heroSpawns.length; hi++) {
      var hd = heroDefs[hi], sp = heroSpawns[hi];
      st.units.push(mkUnit(st, hd.defId, 'hero', 'player', sp.x, sp.y, {
        name: hd.name, element: hd.element, hp: hd.hp, pa: hd.pa, pp: hd.pp,
        classId: hd.defId, spells: ['brasa','maremoto','lascas','rajada','aparo','orvalho'], level: 12
      }));
    }
    // pet do primeiro herói
    var owner = st.units[0];
    var pet = mkUnit(st, 'brasinha', 'pet', 'player', owner.x + 1, owner.y + 1, {
      name: 'Brasinha', element: 'fogo', hp: 30, pa: 3, pp: 3, spells: ['brasa']
    });
    pet.ownerUid = owner.uid;
    pet.followDistance = 2;
    st.units.push(pet);

    for (var mi = 0; mi < monsterSpawns.length; mi++) {
      var ms = monsterSpawns[mi];
      var mid = room.monsters[ms.letter];
      var md = DATA.monsters[mid];
      if (!md) continue;
      st.units.push(mkUnit(st, mid, 'monster', 'enemy', ms.x, ms.y, {
        name: md.name, element: md.element, hp: md.stats.hp, pa: 5, pp: 3,
        boss: !!md.boss, spells: ['aparo']
      }));
    }

    // ordem de iniciativa
    for (var oi = 0; oi < st.units.length; oi++) if (st.units[oi].kind !== 'pet') st.order.push(st.units[oi].uid);

    // lotação extra para medir 60 fps com ~40 unidades (?units=40)
    var want = parseInt((/[?&]units=(\d+)/.exec(location.search) || [])[1] || '0', 10);
    if (want > st.units.length) {
      var pool = ['raiz-torta', 'bafo-quente', 'lodo'], n = 0;
      for (var fy = 0; fy < h && st.units.length < want; fy++) {
        for (var fx2 = 0; fx2 < w && st.units.length < want; fx2++) {
          if (tiles[fy][fx2].type !== 'floor' || Engine.unitAt(st, fx2, fy)) continue;
          if ((fx2 + fy) % 2) continue;
          var mid2 = pool[n % pool.length], md2 = DATA.monsters[mid2];
          st.units.push(mkUnit(st, mid2, 'monster', n % 3 ? 'enemy' : 'player', fx2, fy, {
            name: md2.name + ' ' + (n + 1), element: md2.element, hp: md2.stats.hp, pa: 4, pp: 3, spells: ['aparo']
          }));
          st.order.push(st.units[st.units.length - 1].uid);
          n++;
        }
      }
    }

    // eventos de terreno já no chão
    st.tileEventsActive = [
      { x: 6, y: 3, eventId: 'bencao', roundsLeft: 3 },
      { x: 9, y: 6, eventId: 'surpresa', roundsLeft: 3 },
      { x: 4, y: 10, eventId: 'fonte', roundsLeft: 2 },
      { x: 11, y: 9, eventId: 'portal', roundsLeft: 4 },
      { x: 7, y: 12, eventId: 'sangue', roundsLeft: 3 }
    ];
    return st;
  };

  function mkUnit(st, defId, kind, side, x, y, o) {
    st._uid++;
    return {
      uid: 'u' + st._uid, defId: defId, kind: kind, side: side,
      name: o.name || defId, x: x, y: y,
      hp: o.hp, hpMax: o.hp, pa: o.pa, paMax: o.pa, pp: o.pp, ppMax: o.pp,
      initiative: 10, power: 10, dodge: 6, lock: 6,

          pump();
        }
        for (var i = 0; i < n; i++) {
          JOGO.Renderer.render(0.016);
          pump();
        }
        try {
          var cv = document.getElementById('game-canvas');
          var im = document.createElement('img');
          im.src = cv.toDataURL('image/png');
          im.style.position = 'fixed'; im.style.left = '0'; im.style.top = '0';
          im.style.width = '100%'; im.style.height = '100%'; im.style.zIndex = '5';
          document.body.appendChild(im);
          var st2 = document.getElementById('test-status');
          if (st2) st2.textContent += ' | snap ' + n + 'f ' + cv.width + 'x' + cv.height;
        } catch (e) {
          var st3 = document.getElementById('test-status');
          if (st3) st3.textContent += ' | snap ERRO: ' + e.message;
        }
      }, parseInt(qs.snapdelay || '260', 10));
    }
    // ---- TIRA DE QUADROS: uma ação, N recortes em sequência, tudo numa
    //      única captura (o headless não filma; então a página monta o filme).
    //      ?strip=bt-walk2&shots=8&step=4&crop=300,320&zoom=1.1&cols=4
    if (qs.strip) {
      setTimeout(function () { runStrip(); }, parseInt(qs.snapdelay || '260', 10));
    }
    function runStrip() {
      var shots = parseInt(qs.shots || '8', 10);
      var step = parseInt(qs.step || '4', 10);
      // dt por render: no headless (SwiftShader) cada frame custa caro, então
      // avançamos mais tempo por render em vez de renderizar mais vezes
      var dts = (parseFloat(qs.dt || '16') || 16) / 1000;
      var cr = (qs.crop || '300,320').split(',');
      var cw = parseInt(cr[0], 10), ch = parseInt(cr[1], 10);
      var cols = parseInt(qs.cols || '4', 10);
      var cv = document.getElementById('game-canvas');
      var R = JOGO.Renderer;
      var box = document.createElement('div');
      box.style.cssText = 'position:fixed;inset:0;z-index:30;background:#0b0e12;' +
        'display:grid;grid-template-columns:repeat(' + cols + ',1fr);gap:3px;padding:3px;' +
        'align-content:start';
      document.body.appendChild(box);
      pump();
      if (acts[qs.strip]) { acts[qs.strip](); pump(); }
      var A = window.__stripA || { x: 4, y: 4 }, B = window.__stripB || A;
      var fx = (A.x + B.x) / 2, fy = (A.y + B.y) / 2;
      R.setCamera({ centerX: fx, centerY: fy });     // a ação no meio da tela
      R.render(0.001);
      var i, f;
      for (i = 0; i < shots; i++) {
        for (f = 0; f < step; f++) { R.render(dts); pump(); }
        box.appendChild(stripTile(cv, R, fx, fy, cw, ch, i, Math.round(i * step * dts * 1000)));
      }
      var stx = document.getElementById('test-status');
      if (stx) stx.textContent += ' | tira ' + qs.strip + ' ' + shots + '×' + step + 'f';
    }
    function stripTile(cv, R, gx, gy, cw, ch, idx, ms) {
      var p = R.project(gx, gy, 40);
      var k = cv.width / cv.clientWidth;            // backing store por px de CSS
      var out = document.createElement('canvas');
      out.width = cw; out.height = ch;
      var c2 = out.getContext('2d');
      c2.fillStyle = '#0b0e12'; c2.fillRect(0, 0, cw, ch);
      c2.drawImage(cv, p.x * k - cw / 2, p.y * k - ch * 0.62, cw, ch, 0, 0, cw, ch);
      c2.fillStyle = 'rgba(8,10,14,.78)'; c2.fillRect(0, 0, 74, 20);
      c2.fillStyle = '#ffd98a';
      c2.font = 'bold 13px Verdana, sans-serif';
      c2.fillText('#' + (idx + 1) + '  ' + ms + 'ms', 5, 14);
      out.style.cssText = 'width:100%;display:block;image-rendering:auto';
      return out;
    }

    // diagnóstico de geometria (usado para caçar overlay fora do tabuleiro)
    if (qs.diag) {
      setTimeout(function () {
        var st2 = Game.state, g = st2.grid, out = [];
        var a2 = Engine.activeUnit(st2);
        var re = Engine.reachable(st2, a2.uid) || [];
        var bad = re.filter(function (t) { return t.x < 0 || t.y < 0 || t.x >= g.w || t.y >= g.h; });
        (st2.tileEventsActive || []).forEach(function (e2) {
          var p2 = JOGO.Renderer.project(e2.x, e2.y, 0);
          out.push(e2.eventId + '@' + e2.x + ',' + e2.y + '→' + Math.round(p2.x) + ':' + Math.round(p2.y));
        });
        var pets = st2.units.filter(function (u) { return u.kind === 'pet'; });
        var el2 = document.getElementById('test-status');
        el2.textContent += ' || rot=' + JOGO.Renderer.rotation() +
          ' reach=' + re.length + ' fora=' + bad.length +
          ' ativo=' + a2.uid + '@' + a2.x + ',' + a2.y +
          ' pet=' + pets.map(function (p3) { return p3.x + ',' + p3.y; }).join('/') +
          ' evs=' + out.join(' ') +
          ' | FORA: ' + (JOGO.Renderer.strayNodes ? JOGO.Renderer.strayNodes().join(' ') : '?');
      }, 300);
    }

    // PERF: medido em linha (sem timer) para funcionar mesmo com relógio
    // virtualizado do headless. Mede CPU (cena+animação) e total (com GPU).
    if (qs.perf) {
      var pn2 = parseInt(qs.perf, 10) || 120;
      JOGO.Renderer.perfProbe(10, { cpuOnly: true });                 // aquece
      var rc = JOGO.Renderer.perfProbe(pn2, { cpuOnly: true });
      var rg = JOGO.Renderer.perfProbe(Math.min(pn2, 40));
      window.__PERF = { cpu: rc, full: rg, units: Game.state.units.length };
      var st4 = document.getElementById('test-status');
      if (st4) {
        st4.textContent += ' | perf ' + Game.state.units.length + ' unid: CPU ' +
          rc.msPerFrame.toFixed(2) + 'ms/f (' + rc.fps.toFixed(0) + ' fps) · total ' +
          rg.msPerFrame.toFixed(2) + 'ms/f';
      }
    }
  }

  if (document.readyState === 'loading') window.addEventListener('DOMContentLoaded', run);
  else run();
})();
</script>
</body>
</html>
