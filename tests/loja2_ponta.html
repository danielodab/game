<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>SOTERRA — a Loja 2 de ponta a ponta</title>
<style>body{margin:0;background:#0f1216;color:#e8eef6;font:12px monospace;padding:10px}
#summary{padding:6px 10px;border-radius:6px;margin-bottom:8px}
.allpass{background:#16241b;color:#7fe08a} .fail{background:#3d1414;color:#f77}
.linha{color:#8fc79b} .linha.ruim{color:#f88} h3{margin:10px 0 4px;color:#9cc3ff;font-size:12px}</style>
</head>
<body>
<!-- A PROVA DE PONTA A PONTA DA LOJA 2 (10/09). Quem sobe tudo é
     tests/loja2_ponta.py: a API de verdade (banco descartável, com o token e a
     assinatura do Mercado Pago INVENTADOS para a corrida), o Mercado Pago de
     mentira (tests/mp_falso.py) e o MAESTRO (a conta do Mestre e o controle do
     falso). Esta página recebe `?api=http://127.0.0.1:P&maestro=http://127.0.0.1:Q`,
     cria a própria conta descartável e usa os módulos de verdade do jogo:
     nuvem.js + loja.js + progress.js + db.js, e o hud.js por ÚLTIMO, sem
     UI.init, só pelo texto do aviso (UI.avisoLojaTexto).
     As cenas: 1 pacote pago (um crédito; aviso forjado, repetido, em paralelo,
     de valor trocado e de modo trocado não creditam) · 2 comprar personagem no
     site com vintém pago que o jogo ainda não recebeu · 3 o jogo recebendo o
     pacote, o Xamã, o bônus de XP de 1, 3 e 7 dias (somando), as insígnias e as
     pedras · 4 os presentes do Mestre (classe e vinténs) · 5 o avatar no
     ranking · 6 estorno e contestação. A cena 7 ("em breve") é do .py. -->
<div id="summary">rodando…</div>
<div id="log"></div>
<pre id="ids" hidden></pre>
<script src="save_sandbox.js"></script>
<script>
  window.__V = '?v=' + Date.now();
  var arqs = ['js/core/data/elements.js','js/core/data/classes.js','js/core/data/spells.js',
    'js/core/data/progression.js','js/core/data/monsters.js','js/core/data/dungeons.js',
    'js/core/data/fusions.js','js/core/data/pets.js','js/core/data/items.js',
    'js/core/data/items_extra.js','js/core/data/items_selos.js',
    'js/core/contas.js','js/core/sessao.js','js/core/db.js','js/core/mercado.js',
    'js/core/engine.js','js/core/fusion.js','js/core/progress.js','js/core/nuvem.js','js/core/loja.js',
    'js/ui/icones_ui.js', 'js/ui/hud.js'];
  for (var i=0;i<arqs.length;i++) document.write('<scr'+'ipt src="../'+arqs[i]+window.__V+'"></scr'+'ipt>');
</script>
<script>
(function () {
  'use strict';
  var log = document.getElementById('log');
  var falhas = 0, total = 0;
  function cena(t) { var h = document.createElement('h3'); h.textContent = t; log.appendChild(h); }
  function check(nome, ok, extra) {
    total++;
    if (!ok) falhas++;
    var d = document.createElement('div');
    d.className = ok ? 'linha' : 'linha ruim';
    d.textContent = (ok ? 'PASSOU · ' : 'FALHOU · ') + nome + (extra && !ok ? ' — ' + String(extra).slice(0, 900) : '');
    log.appendChild(d);
    return !!ok;
  }
  function js(o) { try { return JSON.stringify(o); } catch (e) { return String(o); } }
  function ate(cond, ms) {
    ms = ms || 6000;
    return new Promise(function (r) {
      var t0 = 0;
      (function volta() {
        var ok = false;
        try { ok = cond(); } catch (e) { ok = false; }
        if (ok) return r(true);
        if ((t0 += 20) > ms) return r(false);
        setTimeout(volta, 20);
      })();
    });
  }
  var Q = {};
  String(location.search || '').replace(/[?&]([^=&]+)=([^&]*)/g, function (_, k, v) { Q[k] = decodeURIComponent(v); });
  var MAESTRO = String(Q.maestro || '').replace(/\/+$/, '');
  var P = JOGO.Progress, DB = JOGO.DB, S = JOGO.Sessao, N = JOGO.Nuvem, L = JOGO.Loja, UI = JOGO.UI || {};
  var DIA = 86400;
  var nuvemEv = [], avisos = [], retiradas = [];
  window.addEventListener('soterra:nuvem', function (ev) { nuvemEv.push(ev.detail.tipo + (ev.detail.erro ? ':' + ev.detail.erro : '')); });
  window.addEventListener('soterra:loja', function (ev) { avisos.push(JSON.parse(JSON.stringify(ev.detail))); });
  N.semRecarga = true;
  N.ESPERA_MS = 30;
  L.INTERVALO_MS = 1e9;
  L._semTrava = true;            // a trava entre abas não sai a tempo no Chrome sem cabeça (ver loja.js)
  L._reinicia();
  // o que o jogo recebeu de /api/loja/retirar, cópia fiel (o `agora` do bônus mora lá)
  var apiDeVerdade = S.api;
  S.api = function (rota, op) {
    return apiDeVerdade.call(S, rota, op).then(function (r) {
      if (rota === '/api/loja/retirar') retiradas.push(JSON.parse(JSON.stringify(r)));
      return r;
    });
  };

  function idem() {
    var b = new Uint8Array(8);
    crypto.getRandomValues(b);
    return Array.prototype.map.call(b, function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
  }
  function maestro(rota, corpo) {
    var op = corpo === undefined ? { method: 'GET' }
      : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo) };
    return fetch(MAESTRO + rota, op).then(function (r) {
      return r.json().then(function (j) { j = j || {}; j._http = r.status; return j; });
    }).catch(function (e) { return { ok: false, _http: 0, erro: String(e) }; });
  }
  function api(rota, corpo, metodo) {
    return S.api(rota, corpo === undefined ? { method: metodo || 'GET' } : { method: metodo || 'POST', body: corpo });
  }
  function compra(sku) { return api('/api/loja/comprar', { sku: sku, idem: idem() }); }
  function minha() { return api('/api/loja/minha'); }
  function pacote(id, chave) { return api('/api/pagamento/pacote', { pacote: id, idem: chave || idem() }); }
  function pagaEAvisa(pagId, extra) {
    var corpo = { pagamento: pagId, status: 'approved' };
    for (var k in (extra || {})) corpo[k] = extra[k];
    return maestro('/pagar', corpo).then(function (p) {
      return maestro('/avisar', { mp_id: p.mp_id, assinatura: 'boa' }).then(function (a) { return { pago: p, aviso: a }; });
    });
  }
  function estorna(mp, status) {
    return maestro('/status', { mp_id: mp, status: status }).then(function () {
      return maestro('/avisar', { mp_id: mp, assinatura: 'boa' });
    });
  }
  function moedas() { return DB.exportar().carteira.moedas; }
  function pedidoEm(m, id) { return ((m && m.pedidos) || []).filter(function (p) { return p.id === id; })[0] || {}; }
  function creditos(m, origem) { return ((m && m.pedidos) || []).filter(function (p) { return p.origem === origem; }); }
  function estavel(v0) { return function () { var e = N.estado(); return e.versao > v0 && !e.pendente && !e.subindo; }; }
  function busca() {          // o jogo busca, aplica e sobe; devolve {r, subiu, ret (o que o retirar trouxe)}
    var v0 = N.estado().versao, n0 = retiradas.length;
    return L.buscar().then(function (r) {
      return ate(estavel(v0)).then(function (ok) { return { r: r, subiu: ok, ret: retiradas[n0] || {} }; });
    });
  }
  function aviso(pid) { return avisos.filter(function (a) { return a.pedido && a.pedido.id === pid; })[0] || null; }
  function texto(d) {
    try { var t = UI.avisoLojaTexto(d); return t || {}; } catch (e) { return { erro: String(e) }; }
  }
  function mil(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }

  var nome = 'lp' + (function (n) { var a = 'hjkqxz', s = ''; for (var i = 0; i < 9; i++) { s = a.charAt(n % 6) + s; n = Math.floor(n / 6); } return s; })(Date.now());
  var senha = 'p-' + Math.random().toString(36).slice(2, 14);
  var X = { conta: null, nome: nome, mp: {}, pag: {}, ped: {} };   // os ids da corrida (o .py confere no banco)
  var CAT = {}, agoraB = 0, ateB = 0, i0 = 0, b0 = 0, m0 = 0;

  S.esquece();
  cena('0 · a montagem');
  check('a API está apontada (' + S.base() + ') e o maestro também (' + MAESTRO + ')',
        /^https?:\/\//.test(S.base()) && /^https?:\/\//.test(MAESTRO));
  maestro('/saude').then(function (m) {
    check('o maestro responde (a conta do Mestre existe)', m.ok && m.mestre > 0, js(m));
    X.mestre = m.mestre;
    return S.api('/api/loja/catalogo', { semToken: true });
  }).then(function (c) {
    (c.itens || []).forEach(function (i) { CAT[i.sku] = i; });
    var pac = {};
    (c.pacotes || []).forEach(function (p) { pac[p.id] = [p.vintens, p.centavos, p.preco]; });
    check('catálogo v2 com o pagamento ligado', c.ok && c.versao === 2 && c.pagamento && c.pagamento.ligado === true, js(c.pagamento));
    check('os 4 pacotes com a tabela do plano (vinténs, centavos e o preço formatado pelo servidor)',
          js(pac) === js({ 'pacote-1000': [1000, 490, 'R$ 4,90'], 'pacote-5500': [5500, 1990, 'R$ 19,90'],
                           'pacote-12000': [12000, 3990, 'R$ 39,90'], 'pacote-25000': [25000, 7990, 'R$ 79,90'] }), js(pac));
    var precos = {}, quer = { 'classe-invocador': 10000, 'classe-bruxo': 10000, 'bonus-xp-1': 1500, 'bonus-xp-3': 3900,
                              'bonus-xp-7': 7900, 'insignias-10': 4500, 'pedras-fogo-50': 3600 };
    for (var k in quer) precos[k] = CAT[k] ? CAT[k].preco : null;
    check('os preços do que esta prova compra', js(precos) === js(quer), js(precos));
    check('bônus de 1/3/7 dias sem limite de janela, entrega bonus-xp com os dias; o Sabedoria fora da venda',
          [1, 3, 7].every(function (d) { var i = CAT['bonus-xp-' + d] || {}; return i.tipo === 'bonus-xp' && i.qtd === d && i.limite === null; }) &&
          !CAT['pergaminho-xp'], js([CAT['bonus-xp-1'], CAT['pergaminho-xp']]));
    check('o jogo espelha o fator do bônus (DATA.bonusXp.fator = 1,5)', JOGO.DATA.bonusXp && JOGO.DATA.bonusXp.fator === 1.5);
    return S.api('/api/termos', { semToken: true }).then(function (t) {
      // 02/10: o cadastro exige o aceite dos Termos — a versão de agora vem do próprio servidor
      return S.cadastrar(nome, nome + '@prova.local', senha, t.versaoTermos);
    });
  }).then(function (r) {
    X.conta = S.contaId();
    check('cadastro de conta descartável (' + nome + ', #' + X.conta + ')', r.ok && r.token && S.ativa() && X.conta > 0, r.erro);

    // ------------------------------------------------------------------------------ cena 1
    cena('1 · o pacote pago no Mercado Pago de mentira');
    X.chaveArca = idem();
    return pacote('pacote-12000', X.chaveArca);
  }).then(function (r) {
    var pg = r.pagamento || {};
    X.pag.arca = pg.id;
    X.endArca = r.endereco;
    check('POST /api/pagamento/pacote (Arca): 201, 12.000 vinténs por R$ 39,90, estado aberto, com endereço',
          r.status === 201 && pg.vintens === 12000 && pg.centavos === 3990 && pg.preco === 'R$ 39,90' &&
          pg.estado === 'aberto' && pg.creditado === false && typeof r.endereco === 'string' && r.endereco.length > 8, js(r));
    return pacote('pacote-12000', X.chaveArca);
  }).then(function (r) {
    check('o mesmo idem devolve o MESMO pagamento (200, repetido)', r.status === 200 && r.repetido === true &&
          r.pagamento && r.pagamento.id === X.pag.arca && r.endereco === X.endArca, js(r));
    return maestro('/falso');
  }).then(function (f) {
    var prefs = (f.estado && f.estado.preferencias) || [], p = prefs[prefs.length - 1] || {};
    var it = (p.items || [])[0] || {}, volta = (p.back_urls || {}).success || '';
    var excl = ((p.payment_methods || {}).excluded_payment_types || []).map(function (x) { return x.id; }).sort();
    check('o Mercado Pago recebeu UMA preferência (o idem repetido não criou outra)', prefs.length === 1, prefs.length);
    check('a preferência: R$ 39,90 em reais, BRL, referência sot-…, volta no SOTERRA_ENDERECO, sem payer, sem notification_url, sem boleto nem lotérica',
          it.unit_price === 39.9 && it.currency_id === 'BRL' && it.quantity === 1 &&
          /^sot-\d+-[0-9a-f]{16}$/.test(p.external_reference || '') &&
          volta.indexOf(S.base() + '/site/loja.html?pagamento=' + X.pag.arca) === 0 &&
          !('payer' in p) && !('notification_url' in p) && js(excl) === js(['atm', 'ticket']), js(p));
    return minha();
  }).then(function (m) {
    check('antes de pagar: nada a caminho (a caminho 0, disponível 0)', m.saldo && m.saldo.aCaminho === 0 && m.saldo.disponivel === 0, js(m.saldo));
    return maestro('/pagar', { pagamento: X.pag.arca, status: 'approved' });
  }).then(function (p) {
    X.mp.arca = p.mp_id;
    check('o comprador pagou a Arca no Mercado Pago (aprovado)', p.ok && !!p.mp_id, js(p));
    return maestro('/falso');
  }).then(function (f) {
    X.consultas0 = (f.estado || {}).consultas;
    return maestro('/avisar', { mp_id: X.mp.arca, assinatura: 'ruim' });
  }).then(function (a) {
    check('aviso FORJADO (assinatura ruim) → 401', a.http === 401, js(a));
    return maestro('/avisar', { mp_id: X.mp.arca, assinatura: 'sem' });
  }).then(function (a) {
    check('aviso sem assinatura → 401', a.http === 401, js(a));
    return maestro('/falso');
  }).then(function (f) {
    check('... e o servidor NÃO consultou o Mercado Pago por causa deles', (f.estado || {}).consultas === X.consultas0,
          X.consultas0 + ' → ' + (f.estado || {}).consultas);
    return minha();
  }).then(function (m) {
    check('... e nenhum vintém a caminho', m.saldo.aCaminho === 0 && creditos(m, 'pagamento').length === 0, js(m.saldo));
    return maestro('/avisar', { mp_id: X.mp.arca, assinatura: 'boa' });
  }).then(function (a) {
    check('aviso assinado → 200', a.http === 200 && a.corpo && a.corpo.ok, js(a));
    return minha();
  }).then(function (m) {
    var cr = creditos(m, 'pagamento');
    X.ped.arca = cr[0] && cr[0].id;
    check('UM crédito: a caminho 12.000, disponível 12.000 (a carteira do save ainda é 0)',
          m.saldo.aCaminho === 12000 && m.saldo.disponivel === 12000 && m.saldo.carteira === 0 && cr.length === 1, js(m.saldo));
    check('o crédito na lista: origem pagamento, 12.000 vinténs, pendente, sem cancelar', cr.length === 1 &&
          cr[0].vintens === 12000 && cr[0].estado === 'pendente' && cr[0].cancelavel === false && cr[0].preco === 0, js(cr));
    return maestro('/avisar', { mp_id: X.mp.arca, assinatura: 'boa' });
  }).then(function (a) {
    check('o MESMO aviso de novo → 200', a.http === 200, js(a));
    return maestro('/avisar', { mp_id: X.mp.arca, assinatura: 'boa', vezes: 10 });
  }).then(function (a) {
    check('dez avisos iguais em paralelo → todos 200', (a.https || []).length === 10 &&
          a.https.every(function (s) { return s === 200; }), js(a.https));
    return maestro('/falso');
  }).then(function (f) {
    X.buscas0 = (f.estado || {}).buscas;
    // a volta do navegador: a página do site chama a conferência (nunca credita pela URL de volta)
    return api('/api/pagamento/conferir', { id: X.pag.arca });
  }).then(function (r) {
    var pg = r.pagamento || {};
    check('a volta do navegador (POST /api/pagamento/conferir) → 200, a Arca aprovada com 12.000',
          r.status === 200 && pg.id === X.pag.arca && pg.estado === 'aprovado' && pg.vintens === 12000, js(r));
    return maestro('/falso');
  }).then(function (f) {
    check('... a conferência BUSCOU o pagamento no Mercado Pago (não confiou na volta)', (f.estado || {}).buscas === X.buscas0 + 1,
          X.buscas0 + ' → ' + (f.estado || {}).buscas);
    return minha();
  }).then(function (m) {
    check('... e continua UM crédito (a conferência e o aviso não somam)', m.saldo.aCaminho === 12000 &&
          creditos(m, 'pagamento').length === 1, js(m.saldo));
    return maestro('/pagar', { pagamento: X.pag.arca, status: 'approved', centavos: 390 });
  }).then(function (p) {
    X.mp.errado = p.mp_id;
    return maestro('/avisar', { mp_id: X.mp.errado, assinatura: 'boa' });
  }).then(function (a) {
    check('um 2º pagamento na mesma referência com o VALOR TROCADO (R$ 3,90): aviso assinado → 200', a.http === 200, js(a));
    return maestro('/pagar', { pagamento: X.pag.arca, status: 'approved', live: false });
  }).then(function (p) {
    X.mp.teste = p.mp_id;
    return maestro('/avisar', { mp_id: X.mp.teste, assinatura: 'boa' });
  }).then(function (a) {
    check('um 3º pagamento com o MODO trocado (live_mode false em produção): aviso assinado → 503 (o Mercado Pago reenvia)',
          a.http === 503, js(a));
    return minha();
  }).then(function (m) {
    check('... e continua UM crédito só: a caminho 12.000', m.saldo.aCaminho === 12000 && creditos(m, 'pagamento').length === 1,
          js(m.saldo) + ' ' + js(creditos(m, 'pagamento')));
    return api('/api/loja/cancelar', { id: X.ped.arca });
  }).then(function (r) {
    check('o jogador não cancela vintém de pacote (409)', r.status === 409 && /pacote não se cancelam/.test(r.erro || ''), js(r));
    return api('/api/pagamento/meus');
  }).then(function (r) {
    var p = ((r.pagamentos || []).filter(function (x) { return x.id === X.pag.arca; })[0]) || {};
    check('/api/pagamento/meus: a Arca aprovada, creditada, 12.000, pedido pendente', r.status === 200 && r.ligado === true &&
          p.estado === 'aprovado' && p.creditado === true && p.vintens === 12000 && p.pedido && p.pedido.estado === 'pendente', js(p));

    // ------------------------------------------------------------------------------ cena 2
    cena('2 · comprar personagem no site com vintém pago que o jogo ainda não recebeu');
    return compra('classe-invocador');
  }).then(function (r) {
    X.ped.xama = r.pedido && r.pedido.id;
    check('sem save no servidor, com 12.000 a caminho: o Xamã (10.000) → 201, disponível 2.000',
          r.status === 201 && r.saldo && r.saldo.carteira === 0 && r.saldo.aCaminho === 12000 && r.saldo.reservado === 10000 &&
          r.saldo.disponivel === 2000 && X.ped.xama > X.ped.arca, js(r));
    return compra('classe-bruxo');
  }).then(function (r) {
    check('o Bruxo (10.000) com 2.000 disponíveis → 409 vinténs insuficientes', r.status === 409 && /insuficientes/.test(r.erro || ''), js(r));
    return compra('pergaminho-elemento');
  }).then(function (r) {
    check('a Reescrita sem save → 409 (nenhum herói escolheu caminho)', r.status === 409 && /nenhum herói/.test(r.erro || ''), js(r));

    // ------------------------------------------------------------------------------ cena 3
    cena('3 · o jogo recebe: o pacote e o Xamã');
    P.reset();
    DB._zerar();
    return N.iniciar();
  }).then(function () {
    return ate(function () {
      var e = N.estado(), l = L.estado();
      return e.versao >= 2 && !e.pendente && !e.subindo && l.liberada && !l.buscando && l.ultimaBusca > 0 && avisos.length >= 2;
    }, 15000);
  }).then(function (ok) {
    check('o jogo abre, sobe o 1º save, retira, aplica e sobe de novo', ok && N.estado().erro === null, js(N.estado()) + ' ' + js(L.estado().historico));
    var ret = retiradas[0] || {}, ps = ret.pedidos || [];
    var cr = ps[0] || {}, xa = ps[1] || {};
    check('a retirada vem em ordem de id: o crédito ANTES da compra feita com ele', ps.length === 2 && cr.id === X.ped.arca && xa.id === X.ped.xama, js(ret));
    check('o crédito: entrega {vintens, carteira, 12.000}, origem pagamento, sem agora', js(cr.entrega) === js({ tipo: 'vintens', alvo: 'carteira', qtd: 12000 }) &&
          cr.origem === 'pagamento' && cr.preco === 0, js(cr));
    check('o Xamã: entrega {classe, invocador, 1}, preço 10.000, sem origem e sem agora', js(xa.entrega) === js({ tipo: 'classe', alvo: 'invocador', qtd: 1 }) &&
          xa.preco === 10000 && !('origem' in xa), js(xa));
    var info = P.cardInfo('invocador') || {};
    check('no jogo: carteira 0 → 12.000 → 2.000; o Xamã liberado com as cartas no custo',
          moedas() === 2000 && P.isClassUnlocked('invocador') && info.cards === info.unlockCost && info.unlockCost === 10,
          moedas() + ' / ' + js(info));
    var a0 = aviso(X.ped.arca) || {}, a1 = aviso(X.ped.xama) || {};
    check('os avisos: o crédito com origem pagamento, o Xamã com origem loja', a0.tipo === 'entregue' && a0.origem === 'pagamento' &&
          a1.tipo === 'entregue' && a1.origem === 'loja', js([a0, a1]));
    var t0 = texto(a0), t1 = texto(a1);
    check('o texto: "Chegaram 12.000 vinténs do seu pacote" (good) e "Chegou da loja: Xamã"',
          t0.texto === 'Chegaram 12.000 vinténs do seu pacote' && t0.tipo === 'good' && t1.texto === 'Chegou da loja: Xamã', js([t0, t1]));
    return DB.lojaVer();
  }).then(function (anot) {
    check('os dois ids anotados em db.loja.aplicadas', anot.aplicadas.indexOf(X.ped.arca) >= 0 && anot.aplicadas.indexOf(X.ped.xama) >= 0, js(anot));
