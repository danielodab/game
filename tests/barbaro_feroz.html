<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Bárbaro feroz — três caminhos</title>
<style>
  body{margin:0;background:#0f1216;color:#e8eef6;font:13px/1.5 system-ui,Segoe UI,sans-serif}
  h1{font-size:16px;margin:10px 16px 2px}
  .sub{color:#8895a6;font-size:12px;margin:0 16px 8px}
  #cv{display:block;width:100vw;height:78vh}
  table{border-collapse:collapse;font-size:12px;margin:8px 16px}
  th,td{border:1px solid #2b3542;padding:3px 10px;text-align:left}
  th{background:#1b222c;color:#8895a6}
  #st{font:12px monospace;color:#7fe08a;margin:0 16px 6px}
</style>
</head>
<body>
<h1>Bárbaro brutamontes — como deixar a cara feroz</h1>
<div class="sub">A expressão do rosto está pintada na paleta e não dá para editar. Estes são os caminhos que
mudam a LEITURA sem tocar em textura. Nada aplicado no jogo.</div>
<div id="st">carregando…</div>
<canvas id="cv"></canvas>
<table id="tab"></table>

<script src="save_sandbox.js"></script>
<script>
  window.__V = '?v=' + Date.now();
  var arqs = ['vendor/three.min.js','vendor/GLTFLoader.js',
    'js/core/data/elements.js','js/core/data/classes.js','js/core/data/spells.js',
    'js/core/data/progression.js','js/core/data/monsters.js','js/core/data/dungeons.js',
    'js/core/data/fusions.js','js/core/data/pets.js','js/core/data/items.js','js/core/data/items_extra.js',
    'js/core/engine.js','js/core/progress.js',
    'assets/embedded/models-anims.js','assets/embedded/models-heroes.js',
    'assets/embedded/models-monsters.js','js/render3d/models3d_v2.js'];
  for (var i=0;i<arqs.length;i++) document.write('<scr'+'ipt src="../'+arqs[i]+window.__V+'"></scr'+'ipt>');
</script>

<script>
(function () {
  'use strict';
  var BRUTA = { chest: 1.42, ombro: 1.34, braco: 1.38, perna: 0.88, cabeca: 0.92 };

  function musculo(node, n) {
    node.traverse(function (b) {
      if (!b.isBone) return;
      var nm = (b.name || '').toLowerCase();
      if (nm === 'chest' || nm === 'spine') b.scale.set(n.chest, 1, n.chest * 0.9);
      else if (/^upperarm/.test(nm)) b.scale.set(n.ombro, 1, n.ombro);
      else if (/^lowerarm/.test(nm)) b.scale.set(n.braco, 1, n.braco);
      else if (/^upperleg/.test(nm)) b.scale.set(n.perna * 1.1, n.perna, n.perna * 1.1);
      else if (nm === 'head') {
        var kh = n.cabeca / Math.max(0.001, n.chest);
        b.scale.set(kh, n.cabeca, kh / 0.9);
      } else if (/^handslot/.test(nm)) {
        var k = 1 / Math.max(0.001, n.ombro * n.braco);
        b.scale.set(k, 1, k);
      }
    });
    node.traverse(function (o) {
      if (!o.isMesh || o.isSkinnedMesh) return;
      var p = o.parent;
      if (!p || !p.isBone) return;
      o.scale.set(1 / Math.max(0.001, p.scale.x), 1 / Math.max(0.001, p.scale.y),
                  1 / Math.max(0.001, p.scale.z));
    });
    node.updateMatrixWorld(true);
  }

  function acha(node, nome) {
    var r = null;
    node.traverse(function (o) { if (!r && o.name === nome) r = o; });
    return r;
  }
  function osso(node, nome) {
    var r = null;
    node.traverse(function (o) { if (!r && o.isBone && (o.name || '').toLowerCase() === nome) r = o; });
    return r;
  }
  // enxerta uma peça de OUTRO modelo no osso da cabeça
  function poeNaCabeca(node, modelo, malha) {
    var M = JOGO.Models3D2;
    var fonte = M.unit(modelo, {});
    var m = acha(fonte, malha);
    var b = osso(node, 'head');
    if (!m || !b) return false;
    var c = m.clone();
    c.visible = true;
    c.position.copy(m.position); c.quaternion.copy(m.quaternion); c.scale.copy(m.scale);
    var k = 1 / Math.max(0.001, b.scale.x);
    c.scale.multiplyScalar(k);
    b.add(c);
    return true;
  }

  var VARIANTES = [
    { nome: 'brutamontes (aprovado)', hat: null, inclina: 0,
      nota: 'como você aprovou' },
    { nome: 'cabeça baixa', hat: null, inclina: 0.30,
      nota: 'testa à frente, olhar de touro pronto para investir' },
    { nome: 'chapéu do bárbaro', hat: ['sumo', 'Barbarian_Hat'], inclina: 0.18,
      nota: 'peça que já existe no modelo e está escondida' },
    { nome: 'elmo de guerra', hat: ['curandeira', 'Knight_Helmet'], inclina: 0.18,
      nota: 'elmo do cavaleiro, que tapa o rosto de bonzinho' }
  ];

  window.addEventListener('DOMContentLoaded', function () {
    var t0 = Date.now();
    (function espera() {
      var M = JOGO.Models3D2;
      if (!(M && M.isReady && M.isReady())) {
        if (M && M.load) M.load(function () {});
        if (Date.now() - t0 < 25000) return setTimeout(espera, 150);
        document.getElementById('st').textContent = 'ERRO: modelos não carregaram';
        return;
      }
      var cv = document.getElementById('cv');
      var W = cv.clientWidth || 1400, H = cv.clientHeight || 740;
      var ren = new THREE.WebGLRenderer({ canvas: cv, antialias: true, preserveDrawingBuffer: true });
      ren.setSize(W, H, false); ren.setClearColor(0x0f1216, 1);
      var sc = new THREE.Scene();
      sc.add(new THREE.HemisphereLight(0xbfd4ea, 0x2b2f36, 1.0));
      var key = new THREE.DirectionalLight(0xffffff, 1.8); key.position.set(4, 8, 9); sc.add(key);
      var rim = new THREE.DirectionalLight(0xffb070, 1.1); rim.position.set(-7, 4, -6); sc.add(rim);

      var passo = 2.4, linhas = [], maxH = 0;
      VARIANTES.forEach(function (v, i) {
        var node = M.unit('sumo', {});
        musculo(node, BRUTA);
        if (v.hat) poeNaCabeca(node, v.hat[0], v.hat[1]);
        if (v.inclina) {
          var h = osso(node, 'head');
          if (h) h.rotation.x += v.inclina;
        }
        node.updateMatrixWorld(true);
        var b = new THREE.Box3().setFromObject(node);
        var s = b.getSize(new THREE.Vector3());
        node.position.x = -((b.min.x + b.max.x) / 2);
        node.position.y = -b.min.y;
        node.position.z = -((b.min.z + b.max.z) / 2);
        var g = new THREE.Group(); g.add(node); g.position.x = i * passo;
        sc.add(g);
        maxH = Math.max(maxH, s.y);
        linhas.push({ nome: v.nome, nota: v.nota });
      });

      var x = (VARIANTES.length - 1) * passo;
      var chao = new THREE.Mesh(new THREE.PlaneGeometry(x + 10, 12),
        new THREE.MeshStandardMaterial({ color: 0x1a2029, roughness: 1 }));
      chao.rotation.x = -Math.PI / 2; chao.position.set(x / 2, 0, 0); sc.add(chao);

      // câmera baixa: olhar de baixo para cima faz qualquer um parecer maior
      var cam = new THREE.PerspectiveCamera(30, W / H, 0.1, 200);
      cam.position.set(x / 2, maxH * 0.42, Math.max(x + 3, maxH * 2.2) * 1.02 + 2.5);
      cam.lookAt(x / 2, maxH * 0.52, 0);
      ren.render(sc, cam);

      var t = '<tr><th>variante</th><th>o que muda</th></tr>';
      linhas.forEach(function (l) { t += '<tr><td>' + l.nome + '</td><td>' + l.nota + '</td></tr>'; });
      document.getElementById('tab').innerHTML = t;
      document.getElementById('st').textContent = 'PASS · ' + VARIANTES.length + ' variantes · prévia';
      window.__pronto = true;
    })();
  });
})();
</script>
</body>
</html>
