<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>SOTERRA — a sede da guilda por dentro</title>
<style>
  html,body{margin:0;background:#0b0d10;color:#e8eef6;font:12px/1.5 system-ui,Segoe UI,sans-serif;overflow:hidden}
  #tela{position:fixed;left:0;top:0;width:1000px;height:720px;border:0;background:#000}
  #saida{position:fixed;left:1000px;top:0;right:0;bottom:0;overflow:auto;
         border-left:1px solid #2b3542;padding:8px;font:11px/1.5 monospace}
  #summary{padding:5px 8px;border-radius:5px;background:#1b222c;color:#cdd6e2;margin-bottom:6px}
  .allpass{background:#16241b !important;color:#7fe08a !important} .fail{background:#3d1414 !important;color:#f77 !important}
  .p{color:#7fe08a}.f{color:#ff8a7a}
  body.foto #tela{width:100%;height:100%} body.foto #saida{display:none}
</style>
</head>
<body>
<!-- A SEDE DA GUILDA VISITÁVEL (04/10, dono: "os jogadores da mesma guild entrar nesse mapa
     (sem esses pilares estratégicos) e lá dentro ser o banco da guild e o pessoal ter um chat").
     Abre o jogo de verdade, entra no Acampamento e cobra, na ordem:
       · na praça, quem TEM guilda só vê duas ações (entrar no salão e a guerra); quem não tem vê a porta
         de fundar ou entrar numa — e a ficha de gestão não abre fora do salão (nem pelo cais);
       · a guilda da equipe não sai na lista de quem não é o Mestre, e a doação em vinténs não existe mais;
       · entrar troca a cena e a zona ('sede:<id da guilda>'), com a câmera no aspecto da tela;
       · o salão montou com as peças do dono e SEM pilar solto (nenhuma sd_pilar);
       · os seis pontos (trono, banco, cofre, mural, guerra, saída) abrem as fichas certas;
       · o chat sem barra vai para a guilda (e "/p" ainda alcança a praça);
       · só o fantasma da MESMA sede ganha corpo — o de outra guilda, o da praça e o do Campo não;
       · sair devolve a praça, a câmera certa e o chat normal.
     No meio pede UMA foto do salão (window.__foto, que o tests/santuario_navegador.py tira). -->
<iframe id="tela" src="../index.html?sandbox=1"></iframe>
<div id="saida"><div id="summary">abrindo o jogo…</div><div id="linhas"></div></div>
<script>
(function () {
  var f = document.getElementById('tela');
  var linhas = [], falhas = [];
  function check(nome, ok, extra) {
    linhas.push('<div class="' + (ok ? 'p' : 'f') + '">' + (ok ? 'PASSOU' : 'FALHOU') + ' · ' +
                nome + (extra != null && extra !== '' ? ' (' + extra + ')' : '') + '</div>');
    if (!ok) falhas.push(nome + (extra != null && extra !== '' ? ' (' + extra + ')' : ''));
  }
  function fecha() {
    document.getElementById('linhas').innerHTML = linhas.join('');
    var s = document.getElementById('summary');
    s.className = falhas.length ? 'fail' : 'allpass';
    s.textContent = falhas.length ? ('FALHOU: ' + falhas.join(' · ')) : ('tudo passou (' + linhas.length + ')');
    window.__fail = falhas.length;
    window.__pronto = true;
    window.__fim = { ok: !falhas.length, total: linhas.length, falhas: falhas.length, linhas: falhas.slice() };
  }
  // esperas por TENTATIVAS (o relógio do headless é virtual)
  function espera(cond, voltas, passo) {
    return new Promise(function (ok, nao) {
      var n = 0;
      (function tenta() {
        var r = false;
        try { r = cond(); } catch (e) {}
        if (r) return ok(r);
        if (++n > voltas) return nao(new Error('esperou demais'));
        setTimeout(tenta, passo || 400);
      })();
    });
  }
  function respiro(n) { var k = 0; return espera(function () { return ++k >= n; }, n + 1, 100); }
  function quieto(p) { return p.then(function (v) { return v; }, function () { return null; }); }

  f.onload = function () {
    var w = f.contentWindow, d = w.document, H = null, UI = null, R = null, G = null, gid = null;
    var paraGuilda = [], paraPraca = [];
    function botao(re) {
      return [].filter.call(d.querySelectorAll('button'), function (b) { return re.test(b.textContent); })[0] || null;
    }
    function chega(tipo) { H.aoAproximar(null); H.aoAproximar({ id: tipo, tipo: tipo, nome: tipo }); }
    // 06/10: o botão da Guilda no cais, e a ficha aberta (ou não) por ele
    function bGuilda() {
      return [].filter.call(d.querySelectorAll('.screen-hub .hub-dock .hub-dock-b'), function (b) { return /Guilda/.test(b.textContent); })[0] || null;
    }
    function apagado() { var b = bGuilda(); return !!b && b.classList.contains('is-apagada') && b.getAttribute('aria-disabled') === 'true'; }
    function aceso() { var b = bGuilda(); return !!b && !b.classList.contains('is-apagada') && !b.hasAttribute('aria-disabled'); }
    function fichaAberta() { var e = d.querySelector('.ui-sheet'); return !!e && e.classList.contains('is-on'); }
    function aviso() { var e = d.querySelector('.ui-toast'); return e ? e.textContent : ''; }
    function fala(texto) {
      var ci = d.querySelector('.hub-chat-input');
      if (!ci) return false;
      ci.value = texto;
      ci.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
      return true;
    }
    // um ponto da sede: chega, toca o botão do painel e espera a ficha rolar até a parte certa
    function ponto(tipo, foco, rotulo) {
      chega(tipo);
      var b = d.querySelector('.hub-painel .sede-ponto');
      check(rotulo + ': o painel do ponto tem o botão', !!b, b ? b.textContent : 'sem botão');
      if (!b) return Promise.resolve();
      b.click();
      return quieto(espera(function () { return !!d.querySelector('.ms-caixa[data-foco="' + foco + '"] .guilda-' + foco); }, 40, 150))
        .then(function (ok) {
          check(rotulo + ': abre a ficha da guilda na parte "' + foco + '"', !!ok);
          UI.closeSheet();
        });
    }

    espera(function () { return !!d.querySelector('.screen-menu.is-on'); }, 400)
      .then(function () { return w.JOGO.DB.batizar('Prova Sede'); })
      .then(function () {
        botao(/^Descer$/).click();
        return espera(function () { return !!botao(/^Escolher$/); }, 100);
      })
      .then(function () { botao(/^Escolher$/).click(); return respiro(4); })
      .then(function () {
        botao(/Confirmar/).click();
        return espera(function () {
          H = w.JOGO.Hub; UI = w.JOGO.UI; R = w.JOGO.Rede; G = w.JOGO.Guilda;
          return H && H._estado && H._estado().pos && d.querySelector('.hub-canvas') &&
                 H._lugares().some(function (l) { return l.tipo === 'sede'; });
        }, 400);
      })
      .then(function () { return quieto(espera(function () { return !!d.querySelector('.hub-chat-input'); }, 30, 200)); })
      .then(function () {
        try { botao(/^Entendi$/).click(); } catch (eT) {}
        // ---- 1. sem guilda não há botão
        UI._sede(null);
        chega('sede');
        check('sem guilda: o painel da Sede leva a fundar ou entrar numa guilda', !!d.querySelector('.hub-painel .sede-fundar') && !!botao(/Fundar ou entrar numa guilda/));
        check('sem guilda: NÃO há o botão de entrar no salão nem a fila da guerra', !d.querySelector('.sede-entrar') && !d.querySelector('.hub-painel .guerra-bloco'));
        // 06/10 (dono: "se o jogador não tem guilda, o ícone dele no menu não deve ser clicável; ele só pode
        // criar uma guilda na sede da guilda")
        check('sem guilda: o botão da Guilda no cais fica apagado (aria-disabled)', apagado(), bGuilda() ? bGuilda().className : 'sem botão');
        if (bGuilda()) bGuilda().click();
        check('…o toque nele não abre ficha: só avisa que é na Sede', !fichaAberta() && /Sede das Guildas/.test(aviso()), aviso());
        UI.openSheet('guilda');
        check('…e nenhum outro caminho abre a ficha da guilda fora da Sede', !fichaAberta());
        check('a API da cena existe (entraSede, saiSede, naSede)', typeof H.entraSede === 'function' &&
              typeof H.saiSede === 'function' && H.naSede() === null);

        // ---- 2. com guilda (uma de verdade, local — as insígnias da fundação são da prova)
        var P = w.JOGO.Progress;
        P.insigniasVer = function () { return 99; };
        P.gastaInsignias = function () { return true; };
        // ---- 1b. a guilda da EQUIPE (04/10, dono: "guild staff não deve aparecer nem na lista de guild.. só o adm
        // possui"): fundada pela conta do Mestre, não sai na lista do jogador nem na ficha de quem procura guilda
        var M = w.JOGO.GM, eraMestre = M.ativo, staffId = null;
        G.contaAtiva('conta-do-mestre', 'Zelador');
        M.ativo = function () { return true; };
        return G.criar('Staff', 'S').then(function (rs) {
          check('a guilda da equipe foi fundada pelo Mestre', !!(rs && rs.ok), rs && rs.erro);
          return G.lista();
        }).then(function (ls) {
          var st = ls.filter(function (x) { return x.nome === 'Staff'; })[0];
          staffId = st ? st.id : null;
          check('o Mestre vê a guilda dele na lista', !!st);
          M.ativo = eraMestre;
          return w.JOGO.DB.jogador();
        }).then(function (j) {
          G.contaAtiva(j.id, j.nome);
          return G.lista();
        }).then(function (ls) {
          check('a lista do jogador NÃO traz a guilda da equipe', !ls.some(function (x) { return x.nome === 'Staff'; }), ls.map(function (x) { return x.nome; }).join(','));
          return G.entrar(staffId);
        }).then(function (re) {
          check('…e ninguém entra nela por conta própria', re.ok === false, re.erro);
          d.querySelector('.hub-painel .sede-fundar').click();
          return quieto(espera(function () { return !!d.querySelector('.ms-caixa input[placeholder="nome da guilda"]'); }, 40, 150));
        }).then(function (ok) {
          var t = (d.querySelector('.ms-caixa') || {}).textContent || '';
          check('sem guilda: a ficha abre no fundar/entrar', !!ok && !!botao(/^Fundar a guilda/));
          check('na tela de quem procura guilda a da equipe não aparece', !/Staff/.test(t), t.slice(-160));
          UI.closeSheet();
          // 06/10: enquanto NÃO se sabe se a conta tem guilda, o botão fica aceso; o toque abre a ficha, que lê o
          // servidor — e, sem guilda, só diz aonde ir (nada de fundar pelo cais) e apaga o botão
          UI._guildaEsquece();
          check('não se sabe ainda: o botão da Guilda fica ACESO (não se apaga o de quem pode ter guilda)', aceso() && UI._sede().sabe === false);
          bGuilda().click();
          return quieto(espera(function () { return !!d.querySelector('.ms-caixa .guilda-so-na-sede'); }, 40, 150));
        }).then(function (ok) {
          check('…a ficha lê, não oferece fundar pelo cais e manda à Sede', !!ok && !d.querySelector('.brasao-ed') && !botao(/^Fundar a guilda/) &&
                !d.querySelector('.ms-caixa .guilda-rank'), ((d.querySelector('.ms-caixa') || {}).textContent || '').slice(0, 120));
          check('…e o botão se apaga: agora se sabe', apagado() && UI._sede().sabe === true);
          UI.closeSheet();
          var eraM = w.JOGO.GM.ativo;
          w.JOGO.GM.ativo = function () { return true; };
          UI._sede(null);
          var mestreAceso = aceso();
          w.JOGO.GM.ativo = eraM;
          UI._sede(null);
          check('a conta do Mestre nunca apaga; a comum, sim', mestreAceso && apagado());
          return G.criar('Casa da Prova', 'P');
        });
      })
      .then(function (res) {
        check('a guilda da prova foi fundada', !!(res && res.ok), res && res.erro);
        return G.minha();
      })
      .then(function (g) {
        gid = String(g.id);
        UI._sede(g);
        chega('sede');
        var b = d.querySelector('.sede-entrar');
        check('com guilda: o botão "Entrar no salão" aparece', !!b && /Entrar no salão/.test(b.textContent));
        check('com guilda: o botão da Guilda no cais acende sem recarregar', aceso(), bGuilda() ? bGuilda().className : 'sem botão');
        // 04/10 (dono: "quando chegar na sede só deve perguntar de entrar no salão ou se inscrever para batalha")
        var bsP = [].map.call(d.querySelectorAll('.hub-painel button'), function (x) { return x.textContent; });
        check('a praça só tem as duas ações: o salão e a guerra de guilda', !!d.querySelector('.hub-painel .guerra-bloco') &&
              bsP.filter(function (x) { return !/Entrar no salão|Inscrever/.test(x); }).length === 0, bsP.join(' | '));
        // o cais segue a mesma regra: fora do salão a ficha é só a porta
        UI.openSheet('guilda');
        return quieto(espera(function () { return !!d.querySelector('.ms-caixa.guilda-porta'); }, 40, 150));
      })
      .then(function (ok) {
        var cx = d.querySelector('.ms-caixa'), t = cx ? cx.textContent : '';
        check('cais fora do salão: a ficha é só a porta (nome da guilda e "Entrar no salão")', !!ok && /Casa da Prova/.test(t) && !!cx.querySelector('.sede-entrar'));
        check('…sem a gestão: nada de membros, mural, cofre, banco, governo nem ranking',
              !!cx && !cx.querySelector('.guilda-grade, .guilda-mural, .guilda-cofre, .guilda-banco, .guilda-governo, .guilda-rank') && !botao(/Sair da guilda/));
        UI.closeSheet();
        chega('sede');
        var b = d.querySelector('.hub-painel .sede-entrar');

        // os fantasmas: a mesma sede, outra sede, a praça e o Campo
        H.fantasmaEntra('f-mesma', { nome: 'Irmã', classe: 'sumo', zona: 'sede:' + gid, x: 2.2, z: 3.5 });
        H.fantasmaEntra('f-outra', { nome: 'Rival', classe: 'bruxo', zona: 'sede:outra-guilda', x: -2.2, z: 3.5 });
        H.fantasmaEntra('f-praca', { nome: 'Bia', classe: 'sumo', x: 1.5, z: 4.5 });
        H.fantasmaEntra('f-campo', { nome: 'Caio', classe: 'bruxo', zona: 'campo', x: -1.5, z: 4.5 });
        // o chat: a prova só quer saber PARA ONDE a fala vai
        if (R) {
          R.falarGuilda = function (t) { paraGuilda.push(t); return true; };
          R.falar = function (t) { paraPraca.push(t); return true; };
        }
        b.click();
        return quieto(espera(function () { return H.naSede() === gid && H._sedeMontagem(); }, 60, 150));
      })
      .then(function (ok) {
        // ---- 3. a cena e a zona
        var e = H._estado();
        check('entrar troca a cena: Hub.naSede() é o id da guilda', !!ok && e.sede === gid, e.sede);
        check('a zona é a da guilda (sede:<id>)', e.zona === 'sede:' + gid && H.zona() === 'sede:' + gid, e.zona);
        check('a sede não é o Campo de PvP (naCampo falso: ninguém ataca ninguém)', H.naCampo() === false && e.campo === false);
        check('a Rede anuncia a zona da sede', !R || R.zona() === 'sede:' + gid, R && R.zona());
        check('a Rede aceita só zona de sede bem formada', !R || (R._zonaDe('sede:abc-1') === 'sede:abc-1' &&
              R._zonaDe('sede:<x>') === 'praca' && R._zonaDe('campo') === 'campo' && R._zonaDe('lua') === 'praca'));
        check('o herói nasce à frente da porta', e.pos && Math.abs(e.pos.x) < 0.5 && Math.abs(e.pos.z - 6) < 0.5, JSON.stringify(e.pos));
        check('a câmera bate com a tela (aspecto 1)', e.aspecto === 1, e.aspecto);
        check('a HUD sabe que está dentro', UI._sede().dentro === true);
        return quieto(espera(function () { var m = H._sedeMontagem(); return m && m.vestidas === m.pecas; }, 150, 400));
      })
      .then(function () {
        // ---- 4. o salão
        var m = H._sedeMontagem() || { porChave: {}, pontos: [], paredes: {} }, c = m.porChave;
        check('o salão vestiu todas as peças do dono', m.pecas >= 50 && m.vestidas === m.pecas, m.vestidas + '/' + m.pecas + ' · faltam ' + m.pendentes);
        check('SEM pilar solto: nenhuma sd_pilar no salão', m.pilares === 0 && !c.sd_pilar, m.pilares);
        var paredes = (c.sd_parede_lisa || 0) + (c.sd_parede_esteio || 0) + (c.sd_parede_tocha || 0);
        check('quatro paredes fechadas e uma porta', paredes === 35 && c.sd_porta === 1, paredes + ' módulos + ' + c.sd_porta + ' porta');
        check('trono, mesa do conselho e lareira', c.sd_trono === 1 && c.sd_mesa === 1 && c.sd_lareira === 1);
        check('estandartes, armaduras e cavaletes', c.sd_estandarte === 3 && c.sd_armadura === 4 && c.sd_rack_armas === 2,
              [c.sd_estandarte, c.sd_armadura, c.sd_rack_armas].join('/'));
        check('baús (banco e cofre), bancos e estátuas', c.sd_bau >= 2 && c.sd_banco === 4 && c.sd_estatua === 2);
        var tipos = H._lugares().map(function (l) { return l.tipo; }).sort().join(',');
        check('os lugares do salão são os seis pontos (o trono é a gestão)', tipos === 'sede-banco,sede-cofre,sede-guerra,sede-mural,sede-saida,sede-trono', tipos);
        check('a parede do lado da câmera some (não tapa o salão)', m.paredes.s === false && m.paredes.n === true, JSON.stringify(m.paredes));

        // ---- 5. quem se vê
        check('o fantasma da MESMA sede ganha corpo', H._fantasmaVisivel('f-mesma') === true);
        check('o de OUTRA guilda não aparece', H._fantasmaVisivel('f-outra') === false);
        check('o da praça (sem guilda) não aparece', H._fantasmaVisivel('f-praca') === false);
        check('o do Campo não aparece', H._fantasmaVisivel('f-campo') === false);

        // ---- a foto (uma), com o salão limpo
        H.aoAproximar(null);
        window.__foto = 'sede_dentro';
        return quieto(espera(function () { return window.__fotoFeita === 'sede_dentro'; }, 40, 250));
      })
      .then(function () {
        // ---- 6. os seis pontos — o trono abre a ficha de gestão inteira (04/10: a personalização é do salão)
        return ponto('sede-trono', 'cab', 'TRONO');
      })
      .then(function () {
        UI.openSheet('guilda');
        return quieto(espera(function () { return !!d.querySelector('.ms-caixa .guilda-banco .bk2-duplo'); }, 40, 150));
      })
      .then(function (ok) {
        var cx = d.querySelector('.ms-caixa'), t = cx ? cx.textContent : '';
        check('dentro do salão a ficha é a de gestão: membros, mural, governo (porta e dízimo), cofre e banco', !!ok &&
              !!cx.querySelector('.guilda-grade') && !!cx.querySelector('.guilda-mural') && !!cx.querySelector('.guilda-governo') &&
              !!cx.querySelector('.guilda-cofre') && !!botao(/^Porta:/) && !!botao(/Sair da guilda/));
        // 04/10 (dono: "dinheiro não dará mais XP para guild"): a oferenda em vinténs saiu da ficha
        check('a doação em vinténs não existe mais (sem campo nem botão; a ficha diz de onde vem o XP)', !!cx &&
              !cx.querySelector('.guilda-oferenda') && !botao(/Doar à guilda/) && !/2 vinténs = 1 XP/.test(t) &&
              /Vinténs não compram XP/.test(t) && /\+120 XP por vitória/.test(t), (cx.querySelector('.guilda-xp-regra') || {}).textContent);
        check('o ranking da ficha não traz a guilda da equipe', !!cx.querySelector('.guilda-rank') && !/Staff/.test(t));
        UI.closeSheet();
        return ponto('sede-banco', 'banco', 'BANCO');
      })
      .then(function () { return ponto('sede-cofre', 'cofre', 'COFRE'); })
      .then(function () { return ponto('sede-mural', 'mural', 'MURAL'); })
      .then(function () {
        chega('sede-guerra');
        check('GUERRA: a mesa do conselho mostra a fila da guerra de guilda', !!d.querySelector('.hub-painel .guerra-bloco'));
        chega('sede-saida');
        check('SAÍDA: a porta oferece voltar à praça', !!d.querySelector('.hub-painel .sede-sair'));

        // ---- 7. o chat
        var ci = d.querySelector('.hub-chat-input');
        if (!ci) { check('o chat existe para a prova (precisa de http)', location.protocol === 'file:', 'sem caixa de chat'); return; }
        check('a caixa de chat diz que fala com a guilda', ci.parentNode.classList.contains('is-guilda') && /guilda/.test(ci.placeholder), ci.placeholder);
        fala('oi, guilda');
        check('sem barra, a fala vai para a GUILDA', paraGuilda.join('|') === 'oi, guilda' && !paraPraca.length, paraGuilda.join('|') + ' / ' + paraPraca.join('|'));
        fala('/p oi, praça');
        check('"/p" ainda alcança a praça', paraPraca.join('|') === 'oi, praça' && paraGuilda.length === 1, paraPraca.join('|'));
      })
      .then(function () {
        // ---- 8. a saída
        chega('sede-saida');
        d.querySelector('.hub-painel .sede-sair').click();
        return quieto(espera(function () { return H.naSede() === null && H._lugares().some(function (l) { return l.tipo === 'sede'; }); }, 60, 150));
      })
      .then(function () { return respiro(6); })
      .then(function () {
        var e = H._estado(), sd = H._lugares().filter(function (l) { return l.tipo === 'sede'; })[0];
        check('sair volta à praça (zona praca, sem sede)', e.sede === null && e.zona === 'praca' && !UI._sede().dentro, e.zona);
        check('a câmera volta certa (aspecto 1)', e.aspecto === 1, e.aspecto);
        var dist = (sd && e.pos) ? Math.hypot(e.pos.x - sd.x, e.pos.z - sd.z) : -1;
        check('o herói reaparece à frente da Sede, fora do raio de conversa', dist > sd.raio && dist < sd.raio + 4, dist.toFixed(1));
        check('a Rede volta a anunciar a praça', !R || R.zona() === 'praca');
        check('na praça aparece o da praça, e o da sede some', H._fantasmaVisivel('f-praca') === true && H._fantasmaVisivel('f-mesma') === false);
        var ci = d.querySelector('.hub-chat-input');
        if (ci) {
          check('a caixa de chat volta ao normal', !ci.parentNode.classList.contains('is-guilda') && /diga algo/.test(ci.placeholder), ci.placeholder);
          fala('oi, praça de novo');
          check('sem barra, a fala volta a ser da praça', paraPraca[paraPraca.length - 1] === 'oi, praça de novo' && paraGuilda.length === 1);
        }
      })
      // ---- 9. 04/10 (dono: "analise a guilda, está confuso; a da minha conta teste sumiu … exclua a guilda")
      .then(function () {
        // a leitura que FALHA não é "sem guilda": a ficha diz que não leu, e não oferece fundar outra
        var S0 = w.JOGO.Sessao, api0 = S0 && S0.api;
        if (!S0) w.JOGO.Sessao = { api: null };
        w.JOGO.Sessao.api = function () { return Promise.resolve({ ok: false, status: 0 }); };
        G._servidor = true;
        UI.openSheet('guilda');
        return quieto(espera(function () { return !!d.querySelector('.ms-caixa .guilda-falha'); }, 60, 150)).then(function (ok) {
          check('o servidor não respondeu: a ficha avisa que não leu, em vez de mandar fundar uma guilda',
                !!ok && !!botao(/^Tentar de novo$/) && !d.querySelector('.brasao-ed') && UI._sede().temGuilda === true,
                ((d.querySelector('.ms-caixa') || {}).textContent || '').slice(0, 120));
          check('…e a leitura que falhou não apaga o botão da Guilda de quem tem guilda', aceso());
          G._servidor = null;
          if (S0) S0.api = api0; else delete w.JOGO.Sessao;
          UI.closeSheet();
        });
      })
      .then(function () {
        chega('sede');
        d.querySelector('.sede-entrar').click();
        return quieto(espera(function () { return H.naSede() === gid && UI._sede().dentro; }, 80, 200));
      })
      .then(function () { return UI._vigiaSede(); })
      .then(function (saiu) {
        check('a guilda segue viva: a conferência do salão não tira ninguém', saiu === false && H.naSede() === gid && UI._sede().dentro);
        return G.sair();                      // o último membro sai: a guilda da prova deixa de existir, com ele DENTRO do salão
      })
      .then(function (r) {
        check('a guilda da prova foi desfeita', !!(r && r.ok), r && r.erro);
        return UI._vigiaSede();
      })
      .then(function (saiu) { return respiro(6).then(function () { return saiu; }); })
      .then(function (saiu) {
        var e = H._estado();
        check('a guilda acabou com o jogador dentro do salão: ele volta à praça sem travar',
              saiu === true && e.sede === null && e.zona === 'praca' && !UI._sede().dentro, e.zona);
        check('e a praça já sabe que ele não tem guilda', UI._sede().temGuilda === false);
        check('e o botão da Guilda no cais se apaga sem recarregar', apagado(), bGuilda() ? bGuilda().className : 'sem botão');
        chega('sede');
        check('a Sede volta a oferecer fundar ou entrar, sem o botão do salão',
              !!d.querySelector('.hub-painel .sede-fundar') && !d.querySelector('.sede-entrar'));
      })
      .then(fecha, function (err) { check('a prova chegou ao fim', false, String(err && err.stack || err)); fecha(); });
  };
})();
</script>
