<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>SOTERRA — o mundo com a chave do Mestre virada</title>
<style>body{margin:0;background:#0f1216;color:#e8eef6;font:12px monospace;padding:10px}</style>
</head>
<body>
<!-- Aberta pelo tests/gm.html COM ?gm=<chave> na URL: aqui o modo GM está
     LIGADO e os poderes são provados de verdade — batalha inclusa. -->
<div id="log"></div>
<script src="save_sandbox.js"></script>
<script>
  window.__V = '&v=' + Date.now();
  var arqs = ['js/core/data/elements.js','js/core/data/classes.js','js/core/data/spells.js',
    'js/core/data/progression.js','js/core/data/monsters.js','js/core/data/dungeons.js',
    'js/core/data/fusions.js','js/core/data/pets.js','js/core/data/items.js',
    'js/core/data/items_extra.js','js/core/data/items_selos.js',
    'js/core/gm.js','js/core/db.js','js/core/engine.js','js/core/fusion.js','js/core/progress.js'];
  for (var i=0;i<arqs.length;i++) document.write('<scr'+'ipt src="../'+arqs[i]+'?x=1'+window.__V+'"></scr'+'ipt>');
</script>
<script>
(function () {
  'use strict';
  var log = document.getElementById('log');
  window.__fail = 0; window.__total = 0; window.__erros = [];
  function check(nome, ok, extra) {
    window.__total++;
    if (!ok) { window.__fail++; window.__erros.push(nome + (extra ? ' (' + extra + ')' : '')); }
    var d = document.createElement('div');
    d.style.color = ok ? '#8fc79b' : '#f88';
    d.textContent = (ok ? 'ok  ' : 'X   ') + nome + (extra ? ' — ' + extra : '');
    log.appendChild(d);
  }

  var GM = JOGO.GM, P = JOGO.Progress, E = JOGO.Engine;
  check('a chave da URL ligou o modo', GM.ativo() === true);
  check('a classe do Mestre existe e nasce liberada',
        !!JOGO.DATA.classes.gm && JOGO.DATA.classes.gm.startsUnlocked === true);
  check('a classe NÃO declara caminhos (qualquer elemento serve)',
        JOGO.DATA.classes.gm.paths === undefined);
  var jz = JOGO.DATA.spells['gm-julgamento'];
  check('o Julgamento existe: 99999 de dano, círculo 99, alcance 99 sem visão',
        !!jz && jz.effects[0].min === 99999 && jz.aoe.size === 99 &&
        jz.range.max === 99 && jz.range.los === false);
  check('a Panóplia do Mestre existe (4 peças, conjunto próprio)',
        !!JOGO.DATA.items['gm-espadao'] && !!JOGO.DATA.items['gm-elmo'] &&
        !!JOGO.DATA.sets['gm-set-mestre']);

  P.reset();
  check('PA/PP são a palavra do Mestre', GM.definePaPp(15, 9) === true &&
        JOGO.DATA.classes.gm.stats.pa === 15 && JOGO.DATA.classes.gm.stats.pp === 9);
  var h = P.hero('gm');
  check('a ficha do Mestre nasce', !!h && h.classId === 'gm');
  var st1 = P.effectiveStats ? P.effectiveStats('gm') : null;
  check('os stats efetivos obedecem (15 PA / 9 PP)',
        !!st1 && st1.pa === 15 && st1.pp === 9,
        st1 ? st1.pa + '/' + st1.pp : 'sem effectiveStats');

  GM.alternaSpell('sumo-fogo-5');
  GM.alternaSpell('arqueiro-ar-10');
  var gr = P.spellsFor('gm');
  check('o grimório entra na barra com o Julgamento junto',
        gr.indexOf('gm-julgamento') === 0 && gr.indexOf('sumo-fogo-5') > 0 &&
        gr.indexOf('arqueiro-ar-10') > 0, gr.join(','));

  check('aparelhar dá o set e os quatro caminhos', GM.aparelha() === true &&
        P.heroElements('gm').length === 4 &&
        P.state.inventory.filter(function (e) { return e.itemId.indexOf('gm-') === 0; }).length === 4);

  // ---- A CAIXA DO MESTRE (03/09): qualquer item, conjunto ou bicho
  var antesN = P.state.inventory.length;
  check('a Caixa entrega qualquer item do jogo no saco',
        GM.pegaItem('gh-wasp-sting') === true && P.state.inventory.length === antesN + 1 &&
        P.state.inventory[P.state.inventory.length - 1].itemId === 'gh-wasp-sting');
  check('item inexistente é recusado', GM.pegaItem('nada-disso') === false);
  var setId = Object.keys(JOGO.DATA.sets).filter(function (s) { return s !== 'gm-set-mestre'; })[0];
  var pecas = JOGO.DATA.sets[setId].pieces.length;
  check('a Caixa entrega um conjunto inteiro (' + setId + ')', GM.pegaSet(setId) === pecas &&
        P.state.inventory.length === antesN + 1 + pecas);
  check('a Caixa entrega um bicho (as 5 cartas pagas)', GM.pegaPet('pet-galehawk', false) === true &&
        P.petCardInfo('pet-galehawk').unlocked === true && P.petCardInfo('pet-galehawk').stars === 0);
  check('… e no topo: ★3 e nível 10', GM.pegaPet('pet-dewling', true) === true &&
        P.petCardInfo('pet-dewling').stars === 3 && P.petLevel('pet-dewling') === 10);
  check('bicho inexistente é recusado', GM.pegaPet('pet-nada', true) === false);

  // ---- 11/09: as pedras, os selos, as insígnias, as cartas e os pergaminhos
  var pedra = Object.keys(JOGO.DATA.stones)[0], p0 = P.stoneCount(pedra);
  check('a Caixa entrega pedras de forja (' + pedra + ')', GM.pegaPedras(pedra, 100) === true && P.stoneCount(pedra) === p0 + 100,
        p0 + ' → ' + P.stoneCount(pedra));
  check('pedra inexistente e quantidade torta são recusadas', GM.pegaPedras('pedra-nada', 10) === false &&
        GM.pegaPedras(pedra, 0) === false && GM.pegaPedras(pedra, 'dez') === false);
  var s0 = P.selosVer().fogo;
  check('a Caixa entrega selos do Colecionador', GM.pegaSelos('fogo', 10) === true && P.selosVer().fogo === s0 + 10);
  check('selo de elemento que não existe é recusado', GM.pegaSelos('lava', 10) === false);
  var i0 = P.insigniasVer();
  check('a Caixa entrega insígnias de fundação', GM.pegaInsignias(10) === true && P.insigniasVer() === i0 + 10);
  check('cartas no topo: a classe liberada e no ★' + JOGO.DATA.stars.max, GM.pegaCartas('minotauro', 'topo') === true &&
        P.cardInfo('minotauro').unlocked === true && P.cardInfo('minotauro').stars === JOGO.DATA.stars.max,
        JSON.stringify(P.cardInfo('minotauro')));
  var c0 = P.cardInfo('bruxo').cards;
  check('e cartas avulsas somam', GM.pegaCartas('bruxo', 10) === true && P.cardInfo('bruxo').cards === c0 + 10);
  check('a classe do Mestre não tem carta', GM.pegaCartas('gm', 10) === false);
  var pg0 = P.pergaminhos().xp;
  check('a Caixa entrega Pergaminhos da Sabedoria', GM.pegaPergaminho('xp', 10) === 10 && P.pergaminhos().xp === pg0 + 10);
  var tetoP = JOGO.DATA.pergaminhos.tetoInventario, e0 = P.pergaminhos().elemento;
  check('os da Reescrita entram até o teto (' + tetoP + '), e não além', GM.pegaPergaminho('elemento', tetoP + 50) === tetoP - e0 &&
        P.pergaminhos().elemento === tetoP && GM.pegaPergaminho('elemento', 1) === 0);
  check('a Caixa entrega dias de bônus de XP', GM.pegaBonusXp(3) === true && P.bonusXpAte() > Date.now() / 1000 + 2 * 86400);

  JOGO.DB.moedas().then(function (m) {
    check('o cofre não tem fundo', m === 999999, String(m));
    return JOGO.DB.gastarMoedas(888888);
  }).then(function (r) {
    check('gastar nunca falha nem desconta', r.ok === true && r.moedas === 999999);

    // ---- A BATALHA REAL: o Julgamento mata a sala inteira
    var party = P.battleParty(['gm']);
    var st = E.createBattle('greenhouse', 0, party);
    check('a batalha monta com o Mestre', !!st && st.units.some(function (u) {
      return u.side === 'player';
    }));
    var gmU = st.units.filter(function (u) { return u.side === 'player'; })[0];
    // força o turno do Mestre (a iniciativa 99 já deve pôr, mas cravamos)
    var iu = st.order.indexOf(gmU.uid);
    if (iu >= 0) st.turnIndex = iu;
    var vivosAntes = st.units.filter(function (u) { return u.side === 'enemy' && u.alive; }).length;
    check('há monstros de pé antes do golpe', vivosAntes > 0, String(vivosAntes));
    var casted = E.cast(st, gmU.uid, 'gm-julgamento', gmU.x, gmU.y);
    check('o Julgamento conjura', casted === true);
    var vivosDepois = st.units.filter(function (u) { return u.side === 'enemy' && u.alive; }).length;
    check('TODOS os monstros da sala morreram', vivosDepois === 0,
          vivosAntes + ' → ' + vivosDepois);

    /* 04/10, o dono: "o ataque do admin eu só consigo usar uma vez... e o ataque mata o pet — jamais isso deve
     * acontecer". Outra sala, com um ALIADO de pé ao lado do Mestre (o papel do pet, do parceiro e da invocação):
     * o golpe mata a sala, o aliado segue inteiro, e o Mestre conjura DE NOVO no mesmo turno. */
    var st2 = E.createBattle('greenhouse', 0, P.battleParty(['gm', 'sumo']));
    var meus = st2.units.filter(function (u) { return u.side === 'player'; });
    var gm2 = meus.filter(function (u) { return u.classId === 'gm'; })[0] || meus[0];
    var aliado = meus.filter(function (u) { return u !== gm2; })[0];
    var i2 = st2.order.indexOf(gm2.uid); if (i2 >= 0) st2.turnIndex = i2;
    var hpAliado = aliado ? aliado.hp : -1;
    check('o Julgamento conjura com um aliado na sala', E.cast(st2, gm2.uid, 'gm-julgamento', gm2.x, gm2.y) === true);
    check('o aliado do Mestre NÃO é ferido pelo Julgamento', !!aliado && aliado.alive && aliado.hp === hpAliado,
          aliado ? aliado.hp + ' de ' + hpAliado : 'sem aliado');
    check('os monstros da sala morreram', st2.units.filter(function (u) { return u.side === 'enemy' && u.alive; }).length === 0);
    var jz2 = JOGO.DATA.spells['gm-julgamento'];
    check('o Julgamento não tem teto por turno nem custo', jz2.castsPerTurn === 0 && jz2.paCost === 0 && jz2.soInimigos === true);
    check('no MESMO turno o Mestre pode conjurar de novo (a sala reabre quando um monstro invoca ao morrer)',
          st2.phase !== 'playing' ||
          E.cast(st2, gm2.uid, 'gm-julgamento', gm2.x, gm2.y) === true);

    /* 26/10, o dono, na Sala dos Espelhos: "o ataque do adm matou ele mesmo com o ataque que limpa sala". A sala de
     * verdade (O Coração Partido): os Gêmeos-Espelho levantam a Guarda de Espelho (30% do dano recebido volta ao
     * agressor) e o Mestre conjura o Julgamento — a sala morre e ele segue inteiro. */
    var coracao = JOGO.DATA.dungeons.filter(function (d) { return d.id === 'brokenheart'; })[0];
    var iEsp = coracao ? coracao.rooms.map(function (r) { return r.name; }).indexOf('A Sala dos Espelhos') : -1;
    check('a Sala dos Espelhos existe no Coração Partido', iEsp >= 0);
    var st3 = E.createBattle('brokenheart', iEsp, P.battleParty(['gm']));
    var gm3 = st3.units.filter(function (u) { return u.side === 'player'; })[0];
    var gemeos = st3.units.filter(function (u) { return u.side === 'enemy' && u.defId === 'mirror-twin'; });
    gemeos.forEach(function (g) { E.cast(st3, g.uid, 'm-mirror-guard', g.x, g.y); });
    check('os Gêmeos-Espelho estão com o reflexo de pé', gemeos.length > 0 &&
          gemeos.every(function (g) { return E.unitHasEffect(g, 'reflect'); }), gemeos.length + ' gêmeos');
    var i3 = st3.order.indexOf(gm3.uid); if (i3 >= 0) st3.turnIndex = i3;
    var hpGm3 = gm3.hp;
    check('o Julgamento conjura na Sala dos Espelhos', E.cast(st3, gm3.uid, 'gm-julgamento', gm3.x, gm3.y) === true);
    check('o reflexo NÃO volta ao Mestre: ele segue vivo e inteiro', gm3.alive && gm3.hp === hpGm3, gm3.hp + ' de ' + hpGm3);
    check('...e os Gêmeos-Espelho morreram', gemeos.every(function (g) { return !g.alive; }));
    check('o Julgamento declara semReflexo', jz2.semReflexo === true);

    try { localStorage.removeItem('soterra-gm-v1'); } catch (e) {}
    window.__done = true;
  });
})();
</script>
</body>
</html>
