<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>SOTERRA — a guerra de guilda 2×2: o lockstep de QUATRO (motores de mentira na mesma página)</title>
<style>
  body{margin:0;background:#0b0d10;color:#e8eef6;font:12px/1.5 system-ui,Segoe UI,sans-serif;padding:10px}
  #summary{font:12px monospace;padding:5px 9px;border-radius:5px;margin-bottom:8px;background:#1b222c}
  .allpass{background:#16241b !important;color:#7fe08a} .fail{background:#3d1414 !important;color:#f77}
  li{margin:2px 0} .ok{color:#7fe08a} .no{color:#f77} code{color:#9ab}
  h2{font-size:13px;margin:12px 0 4px;color:#e8c25a}
  #palco iframe{width:10px;height:10px;border:0;opacity:0;position:absolute}
</style>
</head>
<body>
<!-- A GUERRA DE GUILDA 2×2 (15/09, o dono: "a guerra de guild que é 2x2 de cada guild é na sede de guild"). Quatro
     clientes de verdade (os iframes-cliente do tests/coop_motor.html: dados, motor, Progress, Game e Coop, com a Rede
     de mentira pelo correio desta página e o relógio daqui), cada um com a DUPLA dele, na mesma ata do servidor:
       G1 os quatro abrem a guerra da ata (8 heróis no Salão da Sede), a vida entra por dono:heroId (dois Espadachins
          do lado A, só o da Ana ferido) e os quatro nascem com o MESMO hash; enquanto alguém não entrou, ninguém joga;
       G2 a guerra inteira pelo piloto: o hash bate nos quatro em todo turno e no fim; cada lance vai aos três; a
          tela de fim é a da guerra, com a vitória de uma GUILDA; os quatro fecham no servidor com o mesmo gid;
       G3 a Bia CAI: quem marca os heróis dela (o turno passa) é a Ana, o parceiro de guilda — nunca o Cris ou a Duda;
          a Bia volta com outra conexão, a Ana a desmarca, a foto de quem manda a recoloca, e o hash volta a bater;
       G4 a marca `ia` forjada por um adversário é ignorada;
       G5 um motor estragado diverge: quem manda (a Ana) manda a foto, e só ela vale;
       G6 a Duda sai da guerra: os heróis dela caem nos três motores, e o lockstep segue;
       G7 os DOIS adversários caem: W.O. para a guilda que ficou, sem o hash do fim no fechamento (não rende XP);
     19/09 (o dono: "dê uma revisada na guerra de guild do meu jogo e ajuste o que for necessário"):
       G8 a Ana (A1, QUEM MANDA) cai e volta por outra conexão: o turno nunca diminui em ninguém, nenhum dos três
          restaura, a foto vem de quem ficou (a Bia) e a Ana não volta a mandar até o fim (antes a foto velha dela
          rebobinava a guerra dos outros três);
       G9 a Ana entra ATRASADA (a ata chegou com ela fora da praça): idem — pega a foto da Bia e não manda;
       G10 a Duda SAI: Vida.fim com os dois heróis dela a 0, a saída declarada ao servidor (POST /api/guerra/sair {gid}
          pela Autoridade), a marca `morte` nos três, e o corpo do fechar guardado na luta aberta antes de sair.
     A rodada de conserto de 19/09 (o correio passou a entregar o `caiu` só a quem está LIGADO, como o relé; a segurar
     os envelopes de um destino — latência; e a aceitar DENTRO_MS diferente por cliente):
       G11 a Ana entra atrasada com os prazos do `dentro` DESENCONTRADOS (depois do prazo do Cris e da Duda, antes do
          da Bia): a memória da queda viaja (`caidos`), a Bia responde a foto em segundos, ninguém é marcado por prazo;
       G12 queda cruzada: o Cris cai, a Ana (A1) cai enquanto ele está fora, o Cris volta sem ter visto o `caiu` dela:
          aceita a foto da Bia em segundos e a guerra anda, sem marca por prazo;
       G13 a marca `ia` com quem recebe À FRENTE de quem marcou (a entrada da Bia segurada): entra na vez do herói nos
          quatro — zero `dessinc`, zero restauração;
       G14 o relé reinicia (os quatro voltam por conexões novas sem `caiu` nenhum): o `dentro {religou}` apresenta a
          conexão nova, os quatro sincronizam em segundos e ninguém "vence" por W.O.;
       G15 a Ana religa ANTES de o relé anunciar o `caiu` da conexão velha: se acerta pela Bia, e o `caiu` velho que
          chega depois não a derruba de novo. -->
<div id="summary">rodando…</div>
<ul id="lista"></ul>
<div id="palco"></div>
<script src="save_sandbox.js"></script>
<script>
(function () {
  'use strict';
  var RAIZ = '../';
  var lista = document.getElementById('lista');
  var falhas = 0, total = 0, notas = [];
  function secao(t) { var h = document.createElement('h2'); h.textContent = t; lista.appendChild(h); }
  function check(nome, ok, extra) {
    total++;
    if (!ok) falhas++;
    var li = document.createElement('li');
    li.innerHTML = (ok ? '<span class="ok">PASSOU</span> · ' : '<span class="no">FALHOU</span> · ') + nome +
      (extra !== undefined && extra !== null && extra !== '' ? ' — <code>' + String(extra).replace(/</g, '&lt;') + '</code>' : '');
    lista.appendChild(li);
  }
  function fim() {
    var sum = document.getElementById('summary');
    sum.className = falhas ? 'fail' : 'allpass';
    sum.textContent = falhas ? ('FALHOU — ' + falhas + ' de ' + total) : ('tudo passou (' + total + ')');
    if (notas.length) { var li = document.createElement('li'); li.textContent = 'notas: ' + notas.join(' · '); lista.appendChild(li); }
    window.__pronto = true;
    window.__fail = falhas;
  }

  // ------------------------------------------------------------ o correio, o relógio e os quatro clientes
  var relogio = window.__relogio = { t: 1757900000000 };
  var correio = window.__correio = [];
  var erros = window.__erros = [];
  var cli = {}, registro = [];
  var segurados = [], segura = {};       // 19/09: latência de mentira — os envelopes de um destino ficam segurados
  var IDS = ['ana', 'bia', 'cris', 'duda'];
  function entrega() {
    var n = 0;
    while (correio.length && n++ < 40000) {
      var it = correio.shift();
      var env = JSON.parse(it.s);
      var alvo = cli[env.para], de = cli[env.de];
      if (!alvo || !alvo.vivo || (de && !de.vivo)) continue;
      if (env.paraCx && env.paraCx !== alvo.cx) continue;
      if (segura[env.para]) { segurados.push({ para: env.para, s: it.s }); continue; }
      if (env.t === 'batalha') registro.push({ t: relogio.t, de: env.de, para: env.para, acao: env.acao, cx: env.cx, dados: env.dados });
      alvo.J.Rede._recebe(env);
    }
  }
  function solta(para) {
    delete segura[para];
    var fica = [];
    segurados.forEach(function (it) { if (it.para === para) correio.push({ de: JSON.parse(it.s).de, s: it.s }); else fica.push(it); });
    segurados = fica;
    entrega();
  }
  var turnoMax = {}, diminuiu = [];      // 19/09: o turno de cada um nunca pode DIMINUIR (a foto velha de quem voltava rebobinava)
  function passo(ms, quem) {
    relogio.t += (ms || 50);
    entrega();
    IDS.forEach(function (id) {
      var c = cli[id];
      if (!c || !c.vivo || (quem && quem.indexOf(id) < 0)) return;
      try { c.J.Game.update(0.05); c.J.Coop._tique(); }
      catch (e) { erros.push(id + ': ' + e.message + ' @ ' + String(e.stack || '').split('\n').slice(1, 3).join(' ')); }
      c.J.Engine.events.length = 0;
      var T = c.J.Game.state ? c.J.Game.state.turno : -1;
      if (turnoMax[id] != null && T >= 0 && T < turnoMax[id]) diminuiu.push(id + ':' + turnoMax[id] + '>' + T);
      if (T >= 0) turnoMax[id] = Math.max(turnoMax[id] || 0, T);
      entrega();
    });
  }
  function ate(cond, max, ms, quem) {
    for (var i = 0; i < (max || 4000); i++) { if (cond()) return true; passo(ms, quem); }
    return cond();
  }
  function tela(id) { return cli[id].J.Game.screen; }
  function final(id) { var J = cli[id].J; return J.Game.state ? J.Engine.hash(J.Game.state) : null; }
  function hashesIguais(ids, desde) {
    var base = cli[ids[0]].J.Coop._hashes(), n = 0, dif = [];
    Object.keys(base).forEach(function (T) {
      if (+T < (desde || 0)) return;
      var todos = true;
      for (var i = 1; i < ids.length; i++) {
        var h = cli[ids[i]].J.Coop._hashes()[T];
        if (h === undefined) { todos = false; break; }
        if (h !== base[T]) dif.push(ids[i] + '@' + T);
      }
      if (todos) n++;
    });
    return { n: n, dif: dif };
  }
  function filho(cb) {
    var fr = document.createElement('iframe');
    fr.src = 'coop_motor.html?filho=cliente&raiz=' + encodeURIComponent(RAIZ) + '&base=' + encodeURIComponent(RAIZ + 'js/core/') + '&n=' + Math.random();
    document.getElementById('palco').appendChild(fr);
    var t0 = Date.now();
    (function espera() {
      var w = null;
      try { w = fr.contentWindow; } catch (e) {}
      if (w && w.__pronto && w.JOGO && w.JOGO.Engine && w.JOGO.Coop && w.JOGO.Game) return cb(w);
      if (Date.now() - t0 > 90000) return cb(null);
      setTimeout(espera, 60);
    })();
  }
  var LADO = { ana: 'A', bia: 'A', cris: 'B', duda: 'B' };
  var DUPLA = { ana: [['espadachim', 'fogo', 22], ['curandeiro', 'agua', 20]], bia: [['espadachim', 'terra', 21], ['arqueiro', 'ar', 21]],
                cris: [['minotauro', 'terra', 22], ['bruxo', 'fogo', 20]], duda: [['invocador', 'agua', 21], ['curandeiro', 'ar', 21]] };
  function prep(w, id) {
    var J = w.JOGO, P = J.Progress;
    P.reset();
    DUPLA[id].forEach(function (h) {
      P.unlockClass(h[0]);
      var he = P.hero(h[0]) || P.hero(P.createHero(h[0]));
      he.level = h[2]; he.element = h[1];
      var tab = (J.DATA.leveling || {}).xpTable || [];
      he.xp = tab[h[2] - 1] != null ? tab[h[2] - 1] : he.xp;
      he.spells = P.spellsFor(h[0]);
    });
    P.save();
    var cx = 'cx' + id;
    J.Rede._ident(id, cx);
    cli[id] = { w: w, J: J, id: id, cx: cx, vivo: true, fechou: [], avisos: [], vidaFim: [], saidas: [], lutas: [] };
    J.Guerra = { fechar: function (corpo) { cli[id].fechou.push(JSON.parse(JSON.stringify(corpo))); return Promise.resolve({ ok: true, gid: corpo.gid, fase: 'won', xp: 40 }); },
                 sairDaPartida: function (gid) { cli[id].saidas.push({ via: 'guerra', gid: gid }); return Promise.resolve({ ok: true }); } };
    // 19/09: o que a guerra toca fora do Coop — a vida única (quem sai fica a 0) e a autoridade do servidor (a luta
    // aberta da conta; a saída declarada com keepalive) — como dublês que só anotam
    J.Vida = { fim: function (m, mx) { cli[id].vidaFim.push({ fim: JSON.parse(JSON.stringify(m)), max: JSON.parse(JSON.stringify(mx || {})) }); return true; },
               sincroniza: function () {} };
    J.Autoridade = {
      ligada: function () { return true; },
      abreLuta: function (tipo, ref) { cli[id].lutas.push({ op: 'abre', tipo: tipo, ref: ref }); },
      anotaLuta: function (ref, lances, fim, corpo) { cli[id].lutas.push({ op: 'anota', ref: ref, n: (lances || []).length, fim: !!fim, corpo: corpo ? JSON.parse(JSON.stringify(corpo)) : null }); },
      esqueceLuta: function () {}, lutaAberta: function () { return null; },
      saiDaGuerra: function (gid) { cli[id].saidas.push({ via: 'autoridade', gid: gid }); return Promise.resolve({ ok: true }); },
      fechaGuerra: function (corpo) { return Promise.resolve({ ok: true, gid: corpo.gid, fase: 'won', xp: 40 }); }
    };
  }
  var nGuerra = 0;
  var PADRAO = { GRACA_MS: 15000, WO_MS: 60000, SILENCIO_MS: 30000, DENTRO_MS: 15000 };
  /* 19/09: um cliente de cada vez (a Ana entra atrasada no G9) — e os prazos do Coop voltam ao padrão quando a
   * seção não pede outros (antes o GRACA de 1,5 s do G3 vazava para as seções seguintes) */
  function abreUm(id, g, op) {
    op = op || {};
    var c = cli[id];
    c.vivo = true; c.cx = 'cx' + id; c.fechou = []; c.avisos = []; c.vidaFim = []; c.saidas = []; c.lutas = [];
    delete turnoMax[id];
    c.J.Rede._ident(id, c.cx);
    c.J.Coop._reset();
    c.J.Coop._semIntervalo = true;
    c.J.Coop._agora = function () { return relogio.t; };
    ['GRACA_MS', 'WO_MS', 'SILENCIO_MS', 'DENTRO_MS'].forEach(function (k) { c.J.Coop[k] = op[k] || PADRAO[k]; });
    // 19/09: prazos diferentes por cliente (o salão de cada um carrega num tempo)
    if (op.porCliente && op.porCliente[id]) Object.keys(op.porCliente[id]).forEach(function (k) { c.J.Coop[k] = op.porCliente[id][k]; });
    c.J.Coop.aoAviso = function (t) { c.avisos.push(t); };
    c.J.Game.init();
    return c.J.Coop.iniciaGuerra({ gid: g.gid, ata: JSON.parse(JSON.stringify(g.ata)), jogadores: g.jogadores, guildas: g.guildas, eu: id });
  }
  function abreGuerra(op) {
    op = op || {};
    nGuerra++;
    registro.length = 0;
    correio.length = 0;
    diminuiu.length = 0;
    segurados = []; Object.keys(segura).forEach(function (k) { delete segura[k]; });
    var gid = 'guerra-' + ('00000000000000000000' + (1234567 + nGuerra).toString(16)).slice(-20);
    var A = [], B = [];
    IDS.forEach(function (id) {
      var ps = cli[id].J.Coop.payloadMeus(DUPLA[id].map(function (h) { return h[0]; }));
      (LADO[id] === 'A' ? A : B).push.apply(LADO[id] === 'A' ? A : B, ps);
    });
    var ata = { mapa: 'sede', sala: 0, semente: 31337 + nGuerra * 7919, A: A, B: B, carry: { 'ana:espadachim': 40 } };
    var jogadores = IDS.map(function (id, i) {
      return { conta: 100 + i, nome: id.charAt(0).toUpperCase() + id.slice(1), dono: id, lado: LADO[id], ordem: (id === 'ana' || id === 'cris') ? 0 : 1 };
    });
    var guildas = { A: { id: 1, nome: 'Lanças do Norte', emblema: '⚔' }, B: { id: 2, nome: 'Raízes Fundas', emblema: '☘' } };
    var g = { gid: gid, ata: ata, jogadores: jogadores, guildas: guildas };
    g.oks = IDS.filter(function (id) { return !op.menos || op.menos.indexOf(id) < 0; }).map(function (id) { return abreUm(id, g, op); });
    return g;
  }
  function pilota(quem) { IDS.forEach(function (id) { cli[id].J.Coop._piloto((!quem || quem.indexOf(id) >= 0) ? { joga: true } : null); }); }
  function unid(id, dono, heroId) {
    var st = cli[id].J.Game.state;
    return st ? st.units.filter(function (u) { return u.kind === 'hero' && u.dono === dono && (!heroId || u.heroId === heroId); }) : [];
  }

  // ------------------------------------------------------------ as seções
  function G1e2() {
    secao('G1 · os quatro abrem a guerra da ata do servidor');
    var g = abreGuerra();
    check('os quatro abrem a guerra (a ata com os oito heróis e o dono de cada um confere)', g.oks.every(Boolean), g.oks.join(','));
    check('os quatro na tela da batalha, modo de rede "guerra", com o lado certo',
          IDS.every(function (id) { return tela(id) === 'battle' && cli[id].J.Game.modoRede() === 'guerra'; }) &&
          cli.bia.J.Game.meuLado() === 'player' && cli.cris.J.Game.meuLado() === 'enemy',
          IDS.map(tela).join(','));
    var ea = unid('ana', 'ana', 'espadachim')[0], eb = unid('ana', 'bia', 'espadachim')[0];
    check('a vida entra por dono:heroId: o Espadachim da Ana a 40 PV, o da Bia (o mesmo heroId) cheio',
          ea && ea.hp === 40 && eb && eb.hp === eb.hpMax, (ea && ea.hp) + ' / ' + (eb && eb.hp + '/' + eb.hpMax));
    var h0 = IDS.map(final);
    check('os quatro nascem com o MESMO hash (oito heróis, quatro de cada lado)',
          h0.every(function (h) { return h === h0[0]; }) && cli.ana.J.Game.state.units.filter(function (u) { return u.kind === 'hero'; }).length === 8,
          h0.join(','));
    check('antes de os quatro entrarem ninguém joga (o Coop segura a batalha)', cli.ana.J.Coop.bloqueado() === true);
    ate(function () { return IDS.every(function (id) { return !cli[id].J.Coop.bloqueado(); }); }, 200);
    check('os `dentro` dos quatro chegam: a batalha solta nos quatro', IDS.every(function (id) { return !cli[id].J.Coop.bloqueado(); }));
    var ses = cli.duda.J.Coop.sessao();
    check('quem manda é a Ana (A1) na conta de todos', IDS.every(function (id) { return cli[id].J.Coop.sessao().autoridade === 'ana'; }) &&
          ses.guerra && ses.guerra.jogadores.length === 4, JSON.stringify(ses.guerra && ses.guerra.autoridade));

    secao('G2 · a guerra inteira pelo piloto: o hash bate nos quatro');
    pilota();
    var voltas = 0;
    ate(function () { voltas++; return IDS.every(function (id) { return tela(id) !== 'battle'; }); }, 60000, 50);
    var hs = hashesIguais(IDS, 0), fins = IDS.map(final);
    check('a guerra termina nos quatro com o mesmo hash em todo turno guardado e no fim',
          IDS.every(function (id) { return tela(id) === 'duelFim'; }) && !hs.dif.length && hs.n > 8 && fins.every(function (h) { return h === fins[0]; }),
          IDS.map(tela).join(',') + ' · ' + hs.n + ' turnos · dif ' + hs.dif.slice(0, 4).join(' ') + ' · fase ' + (cli.ana.J.Game.state && cli.ana.J.Game.state.phase));
    var lances = registro.filter(function (m) { return m.acao === 'lance'; });
    var porLance = {};
    lances.forEach(function (m) { var k = m.de + ':' + m.dados.T + ':' + m.dados.k; porLance[k] = (porLance[k] || 0) + 1; });
    var ks = Object.keys(porLance);
    check('cada lance vai aos TRÊS outros (um envelope dirigido por destino) e os quatro jogaram',
          ks.length > 10 && ks.every(function (k) { return porLance[k] === 3; }) &&
          IDS.every(function (id) { return lances.some(function (m) { return m.de === id; }); }),
          ks.length + ' lances · ' + ks.filter(function (k) { return porLance[k] !== 3; }).slice(0, 3).join(' '));
    var telaA = cli.ana.w.__telas.filter(function (t) { return t.n === 'duelFim'; }).pop(), telaC = cli.cris.w.__telas.filter(function (t) { return t.n === 'duelFim'; }).pop();
    var dA = telaA && telaA.d || {}, dC = telaC && telaC.d || {};
    check('a tela de fim é a da guerra: a vitória de uma GUILDA (a Ana e o Cris veem lados opostos), com as guildas e os quatro',
          dA.guerra === true && dC.guerra === true && (dA.empate || dA.venci === !dC.venci) && dA.guildas && dA.guildas.B.nome === 'Raízes Fundas' &&
          (dA.jogadores || []).length === 4 && dA.lado === 'A' && dC.lado === 'B',
          JSON.stringify({ a: dA.venci, c: dC.venci, e: dA.empate }));
    var fechou = IDS.map(function (id) { return cli[id].fechou[0]; });
    check('os quatro fecham no servidor com o mesmo gid e o registro com os lances de todos (e o mesmo hash do fim)',
          fechou.every(function (f) { return f && f.gid === g.gid && f.hashFinal === fins[0] && !f.fotografada; }) &&
          IDS.every(function (id) { return fechou[0].lances.some(function (l) { return l.de === id; }); }),
          fechou.map(function (f) { return f ? f.lances.length : 'x'; }).join(','));
  }

  function G3() {
    secao('G3 · a Bia cai: quem marca é o parceiro de guilda, e ela volta');
    abreGuerra({ GRACA_MS: 1500, SILENCIO_MS: 60000 });
    pilota();
    ate(function () { return IDS.every(function (id) { return cli[id].J.Game.state && cli[id].J.Game.state.turno >= 6; }); }, 3000);
    registro.length = 0;
    cli.bia.vivo = false;
    ['ana', 'cris', 'duda'].forEach(function (id) { cli[id].J.Rede._sinal({ tipo: 'caiu', id: 'bia', cx: 'cxbia' }); });
    ate(function () { return unid('ana', 'bia').every(function (u) { return u.ia || !u.alive; }) && unid('cris', 'bia').some(function (u) { return u.ia; }); }, 3000, 100, ['ana', 'cris', 'duda']);
    var marcas = registro.filter(function (m) { return m.acao === 'ia'; });
    check('passada a carência, os heróis da Bia ficam marcados fora (u.ia) nos três motores que ficaram',
          ['ana', 'cris', 'duda'].every(function (id) { return unid(id, 'bia').some(function (u) { return u.ia; }); }),
          ['ana', 'cris', 'duda'].map(function (id) { return unid(id, 'bia').map(function (u) { return u.ia ? 1 : 0; }).join(''); }).join(' '));
    check('quem marcou foi a Ana (a parceira de guilda) — o Cris e a Duda nunca marcam',
          marcas.length > 0 && marcas.every(function (m) { return m.de === 'ana'; }), marcas.map(function (m) { return m.de; }).join(','));
    ate(function () { return false; }, 60, 100, ['ana', 'cris', 'duda']);
    var tAntes = cli.ana.J.Game.state.turno;
    check('com a Bia fora, a guerra anda (o turno dela passa)', tela('ana') !== 'battle' || tAntes > 6, tAntes);
    if (tela('ana') !== 'battle') { notas.push('G3: a guerra acabou antes da volta'); return; }
    // a volta, por outra conexão
    cli.bia.vivo = true; cli.bia.cx = 'cxbia2';
    cli.bia.J.Rede._ident('bia', 'cxbia2');
    cli.bia.J.Rede._sinal({ tipo: 'religou', cx: 'cxbia2' });
    var volta = ate(function () {
      return cli.bia.J.Coop.sessao().restauracoes > 0 && IDS.every(function (id) { return unid(id, 'bia').every(function (u) { return !u.ia; }); });
    }, 600);
    var tVolta = cli.bia.J.Game.state ? cli.bia.J.Game.state.turno : 0;

  // ------------------------------------------------------------ 19/09: quem manda cai, quem chega atrasado, quem sai
  function turno(id) { return cli[id].J.Game.state ? cli[id].J.Game.state.turno : -1; }
  function ses(id) { return cli[id].J.Coop.sessao(); }
  /* 19/09: a marca de quem caiu entra na VEZ do herói (senão o hash diverge de quem já está à frente), então a
   * prova lê a marca EFETIVA: a que já está no motor MAIS a que espera na fila (Coop._iaPendentes). */
  function iaEfetivaDe(id, dono) {
    var pend = cli[id].J.Coop._iaPendentes ? cli[id].J.Coop._iaPendentes() : [];
    return unid(id, dono).some(function (u) {
      var fila = pend.filter(function (p) { return p.uid === u.uid; });
      return fila.length ? !!fila[fila.length - 1].v : !!u.ia;
    });
  }
  function iaDe(id, dono) { return unid(id, dono).map(function (u) { return u.alive ? (u.ia ? 'i' : 'v') : 'x'; }).join(''); }
  function outros(id) { return IDS.filter(function (x) { return x !== id; }); }
  /* 19/09: o `caiu` do relé só chega a quem está LIGADO naquele instante (o relé de verdade avisa os vigias vivos) —
   * quem estava fora quando outro caiu volta sem essa memória, e é isso que a união dos `caidos` cobre */
  function cai(id) {
    cli[id].vivo = false;
    outros(id).forEach(function (x) { if (cli[x].vivo) cli[x].J.Rede._sinal({ tipo: 'caiu', id: id, cx: cli[id].cx }); });
  }
  function autoridades() { return IDS.map(function (id) { return id + '→' + (ses(id).guerra ? ses(id).guerra.autoridade : '-'); }).join(' '); }
  function marcasPrazo() {
    var donoDe = function (uid) { var st = cli.bia.J.Game.state, u = st && st.units.filter(function (x) { return x.uid === uid; })[0]; return u ? u.dono : '?'; };
    var out = [];
    registro.filter(function (m) { return m.acao === 'ia' && m.dados.mot === 'prazo'; }).forEach(function (m) { var s = m.de + '→' + donoDe(m.dados.u); if (out.indexOf(s) < 0) out.push(s); });
    return out;
  }
  function volta(id) {
    var c = cli[id];
    c.vivo = true; c.cx = 'cx' + id + '2';
    c.J.Rede._ident(id, c.cx);
    c.J.Rede._sinal({ tipo: 'religou', cx: c.cx });
  }

          'restaurações ' + ses('ana').restauracoes + ' · ' + Math.round((relogio.t - tEntrou) / 1000) + ' s · bloqueado ' + cli.ana.J.Coop.bloqueado());
    check('quem manda é a Bia na conta dos quatro', IDS.every(function (id) { return ses(id).guerra.autoridade === 'bia'; }), autoridades());
    ate(function () { return false; }, 60, 100);
    check('ninguém marca ninguém por PRAZO (o relógio do motor congelado não estoura a vez de quem está ali); os três não restauram',
          !marcasPrazo().length && outros('ana').every(function (id) { return ses(id).restauracoes === 0; }), marcasPrazo().join(' '));
    ate(function () { return IDS.every(function (id) { return tela(id) !== 'battle'; }); }, 60000, 100);
    var lancesBia = registro.filter(function (m) { return m.acao === 'lance' && m.de === 'bia' && m.t > tEntrou; }).length;
    check('a Bia (presente o tempo todo) segue jogando depois da entrada da Ana, a guerra acaba nos quatro e ninguém foi marcado por prazo',
          lancesBia > 0 && IDS.every(function (id) { return tela(id) === 'duelFim'; }) && !marcasPrazo().length,
          'lances da Bia ' + lancesBia + ' · telas ' + IDS.map(tela).join(',') + ' · prazo ' + marcasPrazo().join(' '));
    check('o turno nunca diminuiu em ninguém (a foto sai antes de o motor da Ana dar um passo)', !diminuiu.length, diminuiu.slice(0, 3).join(' '));
  }
  function G12() {
    secao('G12 · queda cruzada: o Cris cai; a Ana (A1) cai enquanto ele está fora; o Cris volta sem ter visto o `caiu` dela');
    abreGuerra({ GRACA_MS: 1500, SILENCIO_MS: 60000 });
    pilota();
    ate(function () { return IDS.every(function (id) { return turno(id) >= 6; }); }, 3000);
    cai('cris');
    ate(function () { return false; }, 10, 100, outros('cris'));
    cai('ana');
    ate(function () { return unid('bia', 'ana').every(function (u) { return u.ia || !u.alive; }); }, 3000, 100, ['bia', 'duda']);
    ate(function () { return false; }, 5, 100, ['bia', 'duda']);
    if (tela('bia') !== 'battle') { notas.push('G12: a guerra acabou antes da volta'); return; }
    registro.length = 0; diminuiu.length = 0;
    volta('cris');
    var tC = relogio.t;
    ate(function () { return ses('cris').restauracoes > 0; }, 50, 100, ['bia', 'cris', 'duda']);
    check('o Cris volta e aceita a foto da Bia em menos de 5 s (os `caidos` dela dizem que a Ana caiu: quem manda é a Bia)',
          ses('cris').restauracoes === 1 && relogio.t - tC < 5000 && !cli.cris.J.Coop.bloqueado() && ses('cris').guerra.autoridade === 'bia',
          'restaurações ' + ses('cris').restauracoes + ' · ' + Math.round((relogio.t - tC) / 1000) + ' s · ' + autoridades());
    volta('ana');
    ate(function () { return ses('ana').restauracoes > 0; }, 50, 100);
    check('a Ana volta (euCai) e se acerta pela Bia', ses('ana').restauracoes === 1 && ses('ana').guerra.autoridade === 'bia', autoridades());
    var tA = relogio.t, T0 = Math.max.apply(null, IDS.map(turno));
    ate(function () { return IDS.some(function (id) { return tela(id) !== 'battle'; }) || relogio.t - tA > 60000; }, 600, 100);
    check('a guerra anda para os quatro (ninguém travado, o turno sobe)',
          IDS.every(function (id) { return tela(id) !== 'battle' || (!cli[id].J.Coop.bloqueado() && turno(id) > T0 + 6); }),
          'turnos ' + IDS.map(function (id) { return id + '=' + turno(id); }).join(' ') + ' · telas ' + IDS.map(tela).join(','));
    check('a marca do Cris e a da Duda são iguais nos quatro (a `volta` que chegou antes da foto entrou depois dela)',
          IDS.every(function (id) { return iaDe(id, 'cris') === iaDe('bia', 'cris') && iaDe(id, 'duda') === iaDe('bia', 'duda'); }),
          'cris ' + IDS.map(function (id) { return iaDe(id, 'cris'); }).join(' ') + ' · duda ' + IDS.map(function (id) { return iaDe(id, 'duda'); }).join(' '));
    check('ninguém marcou ninguém por PRAZO; uma restauração só em cada um que voltou, nenhuma na Bia e na Duda',
          !marcasPrazo().length && ses('cris').restauracoes === 1 && ses('ana').restauracoes === 1 && ses('bia').restauracoes === 0 && ses('duda').restauracoes === 0,
          marcasPrazo().join(' ') + ' · ' + IDS.map(function (id) { return id + '=' + ses(id).restauracoes; }).join(' '));
    check('o turno nunca diminuiu em ninguém', !diminuiu.length, diminuiu.slice(0, 3).join(' '));
  }
  function G13() {
    secao('G13 · a marca `ia` com quem recebe À FRENTE de quem marcou (a entrada da Bia segurada)');
    abreGuerra({ GRACA_MS: 1500, SILENCIO_MS: 60000 });
    pilota();
    ate(function () { return IDS.every(function (id) { return turno(id) >= 6; }); }, 3000);
    cai('ana');
    segura.bia = true;                                   // a Bia deixa de RECEBER (o que ela manda segue)
    var tB = turno('bia');
    ate(function () { return turno('cris') > tB + 1 && registro.some(function (m) { return m.acao === 'ia' && m.de === 'bia'; }); }, 60, 100, outros('ana'));
    var marca = registro.filter(function (m) { return m.acao === 'ia' && m.de === 'bia' && m.dados.mot !== 'volta'; });
    check('(cenário) quando a marca da Bia saiu, o Cris e a Duda já estavam num turno À FRENTE do dela',
          marca.length > 0 && outros('ana').some(function (id) { return turno(id) > marca[0].dados.T; }),
          'marca em T' + (marca[0] && marca[0].dados.T) + ' · turnos ' + outros('ana').map(function (id) { return id + '=' + turno(id); }).join(' '));
    var rest0 = {}; IDS.forEach(function (id) { rest0[id] = ses(id).restauracoes; });
    registro.length = 0;
    solta('bia');
    ate(function () { return false; }, 60, 100, outros('ana'));
    var dess = registro.filter(function (m) { return m.acao === 'dessinc'; });
    check('a marca fora de ordem não custa divergência: zero `dessinc`, zero restauração (ela entra na VEZ do herói nos três)',
          !dess.length && outros('ana').every(function (id) { return ses(id).restauracoes === rest0[id]; }),
          'dessinc ' + dess.map(function (m) { return m.de + '@T' + m.dados.T; }).join(' ') + ' · restaurações ' + outros('ana').map(function (id) { return id + '=' + (ses(id).restauracoes - rest0[id]); }).join(' '));
    var hs = hashesIguais(outros('ana'), tB);
    check('o hash bate nos três desde o turno da marca, e a marca da Ana é igual nos três',
          !hs.dif.length && hs.n > 4 && outros('ana').every(function (id) { return iaDe(id, 'ana') === iaDe('bia', 'ana'); }),
          hs.n + ' turnos · dif ' + hs.dif.slice(0, 4).join(' ') + ' · ia ' + outros('ana').map(function (id) { return iaDe(id, 'ana'); }).join(' '));
  }
  function G14() {
    secao('G14 · o relé reinicia: os quatro caem e voltam por conexões novas, sem `caiu` nenhum');
    abreGuerra({ GRACA_MS: 1500 });
    pilota();
    ate(function () { return IDS.every(function (id) { return turno(id) >= 6; }); }, 3000);
    var t0 = relogio.t, T0 = Math.max.apply(null, IDS.map(turno));
    IDS.forEach(function (id) { cli[id].vivo = false; });
    relogio.t += 3000;
    registro.length = 0;
    IDS.forEach(volta);
    ate(function () { return outros('ana').every(function (id) { return ses(id).restauracoes > 0; }) && IDS.every(function (id) { return !cli[id].J.Coop.bloqueado(); }); }, 100, 100);
    check('cada conexão nova se apresenta aos três com `dentro {religou}` sem cx',
          IDS.every(function (id) { return registro.filter(function (m) { return m.acao === 'dentro' && m.de === id && m.dados.religou === true && m.dados.viu === false; }).length >= 3; }));
    check('em menos de 10 s os quatro estão sincronizados e jogando; quem manda volta a ser a Ana (os quatro caíram) na conta de todos',
          IDS.every(function (id) { return !cli[id].J.Coop.bloqueado() && ses(id).guerra.autoridade === 'ana'; }) && relogio.t - t0 < 13000,
          autoridades() + ' · ' + Math.round((relogio.t - t0) / 1000) + ' s');
    check('quem manda não restaura; os outros três, uma vez cada', ses('ana').restauracoes === 0 && outros('ana').every(function (id) { return ses(id).restauracoes === 1; }),
          IDS.map(function (id) { return id + '=' + ses(id).restauracoes; }).join(' '));
    ate(function () { return IDS.every(function (id) { return tela(id) !== 'battle'; }) || relogio.t - t0 > 130000; }, 1300, 100);
    var fins = IDS.map(function (id) { return (cli[id].w.__telas.filter(function (t) { return t.n === 'duelFim'; }).pop() || {}).d || null; });
    check('a guerra segue até o fim para os quatro, sem W.O., e os quatro fecham com o mesmo hash do fim',
          IDS.every(function (id) { return tela(id) === 'duelFim' && turno(id) > T0 + 6; }) && fins.every(function (f) { return f && !f.wo; }) &&
          IDS.every(function (id) { return cli[id].fechou[0] && !cli[id].fechou[0].wo && cli[id].fechou[0].hashFinal === cli.ana.fechou[0].hashFinal; }),
          'telas ' + IDS.map(tela).join(',') + ' · fins ' + fins.map(function (f) { return f ? (f.wo ? 'wo' : (f.venci ? 'venci' : 'perdi')) : '-'; }).join(','));
  }
  function G15() {
    secao('G15 · a Ana religa ANTES de o relé anunciar o `caiu` da conexão velha (o `caiu` velho chega depois)');
    abreGuerra({ GRACA_MS: 1500, SILENCIO_MS: 60000 });
    pilota();
    ate(function () { return IDS.every(function (id) { return turno(id) >= 6; }); }, 3000);
    var cxVelho = cli.ana.cx;
    cli.ana.vivo = false;
    ate(function () { return false; }, 20, 100, outros('ana'));
    registro.length = 0;
    volta('ana');
    var tV = relogio.t;
    ate(function () { return ses('ana').restauracoes > 0; }, 50, 100);
    check('sem o `caiu`, a conexão nova se apresenta (`dentro {religou}`) e a Ana se acerta pela Bia em menos de 5 s',
          ses('ana').restauracoes === 1 && relogio.t - tV < 5000 && !cli.ana.J.Coop.bloqueado() && IDS.every(function (id) { return ses(id).guerra.autoridade === 'bia'; }),
          'restaurações ' + ses('ana').restauracoes + ' · ' + Math.round((relogio.t - tV) / 1000) + ' s · ' + autoridades());
    outros('ana').forEach(function (x) { cli[x].J.Rede._sinal({ tipo: 'caiu', id: 'ana', cx: cxVelho }); });
    ate(function () { return false; }, 30, 100);
    var on = outros('ana').map(function (id) { return ses(id).guerra.jogadores.filter(function (j) { return j.id === 'ana'; })[0].on; });
    check('o `caiu` atrasado da conexão VELHA não a derruba de novo: sem segunda foto, sem marca por prazo, ninguém a dá por fora',
          ses('ana').restauracoes === 1 && !marcasPrazo().length && on.every(Boolean), 'restaurações ' + ses('ana').restauracoes + ' · on ' + on.join(','));
    var tA = Math.max.apply(null, IDS.map(turno));
    ate(function () { return IDS.every(function (id) { return tela(id) !== 'battle' || turno(id) >= tA + 12; }); }, 20000);
    var hs = hashesIguais(IDS, tA + 1);
    var acabou = IDS.every(function (id) { return tela(id) !== 'battle'; });
    if (acabou && !hs.n) notas.push('a guerra acabou logo depois da volta — sem turno novo para comparar');
    check('daí em diante o hash bate nos quatro', !hs.dif.length && (hs.n > 0 || acabou),
          hs.n + ' turnos · dif ' + hs.dif.slice(0, 4).join(' ') + (acabou ? ' · a guerra acabou' : ''));
  }

  function etapa(fn) {
    return function (prox) {
      try { fn(); } catch (e) { check('a etapa quebrou', false, e.message + ' @ ' + String(e.stack || '').split('\n').slice(1, 3).join(' ')); }
      setTimeout(prox, 0);
    };
  }
  window.addEventListener('load', function () {
    var ws = [];
    (function carrega(i) {
      if (i >= IDS.length) {
        if (ws.some(function (w) { return !w; })) { check('os quatro iframes carregaram', false, ws.map(Boolean).join(',')); return fim(); }
        IDS.forEach(function (id, k) { prep(ws[k], id); });
        var so = (/[?&]so=([^&]+)/.exec(location.search) || [])[1];
        var quer = function (s) { return !so || decodeURIComponent(so).split(',').indexOf(s) >= 0; };
        var fila = [];
        if (quer('1')) fila.push(etapa(G1e2));
        if (quer('3')) fila.push(etapa(G3));
        if (quer('4')) fila.push(etapa(G4e5));
        if (quer('6')) fila.push(etapa(G6));
        if (quer('7')) fila.push(etapa(G7));
        if (quer('8')) fila.push(etapa(G8));
        if (quer('9')) fila.push(etapa(G9));
        if (quer('10')) fila.push(etapa(G10));
        if (quer('11')) fila.push(etapa(G11));
        if (quer('12')) fila.push(etapa(G12));
        if (quer('13')) fila.push(etapa(G13));
        if (quer('14')) fila.push(etapa(G14));
        if (quer('15')) fila.push(etapa(G15));
        fila.push(etapa(function () { check('nenhum erro de script nos quatro clientes', !erros.length, erros.slice(0, 4).join(' | ')); }));
        return (function roda(j) { if (j >= fila.length) return fim(); fila[j](function () { roda(j + 1); }); })(0);
      }
      filho(function (w) { ws.push(w); carrega(i + 1); });
    })(0);
  });
})();
</script>
