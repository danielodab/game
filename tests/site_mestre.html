<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>SOTERRA — o painel do Mestre no site</title>
<style>body{margin:0;background:#0f1216;color:#e8eef6;font:12px monospace;padding:10px}
#summary{padding:6px 10px;border-radius:6px;margin-bottom:8px}
.allpass{background:#16241b;color:#7fe08a} .fail{background:#3d1414;color:#f77}
#palco{position:absolute;left:-4000px;top:0;width:1000px;height:900px}</style>
</head>
<body>
<!-- A PROVA DO PAINEL DO MESTRE (site/mestre.html + mestre.js, 10/09), sem
     servidor, no molde de tests/site_fase_c.html: a página real num iframe com
     um window.fetch FALSO que responde as rotas /api/mestre/* do contrato
     (admin_plano §2.2 e a seção 7 do plano da loja 2). O que se cobra:
       - o portão: sem sessão, "entre" e nenhum pedido; a sessão local diz gm
         mas /api/eu não: "só do Mestre", nenhum /api/mestre/* e a marca local
         cai (o link some); qualquer 403 fecha o painel; 401 é sessão vencida;
       - a busca: curta não chama o servidor; o termo vai no CORPO do POST, e
         nenhuma URL leva '@'; a lista com o e-mail mascarado e a nota do "mais";
         429 com "de novo em";
       - a ficha: GET /api/mestre/conta?id=7 (e #conta=7 no endereço, que o F5
         reabre), os dados, o nome da classe vindo do classes.js, "nunca subiu
         save", o botão desligado com o motivo do servidor;
       - dar de presente: janelinha → POST {conta, sku, idem} (16 hex, chave
         nova a cada clique, a mesma só depois de um clique sem resposta); o
         409 com a frase do servidor; dar vinténs → POST {conta, vintens, idem};
       - cancelar só onde `cancelavel`, com {id}; os alertas e o "visto";
       - o botão "conferir no Mercado Pago" de cada pagamento da ficha (POST
         /api/mestre/pagamento/conferir {id}) e o alerta do teto de 24 h, com
         os valores em reais (conserto 11/09);
       - site.js: o link "Mestre" no menu só com gm; "sair" o tira;
       - site/loja.js: o pedido com origem 'presente' diz "presente do Mestre"
         e não tem "cancelar". -->
<div id="summary">rodando…</div>
<div id="log"></div>
<div id="palco"></div>
<script src="../site/site.js"></script>
<script>
(function () {
  'use strict';
  var log = document.getElementById('log'), palco = document.getElementById('palco');
  var falhas = 0, total = 0;
  function check(nome, ok, extra) {
    total++;
    if (!ok) falhas++;
    var d = document.createElement('div');
    d.style.color = ok ? '#8fc79b' : '#f88';
    d.textContent = (ok ? 'PASSOU · ' : 'FALHOU · ') + nome + (!ok && extra ? ' — ' + extra : '');
    log.appendChild(d);
  }
  function fecha() {
    var sum = document.getElementById('summary');
    sum.className = falhas ? 'fail' : 'allpass';
    sum.textContent = falhas ? ('FALHOU — ' + falhas + ' de ' + total) : ('tudo passou (' + total + ')');
    window.__done = true; window.__fail = falhas;
  }
  function espera(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function ate(cond, ms) {
    ms = ms || 3000;
    return new Promise(function (r) {
      var t = 0;
      (function volta() {
        var ok = false;
        try { ok = !!cond(); } catch (e) { ok = false; }
        if (ok) return r(true);
        if ((t += 20) > ms) return r(false);
        setTimeout(volta, 20);
      })();
    });
  }

  var AGORA = Math.floor(Date.now() / 1000), DIA = 86400, HORA = 3600;
  var BASE_SITE = new URL('../site/', location.href).href;
  var CHAVE = 'soterra-sessao';
  var sessaoAntes = null;
  try { sessaoAntes = localStorage.getItem(CHAVE); } catch (e) { /* sem storage */ }
  function lsSessao() { try { return JSON.parse(localStorage.getItem(CHAVE) || 'null'); } catch (e) { return 'erro'; } }
  function copia(o) { return JSON.parse(JSON.stringify(o)); }
  function junta(a, b) { var r = copia(a); Object.keys(b || {}).forEach(function (k) { r[k] = b[k]; }); return r; }

  /* valores sintéticos desta prova (nenhum é de ninguém) */
  var MESTRE = { token: 'tok-mestre', conta: { id: 1, nome: 'Dono', gm: true } };
  var COMUM = { token: 'tok-pia', conta: { id: 7, nome: 'Pia', gm: false } };
  var SAUDE = [200, { ok: true, contas: 3, agora: AGORA, correio: false }];
  var EU_MESTRE = [200, { ok: true, conta: { id: 1, nome: 'Dono', email: 'dono@exemplo.com', criadoEm: AGORA - 90 * DIA, gm: true } }];
  var EU_COMUM = [200, { ok: true, conta: { id: 1, nome: 'Dono', email: 'dono@exemplo.com', criadoEm: AGORA - 90 * DIA, gm: false } }];
  var CATALOGO_PUBLICO = [200, { ok: true, versao: 2, itens: [
    { sku: 'classe-invocador', secao: 'personagens', tipo: 'classe', alvo: 'invocador', qtd: 1, nome: 'Xamã', raridade: 'raro', cartas: 10, preco: 10000, limite: null },
    { sku: 'classe-bruxo', secao: 'personagens', tipo: 'classe', alvo: 'bruxo', qtd: 1, nome: 'Bruxo', raridade: 'raro', cartas: 10, preco: 10000, limite: null }
  ], pacotes: [], pagamento: { ligado: false } }];

  function presente(id, estado, extra) {
    return junta({ id: id, conta: { id: 7, nome: 'Pia' }, sku: 'classe-invocador', nome: 'Xamã', tipo: 'classe', estado: estado, motivo: null,
                   criadoEm: AGORA - 600, retiradoEm: null, fechadoEm: null, por: { id: 1, nome: 'Dono' }, canceladoPor: null,
                   cancelavel: estado === 'pendente', vintens: null }, extra);
  }
  function alerta(id, tipo, visto, extra) {
    return junta({ id: id, conta: { id: 7, nome: 'Pia' }, tipo: tipo, dados: { mp: '99887766', vintens: 5500, pedido: 90, estadoPedido: 'entregue' },
                   criadoEm: AGORA - HORA, vistoEm: visto ? AGORA - 60 : null, vistoPor: visto ? { id: 1, nome: 'Dono' } : null }, extra);
  }
  function ficha(extra) {
    return junta({
      ok: true, agora: AGORA,
      conta: { id: 7, nome: 'Pia', email: 'pia@exemplo.com', criadoEm: AGORA - 40 * DIA, gm: false, banido: false, ultimaSessao: AGORA - 2 * HORA },
      save: { versao: 57, em: AGORA - 3 * HORA, vintens: 12450, nivelMax: 22, xpTotal: 9000 },
      saldo: { carteira: 12450, reservado: 300, aCaminho: 5500, disponivel: 17650, semFundo: false, saveVersao: 57, saveEm: AGORA - 3 * HORA },
      classes: [{ id: 'sumo', nivel: 22, elemento: 'fogo' }, { id: 'curandeiro', nivel: 8, elemento: null }, { id: 'bruxo', nivel: 12, elemento: 'agua' }],
      cartas: { invocador: { liberada: false, cartas: 6 }, bruxo: { liberada: true, cartas: 10 } },
      catalogo: [
        { sku: 'classe-invocador', nome: 'Xamã', secao: 'personagens', tipo: 'classe', alvo: 'invocador', raridade: 'raro', pode: true, motivo: null },
        { sku: 'classe-bruxo', nome: 'Bruxo', secao: 'personagens', tipo: 'classe', alvo: 'bruxo', raridade: 'raro', pode: false, motivo: 'essa classe já está liberada' },
        { sku: 'bonus-xp-7', nome: 'Bônus de XP — 7 dias', secao: 'bonus', tipo: 'bonus-xp', alvo: 'xp', raridade: null, pode: true, motivo: null },
        { sku: 'pedras-fogo-50', nome: '50 Brasas Coaguladas', secao: 'pedras', tipo: 'pedras', alvo: 'stone-ember', raridade: null, pode: true, motivo: null },
        { sku: 'insignias-10', nome: '10 Insígnias de Fundação', secao: 'guilda', tipo: 'insignias', alvo: 'fundacao', raridade: null, pode: true, motivo: null },
        { sku: 'pergaminho-elemento', nome: 'Pergaminho da Reescrita', secao: 'pergaminhos', tipo: 'pergaminho', alvo: 'elemento', raridade: null, pode: true, motivo: null }
      ],
      presentes: [presente(50, 'pendente'), presente(49, 'entregue', { sku: 'presente-vintens', nome: '1.000 vinténs', tipo: 'vintens', vintens: 1000 })],
      pagamentos: [{ id: 17, pacote: 'pacote-5500', nome: 'Saco de 5.500 vinténs', vintens: 5500, centavos: 1990, preco: 'R$ 19,90',
                     estado: 'aprovado', creditado: true, pedido: { id: 90, estado: 'pendente' }, criadoEm: AGORA - HORA, atualizadoEm: AGORA - HORA }],
      alertas: [alerta(4, 'valor-diferente', false),
                alerta(5, 'teto-diario', false, { dados: { pagamento: 18, mp: '99887767', vintens: 25000, centavos: 7990, pagoEm24h: 39950 } })]
    }, extra);
  }

  /* ---- o palco ---- */
  var TODOS = [];
  function le(url) {
    return new Promise(function (ok) {
      var x = new XMLHttpRequest();
      x.open('GET', url + (url.indexOf('?') < 0 ? '?v=' : '&v=') + Date.now());
      x.onload = function () { ok((x.status === 200 || x.status === 0) && x.responseText ? x.responseText : null); };
      x.onerror = function () { ok(null); };
      try { x.send(); } catch (e) { ok(null); }
    });
  }
  function fetchFalso(pagina, cena) {
    return function (url, op) {
      op = op || {};
      var u = String(url), m = /\/api\/[^?#]*/.exec(u), corpo = null;
      try { corpo = op.body ? JSON.parse(op.body) : null; } catch (e) { corpo = op.body; }
      var reg = { pagina: pagina, url: u, metodo: op.method || 'GET', rota: m ? m[0] : u, corpo: corpo,
                  auth: (op.headers && op.headers.Authorization) || null };
      TODOS.push(reg);
      cena.pedidos.push(reg);
      var h = cena.rotas[reg.metodo + ' ' + reg.rota];
      var resp = typeof h === 'function' ? h(corpo || {}, reg) : h;
      if (resp === 'fora') return Promise.reject(new TypeError('Failed to fetch'));
      if (!resp) resp = [404, { ok: false, erro: 'rota desconhecida' }];
      var status = resp[0], json = copia(resp[1]);
      return new Promise(function (ok) {
        setTimeout(function () {
          ok({ status: status, ok: status >= 200 && status < 300, json: function () { return Promise.resolve(json); } });
        }, 4);
      });
    };
  }
  function abre(pagina, cena) {
    cena.pedidos = [];
    return le(BASE_SITE + pagina).then(function (html) {
      if (!html) throw new Error('não deu para ler site/' + pagina);
      palco.innerHTML = '';
      var fr = document.createElement('iframe');
      fr.style.width = '1000px';
      fr.style.height = '900px';
      palco.appendChild(fr);
      try {
        if (cena.sessao) localStorage.setItem(CHAVE, JSON.stringify(cena.sessao));
        else localStorage.removeItem(CHAVE);
      } catch (e) { /* sem storage */ }
      var d = fr.contentDocument;
      d.open();
      var w = fr.contentWindow;
      w.fetch = fetchFalso(pagina, cena);
      w.BroadcastChannel = function () { this.postMessage = function () {}; this.close = function () {}; };
      try { w.history.replaceState(null, '', w.location.href.split('#')[0].split('?')[0] + (cena.hash ? '#' + cena.hash : '')); } catch (e) { /* segue */ }
      d.write(html.replace(/<head>/i, '<head><base href="' + BASE_SITE + '">'));
      d.close();
      return {
        w: w, d: d,
        $: function (id) { return d.getElementById(id); },
        q: function (s) { return d.querySelector(s); },
        qq: function (s) { return [].slice.call(d.querySelectorAll(s)); }
      };
    });
  }
  function visivel(el) {
    if (!el || !el.ownerDocument) return false;
    var w = el.ownerDocument.defaultView;
    for (var e = el; e && e.nodeType === 1; e = e.parentElement) {
      if (e.hidden) return false;
      var cs = w.getComputedStyle(e);
      if (cs.display === 'none' || cs.visibility === 'hidden') return false;
    }
    return true;
  }
  function digita(el, v) { el.value = v; el.dispatchEvent(new el.ownerDocument.defaultView.Event('input', { bubbles: true })); }
  function envia(form) { form.querySelector('[type=submit]').click(); }
  function texto(el) { return el ? el.textContent.replace(/\s+/g, ' ').trim() : ''; }
  function pedidos(cena, metodo, rota) { return cena.pedidos.filter(function (p) { return p.metodo === metodo && p.rota === rota; }); }
  function doMestre(cena) { return cena.pedidos.filter(function (p) { return p.rota.indexOf('/api/mestre/') === 0; }); }
  async function modal(p, sim) {
    await ate(function () { return !!p.q('.modal'); });
    var m = texto(p.q('.modal'));
    var bt = p.q(sim ? '.modal [data-sim]' : '.modal [data-nao]');
    if (bt) bt.click();
    return m;
  }

  /* ======================================================================
   * o portão
   * ==================================================================== */
  async function cenaFora() {
    var c = { rotas: {} };
    var p = await abre('mestre.html', c);
    await ate(function () { return p.$('ms-portao').getAttribute('data-portao') === 'fora'; });
    await espera(60);
    check('sem sessão: o portão pede para entrar com a conta do Mestre, com o link', /Entre com a conta do Mestre/.test(texto(p.$('ms-portao'))) &&
          !!p.q('#ms-portao a[href="conta.html#entrar"]') && !visivel(p.$('ms-painel')));
    check('sem sessão: nenhum pedido a /api/* (nem /api/eu, nem /api/mestre/*)', !c.pedidos.length, c.pedidos.map(function (x) { return x.rota; }).join(', '));
    check('sem sessão: o link "Mestre" escrito no HTML sai do menu', !p.q('nav a[data-mestre]'));
    check('a página não entra nos buscadores (noindex)', /noindex/.test((p.q('meta[name="robots"]') || {}).content || ''));
  }

  async function cenaNaoMestre() {
    var c = { sessao: { token: 'tok-pia', conta: { id: 7, nome: 'Pia', gm: true } }, rotas: {
      'GET /api/eu': [200, { ok: true, conta: { id: 7, nome: 'Pia', email: 'pia@exemplo.com', criadoEm: AGORA, gm: false } }]
    } };
    var p = await abre('mestre.html', c);
    await ate(function () { return p.$('ms-portao').getAttribute('data-portao') === 'nao-mestre'; });
    await espera(60);
    check('a sessão local diz gm, /api/eu diz que não: "Esta página é só do Mestre do Fundo."',
          /Esta página é só do Mestre do Fundo\./.test(texto(p.$('ms-portao'))) && !visivel(p.$('ms-painel')));
    check('... e nenhum /api/mestre/*', !doMestre(c).length);
    var s = lsSessao();
    check('... a marca local cai (gm:false) e o link some do menu', !!s && s.conta && s.conta.gm === false && !p.q('nav a[data-mestre]'));
  }

  async function cena401() {
    var c = { sessao: MESTRE, rotas: { 'GET /api/eu': [401, { ok: false, erro: 'faça login (token ausente ou vencido)' }] } };
    var p = await abre('mestre.html', c);
    await ate(function () { return p.$('ms-portao').getAttribute('data-portao') === 'fora' && lsSessao() === null; });
    check('401 no /api/eu: a sessão some e o portão pede para entrar de novo', lsSessao() === null && /vencido/.test(texto(p.$('ms-portao'))) &&
          !doMestre(c).length);
  }

  /* ======================================================================
   * o painel
   * ==================================================================== */
  async function cenaMestre() {
    var respostas = [
      function (b) { return [201, { ok: true, presente: presente(51, 'pendente'), semSave: false }]; },
      'fora',
      function (b) { return [201, { ok: true, presente: presente(52, 'pendente'), semSave: false }]; },
      function (b) { return [409, { ok: false, erro: 'já há um pedido dessa classe a caminho' }]; },
      function (b) { return [201, { ok: true, presente: presente(53, 'pendente', { sku: 'presente-vintens', nome: '1.000 vinténs', vintens: 1000 }), semSave: false }]; }
    ];
    var alertasLidos = 0, fichasLidas = 0;
    var c = { sessao: MESTRE, rotas: {
      'GET /api/eu': EU_MESTRE, 'GET /api/saude': SAUDE, 'GET /api/loja/catalogo': CATALOGO_PUBLICO,
      'GET /api/mestre/presentes': [200, { ok: true, agora: AGORA, conta: null, presentes: [presente(50, 'pendente'), presente(48, 'estornado', { motivo: 'classe-ja-liberada', conta: { id: 9, nome: 'Rui' } })] }],
      'GET /api/mestre/alertas': function () {
        alertasLidos++;
        return [200, { ok: true, alertas: [alerta(3, 'estorno', alertasLidos > 1), alerta(2, 'contestacao', true)] }];
      },
      'POST /api/mestre/contas': function (b) {
        return [200, { ok: true, modo: b.q.indexOf('@') >= 0 ? 'email' : 'nome', mais: true, contas: [
          { id: 7, nome: 'Pia', email: 'pi***@exemplo.com', criadoEm: AGORA - 40 * DIA, gm: false, banido: false },
          { id: 9, nome: 'Rui', email: 'ru***@exemplo.com', criadoEm: AGORA - 10 * DIA, gm: false, banido: true },
          { id: 1, nome: 'Dono', email: 'do***@exemplo.com', criadoEm: AGORA - 90 * DIA, gm: true, banido: false }
        ] }];
      },
      'GET /api/mestre/conta': function (b, reg) {
        fichasLidas++;
        if (/[?&]id=9$/.test(reg.url)) {
          return [200, ficha({ conta: { id: 9, nome: 'Rui', email: 'rui@exemplo.com', criadoEm: AGORA - 10 * DIA, gm: false, banido: false, ultimaSessao: null },
                               save: null, saldo: { carteira: 0, reservado: 0, aCaminho: 0, disponivel: 0 }, classes: [], cartas: {},
                               presentes: [], pagamentos: [], alertas: [] })];
        }
        if (/[?&]id=404$/.test(reg.url)) return [404, { ok: false, erro: 'conta não encontrada' }];
        return [200, ficha()];
      },
      'POST /api/mestre/presentear': function (b) { var r = respostas.shift(); return typeof r === 'function' ? r(b) : r; },
      'POST /api/mestre/presente/cancelar': function (b) { return [200, { ok: true, presente: presente(b.id, 'cancelado', { cancelavel: false }) }]; },
      'POST /api/mestre/alerta/visto': function (b) { return [200, { ok: true, alerta: alerta(b.id, 'estorno', true) }]; },
      'POST /api/mestre/pagamento/conferir': function (b) {
        return [200, { ok: true, achados: 1, ignorados: [], pagamento: { id: b.id, pacote: 'pacote-5500', nome: 'Saco de 5.500 vinténs',
          vintens: 5500, centavos: 1990, preco: 'R$ 19,90', estado: 'aprovado', creditado: true, pedido: { id: 90, estado: 'pendente' },
          criadoEm: AGORA - HORA, atualizadoEm: AGORA } }];
      }
    } };
    var p = await abre('mestre.html', c);
    await ate(function () { return visivel(p.$('ms-painel')) && p.qq('#ms-presentes [data-presente]').length === 2 && p.qq('#ms-alertas [data-alerta]').length === 2; });
    check('Mestre: o painel abre (o /api/eu diz gm) e o portão some', visivel(p.$('ms-painel')) && !visivel(p.$('ms-portao')));
    check('Mestre: o menu mantém "Mestre", marcado', !!p.q('nav a[href="mestre.html"][data-mestre][aria-current="page"]'));
    check('Mestre: as rotas do painel com o token no cabeçalho', doMestre(c).every(function (x) { return x.auth === 'Bearer tok-mestre'; }) &&
          pedidos(c, 'GET', '/api/mestre/presentes').length === 1 && pedidos(c, 'GET', '/api/mestre/alertas').length === 1);
    // os últimos presentes
    var l50 = p.q('#ms-presentes [data-presente="50"]'), l48 = p.q('#ms-presentes [data-presente="48"]');
    check('últimos presentes: estado em português, quem deu, para quem (botão que abre a ficha)',
          /esperando o jogo abrir/.test(texto(l50)) && /dado por Dono/.test(texto(l50)) && !!l50.querySelector('[data-abrir="7"]') &&
          /devolvido: a classe já estava liberada no jogo/.test(texto(l48)));
    check('cancelar só onde o servidor diz cancelavel', !!l50.querySelector('[data-cancelar="50"]') && !l48.querySelector('[data-cancelar]'));
    // os alertas
    var a3 = p.q('#ms-alertas [data-alerta="3"]'), a2 = p.q('#ms-alertas [data-alerta="2"]');
    check('alertas: o tipo em português, a conta e os dados; "marcar como visto" só no aberto',
          /Estorno: o dinheiro voltou ao comprador/.test(texto(a3)) && /vinténs: 5\.500/.test(texto(a3)) && !!a3.querySelector('[data-alerta-visto="3"]') &&
          /Contestação no cartão/.test(texto(a2)) && !a2.querySelector('[data-alerta-visto]') && /visto .* por Dono/.test(texto(a2)), texto(a3));
    check('alertas: a contagem dos abertos', /1 aberto/.test(texto(p.$('ms-alertas-total'))), texto(p.$('ms-alertas-total')));
    a3.querySelector('[data-alerta-visto="3"]').click();
    await ate(function () { return pedidos(c, 'POST', '/api/mestre/alerta/visto').length === 1 && alertasLidos === 2; });
    var pv = pedidos(c, 'POST', '/api/mestre/alerta/visto')[0];
    check('"visto": POST /api/mestre/alerta/visto {id}, e a lista relida', !!pv && pv.corpo.id === 3 && Object.keys(pv.corpo).length === 1 &&
          alertasLidos === 2);
    await ate(function () { return !p.q('#ms-alertas [data-alerta-visto]'); });
    check('depois do "visto", nenhum alerta aberto na lista', !p.q('#ms-alertas [data-alerta-visto]') && /nenhum aberto/.test(texto(p.$('ms-alertas-total'))));

    // a busca
    digita(p.$('ms-q'), 'ab');
    envia(p.$('ms-busca'));
    await espera(40);
    check('busca curta ("ab") não chama o servidor e diz como buscar', !pedidos(c, 'POST', '/api/mestre/contas').length &&
          /3 letras ou mais do nome, pelo e-mail inteiro ou pelo #número da conta/.test(texto(p.$('ms-aviso'))));
    digita(p.$('ms-q'), 'ana');
    envia(p.$('ms-busca'));
    await ate(function () { return p.qq('#ms-resultados [data-conta]').length === 3; });
    var b1 = pedidos(c, 'POST', '/api/mestre/contas')[0];
    check('busca: POST /api/mestre/contas com {q} só no corpo', !!b1 && b1.corpo.q === 'ana' && Object.keys(b1.corpo).length === 1 &&
          !/[?#]/.test(b1.url.replace(/^[a-z]+:\/\/[^/]*/i, '')));

  }
