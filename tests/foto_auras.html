<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>foto: as auras na praça</title>
<style>html,body{margin:0;height:100%;background:#0f1216}iframe{width:100%;height:100%;border:0}</style>
</head>
<body>
<!-- PÁGINA DE FOTO (08/10): as auras lado a lado na praça, do jeito que o jogador as vê — para olhar
     as formas antes de julgar (`?auras=sombra,gelo,ouro,neutra`, `?dist=`, `?tilt=`, `?t=` segundos de
     animação antes da foto; `?titulos=` e `?molduras=` dão a plaquinha de cada um, na ordem). O boot é o de tests/auras_formas.html. -->
<iframe id="tela"></iframe>
<script>
(function () {
  'use strict';
  var Q = {};
  location.search.replace(/[?&]([^=&]+)=([^&]*)/g, function (_, k, v) { Q[k] = decodeURIComponent(v); });
  var CORES = (Q.auras || 'sombra,gelo,ouro,neutra').split(',');
  var TIT = (Q.titulos || '').split(','), MOL = (Q.molduras || '').split(',');   // `?titulos=Top 1 Pvp,…&molduras=ouro,…`: a plaquinha de cada um
  var NOME = { fogo: 'Brasa', agua: 'Maré', terra: 'Raiz', ar: 'Vento', neutra: 'Lousa', sombra: 'Sombra', gelo: 'Geada', ouro: 'Dourada', mestre: 'Mestre' };
  var quadro = document.getElementById('tela');
  quadro.src = '../index.html?sandbox=1&snap=1&graficos=alta&foto-auras';
  var J, U, H, R, t0 = Date.now();
  (function espera() {
    var pronto = false;
    try {
      J = quadro.contentWindow.JOGO;
      pronto = !!(J && J.Models3D2 && J.Models3D2.isReady() && J.Renderer && J.Renderer.isReady() && J.UI && J.Hub && J.Rede && J.DB);
    } catch (e) {}
    if (!pronto) {
      if (Date.now() - t0 > 110000) { document.title = 'ERRO sem jogo'; window.__pronto = true; return; }
      return setTimeout(espera, 250);
    }
    U = J.UI; H = J.Hub; R = J.Rede;
    try {
      var suf = (J.Contas && J.Contas.sufixo) ? J.Contas.sufixo() : '';
      quadro.contentWindow.localStorage.setItem('soterra-tutor-v1' + suf, JSON.stringify({ vistos: {}, off: true }));
    } catch (e) {}
    var P = J.Progress;
    var ids = P.heroIds().filter(function (h) { return h !== 'gm'; });
    U.selection(ids.slice(0, 1));
    R.entrar = function () { return true; };
    R.pares = function () { return []; };
    R.mover = function () {};
    J.Loja.auraEscolhida = function () { return null; };
    J.DB.batizar('Fotógrafo').then(function () {
      U.showScreen('hub');
      var v = 0;
      (function praca() {
        var e = null;
        try { e = H._estado(); } catch (e1) {}
        if (!(e && e.pos) && ++v < 120) return setTimeout(praca, 250);
        var hp = e.pos;
        H.aura(false);
        CORES.forEach(function (cor, i) {
          var id = 'a' + i;
          H.fantasmaEntra(id, { id: id, nome: NOME[cor] || cor, titulo: TIT[i] || '', moldura: MOL[i] || 'auto', classe: 'sumo', sala: null, aura: false,
                                auraCor: R._corAura(cor), x: hp.x + (i - (CORES.length - 1) / 2) * 3.2, z: hp.z - 3 });
        });
        try { H._cam({ dist: Number(Q.dist) || 11, tilt: Number(Q.tilt) || 0.55 }); } catch (e2) {}
        setTimeout(function () { document.title = 'AURAS ' + CORES.join(','); window.__pronto = true; }, (Number(Q.t) || 3) * 1000);
      })();
    });
  })();
})();
</script>
</body>
</html>
