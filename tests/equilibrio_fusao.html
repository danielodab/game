<style>
  body{margin:0;background:#0b0d10;color:#e8eef6;font:13px/1.6 system-ui,Segoe UI,sans-serif;padding:18px}
  h1{font-size:17px;margin:0 0 2px}
  .sub{color:#8895a6;font-size:12px;margin-bottom:14px}

  .ok{background:#143d1e;color:#7fe08a}

<body>
<h1>Equilíbrio da fusão</h1>
<div class="sub">Dano máximo de UM turno, gastando o PA como quiser, contra alvo de vida infinita.
A fusão precisa ficar dentro da faixa de ±20% dos dois heróis separados — nem muito pior (ninguém funde), nem muito melhor (todo mundo funde sempre).</div>
<div id="summary">medindo…</div>
<div id="saida"></div>

<script src="save_sandbox.js"></script>
<script>
  window.__V = '?v=' + Date.now();
  var arqs = ['js/core/data/elements.js','js/core/data/classes.js','js/core/data/spells.js',
    'js/core/data/progression.js','js/core/data/monsters.js','js/core/data/dungeons.js',
    'js/core/data/fusions.js','js/core/data/pets.js','js/core/data/items.js','js/core/data/items_extra.js',
    'js/core/engine.js','js/core/fusion.js','js/core/ai.js','js/core/progress.js'];
  for (var i=0;i<arqs.length;i++) document.write('<scr'+'ipt src="../'+arqs[i]+window.__V+'"></scr'+'ipt>');
</script>

<script>
(function () {
  'use strict';
  // ±20%. Por que nao ±12%: depois de convergir o ajuste por dupla, a media
  // ficou em 100% e a dispersao que sobrou vem de a fusao ESCALAR diferente com
  // o nivel em algumas duplas (baixa no 12, alta no 30). Isso e progressao, nao
  // desequilibrio. E 20% de dano nao decide a escolha sozinho: fundir tambem da
  // +50 de escudo e vida concentrada, e carrega o risco de que morrer encerra a
  // batalha. A regua existe para pegar REGRESSAO — se algo voltar a 40% ou 160%,
  // o equilibrio quebrou de verdade.
  var TOLERANCIA = 0.20;
  var NIVEIS = [12, 30];

  // EXCECOES CONHECIDAS E ACEITAS. Estas duas duplas fundem MAL cedo e BEM
  // tarde (sumo+invocador 75% no nv12 e 123% no nv30; bruxo+curandeiro 70% e
  // 131%). O coeficiente por dupla centra a media mas nao achata a inclinacao,
  // porque o que cresce nelas nao e o fator de poder e sim as formas de tier 20
  // e 30, que nessas duas sao desproporcionalmente fortes em relacao as de
  // baixo. Isso e uma historia de progressao defensavel — "esta dupla melhora
  // de fundir conforme sobe" — e nao desequilibrio. Ficam anotadas para que o
  // teste continue reprovando REGRESSAO nova em vez de reprovar sempre.
  // sumo+espadachim entrou na lista em v2.7, pelo mesmo motivo das outras duas:
  // fica em 120% num nivel e 80% no outro, media exatamente 100%. Um coeficiente
  // unico centra a media mas nao achata a inclinacao. Ela apareceu aqui quando
  // sete feiticos do sumo, ate entao IMPOSSIVEIS de conjurar, voltaram a
  // funcionar e o dano dele separado subiu.
  //
  // v3: a lista deixou de ser um interruptor. Marcar uma dupla como "aceita"
  // desligava a checagem dela para sempre — se ela piorasse depois, ninguem
  // ficava sabendo. Agora cada excecao declara um ORCAMENTO DE INCLINACAO: de
  // quantos pontos percentuais o valor de fundir pode mudar entre o nivel 12 e
  // o 30. A dupla passa se (a) a inclinacao couber no orcamento declarado e
  // (b) o CENTRO — a media geometrica dos dois niveis — estiver dentro dos
  // mesmos ±20%. Assim continua sendo excecao, mas com teto: apertar o
  // orcamento cobra o conserto, e estourar o teto reprova de novo.
  // O que a coluna de inclinacao denuncia: o INVOCADOR aparece nas quatro
  // piores duplas (132, 98, 94 e 70 pontos). Nao e coincidencia de ajuste — o
  // kit de classe dele cresce muito mais do 12 ao 30 (invocacoes melhores, mais
  // delas) do que as formas de fusao dele crescem. Enquanto isso as seis duplas
  // do Minotauro ficam entre 2 e 25 pontos. A divida tem nome e endereco: sao
  // as formas de tier 20 e 30 das duplas com invocador que precisam subir.
  var ACEITAS = {
    'espadachim+invocador': 126,
    'invocador+sumo':       95,
    'bruxo+invocador':      78,
    'arqueiro+invocador':   68,
    'arqueiro+espadachim':  59,
    'bruxo+espadachim':     54,
    'arqueiro+bruxo':       47,
    'curandeiro+invocador': 43,
    'arqueiro+sumo':        42,
    // Esta fica exatamente na borda: centro em 100% e inclinacao de 37 pontos,
    // o que poe os dois niveis em 118,5% e 81,5%. Qualquer assimetria de meio
    // ponto joga um deles para 120,4% e a dupla passava a reprovar num run e
    // passar no outro. O teto declarado nao afrouxa nada — a dupla continua
    // sendo cobrada no centro — mas para o pisca-pisca.
    'arqueiro+curandeiro':  41
  };

  // A chave de leitura tem de ser ALFABETICA, e nao a ordem em que as classes
  // aparecem em `DATA.classes`. Escrita como `CLS[i]+'+'+CLS[j]`, ela dava
  // 'sumo+arqueiro' num lugar e 'arqueiro+sumo' no outro, e metade dos
  // orcamentos declarados nunca era encontrada — a dupla reprovava com o teto
  // dela escrito logo acima, sem ninguem ver.
  function orcamentoDe(a, b) {
    var k = [a, b].sort().join('+');
    return ACEITAS[k] || ACEITAS[a + '+' + b] || ACEITAS[b + '+' + a] || 0;
  }

  var P, E, F, D, CLS;
  var ELEMS = ['fogo', 'agua', 'terra', 'ar'];

  // Instantâneo/restauração: feitiços de invocação criam unidades, então o
  // tamanho do vetor muda e restaurar item a item não basta.
  //
  // O instantâneo precisa levar TAMBEM `effects`, as recargas e a semente:
  //  - `effects` guarda marcas e quebras de resistencia, e `Engine.markMultiplier`
  //    /`effResist` leem dali. Sem restaurar, cada feitico testado deixava a marca
  //    dele no inimigo e o SEGUINTE batia mais forte — a medicao virava "melhor
  //    feitico depois de empilhar tudo o que veio antes". Media do curandeiro+sumo
  //    dava 264 numa ordem e 335 na ordem invertida, 27% so de ordem.
  //  - `_rng` e a semente do sorteio de dano (mulberry32). Sem restaurar, cada
  //    feitico rolava um numero diferente e o "melhor de N" premiava sorte.
  // Com os tres restaurados, cada feitico e medido do MESMO estado limpo.
  function copiaObj(o) {
    var c = {};
    for (var k in o) if (Object.prototype.hasOwnProperty.call(o, k)) c[k] = o[k];
    return c;
  }
  function copiaEfeitos(list) {
    return (list || []).map(copiaObj);
  }
  // O TABULEIRO TAMBEM TEM DE VOLTAR.
  //
  // `salva` guardava so as unidades, e isso bastou enquanto nenhum feitico
  // mexia no CHAO. O verbo do Minotauro mexe: cada muro erguido durante uma
  // sondagem virava pedra para sempre, porque nada desfazia a celula. Depois de
  // meia duzia de sondagens a fusao estava emparedada dentro do proprio banco —
  // `melhorAlvo` nao achava mais nenhuma casa com visao para inimigo e a dupla
  // marcava ZERO. Nao por ser fraca: por ter murado a si mesma.
  // Armadilhas tinham o mesmo vicio, calado: ficavam armadas de uma sondagem
  // para a seguinte e estouravam no meio de outra medicao, creditando dano a
  // quem nao o fez.
  function copiaMuros(lista) {
    return (lista || []).map(function (m) {
      return { x: m.x, y: m.y, antes: m.antes, deco: m.deco,
               ownerUid: m.ownerUid, side: m.side, remaining: m.remaining };
    });
  }
  function pinta(st, m, erguido) {
    var lin = st.grid.tiles[m.y];
    if (!lin || !lin[m.x]) return;
    var cel = lin[m.x];
    if (erguido) { cel.type = 'wall'; cel.deco = false; cel.invocado = true; }
    else { cel.type = m.antes; cel.deco = m.deco; cel.invocado = false; }
  }

  function salva(st) {
    return { n: st.units.length, rng: st._rng,
             w: copiaMuros(st.walls), t: (st.traps || []).slice(),
             d: st.units.map(function (u) {
               return [u.hp, u.shield, u.x, u.y, u.alive, u.pa, u.pp,
                       copiaEfeitos(u.effects), copiaObj(u.cooldowns), copiaObj(u.castsThisTurn)];
             }) };
  }
  function volta(st, s) {
    st.units.length = s.n;
    st._rng = s.rng;
    var i;
    for (i = 0; i < (st.walls || []).length; i++) pinta(st, st.walls[i], false);
    st.walls = copiaMuros(s.w);
    for (i = 0; i < st.walls.length; i++) pinta(st, st.walls[i], true);
    st.traps = (s.t || []).slice();
    st.units.forEach(function (u, k) {
      var r = s.d[k]; if (!r) return;
      u.hp = r[0]; u.shield = r[1]; u.x = r[2]; u.y = r[3];
      u.alive = r[4]; u.pa = r[5]; u.pp = r[6];
      u.effects = copiaEfeitos(r[7]);
      u.cooldowns = copiaObj(r[8]);
      u.castsThisTurn = copiaObj(r[9]);
    });
  }
  // ONDE MIRAR. Desde que feitico de area passou a mirar o CHAO, `castTargets`
  // devolve TODA celula do alcance, e nao so as ocupadas por inimigo. Pegar
  // `alvos[0]` — o primeiro da varredura, isto e, o canto superior-esquerdo do
  // alcance — virou medir o feitico jogado no vazio: o bruxo de nivel 12 mirava
  // (3,3) com o inimigo em (6,6) e marcava ZERO com os tres feiticos de area.
  // A regra do teste e "dano MAXIMO de um turno", entao a celula escolhida e a
  // que atinge MAIS inimigos. Sem falloff no motor (toda unidade na area leva o
  // dano cheio), contar inimigos cobertos maximiza o dano de fato — e e assim
  // que a area bem posicionada, pegando dois de uma vez, ganha o credito dela.
  // Para feitico de alvo unico `aoeTiles` devolve so a propria celula, entao
  // isto reproduz exatamente o criterio antigo: precisa ter inimigo em cima.
  function casasInimigas(st) {          // mapa "x,y" -> 1, para nao varrer units
    var m = {};
    for (var i = 0; i < st.units.length; i++) {
      var u = st.units[i];
      if (u.side === 'enemy' && u.alive && !u.offBoard) m[u.x + ',' + u.y] = 1;
    }
    return m;
  }
  function casasAliadas(st) {
    var m = {};
    for (var i = 0; i < st.units.length; i++) {
      var u = st.units[i];
      if (u.side === 'player' && u.alive && !u.offBoard) m[u.x + ',' + u.y] = 1;
    }
    return m;
  }

  // AS CASAS QUE VALE A PENA TENTAR.
  //
  // A versao antiga escolhia a casa que cobria mais INIMIGOS, e so. Isso e a
  // pergunta certa para um feitico de dano e a pergunta errada para um de cura
  // ou escudo: a casa boa de um feitico de apoio e onde estao os ALIADOS, e a
  // funcao devolvia `null` para todos eles — o banco simplesmente nao via nada
  // que a metade curandeira ou a metade minotauro sabiam fazer. Agora devolve
  // ate tres casas: a que cobre mais inimigos, a que cobre mais aliados, e a
  // casa vazia mais proxima (onde muro e invocacao se plantam). Quem decide
  // entre elas e a medicao, nao o palpite.
  function candidatas(st, u, sid, alvos) {
    if (!alvos.length) return [];
    var inim = casasInimigas(st), ali = casasAliadas(st);
    var cInim = null, nInim = 0, cAli = null, nAli = 0, cVazia = null, dVazia = 1e9;
    for (var i = 0; i < alvos.length; i++) {
      var c = alvos[i];
      var tiles = E.aoeTiles(st, sid, u.x, u.y, c.x, c.y) || [];
      var a = 0, b = 0;
      for (var t = 0; t < tiles.length; t++) {
        var k = tiles[t].x + ',' + tiles[t].y;
        if (inim[k]) a++;
        if (ali[k]) b++;
      }
      if (a > nInim) { nInim = a; cInim = c; }
      if (b > nAli) { nAli = b; cAli = c; }
      if (!a && !b) {
        var dist = Math.abs(c.x - u.x) + Math.abs(c.y - u.y);
        if (dist < dVazia) { dVazia = dist; cVazia = c; }
      }
    }
    var out = [];
    if (cInim) out.push(cInim);
    if (cAli && cAli !== cInim) out.push(cAli);
    if (cVazia) out.push(cVazia);
    return out;
  }

  // MELHOR DANO DE UM TURNO, GASTANDO O PA COMO QUISER.
  //
  // A versao antiga escolhia UM feitico e o repetia ate acabar o PA. So que 92
  // das 106 formas de fusao — e a maioria dos feiticos de classe — trazem
  // `castsPerTurn: 1`: o laco conjurava UMA vez e parava, deixando o resto do PA
  // na mesa. Isso apagava exatamente a vantagem da fusao, que e ter `BONUS_PA`
  // (+4): ela ficava com 10 PA e gastava 4, enquanto um sumo com 6 PA gastava os
  // 6 em dois golpes de 3. Medir "melhor feitico repetido" nao e o que o
  // subtitulo desta pagina promete, e penalizava um lado so.
  //
  // Agora o turno e montado de verdade: a cada passo escolhe-se a conjuracao
  // disponivel (PA, recarga e limite por turno ja checados por `castTargets`)
  // que rende mais, e segue-se ate o PA nao dar mais para nada.
  // Duas gulosas rodam e vale a melhor: uma por DANO do golpe, outra por dano
  // POR PA. Sozinha, a primeira gasta 6 PA num estouro de 177 quando dois
  // golpes de 3 PA fariam 266; a segunda cobre esse caso. Vale para os dois
  // lados, sem favorecer nenhum.
  function turnoGuloso(st, u, base, porPA) {
    volta(st, base);
    var total = 0, g = 0;
    while (u.pa > 0 && g++ < 12) {
      var marco = salva(st);
      var melhorNota = 0, melhorDano = 0, melhorSid = null, melhorC = null;
      var sids = (u.spells || []);
      for (var i = 0; i < sids.length; i++) {
        var cs = candidatas(st, u, sids[i], E.castTargets(st, u.uid, sids[i]));
        for (var ci = 0; ci < cs.length; ci++) {
          var alvo = cs[ci];
          var paAntes = u.pa, antes = valor(st);
          if (!E.cast(st, u.uid, sids[i], alvo.x, alvo.y)) { volta(st, marco); continue; }
          var d = valor(st) - antes;
          var gasto = Math.max(1, paAntes - u.pa);
          volta(st, marco);
          var nota = porPA ? (d / gasto) : d;
          if (nota > melhorNota) { melhorNota = nota; melhorDano = d; melhorSid = sids[i]; melhorC = alvo; }
        }
      }
      if (!melhorSid || melhorDano <= 0) break;
      var a0 = valor(st);
      if (!E.cast(st, u.uid, melhorSid, melhorC.x, melhorC.y)) break;
      total += valor(st) - a0;
    }
    volta(st, base);
    return total;
  }
  function danoNoTurno(st, u, base) {
    return Math.max(turnoGuloso(st, u, base, false), turnoGuloso(st, u, base, true));
  }
  // VALOR DE UM TURNO — nao so dano.
  //
  // Duas das sete classes agora existem para NAO ferir: o Minotauro poe muro e
  // escudo, o Curandeiro devolve vida. Medir so o estrago do inimigo era medir
  // metade do jogo, e as duplas de apoio marcavam 16% e 40% — nao por serem
  // fracas, por serem invisiveis para a regua. Um ponto de vida devolvido a um
  // aliado vale o mesmo que um ponto tirado de um inimigo: os dois adiam a
  // mesma morte. Escudo entra pelo mesmo motivo. A regua e a MESMA nos dois
  // lados da comparacao, entao nenhum lado ganha de graca.
  function valor(st) {
    var v = 0;
    for (var i = 0; i < st.units.length; i++) {
      var u = st.units[i];
      if (!u.alive || u.offBoard) continue;
      if (u.side === 'enemy') { v -= (u.hp || 0); continue; }
      // Invocacao e bicho de estimacao NAO entram. Chamar um golem de 200 de
      // vida creditava 200 pontos de valor no instante da conjuracao, como se
      // fosse cura — e o invocador aparecia em quatro das oito duplas fora da
      // faixa por isso. Um corpo novo no tabuleiro e promessa, nao entrega: o
      // que ele valer aparece nos turnos seguintes, batendo ou apanhando no
      // lugar de alguem, e este banco mede UM turno.
      if (u.kind === 'summon' || u.kind === 'pet') continue;
      v += (u.hp || 0) + (u.shield || 0);
    }
    return v;
  }
  // Cura so vale se houver ferida para fechar. Com o time cheio, todo feitico
  // de cura marcaria zero e o Curandeiro voltaria a ser invisivel — entao o
  // banco parte de meia vida, dos DOIS lados da comparacao.
  function meiaVida(st) {
    st.units.forEach(function (u) {
      if (u.side === 'player') { u.hp = Math.max(1, Math.floor(u.hpMax / 2)); u.shield = 0; }
    });
  }
  function vidaInimiga(st) {
    return st.units.filter(function (x) { return x.side === 'enemy'; })
                   .reduce(function (s, x) { return s + x.hp; }, 0);
  }
  function prepara(nivel) {
    P.reset();
    CLS.forEach(function (c) { try { P.unlockClass(c); } catch (e) {} });
    CLS.forEach(function (c, k) {
      var h = P.hero(c);
      if (h) { h.level = nivel; h.element = ELEMS[k % 4]; }
    });
  }
  function alvoInfinito(st) {
    st.units.filter(function (u) { return u.side === 'enemy'; })
            .forEach(function (m) { m.hp = 999999; m.hpMax = 999999; });
  }

  function medirDupla(a, b, nivel) {
    prepara(nivel);
    // --- separados: os dois colados no mesmo inimigo, NAS DUAS ORDENS.
    // As duas casas vizinhas do inimigo nao valem o mesmo: a de baixo tem a
    // visao cortada pelo canto de parede (ver montaFusao). Fixar "a embaixo, b
    // em cima" fazia a nota depender da ordem de `Object.keys(DATA.classes)` —
    // e o invocador, por ser o ultimo da lista, caia SEMPRE na casa boa, de onde
    // o circle:3 dele pega dois inimigos. Um jogador poe cada heroi onde rende
    // mais, entao vale a melhor das duas colocacoes. E o mesmo criterio usado do
    // lado da fusao: melhor jogada com dois corpos contra melhor jogada com um.
    var st1 = E.createBattle('greenhouse', 0, P.battleParty([a, b]));
    var i1 = st1.units.filter(function (u) { return u.side === 'enemy'; })[0];
    var h1 = st1.units.filter(function (u) { return u.side === 'player'; });
    var casa0 = { x: i1.x - 1, y: i1.y }, casa1 = { x: i1.x, y: i1.y - 1 };
    alvoInfinito(st1); meiaVida(st1);
    function somaEm(u0, c0, u1, c1) {
      u0.x = c0.x; u0.y = c0.y; u1.x = c1.x; u1.y = c1.y;
      var base = salva(st1);
      return danoNoTurno(st1, u0, base) + danoNoTurno(st1, u1, base);
    }
    var sep = Math.max(somaEm(h1[0], casa0, h1[1], casa1),
                       somaEm(h1[0], casa1, h1[1], casa0));

    // --- fundidos, NAS DUAS CASAS que o par separado ocupou.
    // A fusao ocupa a celula de A, e quem declara e escolha do jogador — as duas
    // casas sao legitimas. Prender a fusao sempre na de baixo dava a ela o pior
    // casco do banco: ha parede em (5,7) e (6,7), e dali a visao para (7,7),
    // (7,8) e (7,9) esta BLOQUEADA, enquanto da casa de cima nao esta. O
    // `circle:3` do invocador so encontra a celula que pega DOIS inimigos a
    // partir da casa de cima; a fusao, presa embaixo, nunca podia responder.
    // Isso e um canto de parede, nao uma propriedade de fundir — e o par
    // separado, ocupando as duas casas, sempre ficava com a boa. Mede-se nas
    // duas e vale a melhor.
    var m2 = montaFusao(a, b, nivel, i1.x - 1, i1.y);
    var m3 = montaFusao(a, b, nivel, i1.x, i1.y - 1);
    var fus = Math.max(m2.dano, m3.dano);

    return { sep: sep, fus: fus, paSep: h1[0].paMax + h1[1].paMax,
             paFus: Math.max(m2.pa, m3.pa) };
  }

  // Vizinha ortogonal que serve de casa para B: precisa ser chao e estar livre.
  // (A versao antiga plantava B em `A.y + 1`, que neste banco e PAREDE.)
  function vizinhaLivre(st, x, y, ignoraUid) {
    var d = [[0, 1], [1, 0], [0, -1], [-1, 0]];
    for (var i = 0; i < d.length; i++) {
      var nx = x + d[i][0], ny = y + d[i][1];
      var linha = st.grid.tiles[ny];
      if (!linha || !linha[nx] || linha[nx].type === 'wall') continue;
      var o = E.unitAt(st, nx, ny);
      if (o && o.uid !== ignoraUid) continue;
      return { x: nx, y: ny };
    }
    return null;
  }

  function montaFusao(a, b, nivel, cx, cy) {
    prepara(nivel);
    var st = E.createBattle('greenhouse', 0, P.battleParty([a, b]));
    var h = st.units.filter(function (u) { return u.side === 'player'; });
    h[0].x = cx; h[0].y = cy;
    var viz = vizinhaLivre(st, cx, cy, h[1].uid);
    if (!viz) return { dano: 0, pa: 0 };
    h[1].x = viz.x; h[1].y = viz.y;
    if (!F.declare(st, h[0].uid, h[1].uid) || !F.resolve(st)) return { dano: 0, pa: 0 };
    var f = st.units.filter(function (u) { return u.kind === 'fusion'; })[0];
    if (!f) return { dano: 0, pa: 0 };
    // TURNO CHEIO DOS DOIS LADOS. `declare` cobra 2 PA de A e `doFuse` nao
    // reenche o medidor — a fusao nascia com os 4 PA que sobraram de A e era
    // medida assim, contra dois herois com 6+6=12 PA inteiros. A tabela abaixo
    // ainda anunciava "10 de 12", ou seja, o relatorio prometia um orcamento que
    // a medicao nunca deu. Era o defeito que mais pesava: a fusao mostrava 40%
    // do PA dela, e os coeficientes de PAIR_TUNE vinham inflados para tapar isso.
    // `fusion.js` ja diz a regra ("o turno seguinte ja nasce cheio"); o que se
    // compara aqui e turno cheio contra turno cheio, e o custo de 2 PA da
    // declaracao e uma despesa unica, de um turno so, fora dessa conta.
    f.pa = f.paMax; f.pp = f.ppMax;
    alvoInfinito(st); meiaVida(st);
    var base = salva(st);
    return { dano: danoNoTurno(st, f, base), pa: f.paMax };
  }

  window.addEventListener('DOMContentLoaded', function () {
    P = JOGO.Progress; E = JOGO.Engine; F = JOGO.Fusion; D = JOGO.DATA;
    CLS = Object.keys(D.classes);
    var html = '', total = 0, fora = 0;

    // Mede TUDO primeiro: o veredito de uma dupla depende dos dois niveis
    // dela (a inclinacao), e nao da para julgar o nivel 12 sem conhecer o 30.
    var medidas = {};
    NIVEIS.forEach(function (nivel) {
      for (var i = 0; i < CLS.length; i++) {
        for (var j = i + 1; j < CLS.length; j++) {
          var chave = CLS[i] + '+' + CLS[j];
          var m = medirDupla(CLS[i], CLS[j], nivel);
          (medidas[chave] || (medidas[chave] = {}))[nivel] = m;
        }
      }
    });

    function razaoDe(m) { return m && m.sep > 0 ? m.fus / m.sep : 0; }
    function inclinacaoDe(ch) {
      var rs = NIVEIS.map(function (n) { return razaoDe(medidas[ch][n]); });
      return Math.round(Math.abs(rs[0] - rs[rs.length - 1]) * 100);
    }
    function centroDe(ch) {
      var soma = 0, n = 0;
      NIVEIS.forEach(function (nv) {
        var r = razaoDe(medidas[ch][nv]);
        if (r > 0) { soma += Math.log(r); n++; }
      });
      return n ? Math.exp(soma / n) : 0;
    }

    NIVEIS.forEach(function (nivel) {
      html += '<h2>Nível ' + nivel + '</h2><table><tr><th class="k">dupla</th>' +
        '<th>separados</th><th>fundidos</th><th>razão</th><th>PA</th>' +
        '<th>incl.</th><th>veredito</th></tr>';
      for (var i = 0; i < CLS.length; i++) {
        for (var j = i + 1; j < CLS.length; j++) {
          var chave = CLS[i] + '+' + CLS[j];
          var m = medidas[chave][nivel];
          total++;
          var razao = razaoDe(m);
          var dentro = Math.abs(razao - 1) <= TOLERANCIA;
          var orcamento = orcamentoDe(CLS[i], CLS[j]);
          var incl = inclinacaoDe(chave);
          var centro = centroDe(chave);
          // A excecao so vale se a inclinacao couber no orcamento DECLARADO e o
          // centro estiver na mesma faixa que se cobra de todo mundo.
          var aceita = !dentro && orcamento > 0 && incl <= orcamento &&
                       Math.abs(centro - 1) <= TOLERANCIA;
          if (!dentro && !aceita) fora++;
          var motivo = dentro ? 'ok'
            : aceita ? ('inclinação aceita (teto ' + orcamento + ')')
            : (orcamento > 0 && incl > orcamento) ? ('inclinação ' + incl + ' > teto ' + orcamento)
            : (orcamento > 0 && Math.abs(centro - 1) > TOLERANCIA)
              ? ('centro ' + Math.round(centro * 100) + '% fora')
            : (razao < 1 ? 'fundir perde' : 'fundir domina');
          html += '<tr class="' + (dentro ? 'dentro' : (aceita ? '' : 'fora')) + '">' +
            '<td class="k">' + CLS[i] + ' + ' + CLS[j] + '</td>' +
            '<td>' + m.sep + '</td><td>' + m.fus + '</td>' +
            '<td>' + (razao * 100).toFixed(0) + '%</td>' +
            '<td>' + m.paFus + ' de ' + m.paSep + '</td>' +
            '<td>' + incl + '</td>' +
            '<td>' + motivo + '</td></tr>';
        }
      }
      html += '</table>';
    });

    P.reset();
    var s = document.getElementById('summary');
    s.className = fora === 0 ? 'ok' : 'bad';
    s.textContent = (fora === 0 ? 'TUDO PASSOU' : 'FALHOU') +
      ' — ' + (total - fora) + ' de ' + total + ' duplas dentro da faixa de ±' +
      Math.round(TOLERANCIA * 100) + '%' + (fora ? ' · ' + fora + ' fora' : '');
    document.getElementById('saida').innerHTML = html;
    window.TEST_RESULTS = { passed: total - fora, failed: fora };
    window.__pronto = true;
  });
})();
</script>
