<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>prova: o Salão da Sede tático (a guerra de guilda)</title>
<style>
  html,body{margin:0;height:100%;background:#0f1216;color:#e8eef6;font:12px/1.5 system-ui,Segoe UI,sans-serif;overflow:hidden}
  iframe{position:fixed;left:0;top:0;width:100%;height:100%;border:0}
  #saida{position:fixed;left:8px;bottom:8px;max-width:600px;max-height:46%;overflow:auto;
         background:rgba(11,13,16,.88);border:1px solid #2b3542;border-radius:6px;padding:6px 8px;font:11px/1.45 monospace}
  #summary{padding:4px 8px;border-radius:5px;background:#1b222c;margin-bottom:4px}
  .allpass{background:#16241b !important;color:#7fe08a !important} .fail{background:#3d1414 !important;color:#f77 !important}
  .p{color:#7fe08a}.f{color:#ff8a7a}
  body.foto #saida{display:none}
</style>
</head>
<body>
<!-- O SALÃO DA SEDE TÁTICO (15/09, dono: "a guerra de guild que é 2x2 de cada guild é na
     sede de guild"). Abre o jogo de verdade, monta Engine.createDuelSala('sede', 0, …) com
     QUATRO heróis de cada lado (dois jogadores por guilda, cada um com a dupla — `dono`) no
     renderizador de verdade e cobra pelo relatório da montagem (Renderer.ultimaMontagemSede):
     cada papel das `pecas` entrou quantas vezes o mapa diz, nenhuma casa '#' ou '=' ficou sem
     peça, o contorno inteiro virou parede, as peças altas são altas e as baixas são baixas, as
     lareiras têm fogo e luz (e o fogo MEXE), a parede do lado da câmera corta e volta quando a
     câmera gira, e da câmera padrão nenhum dos oito heróis fica atrás do cenário.
       19/09 (o dono: "melhore o mapa e deixe bem estratégico" — o mapa virou "A Arena do Trono"):
     a RÉGUA TÁTICA refeita no motor DENTRO da página, lendo o layout que o jogo carregou — nenhum
     par nascimento×nascimento com visão (Engine.los nos dois sentidos), nenhuma reta acima de 9
     (visão e corredor), todo chão alcançável, fluxo ≥ 5 entre os lados, obstáculo 14–24%, as duplas
     adjacentes nos dois lados, cobertura a 2 de cada nascimento, o espelho — e a ROBUSTEZ A MURO
     INVOCADO, com TODOS os muros do jogo (DATA.spells E as formas de fusão por Fusion.spellsFor, as
     casas pelo Engine.aoeTiles): nenhuma conjuração de nível < 30 derruba o fluxo abaixo de 3, só o
     círculo r3 de nível 30 sela sozinho, NENHUM par de nível ≤ 10 sela um lado — varredura inteira
     dos pares, não amostra — e todo par que sela leva um anel r2, uma cruz 2 ou um círculo r3, como
     o cabeçalho do mapa documenta. E a CÂMERA PADRÃO: raio a todo o chão em três alturas — nenhuma
     casa com a cabeça tapada, nascimentos e primeiro passo inteiros à vista, as tapadas até o peito
     listadas. Se o mapa mudar, esta prova cobra de novo.
       ?foto=1        esconde o painel e não gira a câmera (para a foto)
     window.__vista('padrao' | 'cima' | 'lado') enquadra a foto. -->
<iframe id="tela" src="../index.html?sandbox=1"></iframe>
<div id="saida"><div id="summary">abrindo o jogo…</div><div id="linhas"></div></div>
<script>
(function () {
  var FOTO = /[?&]foto=1/.test(location.search);
  if (FOTO) document.body.className = 'foto';
  var f = document.getElementById('tela');
  var linhas = [], falhas = [];
  function check(nome, ok, extra) {
    linhas.push('<div class="' + (ok ? 'p' : 'f') + '">' + (ok ? 'PASSOU' : 'FALHOU') + ' · ' +
                nome + (extra != null && extra !== '' ? ' (' + extra + ')' : '') + '</div>');
    if (!ok) falhas.push(nome);
  }
  function fecha() {
    document.getElementById('linhas').innerHTML = linhas.join('');
    var s = document.getElementById('summary');
    s.className = falhas.length ? 'fail' : 'allpass';
    s.textContent = falhas.length ? ('FALHOU: ' + falhas.join(' · ')) : ('tudo passou (' + linhas.length + ')');
    window.__fail = falhas.length;
    window.__pronto = true;
  }
  /* OS HERÓIS NOS NASCIMENTOS À VISTA, na câmera padrão, com a tela num tamanho exato (o
   * iframe é redimensionado: o jogo vê um viewport de W×H). Medido AQUI, pelos blocos da
   * HUD na página — não pelo que o renderizador acha: cada herói, pés, cabeça e os dois
   * lados do corpo projetados, cai no canvas, acima da barra de baixo (feitiços + Encerrar
   * turno) e fora do cartão da unidade. E o ajuste é LEVE: a distância fica no máximo 15%
   * acima da do enquadramento de sempre (o dono: o tabuleiro não pode virar miniatura). */
  function heroisNaAreaUtil(tamW, tamH, check, fim) {
    var w = f.contentWindow, d = w.document, R = w.JOGO.Renderer, G = w.JOGO.Game, THREE = w.THREE;
    f.style.width = tamW + 'px'; f.style.height = tamH + 'px';
    var cv = R.threeRenderer().domElement;
    return espera(function () { return w.innerWidth === tamW && w.innerHeight === tamH && Math.abs(cv.clientWidth - tamW) < 2 && Math.abs(cv.clientHeight - tamH) < 2; }, 60, 150)
      .then(function () { R.recentrar(); return espera(function () { return false; }, 8, 150).catch(function () {}); })
      .then(function () {
        R.recentrar();
        return espera(function () { return false; }, 3, 150).catch(function () {});
      })
      .then(function () {
        var cr = cv.getBoundingClientRect(), tela = d.querySelector('.screen-battle.is-on');
        function caixa(sel) {
          var e = tela && tela.querySelector(sel); if (!e) return null;
          var r = e.getBoundingClientRect(); if (!(r.width > 2 && r.height > 2)) return null;
          return { x0: r.left - cr.left, y0: r.top - cr.top, x1: r.right - cr.left, y1: r.bottom - cr.top };
        }
        var topo = null, base = caixa('.bt-bottom');
        var tampas = [caixa('.bt-left')].filter(Boolean);
        var cam = R.camera(), v = new THREE.Vector3(), fora = [];
        var herois = G.state.units.filter(function (u) { return u.kind === 'hero' && u.alive && !u.offBoard; });
        herois.forEach(function (u) {
          var p = R.world(u.x, u.y, 0), ruim = '';
          [[0, 0.05, 0], [0, 2.1, 0], [-0.55, 1.1, 0], [0.55, 1.1, 0]].forEach(function (o) {
            v.set(p.x + o[0], o[1], p.z + o[2]).project(cam);
            var sx = (v.x + 1) / 2 * cr.width, sy = (1 - v.y) / 2 * cr.height;
            if (sx < 0 || sy < 0 || sx > cr.width || sy > cr.height) ruim = ruim || 'fora do canvas';
            else if (topo && sy < topo.y1) ruim = ruim || 'sob os retratos';
            else if (base && sy > base.y0) ruim = ruim || 'sob a barra de baixo';
            else tampas.forEach(function (t) { if (sx > t.x0 && sx < t.x1 && sy > t.y0 && sy < t.y1) ruim = ruim || 'sob o cartão/registro/tempo'; });
          });
          if (ruim) fora.push(u.classId + '@' + u.x + ',' + u.y + ' ' + ruim);
        });
        var enq = R._enquadro && R._enquadro();
        check('em ' + tamW + '×' + tamH + ' os ' + herois.length + ' heróis nos nascimentos ficam fora da barra de baixo e do cartão',
              herois.length > 0 && fora.length === 0 && !!base,
              (fora.join(' | ') || 'ok') + (enq ? ' · k ' + enq.k + (enq.girou ? ' girou' : '') + ' desliza ' + JSON.stringify(enq.deslize) : ''));
        check('em ' + tamW + '×' + tamH + ' a distância fica no máximo 15% acima da do enquadramento de sempre',
              !!enq && enq.tipo === 'duelo' && enq.dist <= enq.distAntiga * 1.15 + 1e-6 && Math.abs(R.getCamera().dist - enq.dist) < 0.01,
              enq ? enq.dist + ' / ' + enq.distAntiga : 'sem relatório');
      })
      .then(function () { f.style.width = ''; f.style.height = ''; }, function (e) { f.style.width = ''; f.style.height = ''; check('área útil em ' + tamW + '×' + tamH, false, e && e.message); });
  }
  window.__heroisNaAreaUtil = heroisNaAreaUtil;

  /* A RÉGUA TÁTICA (19/09), medida no MOTOR do jogo dentro da página, sobre o layout que ele
   * carregou (nada é repetido aqui em número): é a mesma conta que o motor do juiz fez para
   * escolher o desenho, e que tem de continuar valendo se alguém mexer no mapa. O fluxo é o
   * número de caminhos disjuntos (em casas) entre os nascimentos de um lado e os do outro, com
   * os nascimentos sem capacidade (a régua dos juízes). A robustez a muro tapa, uma por uma,
   * cada conjuração de muro que existe no jogo — os feitiços de classe (DATA.spells com efeito
   * 'wall') E os de fusão (Fusion.spellsFor por dupla de DATA.fusionForms), uma forma por
   * (shape, size), as casas pelo Engine.aoeTiles no estado da sala — fora dos nascimentos, e
   * mede o fluxo que sobra; depois varre TODOS os pares, com o BFS só onde pode selar (ver o
   * comentário na varredura). Rodada de conserto (19/09): antes o laço olhava só as 40 piores e
   * parava no primeiro par com fluxo 0 — a garantia passava pela ordem, não pela propriedade.
   * Conserto 2: a rodada anterior lia só a classe e afirmava "nenhum par de nível ≤ 15 sela";
   * com as 24 formas de fusão (Redoma Abissal nível 12, Vulcão Abissal nível 30) isso era falso. */
  function reguaTatica(w, st, check) {
    var E = w.JOGO.Engine, L = w.JOGO.DATA.arena('sede').rooms[0].layout, W = L[0].length, H = L.length;
    function at(x, y) { return (y < 0 || y >= H || x < 0 || x >= W) ? '#' : L[y].charAt(x); }
    function chao(c) { return c === '.' || c === ',' || c === 'P' || (c >= 'a' && c <= 'z'); }
    var Ps = [], As = [], covers = [], nChao = 0, inner = 0, obst = 0, x, y, c, i, j;
    for (y = 0; y < H; y++) for (x = 0; x < W; x++) {
      c = at(x, y);
      if (chao(c)) nChao++;
      if (c === 'P') Ps.push({ x: x, y: y }); else if (c === 'a') As.push({ x: x, y: y }); else if (c === '=') covers.push({ x: x, y: y });
      if (x > 0 && y > 0 && x < W - 1 && y < H - 1) { inner++; if (c === '#' || c === '=') obst++; }
    }
    var man = function (a, b) { return Math.abs(a.x - b.x) + Math.abs(a.y - b.y); };
    function ehNasc(x, y) {
      for (var k = 0; k < Ps.length; k++) if (Ps[k].x === x && Ps[k].y === y) return true;
      for (k = 0; k < As.length; k++) if (As[k].x === x && As[k].y === y) return true;
      return false;
    }
    // as casas de chão indexadas (a régua anda por índice e Uint8Array: é o que deixa a varredura dos pares barata)
    var dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]], cels = [], idx = {}, k;
    for (y = 0; y < H; y++) for (x = 0; x < W; x++) if (chao(at(x, y))) { idx[x + ',' + y] = cels.length; cels.push({ x: x, y: y, nasc: ehNasc(x, y), P: at(x, y) === 'P' }); }
    var nCel = cels.length, vizI = [];
    for (k = 0; k < nCel; k++) { var vv = []; for (i = 0; i < 4; i++) { var jj = idx[(cels[k].x + dirs[i][0]) + ',' + (cels[k].y + dirs[i][1])]; if (jj !== undefined) vv.push(jj); } vizI.push(vv); }
    // fluxo máximo (Edmonds-Karp) com vértice dividido: cada casa passa 1; nascimentos passam tudo. `bloq`: Uint8Array por casa (1 = muro).
    // Devolve { f, caminhos }: os caminhos disjuntos que o fluxo achou (Uint8Array das casas não-nascimento de cada um) — é o
    // filtro barato da varredura dos pares de muro
    function fluxo(bloq) {
      var N = 2 * nCel + 2, S = 2 * nCel, T = 2 * nCel + 1, adj = [], INF = 1e9, kk, e, u, v, ed;
      for (kk = 0; kk < N; kk++) adj.push([]);
      function edge(u2, v2, cap) { adj[u2].push({ v: v2, c: cap, cap: cap, r: adj[v2].length }); adj[v2].push({ v: u2, c: 0, cap: 0, r: adj[u2].length - 1 }); }
      for (kk = 0; kk < nCel; kk++) {
        if (bloq && bloq[kk]) continue;
        edge(2 * kk, 2 * kk + 1, cels[kk].nasc ? INF : 1);
        if (cels[kk].nasc && cels[kk].P) edge(S, 2 * kk, INF);
        if (cels[kk].nasc && !cels[kk].P) edge(2 * kk + 1, T, INF);
        for (e = 0; e < vizI[kk].length; e++) if (!(bloq && bloq[vizI[kk][e]])) edge(2 * kk + 1, 2 * vizI[kk][e], INF);
      }
      var flow = 0;
      for (;;) {
        var prev = new Array(N), q = [S], qi = 0; prev[S] = { u: S };
        while (qi < q.length && !prev[T]) { u = q[qi++]; for (e = 0; e < adj[u].length; e++) { ed = adj[u][e]; if (ed.c > 0 && !prev[ed.v]) { prev[ed.v] = { u: u, e: ed }; q.push(ed.v); } } }
        if (!prev[T]) break;
        var f = INF; v = T;
        while (v !== S) { f = Math.min(f, prev[v].e.c); v = prev[v].u; }
        v = T;
        while (v !== S) { prev[v].e.c -= f; adj[v][prev[v].e.r].c += f; v = prev[v].u; }
        flow += f;
        if (flow >= 50) break;
      }
      // os caminhos: anda de S a T por arestas com fluxo (cap − c > 0), desfazendo ciclos de fluxo; cada volta tira 1
      var caminhos = [], volta, j2, seg;
      for (volta = 0; volta < flow && flow < 50; volta++) {
        var pilha = [S], pos = {}, ares = []; pos[S] = 0; u = S; seg = 0;
        while (u !== T && seg++ < 100000) {
          var esc = null;
          for (e = 0; e < adj[u].length; e++) { ed = adj[u][e]; if (ed.cap > 0 && ed.cap - ed.c > 0) { esc = ed; break; } }
          if (!esc) break;
          v = esc.v;
          if (pos[v] !== undefined) {
            var de = pos[v];
            for (j2 = de; j2 < ares.length; j2++) { ares[j2].c += 1; adj[ares[j2].v][ares[j2].r].c -= 1; delete pos[pilha[j2 + 1]]; }
            ares.length = de; pilha.length = de + 1; u = v; continue;
          }
          ares.push(esc); pilha.push(v); pos[v] = pilha.length - 1; u = v;
        }
        if (u !== T) break;
        for (j2 = 0; j2 < ares.length; j2++) { ares[j2].c += 1; adj[ares[j2].v][ares[j2].r].c -= 1; }
        var cam = new Uint8Array(nCel);
        for (j2 = 1; j2 < pilha.length - 1; j2++) if (pilha[j2] % 2 === 0) { kk = pilha[j2] / 2; if (!cels[kk].nasc) cam[kk] = 1; }
        caminhos.push(cam);
      }
      return { f: flow, caminhos: caminhos };
    }
    // ligação P→a por BFS (bem mais barata que o fluxo: é o que a varredura dos pares de muro usa)
    function ligados(bloq) {
      var vis = new Uint8Array(nCel), q = [], qi = 0, kk, e, j2;
      for (kk = 0; kk < nCel; kk++) if (cels[kk].nasc && cels[kk].P && !bloq[kk]) { vis[kk] = 1; q.push(kk); }
      while (qi < q.length) { kk = q[qi++]; for (e = 0; e < vizI[kk].length; e++) { j2 = vizI[kk][e]; if (!vis[j2] && !bloq[j2]) { vis[j2] = 1; q.push(j2); } } }
      for (kk = 0; kk < nCel; kk++) if (cels[kk].nasc && !cels[kk].P && vis[kk]) return true;
      return false;
    }
    // --- visão entre nascimentos, no motor
    var losPares = [];
    for (i = 0; i < Ps.length; i++) for (j = 0; j < As.length; j++) {
      if (E.los(st, Ps[i].x, Ps[i].y, As[j].x, As[j].y) || E.los(st, As[j].x, As[j].y, Ps[i].x, Ps[i].y)) losPares.push(Ps[i].x + ',' + Ps[i].y + '>' + As[j].x + ',' + As[j].y);
    }
    check('régua · nenhum dos ' + (Ps.length * As.length) + ' pares nascimento×nascimento tem visão direta (Engine.los, os dois sentidos)', Ps.length === 4 && As.length === 4 && losPares.length === 0, losPares.join(' ') || '0');
    // --- retas: visão (só # quebra) e corredor de chão
    function maior(cabe) {
      var m = 0, onde = '', run;
      for (y = 1; y < H - 1; y++) { run = 0; for (x = 1; x < W; x++) { if (x < W - 1 && cabe(at(x, y))) { run++; if (run > m) { m = run; onde = 'y=' + y; } } else run = 0; } }
      for (x = 1; x < W - 1; x++) { run = 0; for (y = 1; y < H; y++) { if (y < H - 1 && cabe(at(x, y))) { run++; if (run > m) { m = run; onde = 'x=' + x; } } else run = 0; } }
      return { m: m, onde: onde };
    }
    var rv = maior(function (ch) { return ch !== '#'; }), rc = maior(chao);
    check('régua · a maior reta de VISÃO (só "#" quebra) tem no máximo 9 casas', rv.m <= 9, rv.m + ' em ' + rv.onde);
    check('régua · o maior CORREDOR reto de chão tem no máximo 9 casas', rc.m <= 9, rc.m + ' em ' + rc.onde);
    // --- todo chão alcançável
    var vis = {}, fila = [Ps[0]], nVis = 1; vis[Ps[0].x + ',' + Ps[0].y] = true;
    while (fila.length) {
      var cur = fila.shift(), vz = [[1, 0], [-1, 0], [0, 1], [0, -1]];
      for (i = 0; i < 4; i++) { var kx = cur.x + vz[i][0], ky = cur.y + vz[i][1]; if (!vis[kx + ',' + ky] && chao(at(kx, ky))) { vis[kx + ',' + ky] = true; nVis++; fila.push({ x: kx, y: ky }); } }
    }
    check('régua · todo o chão é alcançável a partir do primeiro nascimento', nVis === nChao, nVis + ' de ' + nChao);
    // --- fluxo, obstáculo, espelho, cobertura, duplas
    var f0 = fluxo(null).f;
    check('régua · pelo menos 5 caminhos disjuntos entre os lados (fluxo)', f0 >= 5, f0);
    var frac = obst / inner;
    check('régua · obstáculo entre 14% e 24% do interior', frac >= 0.14 && frac <= 0.24, (frac * 100).toFixed(1) + '% (' + obst + ' de ' + inner + ')');
    var esp = true;
    for (y = 0; y < H && esp; y++) for (x = 0; x < W; x++) { c = at(x, y); var e2 = c === 'P' ? 'a' : c === 'a' ? 'P' : c; if (e2 !== at(W - 1 - x, y)) { esp = false; break; } }
    check('régua · o salão é espelhado oeste/leste (P ↔ a)', esp);
    var dCob = Ps.concat(As).map(function (s) { var d = 99; for (var k = 0; k < covers.length; k++) d = Math.min(d, man(s, covers[k])); return d; });
    check('régua · cada nascimento fica a exatamente 2 casas de uma cobertura baixa', dCob.every(function (d) { return d === 2; }), dCob.join(','));
    var pl = st.units.filter(function (u) { return u.kind === 'hero' && u.side === 'player'; });
    var en = st.units.filter(function (u) { return u.kind === 'hero' && u.side === 'enemy'; });
    check('régua · as duplas nascem adjacentes nos dois lados (o desempate do createDuelSala)',
          pl.length === 4 && en.length === 4 && man(pl[0], pl[1]) === 1 && man(pl[2], pl[3]) === 1 && man(en[0], en[1]) === 1 && man(en[2], en[3]) === 1,
          pl.map(function (u) { return u.x + ',' + u.y; }).join(' ') + ' | ' + en.map(function (u) { return u.x + ',' + u.y; }).join(' '));
    check('régua · o lado A nasce nos P e o lado B nas letras',
          pl.every(function (u) { return at(u.x, u.y) === 'P'; }) && en.every(function (u) { return at(u.x, u.y) === 'a'; }));
    // --- robustez a muro invocado: TODOS os muros do jogo — os feitiços de classe (DATA.spells com efeito
    //     'wall') E os de FUSÃO (Fusion.spellsFor por dupla de DATA.fusionForms: a forma da área não depende
    //     da mistura, então uma mistura qualquer no nível da forma mais alta basta) — uma forma por (shape,
    //     size) com o menor nível que a abre, e as casas pelo Engine.aoeTiles no estado da sala (a linha
    //     para no muro; anel, cruz e círculo só onde o centro enxerga), fora dos nascimentos
    var Fu = w.JOGO.Fusion, formas = {}, nClasse = 0, nFusao = 0, sid, fk, par;
    function muroDe(s) { if (!s || !s.effects) return null; for (var q = 0; q < s.effects.length; q++) if (s.effects[q].type === 'wall') return s.effects[q]; return null; }
    function registra(s, origem) {
      var ef = muroDe(s); if (!ef) return;
      var a = s.aoe || { shape: 'single', size: 0 }, k2 = a.shape + (a.size || 0), nv = s.unlockLevel || 0;
      if (!formas[k2]) formas[k2] = { forma: k2, spell: s, nivel: nv, nomes: [], turnos: [] };
      if (nv < formas[k2].nivel) { formas[k2].nivel = nv; formas[k2].spell = s; }
      formas[k2].nomes.push(s.name + ' (' + origem + ' n' + nv + ', ' + (ef.duration || 0) + 't)'); formas[k2].turnos.push(ef.duration || 0);
      if (origem === 'classe') nClasse++; else nFusao++;
    }
    for (sid in w.JOGO.DATA.spells) registra(w.JOGO.DATA.spells[sid], 'classe');
    var mist = Object.keys(w.JOGO.DATA.fusionBlends || {})[0], nivelTopo = 0;
    for (par in w.JOGO.DATA.fusionForms) (w.JOGO.DATA.fusionForms[par] || []).forEach(function (fm) { nivelTopo = Math.max(nivelTopo, fm.tier || 0); });
    if (Fu && mist) for (par in w.JOGO.DATA.fusionForms) Fu.spellsFor(par, mist, nivelTopo).forEach(function (s) { registra(s, par); });
    var casts = [], vistos = {};
    function guarda(F, tiles, onde) {
      var bl = new Uint8Array(nCel), ks = [], t, kk;

    // barra de feitiços, e com o azimute da câmera padrão (−π/4) ela caía debaixo do cartão da fusão
    if (qual === 'cima') R.setCamera({ tilt: 0.3, dist: 62, ang: 0.0001, panX: 0, panZ: 0 });
    else if (qual === 'lado') R.setCamera({ tilt: 1.15, dist: 26, ang: Math.PI * 0.75 });
    else { R.setCamera({ rot: 0, animate: false }); R.recentrar(); }
    return R.getCamera();
  };
})();
</script>
