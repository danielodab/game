<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>SOTERRA — as poções de vida na HUD</title>
<style>
  html,body{margin:0;background:#0b0d10;color:#e8eef6;font:12px/1.5 system-ui,Segoe UI,sans-serif;overflow:hidden}
  #tela{position:fixed;left:0;top:0;width:900px;height:760px;border:0;background:#000}
  #saida{position:fixed;left:900px;top:0;right:0;bottom:0;overflow:auto;
         border-left:1px solid #2b3542;padding:8px;font:11px/1.5 monospace}
  #summary{padding:5px 8px;border-radius:5px;background:#1b222c;color:#cdd6e2;margin-bottom:6px}
  .allpass{background:#16241b !important;color:#7fe08a !important} .fail{background:#3d1414 !important;color:#f77 !important}
</style>
</head>
<body>
<!-- AS POÇÕES DE VIDA NA HUD (13/09, pedido do dono: "no mercadinho do jogo deve ter poções
     à venda por vinténs. poções que carregam a vida vão para consumíveis no inventário").
     O index.html de verdade num quadro, com o save na memória (?sandbox=1), sem sessão (o
     Mercadinho local; a compra com a autoridade é provada em tests/pocoes_api.py). Cobra:
       - a aba Poções da banca do mercador: três poções com cura e preço, os atalhos 1/5/10,
         Comprar debita o saco e soma o contador; recusa acima do teto e sem vinténs;
       - a aba Consumíveis do inventário com cada poção, a quantidade e a cura;
       - na batalha (Game.startRun): um botão por poção na barra, com a contagem; beber cura,
         gasta 2 PA e uma poção; a segunda na mesma vez é recusada; no duelo não aparece.
     Pontos de foto: a página põe window.__foto = 'nome' e espera window.__fotoFeita (um
     condutor com DevTools fotografa; sem ele, segue depois de um instante).
     Roda por HTTP (o quadro precisa da mesma origem). -->
<iframe id="tela"></iframe>
<div id="saida"><div id="summary">rodando…</div><pre id="log"></pre></div>

<script>
(function () {
  'use strict';
  var NL = String.fromCharCode(10);
  var linhas = [], falhas = 0, total = 0, T0 = Date.now();
  function pinta() { document.getElementById('log').textContent = linhas.join(NL); }
  function diz(t) { linhas.push('   ' + t); pinta(); }
  function check(nome, ok, extra) {
    total++; if (!ok) falhas++;
    linhas.push((ok ? 'PASSOU · ' : 'FALHOU · ') + nome + (extra !== undefined && extra !== '' ? '   [' + extra + ']' : ''));
    pinta();
  }
  function fim(motivo) {
    if (motivo) { total++; falhas++; linhas.push('FALHOU · ' + motivo); }
    linhas.push('(' + Math.round((Date.now() - T0) / 1000) + ' s no relógio da página)');
    var s = document.getElementById('summary');
    s.className = falhas ? 'fail' : 'allpass';
    s.textContent = falhas ? ('FALHOU — ' + falhas + ' de ' + total) : ('tudo passou (' + total + ')');
    linhas.push(s.textContent);
    pinta();
    window.__fail = falhas;
    window.__pronto = true;
    try {
      var xf = new XMLHttpRequest();
      xf.open('POST', '/__fim', false);
      xf.send(linhas.join(NL));
    } catch (e) {}
  }
  function passo(ms) { return new Promise(function (r) { setTimeout(r, ms || 50); }); }
  function ate(cond, ms) {
    var t1 = Date.now();
    return new Promise(function (r) {
      (function volta() {
        var ok = false;
        try { ok = !!cond(); } catch (e) {}
        if (ok) return r(true);
        if (Date.now() - t1 > (ms || 20000)) return r(false);
        setTimeout(volta, 80);
      })();
    });
  }
  function foto(nome) {
    window.__foto = nome;
    return ate(function () { return window.__fotoFeita === nome; }, 12000);
  }

  var quadro = document.getElementById('tela');
  quadro.src = '../index.html?sandbox=1&snap=1&pocoes-hud';
  var w, doc, J, G, E, U, P;
  var MED = 'pocao-media', PEQ = 'pocao-pequena', GRA = 'pocao-grande';

  function ficha() { return doc.querySelector('.ui-sheet.is-on'); }
  function textoFicha() { var f = ficha(); return f ? f.textContent.replace(/\s+/g, ' ') : ''; }
  function toastTxt() { var t = doc.querySelector('.ui-toast'); return (t && t.classList.contains('is-on')) ? t.textContent : ''; }
  function botao(caixa, re) {
    var b = null;
    [].forEach.call(caixa ? caixa.querySelectorAll('button') : [], function (x) { if (!b && re.test(x.textContent || '')) b = x; });
    return b;
  }
  function linhaPocao(id) { var f = ficha(); return f ? f.querySelector('.mc-pocao[data-pocao="' + id + '"]') : null; }
  function moedas() { return J.DB.exportar().carteira.moedas; }
  function botoesBarra() { return [].slice.call(doc.querySelectorAll('.bt-spells .spell.is-pocao')); }
  function botaoBarra(id) { return doc.querySelector('.bt-spells .spell.is-pocao[data-pocao="' + id + '"]'); }

  quadro.onload = function () {
    w = quadro.contentWindow; doc = w.document;
    ate(function () {
      J = w.JOGO;
      return J && J.UI && J.UI.openSheet && J.Game && J.Engine && J.Mercado && J.Progress && J.DB && J.DATA &&
             J.DATA.consumiveis && doc.querySelector('.ui-toast') && doc.querySelector('.ui-sheet');
    }, 110000).then(function (ok) {
      if (!ok) return fim('o jogo não abriu no quadro');
      G = J.Game; E = J.Engine; U = J.UI; P = J.Progress;
      diz('o jogo abriu em ' + Math.round((Date.now() - T0) / 1000) + ' s');
      try {
        var suf = (J.Contas && J.Contas.sufixo) ? J.Contas.sufixo() : '';
        w.localStorage.setItem('soterra-tutor-v1' + suf, JSON.stringify({ vistos: {}, off: true }));
      } catch (e) {}
      return banca().then(inventario).then(batalha).then(function () { fim(); });
    }).catch(function (e) { fim('a prova estourou: ' + (e && (e.stack || e.message) || e)); });
  };

  // ====================================================== a banca do mercador
  function banca() {
    check('o save está na memória (sandbox) e o Mercadinho é o local', !!(J.SaveSandbox && J.SaveSandbox.check().ok) &&
          !J.Mercado.servidor.ligado());
    return J.DB.ganharMoedas(1000).then(function () {
      var m0 = moedas();
      U.closeSheet();
      U.openSheet('mercado');
      return ate(function () { return ficha() && botao(ficha().querySelector('.mc-abas'), /^Poções$/); }, 10000).then(function (ok) {
        check('o Mercadinho tem a aba Poções', ok);
        botao(ficha().querySelector('.mc-abas'), /^Poções$/).click();
        return ate(function () { return !!linhaPocao(GRA); }, 8000);
      }).then(function (ok) {
        var t = textoFicha();
        check('a banca mostra as três poções com a cura e o preço (dos dados)', ok && !!linhaPocao(PEQ) && !!linhaPocao(MED) &&
              /Poção de Vida Pequena/.test(t) && /cura 30 PV/.test(t) && /40v/.test(t) && /cura 70 PV/.test(t) && /110v/.test(t) &&
              /cura 150 PV/.test(t) && /260v/.test(t) && /sem taxa/.test(t), t.slice(0, 240));
        check('cada poção tem o ícone desenhado no canvas', [PEQ, MED, GRA].every(function (id) {
          var cv = linhaPocao(id).querySelector('.mc-ic canvas');
          return !!cv && cv.width > 0;
        }));
        var row = linhaPocao(MED);
        botao(row.querySelector('.mc-atalhos'), /^5$/).click();
        check('o atalho 5 põe 5 no campo e o total vira 550v', row.querySelector('input').value === '5' && /total 550v/.test(row.textContent));
        botao(row, /^Comprar$/).click();
        return ate(function () { return P.consumivelVer(MED) === 5; }, 8000);
      }).then(function (ok) {
        check('Comprar 5 Médias debita 550 do saco e põe 5 no contador', ok && moedas() === m0 - 550, moedas() + ' de ' + m0);
        return ate(function () { return /Consumíveis/.test(toastTxt()) && !!linhaPocao(PEQ); }, 5000);
      }).then(function (ok) {
        check('o aviso da compra fala dos Consumíveis', ok, toastTxt());
        var rp = linhaPocao(PEQ);
        rp.querySelector('input').value = '1';
        rp.querySelector('input').dispatchEvent(new w.Event('input'));
        botao(rp, /^Comprar$/).click();
        return ate(function () { return P.consumivelVer(PEQ) === 1; }, 8000);
      }).then(function (ok) {
        check('Comprar 1 Pequena', ok && moedas() === m0 - 590);
        return ate(function () { return !!linhaPocao(GRA); }, 5000);
      }).then(function () {
        var rg = linhaPocao(GRA);
        rg.querySelector('input').value = '10';
        rg.querySelector('input').dispatchEvent(new w.Event('input'));
        var bG = botao(rg, /^Comprar$/);
        check('sem vinténs para 10 Grandes o botão fica apagado (mas tocável) e diz quanto falta', bG.classList.contains('mc-falta') && !bG.classList.contains('is-off') && /Faltam vinténs/.test(bG.title), bG.title);
        bG.click();
        // o aviso da compra anterior ainda está na tela: a recusa vem na fila dos avisos
        return ate(function () { return /Faltam vinténs/.test(toastTxt()); }, 8000).then(function (viu) {
          check('... e tocar nele não compra nada, e diz por quê', viu && P.consumivelVer(GRA) === 0 && moedas() === m0 - 590, toastTxt());
          var rm = linhaPocao(MED);
          rm.querySelector('input').value = '16';
          rm.querySelector('input').dispatchEvent(new w.Event('input'));
          botao(rm, /^Comprar$/).click();
          return ate(function () { return /Cabem 20/.test(toastTxt()); }, 8000);
        });
      }).then(function (viu) {
        check('acima do teto de 20 por poção (5 + 16) a banca recusa sem cobrar', viu && P.consumivelVer(MED) === 5 && moedas() === m0 - 590,
              toastTxt());
        var rm = linhaPocao(MED);
        rm.querySelector('input').value = '5';
        rm.querySelector('input').dispatchEvent(new w.Event('input'));
        return foto('banca');
      });
    });
  }

  // ====================================================== o inventário
  function inventario() {
    U.closeSheet();
    U.openSheet('inventory');
    return ate(function () { return ficha() && botao(ficha().querySelector('.inv-tabs-main'), /Consumíveis/); }, 8000).then(function (ok) {
      check('o inventário tem a aba Consumíveis', ok);
      botao(ficha().querySelector('.inv-tabs-main'), /Consumíveis/).click();
      return ate(function () { return ficha().querySelectorAll('.ig-cell.is-pocao').length === 2; }, 6000);
    }).then(function (ok) {
      var cels = [].slice.call(ficha().querySelectorAll('.ig-cell.is-pocao'));
      var med = cels.filter(function (c) { return c.getAttribute('data-pocao') === MED; })[0];
      var peq = cels.filter(function (c) { return c.getAttribute('data-pocao') === PEQ; })[0];
      check('Consumíveis mostra as duas poções compradas com ícone, nome, quantidade e cura',
            ok && med && peq && /×5/.test(med.textContent) && /Poção de Vida Média/.test(med.textContent) && /cura 70 PV/.test(med.textContent) &&
            /×1/.test(peq.textContent) && !!med.querySelector('canvas'), cels.map(function (c) { return c.textContent; }).join(' | '));
      return foto('consumiveis');
    });
  }

  // ====================================================== a batalha
  function batalha() {
    U.closeSheet();
    var ids = P.heroIds().filter(function (h) { return h !== 'gm'; });
    U.selection(ids.slice(0, 1));
    var ok = G.startRun(U.selection().slice(), 'greenhouse');
    var heroi;
    return ate(function () { return U.telaAtual() === 'antessala'; }, 90000).then(function (naAnt) {
      if (!ok || !naAnt) throw new Error('a descida não chegou à antessala (' + U.telaAtual() + ')');
      G.entrarNaSala();
      return ate(function () { return U.telaAtual() === 'battle' && G.state && !!doc.querySelector('.bt-bottom'); }, 60000);
    }).then(function (naLuta) {
      if (!naLuta) throw new Error('a batalha não abriu');
      var st = G.state;
      var opc = (E.placementOptions ? E.placementOptions(st) : []) || [];
      if (opc[0]) G.onTileClicked(opc[0].x, opc[0].y);
      return ate(function () { return G.state.phase === 'playing'; }, 15000);
    }).then(function () {
      return ate(function () { return G.isPlayerTurn(); }, 30000);
    }).then(function (minha) {
      var st = G.state;
      heroi = st.units.filter(function (u) { return u.side === 'player' && u.kind === 'hero' && u.alive; })[0];
      if (!minha) {
        diz('a vez não chegou sozinha em 30 s: a prova põe a vez no herói');
        st.activeIdx = st.order.indexOf(heroi.uid);
      }
      var u = E.activeUnit(st);
      check('a vez é do herói', !!u && u.uid === heroi.uid && G.isPlayerTurn());
      check('fora da batalha nada disso existia: agora a barra oferece a poção', typeof G.usaPocao === 'function');
      u.hp = Math.max(1, u.hpMax - 100);
      U.update(1 / 60);
      return ate(function () { return botoesBarra().length === 2; }, 5000);
    }).then(function (ok) {
      var bm = botaoBarra(MED), bp = botaoBarra(PEQ);
      check('a barra da batalha tem um botão por poção, com a contagem e o custo', ok && bm && bp && /×5/.test(bm.textContent) &&
            /×1/.test(bp.textContent) && bm.querySelector('.sp-cost').textContent === '2' && !!bm.querySelector('canvas'),
            botoesBarra().map(function (b) { return b.textContent; }).join(' | '));
      return foto('batalha');
    }).then(function () {
      var u = E.activeUnit(G.state);
      var hp0 = u.hp, pa0 = u.pa;
      botaoBarra(MED).click();
      return ate(function () { return P.consumivelVer(MED) === 4; }, 5000).then(function (ok) {
        check('beber a Média cura 70 PV, gasta 2 PA e uma poção', ok && u.hp === Math.min(u.hpMax, hp0 + 70) && u.pa === pa0 - 2,
              JSON.stringify({ hp0: hp0, hp: u.hp, pa0: pa0, pa: u.pa, n: P.consumivelVer(MED) }));
        U.update(1 / 60);
        return ate(function () { var b = botaoBarra(MED); return b && /×4/.test(b.textContent); }, 5000);
      }).then(function (ok) {
        var b = botaoBarra(MED);
        check('o botão conta 4 e fica apagado (já bebeu nesta vez)', ok && b.classList.contains('is-dim'));
        return foto('batalha-depois');
      }).then(function () {
        var hp1 = u.hp;
        u.hp = Math.max(1, u.hp - 30);
        U.update(1 / 60);
        var hp2 = u.hp;
        botaoBarra(PEQ).click();
        return passo(300).then(function () {
          check('a segunda poção na mesma vez é recusada, com o porquê', u.hp === hp2 && P.consumivelVer(PEQ) === 1 &&
                /Uma poção por turno/.test(toastTxt()), toastTxt() + ' hp ' + hp1 + '→' + hp2 + '→' + u.hp);
          // o duelo: a barra não oferece poção e o Game recusa
          var st = G.state;
          st.pvp = true;
          u.hp = Math.max(1, u.hp - 1);
          U.update(1 / 60);
          var nada = botoesBarra().length === 0 && G.pocoesNaBarra().length === 0 && G.usaPocao(PEQ) === false;
          st.pvp = false;
          u.hp = u.hp + 1;
          U.update(1 / 60);
          check('no duelo o botão não aparece e o Game recusa beber', nada && P.consumivelVer(PEQ) === 1);
        });
      });
    });
  }
})();
</script>
</body>
</html>
