<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>SOTERRA — as poções de vida e a vida entre as salas na HUD</title>
<style>
  html,body{margin:0;background:#0b0d10;color:#e8eef6;font:12px/1.5 system-ui,Segoe UI,sans-serif;overflow:hidden}
  #tela{position:fixed;left:0;top:0;width:900px;height:760px;border:0;background:#000}
  #saida{position:fixed;left:900px;top:0;right:0;bottom:0;overflow:auto;
         border-left:1px solid #2b3542;padding:8px;font:11px/1.5 monospace}
  #summary{padding:5px 8px;border-radius:5px;background:#1b222c;color:#cdd6e2;margin-bottom:6px}
  .allpass{background:#16241b !important;color:#7fe08a !important} .fail{background:#3d1414 !important;color:#f77 !important}
</style>
</head>
<body>
<!-- AS POÇÕES DE VIDA E A VIDA ENTRE AS SALAS NA HUD (13/09). Pedidos do dono: "no mercadinho
     do jogo deve ter poções à venda por vinténs. poções que carregam a vida vão para consumíveis
     no inventário" e "a poção não é para usar na batalha.. e sim para curar a vida após uma
     batalha na sala de espera entre as salas.. carrega 1 pv a cada 2 segundos. se um personagem
     morre ele vem com a vida zerada aumentando 1 pv a cada 2 s também".
     O index.html de verdade num quadro, com o save na memória (?sandbox=1), sem sessão (a vida e o
     gole com a autoridade são provados em tests/pocoes_api.py). Cobra:
       - a aba Poções da banca do mercador e a aba Consumíveis do inventário;
       - a batalha SEM poção na barra;
       - a sala vencida (o fim forçado pela prova) abre a sala de espera: o quadro da vida com a
         barra de cada herói subindo 1 PV a cada 2 s (o relógio da espera é controlado pela prova,
         e uma volta com o relógio de verdade), os botões das poções, o gole que cura e desconta,
         a vida cheia que recusa;
       - o herói caído (0 PV): o "Entrar na batalha" apagado dizendo quanto falta, que acende com
         1 PV — pelo tempo ou pela poção — e a batalha seguinte nasce com a vida da porta.
     Pontos de foto: a página põe window.__foto = 'nome' e espera window.__fotoFeita (um
     condutor com DevTools fotografa; sem ele, segue depois de um instante).
     Roda por HTTP (o quadro precisa da mesma origem). -->
<iframe id="tela"></iframe>
<div id="saida"><div id="summary">rodando…</div><pre id="log"></pre></div>

<script>
(function () {
  'use strict';
  var NL = String.fromCharCode(10);
  var linhas = [], falhas = 0, total = 0, T0 = Date.now();
  function pinta() { document.getElementById('log').textContent = linhas.join(NL); }
  function diz(t) { linhas.push('   ' + t); pinta(); }
  function check(nome, ok, extra) {
    total++; if (!ok) falhas++;
    linhas.push((ok ? 'PASSOU · ' : 'FALHOU · ') + nome + (extra !== undefined && extra !== '' ? '   [' + extra + ']' : ''));
    pinta();
  }
  function fim(motivo) {
    if (motivo) { total++; falhas++; linhas.push('FALHOU · ' + motivo); }
    linhas.push('(' + Math.round((Date.now() - T0) / 1000) + ' s no relógio da página)');
    var s = document.getElementById('summary');
    s.className = falhas ? 'fail' : 'allpass';
    s.textContent = falhas ? ('FALHOU — ' + falhas + ' de ' + total) : ('tudo passou (' + total + ')');
    linhas.push(s.textContent);
    pinta();
    window.__fail = falhas;
    window.__pronto = true;
    try {
      var xf = new XMLHttpRequest();
      xf.open('POST', '/__fim', false);
      xf.send(linhas.join(NL));
    } catch (e) {}
  }
  function passo(ms) { return new Promise(function (r) { setTimeout(r, ms || 50); }); }
  function ate(cond, ms) {
    var t1 = Date.now();
    return new Promise(function (r) {
      (function volta() {
        var ok = false;
        try { ok = !!cond(); } catch (e) {}
        if (ok) return r(true);
        if (Date.now() - t1 > (ms || 20000)) return r(false);
        setTimeout(volta, 80);
      })();
    });
  }
  function foto(nome) {
    window.__foto = nome;
    return ate(function () { return window.__fotoFeita === nome; }, 12000);
  }

  var quadro = document.getElementById('tela');
  quadro.src = '../index.html?sandbox=1&snap=1&pocoes-hud';
  var w, doc, J, G, E, U, P;
  var MED = 'pocao-media', PEQ = 'pocao-pequena', GRA = 'pocao-grande';

  function ficha() { return doc.querySelector('.ui-sheet.is-on'); }
  function textoFicha() { var f = ficha(); return f ? f.textContent.replace(/\s+/g, ' ') : ''; }
  function toastTxt() { var t = doc.querySelector('.ui-toast'); return (t && t.classList.contains('is-on')) ? t.textContent : ''; }
  function botao(caixa, re) {
    var b = null;
    [].forEach.call(caixa ? caixa.querySelectorAll('button') : [], function (x) { if (!b && re.test(x.textContent || '')) b = x; });
    return b;
  }
  function linhaPocao(id) { var f = ficha(); return f ? f.querySelector('.mc-pocao[data-pocao="' + id + '"]') : null; }
  function moedas() { return J.DB.exportar().carteira.moedas; }

  quadro.onload = function () {
    w = quadro.contentWindow; doc = w.document;
    ate(function () {
      J = w.JOGO;
      return J && J.UI && J.UI.openSheet && J.Game && J.Engine && J.Mercado && J.Progress && J.DB && J.DATA &&
             J.DATA.consumiveis && doc.querySelector('.ui-toast') && doc.querySelector('.ui-sheet');
    }, 110000).then(function (ok) {
      if (!ok) return fim('o jogo não abriu no quadro');
      G = J.Game; E = J.Engine; U = J.UI; P = J.Progress;
      diz('o jogo abriu em ' + Math.round((Date.now() - T0) / 1000) + ' s');
      try {
        var suf = (J.Contas && J.Contas.sufixo) ? J.Contas.sufixo() : '';
        w.localStorage.setItem('soterra-tutor-v1' + suf, JSON.stringify({ vistos: {}, off: true }));
      } catch (e) {}
      return banca().then(inventario).then(batalha).then(espera).then(caido).then(function () { fim(); });
    }).catch(function (e) { fim('a prova estourou: ' + (e && (e.stack || e.message) || e)); });
  };

  // ====================================================== a banca do mercador
  function banca() {
    check('o save está na memória (sandbox) e o Mercadinho é o local', !!(J.SaveSandbox && J.SaveSandbox.check().ok) &&
          !J.Mercado.servidor.ligado());
    return J.DB.ganharMoedas(1000).then(function () {
      var m0 = moedas();
      U.closeSheet();
      U.openSheet('mercado');
      return ate(function () { return ficha() && botao(ficha().querySelector('.mc-abas'), /^Poções$/); }, 10000).then(function (ok) {
        check('o Mercadinho tem a aba Poções', ok);
        botao(ficha().querySelector('.mc-abas'), /^Poções$/).click();
        return ate(function () { return !!linhaPocao(GRA); }, 8000);
      }).then(function (ok) {
        var t = textoFicha();
        check('a banca mostra as três poções com a cura e o preço (dos dados)', ok && !!linhaPocao(PEQ) && !!linhaPocao(MED) &&
              /Poção de Vida Pequena/.test(t) && /cura 30 PV/.test(t) && /40v/.test(t) && /cura 70 PV/.test(t) && /110v/.test(t) &&
              /cura 150 PV/.test(t) && /260v/.test(t) && /sem taxa/.test(t), t.slice(0, 240));
        check('a banca diz que a poção é da sala de espera entre as salas (nada de PA na batalha)',
              /sala de espera entre as salas/.test(t) && !/PA na batalha/.test(t), t.slice(0, 400));
        var row = linhaPocao(MED);
        botao(row.querySelector('.mc-atalhos'), /^5$/).click();
        check('o atalho 5 põe 5 no campo e o total vira 550v', row.querySelector('input').value === '5' && /total 550v/.test(row.textContent));
        botao(row, /^Comprar$/).click();
        return ate(function () { return P.consumivelVer(MED) === 5; }, 8000);
      }).then(function (ok) {
        check('Comprar 5 Médias debita 550 do saco e põe 5 no contador', ok && moedas() === m0 - 550, moedas() + ' de ' + m0);
        return ate(function () { return !!linhaPocao(PEQ); }, 5000);
      }).then(function () {
        var rp = linhaPocao(PEQ);
        rp.querySelector('input').value = '2';
        rp.querySelector('input').dispatchEvent(new w.Event('input'));
        botao(rp, /^Comprar$/).click();
        return ate(function () { return P.consumivelVer(PEQ) === 2; }, 8000);
      }).then(function (ok) {
        check('Comprar 2 Pequenas', ok && moedas() === m0 - 630);
        return ate(function () { return !!linhaPocao(GRA); }, 5000);
      }).then(function () {
        var rm = linhaPocao(MED);
        rm.querySelector('input').value = '16';
        rm.querySelector('input').dispatchEvent(new w.Event('input'));
        botao(rm, /^Comprar$/).click();
        return ate(function () { return /Cabem 20/.test(toastTxt()); }, 8000);
      }).then(function (viu) {
        check('acima do teto de 20 por poção (5 + 16) a banca recusa sem cobrar', viu && P.consumivelVer(MED) === 5 && moedas() === m0 - 630,
              toastTxt());
        var rm = linhaPocao(MED);
        rm.querySelector('input').value = '5';
        rm.querySelector('input').dispatchEvent(new w.Event('input'));
        return foto('banca');
      });
    });
  }

  // ====================================================== o inventário
  function inventario() {
    U.closeSheet();
    U.openSheet('inventory');
    return ate(function () { return ficha() && botao(ficha().querySelector('.inv-tabs-main'), /Consumíveis/); }, 8000).then(function (ok) {
      check('o inventário tem a aba Consumíveis', ok);
      botao(ficha().querySelector('.inv-tabs-main'), /Consumíveis/).click();
      return ate(function () { return ficha().querySelectorAll('.ig-cell.is-pocao').length === 2; }, 6000);
    }).then(function (ok) {
      var cels = [].slice.call(ficha().querySelectorAll('.ig-cell.is-pocao'));
      var med = cels.filter(function (c) { return c.getAttribute('data-pocao') === MED; })[0];
      check('Consumíveis mostra as poções compradas com ícone, nome, quantidade e cura',
            ok && med && /×5/.test(med.textContent) && /Poção de Vida Média/.test(med.textContent) && /cura 70 PV/.test(med.textContent) &&
            !!med.querySelector('canvas'), cels.map(function (c) { return c.textContent; }).join(' | '));
      return foto('consumiveis');
    });
  }

  // ====================================================== a batalha: sem poção
  var heroisIds, relogio = 0;
  function relogioParado(ms) { relogio = ms; G._relogioVida = function () { return relogio; }; }
  function batalha() {
    U.closeSheet();
    heroisIds = P.heroIds().filter(function (h) { return h !== 'gm'; }).slice(0, 2);
    U.selection(heroisIds.slice());
    var ok = G.startRun(U.selection().slice(), 'greenhouse');
    return ate(function () { return U.telaAtual() === 'antessala'; }, 90000).then(function (naAnt) {
      if (!ok || !naAnt) throw new Error('a descida não chegou à antessala (' + U.telaAtual() + ')');
      check('a primeira sala da descida: sem sala de espera (vida cheia, sem quadro da vida)',
            G.vidaNaEspera().length === 0 && !doc.querySelector('.vida-bloco') && G.esperaVida() === null);
      G.entrarNaSala();
      return ate(function () { return U.telaAtual() === 'battle' && G.state && !!doc.querySelector('.bt-bottom'); }, 60000);
    }).then(function (naLuta) {
      if (!naLuta) throw new Error('a batalha não abriu');
      var st = G.state;
      var hs = st.units.filter(function (u) { return u.kind === 'hero' && u.side === 'player'; });
      check('a batalha da primeira sala nasce de vida cheia', hs.length > 0 && hs.every(function (u) { return u.hp === u.hpMax; }),
            hs.map(function (u) { return u.hp + '/' + u.hpMax; }).join(' '));
      var opc = (E.placementOptions ? E.placementOptions(st) : []) || [];
      if (opc[0]) G.onTileClicked(opc[0].x, opc[0].y);
      return ate(function () { return G.state.phase === 'playing'; }, 15000);
    }).then(function () {
      U.update(1 / 60);
      return passo(400);
    }).then(function () {
      check('a barra da batalha não tem poção e o Game não bebe na batalha',
            doc.querySelectorAll('.bt-spells .spell.is-pocao').length === 0 && typeof G.usaPocao === 'undefined' &&
            typeof E.usePotion === 'undefined');
      // o FIM FORÇADO: o primeiro herói ferido, os inimigos no chão, a sala vencida
      var st = G.state;
      var hs = st.units.filter(function (u) { return u.kind === 'hero' && u.side === 'player'; });
      hs[0].hp = Math.max(1, hs[0].hpMax - 120);
      st.units.forEach(function (u) { if (u.side === 'enemy') { u.hp = 0; u.alive = false; } });
      st.phase = 'won';
      relogioParado(1000000);
      G.update(1 / 60);
      return ate(function () { return U.telaAtual() === 'roomClear'; }, 15000);
    });
  }

  // ====================================================== a sala de espera
  function linhaVida(chave) { return doc.querySelector('.vida-bloco.is-fixo .vida-heroi[data-chave="' + chave + '"]'); }
  function numVida(chave) { var r = linhaVida(chave); var n = r && r.querySelector('.vh-num'); return n ? n.textContent : ''; }
  var principal;
  function espera() {
    return Promise.resolve().then(function (okRec) {
      var lista = G.vidaNaEspera();
      principal = lista[0];
      check('a sala vencida abre o registro da espera: cada herói com a vida com que terminou', lista.length === heroisIds.length &&
            principal && principal.hp === principal.max - 120 && principal.cheioEmS === 240,
            JSON.stringify(lista.map(function (v) { return [v.chave, v.hp, v.max, v.cheioEmS]; })));
      G.nextRoom();
      return ate(function () { return U.telaAtual() === 'antessala' && !!linhaVida(principal.chave); }, 90000);
    }).then(function (ok) {
      check('a antessala da sala 2 mostra o quadro da vida no canto, com a barra e o PV de cada herói',
            ok && numVida(principal.chave) === (principal.max - 120) + '/' + principal.max + ' PV' &&
            doc.querySelectorAll('.vida-bloco.is-fixo .vida-heroi').length === heroisIds.length, numVida(principal.chave));
      check('... e diz quanto falta: "+1 PV a cada 2 s · cheio em 4:00"',
            /\+1 PV a cada 2 s · cheio em 4:00/.test(linhaVida(principal.chave).textContent), linhaVida(principal.chave).textContent);
      check('o bilhete não é pedido de antemão enquanto a vida sobe (sem autoridade aqui, a regra é do Game)', G.esperaVida() === null);
      relogio += 10000;                                    // 10 s de espera
      return ate(function () { return numVida(principal.chave) === (principal.max - 115) + '/' + principal.max + ' PV'; }, 3000);
    }).then(function (ok) {
      check('10 s de espera: +5 PV na barra, sem recarregar a tela (o relógio da prova)', ok, numVida(principal.chave));
      var larg = linhaVida(principal.chave).querySelector('.vh-enche').style.width;
      check('a largura da barra acompanha o PV', larg === Math.round(100 * (principal.max - 115) / principal.max) + '%', larg);
      // uma volta com o relógio DE VERDADE: a barra sobe sozinha
      var reg = G._esperaRegistro();
      reg.herois[principal.chave].hp = principal.max - 115;
      reg.desde = Date.now();
      G._relogioVida = null;
      var antes = principal.max - 115;
      return passo(4600).then(function () {
        var hp = parseInt(numVida(principal.chave), 10);
        check('com o relógio de verdade a barra sobe AO VIVO (4,6 s = +2 PV)', hp >= antes + 2 && hp <= antes + 3, antes + ' → ' + hp);
        relogioParado(reg.desde + 4000);
        return foto('espera');
      });
    }).then(function () {
      var bs = doc.querySelectorAll('.vida-bloco.is-fixo .vida-heroi[data-chave="' + principal.chave + '"] .vh-pocao');
      check('os botões das poções que a conta tem, com a cura e a contagem', bs.length === 2 &&
            /\+30/.test(bs[0].textContent) && /×2/.test(bs[0].textContent) && /\+70/.test(bs[1].textContent) && /×5/.test(bs[1].textContent) &&
            !!bs[0].querySelector('canvas'), [].map.call(bs, function (b) { return b.textContent; }).join(' | '));
      var hp0 = G.vidaNaEspera()[0].hp;
      linhaVida(principal.chave).querySelector('.vh-pocao[data-pocao="' + MED + '"]').click();
      return ate(function () { return P.consumivelVer(MED) === 4; }, 5000).then(function (ok) {
        return ate(function () { return numVida(principal.chave) === (hp0 + 70) + '/' + principal.max + ' PV'; }, 3000).then(function (ok2) {
          check('tocar a Média cura 70 PV naquele herói na hora e gasta uma', ok && ok2 && G.vidaNaEspera()[0].hp === hp0 + 70,
                hp0 + ' → ' + numVida(principal.chave) + ' · ' + P.consumivelVer(MED));
          return ate(function () {
            var b = linhaVida(principal.chave).querySelector('.vh-pocao[data-pocao="' + MED + '"]');
            return b && /×4/.test(b.textContent);
          }, 3000);
        });
      });
    }).then(function (ok) {
      check('o botão conta 4', ok);
      linhaVida(principal.chave).querySelector('.vh-pocao[data-pocao="' + MED + '"]').click();
      return ate(function () { return P.consumivelVer(MED) === 3; }, 5000);
    }).then(function (ok) {
      var v = G.vidaNaEspera()[0];
      check('pode beber de novo (sem limite por turno fora da batalha), sem passar do máximo', ok && v.hp === v.max, v.hp + '/' + v.max);
      return ate(function () { return /vida cheia/.test(linhaVida(principal.chave).textContent); }, 3000);
    }).then(function (ok) {
      var b = linhaVida(principal.chave).querySelector('.vh-pocao[data-pocao="' + PEQ + '"]');
      check('cheio: a barra diz "vida cheia" e a poção fica apagada', ok && b.classList.contains('is-dim'));
      b.click();
      return passo(400).then(function () {
        check('... e tocar nela não gasta, e diz por quê', P.consumivelVer(PEQ) === 2 && /já está cheia/.test(toastTxt()), toastTxt());
        return foto('espera-bebeu');
      });
    });
  }

  // ====================================================== o herói caído espera 1 PV
  function portaBotao() { return doc.querySelector('.hub-painel .vida-porta'); }
  function caido() {
    var reg = G._esperaRegistro();
    reg.herois[principal.chave].hp = 0;
    reg.cura = {};
    relogioParado(reg.desde);
    J.Hub.aoAproximar({ tipo: 'porta', nome: 'A porta' });
    return ate(function () { return !!portaBotao() && /recuperar/.test(portaBotao().textContent); }, 3000).then(function (ok) {
      var b = portaBotao();
      check('herói a 0 PV: o "Entrar na batalha" fica apagado e diz "Esperando … recuperar… 2 s"',
            ok && b.classList.contains('is-apagado') && /^Esperando .+ recuperar… 2 s$/.test(b.textContent), b && b.textContent);
      check('... o painel da porta também mostra a vida (compacta: as poções ficam no quadro do canto)',
            !!doc.querySelector('.hub-painel .vida-bloco.is-compacto .vida-heroi.is-zero') &&
            !doc.querySelector('.hub-painel .vida-bloco .vh-pocao'));
      var rb = b.getBoundingClientRect(), rp = doc.querySelector('.hub-painel').getBoundingClientRect();
      check('... e o botão cabe no painel, sem rolar', rb.bottom <= rp.bottom + 1 && rb.top >= rp.top,
            Math.round(rb.top) + '-' + Math.round(rb.bottom) + ' em ' + Math.round(rp.top) + '-' + Math.round(rp.bottom));
      check('... e o Game não deixa entrar', G.entrarNaSala() === false && U.telaAtual() === 'antessala' && !!G.esperaVida());
      return foto('porta-zero');
    }).then(function () {
      relogio += 1000;
      return ate(function () { return / 1 s$/.test(portaBotao().textContent); }, 3000);
    }).then(function (ok) {
      check('1 s depois: falta 1 s', ok, portaBotao().textContent);
      relogio += 1000;
      return ate(function () { return !portaBotao().classList.contains('is-apagado'); }, 3000);
    }).then(function (ok) {
      check('2 s depois o herói tem 1 PV e a porta acende ("Entrar na batalha")', ok && portaBotao().textContent === 'Entrar na batalha' &&
            G.vidaNaEspera()[0].hp === 1, portaBotao().textContent);
      // de novo a 0, e a poção em vez do tempo
      relogio -= 2000;
      return ate(function () { return portaBotao().classList.contains('is-apagado'); }, 3000);
    }).then(function (ok) {
      check('de volta ao instante do fim: apagada de novo', ok);
      linhaVida(principal.chave).querySelector('.vh-pocao[data-pocao="' + PEQ + '"]').click();
      return ate(function () { return !portaBotao().classList.contains('is-apagado'); }, 4000);
    }).then(function (ok) {
      check('a Pequena bebida no quadro levanta o herói (30 PV) e acende a porta sem esperar',
            ok && P.consumivelVer(PEQ) === 1 && G.vidaNaEspera()[0].hp === 30, G.vidaNaEspera()[0].hp + ' · ' + P.consumivelVer(PEQ));
      return foto('porta-bebeu');
    }).then(function () {
      var esperado = {};
      G.vidaNaEspera().forEach(function (v) { esperado[v.heroId] = v.hp; });
      portaBotao().click();
      return ate(function () { return U.telaAtual() === 'battle' && G.state && G.state.phase === 'placing'; }, 60000).then(function (ok) {
        var hs = ok ? G.state.units.filter(function (u) { return u.kind === 'hero' && u.side === 'player'; }) : [];
        check('a batalha da sala 2 nasce com a vida da porta de cada herói', ok && hs.length === heroisIds.length &&
              hs.every(function (u) { return u.hp === Math.min(u.hpMax, esperado[u.heroId || u.defId]); }),
              hs.map(function (u) { return (u.heroId || u.defId) + ' ' + u.hp + '/' + u.hpMax; }).join(' ') + ' · ' + JSON.stringify(esperado));
        G._relogioVida = null;
        var fora = G.abandonar();
        check('abandonar leva à praça e a descida acaba (sem sala de espera)', fora && G.vidaNaEspera().length === 0);
      });
    });
  }
})();
</script>
</body>
</html>
