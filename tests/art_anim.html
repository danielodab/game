<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOTERRA 2.0 — Ciclos de Animação (JOGO.Art)</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --ink:#e8e0d0; --dim:#8b93a0; --ok:#5fd08a; --bad:#ff6b5a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.45 'Segoe UI', system-ui, Arial, sans-serif; }
  header { position:sticky; top:0; z-index:10; background:#0b0e12; border-bottom:1px solid #262d38;
           padding:10px 16px; display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  h1 { font:600 17px Georgia, serif; margin:0; }
  h2 { font:600 15px Georgia, serif; margin:0 0 2px; color:#ffd08a; }
  #verdict { font-weight:700; padding:4px 12px; border-radius:6px; }
  #verdict.pass { background:rgba(95,208,138,.16); color:var(--ok); border:1px solid var(--ok); }
  #verdict.fail { background:rgba(255,107,90,.16); color:var(--bad); border:1px solid var(--bad); }
  .meta { color:var(--dim); font-size:12px; }
  section { padding:12px 16px 18px; border-bottom:1px solid #1e242e; }
  .hint { color:var(--dim); font-size:12px; margin-bottom:8px; }
  .cyc { display:flex; align-items:flex-end; gap:4px; margin-bottom:10px; flex-wrap:wrap; }
  .fr { position:relative; background:
      radial-gradient(ellipse 52% 22% at 50% 92%, rgba(0,0,0,.55), transparent 70%),
      linear-gradient(180deg,#212a36,#141a22);
      border:1px solid #262d38; border-radius:8px; padding:2px; }
  .fr canvas { display:block; }
  .fr b { position:absolute; left:3px; top:2px; font:700 9px monospace; color:#5a6472; }
  .cyc-lb { width:92px; flex:0 0 auto; font:600 12px 'Segoe UI'; color:#9fb0c0;
            text-align:right; padding-right:6px; padding-bottom:8px; }
  .live { display:flex; gap:16px; align-items:flex-end; flex-wrap:wrap; }
  .live .fr { border-color:#3a4553; }
  .live .cap { text-align:center; font:11px monospace; color:var(--dim); padding-top:3px; }
  .big { display:flex; gap:20px; align-items:flex-end; flex-wrap:wrap; }
  .tile-ref { position:relative; }
  .tile-ref .t { position:absolute; left:50%; bottom:14px; transform:translateX(-50%); opacity:.9; }
  .tile-ref .u { position:relative; }
  #results { padding:10px 16px; font-size:12px; color:var(--dim); }
  #results .f { color:var(--bad); display:block; }
</style>
</head>
<body>
<header>
  <h1>Ciclos de Animação — <span style="color:#9fb0c0">JOGO.Art</span></h1>
  <span id="verdict">…</span>
  <span class="meta" id="meta"></span>
  <label class="meta"><input type="checkbox" id="play" checked> animar</label>
</header>
<div id="app"></div>
<div id="results"></div>

<script src="../js/core/data/elements.js?v=9"></script>
<script src="../js/core/data/classes.js?v=9"></script>
<script src="../js/core/data/progression.js?v=9"></script>
<script src="../js/core/data/spells.js?v=9"></script>
<script src="../js/core/data/fusions.js?v=9"></script>
<script src="../js/render2d/art.js?v=9"></script>
<script>
(function () {
  var app = document.getElementById('app');
  var Art = JOGO.Art, D = JOGO.DATA || {};
  var R = { passed: 0, failed: 0, failures: [] };
  function check(n, c, d) {
    if (c) R.passed++; else { R.failed++; R.failures.push(n + (d ? ' — ' + d : '')); }
    return !!c;
  }
  function el(t, c, h) { var e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; }
  function inked(cv) {
    try {
      var g = cv.getContext('2d');
      var d = g.getImageData(0, 0, cv.width, cv.height).data, i, n = 0;
      for (i = 3; i < d.length; i += 4 * 11) if (d[i] > 24) n++;
      return n > 20;
    } catch (e) { return false; }
  }
  // dois quadros são realmente diferentes? (prova de que a perna se mexeu)
  function differs(a, b) {
    try {
      var ga = a.getContext('2d').getImageData(0, 0, a.width, a.height).data;
      var gb = b.getContext('2d').getImageData(0, 0, b.width, b.height).data;
      var n = 0, i;
      for (i = 0; i < ga.length; i += 4 * 7) if (Math.abs(ga[i + 3] - gb[i + 3]) > 40) n++;
      return n;
    } catch (e) { return 0; }
  }

  var CLASSES = Art.classIds().filter(function (c) { return !/^fus/.test(c); });
  var only = (location.search.match(/[?&]classe=([a-z]+)/) || [])[1];
  if (only) CLASSES = CLASSES.filter(function (c) { return c === only; });
  var POSES = Art.poseInfo();
  var ORDER = ['idle', 'andar', 'atacar', 'conjurar', 'dano', 'morte'];
  var t0 = performance.now();
  var liveNodes = [];

  check('API Art.poseInfo', typeof Art.poseInfo === 'function');
  check('API Art.unitFrames', typeof Art.unitFrames === 'function');
  check('ciclos exigidos existem',
    ORDER.every(function (p) { return !!POSES[p]; }), Object.keys(POSES).join(','));

  CLASSES.forEach(function (cid) {
    var s = el('section');
    var cd = D.classes && D.classes[cid];
    s.appendChild(el('h2', null, ((cd && cd.name) || cid) + ' — <span style="color:#8b93a0;font-size:12px">' + cid + '</span>'));
    s.appendChild(el('div', 'hint',
      'Cada fileira é um ciclo quadro a quadro. À direita, o mesmo boneco animando em tamanho de jogo.'));

    var wrap = el('div');
    wrap.style.display = 'flex';
    wrap.style.gap = '20px';
    wrap.style.flexWrap = 'wrap';

    var rows = el('div');
    ORDER.forEach(function (fase) {
      var cyc = el('div', 'cyc');
      cyc.appendChild(el('div', 'cyc-lb', POSES[fase].name + '<br><span style="color:#5a6472">' +
        POSES[fase].frames + ' q · ' + POSES[fase].fps + ' fps</span>'));
      var frames = Art.unitFrames(cid, { element: 'neutro', dir: 0, scale: 0.62 }, fase);
      var moved = 0;
      frames.forEach(function (cv, i) {
        var f = el('div', 'fr');
        f.appendChild(Art.node(cv, 100));
        f.appendChild(el('b', null, String(i)));
        cyc.appendChild(f);
        if (i > 0) moved += differs(frames[i - 1], cv);
      });
      check(cid + ' · ' + fase + ': quadros desenhados', frames.every(inked));
      check(cid + ' · ' + fase + ': o corpo REALMENTE se move entre quadros', moved > 30, 'pixels mudados: ' + moved);
      rows.appendChild(cyc);
    });
    wrap.appendChild(rows);

    // ---- prévia animada, em tamanho de jogo, sobre um losango de chão
    var live = el('div', 'live');
    ['andar', 'atacar', 'idle'].forEach(function (fase) {
      var box = el('div');
      var tr = el('div', 'fr tile-ref');
      var tl = Art.node(Art.tile('estufa', 0), 128);
      tl.className = 't';
      tr.appendChild(tl);
      var holder = el('div', 'u');
      holder.style.width = '160px';
      holder.style.height = '200px';
      tr.appendChild(holder);
      box.appendChild(tr);
      box.appendChild(el('div', 'cap', fase + ' · tamanho de jogo'));
      live.appendChild(box);
      liveNodes.push({ holder: holder, cid: cid, fase: fase, n: POSES[fase].frames, fps: POSES[fase].fps, cur: -1 });
    });
    wrap.appendChild(live);
    s.appendChild(wrap);

    // ---- ampliação para julgar o traço
    var big = el('div', 'big');
    big.style.marginTop = '12px';
    [['idle', 0], ['atacar', 3], ['andar', 2]].forEach(function (p) {
      var f = el('div', 'fr');
      f.appendChild(Art.node(Art.unit(cid, { element: 'neutro', dir: 0, pose: { fase: p[0], frame: p[1] } }), 320));
      f.appendChild(el('b', null, p[0] + ' ' + p[1]));
      big.appendChild(f);
    });
    ['fogo', 'agua', 'terra', 'ar'].forEach(function (e) {
      var f = el('div', 'fr');
      f.appendChild(Art.node(Art.unit(cid, { element: e, dir: 0, pose: { fase: 'idle', frame: 0 } }), 150));
      f.appendChild(el('b', null, e));
      big.appendChild(f);
    });
    s.appendChild(big);
    app.appendChild(s);
  });

  // ------------------------------------------------------------ animação viva
  var playing = document.getElementById('play');
  var acc = 0, last = performance.now();
  function tick(now) {
    var dt = Math.min((now - last) / 1000, 0.25);
    last = now;
    if (playing.checked) {
      acc += dt;
      for (var i = 0; i < liveNodes.length; i++) {
        var L = liveNodes[i];
        var fr = Math.floor(acc * L.fps) % L.n;
        if (fr === L.cur) continue;
        L.cur = fr;
        var cv = Art.unit(L.cid, { element: 'neutro', dir: 0, pose: { fase: L.fase, frame: fr } });
        while (L.holder.firstChild) L.holder.removeChild(L.holder.firstChild);
        L.holder.appendChild(Art.node(cv, 160));
      }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  var dt = Math.round(performance.now() - t0);
  document.getElementById('meta').textContent =
    R.passed + ' ok · ' + R.failed + ' falhas · ' + dt + ' ms · ' + Art.stats().entries + ' texturas';
  var v = document.getElementById('verdict');
  v.textContent = R.failed === 0 ? 'PASS' : 'FAIL (' + R.failed + ')';
  v.className = R.failed === 0 ? 'pass' : 'fail';
  document.getElementById('results').innerHTML = R.failures.length
    ? '<b>Falhas:</b><br>' + R.failures.map(function (f) { return '<span class="f">✕ ' + f + '</span>'; }).join('')
    : 'Todas as verificações passaram.';
  window.TEST_RESULTS = R;
  window.ANIM_READY = true;
})();
</script>
</body>
</html>
