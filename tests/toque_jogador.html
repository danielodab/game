<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>SOTERRA — tocar no corpo de outro jogador abre o painel dele</title>
<style>
  html,body{margin:0;background:#0b0d10;color:#e8eef6;font:12px/1.5 system-ui,Segoe UI,sans-serif;overflow:hidden}
  #tela{position:fixed;left:0;top:0;width:1280px;height:720px;border:0;background:#000}
  #saida{position:fixed;left:1280px;top:0;right:0;bottom:0;overflow:auto;
         border-left:1px solid #2b3542;padding:8px;font:11px/1.5 monospace}
  #summary{padding:5px 8px;border-radius:5px;background:#1b222c;color:#cdd6e2;margin-bottom:6px}
  .allpass{background:#16241b !important;color:#7fe08a !important} .fail{background:#3d1414 !important;color:#f77 !important}
</style>
</head>
<body>
<!-- O TOQUE NO OUTRO JOGADOR (11/09, "clico em cima e não aparece esse menu —
     em cima do nome abre"). O index.html de verdade num quadro (1280x720;
     ?larg=390&alt=844 para o celular), com o save na memória e uma Rede de
     mentira pendurada por cima da de verdade: a Bia e a Cris "estão" na praça.
     A prova clica DE VERDADE — pointerdown e pointerup no canvas da praça, no
     ponto da tela onde o corpo aparece (Hub._naTela) —, sem chamar o
     aoTocarFantasma na mão como as provas de antes. Cobra:
       - tocar no CORPO da Bia abre o painel dela (com "Chamar para o grupo");
       - tocar no NOME também;
       - com a Cris logo atrás, na mesma linha, abre o da Bia (a mais perto);
       - tocar no chão vazio não abre painel de jogador nenhum. -->
<iframe id="tela"></iframe>
<div id="saida"><div id="summary">rodando…</div><pre id="log"></pre></div>

<script src="save_sandbox.js"></script>
<script>
(function () {
  'use strict';
  var NL = String.fromCharCode(10);
  var linhas = [], falhas = 0, total = 0, T0 = Date.now();
  function pinta() { document.getElementById('log').textContent = linhas.join(NL); }
  function diz(t) { linhas.push('  · ' + t); pinta(); }
  function check(nome, ok, extra) {
    total++; if (!ok) falhas++;
    linhas.push((ok ? 'PASSOU · ' : 'FALHOU · ') + nome + (extra !== undefined && extra !== '' ? '   [' + extra + ']' : ''));
    pinta();
  }
  function fim(motivo) {
    if (motivo) { total++; falhas++; linhas.push('FALHOU · ' + motivo); }
    linhas.push('(' + Math.round((Date.now() - T0) / 1000) + ' s no relógio da página)');
    pinta();
    var s = document.getElementById('summary');
    s.className = falhas ? 'fail' : 'allpass';
    s.textContent = falhas ? ('FALHOU — ' + falhas + ' de ' + total) : ('tudo passou (' + total + ')');
    window.__fail = falhas;
    window.__pronto = true;
  }
  function passo(ms) { return new Promise(function (r) { setTimeout(r, ms || 50); }); }
  function ate(cond, ms) {
    var t1 = Date.now();
    return new Promise(function (r) {
      (function volta() {
        var ok = false;
        try { ok = !!cond(); } catch (e) {}
        if (ok) return r(true);
        if (Date.now() - t1 > (ms || 20000)) return r(false);
        setTimeout(volta, 100);
      })();
    });
  }

  var mL = /[?&]larg=(\d+)/.exec(location.search), mA = /[?&]alt=(\d+)/.exec(location.search);
  var LARG = mL ? +mL[1] : 1280, ALT = mA ? +mA[1] : 720;
  var quadro = document.getElementById('tela');
  quadro.style.width = LARG + 'px';
  quadro.style.height = ALT + 'px';
  document.getElementById('saida').style.left = LARG + 'px';
  quadro.src = '../index.html?' + (LARG < 820 ? 'mobile=1&' : '') + 'sandbox=1&snap=1&toque-jogador';
  var w, doc, J, U, H;
  var perfilBia = { id: 'bia', nome: 'Bia', titulo: '', classe: 'arqueiro', sala: null, x: 0, z: 0 };
  var perfilCris = { id: 'cris', nome: 'Cris', titulo: '', classe: 'sumo', sala: null, x: 0, z: 0 };
  var naPraca = [];

  /* a Rede de mentira, por cima da de verdade (como a grupo_hud) */
  function dubleRede() {
    var R = J.Rede;
    R.entrar = function () { return true; };
    R.meuId = function () { return 'ana'; };
    R.meuCx = function () { return 'cxana'; };
    R.minhaSala = function () { return null; };
    R.pares = function () { return naPraca.slice(); };
    R.nomeDe = function (id) { return id === 'bia' ? 'Bia' : (id === 'cris' ? 'Cris' : 'Aventureiro'); };
    R.privado = function () { return true; };
    R.dirige = function () { return true; };
    R.sussurrar = function () { return true; };
    R.ultimaRecusa = function () { return null; };
    R.vigia = function () {}; R.solta = function () {};
    R.trocaManda = function () {};
    R.falar = function () { return true; };
    R.mover = function () {};
    R.guildaManda = function () {};
    R.estadoConexao = function () { return 'ligado'; };
    R.transporte = function () { return 'ws'; };
  }
  function painel() { return doc.querySelector('.screen-hub.is-on .hub-painel'); }
  function painelDe(nome) {
    var p = painel();
    return !!p && !p.classList.contains('is-off') && p.textContent.indexOf(nome) >= 0 && /Chamar para o grupo|Desafiar/.test(p.textContent);
  }
  function fechaPainel() {
    var p = painel();
    if (!p) return;
    var f = null;
    [].forEach.call(p.querySelectorAll('button'), function (b) { if (!f && /^Fechar$/.test((b.textContent || '').trim())) f = b; });
    if (f) f.click(); else p.classList.add('is-off');
  }
  function toca(pt) {
    var cv = doc.querySelector('canvas.hub-canvas');
    if (!cv || !pt) return false;
    var base = { clientX: pt.x, clientY: pt.y, bubbles: true, cancelable: true, pointerId: 1, isPrimary: true, button: 0, pointerType: 'mouse' };
    cv.dispatchEvent(new w.PointerEvent('pointerdown', base));
    cv.dispatchEvent(new w.PointerEvent('pointerup', base));
    return true;
  }
  function pt(txt, p) { return p ? txt + ' (' + Math.round(p.x) + ', ' + Math.round(p.y) + ')' : txt + ' (fora da tela)'; }

  var t0 = Date.now();
  (function espera() {
    var pronto = false;
    try {
      J = quadro.contentWindow.JOGO;
      pronto = !!(J && J.Models3D2 && J.Models3D2.isReady() && J.Renderer && J.Renderer.isReady() &&
                  J.UI && J.Hub && J.Hub._naTela && J.Rede && J.DB);
    } catch (e) {}
    if (!pronto) {
      if (Date.now() - t0 > 110000) return fim('o jogo não abriu dentro do quadro em 110 s (ou falta o Hub._naTela)');
      return setTimeout(espera, 250);
    }
    w = quadro.contentWindow; doc = quadro.contentDocument; U = J.UI; H = J.Hub;
    diz('o jogo abriu em ' + Math.round((Date.now() - t0) / 1000) + ' s · ' + w.innerWidth + 'x' + w.innerHeight);
    try {
      var suf = (J.Contas && J.Contas.sufixo) ? J.Contas.sufixo() : '';
      w.localStorage.setItem('soterra-tutor-v1' + suf, JSON.stringify({ vistos: {}, off: true }));
    } catch (e) {}
    var P = J.Progress;
    var ids = P.heroIds().filter(function (h) { return h !== 'gm'; });
    if (!ids.length) { P.createHero('sumo'); ids = P.heroIds().filter(function (h) { return h !== 'gm'; }); }
    U.selection(ids.slice(0, 1));
    dubleRede();
    J.DB.batizar('Ana').then(praca).then(function () { fim(); })
      .catch(function (e) { fim('o roteiro estourou: ' + (e && (e.stack || e.message) || e)); });
  })();

  function praca() {
    U.showScreen('hub');
    return ate(function () { var e = H._estado(); return !!(e && e.pos && H.aoTocarFantasma); }, 30000).then(function (ok) {
      check('(o Acampamento abriu, com o toque nos jogadores ligado)', ok);
      if (!ok) throw new Error('sem a praça');
      // a Bia a 3 m à frente do herói (a câmera nasce às costas dele)
      var hp = H._estado().pos;
      perfilBia.x = hp.x + 0.8; perfilBia.z = hp.z - 3.2;
      naPraca = [perfilBia];
      H.fantasmaSai('bia');
      H.fantasmaEntra('bia', perfilBia);
      return ate(function () { return !!H._corpoFantasma('bia') && !!H._naTela('bia', 'corpo'); }, 20000);
    }).then(function (temCorpo) {
      check('(a Bia tem corpo na praça)', temCorpo, H._corpoFantasma('bia') || '');
      return passo(400);
    }).then(function () {
      fechaPainel();
      var p = H._naTela('bia', 'corpo');
      toca(p);
      check('tocar no CORPO da Bia abre o painel dela', painelDe('Bia'), pt('toque no corpo', p) + ' · painel: ' +
            ((painel() && !painel().classList.contains('is-off')) ? painel().textContent.slice(0, 50) : '(fechado)'));
      fechaPainel();
      var pn = H._naTela('bia', 'nome');
      toca(pn);
      check('tocar no NOME da Bia também abre', painelDe('Bia'), pt('toque no nome', pn));
      fechaPainel();
      // a Cris logo ATRÁS da Bia, na mesma linha da câmera
      perfilCris.x = perfilBia.x; perfilCris.z = perfilBia.z - 2.2;
      naPraca = [perfilBia, perfilCris];
      H.fantasmaEntra('cris', perfilCris);
      return ate(function () { return !!H._corpoFantasma('cris'); }, 20000);
    }).then(function (temCris) {
      check('(a Cris tem corpo, atrás da Bia)', temCris);
      return passo(300);
    }).then(function () {
      var p = H._naTela('bia', 'corpo');
      toca(p);
      check('com a Cris logo atrás, o toque na Bia abre o painel da BIA (a mais perto da câmera)', painelDe('Bia') && !painelDe('Cris'),
            pt('toque', p));
      fechaPainel();
      // o chão vazio: um canto de baixo do canvas, longe dos dois
      var cv = doc.querySelector('canvas.hub-canvas'), r = cv.getBoundingClientRect();
      var vazio = { x: r.left + r.width * 0.12, y: r.top + r.height * 0.78 };
      toca(vazio);
      check('tocar no chão vazio não abre painel de jogador nenhum', !painelDe('Bia') && !painelDe('Cris'), pt('toque no chão', vazio));
      // para a foto: o painel da Bia aberto
      return passo(900).then(function () { toca(H._naTela('bia', 'corpo')); return passo(300); });
    });
  }
})();
</script>
</body>
</html>
