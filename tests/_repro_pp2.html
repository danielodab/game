<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>repro pp fusao — pilha completa</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="app">
  <canvas id="game-canvas"></canvas>
  <div id="ui-root"></div>
</div>
<div id="summary" style="position:fixed;left:0;bottom:0;z-index:99999;background:#000;color:#0f0;font:12px monospace;padding:4px">rodando...</div>
<pre id="out" style="position:fixed;right:0;top:0;z-index:99999;background:#000;color:#0f0;font:11px monospace;max-height:100%;overflow:auto"></pre>

<script src="save_sandbox.js"></script>
<script>
(function () {
  var v = '?v=' + Date.now();
  var files = [
    'vendor/three.min.js', 'vendor/GLTFLoader.js', 'vendor/CopyShader.js',
    'vendor/LuminosityHighPassShader.js', 'vendor/EffectComposer.js',
    'vendor/RenderPass.js', 'vendor/ShaderPass.js', 'vendor/UnrealBloomPass.js',
    'js/core/data/elements.js', 'js/core/data/classes.js', 'js/core/data/spells.js',
    'js/core/data/progression.js', 'js/core/data/monsters.js', 'js/core/data/dungeons.js',
    'js/core/data/fusions.js', 'js/core/data/pets.js', 'js/core/data/items.js',
    'js/core/engine.js', 'js/core/fusion.js', 'js/core/ai.js',
    'js/core/progress.js', 'js/core/game.js',
    'assets/embedded/env-kit.js', 'js/render3d/models3d.js',
    'assets/embedded/models-anims.js', 'assets/embedded/models-heroes.js',
    'assets/embedded/models-monsters.js',
    'js/render3d/models3d_v2.js', 'js/render3d/fx3d_v2.js', 'js/render3d/renderer3d_v2.js',
    'js/render2d/art.js', 'js/render3d/portraits3d.js',
    'js/ui/hud.js'
  ];
  for (var i = 0; i < files.length; i++) {
    document.write('<scr' + 'ipt src="../' + files[i] + v + '"></scr' + 'ipt>');
  }
})();
</script>

<script>
window.addEventListener('load', function () { setTimeout(run, 120); });

function run() {
  var J = window.JOGO, out = [], vt = 0, erros = [];
  function L(s) { out.push(s); }
  function flush() {
    document.getElementById('out').textContent = out.join('\n');
  }

  try { J.Renderer.init(document.getElementById('game-canvas')); } catch (e) { L('Renderer.init: ' + e); }
  try { J.UI.init(); } catch (e) { L('UI.init: ' + e); }
  try { J.Game.init(); } catch (e) { L('Game.init: ' + e); }

  J.Game._setClock(function () { return vt; });

  function drain() {
    var e = J.Engine;
    while (e.events.length) {
      var ev = e.events.shift();
      try { J.Renderer.handleEvent(ev); } catch (x) { erros.push('Renderer.handleEvent ' + ev.type + ': ' + x); }
      try { J.FX.handleEvent(ev); } catch (x) { erros.push('FX.handleEvent ' + ev.type + ': ' + x); }
      try { J.UI.handleEvent(ev); } catch (x) { erros.push('UI.handleEvent ' + ev.type + ': ' + x); }
      try { J.Game.handleEvent(ev); } catch (x) { erros.push('Game.handleEvent ' + ev.type + ': ' + x); }
    }
  }
  function pump(n) {
    for (var i = 0; i < (n || 1); i++) {
      vt += 0.016; drain();
      try { J.Game.update(0.016); } catch (x) { erros.push('Game.update: ' + (x && x.stack || x)); }
      try { J.UI.update(0.016); } catch (x) { erros.push('UI.update: ' + (x && x.stack || x)); }
      try { J.Renderer.render(0.016); } catch (x) { erros.push('Renderer.render: ' + (x && x.stack || x)); }
      drain();
    }
  }

  // ---- o que o JOGADOR VÊ no HUD para PP
  function hudPP() {
    var w = document.querySelector('.pp-res');
    if (!w) return 'sem .pp-res';
    var on = w.querySelectorAll('.pip.on').length, tot = w.querySelectorAll('.pip').length;
    var why = w.querySelector('.res-why');
    return on + '/' + tot + (why ? ' [' + why.textContent + ']' : '');
  }
  function casasAndaveis() {
    // quantas casas o renderizador acende para caminhar
    try { return (J.Engine.reachable(J.Game.state, J.Engine.activeUnit(J.Game.state).uid) || []).length; }
    catch (e) { return -1; }
  }

  var P = J.Progress, lvl = 10;
  P.reset();
  var tbl = J.DATA.leveling.xpTable;
  P.addXp('sumo', tbl[lvl - 1]); P.addXp('curandeira', tbl[lvl - 1]);
  P.chooseElement('sumo', 'fogo'); P.chooseElement('curandeira', 'agua');
  J.Game.startRun(['sumo', 'curandeira'], 'greenhouse');
  pump(20);

  var st = J.Game.state, guard = 0, fundiu = false, turnos = 0, visto = {};

  while (st.phase === 'playing' && guard++ < 20000 && turnos < 14) {
    pump(1);
    if (J.Game.screen !== 'battle') { L('saiu da batalha: ' + J.Game.screen); break; }
    if (st.phase !== 'playing') break;
    if (!J.Game.isPlayerTurn()) continue;
    if (J.Renderer.isBusy && J.Renderer.isBusy()) continue;

    var u = J.Engine.activeUnit(st);
    if (!u) break;

    var ch = u.uid + '#' + st.round;
    if (!visto[ch]) {
      visto[ch] = 1;
      if (u.kind === 'fusion') {
        turnos++;
        pump(2);                       // deixa o HUD repintar
        L('[fusao ' + turnos + '] r' + st.round + '  motor pp=' + u.pp + '/' + u.ppMax +
          '  HUD=' + hudPP() + '  casas=' + casasAndaveis() +
          '  hp=' + u.hp + '  erros=' + erros.length);
      } else {
        L('[' + u.name + '] r' + st.round + ' motor pp=' + u.pp + '/' + u.ppMax +
          ' HUD=' + hudPP() + ' casas=' + casasAndaveis());
      }
    }

    if (!fundiu) {
      var pares = J.Game.canFuse() || [];
      if (pares.length) {
        L('>>> FUNDIR ' + pares[0].uidA + '+' + pares[0].uidB);
        J.Game.declareFusion(pares[0].uidA, pares[0].uidB);
        fundiu = true;
        pump(60);
        continue;
      }
      var outro = null;
      for (var i = 0; i < st.units.length; i++) {
        var o = st.units[i];
        if (o.kind === 'hero' && o.alive && !o.offBoard && o.uid !== u.uid) outro = o;
      }
      if (outro) {
        var rc = J.Engine.reachable(st, u.uid) || [], mel = null, bd = 1e9;
        for (var r = 0; r < rc.length; r++) {
          var dd = Math.abs(rc[r].x - outro.x) + Math.abs(rc[r].y - outro.y);
          if (dd < bd) { bd = dd; mel = rc[r]; }
        }
        if (mel) { J.Game.onTileClicked(mel.x, mel.y); pump(40); }
      }
      J.Game.endTurn();
      pump(10);
      continue;
    }

    // já fundido: joga como jogador — plano da IA pela porta do jogador
    var plano = [];
    try { plano = J.AI.planTurn(st, u.uid) || []; } catch (e) { plano = []; }
    for (var p = 0; p < plano.length && st.phase === 'playing'; p++) {
      var ac = plano[p];
      if (ac.action === 'move') { J.Game.onTileClicked(ac.x, ac.y); pump(40); }
      else if (ac.action === 'cast') {
        J.Game.selectSpell(ac.spellId); J.Game.onTileClicked(ac.x, ac.y);
        J.Game.selectSpell(null); pump(50);
      } else break;
    }
    if (st.phase === 'playing' && J.Game.isPlayerTurn()) { J.Game.endTurn(); pump(10); }
  }

  L('');
  L('fim: phase=' + st.phase + ' rodada=' + st.round + ' turnos de fusao=' + turnos);
  L('ERROS capturados: ' + erros.length);
  for (var q = 0; q < Math.min(erros.length, 12); q++) L('  ! ' + erros[q]);
  flush();
  document.getElementById('summary').textContent =
    'turnos=' + turnos + ' erros=' + erros.length;
  document.title = 'PRONTO';
}
</script>
</body>
</html>
