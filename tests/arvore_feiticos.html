<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>SOTERRA 2.0 — árvore de feitiços como aba de Personagens</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  body{margin:0;background:#0f1216;color:#e8eef6;font:13px/1.5 system-ui,Segoe UI,sans-serif}
  h1{font-size:15px;margin:10px 16px 2px}
  #summary{font:12px monospace;margin:6px 16px;padding:6px 10px;border-radius:6px}
  .allpass{background:#16241b;color:#7fe08a} .fail{background:#3d1414;color:#f77}
  ul{margin:4px 16px;padding-left:18px;font-size:12px} li.pass{color:#8fc79b} li.fail{color:#f88}
</style>
</head>
<body>
<h1>Árvore de feitiços — a aba nova de "Personagens"</h1>
<div id="summary">rodando…</div>
<ul id="lista"></ul>
<div id="ui-root"></div>

<script src="save_sandbox.js"></script>
<script>
  window.__V = '?v=' + Date.now();
  var arqs = ['js/core/data/elements.js','js/core/data/classes.js','js/core/data/spells.js',
    'js/core/data/progression.js','js/core/data/monsters.js','js/core/data/dungeons.js',
    'js/core/data/fusions.js','js/core/data/pets.js','js/core/data/items.js','js/core/data/items_extra.js',
    'js/core/engine.js','js/core/fusion.js','js/core/ai.js','js/core/progress.js',
    'js/core/game.js',
    // A pilha 3D INTEIRA. Sem ela o art.js cai no desenho 2D antigo e a foto
    // do teste mostra um personagem que o jogo nao usa mais.
    'vendor/three.min.js','vendor/GLTFLoader.js',
    'assets/embedded/models-anims.js','assets/embedded/models-heroes.js','assets/embedded/models-meshy.js',
    'assets/embedded/models-monsters.js','assets/embedded/models-bosses.js','assets/embedded/models-summons.js','js/render3d/models3d_v2.js',
    'js/render2d/art.js','js/render3d/portraits3d.js','js/ui/hud.js'];
  for (var i=0;i<arqs.length;i++) document.write('<scr'+'ipt src="../'+arqs[i]+window.__V+'"></scr'+'ipt>');
</script>

<script>
(function () {
  'use strict';
  var okN = 0, falhas = [];
  function check(nome, cond, extra) {
    var li = document.createElement('li');
    li.className = cond ? 'pass' : 'fail';
    li.textContent = nome + (extra ? ' — ' + extra : '');
    document.getElementById('lista').appendChild(li);
    if (cond) okN++; else falhas.push(nome);
  }

  function comModelosProntos(cb) {
    var M = JOGO.Models3D2, t0 = Date.now();
    (function espera() {
      if (M && M.isReady && M.isReady()) return cb();
      if (M && M.load) M.load(function () {});
      if (Date.now() - t0 < 40000) return setTimeout(espera, 200);
      cb();                                   // segue mesmo assim: o teste acusa
    })();
  }

  window.addEventListener('DOMContentLoaded', function () {
   comModelosProntos(function () {
    var D = JOGO.DATA, P = JOGO.Progress, S = D.spells, CL = D.classes;
    var ELEMS = ['fogo','agua','terra','ar'];

    // 1. Os degraus da grade saem dos DADOS. Se a escada da classe mudar de
    //    novo, a árvore acompanha sozinha — é o que este teste cobra.
    var todasOk = true, detalhe = '';
    Object.keys(CL).forEach(function (cid) {
      var def = CL[cid];
      var porElem = {};
      ELEMS.forEach(function (e) {
        porElem[e] = ((def.paths||{})[e]||[]).map(function (sid) {
          return (S[sid]||{}).unlockLevel || 0;
        }).sort(function(a,b){return a-b;}).join(',');
      });
      var ref = porElem.fogo;
      ELEMS.forEach(function (e) {
        if (porElem[e] !== ref) { todasOk = false; detalhe = cid + ' ' + e + '=' + porElem[e] + ' vs fogo=' + ref; }
      });
    });
    check('os quatro galhos de cada classe abrem nos MESMOS níveis (a grade não fica com buraco)',
          todasOk, detalhe || 'nenhum descompasso');

    // 2. Todo feitiço de caminho tem unlockLevel — sem isso a célula cai na linha errada
    var semNivel = [];
    Object.keys(CL).forEach(function (cid) {
      ELEMS.forEach(function (e) {
        ((CL[cid].paths||{})[e]||[]).forEach(function (sid) {
          if (!S[sid] || !S[sid].unlockLevel) semNivel.push(sid);
        });
      });
    });
    check('todo feitiço de galho declara unlockLevel', semNivel.length === 0,
          semNivel.length ? semNivel.slice(0,4).join(', ') : Object.keys(CL).length + ' classes');

    // 3. Todo feitiço mostrado tem descrição — a célula existe para ser LIDA
    var semDesc = [];
    Object.keys(CL).forEach(function (cid) {
      var def = CL[cid];
      (def.baseSpells||[]).concat(ELEMS.reduce(function (a,e) {
        return a.concat((def.paths||{})[e]||[]);
      }, [])).forEach(function (sid) {
        if (!S[sid] || !S[sid].description) semDesc.push(sid);
      });
    });
    check('todo feitiço da árvore tem descrição', semDesc.length === 0,
          semDesc.length ? semDesc.length + ' sem texto: ' + semDesc.slice(0,3).join(', ') : 'todos descritos');

    // 4. A aba existe e é uma DAS QUATRO — o pedido era menus separados
    var H = JOGO.UI;
    check('o HUD carregou', !!(H && H.openSheet), H ? 'ok' : 'ausente');
    if (H && H.init) { try { H.init(); } catch (e) {} }

    // 5. A tela abre sem estourar, nos três estados que importam:
    //    nível 1 (nada escolhido), nível 5 (na escolha), nível 30 com elemento.
    var estados = [
      { lv: 1,  el: null,   nome: 'nível 1, sem elemento' },
      { lv: 5,  el: null,   nome: 'nível 5, na hora da escolha' },
      { lv: 30, el: 'fogo', nome: 'nível 30, galho de fogo' }
    ];
    estados.forEach(function (st) {
      var erro = null;
      try {
        var save = P.load();
        var hid = Object.keys(save.heroes || {})[0];
        if (hid) {
          save.heroes[hid].level = st.lv;
          save.heroes[hid].element = st.el || 'neutro';
          P.save(save);
        }
        if (H && H.openSheet) H.openSheet('spells');
      } catch (e) { erro = e.message; }
      var grade = document.querySelector('.tree-grid');
      var celulas = document.querySelectorAll('.tree-cell').length;
      // Cobrar só "não estourou" deixava o teste passar com a tela VAZIA.
      check('a árvore abre com ' + st.nome + ' e monta as casas',
            !erro && !!grade && celulas > 0,
            erro || (grade ? celulas + ' casas' : 'não montou a grade'));
    });

    // 6. A grade tem uma linha por degrau e 4 colunas
    // O retrato do carrossel tem de vir do 3D. Ja mandei foto do 2D antigo por
    // ter montado a pagina sem esta camada; agora o teste nao deixa repetir.
    var P3 = JOGO.Portraits3D, M3 = JOGO.Models3D2, A3 = JOGO.Art;
    check('a camada de retrato 3D esta carregada', !!(M3 && P3 && A3),
          (M3 ? 'modelos ok' : 'SEM modelos3d_v2') + ' · ' +
          (P3 ? 'retratos ok' : 'SEM portraits3d'));
    // Conferir só que o módulo existe deixou passar uma foto com o boneco 2D:
    // o que importa é o pixel QUE FOI PARAR NA TELA. Comparo a figura do
    // carrossel com o render 3D direto do modelo.
    check('o retrato do carrossel é o do MODELO 3D, não o desenho 2D',
          !!(A3 && A3.__portrait3dWrapped), A3 && A3.__portrait3dWrapped
            ? 'Art.unit embrulhado' : 'Art.unit AINDA no 2D');
    var direto3d = null, viaArt = null;
    // mesmas opcoes dos dois lados: o elemento muda o fundo do retrato
    try { direto3d = M3.portrait('sumo', { size: 256, corpoInteiro: true, element: 'fogo' }); } catch (e) {}
    try { viaArt = A3.unit('sumo', { element: 'fogo', dir: 0, scale: 0.6 }); } catch (e) {}
    function assina(cv) {
      if (!cv) return 'nulo';
      var cc = document.createElement('canvas'); cc.width = 16; cc.height = 16;
      var gg = cc.getContext('2d'); gg.drawImage(cv, 0, 0, 16, 16);
      var dd = gg.getImageData(0, 0, 16, 16).data, acc = 0;
      for (var q = 0; q < dd.length; q += 4) acc = (acc * 31 + dd[q] + dd[q+1]*3 + dd[q+2]*7) % 1e9;
      return String(acc);
    }
    var s3 = assina(direto3d), sa = assina(viaArt);
    check('o boneco servido pelo Art.unit é pixel a pixel o do modelo 3D',
          s3 !== 'nulo' && s3 === sa, s3 === sa ? 'idênticos' : s3 + ' vs ' + sa);

    var linhas = document.querySelectorAll('.tree-grid .tree-row');
    var degrausRef = {};
    ELEMS.forEach(function (e) {
      ((CL[Object.keys(CL)[0]].paths||{})[e]||[]).forEach(function (sid) {
        if (S[sid] && S[sid].unlockLevel) degrausRef[S[sid].unlockLevel] = 1;
      });
    });
    var nDeg = Object.keys(degrausRef).length;
    check('a grade tem cabeçalho + um degrau por nível (' + nDeg + ')',
          linhas.length === nDeg + 1, linhas.length + ' linhas para ' + nDeg + ' degraus');

    var el = document.getElementById('summary');
    el.className = falhas.length ? 'fail' : 'allpass';
    el.textContent = (falhas.length ? 'FALHAS — ' : 'TUDO PASSOU — ') +
      okN + ' de ' + (okN + falhas.length) + ' checagens ok, ' + falhas.length + ' falharam';
    window.__pronto = true;
   });
  });
})();
</script>
</body>
</html>
