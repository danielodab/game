<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>SOTERRA — os corredores dos portais</title>
<style>
  html,body{margin:0;background:#0b0d10;color:#e8eef6;font:12px/1.5 system-ui,Segoe UI,sans-serif;overflow:hidden}
  #tela{position:fixed;left:0;top:0;width:1000px;height:720px;border:0;background:#000}
  #saida{position:fixed;left:1000px;top:0;right:0;bottom:0;overflow:auto;
         border-left:1px solid #2b3542;padding:8px;font:11px/1.5 monospace}
  #summary{padding:5px 8px;border-radius:5px;background:#1b222c;color:#cdd6e2;margin-bottom:6px}
  .allpass{background:#16241b !important;color:#7fe08a !important} .fail{background:#3d1414 !important;color:#f77 !important}
  .p{color:#7fe08a}.f{color:#ff8a7a}
</style>
</head>
<body>
<!-- OS CORREDORES DOS PORTAIS (12/09, dono: "coloque muros e faça um corredor,
     e nesse corredor ter alguns itens do mapa, e no fim de cada corredor o
     portal, e ao lado dele o Boss parado"). Esta prova abre o jogo de verdade
     e mede o corredor por NÚMERO, não por olho: a pista tem de estar livre de
     ponta a ponta (senão ninguém chega ao portal), os lados têm de barrar, a
     boca tem de estar aberta e o fundo fechado. Só os portais ABERTOS.
     19/09: o PORTÃO DO CAMPO DE PVP virou o sétimo dente do arco, com o mesmo corredor
     (dono: "os portais de calabouços e muros preciso manter nesse padrão"). A prova cobra
     do portão o que cobra dos portais — pista, muros, degrau, boca, fundo, alcance e a
     vizinhança com o portal 0 — menos o chefe (no lugar dele, bandeiras vermelhas na boca),
     e ao medir a folga da base do arco ignora os sólidos do próprio corredor. -->
<iframe id="tela" src="../index.html?sandbox=1"></iframe>
<div id="saida"><div id="summary">abrindo a praça…</div><div id="linhas"></div></div>
<script>
(function () {
  var f = document.getElementById('tela');
  var linhas = [], falhas = [];
  function check(nome, ok, extra) {
    linhas.push('<div class="' + (ok ? 'p' : 'f') + '">' + (ok ? 'PASSOU' : 'FALHOU') + ' · ' +
                nome + (extra ? ' (' + extra + ')' : '') + '</div>');
    if (!ok) falhas.push(nome);
  }
  function fecha() {
    document.getElementById('linhas').innerHTML = linhas.join('');
    var s = document.getElementById('summary');
    s.className = falhas.length ? 'fail' : 'allpass';
    s.textContent = falhas.length ? ('FALHOU: ' + falhas.join(' · '))
                                  : ('tudo passou (' + linhas.length + ')');
  }
  function espera(cond, ms, passo) {
    return new Promise(function (ok, nao) {
      var t0 = Date.now();
      (function tenta() {
        var r = false;
        try { r = cond(); } catch (e) {}
        if (r) return ok(r);
        if (Date.now() - t0 > ms) return nao(new Error('esperou demais'));
        setTimeout(tenta, passo || 400);
      })();
    });
  }

  f.onload = function () {
    var w = f.contentWindow, d = w.document;
    function botao(re) {
      return [].filter.call(d.querySelectorAll('button'), function (b) { return re.test(b.textContent); })[0] || null;
    }
    espera(function () { return !!d.querySelector('.screen-menu.is-on'); }, 60000)
      .then(function () { return w.JOGO.DB.batizar('Prova Corredor'); })
      .then(function () {
        botao(/^Descer$/).click();
        return espera(function () { return !!botao(/^Escolher$/); }, 20000);
      })
      .then(function () {
        botao(/^Escolher$/).click();
        return new Promise(function (r) { setTimeout(r, 400); });
      })
      .then(function () {
        botao(/Confirmar/).click();
        /* o corredor só nasce com as peças do calabouço na mão (sob demanda): cada portal ABERTO e, desde
         * 19/09, o portão do Campo. 20/09: o número de abertos não é mais dois — o Fecho de Brasa e os
         * Andaimes do Vento entraram —, então a sonda espera TODOS (parar em três pegava o mapa pela metade
         * e as réguas dos calabouços novos corriam antes do corredor deles existir). */
        return espera(function () {
          var H = w.JOGO.Hub;
          if (!H._corredores || !H._lugares) return false;
          var lugares = H._lugares();
          var ab = lugares.filter(function (l) { return l.tipo === 'portal' && !l.fechado; }).length;
          var pt = lugares.filter(function (l) { return l.tipo === 'campo' && l.portao; }).length;
          return (ab > 0 && H._corredores().length >= ab + pt) ? H : false;
        }, 120000, 800);
      })
      .then(function (H) {
        var L = H._lugares().filter(function (l) { return l.tipo === 'portal'; });
        var abertos = L.filter(function (l) { return !l.fechado; });
        var fechados = L.filter(function (l) { return l.fechado; });
        var S = H._solidos();
        /* 20/09, o dono, em dois tempos: primeiro "o campo pvp não vai ter esses muros, vou
         * fazer um específico para isso" (saíram os muros emprestados), depois, com a arte
         * pronta, "coloque os muros em volta desse caminho pro pvp e alguns enfeites no tema".
         * O portão tem corredor de novo — mas é o DELE: reto, aberto no fim, sem câmara, sem
         * degrau e sem fundo, porque o portal de espadas é mais largo que a pista. Por isso ele
         * não entra nas réguas dos portais de calabouço abaixo, e tem um bloco só dele. */
        var entrada = H._lugares().filter(function (l) { return l.tipo === 'campo'; })[0] || null;
        var portao = (entrada && entrada.portao) ? entrada : null;
        var corredores = H._corredores();

        check('todo portal ABERTO ganhou corredor (hoje são ' + abertos.length + ')',
              abertos.length >= 2 && abertos.every(function (l) { return corredores.indexOf(l.id) >= 0; }),
              corredores.join(','));
        check('o portão do Campo existe, veste o catálogo do dono e ganhou corredor (e mais ninguém)',
              !!portao && portao.tema === 'pvp' && corredores.indexOf('campo') >= 0 &&
              corredores.length === abertos.length + 1,
              (portao && portao.tema) + ' · ' + corredores.join(','));
        check('cada portal aberto tem o chefe dele parado ao lado (o portão não tem chefe)',
              H._chefesParados() === abertos.length, H._chefesParados() + ' chefes');
        check('a praça ganhou muros de verdade (sólidos avulsos)', S.length > 20, S.length);
        var doPortao = S.filter(function (s) { return s.dono === 'campo'; });
        check('os sólidos do corredor do portão levam o dono (muros, pilares, barreiras, bandeiras)',
              doPortao.length >= 14 && !entrada.solido, doPortao.length + ' sólidos · solido ' + (entrada && entrada.solido));

        // um ponto do MUNDO a partir de coordenadas do corredor
        function ponto(l, dd, lado) {
          var r = Math.hypot(l.x, l.z), ux = l.x / r, uz = l.z / r;
          return { x: l.x + ux * dd + (-uz) * lado, z: l.z + uz * dd + ux * lado };
        }
        function livre(p) {
          var q = H._empurra(p.x, p.z);
          return Math.abs(q.x - p.x) < 0.001 && Math.abs(q.z - p.z) < 0.001;
        }

        var M = H._corredorMedidas();
        check('as medidas do corredor estão expostas para a prova',
              M && M.larg > 0 && M.camLarg > M.larg && M.fundo > 0,
              JSON.stringify(M));

        // as réguas abaixo são as do corredor de CALABOUÇO (pista, câmara, degrau, fundo).
        // O portão do Campo tem as dele, logo depois — o corredor dele é reto e aberto.
        abertos.forEach(function (l) {
          var nome = l.id;
          // 1) a PISTA livre da boca até o fundo: é por ela que se anda, e
          //    agora ela segue livre DENTRO da câmara, atrás do portal
          var presos = [];
          for (var dd = -M.comp; dd <= M.fundo - 1.5; dd += 1) {
            if (!livre(ponto(l, dd, 0))) presos.push(Math.round(dd));
          }
          check(nome + ': a pista está livre da boca ao fundo',
                presos.length === 0, 'travou em d=' + presos.join(','));
          // 2) os MUROS barram — no corredor em |t| = larg, na câmara em
          //    |t| = camLarg. É o que faz dele corredor e não desenho.
          var vazados = [];
          [-12, -8, -5].forEach(function (dd) {
            [M.larg, -M.larg].forEach(function (lado) {
              if (livre(ponto(l, dd, lado))) vazados.push('corredor d=' + dd + '/' + lado);
            });
          });
          [-1, 2].forEach(function (dd) {
            [M.camLarg, -M.camLarg].forEach(function (lado) {
              if (livre(ponto(l, dd, lado))) vazados.push('câmara d=' + dd + '/' + lado);
            });
          });
          check(nome + ': os muros barram no corredor E na câmara',
                vazados.length === 0, 'vazou em ' + vazados.join(' '));
          // 3) o DEGRAU do alargamento fecha: sem ele a câmara abriria um
          //    vão de cada lado por onde se escapava do corredor
          var meio = (M.larg + M.camLarg) / 2;
          check(nome + ': o degrau da câmara está fechado',
                !livre(ponto(l, M.camDe, meio)) && !livre(ponto(l, M.camDe, -meio)));
          // 4) a BOCA aberta e o FUNDO fechado
          check(nome + ': a boca do corredor está aberta', livre(ponto(l, -M.comp - 2.5, 0)));
          check(nome + ': o fundo atrás do portal está fechado', !livre(ponto(l, M.fundo, 0)));
          // 5) o portal continua alcançável
          check(nome + ': dá para chegar a falar com o portal',
                livre(ponto(l, -1, 0)) && l.raio >= 4);
        });

        /* 5a) O CORREDOR DO PORTÃO (20/09, o dono: "coloque os muros em volta desse caminho
         *     pro pvp"). As réguas são outras: a pista murada vai da boca até o pé do arco,
         *     os muros barram dos dois lados ao longo dela, e o FIM É ABERTO — o portal de
         *     espadas tem 9,5 m de largura, então a fileira para antes dele, e é isso que se
         *     cobra: que em d = fim + 3 a linha do muro esteja livre dos dois lados. */
        if (portao) {
          var Mp = M.portao;
          check('as medidas do corredor do portão estão expostas',
                !!Mp && Mp.comp > M.comp && Mp.fim < 0, JSON.stringify(Mp || null));
          var presosP = [];
          for (var dp = -Mp.comp - 2; dp <= -2; dp += 1) {
            if (!livre(ponto(portao, dp, 0))) presosP.push(Math.round(dp));
          }
          check('portão: a pista está livre da boca até o pé do arco',
                presosP.length === 0, 'travou em d=' + presosP.join(','));
          var vazadosP = [];
          [-13, -10, -7].forEach(function (dp) {
            [M.larg, -M.larg].forEach(function (lado) {
              if (livre(ponto(portao, dp, lado))) vazadosP.push('d=' + dp + '/' + lado);
            });
          });
          check('portão: os muros barram dos dois lados ao longo do caminho',
                vazadosP.length === 0, 'vazou em ' + vazadosP.join(' '));
          check('portão: a boca está aberta', livre(ponto(portao, -Mp.comp - 2.5, 0)));
          check('portão: o fim é ABERTO — a fileira para antes do portal de espadas',
                livre(ponto(portao, Mp.fim + 3, M.larg)) && livre(ponto(portao, Mp.fim + 3, -M.larg)),
                'd=' + (Mp.fim + 3));
          check('portão: dá para chegar a falar com o arco',
                livre(ponto(portao, -1, 0)) && portao.raio >= 4);
          /* e o corredor do portão não encosta no do vizinho de arco (o portal 0): mede-se
           * muro a muro, o dele reto em |t| = larg contra a câmara do outro */
          var perto = 99, muros = [];
          for (var dm = -Mp.comp; dm <= Mp.fim + 0.01; dm += Mp.passo) muros.push(dm);
          abertos.forEach(function (l2) {
            muros.forEach(function (dp) {
              [M.larg, -M.larg].forEach(function (la) {
                [-12.5, -9.1, -5.7, -2.3, 1.1, 4.5].forEach(function (d2) {
                  [M.camLarg, -M.camLarg, M.larg, -M.larg].forEach(function (lb) {
                    var p1 = ponto(portao, dp, la), p2 = ponto(l2, d2, lb);
                    perto = Math.min(perto, Math.hypot(p1.x - p2.x, p1.z - p2.z));
                  });
                });
              });
            });
          });
          check('portão: o corredor dele não encosta no do vizinho de arco',
                perto > 3.4, 'muro mais próximo: ' + perto.toFixed(2) + ' m');
        }

        /* 5b) AS CÂMARAS NÃO SE ENCOSTAM. Os portais vizinhos do arco estão a
         *     19 m um do outro (19/09, R 58; eram 16,4 em R 50), e uma câmara
         *     larga demais fazia as saletas virarem uma parede corrida (medido:
         *     2,87 m entre muros com meia-largura 6,6). Cobra-se a folga entre
         *     o muro de um e o do vizinho na profundidade da câmara. O portão do Campo
         *     não entra aqui: ele não tem câmara, e a folga dele com o vizinho de arco
         *     sai medida em 5a, muro reto contra câmara. */
        var comCorredor = abertos.slice();   // o portão tem a régua dele, em 5a
        if (comCorredor.length >= 2) {
          function muroDe(l, dd, lado) { return ponto(l, dd, lado); }
          var pior = 99;
          comCorredor.forEach(function (a2, i2) {
            comCorredor.forEach(function (b2, j2) {
              if (j2 <= i2) return;
              [-1.4, 2, M.fundo].forEach(function (dd) {
                [M.camLarg, -M.camLarg].forEach(function (la) {
                  [M.camLarg, -M.camLarg].forEach(function (lb) {
                    var p1 = muroDe(a2, dd, la), p2 = muroDe(b2, dd, lb);
                    pior = Math.min(pior, Math.hypot(p1.x - p2.x, p1.z - p2.z));
                  });
                });
              });
            });
          });
          check('as câmaras de dois portais vizinhos não se encostam',
                pior > 3.4, 'muro mais próximo do vizinho: ' + pior.toFixed(2) + ' m');
        }

        /* 6) O CHEFE NÃO ENTRA NO MURO — o defeito que o dono fotografou.
         *    A conta é a do corpo medido: |t| + meia-largura de través tem de
         *    caber dentro da face interna do muro da câmara. */
        var fichas = H._chefesFicha ? H._chefesFicha() : [];
        check('a ficha de cada chefe plantado está exposta',
              fichas.length === abertos.length, fichas.length + ' de ' + abertos.length);
        var invasores = fichas.filter(function (f) {
          return Math.abs(f.t) + f.meiaT > M.camLarg - 0.35 + 0.001;
        });
        check('nenhum chefe atravessa o muro da câmara',
              invasores.length === 0,
              invasores.map(function (f) {
                return f.chefe + ' |t|=' + f.t.toFixed(2) + ' + meia=' + f.meiaT.toFixed(2) +
                       ' > ' + (M.camLarg - 0.35).toFixed(2);
              }).join(' · '));
        var noAro = fichas.filter(function (f) {
          return Math.hypot(f.d, f.t) < 2.6;      // o aro do portal tem ~2,2 de raio
        });
        check('nenhum chefe planta dentro do aro do portal', noAro.length === 0,
              noAro.map(function (f) { return f.chefe; }).join(','));
        check('todo chefe fica ATRÁS do portal (não tapa a entrada)',
              fichas.every(function (f) { return f.d > 0; }),
              fichas.map(function (f) { return f.chefe + ' d=' + f.d; }).join(' · '));

        fechados.forEach(function (l) {
          var temMuro = false;
          for (var dd = -12; dd <= 0; dd += 3) {
            if (!livre(ponto(l, dd, 4.2)) || !livre(ponto(l, dd, 6.6))) temMuro = true;
          }
          check('portal fechado (' + l.id + ') segue pelado', !temMuro);
        });

        /* 14/09: a ENTRADA DO CAMPO DE PVP não encosta em muro de corredor, pilar de boca
         * nem chefe: a base dela fica a 0,5 m ou mais de todo sólido avulso, e o meio dela
         * está livre. 19/09: a entrada virou o portão do arco com corredor próprio, então
         * a régua ignora os sólidos DELE (dono 'campo': o muro da fileira encosta na base
         * do arco, como em qualquer portal) e mede só os alheios. */
        var campo = H._lugares().filter(function (l) { return l.tipo === 'campo'; })[0];
        check('a entrada do Campo existe', !!campo);
        if (campo) {
          var cxC = H._caixaDoLugar('campo');
          var rB = Math.max(cxC.x1 - cxC.x0, cxC.z1 - cxC.z0) / 2;
          var piorS = 99, quem = '';
          S.forEach(function (s) {
            if (s.dono === 'campo') return;
            var v = Math.hypot(s.x - campo.x, s.z - campo.z) - s.r - rB;
            if (v < piorS) { piorS = v; quem = s.x.toFixed(1) + ',' + s.z.toFixed(1); }
          });
          check('a entrada do Campo fica a 0,5 m ou mais de todo muro de corredor alheio', piorS >= 0.5,
                'mais perto: ' + piorS.toFixed(2) + ' m (' + quem + ')');
          check('o meio da entrada do Campo está livre', livre({ x: campo.x, z: campo.z }));
          // o portão é um dente do arco: um passo a oeste do portal 0, no mesmo raio
          var p0 = L.filter(function (l) { return Math.atan2(l.x, -l.z) < -1.0; })
                    .sort(function (a, b) { return Math.atan2(a.x, -a.z) - Math.atan2(b.x, -b.z); })[0];
          var rC = Math.hypot(campo.x, campo.z), r0 = p0 ? Math.hypot(p0.x, p0.z) : 0;
          var passo = p0 ? Math.atan2(p0.x, -p0.z) - Math.atan2(campo.x, -campo.z) : 0;
          check('o portão do Campo está no arco dos portais: mesmo raio do portal 0 e um passo (0,44 rad) a oeste',
                !!p0 && Math.abs(rC - r0) < 0.05 && Math.abs(passo - 0.44) < 0.005,
                'r ' + rC.toFixed(2) + ' / ' + r0.toFixed(2) + ' · passo ' + passo.toFixed(3));
        }
        fecha();
      })
      .catch(function (e) {
        check('a prova rodou até o fim', false, e.message);
        fecha();
      });
  };
})();
</script>
</body>
</html>
