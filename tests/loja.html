<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>SOTERRA 3.0 — a loja do site entregando no jogo</title>
<style>body{margin:0;background:#0f1216;color:#e8eef6;font:12px monospace;padding:10px}
#summary{padding:6px 10px;border-radius:6px;margin-bottom:8px}
h2{font:700 12px monospace;color:#c9d4e2;margin:10px 0 2px}
.allpass{background:#16241b;color:#7fe08a} .fail{background:#3d1414;color:#f77}</style>
</head>
<body>
<!-- A LOJA (Fase C, 10/09): js/core/loja.js contra um cartório de mentira no
     molde de tests/nuvem.html (Sessao._fetch, N.semRecarga) que conhece também
     POST /api/loja/retirar e fecha os pedidos no PUT /api/save pela anotação
     db.loja — as MESMAS regras do contrato 1.5/1.6. O servidor de verdade é
     provado por tests/loja_api.py; a ponta a ponta, por tests/loja_viva.py.
     Aqui se cobra o CLIENTE: quando busca (e quando não), o que aplica, o que
     recusa, que nada entra duas vezes e que a anotação sobe e sobrevive.
     LOJA 2 (10/09, seções 7 a 11, na conta 8 do cartório): o presente do Mestre
     (preço 0, a mesma entrega), o crédito de vinténs (pacote pago; entra antes
     da compra feita com ele), o bônus de XP por tempo (o `agora` do servidor,
     dias que somam), as insígnias, a origem de cada pedido e o texto do aviso
     (UI.avisoLojaTexto, com a HUD carregada por último, sem UI.init).
     CONSERTO (11/09, seção 12): os avisos da loja em fila — a retirada que
     entrega tudo de uma vez não apaga o aviso anterior. -->
<div id="summary">rodando…</div>
<div id="log"></div>
<script src="save_sandbox.js"></script>
<script>
  window.__V = '?v=' + Date.now();
  var arqs = ['js/core/data/elements.js','js/core/data/classes.js','js/core/data/spells.js',
    'js/core/data/progression.js','js/core/data/monsters.js','js/core/data/dungeons.js',
    'js/core/data/fusions.js','js/core/data/pets.js','js/core/data/items.js',
    'js/core/data/items_extra.js','js/core/data/items_selos.js',
    'js/core/contas.js','js/core/sessao.js','js/core/db.js','js/core/mercado.js',
    'js/core/engine.js','js/core/fusion.js','js/core/progress.js','js/core/nuvem.js','js/core/loja.js',
    // loja 2: a HUD por ÚLTIMO e sem UI.init (tudo defensivo [U1]; sem init o toast é no-op) — só
    // para provar UI.avisoLojaTexto e o chip do bônus de XP
    'js/ui/icones_ui.js', 'js/ui/hud.js'];
  for (var i=0;i<arqs.length;i++) document.write('<scr'+'ipt src="../'+arqs[i]+window.__V+'"></scr'+'ipt>');
</script>
<script>
(function () {
  'use strict';
  var log = document.getElementById('log');
  var falhas = 0, total = 0;
  function check(nome, ok, extra) {
    total++;
    if (!ok) falhas++;
    var d = document.createElement('div');
    d.style.color = ok ? '#8fc79b' : '#f88';
    d.textContent = (ok ? 'PASSOU · ' : 'FALHOU · ') + nome + (extra ? ' — ' + extra : '');
    log.appendChild(d);
  }
  function secao(t) { var h = document.createElement('h2'); h.textContent = t; log.appendChild(h); }
  function fecha() {
    var sum = document.getElementById('summary');
    sum.className = falhas ? 'fail' : 'allpass';
    sum.textContent = falhas ? ('FALHOU — ' + falhas + ' de ' + total) : ('tudo passou (' + total + ')');
    window.__done = true; window.__fail = falhas;
  }
  function espera(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function ate(cond, ms) {
    ms = ms || 1500;
    return new Promise(function (r) {
      var t0 = 0;
      (function volta() {
        if (cond()) return r(true);
        if ((t0 += 10) > ms) return r(false);
        setTimeout(volta, 10);
      })();
    });
  }

  var D = JOGO.DATA, P = JOGO.Progress, DB = JOGO.DB, S = JOGO.Sessao, N = JOGO.Nuvem, L = JOGO.Loja, C = JOGO.Contas;
  function pedraDe(el) {
    for (var k in D.stones) if (D.stones.hasOwnProperty(k) && D.stones[k].element === el) return k;
    return null;
  }
  var AGUA = pedraDe('agua'), FOGO = pedraDe('fogo'), TERRA = pedraDe('terra');
  var ANCORA = (D.upgrade && D.upgrade.guardStone) || 'stone-anchor';

  // ---------------------------------------------------------- o cartório de mentira
  var srv = { contas: { 7: { versao: 0, progress: null, db: null }, 8: { versao: 0, progress: null, db: null } },
              tokens: { 'tok-1': 7, 'tok-2': 8 }, pedidos: [], chamadas: [], respostasPut: [],
              fora: false, putFora: false, recusaPut: false };
  function resp(status, obj) {
    return Promise.resolve({ status: status, json: function () { return Promise.resolve(obj); } });
  }
  function poePedido(conta, p, estado) {
    var x = { conta: conta, estado: estado || 'pendente', p: p, motivo: null };
    srv.pedidos.push(x);
    return x;
  }
  function pedido(id) { for (var i = 0; i < srv.pedidos.length; i++) if (srv.pedidos[i].p.id === id) return srv.pedidos[i]; return null; }
  // a confirmação que o servidor faz DENTRO do PUT (contrato 1.5, _loja_confirma)
  function confirma(quem, db) {
    var out = { entregues: [], estornados: [] };
    var ap = (db && db.loja && Array.isArray(db.loja.aplicadas)) ? db.loja.aplicadas : [];
    var re = (db && db.loja && Array.isArray(db.loja.recusadas)) ? db.loja.recusadas : [];
    srv.pedidos.forEach(function (x) {
      if (x.conta !== quem) return;
      if (ap.indexOf(x.p.id) >= 0 && /^(pendente|retirado|cancelado)$/.test(x.estado)) {
        x.estado = 'entregue'; out.entregues.push(x.p.id); return;
      }
      for (var i = 0; i < re.length; i++) {
        if (re[i] && re[i].id === x.p.id && /^(pendente|retirado)$/.test(x.estado)) {
          x.estado = 'estornado'; x.motivo = re[i].motivo; out.estornados.push(x.p.id);
        }
      }
    });
    return out;
  }
  S._fetch = function (url, pedidoHttp) {
    var body = pedidoHttp.body ? JSON.parse(pedidoHttp.body) : null;
    var tok = String(pedidoHttp.headers.Authorization || '').replace('Bearer ', '');
    srv.chamadas.push({ url: url, method: pedidoHttp.method, body: body, auth: pedidoHttp.headers.Authorization });
    if (srv.fora) return Promise.reject(new Error('fora'));
    var quem = srv.tokens[tok] || null;
    if (/\/api\/(save|loja|eu|logout)/.test(url) && !quem) return resp(401, { ok: false, erro: 'sem sessão' });
    var sv = srv.contas[quem];
    if (/\/api\/save$/.test(url) && pedidoHttp.method === 'GET') {
      return resp(200, { ok: true, versao: sv.versao, progress: sv.progress, db: sv.db });
    }
    if (/\/api\/save$/.test(url) && pedidoHttp.method === 'PUT') {
      if (srv.putFora) return Promise.reject(new Error('fora'));
      if (srv.recusaPut) { srv.recusaPut = false; return resp(409, { ok: false, erro: 'instância duplicada no save: jx' }); }
      if (body.versao !== sv.versao) {
        return resp(409, { ok: false, erro: 'save desatualizado', versao: sv.versao, progress: sv.progress, db: sv.db });
      }
      sv.versao++;
      sv.progress = body.progress; sv.db = body.db;
      var loja = confirma(quem, body.db);
      srv.respostasPut.push(loja);
      return resp(200, { ok: true, versao: sv.versao, registrados: 0, loja: loja });
    }
    if (/\/api\/eu$/.test(url)) return resp(200, { ok: true, conta: { id: quem, nome: ({ 7: 'Dan', 8: 'Bia' })[quem], gm: false } });
    if (/\/api\/logout$/.test(url)) return resp(200, { ok: true });
    if (/\/api\/loja\/retirar$/.test(url) && pedidoHttp.method === 'POST') {
      var saem = srv.pedidos.filter(function (x) { return x.conta === quem && (x.estado === 'pendente' || x.estado === 'retirado'); });
      saem.forEach(function (x) { x.estado = 'retirado'; });
      return resp(200, { ok: true, pedidos: saem.map(function (x) { return JSON.parse(JSON.stringify(x.p)); }) });
    }
    return resp(404, { ok: false, erro: 'rota?' });
  };
  function retiradas() { return srv.chamadas.filter(function (c) { return /\/api\/loja\/retirar$/.test(c.url); }); }
  function puts() { return srv.chamadas.filter(function (c) { return c.method === 'PUT'; }); }
  function moedasReais() { return DB.exportar().carteira.moedas; }
  // o resultado de UM pedido dentro da busca (o retirar devolve todos os abertos)
  function de(r, id) { return ((r && r.resultados) || []).filter(function (x) { return x.id === id; })[0] || {}; }

  // os pedidos como o servidor os congela (contrato 1.6)
  var PED = {
    agua: function (id) { return { id: id, sku: 'pedras-agua', nome: '10 Lágrimas de Cisterna', preco: 300, entrega: { tipo: 'pedras', alvo: AGUA, qtd: 10 } }; },
    terra: function (id) { return { id: id, sku: 'pedras-terra', nome: '10 Grãos de Rocha-Mãe', preco: 300, entrega: { tipo: 'pedras', alvo: TERRA, qtd: 10 } }; },
    fogo: function (id) { return { id: id, sku: 'pedras-fogo', nome: '10 Brasas Coaguladas', preco: 450, entrega: { tipo: 'pedras', alvo: FOGO, qtd: 10 } }; },
    xp: function (id) { return { id: id, sku: 'pergaminho-xp', nome: 'Pergaminho da Sabedoria', preco: 1500, entrega: { tipo: 'pergaminho', alvo: 'xp', qtd: 1 } }; },
    invocador: function (id) { return { id: id, sku: 'classe-invocador', nome: 'Xamã', preco: 8000, entrega: { tipo: 'classe', alvo: 'invocador', qtd: 1 } }; },
    bruxo: function (id) { return { id: id, sku: 'classe-bruxo', nome: 'Bruxo', preco: 50000, entrega: { tipo: 'classe', alvo: 'bruxo', qtd: 1 } }; }
  };
  // loja 2 (10/09): o presente do Mestre, o crédito de vinténs, o bônus de XP por tempo e as insígnias
  var T0 = 1789041600, avisoBonus = null;      // T0: um "agora" do servidor fixo (segundos)
  PED.presente = function (id) {
    return { id: id, sku: 'classe-invocador', nome: 'Xamã', preco: 0, origem: 'presente', entrega: { tipo: 'classe', alvo: 'invocador', qtd: 1 } };
  };
  PED.presentePedras = function (id) {
    return { id: id, sku: 'pedras-fogo', nome: '10 Brasas Coaguladas', preco: 0, origem: 'presente', entrega: { tipo: 'pedras', alvo: FOGO, qtd: 10 } };
  };
  PED.credito = function (id, qtd, origem, nome) {
    return { id: id, sku: origem === 'presente' ? 'presente-vintens' : 'pacote-12000', nome: nome || 'Arca de 12.000 vinténs',
             preco: 0, origem: origem || 'pagamento', entrega: { tipo: 'vintens', alvo: 'carteira', qtd: qtd } };
  };
  PED.bruxo10 = function (id) { return { id: id, sku: 'classe-bruxo', nome: 'Bruxo', preco: 10000, entrega: { tipo: 'classe', alvo: 'bruxo', qtd: 1 } }; };
  PED.bonus = function (id, dias, agora, alvo) {
    var e = { tipo: 'bonus-xp', alvo: alvo || 'xp', qtd: dias };
    if (agora !== undefined) e.agora = agora;
    return { id: id, sku: 'bonus-xp-' + dias, nome: 'Bônus de XP — ' + dias + (dias === 1 ? ' dia' : ' dias'), preco: 100, entrega: e };
  };
  PED.insignias = function (id, qtd, alvo) {
    return { id: id, sku: 'insignias-10', nome: '10 Insígnias de Fundação', preco: 100, entrega: { tipo: 'insignias', alvo: alvo || 'fundacao', qtd: qtd } };
  };

  var avisos = [], nuvemEv = [];
  window.addEventListener('soterra:loja', function (ev) { avisos.push(ev.detail); });
  var nAvisosLoja = 0;               // 11/09 (bateria): todos, para a seção 12 (o `avisos` é zerado no caminho)
  window.addEventListener('soterra:loja', function () { nAvisosLoja++; });
  window.addEventListener('soterra:nuvem', function (ev) { nuvemEv.push(ev.detail.tipo); });
  function ultimoAviso() { return avisos[avisos.length - 1] || {}; }

  N.semRecarga = true;
  N.ESPERA_MS = 30;
  N.RETENTA_MS = 80;
  L.INTERVALO_MS = 1e9;
  // a trava entre abas (navigator.locks) fica de fora: no Chrome sem cabeça com
  // tempo virtual ela só é concedida muito depois, e a prova travava esperando
  L._semTrava = true;
  L._reinicia();
  S.esquece();
  P.reset();
  DB._zerar();

  var aguaAntes = 0, v0 = 0;
  Promise.resolve().then(function () {
    // ================================================================ quando NÃO busca
    secao('1. quando não busca');
    check('as pedras e classes da loja existem nos dados reais', !!AGUA && !!FOGO && !!TERRA && !!D.classes.invocador && D.cards.invocador.unlockCost === 10);
    return L.buscar();
  }).then(function (r) {
    check('sem sessão: buscar não fala com o cartório', r.ok === false && r.erro === 'sem sessão' && retiradas().length === 0, JSON.stringify(r));
    // fora da conta Principal, até com um aviso "em dia" solto
    var ativaReal = C.ativa;
    C.ativa = function () { return '2'; };
    S.guarda({ token: 'tok-1', conta: { id: 7, nome: 'Dan', gm: false } });
    return N.iniciar().then(function (r0) {
      window.dispatchEvent(new CustomEvent('soterra:nuvem', { detail: { tipo: 'emdia' } }));
      return L.buscar().then(function (r1) {
        check('fora da conta Principal: nem a Nuvem liga, nem a loja busca (mesmo com um "emdia" solto)',
              r0.erro === 'conta local' && r1.ok === false && r1.erro === 'conta local' && retiradas().length === 0, r1.erro);
        C.ativa = ativaReal;
        L._reinicia();
      });
    });
  }).then(function () {
    // antes do 1º emdia/subiu — e com o servidor fora no boot
    srv.fora = true;
    N.iniciar();
    return L.buscar();
  }).then(function (r) {
    check('antes do 1º "emdia"/"subiu" (a Nuvem ligada, ainda sem ouvir o servidor): não busca',
          N.estado().ligada === true && r.ok === false && r.erro === 'esperando a nuvem' && retiradas().length === 0, r.erro);
    return espera(250);
  }).then(function () {
    check('servidor fora no boot: a Nuvem avisa "fora" e a loja continua quieta',
          nuvemEv.indexOf('fora') >= 0 && L.estado().liberada === false && retiradas().length === 0);
    srv.fora = false;
    return ate(function () { return retiradas().length >= 1; }, 3000);
  }).then(function (ok) {
    var idxSave = -1, idxRet = -1;
    srv.chamadas.forEach(function (c, i) {
      if (idxSave < 0 && /\/api\/save$/.test(c.url) && c.method === 'PUT') idxSave = i;
      if (idxRet < 0 && /\/api\/loja\/retirar$/.test(c.url)) idxRet = i;
    });
    check('o servidor voltou: a 1ª busca vem logo DEPOIS do 1º "subiu" (o save já sincronizado)',
          ok && L.estado().liberada === true && idxSave >= 0 && idxRet > idxSave, 'PUT #' + idxSave + ' · retirar #' + idxRet);
    var c = retiradas()[0];
    check('a busca é POST /api/loja/retirar com corpo {} e o token', !!c && c.method === 'POST' && JSON.stringify(c.body) === '{}' &&
          c.auth === 'Bearer tok-1');
    // a Nuvem PARADA (409 de instância): a loja para junto
    srv.recusaPut = true;
    DB.ganharMoedas(20000);
    return ate(function () { return N.estado().parada; });
  }).then(function (ok) {
    var n0 = retiradas().length;
    return L.buscar().then(function (r) {
      check('com a Nuvem parada, não busca', ok && r.ok === false && r.erro === 'a nuvem está parada' && retiradas().length === n0, r.erro);
      return N.retomar();
    }).then(function () { return ate(function () { return !N.estado().parada && !N.estado().pendente; }); });
  }).then(function (ok) {
    check('retomada a Nuvem, a carteira de 20.000 subiu', ok && srv.contas[7].db && srv.contas[7].db.carteira.moedas === 20000);

    // ================================================================ pedras
    secao('2. pedras, e nada duas vezes');
    aguaAntes = P.stoneCount(AGUA);
    poePedido(7, PED.agua(41));
    return L.buscar();
  }).then(function (r) {
    check('buscar retira e aplica o pedido', r.ok === true && r.pedidos === 1 && de(r, 41).ok === true, JSON.stringify(r));
    check('a contagem de Lágrimas sobe 10', P.stoneCount(AGUA) === aguaAntes + 10, aguaAntes + ' → ' + P.stoneCount(AGUA));
    check('a carteira desce 300 (20.000 → 19.700)', moedasReais() === 19700, String(moedasReais()));
    check('o aviso "soterra:loja" sai com tipo entregue e o pedido', ultimoAviso().tipo === 'entregue' && ultimoAviso().pedido.id === 41);
    return DB.lojaVer();
  }).then(function (a) {
    check('a anotação guarda o id', a.aplicadas.indexOf(41) >= 0 && a.recusadas.length === 0, JSON.stringify(a));
    return ate(function () { return pedido(41).estado === 'entregue'; });
  }).then(function (ok) {
    var comAnot = puts().filter(function (p) { return p.body.db && p.body.db.loja && p.body.db.loja.aplicadas.indexOf(41) >= 0; });
    check('a anotação vai no PUT /api/save e o cartório fecha o pedido (entregue)', ok && comAnot.length >= 1 &&
          srv.respostasPut.some(function (l) { return l.entregues.indexOf(41) >= 0; }));
    // o servidor manda o MESMO pedido de novo (um PUT que não chegou, digamos)
    pedido(41).estado = 'retirado';
    var pedras = P.stoneCount(AGUA), m = moedasReais();
    return L.buscar().then(function (r) {
      check('o mesmo pedido chegando outra vez: pula ("ja") — sem entrega nem débito',
            r.ok && de(r, 41).motivo === 'ja' && P.stoneCount(AGUA) === pedras && moedasReais() === m, JSON.stringify(r.resultados));
      return ate(function () { return pedido(41).estado === 'entregue'; });
    });
  }).then(function () {
    // dois aplicar do mesmo pedido AO MESMO TEMPO: a decisão é síncrona por dentro
    var pedras = P.stoneCount(AGUA), m = moedasReais();
    return Promise.all([L.aplicar(PED.agua(43)), L.aplicar(PED.agua(43))]).then(function (rs) {
      var oks = rs.filter(function (r) { return r.ok; }).length;
      check('dois aplicar simultâneos do mesmo id: um entrega, o outro pula',
            oks === 1 && rs.some(function (r) { return r.motivo === 'ja'; }) &&
            P.stoneCount(AGUA) === pedras + 10 && moedasReais() === m - 300, JSON.stringify(rs));
    });
  }).then(function () {
    // ================================================================ reload
    secao('3. a anotação e os pergaminhos sobrevivem ao reload');
    poePedido(7, PED.xp(44));
    return L.buscar();
  }).then(function (r) {
    check('o Pergaminho da Sabedoria chega guardado', r.ok && P.pergaminhos().xp === 1 && moedasReais() === 19400 - 1500,
          JSON.stringify(P.pergaminhos()) + ' ' + moedasReais());
    DB._recarregar();
    P.load();
    return DB.lojaVer();
  }).then(function (a) {
    check('depois do reload: a anotação (41, 43, 44) e o pergaminho seguem lá',
          [41, 43, 44].every(function (id) { return a.aplicadas.indexOf(id) >= 0; }) && P.pergaminhos().xp === 1 &&
          moedasReais() === 17900, JSON.stringify(a.aplicadas) + ' xp ' + P.pergaminhos().xp);

    // ================================================================ recusas
    secao('4. o que o jogo recusa (e o estorno)');
    poePedido(7, PED.bruxo(45));
    return L.buscar();
  }).then(function (r) {
    check('sem saldo (Bruxo por 50.000 com 17.900): recusa "sem-saldo"', r.ok && de(r, 45).motivo === 'sem-saldo', JSON.stringify(r.resultados));
    check('... sem entrega e sem débito', !P.isClassUnlocked('bruxo') && P.cardInfo('bruxo').cards === 0 && moedasReais() === 17900);
    check('... e o aviso diz "recusado" com o motivo', ultimoAviso().tipo === 'recusado' && ultimoAviso().motivo === 'sem-saldo');
    return DB.lojaVer().then(function (a) {
      check('... a recusa fica anotada', a.recusadas.some(function (x) { return x.id === 45 && x.motivo === 'sem-saldo'; }) &&
            a.aplicadas.indexOf(45) < 0, JSON.stringify(a.recusadas));
      return ate(function () { return pedido(45).estado === 'estornado'; });
    });
  }).then(function (ok) {
    check('... e o PUT estorna o pedido no cartório', ok && pedido(45).motivo === 'sem-saldo');
    // a classe: 6 cartas já na mão (o site mostra "você tem 6 de 10")
    P.state.cards.invocador = 6; P.save();
    poePedido(7, PED.invocador(46));
    return L.buscar();
  }).then(function (r) {
    var ci = P.cardInfo('invocador');
    check('classe: o Xamã libera com cartas = custo (10) e 0 estrelas', r.ok && de(r, 46).ok === true &&
          P.isClassUnlocked('invocador') && ci.cards === ci.unlockCost && ci.unlockCost === 10 && ci.stars === 0, JSON.stringify(ci));
    check('... o herói chega no nível 1, e a carteira paga 8.000', !!P.hero('invocador') && P.hero('invocador').level === 1 &&
          moedasReais() === 9900, String(moedasReais()));
    poePedido(7, PED.invocador(47));
    return L.buscar();
  }).then(function (r) {
    var ci = P.cardInfo('invocador');
    check('classe já liberada: recusa "classe-ja-liberada" — nunca vira carta de estrela',
          r.ok && de(r, 47).motivo === 'classe-ja-liberada' && ci.cards === 10 && ci.stars === 0 && moedasReais() === 9900,
          JSON.stringify(r.resultados) + ' ' + JSON.stringify(ci));
    poePedido(7, { id: 48, sku: 'montaria-dragao', nome: 'Montaria', preco: 100, entrega: { tipo: 'montaria', alvo: 'dragao', qtd: 1 } });
    return L.buscar();
  }).then(function (r) {
    var res48 = [de(r, 48)].filter(function (x) { return x.motivo === 'tipo-desconhecido'; });

          !!avisoBonus && /^Chegou da loja: Bônus de XP — 1 dia — vale até \d\d\/\d\d às \d\d:\d\d$/.test(T(avisoBonus) || ''), T(avisoBonus));
    check('sem detail, ou tipo que não é entregue/recusado: null', U.avisoLojaTexto(null) === null &&
          U.avisoLojaTexto({ tipo: 'ignorado', pedido: lag }) === null);

    // o chip do bônus no topo do Acampamento (a caixa dos pergaminhos), pelo relógio que o jogo tem
    // (aqui sem a agenda: o desta máquina)
    var agS = Math.floor(Date.now() / 1000);
    P.state.bonusXpAte = agS + 2 * 86400 + 3 * 3600 + 30;
    var cx = U._hubPergaminhos ? U._hubPergaminhos() : null;
    var chip = cx ? cx.querySelector('.perg-bonus') : null;
    var txt = chip ? chip.textContent : '';
    check('com bônus no ar: o chip "✦ Bônus de XP ×1,5 · 2 d 3 h" na caixa do Acampamento', !!chip &&
          txt.indexOf('✦') === 0 && txt.indexOf('Bônus de XP') > 0 && txt.indexOf('×1,5') > 0 && txt.indexOf('· 2 d 3 h') > 0 &&
          !cx.classList.contains('is-off'), txt);
    P.state.bonusXpAte = agS + 5 * 3600 + 20 * 60 + 30;
    var t5 = ((U._hubPergaminhos().querySelector('.perg-bonus') || {}).textContent) || '';
    P.state.bonusXpAte = agS + 12 * 60 + 30;
    var t12 = ((U._hubPergaminhos().querySelector('.perg-bonus') || {}).textContent) || '';
    P.state.bonusXpAte = agS + 30;
    var t0 = ((U._hubPergaminhos().querySelector('.perg-bonus') || {}).textContent) || '';
    check('... o tempo que falta: "5 h 20 min", "12 min", "menos de 1 min"', t5.indexOf('· 5 h 20 min') > 0 &&
          t12.indexOf('· 12 min') > 0 && t0.indexOf('· menos de 1 min') > 0, [t5, t12, t0].join(' | '));
    P.state.bonusXpAte = agS - 10;
    var cxV = U._hubPergaminhos();
    check('prazo vencido: o chip some, e sem pergaminho a caixa se esconde', !cxV.querySelector('.perg-bonus') &&
          cxV.classList.contains('is-off'), cxV.outerHTML);
    P.state.bonusXpAte = T0 + 37 * 86400;
    P.save();

    // ================================================================ 12. os avisos em fila (conserto 11/09)
    secao('12. os avisos da loja em FILA: a retirada que entrega tudo de uma vez não apaga o aviso anterior');
    check('a HUD expõe o gancho de prova UI._avisosLoja', typeof U._avisosLoja === 'function');
    var A = function () { return U._avisosLoja ? U._avisosLoja() : { mostrados: [], fila: [], ocupado: false }; };
    function avisa(d) { window.dispatchEvent(new CustomEvent('soterra:loja', { detail: d })); }
    var m0 = 0;
    // as entregas das seções anteriores também passaram pela fila: espera ela esvaziar.
    // 11/09 (bateria): as seções 1 a 11 despejam dezenas de avisos (contados em `avisos`).
    // Um por um, 3,2 s cada, eram minutos de toasts em fila — a suíte estourava o prazo
    // da bateria e o jogador ficava preso numa fila de avisos. Agora até 3 esperam a
    // vez e o resto vira UM resumo: a fila acaba em no máximo 5 avisos (~16 s)
    var tFila = Date.now();
    return ate(function () { var a = A(); return !a.fila.length && !a.ocupado; }, 20000).then(function (vazia) {
      check('a fila das seções anteriores (' + nAvisosLoja + ' avisos da loja) acabou em no máximo 5 avisos (~16 s)', vazia,
            Math.round((Date.now() - tFila) / 1000) + ' s · ' + JSON.stringify(A()));
      m0 = A().mostrados.length;          // (a lista guarda os 20 últimos: a prova olha o FIM dela)
      avisa({ tipo: 'entregue', pedido: arca, origem: 'pagamento' });
      avisa({ tipo: 'entregue', pedido: xama, origem: 'presente' });
      avisa({ tipo: 'entregue', pedido: lag, origem: 'loja' });
      avisa({ tipo: 'ignorado', pedido: lag });                         // o que não é aviso não entra na fila
      var a1 = A();
      check('três entregas no mesmo instante: o 1º aparece na hora, os outros dois esperam a vez',
            a1.mostrados.slice(-1).join(' | ') === 'Chegaram 12.000 vinténs do seu pacote' &&
            a1.fila.join(' | ') === 'Presente do Mestre: Xamã | Chegou da loja: 10 Lágrimas de Cisterna' && a1.ocupado,
            JSON.stringify(a1));
      return espera(3400);
    }).then(function () {
      var a2 = A();
      check('... uns 3 s depois, o 2º (e o 3º ainda espera)',
            a2.mostrados.slice(-2).join(' | ') === 'Chegaram 12.000 vinténs do seu pacote | Presente do Mestre: Xamã' && a2.fila.length === 1,
            JSON.stringify(a2));
      return espera(3400);
    }).then(function () {
      var a3 = A();
      check('... e depois o 3º: cada aviso uma vez, na ordem, e a fila acaba vazia',
            a3.mostrados.slice(-3).join(' | ') ===
            'Chegaram 12.000 vinténs do seu pacote | Presente do Mestre: Xamã | Chegou da loja: 10 Lágrimas de Cisterna' &&
            a3.fila.length === 0, JSON.stringify(a3));
      // 11/09 (bateria): a retirada GRANDE — 9 entregas e 1 devolução no mesmo instante
      return ate(function () { var a = A(); return !a.fila.length && !a.ocupado; }, 8000);
    }).then(function () {
      var RESUMO = 'Chegaram mais 5 entregas da loja, e 1 pedido foi devolvido — veja em "Seus pedidos", na loja do site.';
      for (var k = 0; k < 9; k++) avisa({ tipo: 'entregue', pedido: lag, origem: 'loja' });
      avisa({ tipo: 'recusado', pedido: lag, motivo: 'sem-saldo', origem: 'loja' });
      var a4 = A();
      check('10 avisos no mesmo instante: 1 na tela, 3 esperam a vez um por um, e o resto vira UM resumo (com a devolução)',
            a4.ocupado && a4.fila.length === 4 && a4.fila.slice(0, 3).join(' | ') ===
            'Chegou da loja: 10 Lágrimas de Cisterna | Chegou da loja: 10 Lágrimas de Cisterna | Chegou da loja: 10 Lágrimas de Cisterna' &&
            a4.fila[3] === RESUMO, JSON.stringify(a4));
      var t4 = Date.now();
      return ate(function () { var a = A(); return !a.fila.length && !a.ocupado; }, 20000).then(function (acabou) {
        var a5 = A();
        check('... e a fila inteira acaba em 5 avisos (~16 s), com o resumo por último',
              acabou && a5.mostrados[a5.mostrados.length - 1] === RESUMO && a5.fila.length === 0,
              Math.round((Date.now() - t4) / 1000) + ' s · ' + JSON.stringify(a5.mostrados.slice(-2)));
        return N.sair();
      });
    });
  }).then(function () {
    check('a blindagem do save real segurou', JOGO.SaveSandbox.check().ok);
    fecha();
  }).catch(function (e) {
    check('o fluxo não estoura', false, String(e && (e.stack || e.message) || e));
    fecha();
  });
})();
</script>
