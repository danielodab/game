<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>prova: a praça nova com a Árvore-Mundo</title>
<style>html,body{margin:0;height:100%;background:#0f1216}iframe{width:100%;height:100%;border:0}</style>
</head>
<body>
<!-- PÁGINA DE PROVA (foto): o Acampamento reformado (30/08) — quadrado e
     grande, chão de lajotas, a Árvore-Mundo no centro, as construções do
     usuário (arena, banco, mercadinho, sede), portais afastados com cantinho
     temático (garden e cistern), e a plaquinha nova: nome na placa, guilda
     com emblema em cima, coroa 3D acima de tudo. -->
<iframe id="f" src="../index.html?prova-praca"></iframe>
<script>
var f = document.getElementById('f');
f.onload = function () {
  var w = f.contentWindow, d = w.document;
  var t0 = Date.now();
  (function espera() {
    var menu = d.querySelector('.screen-menu.is-on');
    if (!menu && Date.now() - t0 < 40000) return setTimeout(espera, 800);
    try {
      w.JOGO.DB.definirBrasa(1850, 12);
      w.JOGO.Progress.addInsignia(10);
      var Gd = w.JOGO.Guilda;
      w.JOGO.DB.batizar('Capitã Ana').then(function () {
        return w.JOGO.DB.jogador();
      }).then(function (j) {
        Gd.contaAtiva(j.id, j.nome);
        return Gd.criar('Filhos da Lousa', '💀');
      }).then(function () {
        w.JOGO.UI.showScreen('hub');
        // espera as construções DE VERDADE (a sonda diz quando plantou) —
        // cronômetro de relógio mente no headless (tempo virtual)
        var voltas = 0;
        (function aguarda() {
          var e2 = null;
          try { e2 = w.JOGO.Hub._estado(); } catch (err) {}
          if ((e2 && e2.construcoes && e2.enfeites) || ++voltas > 200) {
            // ?dist=&tilt=&ang= enquadram a foto (ex.: vista aérea do mapa)
            var Q = {};
            location.search.replace(/[?&]([^=&]+)=([^&]*)/g,
              function (_, k, v2) { Q[k] = parseFloat(v2); });
            // 13/09: ?irx=&irz= leva o herói (o pivô da órbita) e ?livre=1 passa
            // do teto da câmera do jogador — a foto aérea do mapa em quarteirões
            if (Q.irx != null && Q.irz != null && w.JOGO.Hub.irPara) w.JOGO.Hub.irPara(Q.irx, Q.irz);
            if (w.JOGO.Hub._cam && (Q.dist || Q.tilt || Q.ang != null)) {
              w.JOGO.Hub._cam({ dist: Q.dist, tilt: Q.tilt, ang: Q.ang, livre: !!Q.livre });
            }
            setTimeout(function () { window.__pronto = true; }, Q.irx != null ? 6000 : 1500);
            return;
          }
          setTimeout(aguarda, 400);
        })();
      });
    } catch (e) { document.title = 'ERRO ' + e.message; }
  })();
};
</script>
</body>
</html>
