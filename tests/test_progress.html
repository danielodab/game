<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>SOTERRA — Testes de Progressão (Progress/XP/Loot)</title>
<style>
  body { background: #14181c; color: #dde; font-family: Consolas, monospace; padding: 16px; }
  h1 { font-size: 18px; }
  #summary { font-size: 16px; font-weight: bold; margin: 12px 0; padding: 8px; border-radius: 4px; }
  .allpass { background: #143d1e; color: #7f7; }
  .somefail { background: #3d1414; color: #f77; }
  .t { padding: 2px 6px; }
  .pass::before { content: "PASS "; color: #6e6; font-weight: bold; }
  .fail::before { content: "FAIL "; color: #f66; font-weight: bold; }
  .fail { background: #2a1515; }
  .msg { color: #fa8; margin-left: 60px; }
</style>
</head>
<body>
<h1>SOTERRA — suíte de testes de progressão (headless: sem Renderer/UI reais)</h1>
<div id="summary">rodando...</div>
<div id="results"></div>

<!-- ?v=adendo2: evita cache de scripts antigos no navegador de teste -->
<script src="../js/core/data.js?v=adendo2"></script>
<script src="../js/core/progress.js?v=adendo2"></script>
<script src="../js/core/engine.js?v=adendo2"></script>
<script src="../js/core/ai.js?v=adendo2"></script>
<script src="../js/core/game.js?v=adendo2"></script>
<script>
(function () {
  'use strict';
  var E = JOGO.Engine, D = JOGO.DATA, P = JOGO.Progress, G = JOGO.Game;
  var passed = 0, failed = 0, failures = [];
  var resultsEl = document.getElementById('results');

  function report(name, ok, msg) {
    var div = document.createElement('div');
    div.className = 't ' + (ok ? 'pass' : 'fail');
    div.textContent = name;
    if (!ok && msg) {
      var m = document.createElement('div');
      m.className = 'msg';
      m.textContent = msg;
      div.appendChild(m);
    }
    resultsEl.appendChild(div);
    if (ok) console.log('PASS: ' + name);
    else console.error('FAIL: ' + name + ' — ' + msg);
  }
  function t(name, fn) {
    try { fn(); passed++; report(name, true); }
    catch (e) { failed++; failures.push(name + ' — ' + e.message); report(name, false, e.message + (e.stack ? ' | ' + String(e.stack).split('\n')[1] : '')); }
  }
  function ok(cond, msg) { if (!cond) throw new Error(msg || 'asserção falhou'); }
  function eq(a, b, msg) { if (a !== b) throw new Error((msg || 'eq') + ' — esperado [' + b + '], obtido [' + a + ']'); }
  function near(a, b, eps, msg) { if (Math.abs(a - b) > eps) throw new Error((msg || 'near') + ' — esperado ~' + b + ', obtido ' + a); }

  // ---- sandbox de save: preserva o save real do jogador e o restaura ao fim.
  // Cada teste começa com P.reset() (nível 1, sem itens).
  var SAVE_KEY = 'soterra-save-v1';
  var realSave = null;
  try { realSave = window.localStorage ? localStorage.getItem(SAVE_KEY) : null; } catch (e) { realSave = null; }
  function restoreRealSave() {
    try {
      if (window.localStorage) {
        localStorage.removeItem(SAVE_KEY);
        if (realSave !== null) localStorage.setItem(SAVE_KEY, realSave);
      }
    } catch (e) { /* sem storage */ }
    P.load();
  }

  // ------------------------------------------------------------ dados de teste
  function zeroRes() { return { fire: 0, water: 0, earth: 0, air: 0, light: 0, shadow: 0, neutral: 0 }; }
  function installTestData() {
    if (D.spells['p-nuke']) return;
    D.spells['p-nuke'] = { id: 'p-nuke', name: 'p-nuke', element: 'neutral', paCost: 0, cooldown: 0,
      castsPerTurn: 0, range: { min: 0, max: 99, line: false, los: false },
      aoe: { shape: 'single', size: 0 }, needsEmptyTile: false,
      effects: [{ type: 'damage', element: 'neutral', min: 999, max: 999 }],
      description: 'teste', fxKey: 'slam' };
    D.spells['p-summon'] = { id: 'p-summon', name: 'p-summon', element: 'neutral', paCost: 0, cooldown: 0,
      castsPerTurn: 0, range: { min: 1, max: 10, line: false, los: false },
      aoe: { shape: 'single', size: 0 }, needsEmptyTile: true,
      effects: [{ type: 'summon', monsterId: 'p-imp' }],
      description: 'teste', fxKey: 'slam' };
    D.monsters['p-grunt'] = { id: 'p-grunt', name: 'p-grunt', family: 'Teste', description: 'teste',
      stats: { hp: 60, pa: 0, pm: 0, initiative: 1, power: 0, resists: zeroRes() },
      spells: [], ai: 'melee', traits: [], boss: false, summonOnly: false, xp: 31 };
    D.monsters['p-brute'] = { id: 'p-brute', name: 'p-brute', family: 'Teste', description: 'teste',
      stats: { hp: 80, pa: 0, pm: 0, initiative: 1, power: 0, resists: zeroRes() },
      spells: [], ai: 'melee', traits: [], boss: false, summonOnly: false, xp: 24 };
    D.monsters['p-imp'] = { id: 'p-imp', name: 'p-imp', family: 'Teste', description: 'teste',
      stats: { hp: 10, pa: 0, pm: 0, initiative: 1, power: 0, resists: zeroRes() },
      spells: [], ai: 'melee', traits: [], boss: false, summonOnly: true, xp: 7 };
    D.dungeons.push({
      id: 'p-arena', name: 'Arena de Progressão', theme: 'teste', description: 'teste',
      palette: { primary: '#888', secondary: '#444', accent: '#fff', floor1: '#222', floor2: '#333', wall: '#111' },
      rooms: [
        { name: 'r0', layout: ['#######', '#P.a..#', '#P.b..#', '#######'], monsters: { a: 'p-grunt', b: 'p-brute' } },
        { name: 'r1', layout: ['#######', '#P.a..#', '#P....#', '#######'], monsters: { a: 'p-grunt' } },
        { name: 'r2', layout: ['#######', '#P.a..#', '#P....#', '#######'], monsters: { a: 'p-brute' } }
      ],
      lootTable: [
        { itemId: 'gh-pruning-shears', weight: 30, minRoom: 0 },
        { itemId: 'gh-widow-shears', weight: 4, minRoom: 2 }
      ]
    });
  }

  // ------------------------------------------------------------ helpers
  function byDef(state, defId, nth) {
    var n = nth || 0;
    for (var i = 0; i < state.units.length; i++) {
      if (state.units[i].defId === defId) { if (n === 0) return state.units[i]; n--; }
    }
    return null;
  }
  function heroUnit(state, heroId) {
    for (var i = 0; i < state.units.length; i++) {
      if (state.units[i].kind === 'hero' && state.units[i].defId === heroId) return state.units[i];
    }
    return null;
  }
  // conta ocorrências de um item no inventário + slots equipados de todos os heróis
  function countEverywhere(itemId) {
    var n = 0, i;
    for (i = 0; i < P.state.inventory.length; i++) if (P.state.inventory[i] === itemId) n++;
    for (var heroId in P.state.equipped) {
      var eq = P.state.equipped[heroId];
      if (eq.weapon === itemId) n++;
      if (eq.armor === itemId) n++;
      if (eq.trinket === itemId) n++;
    }
    return n;
  }
  // limpa a sala atual do Game nucleando todos os inimigos com o herói dado
  function nukeRoom(heroId) {
    var st = G.state;
    var h = heroUnit(st, heroId);
    if (h.spells.indexOf('p-nuke') < 0) h.spells.push('p-nuke');
    for (var i = 0; i < st.units.length; i++) {
      var u = st.units[i];
      if (u.side === 'enemy' && u.alive) {
        while (u.alive) ok(E.cast(st, h.uid, 'p-nuke', u.x, u.y), 'nuke ' + u.defId);
      }
    }
    eq(st.phase, 'won', 'sala limpa');
    G.update(0.1);
    E.events.length = 0;
  }
  // joga uma batalha inteira IA vs IA (mesmo laço do test_engine)
  function autoplay(dungeonId, roomIdx, heroIds) {
    E.events.length = 0;
    var st = E.createBattle(dungeonId, roomIdx, heroIds);
    var turns = 0;
    while (st.phase === 'playing' && turns < 200) {
      var u = E.activeUnit(st);
      var plan = JOGO.AI.planTurn(st, u.uid);
      for (var a = 0; a < plan.length && st.phase === 'playing'; a++) {
        var act = plan[a];
        if (act.action === 'move') E.move(st, u.uid, act.x, act.y);
        else if (act.action === 'cast') E.cast(st, u.uid, act.spellId, act.x, act.y);
        else break;
      }
      if (st.phase === 'playing') E.endTurn(st);
      turns++;
      E.events.length = 0;
    }
    var heroHp = 0;
    for (var i = 0; i < st.units.length; i++) {
      if (st.units[i].kind === 'hero') heroHp += st.units[i].hp;
    }
    return { phase: st.phase, turns: turns, heroHp: heroHp };
  }

  var captured = []; // capturas do stub de UI (telas + dados)

  // ============================================================ SUITE
  function run() {
    installTestData();
    var LVL = D.leveling; // { maxLevel: 20, xpTable: [...], perLevel: {hp:6, power:3} }

    t('Progress: API completa e formato do state', function () {
      P.reset();
      ok(typeof P.load === 'function' && typeof P.save === 'function' && typeof P.reset === 'function', 'load/save/reset');
      ok(typeof P.addXp === 'function' && typeof P.xpInfo === 'function', 'addXp/xpInfo');
      ok(typeof P.effectiveStats === 'function' && typeof P.equip === 'function' &&
         typeof P.unequip === 'function' && typeof P.rollDrops === 'function', 'stats/equip/rollDrops');
      ok(P.state && P.state.heroes && P.state.equipped, 'state.heroes/equipped');
      ok(Object.prototype.toString.call(P.state.inventory) === '[object Array]', 'inventory é array');
      for (var i = 0; i < D.heroes.length; i++) {
        var id = D.heroes[i].id;
        if (id.indexOf('p-') === 0 || id.indexOf('t-') === 0) continue;
        eq(P.state.heroes[id].level, 1, id + ' nível 1');
        eq(P.state.heroes[id].xp, 0, id + ' xp 0');
        eq(P.state.equipped[id].weapon, null, id + ' sem arma');
        eq(P.state.equipped[id].armor, null, id + ' sem armadura');
        eq(P.state.equipped[id].trinket, null, id + ' sem amuleto');
      }
    });

    t('addXp/nível: bordas — 0 xp, degrau exato, salto ao máximo, teto', function () {
      P.reset();
      var i0 = P.xpInfo('hero-toll');
      eq(i0.level, 1, 'nível inicial'); eq(i0.xp, 0, 'xp inicial');
      eq(i0.xpNext, LVL.xpTable[1], 'xpNext = degrau do nível 2'); eq(i0.pct, 0, 'pct 0');
      eq(P.addXp('hero-toll', 59), 0, '59 xp: nenhum nível');
      eq(P.xpInfo('hero-toll').level, 1, 'ainda nível 1');
      eq(P.addXp('hero-toll', 1), 1, '60 exato: sobe 1 nível');
      eq(P.state.heroes['hero-toll'].level, 2, 'nível 2');
      eq(P.addXp('hero-toll', 85), 1, '145 exato: nível 3');
      eq(P.state.heroes['hero-toll'].level, 3, 'nível 3');
      eq(P.addXp('hero-wick', 999999), LVL.maxLevel - 1, 'salto direto ao máximo: ' + (LVL.maxLevel - 1) + ' níveis');
      var wi = P.xpInfo('hero-wick');
      eq(wi.level, LVL.maxLevel, 'nível máximo');
      eq(wi.xpNext, null, 'sem próximo degrau');
      eq(wi.pct, 1, 'pct 1 no máximo');
      eq(P.state.heroes['hero-wick'].xp, LVL.xpTable[LVL.maxLevel - 1], 'xp truncado no teto (27135)');
      eq(P.addXp('hero-wick', 500), 0, 'no máximo não ganha mais');
      eq(P.state.heroes['hero-wick'].xp, LVL.xpTable[LVL.maxLevel - 1], 'xp segue no teto');
      eq(P.addXp('hero-rose', -50), 0, 'xp negativo é ignorado');
      eq(P.state.heroes['hero-rose'].xp, 0, 'xp não regride');
    });

    t('xpInfo: pct proporcional dentro do degrau', function () {
      P.reset();
      P.addXp('hero-rose', 100); // nível 2: degrau 60..145
      var i2 = P.xpInfo('hero-rose');
      eq(i2.level, 2, 'nível 2'); eq(i2.xp, 100, 'xp 100'); eq(i2.xpNext, 145, 'próximo em 145');
      near(i2.pct, 40 / 85, 1e-9, 'pct = (100-60)/(145-60)');
    });

    t('effectiveStats: save zerado == stats base (os 5 heróis) — invariante dos 62', function () {
      P.reset();
      for (var i = 0; i < D.heroes.length; i++) {
        var hd = D.heroes[i];
        if (hd.id.indexOf('t-') === 0) continue; // heróis de teste de outras suítes
        var es = P.effectiveStats(hd.id);
        eq(es.hp, hd.stats.hp, hd.id + ' hp');
        eq(es.pa, hd.stats.pa, hd.id + ' pa');
        eq(es.pm, hd.stats.pm, hd.id + ' pm');
        eq(es.initiative, hd.stats.initiative, hd.id + ' initiative');
        eq(es.power, hd.stats.power, hd.id + ' power');
        for (var el in hd.stats.resists) eq(es.resists[el], hd.stats.resists[el], hd.id + ' resist ' + el);
      }
      ok(P.effectiveStats('nao-existe') === null, 'herói desconhecido retorna null');
    });

    t('effectiveStats: perLevel aplica +hp/+power por nível acima do 1', function () {
      P.reset();
      P.addXp('hero-toll', 145); // nível 3 -> 2 níveis acima do 1
      var es = P.effectiveStats('hero-toll');
      eq(es.hp, 140 + 2 * LVL.perLevel.hp, 'hp +12');
      eq(es.power, 0 + 2 * LVL.perLevel.power, 'power +6');
      eq(es.pa, 6, 'pa inalterado');
      eq(es.pm, 3, 'pm inalterado');
      eq(es.initiative, 20, 'iniciativa inalterada');
    });

    t('equip/unequip: invariantes — sai do inventário, anterior volta, nada some/duplica', function () {
      P.reset();
      P.state.inventory.push('gh-pruning-shears', 'gh-thorn-whip', 'ci-salt-rapier');
      P.save();
      ok(P.equip('hero-toll', 'gh-pruning-shears'), 'equipa arma comum');
      eq(P.state.equipped['hero-toll'].weapon, 'gh-pruning-shears', 'no slot weapon');
      eq(P.state.inventory.indexOf('gh-pruning-shears'), -1, 'saiu do inventário');
      ok(P.equip('hero-toll', 'gh-thorn-whip'), 'troca de arma');
      eq(P.state.equipped['hero-toll'].weapon, 'gh-thorn-whip', 'nova arma no slot');
      ok(P.state.inventory.indexOf('gh-pruning-shears') >= 0, 'a anterior voltou ao inventário');
      eq(countEverywhere('gh-pruning-shears'), 1, 'tesoura: 1 cópia no mundo');
      eq(countEverywhere('gh-thorn-whip'), 1, 'chicote: 1 cópia no mundo');
      eq(countEverywhere('ci-salt-rapier'), 1, 'florete: 1 cópia no mundo');
      ok(!P.equip('hero-toll', 'gh-garden-apron'), 'item não possuído recusa');
      ok(!P.equip('hero-toll', 'nao-existe'), 'item inexistente recusa');
      ok(P.unequip('hero-toll', 'weapon'), 'desequipa');
      eq(P.state.equipped['hero-toll'].weapon, null, 'slot vazio');
      eq(countEverywhere('gh-thorn-whip'), 1, 'chicote voltou ao inventário (1 cópia)');
      ok(!P.unequip('hero-toll', 'weapon'), 'slot já vazio recusa');
      ok(!P.unequip('hero-toll', 'chapeu'), 'slot inválido recusa');
      eq(P.state.inventory.length, 3, 'inventário fecha com os 3 itens');
    });

    t('equip: duplicatas — equipar remove só UMA cópia', function () {
      P.reset();
      P.state.inventory.push('gh-pruning-shears', 'gh-pruning-shears');
      P.save();
      ok(P.equip('hero-rose', 'gh-pruning-shears'), 'equipa a 1ª cópia');
      eq(countEverywhere('gh-pruning-shears'), 2, 'as 2 cópias existem');
      eq(P.state.inventory.length, 1, '1 cópia segue no inventário');
      ok(P.equip('hero-morel', 'gh-pruning-shears'), 'outro herói equipa a 2ª cópia');
      eq(countEverywhere('gh-pruning-shears'), 2, 'ainda 2 cópias no mundo');
      eq(P.state.inventory.length, 0, 'inventário vazio');
    });

    t('effectiveStats: bônus dos equipados somam (hp/power/iniciativa/resists)', function () {
      P.reset();
      P.state.inventory.push('gh-thorn-whip', 'ci-brine-cuirass', 'gh-firefly-dome');
      P.save();
      ok(P.equip('hero-wick', 'gh-thorn-whip'), 'arma');
      ok(P.equip('hero-wick', 'ci-brine-cuirass'), 'armadura');
      ok(P.equip('hero-wick', 'gh-firefly-dome'), 'amuleto');
      var es = P.effectiveStats('hero-wick');
      eq(es.hp, 95 + 18, 'hp +18 (couraça)');
      eq(es.power, 0 + 9, 'power +9 (chicote)');
      eq(es.initiative, 85 + 8, 'iniciativa +8 (redoma)');
      eq(es.resists.earth, 10, '+10% terra (chicote)');
      eq(es.resists.water, 15, '+15% água (couraça)');
      eq(es.resists.fire, 0, 'fogo inalterado');
      eq(es.pa, 6, 'sem PA extra (nada épico)');
      eq(es.pm, 3, 'sem PM extra');
    });

    t('épicos: +1 PA/+1 PM refletem em paMax/pmMax/hpMax/power na batalha', function () {
      P.reset();
      // sanidade: com save zerado a batalha usa exatamente os stats base
      var st0 = E.createBattle('greenhouse', 0, ['hero-toll']);
      eq(st0.units[0].paMax, 6, 'base paMax 6');
      eq(st0.units[0].pmMax, 3, 'base pmMax 3');
      eq(st0.units[0].hpMax, 140, 'base hpMax 140');
      E.events.length = 0;
      // três épicos: arma +1 PA/+14 power, armadura +1 PA/+20 hp/+15 fogo, amuleto +1 PM/+15 hp/+10 água
      P.state.inventory.push('gh-widow-shears', 'em-first-grate', 'ci-pearl-choker');
      P.save();
      ok(P.equip('hero-toll', 'gh-widow-shears'), 'épico arma');
      ok(P.equip('hero-toll', 'em-first-grate'), 'épico armadura');
      ok(P.equip('hero-toll', 'ci-pearl-choker'), 'épico amuleto');
      var es = P.effectiveStats('hero-toll');
      eq(es.pa, 8, 'pa 6+1+1'); eq(es.pm, 4, 'pm 3+1');
      eq(es.hp, 140 + 20 + 15, 'hp +35'); eq(es.power, 14, 'power +14');
      var st = E.createBattle('greenhouse', 0, ['hero-toll']);
      var u = st.units[0];
      eq(u.paMax, 8, 'paMax na batalha'); eq(u.pa, 8, 'pa cheio no turno 1');
      eq(u.pmMax, 4, 'pmMax na batalha'); eq(u.pm, 4, 'pm cheio');
      eq(u.hpMax, 175, 'hpMax na batalha'); eq(u.hp, 175, 'hp cheio');
      eq(u.power, 14, 'power na batalha');
      eq(u.resists.fire, 15, 'resist fogo na batalha');
      eq(u.resists.water, 10, 'resist água na batalha');
      E.events.length = 0;
    });

    t('rollDrops: 1 sorteio em sala comum, 2 no chefe; tudo vai ao inventário', function () {
      P.reset();
      var d0 = P.rollDrops('greenhouse', 0, 3);
      eq(d0.length, 1, 'sala 0: 1 drop');
      ok(!!D.items[d0[0]], 'item existe');
      eq(D.items[d0[0]].dungeonId, 'greenhouse', 'item do calabouço certo');
      eq(P.state.inventory.length, 1, 'foi ao inventário');
      eq(P.state.inventory[0], d0[0], 'o mesmo item');
      var d1 = P.rollDrops('greenhouse', 1, 2);
      eq(d1.length, 1, 'sala 1: 1 drop');
      var d2 = P.rollDrops('greenhouse', 2, 1);
      eq(d2.length, 2, 'sala do chefe: 2 drops');
      eq(P.state.inventory.length, 4, 'inventário com os 4');
      eq(P.rollDrops('nao-existe', 0, 3).length, 0, 'dungeon desconhecido: sem drops');
    });

    t('rollDrops: minRoom respeitado — épico nunca antes do chefe, presente no chefe', function () {
      P.reset();
      var i, d, epicsEarly = 0;
      for (i = 0; i < 700; i++) {
        d = P.rollDrops('greenhouse', 0, 1); // solo = maior chance de épico
        if (d[0] === 'gh-widow-shears') epicsEarly++;
        d = P.rollDrops('greenhouse', 1, 1);
        if (d[0] === 'gh-widow-shears') epicsEarly++;
        if (P.state.inventory.length > 800) P.reset();
      }
      eq(epicsEarly, 0, 'épico (minRoom 2) não cai nas salas 0/1');
      P.reset();
      var seen = false;
      for (i = 0; i < 600 && !seen; i++) {
        d = P.rollDrops('greenhouse', 2, 1);
        if (d.indexOf('gh-widow-shears') >= 0) seen = true;
        if (P.state.inventory.length > 800) P.reset();
      }
      ok(seen, 'épico aparece na sala do chefe (solo)');
      P.reset();
    });

    t('rollDrops estatístico (≥2000 sorteios): LUCK solo favorece épicos com margem clara', function () {
      // pesos reais da Estufa: comuns 30x3, raros 12x3, épico 4 (minRoom 2)
      // trio (LUCK 1.0): p(épico) = 4/130 ≈ 3,1% | solo (LUCK 2.4): 23,04/199,44 ≈ 11,6%
      function epicRate(partySize) {
        P.reset();
        var epics = 0, total = 0;
        for (var i = 0; i < 1200; i++) { // 1200 chamadas x2 sorteios = 2400 sorteios
          var d = P.rollDrops('greenhouse', 2, partySize);
          for (var j = 0; j < d.length; j++) {
            total++;
            if (D.items[d[j]].rarity === 'epic') epics++;
          }
          if (P.state.inventory.length > 2000) P.reset();
        }
        eq(total, 2400, '2400 sorteios');
        return epics / total;
      }
      var solo = epicRate(1);
      var trio = epicRate(3);
      ok(solo > 0.07, 'solo ~11,6% de épico (obtido ' + (solo * 100).toFixed(2) + '%)');
      ok(trio < 0.06, 'trio ~3,1% de épico (obtido ' + (trio * 100).toFixed(2) + '%)');
      ok(solo > trio * 1.5, 'margem clara: solo (' + (solo * 100).toFixed(2) + '%) > 1.5x trio (' + (trio * 100).toFixed(2) + '%)');
      P.reset();
    });

    t('save/load: roundtrip preserva xp/inventário/equipados; reset zera tudo', function () {
      P.reset();
      P.addXp('hero-toll', 200);
      P.state.inventory.push('gh-amber-sap');
      P.save();
      ok(P.equip('hero-toll', 'gh-amber-sap'), 'equipa amuleto');
      P.rollDrops('greenhouse', 0, 2);
      var before = JSON.stringify(P.state);
      P.state = null;
      P.load();
      eq(JSON.stringify(P.state), before, 'roundtrip idêntico byte a byte');
      eq(P.state.heroes['hero-toll'].xp, 200, 'xp persistiu');
      eq(P.state.heroes['hero-toll'].level, 3, 'nível persistiu');
      eq(P.state.equipped['hero-toll'].trinket, 'gh-amber-sap', 'equipado persistiu');
      P.reset();
      eq(P.state.inventory.length, 0, 'reset: inventário vazio');
      eq(P.state.heroes['hero-toll'].level, 1, 'reset: nível 1');
      eq(P.state.heroes['hero-toll'].xp, 0, 'reset: xp 0');
      eq(P.state.equipped['hero-toll'].trinket, null, 'reset: slots vazios');
    });

    t('startRun: aceita 1 e 2 heróis com spawns corretos; rejeita 0/4', function () {
      P.reset();
      G.init();
      ok(!G.startRun([], 'p-arena'), '0 heróis recusado');
      ok(!G.startRun(['hero-toll', 'hero-wick', 'hero-rose', 'hero-morel'], 'p-arena'), '4 heróis recusado');
      ok(G.startRun(['hero-toll'], 'p-arena'), 'solo aceito');
      var st = G.state, heroes = 0, monsters = 0, i;
      var layout = null;
      for (i = 0; i < D.dungeons.length; i++) if (D.dungeons[i].id === 'p-arena') layout = D.dungeons[i].rooms[0].layout;
      for (i = 0; i < st.units.length; i++) {
        if (st.units[i].kind === 'hero') {
          heroes++;
          eq(layout[st.units[i].y].charAt(st.units[i].x), 'P', 'herói em célula P');
          eq(st.units[i].side, 'player', 'lado player');
        } else monsters++;
      }
      eq(heroes, 1, 'solo: 1 herói'); eq(monsters, 2, '2 monstros');
      G.init();
      ok(G.startRun(['hero-toll', 'hero-rose'], 'p-arena'), 'dupla aceita');
      st = G.state; heroes = 0;
      for (i = 0; i < st.units.length; i++) if (st.units[i].kind === 'hero') heroes++;
      eq(heroes, 2, 'dupla: 2 heróis');
      eq(st.units[0].defId, 'hero-toll', '1º herói na ordem passada');
      eq(st.units[1].defId, 'hero-rose', '2º herói na ordem passada');
      eq(layout[st.units[0].y].charAt(st.units[0].x), 'P', '1º em célula P');
      eq(layout[st.units[1].y].charAt(st.units[1].x), 'P', '2º em célula P');
      ok(st.units[0].x !== st.units[1].x || st.units[0].y !== st.units[1].y, 'spawns distintos');
      E.events.length = 0;
    });

    t('XP dividido por grupo de 2 + dados na tela roomClear (xpGanho/levelUps/drops)', function () {
      P.reset();
      captured.length = 0;
      JOGO.UI = { showScreen: function (name, data) { captured.push({ name: name, data: data }); } };
      G.init();
      ok(G.startRun(['hero-toll', 'hero-rose'], 'p-arena'), 'começa a run');
      nukeRoom('hero-toll'); // sala 0: p-grunt (31) + p-brute (24) = 55 xp
      eq(G.screen, 'roomClear', 'tela roomClear');
      var last = captured[captured.length - 1];
      eq(last.name, 'roomClear', 'UI recebeu roomClear');
      eq(last.data.xpGanho, 27, 'floor(55/2) = 27');
      eq(P.state.heroes['hero-toll'].xp, 27, 'Repique +27');
      eq(P.state.heroes['hero-rose'].xp, 27, 'Rosácea +27');
      eq(last.data.levelUps.length, 0, '27 xp não sobe nível');
      eq(last.data.drops.length, 1, '1 drop em sala comum');
      ok(P.state.inventory.indexOf(last.data.drops[0]) >= 0, 'drop no inventário');
    });

    t('levelUps reportados; dungeonComplete com dados da última sala (2 drops no chefe)', function () {
      // continua a run do teste anterior (sala 0 vencida, toll/rose com 27 xp)
      eq(G.screen, 'roomClear', 'run em andamento');
      P.addXp('hero-toll', 32); // 59 xp: a 1 do nível 2
      ok(G.nextRoom(), 'sala 1');
      nukeRoom('hero-toll'); // p-grunt: 31 -> floor(31/2) = 15 por herói
      var last = captured[captured.length - 1];
      eq(last.name, 'roomClear', 'roomClear da sala 1');
      eq(last.data.xpGanho, 15, 'floor(31/2)');
      eq(P.state.heroes['hero-toll'].xp, 74, 'Repique 59+15');
      eq(P.state.heroes['hero-toll'].level, 2, 'Repique subiu');
      eq(last.data.levelUps.length, 1, '1 level up reportado');
      eq(last.data.levelUps[0].heroId, 'hero-toll', 'quem subiu');
      eq(last.data.levelUps[0].novoNivel, 2, 'novo nível');
      eq(P.state.heroes['hero-rose'].level, 1, 'Rosácea (42 xp) não subiu');
      ok(G.nextRoom(), 'sala do chefe');
      nukeRoom('hero-toll'); // p-brute: 24 -> floor(24/2) = 12
      eq(G.screen, 'dungeonComplete', 'calabouço completo');
      last = captured[captured.length - 1];
      eq(last.name, 'dungeonComplete', 'UI recebeu dungeonComplete');
      eq(last.data.xpGanho, 12, 'xp da última sala');
      eq(last.data.drops.length, 2, 'chefe: 2 drops');
      delete JOGO.UI;
    });

    t('XP: summon INIMIGO morto dá xp; invocação do PRÓPRIO jogador morta não dá', function () {
      P.reset();
      G.init();
      ok(G.startRun(['hero-toll'], 'p-arena'), 'solo');
      var st = G.state;
      var h = heroUnit(st, 'hero-toll');
      h.spells.push('p-nuke', 'p-summon');
      var grunt = byDef(st, 'p-grunt'), brute = byDef(st, 'p-brute');
      grunt.spells.push('p-summon');
      ok(E.cast(st, grunt.uid, 'p-summon', 4, 1), 'inimigo invoca');
      var enemyImp = byDef(st, 'p-imp', 0);
      eq(enemyImp.side, 'enemy', 'imp inimigo');
      ok(E.cast(st, h.uid, 'p-summon', 2, 1), 'jogador invoca');
      var playerImp = byDef(st, 'p-imp', 1);
      eq(playerImp.side, 'player', 'imp do jogador');
      ok(E.cast(st, h.uid, 'p-nuke', playerImp.x, playerImp.y), 'mata a própria invocação');
      ok(!playerImp.alive, 'invocação do jogador morta');
      ok(E.cast(st, h.uid, 'p-nuke', enemyImp.x, enemyImp.y), 'mata o imp inimigo');
      ok(E.cast(st, h.uid, 'p-nuke', grunt.x, grunt.y), 'mata o grunt');
      ok(E.cast(st, h.uid, 'p-nuke', brute.x, brute.y), 'mata o brute');
      eq(st.phase, 'won', 'vitória');
      G.update(0.1);
      // 31 (grunt) + 24 (brute) + 7 (imp inimigo) = 62; imp do jogador NÃO conta
      eq(P.state.heroes['hero-toll'].xp, 62, 'xp = 62 (sem o imp do jogador)');
      E.events.length = 0;
    });

    t('autoplay: solo nível 20 com 3 épicos vence a Estufa sala 0 mais fácil que nível 1', function () {
      P.reset();
      var base = autoplay('greenhouse', 0, ['hero-toll']); // nível 1, sem itens
      P.addXp('hero-toll', LVL.xpTable[LVL.maxLevel - 1]); // nível 20
      P.state.inventory.push('gh-widow-shears', 'em-first-grate', 'ci-pearl-choker');
      P.save();
      ok(P.equip('hero-toll', 'gh-widow-shears'), 'épico arma');
      ok(P.equip('hero-toll', 'em-first-grate'), 'épico armadura');
      ok(P.equip('hero-toll', 'ci-pearl-choker'), 'épico amuleto');
      var st = E.createBattle('greenhouse', 0, ['hero-toll']);
      eq(st.units[0].paMax, 8, 'veterano: paMax 8 (+2 PA épicos)');
      eq(st.units[0].pmMax, 4, 'veterano: pmMax 4 (+1 PM épico)');
      eq(st.units[0].hpMax, 140 + 19 * LVL.perLevel.hp + 35, 'veterano: hpMax 289');
      eq(st.units[0].power, 19 * LVL.perLevel.power + 14, 'veterano: power 71');
      E.events.length = 0;
      var boosted = autoplay('greenhouse', 0, ['hero-toll']);
      eq(boosted.phase, 'won', 'veterano equipado vence a sala');
      var baseScore = base.phase === 'won' ? 1000 + base.heroHp : base.turns;
      var boostScore = boosted.phase === 'won' ? 1000 + boosted.heroHp : boosted.turns;
      ok(boostScore > baseScore, 'vence mais fácil: score veterano ' + boostScore +
        ' (fase ' + boosted.phase + ', hp ' + boosted.heroHp + ') vs base ' + baseScore +
        ' (fase ' + base.phase + ', hp ' + base.heroHp + ')');
      P.reset();
    });
  }

  // ------------------------------------------------------------ executa
  try {
    run();
  } catch (e) {
    failed++;
    failures.push('ERRO FATAL DA SUÍTE: ' + e.message);
    report('ERRO FATAL DA SUÍTE', false, e.message + ' ' + (e.stack || ''));
  }

  if (JOGO.UI && !JOGO.UI.init) delete JOGO.UI; // remove o stub se um teste falhou no meio
  restoreRealSave(); // não deixa o save de teste persistido

  var summary = document.getElementById('summary');
  summary.textContent = passed + ' PASS / ' + failed + ' FAIL (' + (passed + failed) + ' testes)';
  summary.className = failed === 0 ? 'allpass' : 'somefail';
  window.TEST_RESULTS = { passed: passed, failed: failed, failures: failures };
  console.log('TEST_RESULTS', JSON.stringify(window.TEST_RESULTS));
})();
</script>
