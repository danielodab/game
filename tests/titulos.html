<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOTERRA — os títulos da plaquinha</title>
<style>
  body { margin: 0; padding: 18px; background: #0f1216; color: #ece4d4;
         font: 14px/1.55 system-ui, sans-serif; }
  h1 { font-size: 17px; color: #ffc44d; margin: 0 0 4px; }
  p.sub { color: #8b93a0; font-size: 12.5px; margin: 0 0 14px; max-width: 70ch; }
  #placar { font-size: 13px; padding: 8px 10px; border: 1px solid #3a4553; border-radius: 8px;
            margin-bottom: 10px; }
  .ok { color: #5fd08a; } .ruim { color: #ff6b5a; }
  li { margin: 2px 0; } li.f { color: #ff6b5a; } li.p { color: #7fe08a; }
  ul { padding-left: 18px; }
</style>
</head>
<body>
<!-- A RÉGUA DOS TÍTULOS (11/09). Título deixou de vir de missão: vem de
     pódio (níveis e arena) ou de dez quedas do mesmo chefe no difícil e
     sozinho. Esta prova cobra a régua inteira sem 3D e sem HUD. -->
<h1>Os títulos da plaquinha</h1>
<p class="sub">Pódio de níveis, pódio da arena e as dez quedas de chefe. Os de ranking são
emprestados (a posição foi, o título vai); os de chefe são para sempre.</p>
<div id="placar">medindo…</div>
<ul id="lista"></ul>
<script src="../js/core/titulos.js"></script>
<script>
(function () {
  var T = JOGO.Titulos;
  var falhas = [], linhas = [];
  function check(nome, ok, extra) {
    linhas.push('<li class="' + (ok ? 'p' : 'f') + '">' + (ok ? 'PASSOU' : 'FALHOU') +
                ' · ' + nome + (extra ? ' <i>(' + extra + ')</i>' : '') + '</li>');
    if (!ok) falhas.push(nome);
  }

  check('o módulo subiu', !!T && typeof T.catalogo === 'function');

  // ---- conta nova: nada ganho
  var zerado = T.catalogo({ chefes: {}, pvm: null, pvp: null });
  check('o catálogo tem 3 + 3 + 6 títulos', zerado.length === 12, zerado.length);
  check('conta nova não tem título nenhum', T.ganhos({}).length === 0);
  check('nenhum título repete', (function () {
    var vistos = {}, dup = false;
    zerado.forEach(function (t) { if (vistos[t.titulo]) dup = true; vistos[t.titulo] = 1; });
    return !dup;
  })());
  check('nenhum título se passa pela equipe do jogo', zerado.every(function (t) {
    return !/\b(gm|admin|mestre|staff)\b/i.test(t.titulo);
  }), zerado.map(function (t) { return t.titulo; }).join(' · '));

  // ---- os pódios
  check('1º do ranking de XP ganha o Top 1 PVM',
        T.ganhos({ pvm: 1 }).indexOf('Top 1 PVM') >= 0);
  check('3º do ranking PvP ganha o Top 3 Pvp',
        T.ganhos({ pvp: 3 }).indexOf('Top 3 Pvp') >= 0);
  check('os seis títulos de pódio têm os nomes pedidos',
        T.PVM.map(function (d) { return d.titulo; }).join('|') === 'Top 1 PVM|Top 2 PVM|Top 3 PVM' &&
        T.PVP.map(function (d) { return d.titulo; }).join('|') === 'Top 1 Pvp|Top 2 Pvp|Top 3 Pvp');
  check('o nome do top 1, 2 e 3 do ranking de XP acende em ouro, prata e bronze',
        T.medalhaDe(1) === 'ouro' && T.medalhaDe(2) === 'prata' && T.medalhaDe(3) === 'bronze' &&
        T.medalhaDe(4) === null && T.medalhaDe(null) === null);
  check('as posições saem do ranking pelo nome, sem caixa nem espaço, só os três primeiros',
        (function () {
          var p = T.posicoesPorNome([{ nome: 'Ana' }, { nome: ' bia ' }, { nome: 'Caio' }, { nome: 'Duda' }]);
          return p.ana === 1 && p.bia === 2 && p.caio === 3 && !p.duda && T.chaveNome(' ANA ') === 'ana';
        })());
  check('4º lugar não ganha nada', T.ganhos({ pvm: 4, pvp: 9 }).length === 0);
  check('o pódio dá UM título por lista, não três',
        T.ganhos({ pvm: 2, pvp: 2 }).length === 2, T.ganhos({ pvm: 2, pvp: 2 }).join(' · '));

  // ---- os chefes
  var noveQuedas = { chefes: { 'boss-gardener': 9 } };
  check('nove quedas não bastam', T.ganhos(noveQuedas).length === 0);
  check('a décima queda entrega o título',
        T.ganhos({ chefes: { 'boss-gardener': 10 } }).indexOf('o Podador da Viúva') >= 0);
  check('o progresso aparece antes do prêmio', (function () {
    var l = T.catalogo(noveQuedas).filter(function (t) { return t.chefe === 'boss-gardener'; })[0];
    return l && l.prog === 9 && l.alvo === 10 && !l.ganho;
  })());
  check('cada um dos SEIS chefes tem título próprio', (function () {
    var todos = {};
    T.CHEFES.forEach(function (c) { todos[c.titulo] = 1; });
    return T.CHEFES.length === 6 && Object.keys(todos).length === 6;
  })());
  check('queda a mais não quebra nem duplica',
        T.ganhos({ chefes: { 'boss-baroness': 99 } }).length === 1);

  // ---- o empréstimo
  check('título de chefe é PARA SEMPRE',
        T.catalogo({ chefes: { 'boss-deepknock': 10 } })
          .filter(function (t) { return t.ganho; })[0].emprestado === false);
  check('título de pódio é EMPRESTADO',
        T.catalogo({ pvm: 1 }).filter(function (t) { return t.ganho; })[0].emprestado === true);
  check('perder a posição invalida o título de pódio',
        T.valido('Top 1 PVM', { pvm: 1 }) === true &&
        T.valido('Top 1 PVM', { pvm: 2 }) === false);
  check('perder a posição NÃO invalida o de chefe',
        T.valido('o Cala-Batida', { chefes: { 'boss-deepknock': 10 }, pvm: null }) === true);
  check('título inventado nunca é válido', T.valido('o Rei de Tudo', { pvm: 1 }) === false);
  check('sem título é sem título', T.valido(null, { pvm: 1 }) === false);

  // ---- a posição numa lista ordenada
  check('posicaoDe acha o 1º, o 3º e ignora o 4º',
        T.posicaoDe(['a', 'b', 'c', 'd'], 'a') === 1 &&
        T.posicaoDe(['a', 'b', 'c', 'd'], 'c') === 3 &&
        T.posicaoDe(['a', 'b', 'c', 'd'], 'd') === null);
  check('posicaoDe aguenta lista vazia e id vazio',
        T.posicaoDe([], 'a') === null && T.posicaoDe(['a'], null) === null);

  // ---- o pódio de cada classe (13/09): título sem brilho
  var nomesC = { sumo: 'Bárbaro', invocador: 'Xamã', minotauro: 'Minotauro' };
  var estC = { classeNomes: nomesC, porClasse: { invocador: 1, sumo: 2 } };
  check('o pódio de classe dá "Top 1 Xamã" e "Top 2 Bárbaro"',
        T.ganhos(estC).indexOf('Top 1 Xamã') >= 0 && T.ganhos(estC).indexOf('Top 2 Bárbaro') >= 0 &&
        T.ganhos(estC).length === 2, T.ganhos(estC).join(' · '));
  check('o catálogo tem 3 títulos por classe', T.catalogo(estC).filter(function (t) { return t.fonte === 'classe'; }).length === 9);
  check('perder a posição na classe invalida o título dela',
        T.valido('Top 1 Xamã', estC) === true && T.valido('Top 1 Xamã', { classeNomes: nomesC, porClasse: {} }) === false);
  check('o pódio de classe não acende o nome (o brilho é só do ranking de XP)',
        T.medalhaDe(null) === null && !T.catalogo(estC).some(function (t) { return t.fonte === 'classe' && t.brilho; }));

  // ---- tudo junto
  var cheio = { chefes: { 'boss-gardener': 10, 'boss-riftheart': 12 }, pvm: 1, pvp: 3 };
  check('uma conta pode acumular vários títulos ganhos',
        T.ganhos(cheio).length === 4, T.ganhos(cheio).join(' · '));

  document.getElementById('lista').innerHTML = linhas.join('');
  var pl = document.getElementById('placar');
  pl.className = falhas.length ? 'ruim' : 'ok';
  pl.textContent = falhas.length ? ('FALHOU: ' + falhas.join(' · '))
                                 : ('tudo passou (' + linhas.length + ')');
})();
</script>
</body>
</html>
