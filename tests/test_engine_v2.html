<script>
(function () {
  'use strict';

  var passed = 0, failed = 0, failures = [], notes = [];
  var resultsEl = document.getElementById('results');

  function report(name, ok, msg) {
    var div = document.createElement('div');
    div.className = 't ' + (ok ? 'pass' : 'fail');
    div.textContent = name;
    if (!ok && msg) {
      var m = document.createElement('div');
      m.className = 'msg';
      m.textContent = msg;
      div.appendChild(m);
    }
    resultsEl.appendChild(div);
    if (ok) console.log('PASS: ' + name);
    else console.error('FAIL: ' + name + ' — ' + msg);
  }
  function section(title) {
    var h = document.createElement('h2');
    h.textContent = title;
    resultsEl.appendChild(h);
  }
  function t(name, fn) {
    try { fn(); passed++; report(name, true); }
    catch (e) {
      failed++; failures.push(name + ' — ' + e.message);
      report(name, false, e.message + (e.stack ? ' | ' + String(e.stack).split('\n')[1] : ''));
    }
  }
  function ok(cond, msg) { if (!cond) throw new Error(msg || 'asserção falhou'); }
  function eq(a, b, msg) {
    if (a !== b) throw new Error((msg || 'eq') + ' — esperado [' + b + '], obtido [' + a + ']');
  }

  if (!window.JOGO || !JOGO.Engine) {
    failed++;
    failures.push('ERRO FATAL: JOGO.Engine não carregou');
    report('ERRO FATAL: JOGO.Engine não carregou', false, 'verifique js/core/engine.js');
    finish();
    return;
  }

  var E = JOGO.Engine;
  var F = JOGO.Fusion;
  var D = JOGO.DATA = JOGO.DATA || {};

  // ======================================================== RNG determinístico
  // Reimplementa mulberry32 do motor para ESCOLHER a semente que produz os
  // sorteios desejados — os testes de esquiva e de surpresa ficam exatos.
  function draw(seed) {
    var s = (seed + 0x6D2B79F5) >>> 0;
    var x = s;
    x = Math.imul(x ^ (x >>> 15), x | 1);
    x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
    return { value: ((x ^ (x >>> 14)) >>> 0) / 4294967296, next: s };
  }
  // Ajusta state._rng para que os próximos sorteios satisfaçam `preds` (em ordem).
  function setRolls(state, preds) {
    for (var s = 1; s < 400000; s++) {
      var cur = s, good = true;
      for (var i = 0; i < preds.length; i++) {
        var r = draw(cur);
        cur = r.next;
        if (!preds[i](r.value)) { good = false; break; }
      }
      if (good) { state._rng = s; return s; }
    }
    throw new Error('nenhuma semente satisfaz os sorteios pedidos');
  }
  function lt(x) { return function (v) { return v < x; }; }
  function gte(x) { return function (v) { return v >= x; }; }

  // ============================================================ FIXTURES v2
  function zeroRes() { return { neutro: 0, fogo: 0, agua: 0, terra: 0, ar: 0 }; }

  function baseStats(over) {
    var s = { hp: 100, pa: 6, pp: 3, initiative: 10, power: 0, dodge: 0, lock: 0, resists: zeroRes() };
    for (var k in over) { if (k === 'resists') { for (var r in over.resists) s.resists[r] = over.resists[r]; } else s[k] = over[k]; }
    return s;
  }
  function sp(id, over, bucket) {
    var s = {
      id: id, name: id, element: 'neutro', classId: null, unlockLevel: 0,
      paCost: 1, cooldown: 0, castsPerTurn: 0,

      aoe: { shape: 'single', size: 0 }, needsEmptyTile: false, targetSide: 'any',

    for (var k in over) s[k] = over[k];

    return s;

    for (var k in over) {
      if (k === 'stats') { for (var k2 in over.stats) m.stats[k2] = over.stats[k2]; }
      else m[k] = over[k];

    D.monsters[id] = m;

      tileEventRate: 0, lootTable: [], cardDrops: [],
      rooms: [ { name: 'sala', weather: 't-calmo', sceneryTheme: 'teste', layout: [
            '#######',
            '#P...a#',

            '#######'],

    });

    // calabouço com eventos de terreno garantidos
    D.dungeons.push({
      id: 'test-events-v2', name: 'Eventos de Teste', theme: 'teste', description: 'teste',
      difficulty: 1, order: 99, palette: {}, defaultWeather: 't-calmo',
      weatherShiftEveryRounds: 0, tileEventRate: 1, tileEventSpawnPerRound: 2,
      lootTable: [], cardDrops: [],
      rooms: [ { name: 'sala', weather: 't-calmo', sceneryTheme: 'teste', layout: [

            '#.......#',
            '#P......#',
            '#########'],
          monsters: { a: 't-dummy' } } ]
    });
  }

  // ============================================================ helpers
  var TD = null, TCYCLE = null, TEVENTS = null;
  function P(over) {
    var p = { heroId: 't-h1', classId: 't-alfa', element: 'neutro', level: 1,
              spells: T_SPELLS.slice(), pet: null, items: {} };
    for (var k in over) p[k] = over[k];
    return p;
  }
  function P2(over) {
    var p = { heroId: 't-h2', classId: 't-beta', element: 'neutro', level: 1,
              spells: ['t-nuke10'], pet: null, items: {} };
    for (var k in over) p[k] = over[k];
    return p;
  }
  function arena(roomIdx, monsters, party) {
    if (monsters) TD.rooms[roomIdx].monsters = monsters;
    E.events.length = 0;
    return E.createBattle('test-arena-v2', roomIdx, party || [P()]);
  }
  function byHero(state, heroId) {
    for (var i = 0; i < state.units.length; i++) {
      if (state.units[i].heroId === heroId) return state.units[i];
    }
    return null;
  }
  function byDef(state, defId, nth) {
    var n = nth || 0;
    for (var i = 0; i < state.units.length; i++) {
      if (state.units[i].defId === defId) { if (n === 0) return state.units[i]; n--; }
    }
    return null;
  }
  function petOf(state, ownerUid) {
    for (var i = 0; i < state.units.length; i++) {
      if (state.units[i].kind === 'pet' && state.units[i].ownerUid === ownerUid) return state.units[i];
    }
    return null;
  }
  function drain() { var evs = E.events.slice(); E.events.length = 0; return evs; }
  function findEv(evs, type, pred) {
    for (var i = 0; i < evs.length; i++) {
      if (evs[i].type === type && (!pred || pred(evs[i]))) return evs[i];
    }
    return null;
  }
  function countEv(evs, type, pred) {
    var n = 0;
    for (var i = 0; i < evs.length; i++) {
      if (evs[i].type === type && (!pred || pred(evs[i]))) n++;
    }
    return n;
  }
  function toHero(state, heroId) {
    var id = heroId || 't-h1';
    for (var g = 0; g < 40; g++) {
      var a = E.activeUnit(state);
      if (a && a.heroId === id) return;
      E.endTurn(state);
      if (state.phase !== 'playing') return;
    }
    throw new Error('não voltou ao turno do herói de teste');
  }
  function nextRound(state, heroId) {
    E.endTurn(state);
    if (state.phase === 'playing') toHero(state, heroId);
  }
  function manh(a, b) { return Math.abs(a.x - b.x) + Math.abs(a.y - b.y); }

  // Misturas de teste: instaladas só durante a seção de Fusão (as chaves são
  // pares de ELEMENTO e colidiriam com as misturas reais do Criativo Fusão).
  var BLEND_BACKUP = null;
  function blend(affix, els, rider, riderSupport, fx) {
    return { id: els[0] + '+' + els[1], affix: affix, elements: els.slice(),
             description: 'teste', rider: rider, riderSupport: riderSupport,
             palette: {}, fxKey: fx };
  }
  function useTestBlends() {
    if (BLEND_BACKUP) return;
    var poison = [{ type: 'poison', element: 'agua', min: 3, max: 3, duration: 2 }];
    var mend = [{ type: 'regen', min: 3, max: 3, duration: 2 }];
    var mine = {
      'ar+agua': blend('Salgado', ['ar', 'agua'], poison, mend, 'fx-salgado'),
      'agua+ar': blend('Salgado', ['agua', 'ar'], poison, mend, 'fx-salgado'),
      'ar+neutro': blend('Rascante', ['ar', 'neutro'], [], [], 'fx-rasc'),
      'neutro+ar': blend('Rascante', ['neutro', 'ar'], [], [], 'fx-rasc'),
      'neutro+neutro': blend('Bruto', ['neutro', 'neutro'],
        [{ type: 'buff', stat: 'power', value: 5, duration: 2 }],
        [{ type: 'buff', stat: 'power', value: 5, duration: 2 }], 'fx-bruto')
    };
    BLEND_BACKUP = {};
    for (var k in mine) {
      BLEND_BACKUP[k] = D.fusionBlends[k];
      D.fusionBlends[k] = mine[k];
    }
  }
  function restoreBlends() {
    if (!BLEND_BACKUP) return;
    for (var k in BLEND_BACKUP) {
      if (BLEND_BACKUP[k] === undefined) delete D.fusionBlends[k];
      else D.fusionBlends[k] = BLEND_BACKUP[k];
    }
    BLEND_BACKUP = null;
  }

  // ============================================================ SUITE
  function run() {
    installTestData();
    var i;
    for (i = 0; i < D.dungeons.length; i++) {
      if (D.dungeons[i].id === 'test-arena-v2') TD = D.dungeons[i];
      if (D.dungeons[i].id === 'test-cycle-v2') TCYCLE = D.dungeons[i];
      if (D.dungeons[i].id === 'test-events-v2') TEVENTS = D.dungeons[i];
    }

    // ================================================== 0. NOMENCLATURA pp
    section('0 — Nomenclatura PA/PP e dados modulares');

    t('renomeação: unidades expõem pp/ppMax e nenhum campo da sigla aposentada', function () {
      var st = arena(0, { a: 't-dummy', b: 't-dummy' });
      var h = byHero(st, 't-h1');
      ok(typeof h.pp === 'number', 'pp existe');
      ok(typeof h.ppMax === 'number', 'ppMax existe');
      // a sigla antiga é montada em tempo de execução para que uma busca por
      // texto no projeto continue devolvendo ZERO ocorrências dela
      var legacy = 'p' + 'm';
      ok(h[legacy] === undefined, 'campo da sigla antiga não existe');
      ok(h[legacy + 'Max'] === undefined, 'campo máximo da sigla antiga não existe');
      var json = JSON.stringify(st.units);
      ok(json.indexOf('"' + legacy + '"') < 0, 'nenhuma unidade serializa a sigla antiga');
      eq(h.pp, 3, 'pp inicial');
    });

    t('Engine.spell: resolve em spells, monsterSpells, petSpells e itemSpells', function () {
      ok(!!E.spell('t-nuke100'), 'DATA.spells');
      ok(!!E.spell('t-mon-bite'), 'DATA.monsterSpells');
      ok(!!E.spell('t-pet-bite'), 'DATA.petSpells');
      ok(!!E.spell('t-item-zap'), 'DATA.itemSpells');
      ok(E.spell('nao-existe-xyz') === null, 'id inexistente devolve null');
      eq(E.spell('t-item-zap').effects[0].element, 'ar', 'feitiço de item íntegro');
    });

    t('Engine.spell: resolve também DATA.fusionSpells (payloads de fusão)', function () {
      if (!D.fusionSpells) { notes.push('DATA.fusionSpells ausente: teste pulado.'); return; }
      var ids = Object.keys(D.fusionSpells);
      ok(ids.length > 0, 'há payloads de fusão');
      for (var k = 0; k < ids.length; k++) {
        ok(!!E.spell(ids[k]), 'resolve ' + ids[k]);
      }
      ok(!!E.spell('fus-turret-shot'), 'feitiço do invocado da fusão');
    });

    t('Engine.monster: resolve DATA.monsters e DATA.fusionSummons', function () {
      ok(!!E.monster('t-dummy'), 'monstro de teste');
      ok(E.monster('nao-existe-xyz') === null, 'id inexistente devolve null');
      if (!D.fusionSummons) { notes.push('DATA.fusionSummons ausente: parte do teste pulada.'); return; }
      var ids = ['fus-arrow-turret', 'fus-hex-effigy', 'fus-bloom-warden',
                 'fus-shade-twin', 'fus-bulwark-idol'];
      for (var k = 0; k < ids.length; k++) {
        var m = E.monster(ids[k]);
        ok(!!m, 'resolve ' + ids[k]);
        ok(!!m.stats && typeof m.stats.pp === 'number', ids[k] + ' tem stats com pp');
      }
    });

    t('efeito summon: aceita invocados de fusão (DATA.fusionSummons)', function () {
      if (!D.fusionSummons) { return; }
      sp('t-fus-summon', { range: { min: 1, max: 6, line: false, los: false },
        needsEmptyTile: true, effects: [{ type: 'summon', monsterId: 'fus-arrow-turret' }] });
      var st = arena(0, { a: 't-dummy', b: 't-dummy' });
      var h = byHero(st, 't-h1');
      h.spells.push('t-fus-summon');
      var n0 = st.units.length;
      ok(E.cast(st, h.uid, 't-fus-summon', 2, 2) === true, 'invoca a torre');
      eq(st.units.length, n0 + 1, 'unidade criada');
      var su = st.units[st.units.length - 1];
      eq(su.defId, 'fus-arrow-turret', 'defId do invocado');
      eq(su.side, 'player', 'lado do invocador');
      eq(su.kind, 'summon', 'kind summon');
      ok(!!E.spell(su.spells[0]), 'feitiço do invocado é resolvível');
    });

    t('Engine.registerSpell: feitiço em memória é resolvido por Engine.spell', function () {
      E.registerSpell({ id: 't-gen-1', name: 'Gerado', element: 'terra', paCost: 1,
        cooldown: 0, castsPerTurn: 0, range: { min: 0, max: 3 }, aoe: { shape: 'single', size: 0 },
        effects: [{ type: 'damage', element: 'terra', min: 1, max: 1 }] });
      ok(!!E.spell('t-gen-1'), 'registrado');
      eq(E.spell('t-gen-1').name, 'Gerado', 'nome');
    });

    // ================================================== 1. CRIAÇÃO
    section('1 — Criação de batalha, ordem e grade');

    t('createBattle: grade, spawns, lados e contagem de unidades', function () {
      var st = arena(0, { a: 't-dummy', b: 't-dummy' }, [P(), P2()]);
      eq(st.phase, 'playing', 'phase');
      eq(st.units.length, 4, '2 heróis + 2 monstros');
      eq(st.order.length, 4, 'ordem');
      eq(st.grid.h, 8, 'altura'); eq(st.grid.w, 11, 'largura');
      var h1 = byHero(st, 't-h1');
      eq(h1.side, 'player', 'lado'); eq(h1.kind, 'hero', 'kind');
      eq(h1.x, 1, 'x do 1º P'); eq(h1.y, 1, 'y do 1º P');
      eq(byHero(st, 't-h2').y, 3, '2º herói no 2º P');
      eq(st.weather, 't-calmo', 'clima da sala');
      ok(st.tileEventsActive.length === 0, 'sem eventos de terreno');
    });

    t('createBattle: emite battleStart, roundStart e turnStart em ordem', function () {
      var st = arena(0, { a: 't-dummy', b: 't-dummy' });
      var evs = drain();
      var iB = -1, iR = -1, iT = -1;
      for (var k = 0; k < evs.length; k++) {
        if (evs[k].type === 'battleStart' && iB < 0) iB = k;
        if (evs[k].type === 'roundStart' && iR < 0) iR = k;
        if (evs[k].type === 'turnStart' && iT < 0) iT = k;
      }
      ok(iB >= 0 && iR >= 0 && iT >= 0, 'eventos presentes');
      ok(iB < iR && iR < iT, 'ordem battleStart < roundStart < turnStart');
      ok(!!st, 'estado criado');
    });

    t('iniciativa: ordem decrescente e desempate estável pela ordem de criação', function () {
      var st = arena(0, { a: 't-dummy', b: 't-dummy' });
      var a = byDef(st, 't-dummy', 0), b = byDef(st, 't-dummy', 1);
      ok(st.order.indexOf(a.uid) < st.order.indexOf(b.uid), 'a antes de b');
      eq(E.activeUnit(st).heroId, 't-h1', 'herói (iniciativa 100) age primeiro');
      for (var o = 1; o < st.order.length; o++) {
        var x = E.findUnit(st, st.order[o - 1]), y = E.findUnit(st, st.order[o]);
        ok(x.initiative >= y.initiative, 'iniciativa decrescente');
      }
    });

    t('createBattle: erros de dado inválido são explícitos', function () {
      var threw = 0;
      try { E.createBattle('nao-existe', 0, [P()]); } catch (e) { threw++; }
      try { E.createBattle('test-arena-v2', 99, [P()]); } catch (e) { threw++; }
      try { E.createBattle('test-arena-v2', 0, []); } catch (e) { threw++; }
      eq(threw, 3, '3 erros lançados');
      E.events.length = 0;
    });

    // ================================================== 2. MOVIMENTO
    section('2 — Movimento, caminho e visão');

    t('reachable: respeita PP e bloqueio por unidade', function () {
      var st = arena(2, { a: 't-dummy' });
      var h = byHero(st, 't-h1');
      var r = E.reachable(st, h.uid);
      eq(r.length, 1, 'só (2,1) alcançável');
      eq(r[0].x, 2, 'x'); eq(r[0].y, 1, 'y'); eq(r[0].cost, 1, 'custo');
      eq(r[0].risky, false, 'sem fixador adjacente na partida');
    });

    t('path: contorna parede (caminho mais longo) e respeita adjacência ortogonal', function () {
      var st = arena(1, { a: 't-dummy', b: 't-dummy' });
      var h = byHero(st, 't-h1');
      h.pp = 30;
      var p = E.path(st, h.uid, 5, 1);
      ok(p !== null, 'caminho existe');
      eq(p.length, 12, 'comprimento do desvio');
      var px = h.x, py = h.y;
      for (var k = 0; k < p.length; k++) {
        eq(Math.abs(p[k].x - px) + Math.abs(p[k].y - py), 1, 'passo ortogonal');
        px = p[k].x; py = p[k].y;
      }
      eq(px, 5, 'destino x'); eq(py, 1, 'destino y');
    });

    t('path: null para célula ocupada, buraco e rota totalmente bloqueada', function () {
      var st = arena(2, { a: 't-dummy' });
      var h = byHero(st, 't-h1');
      h.pp = 30;
      ok(E.path(st, h.uid, 3, 1) === null, 'célula ocupada');
      ok(E.path(st, h.uid, 5, 1) === null, 'rota bloqueada por unidade');
      var st2 = arena(1, { a: 't-dummy', b: 't-dummy' });
      var h2 = byHero(st2, 't-h1');
      h2.pp = 30;
      ok(E.path(st2, h2.uid, 2, 4) === null, 'buraco não é destino');
      var reach = E.reachable(st2, h2.uid);
      for (var k = 0; k < reach.length; k++) {
        eq(st2.grid.tiles[reach[k].y][reach[k].x].type, 'floor', 'alcançável só em chão');
      }
    });

    t('move: gasta PP, emite evento com caminho; movimento inválido devolve false', function () {
      var st = arena(0, { a: 't-dummy', b: 't-dummy' });
      var h = byHero(st, 't-h1');
      drain();
      ok(E.move(st, h.uid, 1, 3) === true, 'move válido');
      eq(h.pp, 1, 'PP gasto (3-2)');
      var ev = findEv(drain(), 'move');
      ok(!!ev, 'evento move');
      eq(ev.path.length, 2, 'caminho de 2 células');
      ok(E.move(st, h.uid, 1, 6) === false, 'sem PP suficiente');
      eq(h.pp, 1, 'PP inalterado após falha');
    });

    t('LoS: parede alta bloqueia; buraco NÃO bloqueia', function () {
      var st = arena(1, { a: 't-dummy', b: 't-dummy' });
      ok(E.los(st, 1, 1, 9, 1) === false, 'parede em (4,1) bloqueia');
      ok(E.los(st, 1, 4, 4, 4) === true, 'buracos (2,4)(3,4) não bloqueiam');
    });

    t('v2 terreno: "=" é obstáculo BAIXO — bloqueia passagem, não bloqueia visão', function () {
      var st = arena(4, { a: 't-dummy' });
      eq(st.grid.tiles[1][3].type, 'cover', 'tile cover');
      ok(E.los(st, 1, 1, 6, 1) === true, 'cobertura não bloqueia visão');
      var h = byHero(st, 't-h1');
      h.pp = 10;
      ok(E.path(st, h.uid, 3, 1) === null, 'não se anda sobre cobertura');
      var p = E.path(st, h.uid, 4, 1);
      ok(p !== null, 'existe desvio');
      eq(p.length, 5, 'contorna a cobertura em 5 passos');
      var tg = E.castTargets(st, h.uid, 't-nuke10');
      var onCover = false;
      for (var k = 0; k < tg.length; k++) if (tg[k].x === 3 && tg[k].y === 1) onCover = true;
      ok(!onCover, 'cobertura não é célula-alvo válida');
    });

    t('range line: só células no mesmo eixo x ou y', function () {
      var st = arena(0, { a: 't-dummy', b: 't-dummy' });
      var h = byHero(st, 't-h1');
      var tg = E.castTargets(st, h.uid, 't-line');
      for (var k = 0; k < tg.length; k++) {
        ok(tg[k].x === h.x || tg[k].y === h.y, 'alvo alinhado');
      }
      ok(tg.length > 0, 'há alvos');
    });

    section('3 — Custos, recarga, limites e alvos');

    t('castTargets: vazio sem PA; PA é gasto ao conjurar', function () {
      var st = arena(0, { a: 't-dummy', b: 't-dummy' });
      var h = byHero(st, 't-h1');
      var pa0 = h.pa;
      ok(E.cast(st, h.uid, 't-nuke10', 5, 1) === true, 'conjura');
      eq(h.pa, pa0 - 1, 'PA gasto');
      h.pa = 0;
      eq(E.castTargets(st, h.uid, 't-nuke10').length, 0, 'sem PA, sem alvos');
      ok(E.cast(st, h.uid, 't-nuke10', 5, 1) === false, 'cast bloqueado sem PA');
    });

      var h = byHero(st, 't-h1');
      ok(E.cast(st, h.uid, 't-cd1', 5, 1) === true, '1º cast');
      ok(E.cast(st, h.uid, 't-cd1', 5, 1) === false, 'bloqueado no mesmo turno');
      nextRound(st);
      ok(E.cast(st, h.uid, 't-cd1', 5, 1) === false, 'ainda bloqueado no turno seguinte');
      nextRound(st);
      ok(E.cast(st, h.uid, 't-cd1', 5, 1) === true, 'liberado no 2º turno após o cast');

      var h = byHero(st, 't-h1');
      ok(E.cast(st, h.uid, 't-twice', 5, 1), '1');
      ok(E.cast(st, h.uid, 't-twice', 5, 1), '2');
      ok(E.cast(st, h.uid, 't-twice', 5, 1) === false, '3 bloqueado');
      nextRound(st);
      ok(E.cast(st, h.uid, 't-twice', 5, 1) === true, 'renovado');
    });

    t('needsEmptyTile: exclui células ocupadas', function () {
      var st = arena(0, { a: 't-dummy', b: 't-dummy' });
      var h = byHero(st, 't-h1');
      var tg = E.castTargets(st, h.uid, 't-tp');
      for (var k = 0; k < tg.length; k++) {
        ok(!E.unitAt(st, tg[k].x, tg[k].y), 'célula livre');
      }
      ok(E.cast(st, h.uid, 't-tp', 5, 1) === false, 'não teleporta para cima de unidade');
    });

    t('v2 targetSide: enemy/ally/self validam o ocupante da célula-alvo', function () {
      var st = arena(0, { a: 't-dummy', b: 't-dummy' }, [P(), P2()]);
      var h = byHero(st, 't-h1');
      var ally = byHero(st, 't-h2');
      var foe = byDef(st, 't-dummy', 0);
      sp('t-only-enemy', { targetSide: 'enemy', effects: [{ type: 'damage', element: 'neutro', min: 1, max: 1 }] });
      sp('t-only-ally', { targetSide: 'ally', effects: [{ type: 'heal', min: 1, max: 1 }] });
      sp('t-only-self', { targetSide: 'self', range: { min: 0, max: 3, line: false, los: false }, effects: [{ type: 'heal', min: 1, max: 1 }] });
      h.spells.push('t-only-enemy', 't-only-ally', 't-only-self');
      ok(E.validTargetCell(st, h, E.spell('t-only-enemy'), foe.x, foe.y) === true, 'inimigo válido');
      ok(E.validTargetCell(st, h, E.spell('t-only-enemy'), ally.x, ally.y) === false, 'aliado inválido');
      ok(E.validTargetCell(st, h, E.spell('t-only-enemy'), 8, 6) === false, 'chão vazio inválido');
      ok(E.validTargetCell(st, h, E.spell('t-only-ally'), ally.x, ally.y) === true, 'aliado válido');
      ok(E.validTargetCell(st, h, E.spell('t-only-ally'), foe.x, foe.y) === false, 'inimigo inválido');
      ok(E.validTargetCell(st, h, E.spell('t-only-self'), h.x, h.y) === true, 'próprio válido');
      ok(E.validTargetCell(st, h, E.spell('t-only-self'), ally.x, ally.y) === false, 'outro inválido');
    });

    // ================================================== 4. EFEITOS v1
    section('4 — Os 15 efeitos herdados da v1');

    t('efeito damage: fórmula roll*(100+power)/100*(100-resist)/100 arredondada', function () {
      var st = arena(0, { a: 't-dummy', b: 't-dummy' });
      var h = byHero(st, 't-h1');
      var d = byDef(st, 't-dummy', 0);
      h.power = 50;
      d.resists.fogo = 20;
      var hp0 = d.hp;
      E.cast(st, h.uid, 't-fire20', d.x, d.y);
      eq(hp0 - d.hp, 24, '20 * 1.5 * 0.8 = 24');
    });

    // ---------------------------------------------- ADENDO v2.2: ganho elemental
    // Prepara um herói com elemento e `elemPower` cravados na mão (o caminho
    // oficial é Progress.battleParty; aqui interessa a CONTA, não a origem).
    function elemHero(element, elemPower, power) {

    t('v2.2 elemPower: createBattle deriva o ganho por nível de quem escolheu', function () {
      var L = D.leveling || {};
      var per = L.perLevel || { hp: 5, power: 3 };
      var perEl = L.perLevelElement || { hp: 5, elemPower: 3 };
      var choice = L.elementChoiceLevel || 5;
      var base = D.classes['t-alfa'].stats;

      E.events.length = 0;
      var st = E.createBattle('test-arena-v2', 0, [P({ element: 'fogo', level: 30 })]);
      var h = byHero(st, 't-h1');
      var genSteps = Math.min(30, choice) - 1;
      var elSteps = 30 - choice;
      eq(h.elemPower, (perEl.elemPower || 0) * elSteps, 'elemPower acumulado desde a escolha');
      eq(h.power, base.power + (per.power || 0) * genSteps, 'poder genérico congela na escolha');
      eq(h.hpMax, base.hp + (per.hp || 0) * genSteps + (perEl.hp || 0) * elSteps, 'PV sobe sempre');
      eq(E.elementalBonus(h, E.spell('t-fire20')), h.elemPower, 'bônus vale no fogo');
      eq(E.elementalBonus(h, E.spell('t-nuke10')), 0, 'e não vale no neutro');

      // quem nunca escolheu fica só com o poder genérico, sem elemPower
      E.events.length = 0;
      var st2 = E.createBattle('test-arena-v2', 0, [P({ element: 'neutro', level: 30 })]);
      var h2 = byHero(st2, 't-h1');
      eq(h2.elemPower, 0, 'sem elemento, sem elemPower');
      eq(h2.power, base.power + (per.power || 0) * 29, 'genérico até o fim');
    });

    section('8 — Esquiva e Fixação');

    function dodgeSetup(heroElement, lockerDefId) {
      var st = arena(0, { a: lockerDefId, b: 't-dummy' }, [P({ element: heroElement })]);
      var h = byHero(st, 't-h1');
      var m = byDef(st, lockerDefId);
      m.x = 2; m.y = 1;                  // colado no herói em (1,1)
      var other = byDef(st, 't-dummy', lockerDefId === 't-dummy' ? 1 : 0);
      if (other) { other.x = 9; other.y = 6; }
      return { st: st, h: h, m: m };
    }

    t('esquiva: fórmula elemental — rival (+0.30), não relacionado (+0.10), mesmo (0)', function () {
      var a = dodgeSetup('agua', 't-fogo');     // fogo é o rival de água
      eq(E.dodgeChance(a.st, a.h.uid, a.m.uid), 0.65, 'rival: 0.35 + 0.30');
      var b = dodgeSetup('agua', 't-terra');    // não relacionado
      eq(E.dodgeChance(b.st, b.h.uid, b.m.uid), 0.45, 'não relacionado: 0.35 + 0.10');
      var c = dodgeSetup('agua', 't-agua');     // mesmo elemento
      eq(E.dodgeChance(c.st, c.h.uid, c.m.uid), 0.35, 'mesmo: 0.35 + 0');
      var d = dodgeSetup('neutro', 't-fogo');   // neutro nunca tem rival
      eq(E.dodgeChance(d.st, d.h.uid, d.m.uid), 0.45, 'neutro x fogo: não relacionado');
      var e2 = dodgeSetup('neutro', 't-dummy'); // dummy é neutro
      eq(E.dodgeChance(e2.st, e2.h.uid, e2.m.uid), 0.35, 'neutro x neutro: mesmo');
    });

    // ================================================== 11. FUSÃO
    section('11 — Fusão');

    function fusionBattle(elA, elB, lvA, lvB) {
      E.events.length = 0;
      var st = E.createBattle('test-arena-v2', 3, [
        P({ heroId: 't-h1', classId: 't-alfa', element: elA, level: lvA }),
        P2({ heroId: 't-h2', classId: 't-beta', element: elB, level: lvB })
      ]);
      return st;
    }

    useTestBlends();

    t('Fusion.spellsFor: compõe nome, resolve @A/@B e filtra por tier <= nível', function () {
      var out = F.spellsFor('t-alfa+t-beta', 'ar+agua', 15);
      eq(out.length, 1, 'só a forma tier 0 (a tier 20 fica de fora)');
      var s = out[0];
      eq(s.name, 'Turbilhão Salgado', 'nome = forma + afixo');
      eq(s.id, 'fus:t-alfa+t-beta:ar+agua:0', 'id do contrato');
      eq(s.effects.length, 3, 'mecânica (2) + rider (1)');
      eq(s.effects[0].element, 'ar', "'@A' => elements[0]");
      eq(s.effects[1].element, 'agua', "'@B' => elements[1]");
      eq(s.effects[2].type, 'poison', 'rider da mistura');
      // escala: fator = (100 + nível*3 + tier*1)/100 = 1.45
      eq(s.effects[0].min, 15, '10 * 1.45 => 15');
      eq(s.effects[1].min, 9, '6 * 1.45 => 9');
      eq(s.effects[2].min, 4, 'rider 3 * 1.45 => 4');
      eq(s.fxKey, 'fx-salgado', 'fx da mistura');
      var out30 = F.spellsFor('t-alfa+t-beta', 'ar+agua', 30);
      eq(out30.length, 2, 'nível 30 libera a forma tier 20');
    });

    t('Fusion.spellsFor: o par de ELEMENTOS respeita a ordem dos fundidos (chaves espelhadas)', function () {
      var ab = F.spellsFor('t-alfa+t-beta', 'ar+agua', 15)[0];

      eq(ba.effects[0].element, 'agua', 'agua+ar: @A = agua');
      eq(ba.effects[1].element, 'ar', 'agua+ar: @B = ar');

    t('Fusion.spellsFor: riderMode "support" usa blend.riderSupport (não fere o aliado)', function () {
      // usa formas de apoio de teste, com uma mistura cujo rider ofensivo mata
      var savedForms = D.fusionForms['t-alfa+t-beta'];
      var savedBlend = D.fusionBlends['fogo+fogo'];
      D.fusionBlends['fogo+fogo'] = blend('Ardente', ['fogo', 'fogo'],
        [{ type: 'damage', element: 'fogo', min: 30, max: 30 }],
        [{ type: 'shield', value: 10, duration: 2 }], 'fx-ard');
      D.fusionForms['t-alfa+t-beta'] = [
        { tier: 0, formName: 'Bálsamo', paCost: 3, cooldown: 0,
          range: { min: 0, max: 4 }, aoe: { shape: 'single', size: 0 },
          targetSide: 'ally', riderMode: 'support',
          mechanic: [{ type: 'heal', min: 10, max: 10 }],
          description: 'apoio', fxShape: 'heal' },
        { tier: 0, formName: 'Golpe', paCost: 3, cooldown: 0,
          range: { min: 1, max: 4 }, aoe: { shape: 'single', size: 0 },
          targetSide: 'enemy', riderMode: 'offense',
          mechanic: [{ type: 'damage', element: '@A', min: 10, max: 10 }],
          description: 'ataque', fxShape: 'slam' }
      ];
      try {
        var out = F.spellsFor('t-alfa+t-beta', 'fogo+fogo', 10);
        eq(out.length, 2, 'duas formas');
        var sup = out[0], off = out[1];
        eq(sup.name, 'Bálsamo Ardente', 'nome da forma de apoio');
        eq(sup.effects.length, 2, 'mecânica + riderSupport');
        eq(sup.effects[1].type, 'shield', 'usou riderSupport');
        for (var k = 0; k < sup.effects.length; k++) {
          ok(sup.effects[k].type !== 'damage', 'forma de apoio não carrega dano');
        }
        eq(off.effects[1].type, 'damage', 'forma ofensiva usou o rider normal');
      } finally {
        D.fusionForms['t-alfa+t-beta'] = savedForms;
        if (savedBlend === undefined) delete D.fusionBlends['fogo+fogo'];
        else D.fusionBlends['fogo+fogo'] = savedBlend;
      }
    });

    t('Fusion.spellsFor: dados REAIS — riderMode support nunca injeta dano do rider', function () {
      if (!D.fusionForms || !D.fusionBlends || !D.fusionBlends['agua+agua']) {
        notes.push('fusions.js real ausente: teste de riderMode real pulado.');
        return;
      }
      restoreBlends();                    // volta às misturas reais
      var pairs = [], k;
      for (k in D.fusionForms) {
        if (k.indexOf('t-alfa') === 0) continue;
        pairs.push(k);
      }
      ok(pairs.length >= 15, '15 duplas de classe reais (obtido ' + pairs.length + ')');
      var checkedSupport = 0, checkedOffense = 0;
      for (var p = 0; p < pairs.length; p++) {
        var forms = D.fusionForms[pairs[p]];
        var spells = F.spellsFor(pairs[p], 'agua+agua', 30);
        eq(spells.length, forms.length, pairs[p] + ': todas as formas no nível 30');
        for (var f = 0; f < forms.length; f++) {
          var mechDmg = 0, m;
          for (m = 0; m < (forms[f].mechanic || []).length; m++) {
            if (forms[f].mechanic[m].type === 'damage') mechDmg++;
          }
          var genDmg = 0;
          for (m = 0; m < spells[f].effects.length; m++) {
            if (spells[f].effects[m].type === 'damage') genDmg++;
          }
          if (forms[f].riderMode === 'support') {
            // rider de 'agua+agua' tem 1 damage; riderSupport não tem nenhum
            eq(genDmg, mechDmg, pairs[p] + '/' + forms[f].formName + ': sem dano do rider');
            checkedSupport++;
          } else {
            eq(genDmg, mechDmg + 1, pairs[p] + '/' + forms[f].formName + ': dano do rider presente');
            checkedOffense++;
          }
        }
      }
      ok(checkedSupport > 0, 'houve formas de apoio (' + checkedSupport + ')');
      ok(checkedOffense > 0, 'houve formas ofensivas (' + checkedOffense + ')');
      useTestBlends();                    // volta às misturas de teste
    });

    t('Fusion.spellsFor: dados REAIS — chaves de mistura existem nas duas ordens', function () {
      if (!D.fusionBlends || !D.fusionBlends['agua+agua']) return;
      restoreBlends();
      var els = ['neutro', 'fogo', 'agua', 'terra', 'ar'];
      var missing = [];
      for (var i2 = 0; i2 < els.length; i2++) {
        for (var j2 = 0; j2 < els.length; j2++) {
          var key = els[i2] + '+' + els[j2];
          var b = D.fusionBlends[key];
          if (!b) { missing.push(key); continue; }
          eq(b.elements[0], els[i2], key + ': elements[0]');
          eq(b.elements[1], els[j2], key + ': elements[1]');
          ok(!!b.riderSupport, key + ': tem riderSupport');
        }
      }
      eq(missing.length, 0, 'sem chaves faltando: ' + missing.join(','));
      // e o par nas duas ordens realmente inverte @A/@B
      var pk = null;
      for (var k2 in D.fusionForms) { if (k2.indexOf('t-alfa') !== 0) { pk = k2; break; } }
      var ab = F.spellsFor(pk, 'fogo+agua', 30);
      var ba = F.spellsFor(pk, 'agua+fogo', 30);
      var found = false;
      for (var s2 = 0; s2 < ab.length; s2++) {
        if (ab[s2].elements[0] === 'fogo' && ba[s2].elements[0] === 'agua') found = true;
      }
      ok(found, 'a ordem dos elementos inverte @A/@B nos dados reais');
      useTestBlends();
    });

    t('Fusão: mantendo-se colados, funde com TODOS os números corretos', function () {
      var st = fusionBattle('ar', 'agua', 10, 20);
      var a = byHero(st, 't-h1'), b = byHero(st, 't-h2');
      a.hp = 150; b.hp = 60;
      a.resists.fogo = 20; b.resists.fogo = 0;
      var ax = a.x, ay = a.y;
      var paMaxA = a.paMax, paMaxB = b.paMax;
      var ppMaxA = a.ppMax, ppMaxB = b.ppMax;
      var iniA = a.initiative, iniB = b.initiative;
      var hpMaxSum = a.hpMax + b.hpMax;      // as classes escalam por nível
      var orderIdx = st.order.indexOf(a.uid);
      F.declare(st, a.uid, b.uid);
      drain();
      E.endTurn(st);
      var evs = drain();
      var ev = findEv(evs, 'fusion');
      ok(!!ev, 'evento fusion');
      eq(ev.uid, a.uid, 'uid da fusão = uid de A');
      eq(ev.from.length, 2, 'from com os dois');
      eq(ev.classPair, 't-alfa+t-beta', 'classPair alfabético');
      eq(ev.elemPair, 'ar+agua', 'elemPair na ordem dos fundidos (A=ar, B=agua)');
      eq(ev.level, 15, 'nível = média (10+20)/2');
      eq(a.kind, 'fusion', 'kind fusion');
      eq(a.defId, 'fus:t-alfa+t-beta', 'defId do contrato');
      eq(a.hp, 210, 'PV = soma dos PV restantes');
      eq(a.hpMax, hpMaxSum, 'hpMax = soma');
      eq(a.paMax, Math.max(paMaxA, paMaxB) + 2, '+2 PA');
      eq(a.ppMax, Math.max(ppMaxA, ppMaxB) + 1, '+1 PP');
      eq(a.shield, 50, '+50 de escudo');
      eq(a.initiative, Math.max(iniA, iniB), 'iniciativa = maior');
      eq(a.resists.fogo, 10, 'resistências = média');
      eq(a.level, 15, 'nível médio');
      eq(a.x, ax, 'ocupa a célula de A (x)');
      eq(a.y, ay, 'ocupa a célula de A (y)');
      ok(!b.alive && b.offBoard, 'B saiu do tabuleiro');
      ok(!findEv(evs, 'death', function (e) { return e.uid === b.uid; }), 'B não conta como morte');
      eq(st.phase, 'playing', 'a batalha continua');
      eq(st.order.indexOf(a.uid), orderIdx, 'mantém a casa na ordem');

    t('ADENDO v2.2: elemPower da fusão = MÉDIA e vale para os DOIS elementos', function () {
      var st = fusionBattle('ar', 'agua', 10, 20);
      var a = byHero(st, 't-h1'), b = byHero(st, 't-h2');
      a.elemPower = 40; b.elemPower = 20;
      a.power = 0;
      F.declare(st, a.uid, b.uid);
      E.endTurn(st);
      eq(a.kind, 'fusion', 'fundiu');
      eq(a.elemPower, 30, 'média de 40 e 20');
      // vale para os DOIS elementos da mistura, e só para eles
      eq(E.elementalBonus(a, { element: 'ar' }), 30, "'@A' (ar) recebe o bônus");
      eq(E.elementalBonus(a, { element: 'agua' }), 30, "'@B' (agua) recebe o bônus");
      eq(E.elementalBonus(a, { element: 'fogo' }), 0, 'elemento de fora não recebe');
      eq(E.elementalBonus(a, { element: 'neutro' }), 0, 'neutro não recebe');
      // e a conta real: o feitiço composto é de elemento 'ar' (elements[0])
      var s = E.spell(a.spells[0]);
      eq(s.element, 'ar', 'o feitiço de fusão é do primeiro elemento da mistura');
      eq(E.elementalBonus(a, s), 30, 'o feitiço composto leva o bônus');
      toHero(st, 't-h1');
      var foe = byDef(st, 't-dummy');
      foe.x = a.x + 1; foe.y = a.y;
      foe.resists = zeroRes();
      // Os danos do composto têm min≠max, então a conta não pode ser prevista a
      // partir de `min`. Conjura DUAS vezes com a MESMA semente: os sorteios se
      // repetem e a única diferença entre as duas é o bônus elemental. Com power
      // 0 e resistência 0, o dano sem bônus é o próprio sorteio.
      function castOnce(bonus) {
        a.elemPower = bonus;
        a.power = 0;              // a fusão herda o MAIOR poder dos dois: zera para a conta ficar limpa
        a.pa = 30; a.cooldowns = {}; a.castsThisTurn = {};
        foe.hp = foe.hpMax;
        st._rng = 12345;
        drain();
        E.cast(st, a.uid, s.id, foe.x, foe.y);
        var hits = [], evs = drain();
        for (var q = 0; q < evs.length; q++) {
          if (evs[q].type === 'damage' && evs[q].uid === foe.uid) hits.push(evs[q].amount);
        }
        return hits;
      }
      var plain = castOnce(0);
      var boosted = castOnce(30);
      ok(plain.length >= 2, 'o composto bate com os dois elementos (' + plain.length + ' golpes)');
      eq(boosted.length, plain.length, 'mesma semente => mesmo número de golpes');
      for (var q2 = 0; q2 < plain.length; q2++) {
        eq(boosted[q2], Math.round(plain[q2] * 1.30),
           'golpe ' + q2 + ' (' + plain[q2] + '): o bônus médio de 30 entra na conta');
      }
    });

    // ADENDO v2.1: o grupo é de 1 ou 2 heróis. Com 2, a fusão pode transformar
    // o TIME INTEIRO numa única unidade — que não pode ser lida como derrota.
    t('ADENDO v2.1: time de DOIS vira UMA unidade e a batalha continua', function () {
      var st = fusionBattle('ar', 'agua', 10, 20);
      var a = byHero(st, 't-h1'), b = byHero(st, 't-h2');
      var players = 0, i2, u2;
      for (i2 = 0; i2 < st.units.length; i2++) {
        if (st.units[i2].side === 'player') players++;
      }
      eq(players, 2, 'o time do jogador é exatamente a dupla');
      F.declare(st, a.uid, b.uid);
      drain();
      E.endTurn(st);
      var evs = drain();
      eq(a.kind, 'fusion', 'a dupla virou uma unidade só');
      ok(!b.alive && b.offBoard, 'B saiu do tabuleiro');
      ok(!findEv(evs, 'battleEnd'), 'nenhum fim de batalha foi declarado');

    section('14-B — Fúria progressiva da sala (fim dos empates por sustentação)');

    // Roda `fn` com uma configuração de fúria própria e devolve o padrão depois.
    function withFury(cfg, fn) {
      var saved = E.ROOM_FURY;
      var savedData = (D.leveling || {}).roomFury;
      if (D.leveling) delete D.leveling.roomFury;   // o padrão da engine manda no teste
      E.ROOM_FURY = cfg;

    }

    t('fúria: o corte vale para heal, regen e roubo de vida (tudo passa por applyHeal)', function () {

    t('fúria: emite o evento fury a cada rodada acima do limiar', function () {

    t('fúria: maxRounds encerra a batalha como DERROTA, com evento próprio', function () {

    t('fúria: numa luta normal (curta) nada disso aparece', function () {

    t('fúria: DATA.leveling.roomFury tem prioridade sobre o padrão da engine', function () {

    // ================================================== 15. AUTO-PLAY
    section('15 — Auto-play IA × IA nas salas reais');

    var TEST_IDS = { 'test-arena-v2': 1, 'test-cycle-v2': 1, 'test-events-v2': 1 };
    var realDungeons = [];
    for (i = 0; i < D.dungeons.length; i++) {
      if (!TEST_IDS[D.dungeons[i].id]) realDungeons.push(D.dungeons[i]);
    }
    // ADENDO v2.1: o grupo do jogador é de 1 ou 2 heróis (não mais 3). O
    // auto-play roda DUPLAS (o caso normal, e o único em que a fusão pode
    // engolir o time inteiro) e também SOLO. As classes e os elementos giram
    // por calabouço para que as 6 classes e os 4 caminhos elementais reais
    // entrem em campo ao longo das 18 salas.
    var AUTO_ELEMENTS = ['fogo', 'agua', 'terra', 'ar'];
    var realParty = buildRealParty(1, null, null, 2, 0);
    // grupo veterano: nível 30, caminho elemental completo e pet — exercita os
    // feitiços elementais reais (marcas, armadilhas, cadeias, clima, esquiva).
    var vetParty = buildRealParty(30, AUTO_ELEMENTS, true, 2, 0);

    function realClassIds() {
      var ids = [];
      if (!D.classes) return ids;
      for (var k in D.classes) {
        if (!Object.prototype.hasOwnProperty.call(D.classes, k)) continue;
        if (k === 't-alfa' || k === 't-beta') continue;
        ids.push(k);
      }
      ids.sort();
      return ids;
    }
    // `size` = 1 ou 2 heróis (adendo v2.1); `offset` gira quais classes e
    // elementos o grupo recebe, para cobrir todo o elenco ao longo das salas.
    function buildRealParty(level, elements, withPet, size, offset) {
      var ids = realClassIds();
      if (ids.length < 1) return null;
      var petIds = [];
      for (var pk in (D.pets || {})) {
        if (pk.indexOf('t-pet') === 0) continue;
        petIds.push(pk);
      }
      petIds.sort();
      var tiers = (D.unlockTiers && D.unlockTiers.length)
        ? D.unlockTiers : [5, 10, 12, 15, 20, 30];
      var off = offset || 0;
      var count = Math.min(size || 2, ids.length);
      var party = [];
      for (var n = 0; n < count; n++) {
        var cls = D.classes[ids[(off + n) % ids.length]];
        var el = elements ? elements[(off + n) % elements.length] : 'neutro';
        var spells = (cls.baseSpells || []).slice();
        var path = (cls.paths && cls.paths[el]) || [];
        for (var s = 0; s < path.length; s++) {
          if ((tiers[s] || 99) <= level) spells.push(path[s]);
        }
        party.push({ heroId: 'real-h' + n, classId: cls.id, element: el,
                     level: level, spells: spells,
                     pet: (withPet && petIds.length) ? petIds[(off + n) % petIds.length] : null,
                     items: {} });
      }
      return party;
    }

    if (!realDungeons.length || !realParty) {
      notes.push('AUTO-PLAY CONDICIONAL: js/core/data/*.js ainda não existem (0 calabouços ' +
        'reais, ' + (realParty ? realParty.length : 0) + ' classes reais). ' +
        'O motor foi validado contra as fixtures do contrato; o auto-play IA×IA nas ' +
        '18 salas dos 6 calabouços roda automaticamente assim que os Criativos entregarem os dados.');
      t('AUTO-PLAY: pendente — dados reais ainda não publicados (condicional)', function () {
        ok(true, 'condicional');
      });
      // substituto com fixtures: garante que o laço IA×IA fecha
      t('AUTO-PLAY (fixture): arena de teste termina sozinha', function () {
        autoPlay('test-arena-v2', 0, [P(), P2()]);
      });
      t('AUTO-PLAY (fixture): labirinto de teste termina sozinho', function () {
        autoPlay('test-arena-v2', 1, [P()]);
      });
      t('AUTO-PLAY (fixture): campo aberto com pet termina sozinho', function () {
        autoPlay('test-arena-v2', 5, [P({ pet: 't-pet-dog' })]);
      });
    } else {
      var totalRooms = 0;
      for (i = 0; i < realDungeons.length; i++) totalRooms += realDungeons[i].rooms.length;
      notes.push('AUTO-PLAY: ' + realDungeons.length + ' calabouços reais, ' +
        totalRooms + ' salas × 3 grupos do adendo v2.1 (dupla nível 1 neutra, ' +
        'dupla nível 30 elemental com pets e herói SOLO nível 15), com classes e ' +
        'elementos girando por calabouço. Toda batalha precisa fechar sozinha.');

      t('integração: todo feitiço referenciado por classe/monstro/pet resolve em Engine.spell', function () {
        var missing = [], k, s, ids = realClassIds();
        for (var c = 0; c < ids.length; c++) {
          var cls = D.classes[ids[c]];
          var list = (cls.baseSpells || []).slice();
          for (k in (cls.paths || {})) list = list.concat(cls.paths[k]);
          for (s = 0; s < list.length; s++) {
            if (!E.spell(list[s])) missing.push(ids[c] + ' -> ' + list[s]);
          }
        }
        for (k in (D.monsters || {})) {
          if (k.indexOf('t-') === 0) continue;
          var m = D.monsters[k];
          for (s = 0; s < (m.spells || []).length; s++) {
            if (!E.spell(m.spells[s])) missing.push(k + ' -> ' + m.spells[s]);
          }
        }
        for (k in (D.pets || {})) {
          if (k.indexOf('t-pet') === 0) continue;
          var p2 = D.pets[k];
          for (s = 0; s < (p2.spells || []).length; s++) {
            if (!E.spell(p2.spells[s])) missing.push(k + ' -> ' + p2.spells[s]);
          }
        }
        eq(missing.length, 0, 'referências quebradas: ' + missing.slice(0, 8).join(' | '));
      });

      t('integração: todo monstro de todas as salas reais resolve em Engine.monster', function () {
        var missing = [];
        for (var dd2 = 0; dd2 < realDungeons.length; dd2++) {
          var rooms = realDungeons[dd2].rooms;
          for (var rr2 = 0; rr2 < rooms.length; rr2++) {
            var mm = rooms[rr2].monsters || {};
            for (var letter in mm) {
              if (!E.monster(mm[letter])) {
                missing.push(realDungeons[dd2].id + '[' + rr2 + '] ' + letter + '=' + mm[letter]);
              }
            }
          }
        }
        eq(missing.length, 0, 'monstros ausentes: ' + missing.slice(0, 8).join(' | '));
      });

      t('integração: o ciclo automático de clima só usa os climas canônicos', function () {
        var shifting = null;
        for (var dd3 = 0; dd3 < realDungeons.length; dd3++) {
          if (realDungeons[dd3].weatherShiftEveryRounds > 0) shifting = realDungeons[dd3];
        }
        if (!shifting) { notes.push('nenhum calabouço com clima cíclico.'); return; }
        E.events.length = 0;
        var st = E.createBattle(shifting.id, 0, realParty);
        var canon = { calmo: 1, chuva: 1, estiagem: 1, vendaval: 1, tremor: 1 };
        var seen = {};
        for (var g = 0; g < 400 && st.round < 14 && st.phase === 'playing'; g++) {
          E.endTurn(st);
          seen[st.weather] = true;
        }
        var bad = [];
        for (var w in seen) if (!canon[w]) bad.push(w);
        eq(bad.length, 0, 'clima fora do canônico no rodízio: ' + bad.join(','));
        E.events.length = 0;
      });

      for (var dd = 0; dd < realDungeons.length; dd++) {
        for (var rr = 0; rr < realDungeons[dd].rooms.length; rr++) {
          (function (dungeonId, roomIdx, off) {
            t('AUTO-PLAY IA×IA (dupla nível 1): ' + dungeonId + ' sala ' + roomIdx, function () {
              autoPlay(dungeonId, roomIdx, buildRealParty(1, null, null, 2, off));
            });
            t('AUTO-PLAY IA×IA (dupla nível 30 + pets): ' + dungeonId + ' sala ' + roomIdx, function () {
              autoPlay(dungeonId, roomIdx, buildRealParty(30, AUTO_ELEMENTS, true, 2, off));
            });
            t('AUTO-PLAY IA×IA (herói SOLO nível 15): ' + dungeonId + ' sala ' + roomIdx, function () {
              autoPlay(dungeonId, roomIdx, buildRealParty(15, AUTO_ELEMENTS, false, 1, off + 3));
            });
          })(realDungeons[dd].id, rr, dd * 2);
        }
      }

      // ---------------------------------------------------------------------
      // VARREDURA ANTI-EMPATE (v2.3). Antes da fúria da sala, duplas com
      // curandeira nos calabouços rasos sustentavam mais do que os monstros
      // machucavam e a batalha nunca fechava — inclusive `sumo + curandeira`,
      // que é a dupla com que o jogador COMEÇA o jogo. Estas varreduras rodam
      // no nível 1 e só com os feitiços base (a configuração mais dura) e
      // exigem que TODA batalha resolva.
      function pairParty(classA, classB) {
        var out = [], ids = [classA, classB];
        for (var n = 0; n < ids.length; n++) {
          var cls = D.classes[ids[n]];
          if (!cls) return null;
          out.push({ heroId: 'sw-h' + n, classId: ids[n], element: 'neutro', level: 1,
                     spells: (cls.baseSpells || []).slice(), pet: null, items: {} });
        }
        return out;
      }
      function sweepPair(classA, classB) {
        if (!pairParty(classA, classB)) { notes.push('varredura pulada: classe ausente'); return; }
        var stuck = [];
        for (var d2 = 0; d2 < realDungeons.length; d2++) {
          for (var r2 = 0; r2 < realDungeons[d2].rooms.length; r2++) {
            E.events.length = 0;
            var party = pairParty(classA, classB);
            var st = E.createBattle(realDungeons[d2].id, r2, party);
            var cap = turnCapFor(st);
            var turns = 0;
            while (st.phase === 'playing' && turns < cap) {
              var u = E.activeUnit(st);
              if (!u) break;
              var plan = JOGO.AI.planTurn(st, u.uid);
              for (var a2 = 0; a2 < plan.length && st.phase === 'playing'; a2++) {
                if (plan[a2].action === 'move') E.move(st, u.uid, plan[a2].x, plan[a2].y);
                else if (plan[a2].action === 'cast') E.cast(st, u.uid, plan[a2].spellId, plan[a2].x, plan[a2].y);
                else break;
              }
              if (st.phase === 'playing') E.endTurn(st);
              turns++;
              E.events.length = 0;
            }
            if (st.phase === 'playing') {
              stuck.push(realDungeons[d2].id + '[' + r2 + '] rodada ' + st.round);
            }
          }
        }
        eq(stuck.length, 0, classA + '+' + classB + ' empatou em: ' + stuck.join(', '));
      }

      t('VARREDURA anti-empate: sumo + curandeira (a dupla INICIAL) nas 18 salas', function () {
        sweepPair('sumo', 'curandeira');
      });
      t('VARREDURA anti-empate: curandeira + curandeira nas 18 salas', function () {
        sweepPair('curandeira', 'curandeira');
      });
      t('VARREDURA anti-empate: curandeira + arqueiro nas 18 salas', function () {
        sweepPair('curandeira', 'arqueiro');
      });
      t('VARREDURA anti-empate: bruxo + curandeira nas 18 salas', function () {
        sweepPair('bruxo', 'curandeira');
      });
      t('VARREDURA anti-empate: espadachim + curandeira nas 18 salas', function () {
        sweepPair('espadachim', 'curandeira');
      });
      t('VARREDURA anti-empate: sumo + sumo nas 18 salas', function () {
        sweepPair('sumo', 'sumo');
      });

      // ADENDO v2.1: a dupla que se funde vira UMA unidade — e isso não pode
      // ser lido como derrota. Com dados reais, roda a batalha inteira em que
      // o time do jogador é uma fusão desde o primeiro turno.
      t('ADENDO v2.1: dupla REAL que se funde continua jogando (não é derrota)', function () {
        var duo = buildRealParty(20, ['fogo', 'agua'], false, 2, 0);
        eq(duo.length, 2, 'grupo de dois heróis');
        E.events.length = 0;
        var st = E.createBattle(realDungeons[0].id, 0, duo);
        var a = byHero(st, 'real-h0'), b = byHero(st, 'real-h1');
        ok(!!a && !!b, 'os dois heróis entraram');
        // cola B em A (os spawns 'P' da sala podem não ser vizinhos)
        var spot = null, DD = [[0, -1], [0, 1], [-1, 0], [1, 0]];
        for (var k = 0; k < DD.length && !spot; k++) {
          var nx = a.x + DD[k][0], ny = a.y + DD[k][1];
          if (nx >= 0 && ny >= 0 && nx < st.grid.w && ny < st.grid.h &&
              st.grid.tiles[ny][nx].type === 'floor' && !E.unitAt(st, nx, ny)) {
            spot = { x: nx, y: ny };
          }
        }
        ok(!!spot, 'há célula livre colada em A');
        b.x = spot.x; b.y = spot.y;
        toHero(st, 'real-h0');
        a.pa = Math.max(a.pa, 2);
        ok(F.declare(st, a.uid, b.uid) === true, 'declarou a fusão');
        E.endTurn(st);
        eq(a.kind, 'fusion', 'a dupla virou uma unidade só');
        ok(!b.alive && b.offBoard, 'B saiu do tabuleiro');
        eq(st.phase, 'playing', 'time inteiro fundido NÃO é derrota');
        // conta as unidades do jogador que sustentam o lado
        var core = 0;
        for (var i2 = 0; i2 < st.units.length; i2++) {
          var u2 = st.units[i2];
          if (u2.alive && !u2.offBoard && u2.side === 'player' &&
              u2.kind !== 'pet' && u2.kind !== 'summon') core++;
        }
        eq(core, 1, 'o time do jogador é uma única unidade');
        ok(a.spells.length > 0, 'a fusão real tem feitiços');
        for (var s2 = 0; s2 < a.spells.length; s2++) {
          ok(!!E.spell(a.spells[s2]), 'feitiço da fusão resolve: ' + a.spells[s2]);
        }
        // a batalha segue normalmente até o fim, com a IA no comando da fusão
        var turns = 0;
        while (st.phase === 'playing' && turns < 300) {
          var u = E.activeUnit(st);
          ok(!!u && u.alive, 'sempre há unidade ativa viva');
          var plan = JOGO.AI.planTurn(st, u.uid);
          for (var p = 0; p < plan.length && st.phase === 'playing'; p++) {
            if (plan[p].action === 'move') E.move(st, u.uid, plan[p].x, plan[p].y);
            else if (plan[p].action === 'cast') E.cast(st, u.uid, plan[p].spellId, plan[p].x, plan[p].y);
            else break;
          }
          if (st.phase === 'playing') E.endTurn(st);
          turns++;
          E.events.length = 0;
        }
        ok(st.phase !== 'playing' || turns === 300, 'a batalha da fusão fecha');
        ok(st.phase !== 'lost' || !a.alive,
           'só perde se a fusão morrer de fato (phase=' + st.phase + ')');
      });
    }

    // Com a FÚRIA DA SALA (v2.3) não existe mais empate aceitável: toda batalha
    // tem de fechar, em qualquer configuração. Bater o teto é FALHA, sem exceção.
    //
    // O teto é medido em TURNOS, mas a garantia do motor é em RODADAS (a fúria
    // encerra em `maxRounds`). Numa sala de chefe com invocações a ordem chega a
    // ~23 unidades, e aí uma rodada custa mais de 20 turnos: um teto fixo de 300
    // turnos cortaria a batalha na rodada 24, ANTES da garantia agir, e acusaria
    // de empate algo que o motor fecharia. Por isso o teto é derivado do tamanho
    // real da ordem — assim o teste mede a garantia, não o próprio arbítrio.
    function turnCapFor(st) {
      var cfg = E.furyConfig ? E.furyConfig() : { maxRounds: 40 };
      return ((cfg.maxRounds || 40) + 3) * (st.order.length + 4) + 100;
    }
    function autoPlay(dungeonId, roomIdx, party) {
      E.events.length = 0;
      var st = E.createBattle(dungeonId, roomIdx, party);
      var cap = turnCapFor(st);
      var turns = 0;
      while (st.phase === 'playing' && turns < cap) {
        var u = E.activeUnit(st);
        ok(!!u, 'sempre há unidade ativa');
        var plan = JOGO.AI.planTurn(st, u.uid);
        eq(plan[plan.length - 1].action, 'end', 'plano termina com end');
        var paSum = 0;
        for (var p = 0; p < plan.length; p++) {
          if (plan[p].action === 'cast') {
            var sd = E.spell(plan[p].spellId);
            ok(!!sd, 'feitiço do plano existe: ' + plan[p].spellId);
            paSum += (sd.paCost || 0);
          }
        }
        ok(paSum <= u.pa, 'plano dentro do PA (' + u.defId + ')');
        for (var a = 0; a < plan.length && st.phase === 'playing'; a++) {
          var act = plan[a];
          if (act.action === 'move') E.move(st, u.uid, act.x, act.y);
          else if (act.action === 'cast') E.cast(st, u.uid, act.spellId, act.x, act.y);
          else break;
        }
        if (st.phase === 'playing') E.endTurn(st);
        turns++;
        E.events.length = 0;
      }
      console.log('AUTO-PLAY ' + dungeonId + '[' + roomIdx + ']: ' +
        (st.phase === 'playing' ? 'EMPATE no teto de ' + cap + ' turnos'
                                : st.phase + ' em ' + turns + ' turnos / rodada ' + st.round));
      // O teto é rede de segurança, não resultado aceitável: uma batalha que não
      // fecha em 300 turnos é empate por sustentação, impasse da IA ou laço do
      // motor — e a fúria da sala existe justamente para que isso não aconteça.
      ok(st.phase !== 'playing',
         'a batalha fecha sozinha (bateu o teto de ' + cap + ' turnos, rodada ' +
         st.round + ', em ' + dungeonId + '[' + roomIdx + '])');
    }
  }

  // ------------------------------------------------------------ executa
  try {
    run();
  } catch (e) {
    failed++;
    failures.push('ERRO FATAL DA SUÍTE: ' + e.message);
    report('ERRO FATAL DA SUÍTE', false, e.message + ' ' + (e.stack || ''));
  }
  finish();

  function finish() {
    var notesEl = document.getElementById('notes');
    if (notes.length) notesEl.textContent = notes.join(' | ');
    else notesEl.style.display = 'none';
    var summary = document.getElementById('summary');
    summary.textContent = passed + ' PASS / ' + failed + ' FAIL (' + (passed + failed) + ' testes)';
    summary.className = failed === 0 ? 'allpass' : 'somefail';
    window.TEST_RESULTS = { passed: passed, failed: failed, failures: failures, notes: notes };
    console.log('TEST_RESULTS', JSON.stringify(window.TEST_RESULTS));
  }
})();
</script>
