<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SOTERRA 2.0 — Telas da Interface (JOGO.UI)</title>
<link rel="stylesheet" href="../css/style.css?v=33">
<style>
  /* moldura do teste: um "celular" 390×844 ao lado do painel de verificação */
  html, body { overflow: auto; height: auto; }
  body { background: #06080b; display: block; }
  #lab { display: flex; gap: 18px; padding: 14px; align-items: flex-start; flex-wrap: wrap; }
  #phone {
    position: relative; width: 390px; height: 844px; flex: 0 0 auto;
    border: 10px solid #1b2028; border-radius: 34px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.7);
    background: #0b0d10;
  }
  #phone #app { position: absolute; inset: 0; }
  #side { flex: 1 1 320px; min-width: 300px; color: #e8e0d0;
          font: 13px/1.5 'Segoe UI', system-ui, sans-serif; }
  #side h1 { font: 600 17px Georgia, serif; color: #ffd08a; margin: 0 0 8px; }
  #verdict { display: inline-block; font-weight: 700; padding: 4px 12px; border-radius: 6px; }
  #verdict.pass { background: rgba(95,208,138,.16); color: #5fd08a; border: 1px solid #5fd08a; }
  #verdict.fail { background: rgba(255,107,90,.16); color: #ff6b5a; border: 1px solid #ff6b5a; }
  #nav { display: flex; gap: 5px; flex-wrap: wrap; margin: 10px 0; }
  #nav button { font: 12px system-ui; padding: 7px 10px; border-radius: 7px; cursor: pointer;
                background: #1e2530; color: #e8e0d0; border: 1px solid #3a4553; }
  #nav button:hover { background: #273040; }
  #out { background: #101519; border: 1px solid #262d38; border-radius: 8px; padding: 10px;
         font: 11.5px/1.5 monospace; max-height: 70vh; overflow: auto; }
  .ok { color: #5fd08a; } .bad { color: #ff6b5a; } .dim { color: #8b93a0; }
</style>
</head>
<body>
<div id="lab">
  <div id="phone">
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="ui-root"></div>
    </div>
  </div>
  <div id="side">
    <h1>Telas da Interface — <span style="color:#9fb0c0">JOGO.UI</span></h1>
    <span id="verdict">…</span> <span id="meta" class="dim"></span>
    <div id="nav"></div>
    <div id="out"></div>
  </div>
</div>

<!-- BLINDAGEM DO SAVE: antes de tudo, porque esta página semeia um progresso de
     mentira e não pode encostar no jogo do usuário. Uma linha; qualquer página
     de teste que use JOGO.Progress deveria incluí-la. -->
<script src="save_sandbox.js?v=33"></script>
<script src="../vendor/pixi.min.js?v=33" onerror="window.__noPixi=1"></script>
<script src="../js/core/data/elements.js?v=33"></script>
<script src="../js/core/data/classes.js?v=33"></script>
<script src="../js/core/data/spells.js?v=33"></script>
<script src="../js/core/data/progression.js?v=33"></script>
<script src="../js/core/data/monsters.js?v=33"></script>
<script src="../js/core/data/dungeons.js?v=33"></script>
<script src="../js/core/data/fusions.js?v=33"></script>
<script src="../js/core/data/pets.js?v=33"></script>
<script src="../js/core/data/items.js?v=33"></script>
<script src="../js/core/data/items_extra.js?v=33"></script>
<script src="../js/core/engine.js?v=33"></script>
<script src="../js/core/fusion.js?v=33"></script>
<script src="../js/core/ai.js?v=33"></script>
<script src="../js/core/progress.js?v=33"></script>
<script src="../js/core/game.js?v=33"></script>
<script src="../js/render2d/art.js?v=33"></script>
<script src="../js/ui/icones_ui.js?v=33"></script>
<script src="../js/ui/hud.js?v=33"></script>
<script>
(function () {
  'use strict';
  var R = { passed: 0, failed: 0, failures: [] };
  var out = document.getElementById('out');
  var D = JOGO.DATA || {};

  // ==================================================== SANDBOX DE SAVE (B4)
  // Esta página SEMEIA um save de demonstração para as telas terem o que
  // mostrar — e antes disso APAGAVA o save real do jogador (529 B do usuário
  // viraram 1.357 B só de abrir a página).
  //
  // Snapshot-e-restaura no fim não bastaria: a interface continua viva depois
  // dos testes (captura headless, cliques) e pode salvar sozinha. Então a
  // blindagem é mais forte: as chaves do SOTERRA passam a viver em MEMÓRIA
  // durante toda a página. O disco não é tocado nenhuma vez — nem para gravar
  // a semente, nem depois. O save real entra na sombra só para leitura, então
  // `Progress.load()` enxerga o mundo normal antes de `seed()` sobrescrever.
  // A blindagem em si mora em `tests/save_sandbox.js` (carregado no topo), para
  // que QUALQUER página de teste possa adotá-la com uma linha — foi o mesmo
  // defeito que reapareceu depois em `tests/chief_play.html`.
  var SB = JOGO.SaveSandbox || null;
  var shadowOn = !!(SB && SB.active);

  function check(name, cond, detail) {
    if (cond) R.passed++;
    else { R.failed++; R.failures.push(name + (detail ? ' — ' + detail : '')); }
    var line = document.createElement('div');
    line.className = cond ? 'ok' : 'bad';
    line.textContent = (cond ? '✓ ' : '✕ ') + name + (detail && !cond ? ' — ' + detail : '');
    out.appendChild(line);
    return !!cond;
  }
  function note(t) {
    var d = document.createElement('div');
    d.className = 'dim'; d.textContent = '· ' + t; out.appendChild(d);
  }
  // avaliação tolerante: o teste nunca pode morrer por um módulo ausente
  function safe(fn, def) { try { var v = fn(); return v === undefined ? def : v; } catch (e) { return def; } }

  // ---------------------------------------------------- semente de progresso
  // Um save de teste rico o bastante para todas as telas terem o que mostrar.
  function seed() {
    var P = JOGO.Progress;
    if (!P) return;
    try { localStorage.removeItem('soterra-save-v2'); } catch (e) {}
    P.reset ? P.reset() : P.load();
    // cartas: libera invocador e bruxo e dá estrelas ao sumô
    P.addCards('sumo', 42);          // liberada + estrelas
    P.addCards('curandeiro', 17);    // liberada + 2 estrelas
    P.addCards('invocador', 12);     // liberada (custo 10)
    P.addCards('bruxo', 6);          // ainda trancada (custo 10)
    P.addCards('espadachim', 3);     // trancada (custo 20)
    P.addCards('arqueiro', 1);       // trancada (custo 25)
    // XP para passar do nível 5 (a tela de elemento precisa de gente pendente)
    P.addXp('sumo', 900);
    P.addXp('curandeiro', 900);
    P.addXp('invocador', 260);
    // caminho já escolhido para um deles, o outro fica pendente
    P.chooseElement('sumo', 'terra');
    // itens: um de cada espaço + repetidos para a forja ter o que mastigar
    var ids = Object.keys(D.items || {});
    ids.slice(0, 9).forEach(function (id) { P.addItem(id); });
    // uma peça de CADA raridade tem que estar no inventário, senão a lendária
    // (o troféu do jogo) nunca aparece numa tela e volta a passar despercebida
    ['comum', 'raro', 'epico', 'lendario'].forEach(function (r) {
      var achou = ids.filter(function (id) { return D.items[id].rarity === r; })[0];
      if (achou) P.addItem(achou);
    });
    // pedras fartas para a forja mostrar o caminho todo
    Object.keys(D.stones || {}).forEach(function (s) { P.addStones(s, 40); });
    // bichos
    Object.keys(D.pets || {}).slice(0, 3).forEach(function (p) { P.addPet(p); });
    // equipa uma peça de cada espaço no sumô (equipar TIRA a cópia do saco, por
    // isso a lista é fotografada ANTES do laço — iterar o vivo pularia peças)
    var alvos = P.state.inventory.map(function (e) { return e.itemId; });
    var usados = {};
    alvos.forEach(function (id) {
      var slot = (D.items[id] || {}).slot;
      if (!slot || usados[slot]) return;
      if (P.equip('sumo', id)) usados[slot] = true;
    });
    // sobe a peça vestida na forja para o tier aparecer
    P.upgradeWorn('sumo', 'punho'); P.upgradeWorn('sumo', 'punho'); P.upgradeWorn('sumo', 'punho');
    // REPETIDAS: uma pilha de 3 pronta para fundir e uma peça que já é ★1,
    // para a grade mostrar o contador ×N e as duas cores (raridade × estrela)
    var repetido = ids.filter(function (id) { return D.items[id].slot === 'passo'; })[0];
    if (repetido) {
      for (var r1 = 0; r1 < 3; r1++) P.addItem(repetido);
      P.fuseItem(P.invIndexOf(repetido));            // vira ★1
      for (var r2 = 0; r2 < 3; r2++) P.addItem(repetido);  // e sobra ×3 para fundir
    }
  }

  // ------------------------------------------------------------- inspeções
  function visibleScreen() {
    var s = document.querySelectorAll('#ui-root .ui-screen.is-on');
    return s.length === 1 ? s[0] : null;
  }
  // nenhum controle pode ser menor que 44px (contrato §0)
  function tinyTargets(scope) {
    var bad = [], nodes = scope.querySelectorAll('button, .btn');
    for (var i = 0; i < nodes.length; i++) {
      var r = nodes[i].getBoundingClientRect();
      if (r.width < 2 && r.height < 2) continue;         // oculto
      // §0 pede ≥44 px. O limiar estava em 40 e deixava passar exatamente a
      // violação que existia (.btn-tab a 40 px) — o teste não pode ser mais
      // frouxo que o contrato que ele guarda.
      if (r.height < 44 || r.width < 44) {
        bad.push((nodes[i].className || 'btn') + ' ' + Math.round(r.width) + '×' + Math.round(r.height));
      }
    }
    return bad;
  }
  // nada pode vazar para fora da largura do celular
  function overflows(scope) {
    var bad = [], nodes = scope.querySelectorAll('*');
    var lim = document.getElementById('phone').getBoundingClientRect();
    for (var i = 0; i < nodes.length; i++) {
      var r = nodes[i].getBoundingClientRect();
      if (r.width === 0) continue;
      if (r.right > lim.right + 1.5 || r.left < lim.left - 1.5) {
        // barras roláveis podem ter conteúdo maior que a caixa: se QUALQUER
        // ancestral rola na horizontal, o transbordo é intencional
        var p = nodes[i].parentNode, rolavel = false;
        while (p && p.nodeType === 1 && p !== scope.parentNode) {
          var ov = getComputedStyle(p).overflowX;
          if (ov === 'auto' || ov === 'scroll') { rolavel = true; break; }
          p = p.parentNode;
        }
        if (rolavel) continue;
        bad.push(nodes[i].className || nodes[i].tagName);
      }
    }
    return bad;
  }

  function inspect(name) {
    var s = visibleScreen();
    if (!check('tela ' + name + ': exatamente uma visível', !!s)) return;
    check('tela ' + name + ': tem conteúdo', s.childNodes.length > 0);
    var tiny = tinyTargets(s);
    check('tela ' + name + ': alvos de toque ≥ 44px', tiny.length === 0, tiny.slice(0, 4).join(' | '));
    var ov = overflows(s);
    check('tela ' + name + ': nada vaza da largura de 390px', ov.length === 0, ov.slice(0, 4).join(' | '));
  }

  // ------------------------------------------------------------------ roda
  var t0 = performance.now();
  var errs = [];
  window.addEventListener('error', function (e) { errs.push(e.message); });

  check('JOGO.Art carregado', !!JOGO.Art);
  check('JOGO.UI carregado', !!JOGO.UI);
  check('UI.init é função', typeof JOGO.UI.init === 'function');
  check('UI.showScreen é função', typeof JOGO.UI.showScreen === 'function');
  check('UI.handleEvent é função', typeof JOGO.UI.handleEvent === 'function');
  check('UI.update é função', typeof JOGO.UI.update === 'function');

  try { seed(); check('progresso semente gravado', true); }
  catch (e) { check('progresso semente gravado', false, e.message); }

  try { JOGO.UI.init(); check('UI.init sem erro', true); }
  catch (e) { check('UI.init sem erro', false, e.message); }

  var SCREENS = ['menu', 'heroSelect', 'dungeonSelect', 'elementChoice',
                 'battle', 'roomClear', 'dungeonComplete', 'defeat'];

  // dados de mentira para as telas de recompensa
  // Formato REAL de game.js: `xpMult` e `xpPorHeroi` são objetos por heroId.
  // O sumô está muito acima do nível do calabouço (corte no piso ×0,10); a
  // curandeiro está na faixa (×1). É o caso que o QA pegou: a HUD anunciava
  // 180 e o sumô levava 18.
  var fakeRewards = {
    xpGanho: 180,
    xpMult: { sumo: 0.1, curandeiro: 1 },
    xpPorHeroi: { sumo: 18, curandeiro: 180 },
    levelUps: [{ heroId: 'curandeiro', niveis: 1, novoNivel: 6 }],
    drops: Object.keys(D.items || {}).slice(9, 12),
    pets: Object.keys(D.pets || {}).slice(3, 4),
    cards: [{ classId: 'bruxo', name: 'Bruxo', amount: 2, cards: 8, unlocked: false, stars: 0, starUp: false }],
    stones: (function () { var o = {}; Object.keys(D.stones || {}).slice(0, 2).forEach(function (s) { o[s] = 3; }); return o; })(),
    elementChoices: ['curandeiro']
  };

  function goto(name) {
    if (name === 'battle') {
      // batalha de verdade: o HUD lê Engine/Game
      try {
        JOGO.UI.selection(['sumo', 'curandeiro']);
        var dg = (D.dungeons && D.dungeons[0]) ? D.dungeons[0].id : null;
        JOGO.Game.startRun(['sumo', 'curandeiro'], dg);
      } catch (e) { note('startRun falhou: ' + e.message); JOGO.UI.showScreen('battle'); }
    } else if (name === 'roomClear' || name === 'dungeonComplete') {
      JOGO.UI.showScreen(name, fakeRewards);
    } else if (name === 'elementChoice') {
      JOGO.UI.showScreen(name, { heroIds: ['curandeiro'] });
    } else {
      JOGO.UI.selection(['sumo', 'curandeiro']);
      JOGO.UI.showScreen(name);
    }
  }

  var nav = document.getElementById('nav');
  SCREENS.forEach(function (n) {
    var b = document.createElement('button');
    b.textContent = n;
    b.onclick = function () { goto(n); };
    nav.appendChild(b);
  });
  ['collection', 'inventory', 'forge', 'heroSheet'].forEach(function (n) {
    var b = document.createElement('button');
    b.textContent = '▸ ' + n;
    b.onclick = function () { JOGO.UI.openSheet(n, n === 'heroSheet' ? 'sumo' : null); };
    nav.appendChild(b);
  });

  // percorre todas as telas medindo cada uma
  SCREENS.forEach(function (n) {
    try { goto(n); } catch (e) { check('tela ' + n + ' monta', false, e.message); return; }
    check('tela ' + n + ' monta', true);
    inspect(n);
  });

  // ---- B3: a tela de recompensa não pode mentir sobre a XP
  (function () {
    goto('roomClear');
    var rw = document.querySelector('#ui-root .ui-screen.is-on');
    var txt = rw ? rw.textContent : '';
    // o pecado original: imprimir o objeto `xpMult` cru
    check('recompensa: nenhum [object Object] na tela', txt.indexOf('[object Object]') < 0);
    // o valor REAL de cada herói tem que aparecer…
    check('recompensa: mostra a XP real do herói cortado (+18)', /\+18\s*XP/.test(txt), txt.slice(0, 140));
    check('recompensa: mostra a XP real do herói não cortado (+180)', /\+180\s*XP/.test(txt));
    // …e o corte tem que estar explicado
    check('recompensa: mostra o multiplicador aplicado', /×0,10/.test(txt), txt.slice(0, 200));
    check('recompensa: explica POR QUE ganhou menos',
      /f[áa]cil demais/i.test(txt), txt.slice(0, 200));
    check('recompensa: cita o nível recomendado do calabouço',
      /recomendado/i.test(txt), txt.slice(0, 200));
    check('recompensa: empurra o jogador a descer', /mais fundo/i.test(txt));
    // sem corte, nada de barulho: o painel volta a ser simples
    JOGO.UI.showScreen('roomClear', { xpGanho: 90, xpMult: { sumo: 1, curandeiro: 1 },
                                      xpPorHeroi: { sumo: 90, curandeiro: 90 } });
    var limpo = document.querySelector('#ui-root .ui-screen.is-on').textContent;
    check('recompensa: sem corte não mostra aviso nenhum',
      /\+90\s*XP/.test(limpo) && !/f[áa]cil demais/i.test(limpo) && limpo.indexOf('×') < 0,
      limpo.slice(0, 140));
    // formato antigo (número simples) não pode quebrar a tela
    JOGO.UI.showScreen('roomClear', { xpGanho: 50 });
    var velho = document.querySelector('#ui-root .ui-screen.is-on').textContent;
    check('recompensa: aguenta o pacote sem xpMult/xpPorHeroi',
      /\+50\s*XP/.test(velho) && velho.indexOf('[object Object]') < 0 && velho.indexOf('NaN') < 0,
      velho.slice(0, 140));
    // ---- 08/10 à noite (o dono: "todas as XPs foram zeradas"): a sala que o servidor NÃO pagou diz POR QUÊ, numa
    //      linha fixa em vermelho (.rw-xp-recusa) pelo código do servidor; a que ainda espera a conferência diz que espera
    var vazia = { xpGanho: 0, xpMult: {}, xpPorHeroi: {}, levelUps: [], drops: [], elementChoices: [] };
    function telaCom(extra) {
      var d = {}, k;
      for (k in vazia) d[k] = vazia[k];
      for (k in extra) d[k] = extra[k];
      JOGO.UI.showScreen('roomClear', d);
      return document.querySelector('#ui-root .ui-screen.is-on');
    }
    var tR = telaCom({ recusada: 'a sala fechou rápido demais para ser de verdade', recusadaMotivo: 'rapido-demais' });
    var lR = tR.querySelector('.rw-xp-recusa');
    check('recompensa recusada (rapido-demais): a linha fixa do porquê existe e fala do rápido demais',
      !!lR && /r[áa]pido demais/i.test(lR.textContent) && /n[ãa]o rendeu/i.test(lR.textContent), lR ? lR.textContent : 'sem linha');
    check('recompensa recusada: a linha é vermelha (a cor de --bad)',
      !!lR && getComputedStyle(lR).color === getComputedStyle(document.documentElement).getPropertyValue('--bad').trim().replace(/^#(..)(..)(..)$/, function (m, r, g, b) { return 'rgb(' + parseInt(r, 16) + ', ' + parseInt(g, 16) + ', ' + parseInt(b, 16) + ')'; }),
      lR ? getComputedStyle(lR).color : 'sem linha');
    var tF = telaCom({ recusada: 'a sala em grupo teve uma sincronização por foto e não pôde ser conferida', recusadaMotivo: 'nao-conferida', rede: true });
    check('recompensa não conferida (foto): explica a foto e o registro limpo',
      /foto/i.test((tF.querySelector('.rw-xp-recusa') || {}).textContent || ''), (tF.querySelector('.rw-xp-recusa') || {}).textContent);
    var tG = telaCom({ recusada: 'as regras do jogo mudaram no meio da sala — abram a sala de novo', recusadaMotivo: 'regras-mudaram', rede: true });
    check('recompensa com as regras mudadas: manda abrir de novo',
      /abram a sala de novo/i.test((tG.querySelector('.rw-xp-recusa') || {}).textContent || ''));
    var tV = telaCom({ recusada: 'o estado divergiu no lance 7', recusadaMotivo: 'divergiu' });
    check('recompensa recusada pelo juiz: cita a frase do servidor',
      /recusou a confer[êe]ncia/i.test((tV.querySelector('.rw-xp-recusa') || {}).textContent || '') && /lance 7/.test(tV.textContent));
    var tE = telaCom({ conferindo: { motivo: 'fotografada', esperaMs: 95000 }, rede: true });
    var lE = tE.querySelector('.rw-xp-espera');
    check('recompensa esperando a conferência: a linha de espera diz que espera, o porquê e até quando (95 s)',
      !!lE && /esperando a confer[êe]ncia/i.test(lE.textContent) && /foto/i.test(lE.textContent) && /95 s/.test(lE.textContent) && !tE.querySelector('.rw-xp-recusa'),
      lE ? lE.textContent : 'sem linha');
    var tOk = telaCom({ xpGanho: 90, xpMult: { sumo: 1, curandeiro: 1 }, xpPorHeroi: { sumo: 90, curandeiro: 90 } });
    check('recompensa paga: nenhuma linha de recusa nem de espera', !tOk.querySelector('.rw-xp-recusa') && !tOk.querySelector('.rw-xp-espera'));
  })();

  // ---- folhas (modais)
  [['collection', null], ['inventory', null], ['forge', null], ['heroSheet', 'sumo']].forEach(function (p) {
    try {
      JOGO.UI.openSheet(p[0], p[1]);
      var sh = document.querySelector('#ui-root .ui-sheet.is-on .sheet-panel');
      check('folha ' + p[0] + ' abre', !!sh);
      if (sh) {
        var tiny = tinyTargets(sh);
        check('folha ' + p[0] + ': alvos ≥ 44px', tiny.length === 0, tiny.slice(0, 4).join(' | '));
        var ov = overflows(sh);
        check('folha ' + p[0] + ': cabe em 390px', ov.length === 0, ov.slice(0, 4).join(' | '));
      }
      JOGO.UI.closeSheet();
    } catch (e) { check('folha ' + p[0] + ' abre', false, e.message); }
  });

  // ---- conteúdo obrigatório das telas novas
  JOGO.UI.openSheet('collection');
  var colTxt = document.querySelector('#ui-root .ui-sheet').textContent;
  check('coleção mostra progresso n/custo', /\d+\s*\/\s*\d+ cartas/.test(colTxt), colTxt.slice(0, 80));
  check('coleção mostra os bônus de estrela', /PV/.test(colTxt) && /PP/.test(colTxt) && /PA/.test(colTxt));
  check('coleção tem 5 passos de estrela por classe',
    document.querySelectorAll('#ui-root .star-track').length >= 1 &&
    document.querySelectorAll('#ui-root .col-row:first-child .star-step').length === 5);
  JOGO.UI.closeSheet();

  // ---- B6: a raridade lendária tem que existir na apresentação
  (function () {
    JOGO.UI.openSheet('inventory');
    var sh = document.querySelector('#ui-root .ui-sheet');
    var cel = sh && sh.querySelector('.ig-cell.is-lendario');
    check('a peça lendária recebe a marcação própria na grade', !!cel);
    if (cel) cel.click();                       // toque do jogador: abre a barra da peça
    var t = document.querySelector('#ui-root .ui-sheet').textContent;
    check('a peça escolhida escreve "Lendário" com acento e maiúscula',
      t.indexOf('Lendário') >= 0 && t.indexOf('lendario') < 0, t.slice(0, 160));
    if (cel) {
      var rc = cel.style.getPropertyValue('--rc').trim();
      var halo = cel.style.getPropertyValue('--rc-halo').trim();
      check('lendária não usa a cor de comum', rc && rc !== '#9aa4ae' && rc !== '#ffc44d', rc);
      check('lendária tem halo próprio', halo && halo !== rc, halo);
      var cs = getComputedStyle(cel);
      check('lendária brilha (box-shadow)', cs.boxShadow && cs.boxShadow !== 'none', cs.boxShadow);
    }
    JOGO.UI.closeSheet();
  })();

  JOGO.UI.openSheet('inventory');
  var shInv = document.querySelector('#ui-root .ui-sheet');
  var invTxt = shInv.textContent;
  check('a tela de personagens tem as três abas',
    /Inventário/.test(invTxt) && /Forja/.test(invTxt) && /Coleção/.test(invTxt), invTxt.slice(0, 90));
  check('inventário nomeia os espaços novos', /Punho/.test(invTxt) && /Passo/.test(invTxt) &&
        /Casca/.test(invTxt) && /Lume/.test(invTxt), invTxt.slice(0, 80));
  check('inventário traz o herói com setas para passar',
    document.querySelectorAll('#ui-root .pt-hero .pt-nav').length === 2);
  check('o carrossel só mostra herói de classe LIBERADA', (function () {
    var nm = shInv.querySelector('.pt-hero-nm');
    var trancadas = Object.keys(D.classes).filter(function (c) { return !P.isClassUnlocked(c); })
                          .map(function (c) { return D.classes[c].name; });
    return !!nm && trancadas.indexOf(nm.textContent) < 0;
  })(), (shInv.querySelector('.pt-hero-nm') || {}).textContent);
  check('a grade empilha repetidos com ×N',
    /×\d/.test(invTxt) && shInv.querySelectorAll('.ig-n').length >= 1, invTxt.slice(0, 90));
  check('inventário mostra nível +N', /\+\d/.test(invTxt));
  check('o item equipado SAIU da grade', (function () {
    var vestido = P.hero('sumo').items.punho;
    if (!vestido) return false;
    var naGrade = shInv.querySelectorAll('.ig-cell');
    for (var i = 0; i < naGrade.length; i++) {
      if ((naGrade[i].textContent || '').indexOf(D.items[vestido].name) >= 0) return false;
    }
    return P.invCount(vestido) === 0;
  })(), P.hero('sumo').items.punho);
  check('o espaço do herói mostra a peça vestida e o que ela dá',
    /Tirar/.test(invTxt) && /PV|PA|PP|poder|esquiva/.test(invTxt));
  JOGO.UI.closeSheet();

  // ---- estrelas de item: fundir 3 iguais, sem confundir com as de classe
  (function () {
    JOGO.UI.openSheet('inventory');
    var sh = document.querySelector('#ui-root .ui-sheet');
    var pilha = sh.querySelector('.ig-cell .ig-n');
    check('existe uma pilha com repetidos para fundir', !!pilha);
    if (pilha) {
      var cel = pilha.parentNode;
      cel.click();
      var t = document.querySelector('#ui-root .ui-sheet').textContent;
      check('a barra da peça oferece a fusão', /Fundir\s*3|faltam \d+ p\/ ★/.test(t), t.slice(0, 200));
    }
    var comEstrela = sh.querySelector('.ig-cell.sq1, .ig-cell.sq2, .ig-cell.sq3');
    check('a peça com estrela tem FUNDO próprio (★1 cinza · ★2 azul · ★3 amarelo)', !!comEstrela,
      comEstrela ? comEstrela.className : 'nenhuma');
    if (comEstrela) {
      var bg = getComputedStyle(comEstrela).backgroundImage + getComputedStyle(comEstrela).backgroundColor;
      var crua = sh.querySelector('.ig-cell.sq0');
      check('o fundo da peça com estrela difere do fundo da peça crua',
        !crua || bg !== (getComputedStyle(crua).backgroundImage + getComputedStyle(crua).backgroundColor), bg);
      check('a estrela de ITEM não usa o desenho da estrela de CLASSE',
        comEstrela.querySelector('.item-stars') && !comEstrela.querySelector('.star-row'));
    }
    JOGO.UI.closeSheet();
  })();

  JOGO.UI.openSheet('forge');
  var fgTxt = document.querySelector('#ui-root .ui-sheet').textContent;
  check('forja mostra os tiers', /Comum/.test(fgTxt) && /Raro/.test(fgTxt) &&
        /Supremo/.test(fgTxt) && /Magn/.test(fgTxt));
  check('forja mostra custo em pedras', /\d+ \/ \d+/.test(fgTxt));
  check('forja tem trilha de 10 passos',
    document.querySelectorAll('#ui-root .fg-step').length === ((D.upgrade && D.upgrade.maxLevel) || 10) + 1);
  JOGO.UI.closeSheet();

  JOGO.UI.openSheet('heroSheet', 'sumo');
  var hsTxt = document.querySelector('#ui-root .ui-sheet').textContent;
  check('ficha usa os 4 espaços com nome próprio',
    /Punho/.test(hsTxt) && /Passo/.test(hsTxt) && /Casca/.test(hsTxt) && /Lume/.test(hsTxt));
  check('ficha tem espaço de bicho separado', /Bicho/.test(hsTxt));
  check('ficha explica o ganho por nível', /Cada nível/.test(hsTxt) && /\+5 PV/.test(hsTxt), hsTxt.slice(0, 120));
  JOGO.UI.closeSheet();

  // ---- escolha de elemento: 4 caminhos e o argumento do ganho elemental
  goto('elementChoice');
  var ecCards = document.querySelectorAll('#ui-root .screen-elementChoice .ec-card');
  check('escolha de elemento: 4 caminhos', ecCards.length === 4, 'achou ' + ecCards.length);
  var ecTxt = document.querySelector('#ui-root .screen-elementChoice').textContent;
  check('escolha de elemento: mostra +5 PV e +3 de dano elemental',
    /\+5 PV/.test(ecTxt) && /\+3 de dano/.test(ecTxt), ecTxt.slice(0, 140));
  check('escolha de elemento: mostra prévia dos feitiços',
    document.querySelectorAll('#ui-root .screen-elementChoice .ec-spell').length >= 12);

  // ---- seleção de 1 ou 2 heróis + medidor de sorte
  goto('heroSelect');
  JOGO.UI.selection(['sumo']);
  JOGO.UI.showScreen('heroSelect');
  var hsel = document.querySelector('#ui-root .screen-heroSelect').textContent;
  check('seleção solo: sorte máxima', /máxima/.test(hsel), hsel.slice(0, 100));
  JOGO.UI.selection(['sumo', 'curandeiro']);
  JOGO.UI.showScreen('heroSelect');
  hsel = document.querySelector('#ui-root .screen-heroSelect').textContent;
  check('seleção dupla: sorte média', /média/.test(hsel));
  check('seleção mostra classes trancadas em silhueta',
    document.querySelectorAll('#ui-root .screen-heroSelect .hero-card.is-locked').length >= 1);
  check('classe trancada mostra progresso de cartas',
    /\d+ \/ \d+ cartas/.test(document.querySelector('#ui-root .screen-heroSelect').textContent));

  // ---- HUD de batalha
  goto('battle');
  // a ordem de iniciativa pode começar num monstro: avança até o turno do herói
  // (o HUD de feitiços e o cronômetro só valem no turno do jogador)
  (function () {
    for (var i = 0; i < 20 && !JOGO.Game.isPlayerTurn(); i++) {
      try { JOGO.Engine.endTurn(JOGO.Game.state); } catch (e) { break; }
    }
    JOGO.UI.showScreen('battle');
  })();
  var bs = document.querySelector('#ui-root .screen-battle');
  check('batalha: linha de iniciativa', !!bs.querySelector('.bt-timeline .tl-unit'));
  check('batalha: painel da unidade ativa', !!bs.querySelector('.bt-active .bar-hp'));
  check('batalha: pips de PA e PP', !!bs.querySelector('.p-pa .pip') && !!bs.querySelector('.p-pp .pip'));
  check('batalha: cronômetro com segundos', /\d+s/.test(bs.querySelector('.bt-timer').textContent));
  check('batalha: barra de feitiços rolável',
    bs.querySelectorAll('.bt-spells .spell').length >= 1 &&
    getComputedStyle(bs.querySelector('.bt-spells')).overflowX === 'auto');
  check('batalha: custo de PA em cada feitiço',
    bs.querySelectorAll('.bt-spells .sp-cost').length === bs.querySelectorAll('.bt-spells .spell').length);
  check('batalha: botão de encerrar turno', !!bs.querySelector('.btn-end'));
  check('batalha: log presente', !!bs.querySelector('.bt-log'));
  // o canvas continua acessível ao toque entre os painéis
  check('batalha: a camada de UI não bloqueia o tabuleiro',
    getComputedStyle(bs).pointerEvents === 'none');
  // cronômetro contando
  var before = JOGO.Game.timeLeft();
  JOGO.Game.update(1.0);
  check('cronômetro anda com update(dt)', JOGO.Game.timeLeft() < before,
    before + ' → ' + JOGO.Game.timeLeft());
  JOGO.UI.update(0.016);
  check('UI.update não quebra em batalha', true);
  // eventos do Engine chegam ao log
  JOGO.UI.handleEvent({ type: 'log', text: 'teste de log' });
  JOGO.UI.handleEvent({ type: 'weatherShift', weather: 'chuva' });
  check('log recebe eventos', bs.querySelectorAll('.bt-log-list .log-line').length >= 2);

  // ---------------------------------------------- NENHUM ID CRU NA INTERFACE
  // O Chefe viu na barra o botão "0 is-seed-bomb" onde devia ler
  // "Bomba de Sementes · 3 PA": a HUD resolvia o feitiço só em DATA.spells, e
  // os 12 Lumes (itemSpells) e a barra INTEIRA da unidade fundida (feitiços
  // gerados em memória) caíam fora. Aqui a barra é montada com os dois casos e
  // varrida atrás de qualquer rótulo em formato de id e de custo zero mentiroso.
  var ID_CRU = /^[a-z]+(-[a-z0-9]+)+$/;
  (function () {
    var u = safe(function () { return JOGO.Engine.activeUnit(JOGO.Game.state); }, null);
    if (!check('barra: existe unidade ativa para o teste', !!u)) return;

    // (a) feitiço de ITEM — o que o Chefe pegou
    var itemSid = Object.keys(D.itemSpells || {})[0] || 'is-seed-bomb';
    // (b) feitiço de FUSÃO gerado em memória (nunca esteve em DATA)
    var fusSid = null;
    try {
      var kPar = Object.keys(D.fusionForms || {})[0];
      var kEl = Object.keys(D.fusionBlends || {})[0];
      var ger = JOGO.Fusion.spellsFor(kPar, kEl, 30) || [];
      if (ger.length) {
        ger.forEach(function (sp) { JOGO.Engine.registerSpell(sp); });
        fusSid = ger[0].id;
      }
    } catch (e) { /* sem fusão disponível */ }

    var originais = u.spells ? u.spells.slice() : [];
    u.spells = [itemSid].concat(fusSid ? [fusSid] : []).concat(originais.slice(0, 2));
    u.cooldowns = u.cooldowns || {};
    JOGO.UI.showScreen('battle');
    var barra = document.querySelector('#ui-root .bt-spells');
    check('barra: montou com feitiço de item' + (fusSid ? ' e de fusão' : ''),
      !!barra && barra.querySelectorAll('.spell').length >= (fusSid ? 2 : 1));

    if (barra) {
      var nomes = [], custos = [], ruins = [], zeros = [];
      barra.querySelectorAll('.spell').forEach(function (cell, i) {
        var nm = (cell.querySelector('.sp-name') || {}).textContent || '';
        var ct = (cell.querySelector('.sp-cost') || {}).textContent || '';
        nomes.push(nm); custos.push(ct);
        if (ID_CRU.test(nm.trim())) ruins.push(nm.trim());
        var sid = u.spells[i];
        var real = safe(function () { return JOGO.Engine.spell(sid); }, null);
        if (real && real.paCost > 0 && String(ct).trim() === '0') zeros.push(sid + ' devia custar ' + real.paCost);
      });
      check('barra: nenhum rótulo em formato de id', ruins.length === 0, ruins.join(' | '));
      check('barra: nenhum custo 0 mentiroso', zeros.length === 0, zeros.join(' | '));
      // e o caso exato do Chefe, pelo nome
      var isb = safe(function () { return JOGO.Engine.spell('is-seed-bomb'); }, null);
      if (isb) {
        check('barra: "is-seed-bomb" aparece como "' + isb.name + '"',
          nomes.indexOf('is-seed-bomb') < 0 && nomes.join('|').indexOf(isb.name) >= 0, nomes.join(' | '));
        check('barra: e cobra os ' + isb.paCost + ' PA certos',
          custos.indexOf(String(isb.paCost)) >= 0, custos.join(' | '));
      }
    }

    // a tela inteira também não pode conter id cru solto em rótulo
    (function () {
      var bs2 = document.querySelector('#ui-root .screen-battle');
      var soltos = [];
      bs2.querySelectorAll('.sp-name, .hs-spell span, .ec-spell b').forEach(function (n) {
        var t = (n.textContent || '').trim();
        if (ID_CRU.test(t)) soltos.push(t);
      });
      check('batalha: nenhum id cru em rótulo de feitiço', soltos.length === 0, soltos.join(' | '));
    })();

    u.spells = originais;
    JOGO.UI.showScreen('battle');
  })();

  // ficha do herói e item de Lume: o nome do feitiço concedido também é resolvido
  (function () {
    var lume = Object.keys(D.items || {}).filter(function (id) {
      return D.items[id].slot === 'lume' && D.items[id].grantsSpell;
    })[0];
    if (!check('existe item de Lume para testar', !!lume)) return;
    var sp = safe(function () { return JOGO.Engine.spell(D.items[lume].grantsSpell); }, null);
    check('o feitiço concedido pelo Lume resolve pelo motor', !!sp, D.items[lume].grantsSpell);
    JOGO.UI.openSheet('inventory');
    var txt = document.querySelector('#ui-root .ui-sheet').textContent;
    JOGO.UI.closeSheet();
    check('inventário não mostra id cru de feitiço concedido',
      txt.indexOf(D.items[lume].grantsSpell) < 0, D.items[lume].grantsSpell);
  })();

  check('nenhum erro de janela', errs.length === 0, errs.join(' | '));

  // ------------------------------------------------ prova do sandbox (B4)
  // Depois de semear 3 classes, itens, pedras e forja +3, o save REAL no disco
  // tem que estar exatamente como estava. Se esta checagem cair, a página
  // voltou a comer o progresso do jogador.
  check('sandbox de save instalado', shadowOn);
  if (shadowOn) {
    var st = SB.check();
    var orig = SB.original('soterra-save-v2');
    check('o save REAL do jogador continua byte a byte igual', st.ok,
      'disco agora: ' + JSON.stringify(st.disco) + ' · original: ' +
      (orig === null ? 'ausente' : orig.length + ' B'));
    // e a semente realmente existe (senão o sandbox estaria escondendo tudo)
    var mem = localStorage.getItem('soterra-save-v2');
    check('a semente de demonstração vive só na memória', !!mem && mem !== orig);
  }

  // tela final para a captura headless (?screen=nome)
  var want = (location.search.match(/[?&]screen=([a-zA-Z]+)/) || [])[1];
  var sheet = (location.search.match(/[?&]sheet=([a-zA-Z]+)/) || [])[1];
  if (want) goto(want); else goto('menu');
  if (sheet) JOGO.UI.openSheet(sheet, sheet === 'heroSheet' ? 'sumo' : null);

  var dt = Math.round(performance.now() - t0);
  document.getElementById('meta').textContent = R.passed + ' ok · ' + R.failed + ' falhas · ' + dt + ' ms';
  var v = document.getElementById('verdict');
  v.textContent = R.failed === 0 ? 'PASS' : 'FAIL (' + R.failed + ')';
  v.className = R.failed === 0 ? 'pass' : 'fail';
  window.TEST_RESULTS = R;
  window.UI_READY = true;
})();
</script>
</body>
</html>
