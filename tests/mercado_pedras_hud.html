<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOTERRA — as pedras no Mercadinho (HUD)</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  html, body { overflow: auto; height: auto; }
  body { margin: 0; background: #0f1216; color: #e8eef6; }
  #topo { padding: 10px; font: 12px monospace; }
  #summary { padding: 6px 10px; border-radius: 6px; margin-bottom: 8px; }
  .allpass { background: #16241b; color: #7fe08a; } .fail { background: #3d1414; color: #f77; }
  /* a PROVA roda numa coluna de celular (390); a FOTO (?foto=) usa a janela
     inteira e esconde o placar */
  html.prova #app { position: relative; width: 390px; height: 844px; }
  html.foto #topo { position: fixed; left: -9999px; top: 0; }
</style>
</head>
<body>
<!-- AS PEDRAS NO MERCADINHO (22/09, pedido do dono: "o jogador poderá colocar pedras
     para vender também, em unidade ou lotes de 10, 50 e 100"). tests/mercado.html,
     tests/mercado_cliente.js e tests/mercado_api.py cobram a REGRA (o módulo, o juiz e
     o servidor); esta cobra a FICHA. Página LEVE — sem index.html, sem WebGL: o CSS,
     os dados, o banco local, o módulo do mercado, o miolo, o Art, os ícones e a HUD
     de verdade num #app de 390 px. Semeia três peças no saco, pedras de quase todo
     tipo (a Rocha-Mãe fica em zero), 500 vinténs e um balcão local com uma peça e um
     lote de outro vendedor, e cobra:
       · a fileira de CATEGORIA (Equipamentos | Pedras) em Comprar e Vender, fora da
         conta das .mc-filtros: em Equipamentos a primeira .mc-filtros segue sendo a
         do espaço, com o botão /^Punho$/; em Pedras vêm o elemento e a busca;
       · peça nunca em Pedras, lote nunca em Equipamentos (nos dois balcões);
       · o balcão LOCAL: Vender › Pedras com os lotes 1/10/50/100 (o que passa do
         estoque apagado e tocável), o preço sugerido no placeholder, a conta ao vivo,
         o Anunciar lote que tira as pedras e grava a oferta; Meus anúncios com o lote
         e o Retirar que devolve as pedras SEM olhar o saco; Comprar › Pedras com o
         lote de outro vendedor e a compra que põe as pedras no estoque;
       · o balcão ENTRE CONTAS (Autoridade e servidor de mentira): Comprar › Pedras
         pelo resumo.pedras (sem pedir de novo ao trocar de categoria), Ver lotes →
         Comprar por X sem olhar o saco e Fazer oferta; Vender › Pedras chama
         anunciarPedras(pedra, lote, preço); Meus anúncios, Vendas recentes, Minhas
         ofertas e a confirmação falam do LOTE;
       · os botões redondos no contrato da casa, nada vazando dos 390 px, nenhum erro
         e o save de verdade intocado.
     ?foto=comprar|vender|lotes|meus|ofertas [&srv=1] -> semeia, abre o Mercadinho na
     categoria Pedras daquela aba e marca __pronto (para as fotos de 1280 e de 390);
     ?foto=confirma abre a confirmação de uma proposta aceita por um lote.
     Uso: python <roda.py> resumo tests/mercado_pedras_hud.html 30000 -->
<div id="topo"><div id="summary">rodando…</div><div id="log"></div></div>
<div id="app"><canvas id="game-canvas"></canvas><div id="ui-root"></div></div>
<script>
  (function () {
    var foto = /[?&]foto=/.test(location.search);
    document.documentElement.className += foto ? ' foto' : ' prova';
  })();
</script>
<script src="save_sandbox.js"></script>
<script>
  window.__V = '?v=' + Date.now();
  var arqs = ['js/core/data/elements.js','js/core/data/classes.js','js/core/data/spells.js',
    'js/core/data/progression.js','js/core/data/monsters.js','js/core/data/dungeons.js',
    'js/core/data/fusions.js','js/core/data/pets.js','js/core/data/items.js',
    'js/core/data/items_extra.js','js/core/data/items_selos.js','js/core/data/consumiveis.js',
    'js/core/contas.js','js/core/nomes.js','js/core/db.js','js/core/mercado.js',
    'js/core/engine.js','js/core/fusion.js','js/core/ai.js','js/core/progress.js','js/core/game.js',
    'js/render2d/art.js','assets/embedded/icones-itens.js','js/render2d/icones_itens.js',
    'assets/embedded/icones-extras.js','js/render2d/icones_extras.js',
    'js/ui/icones_ui.js','js/ui/hud.js'];
  for (var i=0;i<arqs.length;i++) document.write('<scr'+'ipt src="../'+arqs[i]+window.__V+'"></scr'+'ipt>');
</script>
<script>
(function () {
  'use strict';
  var Q = {};
  location.search.replace(/[?&]([^=&]+)=([^&]*)/g, function (_, k, v) { Q[k] = decodeURIComponent(v); });

  var log = document.getElementById('log');
  var falhas = 0, total = 0;
  function check(nome, ok, extra) {
    total++;
    if (!ok) falhas++;
    var d = document.createElement('div');
    d.style.color = ok ? '#8fc79b' : '#f88';
    d.textContent = (ok ? 'PASSOU · ' : 'FALHOU · ') + nome + (extra ? ' — ' + extra : '');
    log.appendChild(d);
  }
  var erros = [];
  window.addEventListener('error', function (e) {
    erros.push(e.message + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno);
  });
  window.addEventListener('unhandledrejection', function (e) {
    erros.push('promessa: ' + ((e.reason && e.reason.message) || e.reason));
  });
  function qa(s, raiz) { return [].slice.call((raiz || document).querySelectorAll(s)); }
  function q1(s, raiz) { return (raiz || document).querySelector(s); }
  function espera(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function ate(cond, ms) {
    var t0 = 0;
    return new Promise(function (r) {
      (function olha() {
        var ok = false;
        try { ok = !!cond(); } catch (e) {}
        if (ok || t0 >= (ms || 4000)) { r(ok); return; }
        t0 += 40;
        setTimeout(olha, 40);
      })();
    });
  }
  function ficha() { return q1('#ui-root .ui-sheet.is-on .sheet-panel'); }
  function txt(n) { return n ? n.textContent.replace(/\s+/g, ' ').trim() : ''; }
  function textos(bs) { return bs.map(function (b) { return b.textContent; }); }
  function mesmo(a, b) { return JSON.stringify(a) === JSON.stringify(b); }
  function toca(sel, raiz) { var b = typeof sel === 'string' ? q1(sel, raiz || ficha()) : sel; if (b) b.click(); return !!b; }
  function botaoTexto(re, raiz) {
    return qa('button', raiz || ficha()).filter(function (b) { return re.test(txt(b)); })[0] || null;
  }
  function toastTxt() { var t = q1('.ui-toast'); return t ? txt(t) : ''; }
  function limpaToast() { var t = q1('.ui-toast'); if (t) { t.innerHTML = ''; t.className = 'ui-toast'; } }
  function linhas() { return qa('.mc-lista .mc-linha', ficha()); }
  // 08/10 à noite (o mercadinho limpo): os filtros são SELETORES — escolher um valor dispara o change
  function escolhe(sel, valor, raiz) {
    var x = q1(sel, raiz || ficha());
    if (!x) return false;
    x.value = valor;
    x.dispatchEvent(new Event('change', { bubbles: true }));
    return true;
  }
  function valorDe(sel) { var x = q1(sel, ficha()); return x ? x.value : null; }
  function textosOp(sel) { var x = q1(sel, ficha()); return x ? qa('option', x).map(function (o) { return o.textContent; }) : []; }
  function cels() { return qa('.mc-cel', ficha()); }
  function linhasPedra() { return qa('.mc-lista .mc-linha.mc-pedra', ficha()); }
  function linhaDa(sid) { return q1('.mc-linha.mc-pedra[data-pedra="' + sid + '"]', ficha()); }
  function lotesDe(linha) { return qa('.mc-lote', linha); }
  function loteAceso(linha) { var b = q1('.mc-lote.is-on', linha); return b ? b.getAttribute('data-lote') : null; }
  function fim() {
    check('nenhum erro na página', erros.length === 0, erros.slice(0, 4).join(' | '));
    var sb = JOGO.SaveSandbox && JOGO.SaveSandbox.check();
    check('o save de verdade continua intocado', !!sb && sb.ok, sb ? JSON.stringify(sb.disco).slice(0, 120) : 'sem sandbox');
    var sum = document.getElementById('summary');
    sum.className = falhas ? 'fail' : 'allpass';
    sum.textContent = falhas ? ('FALHOU — ' + falhas + ' de ' + total) : ('tudo passou (' + total + ')');
    window.__fail = falhas;
    window.__done = true;
    window.__pronto = true;
  }

  // o contrato de TODO botão redondo da ficha aberta (o mesmo da prova_icones_menus)
  function contratoDosBotoes(onde) {
    var bs = qa('.btn-ico', ficha());
    var ruins = [];
    bs.forEach(function (b) {
      var r = b.getBoundingClientRect();
      if (r.width < 2) return;
      var rot = b.getAttribute('data-rot');
      if (r.width < 44 || r.height < 44) ruins.push(rot + ' ' + Math.round(r.width) + '×' + Math.round(r.height));
      if (b.textContent !== rot) ruins.push(rot + ' textContent="' + b.textContent + '"');
      var contaA = b.getAttribute('data-conta');
      if (b.getAttribute('aria-label') !== (contaA ? rot + ' (' + contaA + ')' : rot)) ruins.push(rot + ' sem aria-label');
      if (!b.querySelector('svg.ico-svg') || !b.querySelector('.rot-oculto')) ruins.push(rot + ' sem svg/rot-oculto');
    });
    check(onde + ': ' + bs.length + ' botões redondos no contrato (>= 44 px, nome escondido = data-rot = aria-label)',
          ruins.length === 0, ruins.slice(0, 5).join(' | '));     // 08/10 à noite: sem botão redondo também passa (os filtros são seletores)
  }
  // nada vaza da ficha (a coluna de 390 px da prova)
  function cabe(onde) {
    var f = ficha(), fora = [];
    if (f) {
      var lim = f.getBoundingClientRect();
      qa('*', f).forEach(function (n) {
        var r = n.getBoundingClientRect();
        if (!r.width) return;
        if (r.right > lim.right + 1.5 || r.left < lim.left - 1.5) {
          var p = n.parentNode, rola = false;
          while (p && p !== f) {
            var ov = getComputedStyle(p).overflowX;
            if (ov === 'auto' || ov === 'scroll') { rola = true; break; }
            p = p.parentNode;
          }
          if (!rola) fora.push(String(n.className && n.className.baseVal !== undefined ? n.className.baseVal : n.className || n.tagName));
        }
      });
    }
    check(onde + ': nada vaza da coluna de 390 px', !!f && fora.length === 0, fora.slice(0, 4).join(' | '));
  }

  var D = JOGO.DATA, P = JOGO.Progress, UI = JOGO.UI, DB = JOGO.DB, Mc = JOGO.Mercado;
  function pedraNome(sid) { return (D.stones[sid] || {}).name || sid; }

  // ------------------------------------------------------------ a semente
  var SACO = ['gh-wasp-sting', 'gh-moss-treads', 'gh-chitin-vest'];
  // a Rocha-Mãe fica em ZERO: não pode aparecer em Vender › Pedras
  var ESTOQUE = { 'stone-ember': 60, 'stone-tear': 7, 'stone-breath': 12, 'stone-slate': 3, 'stone-anchor': 2 };
  var hid;
  function semeia() {
    P.load(); P.reset();
    hid = P.heroIds()[0];
    SACO.forEach(function (id) {
      P.state.inventory.push(P.novaCopia ? P.novaCopia(id, 'prova', 0, 0) : { itemId: id, level: 0, stars: 0 });
    });
    P.save();
    Object.keys(ESTOQUE).forEach(function (k) { P.addStones(k, ESTOQUE[k]); });
    UI.init();
    UI.selection([hid]);
    return DB._zerar().then(function () {
      return DB.batizar('Provador');
    }).then(function () {
      return DB.ganharMoedas(500);
    }).then(function () {
      // o balcão local: uma peça de outro vendedor e um lote de outro vendedor
      return DB.mercadoGravar({ dia: null, ofertas: [
        { id: 'pv-peca', vendedor: 'c1', vendedorNome: 'Fulano', itemId: 'gh-wasp-sting', level: 1, stars: 0, preco: 60 },
        { id: 'pv-lote', vendedor: 'outra-conta', vendedorNome: 'Beltrano', tipo: 'pedra', stoneId: 'stone-tear', qtd: 10, preco: 40 }
      ] });
    });
  }
  // o saco CHEIO de mentira: comprar e retirar lote não podem olhar o saco
  var bagFreeAntes = null;
  function sacoCheio(sim) {
    if (sim) { bagFreeAntes = P.bagFree; P.bagFree = function () { return false; }; }
    else if (bagFreeAntes) { P.bagFree = bagFreeAntes; bagFreeAntes = null; }
  }

  // ---- o balcão entre contas de mentira: a Autoridade diz "ligada" e o servidor anota
  var chamadas = [];
  function chamou(nome) { return chamadas.filter(function (c) { return c[0] === nome; }); }
  function ultima(nome) { var l = chamou(nome); return l.length ? l[l.length - 1] : null; }
  function copia(o) { return Promise.resolve(JSON.parse(JSON.stringify(o))); }
  var RESUMO = { ok: true, taxaPct: 5, precoMax: 9999, lotesPedra: [1, 10, 50, 100],
    itens: [{ itemId: 'gh-wasp-sting', qtd: 2, menor: 80, meus: 0 }, { itemId: 'gh-moss-treads', qtd: 1, menor: 30, meus: 1 },
            // a pedra que escapasse para `itens` (servidor velho) NÃO entra em Equipamentos
            { itemId: 'stone-ember', qtd: 2, menor: 50, meus: 0 }],
    pedras: [{ stoneId: 'stone-ember', lotes: 2, pedras: 60, menor: 50, menorUnit: 5, meus: 0 },
             { stoneId: 'stone-tear', lotes: 1, pedras: 10, menor: 30, menorUnit: 3, meus: 1 },
             { stoneId: 'stone-anchor', lotes: 1, pedras: 1, menor: 200, menorUnit: 200, meus: 0 }] };
  var LOTES_EMBER = { ok: true, itemId: 'stone-ember', anuncios: [
    { id: 902, tipo: 'pedra', qtd: 10, unit: 5, vendedor: 'Beltrano', level: 0, stars: 0, preco: 50, meu: false, minhaProposta: null },
    { id: 901, tipo: 'pedra', qtd: 50, unit: 5, vendedor: 'Fulano', level: 0, stars: 0, preco: 250, meu: false, minhaProposta: null }] };
  var MEUS = { ok: true, max: 30,
    anuncios: [{ id: 950, tipo: 'pedra', qtd: 50, itemId: 'stone-ember', level: 0, stars: 0, preco: 250, taxa: 13, criadoEm: 1,
                 propostas: [{ id: 61, comprador: 'Ciclano', valor: 200, estado: 'aberta', taxa: 10, vistoVendedor: true, criadoEm: 1 }] },
               { id: 951, tipo: 'peca', qtd: 1, itemId: 'gh-moss-treads', level: 0, stars: 0, preco: 30, taxa: 2, criadoEm: 1, propostas: [] }],
    vendas: [{ id: 940, tipo: 'pedra', qtd: 10, itemId: 'stone-tear', level: 0, stars: 0, preco: 30, valor: 30, taxa: 2, recebeu: 28,
               comprador: 'Beltrano', viaProposta: false, fechadoEm: 1 }] };
  var PROPOSTAS = { ok: true, propostas: [
    { id: 71, anuncioId: 901, tipo: 'pedra', qtd: 50, itemId: 'stone-ember', level: 0, stars: 0, preco: 250, valor: 200,
      estado: 'aceita', vendedor: 'Fulano', anuncioAberto: true, criadoEm: 1 }] };
  var SRV_ANTES = {};
  function ligaSrv() {
    var S = Mc.servidor;
    ['resumo', 'item', 'meus', 'propostas', 'anunciarPedras', 'anunciar', 'comprar', 'retirar', 'propor', 'cancelar',
     'responder', 'confirmar', 'visto', 'respondeuConfirmacao'].forEach(function (k) { SRV_ANTES[k] = S[k]; });
    JOGO.Autoridade = { ligada: function () { return true; }, op: function () {} };
    S.resumo = function () { chamadas.push(['resumo']); return copia(RESUMO); };
    S.item = function (id) {
      chamadas.push(['item', id]);
      return copia(id === 'stone-ember' ? LOTES_EMBER : { ok: true, itemId: id, anuncios: [] });
    };
    S.meus = function () { chamadas.push(['meus']); return copia(MEUS); };
    S.propostas = function () { chamadas.push(['propostas']); return copia(PROPOSTAS); };
    S.anunciarPedras = function (sid, qtd, preco) {
      chamadas.push(['anunciarPedras', sid, qtd, preco]);
      return copia({ ok: true, anuncio: { id: 990, tipo: 'pedra', itemId: sid, stoneId: sid, qtd: qtd, preco: preco, taxa: Mc.taxaDe(preco) } });
    };
    S.anunciar = function () { chamadas.push(['anunciar']); return copia({ ok: true }); };
    S.comprar = function (id) {
      chamadas.push(['comprar', id]);
      return copia({ ok: true, comprou: true, valor: 50, preco: 50, deCarteira: 50, deBanco: 0, tipo: 'pedra', qtd: 10,
                     pedras: { stoneId: 'stone-ember', qtd: 10 } });
    };
    S.retirar = function (id) {
      chamadas.push(['retirar', id]);
      return copia({ ok: true, tipo: 'pedra', pedras: { stoneId: 'stone-ember', qtd: 50 } });
    };
    S.propor = function (id, v) { chamadas.push(['propor', id, v]); return copia({ ok: true, proposta: { id: 80, valor: v } }); };
    S.cancelar = function (id) { chamadas.push(['cancelar', id]); return copia({ ok: true }); };
    S.responder = function (id, sim) { chamadas.push(['responder', id, sim]); return copia({ ok: true }); };
    S.confirmar = function (id, sim) { chamadas.push(['confirmar', id, sim]); return copia({ ok: true, valor: 200, deBanco: 0 }); };
    S.visto = function (m) { chamadas.push(['visto', m]); return copia({ ok: true }); };
    S.respondeuConfirmacao = function (p, desfecho) { chamadas.push(['respondeuConfirmacao', p && p.id, desfecho]); };
  }
  function desligaSrv() {
    for (var k in SRV_ANTES) Mc.servidor[k] = SRV_ANTES[k];
    delete JOGO.Autoridade;
  }

  // ------------------------------------------------------------ o modo FOTO
  function foto() {
    if (Q.srv) ligaSrv();
    if (Q.foto === 'confirma') {                            // a confirmação da proposta pelo lote
      ligaSrv();
      UI.openSheet('mercadoConfirma', JSON.parse(JSON.stringify(PROPOSTAS.propostas[0])));
      window.__pronto = true;
      return Promise.resolve();
    }
    var aba = Q.foto === 'lotes' ? 'comprar' : Q.foto;
    // Meus anúncios do balcão local: um lote de verdade anunciado antes da foto
    var antes = (Q.foto === 'meus' && !Q.srv) ? Mc.anunciarPedras('stone-ember', 50, 240) : Promise.resolve();
    return antes.then(function () {
      UI.openSheet('mercado');
      return espera(400);
    }).then(function () {
      toca('.mc-abas [data-aba="' + aba + '"]');
      return espera(400);
    }).then(function () {
      if (aba !== 'meus') escolhe('.mc-sel-cat', 'pedras');
      return espera(400);
    }).then(function () {
      if (Q.foto === 'lotes') {
        var l = linhaDa('stone-ember');
        toca(l ? botaoTexto(/^Ver lotes$/, l) : null);
      }
      if (Q.foto === 'vender') {
        // um lote escolhido e um preço digitado, para a conta aparecer inteira
        var le = linhaDa('stone-ember');
        if (le) {
          toca('.mc-lote[data-lote="10"]', le);
          var c = q1('.mc-lote-preco', le);
          c.value = '48'; c.dispatchEvent(new Event('input'));
        }
      }
      return espera(400);
    }).then(function () {
      document.getElementById('summary').textContent = 'foto: ' + Q.foto + ' · ' + erros.length + ' erro(s) ' + erros.join(' | ');
      window.__pronto = true;
    });
  }

  // ------------------------------------------------------------ a PROVA
  function prova() {
    var passos = [];
    function p(fn) { passos.push(fn); }

    // ---- 1) LOCAL · Comprar em Equipamentos: a categoria em cima, o espaço segue sendo a primeira .mc-filtros
    p(function () {
      UI.openSheet('mercado');
      return ate(function () { return !!q1('.mc-sel-cat', ficha()) && linhas().length > 0; }).then(function (ok) {
        // 08/10 à noite (o mercadinho limpo): a categoria é um SELETOR (Equipamentos | Pedras), e os filtros também
        check('local · Comprar: o seletor de categoria (Equipamentos | Pedras) aberto em Equipamentos',
              ok && mesmo(textosOp('.mc-sel-cat'), ['Equipamentos', 'Pedras']) && valorDe('.mc-sel-cat') === 'equip', textosOp('.mc-sel-cat').join(','));
        var sels = qa('.mc-barra select', ficha()).map(function (x) { return x.getAttribute('data-filtro'); });
        check('local · a barra: categoria, espaço (com Punho), raridade e ordem',
              mesmo(sels, ['cat', 'slot', 'rar', 'ordem']) && textosOp('.inv2-sel-espaco').indexOf('Punho') >= 0, sels.join(','));
        check('local · a categoria vem antes da busca, e a busca é o primeiro campo da ficha',
              !!(q1('.mc-sel-cat', ficha()).compareDocumentPosition(q1('input.hub-input', ficha())) & Node.DOCUMENT_POSITION_FOLLOWING) &&
              q1('input', ficha()) === q1('input.hub-input', ficha()));
        check('local · Equipamentos mostra a peça e NÃO o lote de pedra', linhas().length === 1 && linhasPedra().length === 0 &&
              ficha().textContent.indexOf(pedraNome('stone-tear')) < 0, linhas().length + ' linhas');
        check('local · a pílula de Comprar conta tudo do balcão dos outros (peça + lote)',
              q1('.mc-abas [data-aba="comprar"]', ficha()).getAttribute('data-conta') === '2');
        contratoDosBotoes('local · Comprar · Equipamentos');
      });
    });

    // ---- 2) LOCAL · Comprar › Pedras: o lote do outro vendedor, o elemento e a busca
    p(function () {
      escolhe('.mc-sel-cat', 'pedras');
      return ate(function () { return valorDe('.mc-sel-cat') === 'pedras'; }).then(function (ok) {
        check('local · Pedras: sem espaço nem raridade; só o seletor do elemento (Todos · Fogo · Água · Terra · Ar · Neutro)',
              ok && !q1('[data-filtro="slot"]', ficha()) && !q1('[data-filtro="rar"]', ficha()) && !!q1('[data-filtro="el"]', ficha()) &&
              mesmo(textosOp('.inv2-sel-elem'), ['Todos os elementos', 'Fogo', 'Água', 'Terra', 'Ar', 'Neutro']),
              textosOp('.inv2-sel-elem').join(','));
        check('local · Pedras: a busca diz que procura pedra', q1('input.hub-input', ficha()).placeholder === 'buscar pedra por nome...');
        var l = linhaDa('stone-tear');

        check('entre contas · Minhas ofertas: o lote com quem vende e o preço pedido',
              ok && /Lote de 50 × Brasa Coagulada/.test(txt(l)) && /de Fulano · à venda por 250v/.test(txt(l)) &&
              /aceita — confirme/.test(txt(l)), txt(l));
        cabe('entre contas · Minhas ofertas');
        toca(botaoTexto(/^Conferir$/, l));
        return ate(function () { return /Proposta aceita no Mercadinho/.test(txt(q1('h2', ficha()))); });
      }).then(function (ok) {
        var t = txt(ficha());
        var card = q1('.mc-card', ficha());
        check('entre contas · a confirmação: "pelo lote que estava à venda por 250" e o cartão do lote',
              ok && t.indexOf('O vendedor Fulano aceitou sua oferta de 200 vinténs pelo lote que estava à venda por 250.') >= 0 &&
              !!card && card.classList.contains('mc-pedra') && /Lote de 50 × Brasa Coagulada/.test(txt(card)) &&
              /4v a pedra/.test(txt(card)), t.slice(0, 200));
        limpaToast();
        toca(botaoTexto(/^Aceitar$/, q1('.confirm-acts', ficha())));
        return ate(function () { return /Negócio fechado/.test(toastTxt()); });
      }).then(function (ok) {
        var c = ultima('confirmar');
        check('entre contas · Aceitar confirma(71) e o toast diz o lote',
              ok && c && c[1] === 71 && c[2] === true && toastTxt() === 'Negócio fechado: lote de 50 × Brasa Coagulada por 200 vinténs.',
              toastTxt());
      });
    });

    // ---- 12) ENTRE CONTAS · de volta a Equipamentos: tudo como antes
    p(function () {
      UI.closeSheet();
      UI.openSheet('mercado');
      toca('.mc-abas [data-aba="comprar"]');
      return ate(function () { return !!q1('.mc-sel-cat', ficha()) && cels().length > 0; }).then(function () {
        escolhe('.mc-sel-cat', 'equip');
        check('entre contas · de volta a Equipamentos: os seletores de espaço e raridade, a grade com as duas peças, sem pedra',
              !!q1('[data-filtro="slot"]', ficha()) && !!q1('[data-filtro="rar"]', ficha()) &&
              linhasPedra().length === 0 && cels().length === 2);
        desligaSrv();
        UI.closeSheet();
      });
    });

    // ---- 13) o toque na pedra do inventário conta que ela vende no Mercadinho
    p(function () {
      UI.openSheet('inventory');
      toca('.inv-tabs-main [data-cat="pedras"]');
      var cel = qa('.ig-cell.is-pedra', ficha())[0];
      limpaToast();
      toca(cel);
      // 08/10 à noite (o inventário limpo): a pedra abre na FICHA de baixo, e é ela que lembra do Mercadinho
      var fichaPedra = q1('.inv2-ficha-outro', ficha());
      check('inventário · o toque na pedra abre a ficha, que lembra que ela vende em lotes no Mercadinho',
            !!fichaPedra && /Mercadinho vende avulsa ou em lotes de 10, 50 e 100/.test(fichaPedra.textContent), fichaPedra ? fichaPedra.textContent.slice(0, 120) : 'sem ficha');
      toca('.inv-tabs-main [data-cat="equip"]');
      UI.closeSheet();
    });

    return passos.reduce(function (pr, fn) {
      return pr.then(function () {
        return fn();
      }).catch(function (e) {
        check('passo sem exceção', false, (e && e.message) + ' ' + ((e && e.stack) || '').split('\n')[1]);
      });
    }, Promise.resolve());
  }

  try {
    semeia().then(function () {
      return Q.foto ? foto() : prova().then(fim);
    }).catch(function (e) {
      check('a semente e as fichas sem exceção', false, e && e.message);
      fim();
    });
  } catch (e) {
    check('a página montou', false, e.message);
    fim();
  }
})();
</script>
</body>
</html>
