<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>SOTERRA — a loja 2 no site (pacotes, volta do pagamento, avatar)</title>
<style>body{margin:0;background:#0f1216;color:#e8eef6;font:12px monospace;padding:10px}
#summary{padding:6px 10px;border-radius:6px;margin-bottom:8px}
.allpass{background:#16241b;color:#7fe08a} .fail{background:#3d1414;color:#f77}
#palco{position:absolute;left:-4000px;top:0;width:1000px;height:900px}</style>
</head>
<body>
<!-- A PROVA DA LOJA 2 NO SITE (10/09), sem servidor nenhum, no molde de
     tests/site_fase_c.html: as páginas de verdade (site/loja.html e
     site/conta.html, com site.js, loja.js e conta.js) são escritas num iframe
     com um window.fetch FALSO, que responde os JSON do contrato da loja 2
     (seções 4.1, 4.2, 4.8 e 4.9 do plano) e anota cada pedido. O que se cobra:
       - os pacotes de vinténs: "em breve" com os pagamentos desligados, e aí
         NENHUM pedido a /api/pagamento/*; ligados, a confirmação, o POST
         {pacote, idem} (16 hex, uma chave nova a cada clique, a mesma só depois
         de um clique sem resposta) e a ida ao endereço do Mercado Pago (o
         LOJA.vai, o location.assign da página, trocado por um dublê); um
         endereço estranho NÃO navega; SITE.ehMercadoPago;
       - a volta do Mercado Pago (?pagamento=17&volta=…&payment_id=…): um
         POST /api/pagamento/conferir {id:17} e nada do que o Mercado Pago
         pendurou na URL vai ao servidor; a URL fica limpa; a faixa diz o
         estado; aberto ou em análise, a CONFERÊNCIA de novo a cada 10 s, até 6
         vezes, e o botão "conferir" em "Seus pacotes" (conserto 11/09);
       - o saldo com "A caminho"; sem save, a compra liberada pelo crédito a
         caminho; os pedidos de pacote e de presente sem "cancelar"; as seções
         na ordem do servidor; `limite: null` sem texto de limite;
       - o avatar na conta: a grade com as opções do servidor, o clique grava
         (POST /api/avatar), o 409 mostra a frase, o Mestre só vê o Cavaleiro;
       - o menu cabe no celular (390 px), com o link "Mestre" na conta gm;
       - nenhum fetch com e-mail na URL; nenhum preço (vinténs ou reais) no
         HTML ou no JS do site.
     A sessão do localStorage (a mesma chave do jogo) volta ao que era. -->
<div id="summary">rodando…</div>
<div id="log"></div>
<div id="palco"></div>
<script src="../site/site.js"></script>
<script>
(function () {
  'use strict';
  var log = document.getElementById('log'), palco = document.getElementById('palco');
  var falhas = 0, total = 0;
  function check(nome, ok, extra) {
    total++;
    if (!ok) falhas++;
    var d = document.createElement('div');
    d.style.color = ok ? '#8fc79b' : '#f88';
    d.textContent = (ok ? 'PASSOU · ' : 'FALHOU · ') + nome + (!ok && extra ? ' — ' + extra : '');
    log.appendChild(d);
  }
  function fecha() {
    var sum = document.getElementById('summary');
    sum.className = falhas ? 'fail' : 'allpass';
    sum.textContent = falhas ? ('FALHOU — ' + falhas + ' de ' + total) : ('tudo passou (' + total + ')');
    window.__done = true; window.__fail = falhas;
  }
  function espera(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function ate(cond, ms) {
    ms = ms || 3000;
    return new Promise(function (r) {
      var t = 0;
      (function volta() {
        var ok = false;
        try { ok = !!cond(); } catch (e) { ok = false; }
        if (ok) return r(true);
        if ((t += 20) > ms) return r(false);
        setTimeout(volta, 20);
      })();
    });
  }

  var AGORA = Math.floor(Date.now() / 1000), DIA = 86400, HORA = 3600;
  var BASE_SITE = new URL('../site/', location.href).href;
  var CHAVE = 'soterra-sessao';
  var sessaoAntes = null;
  try { sessaoAntes = localStorage.getItem(CHAVE); } catch (e) { /* sem storage */ }
  function lsSessao() { try { return JSON.parse(localStorage.getItem(CHAVE) || 'null'); } catch (e) { return 'erro'; } }
  function copia(o) { return JSON.parse(JSON.stringify(o)); }
  function junta(a, b) { var r = copia(a); Object.keys(b || {}).forEach(function (k) { r[k] = b[k]; }); return r; }

  /* valores sintéticos desta prova (nenhum é de ninguém) */
  var EMAIL = 'pia@exemplo.com';
  var SESSAO = { token: 'tok-pia', conta: { id: 8, nome: 'Pia', gm: false } };
  var SESSAO_MESTRE = { token: 'tok-mestre', conta: { id: 1, nome: 'Dono', gm: true } };
  var MP_URL = 'https://www.mercadopago.com.br/checkout/v1/redirect?pref_id=123456-abc';
  var MP_PARAMS = ['99887766', 'pref-abc-123', 'sot-17-9f2c0000aaaa1111', 'approved', 'payment_id', 'collection', 'merchant_order'];
  var SAUDE = [200, { ok: true, contas: 3, agora: AGORA, correio: false }];

  /* ---- o catálogo da loja 2 (a tabela da seção 3 do plano) ---- */
  function catalogo2(ligado) {
    function classe(id, nome, rar, cartas, preco) {
      return { sku: 'classe-' + id, secao: 'personagens', tipo: 'classe', alvo: id, qtd: 1, nome: nome, raridade: rar, cartas: cartas,
               descricao: 'Libera o ' + nome + ' na hora. Chega no nível 1.', preco: preco, limite: { grupo: 'classe-' + id, max: 1, dias: null } };
    }
    function bonus(dias, preco) {
      return { sku: 'bonus-xp-' + dias, secao: 'bonus', tipo: 'bonus-xp', alvo: 'xp', qtd: dias, dias: dias,
               nome: 'Bônus de XP — ' + dias + (dias === 1 ? ' dia' : ' dias'),
               descricao: '+50% de experiência para o grupo por ' + dias + ' dia(s), contados no relógio do servidor a partir da entrega no jogo.',
               preco: preco, limite: null };
    }
    function pedra(el, alvo, nome, qtd, preco) {
      return { sku: 'pedras-' + el + (qtd === 50 ? '-50' : ''), secao: 'pedras', tipo: 'pedras', alvo: alvo, qtd: qtd, elemento: el,
               nome: qtd + ' ' + nome, descricao: 'Pedras de forja.', preco: preco, limite: null };
    }
    var itens = [
      classe('invocador', 'Xamã', 'raro', 10, 10000), classe('bruxo', 'Bruxo', 'raro', 10, 10000),
      classe('espadachim', 'Ladino', 'epico', 20, 20000), classe('arqueiro', 'Caçador', 'epico', 25, 25000),
      classe('minotauro', 'Minotauro', 'epico', 30, 30000),
      bonus(1, 1500), bonus(3, 3900), bonus(7, 7900)
    ];
    [['agua', 'stone-tear', 'Lágrimas de Cisterna', 500, 2250], ['terra', 'stone-root', 'Grãos de Rocha-Mãe', 500, 2250],
     ['ar', 'stone-breath', 'Sopros Engarrafados', 800, 3600], ['fogo', 'stone-ember', 'Brasas Coaguladas', 800, 3600],
     ['neutro', 'stone-slate', 'Lascas da Lousa', 800, 3600]].forEach(function (p) { itens.push(pedra(p[0], p[1], p[2], 10, p[3])); });
    [['agua', 'stone-tear', 'Lágrimas de Cisterna', 500, 2250], ['terra', 'stone-root', 'Grãos de Rocha-Mãe', 500, 2250],
     ['ar', 'stone-breath', 'Sopros Engarrafados', 800, 3600], ['fogo', 'stone-ember', 'Brasas Coaguladas', 800, 3600],
     ['neutro', 'stone-slate', 'Lascas da Lousa', 800, 3600]].forEach(function (p) { itens.push(pedra(p[0], p[1], p[2], 50, p[4])); });
    itens.push({ sku: 'insignia-1', secao: 'guilda', tipo: 'insignias', alvo: 'fundacao', qtd: 1, nome: '1 Insígnia de Fundação',
                 descricao: 'Uma Insígnia de Fundação, a que só os chefes derrubam. Dez fundam uma guilda.', preco: 500, limite: null });
    itens.push({ sku: 'insignias-10', secao: 'guilda', tipo: 'insignias', alvo: 'fundacao', qtd: 10, nome: '10 Insígnias de Fundação',
                 descricao: 'Dez Insígnias de Fundação: o bastante para fundar uma guilda.', preco: 4500, limite: null });
    itens.push({ sku: 'pergaminho-elemento', secao: 'pergaminhos', tipo: 'pergaminho', alvo: 'elemento', qtd: 1, nome: 'Pergaminho da Reescrita',
                 descricao: 'Troca um caminho elemental de um herói por outro.', preco: 5000, limite: { grupo: 'pergaminho-elemento', max: 1, dias: 30 } });
    return { ok: true, versao: 2, itens: itens, pacotes: PACOTES, pagamento: { ligado: !!ligado, teste: false } };
  }
  var PACOTES = [
    { id: 'pacote-1000', nome: 'Bolsa de 1.000 vinténs', vintens: 1000, centavos: 490, preco: 'R$ 4,90' },
    { id: 'pacote-5500', nome: 'Saco de 5.500 vinténs', vintens: 5500, centavos: 1990, preco: 'R$ 19,90' },
    { id: 'pacote-12000', nome: 'Arca de 12.000 vinténs', vintens: 12000, centavos: 3990, preco: 'R$ 39,90' },
    { id: 'pacote-25000', nome: 'Tesouro de 25.000 vinténs', vintens: 25000, centavos: 7990, preco: 'R$ 79,90' }
  ];
  var NITENS = catalogo2(false).itens.length;
  function minha2(extra) {
    return junta({
      ok: true,
      saldo: { carteira: 12450, aCaminho: 0, reservado: 300, disponivel: 12150, semFundo: false, saveVersao: 57, saveEm: AGORA - 3 * HORA },
      limites: {
        'pergaminho-elemento': { usados: 0, max: 1, dias: 30, liberaEm: null },
        'classe-invocador': { usados: 0, max: 1, dias: null, liberaEm: null }, 'classe-bruxo': { usados: 0, max: 1, dias: null, liberaEm: null },
        'classe-espadachim': { usados: 0, max: 1, dias: null, liberaEm: null }, 'classe-arqueiro': { usados: 0, max: 1, dias: null, liberaEm: null },
        'classe-minotauro': { usados: 0, max: 1, dias: null, liberaEm: null }
      },
      classes: { invocador: { liberada: false, cartas: 6 }, bruxo: { liberada: false, cartas: 2 }, espadachim: { liberada: false, cartas: 0 },
                 arqueiro: { liberada: false, cartas: 0 }, minotauro: { liberada: false, cartas: 3 } },
      pedidos: []
    }, extra);
  }
  function pag(id, estado, extra) {
    return junta({ id: id, pacote: 'pacote-5500', nome: 'Saco de 5.500 vinténs', vintens: 5500, centavos: 1990, preco: 'R$ 19,90',
                   estado: estado, creditado: estado === 'aprovado', pedido: estado === 'aprovado' ? { id: 90, estado: 'pendente' } : null,
                   criadoEm: AGORA - 600, atualizadoEm: AGORA - 60 }, extra);
  }

  /* ---- o palco: a página real num iframe, com o fetch falso ---- */
  var TODOS = [];
  function le(url) {
    return new Promise(function (ok) {
      var x = new XMLHttpRequest();
      x.open('GET', url + (url.indexOf('?') < 0 ? '?v=' : '&v=') + Date.now());
      x.onload = function () { ok((x.status === 200 || x.status === 0) && x.responseText ? x.responseText : null); };
      x.onerror = function () { ok(null); };
      try { x.send(); } catch (e) { ok(null); }
    });
  }
  function fetchFalso(pagina, cena) {
    return function (url, op) {
      op = op || {};
      var u = String(url), m = /\/api\/[^?#]*/.exec(u), corpo = null;
      try { corpo = op.body ? JSON.parse(op.body) : null; } catch (e) { corpo = op.body; }
      var reg = { pagina: pagina, url: u, metodo: op.method || 'GET', rota: m ? m[0] : u, corpo: corpo, bruto: op.body || '',
                  auth: (op.headers && op.headers.Authorization) || null };
      TODOS.push(reg);
      cena.pedidos.push(reg);
      var h = cena.rotas[reg.metodo + ' ' + reg.rota];
      var resp = typeof h === 'function' ? h(corpo || {}, reg) : h;
      if (resp === 'fora') return Promise.reject(new TypeError('Failed to fetch'));
      if (!resp) resp = [404, { ok: false, erro: 'rota desconhecida' }];
      var status = resp[0], json = copia(resp[1]);
      return new Promise(function (ok) {
        setTimeout(function () {
          ok({ status: status, ok: status >= 200 && status < 300, json: function () { return Promise.resolve(json); } });
        }, 4);
      });
    };
  }
  function canalFalso(cena) {
    function Canal(nome) { this.nome = String(nome); }
    Canal.prototype.postMessage = function (msg) { cena.canal.push({ nome: this.nome, msg: copia(msg) }); };
    Canal.prototype.close = function () {};
    Canal.prototype.addEventListener = function () {};
    return Canal;
  }
  function abre(pagina, cena) {
    cena.pedidos = [];
    cena.canal = [];
    return le(BASE_SITE + pagina).then(function (html) {
      if (!html) throw new Error('não deu para ler site/' + pagina);
      palco.innerHTML = '';
      var fr = document.createElement('iframe');
      fr.style.width = (cena.largura || 1000) + 'px';
      fr.style.height = '900px';
      fr.style.border = '0';
      palco.appendChild(fr);
      try {
        if (cena.sessao) localStorage.setItem(CHAVE, JSON.stringify(cena.sessao));
        else localStorage.removeItem(CHAVE);
      } catch (e) { /* sem storage */ }
      var d = fr.contentDocument;
      d.open();
      var w = fr.contentWindow;
      w.fetch = fetchFalso(pagina, cena);
      w.BroadcastChannel = canalFalso(cena);
      try {
        w.history.replaceState(null, '', w.location.href.split('#')[0].split('?')[0] + (cena.busca || '') + (cena.hash ? '#' + cena.hash : ''));
      } catch (e) { cena.semEndereco = String(e); }
      d.write(html.replace(/<head>/i, '<head><base href="' + BASE_SITE + '">'));
      d.close();
      return {
        w: w, d: d, fr: fr,
        $: function (id) { return d.getElementById(id); },
        q: function (s) { return d.querySelector(s); },
        qq: function (s) { return [].slice.call(d.querySelectorAll(s)); }
      };
    });
  }
  function visivel(el) {
    if (!el || !el.ownerDocument) return false;
    var w = el.ownerDocument.defaultView;
    for (var e = el; e && e.nodeType === 1; e = e.parentElement) {
      if (e.hidden) return false;
      var cs = w.getComputedStyle(e);
      if (cs.display === 'none' || cs.visibility === 'hidden') return false;
    }
    return true;
  }
  function texto(el) { return el ? el.textContent.replace(/\s+/g, ' ').trim() : ''; }
  function pedidos(cena, metodo, rota) { return cena.pedidos.filter(function (p) { return p.metodo === metodo && p.rota === rota; }); }
  function deRota(cena, prefixo) { return cena.pedidos.filter(function (p) { return p.rota.indexOf(prefixo) === 0; }); }
  /* o location.assign da loja é o LOJA.vai: a prova troca por um dublê que só anota */
  function segura(p, cena) {
    cena.navegou = [];
    return ate(function () { return p.w.LOJA && typeof p.w.LOJA.vai === 'function'; }).then(function (ok) {
      if (ok) p.w.LOJA.vai = function (u) { cena.navegou.push(String(u)); };
      return ok;
    });
  }
  function lojaDe(p) {
    return {
      bt: function (sku) { return p.q('.produto[data-sku="' + sku + '"] [data-comprar]'); },
      motivo: function (sku) { return texto(p.q('.produto[data-sku="' + sku + '"] .motivo')); },
      cartao: function (sku) { return p.q('.produto[data-sku="' + sku + '"]'); },
      linha: function (id) { return p.q('#lj-pedidos [data-pedido="' + id + '"]'); },
      pacote: function (id) { return p.q('.pacote[data-pacote-id="' + id + '"]'); },
      btPacote: function (id) { return p.q('button[data-pacote="' + id + '"]'); }
    };
  }
  async function confirmaModal(p, sim) {
    await ate(function () { return !!p.q('.modal'); });
    var m = texto(p.q('.modal'));
    var bt = p.q(sim ? '.modal [data-sim]' : '.modal [data-nao]');
    if (bt) bt.click();
    return m;
  }

  /* ======================================================================
   * SITE.ehMercadoPago, direto
   * ==================================================================== */
  function unidades() {
    var bons = ['https://www.mercadopago.com.br/checkout/v1/redirect?pref_id=1-2',
                'https://sandbox.mercadopago.com.br/checkout/v1/redirect?pref_id=1-2',
                'https://mercadopago.com.br/checkout', 'https://www.mercadopago.com/checkout', 'https://mercadopago.com.br'];
    var ruins = ['http://www.mercadopago.com.br/checkout', 'https://mercadopago.com.br.golpe.example/checkout',
                 'https://golpemercadopago.com.br/checkout', 'https://golpe.example/?u=https://www.mercadopago.com.br',
                 'https://www.mercadopago.com.br@golpe.example/', 'https://usuario@www.mercadopago.com.br/',
                 'https://www.mercadopago.com.br:8443/checkout', '//www.mercadopago.com.br/checkout', 'javascript:alert(1)',
                 'https://www.mercadopago.com.br.', 'https://www.mercadopago.com.ar/checkout', '', null, undefined, 42];
    check('SITE.ehMercadoPago: aceita https do Mercado Pago (www., sandbox., .com e .com.br)',
          typeof SITE.ehMercadoPago === 'function' && bons.every(function (u) { return SITE.ehMercadoPago(u) === true; }),
          bons.filter(function (u) { return !SITE.ehMercadoPago(u); }).join(' | '));
    check('SITE.ehMercadoPago: recusa http, host parecido, usuário, porta, sem esquema, javascript: e lixo',
          ruins.every(function (u) { return SITE.ehMercadoPago(u) === false; }),
          ruins.filter(function (u) { return SITE.ehMercadoPago(u) !== false; }).join(' | '));
  }

  /* ======================================================================
   * os pacotes de vinténs
   * ==================================================================== */
  async function cenaEmBreve() {
    var c = { sessao: SESSAO, rotas: {
      'GET /api/saude': SAUDE, 'GET /api/loja/catalogo': [200, catalogo2(false)],
      'GET /api/loja/minha': function () { return [200, minha2()]; }
    } };
    var p = await abre('loja.html', c), L = lojaDe(p);
    await ate(function () { return p.qq('.pacote').length === 4 && p.qq('[data-comprar]').length === NITENS; });
    check('em breve: a caixa dos 4 pacotes aparece, com o selo "em breve"', visivel(p.$('lj-pacotes')) && p.qq('.pacote').length === 4 &&
          !!p.q('#lj-pacotes [data-em-breve]') && /em breve/.test(texto(p.q('#lj-pacotes [data-em-breve]'))));
    var ok = PACOTES.every(function (pc) {
      var t = texto(L.pacote(pc.id));
      return t.indexOf(pc.nome) >= 0 && t.indexOf(SITE.num(pc.vintens) + ' vinténs') >= 0 && t.indexOf(pc.preco) >= 0;
    });
    check('em breve: cada pacote com o nome, os vinténs e o preço em reais do servidor', ok, texto(L.pacote('pacote-5500')));
    var bts = p.qq('#lj-pacotes button');
    check('em breve: os botões desligados, dizendo "em breve", e nenhum botão de comprar pacote',
          bts.length === 4 && bts.every(function (b) { return b.disabled && /em breve/.test(texto(b)); }) && !p.q('button[data-pacote]'));
    bts.forEach(function (b) { b.click(); });
    await espera(80);
    check('em breve: nenhum pedido a /api/pagamento/* (nem a lista, nem o pacote)', !deRota(c, '/api/pagamento/').length && !p.q('.modal'),
          deRota(c, '/api/pagamento/').map(function (x) { return x.metodo + ' ' + x.rota; }).join(', '));
    check('em breve: "Seus pacotes" fica escondido', p.$('lj-pagamentos-caixa').hidden);
    // as seções da loja 2, na ordem do servidor
    var secoes = p.qq('.loja-secao').map(function (s) { return s.getAttribute('data-secao'); });
    check('seções na ordem do servidor: personagens, bônus, pedras, guilda, pergaminhos',
          secoes.join() === 'personagens,bonus,pedras,guilda,pergaminhos', secoes.join());
    check('as ' + NITENS + ' ofertas do catálogo, cada uma com o preço do servidor',
          p.qq('.produto').length === NITENS && texto(L.cartao('bonus-xp-7').querySelector('.preco')) === '7.900 vinténs' &&
          texto(L.cartao('insignias-10').querySelector('.preco')) === '4.500 vinténs' &&
          texto(L.cartao('classe-invocador').querySelector('.preco')) === '10.000 vinténs');
    var bonus = p.q('.loja-secao[data-secao="bonus"]'), guilda = p.q('.loja-secao[data-secao="guilda"]');
    check('Bônus de XP: o título e a frase "Não soma com outro bônus de XP; comprar de novo soma os dias. O prazo corre a partir da entrega no jogo."',
          /Bônus de XP/.test(texto(bonus.querySelector('h3'))) &&
          texto(bonus.querySelector('.sub')) === 'Não soma com outro bônus de XP; comprar de novo soma os dias. O prazo corre a partir da entrega no jogo.');
    check('Guilda: "Dez Insígnias fundam uma guilda."', texto(guilda.querySelector('h3')) === 'Guilda' &&
          texto(guilda.querySelector('.sub')) === 'Dez Insígnias fundam uma guilda.');
    var semLimite = ['bonus-xp-1', 'bonus-xp-7', 'pedras-agua', 'pedras-fogo-50', 'insignia-1', 'insignias-10'];
    check('limite: null não escreve limite nenhum (bônus, pedras, insígnias)',
          semLimite.every(function (s) { return !L.cartao(s).querySelector('.limite'); }));
    check('a Reescrita mantém "1 a cada 30 dias." e as classes "Compra única."',
          /1 a cada 30 dias\./.test(texto(L.cartao('pergaminho-elemento'))) && /Compra única\./.test(texto(L.cartao('classe-bruxo'))));
    check('a arte do bônus diz os dias (7 dias) e a das insígnias a quantidade (×10)',
          texto(L.cartao('bonus-xp-7').querySelector('.arte-bonus .qtd')) === '7 dias' &&
          texto(L.cartao('bonus-xp-1').querySelector('.arte-bonus .qtd')) === '1 dia' &&
          texto(L.cartao('insignias-10').querySelector('.arte-insignia .qtd')) === '×10');
    check('com save e saldo: o bônus de 7 dias e as 10 insígnias ligados; o Ladino não (faltam 7.850)',
          !L.bt('bonus-xp-7').disabled && !L.bt('insignias-10').disabled && L.bt('classe-espadachim').disabled &&

  function mede(p) {
    var d = p.d, larg = d.documentElement.clientWidth, fora = [];
    [].forEach.call(d.querySelectorAll('body *'), function (el) {
      var r = el.getBoundingClientRect();
      if (!r.width || r.right <= larg + 1) return;
      for (var pai = el.parentElement; pai && pai !== d.body; pai = pai.parentElement) {
        var s = p.w.getComputedStyle(pai).overflowX;
        if (s === 'auto' || s === 'scroll' || s === 'hidden') return;
      }
      fora.push(el.tagName.toLowerCase() + (el.id ? '#' + el.id : '') + ' ' + Math.round(r.right));
    });
    var nav = d.querySelector('header.topo nav'), links = nav ? [].slice.call(nav.querySelectorAll('a')) : [];
    var topos = links.map(function (a) { return Math.round(a.getBoundingClientRect().top); });
    var topo = d.querySelector('header.topo').getBoundingClientRect();
    return { larg: larg, rola: d.documentElement.scrollWidth, fora: fora, umaLinha: topos.every(function (t) { return t === topos[0]; }),
             altura: Math.round(topo.height), links: links.length, navRola: nav ? p.w.getComputedStyle(nav).overflowX : '' };
  }

                      'GET /api/pagamento/meus': [200, { ok: true, ligado: true, pagamentos: [pag(31, 'aprovado'), pag(30, 'pendente')] }] }],
      ['conta.html', { 'GET /api/conta': function () { return [200, respostaConta({ conta: { id: 1, nome: 'Dono do Fundo Muito Comprido', email: 'dono@exemplo.com', criadoEm: AGORA - DIA, gm: true } })]; },
                       'GET /api/avatar': [200, { ok: true, escolhido: null, efetivo: { avatar: null, classe: null }, opcoes: [{ id: 'gm', tipo: 'gm' }], semSave: false, gm: true }] }],
      ['mestre.html', { 'GET /api/eu': [200, { ok: true, conta: { id: 1, nome: 'Dono do Fundo Muito Comprido', email: 'dono@exemplo.com', criadoEm: AGORA, gm: true } }],
                        'GET /api/mestre/presentes': [200, { ok: true, agora: AGORA, conta: null, presentes: [] }],
                        'GET /api/mestre/alertas': [200, { ok: true, alertas: [] }],
                        'GET /api/loja/catalogo': [200, catalogo2(true)] }]
    ];
    for (var i = 0; i < paginas.length; i++) {
      var rotas = paginas[i][1];
      rotas['GET /api/saude'] = SAUDE;
      var c = { sessao: { token: 'tok-mestre', conta: { id: 1, nome: 'Dono do Fundo Muito Comprido', gm: true } }, largura: 390, rotas: rotas };
      var p = await abre(paginas[i][0], c);
      await ate(function () { return !!p.q('nav a[data-mestre]') && /sair/.test(texto(p.$('sessao'))); });
      await espera(300);
      var m = mede(p);
      // o quadro tem 390 px; sem barra de rolagem por cima (a do Chrome de mesa come uns 15 px), a
      // largura útil fica entre 360 e 390 — e aí a página não pode rolar de lado
      check('celular 390 px (' + paginas[i][0] + ', conta gm): a página não rola de lado, nada vaza, o menu numa linha com o "Mestre" e o topo baixo',
            m.larg >= 360 && m.larg <= 390 && m.rola <= m.larg && !m.fora.length && m.umaLinha && m.links >= 8 && m.altura <= 120 &&
            m.navRola === 'auto', JSON.stringify(m).slice(0, 300));
    }
  }

  /* ======================================================================
   * as provas que olham tudo junto
   * ==================================================================== */
  function urlsLimpas() {
    var ruins = TODOS.filter(function (x) {
      var caminho = x.url.replace(/^[a-z]+:\/\/[^/]*/i, '');
      var ficha = x.rota === '/api/mestre/conta' && /^\/api\/mestre\/conta\?id=\d+$/.test(caminho);
      return (!ficha && /[?#]/.test(caminho)) || /@|%40/.test(x.url) || x.url.indexOf(EMAIL) >= 0;
    });
    check('nenhum fetch leva e-mail (ou coisa pendurada) na URL (' + TODOS.length + ' pedidos)', TODOS.length > 60 && !ruins.length,
          ruins.slice(0, 3).map(function (r) { return r.url; }).join(' | '));
    var get = TODOS.filter(function (x) { return x.metodo === 'GET' && x.corpo !== null; });
    check('GET nenhum leva corpo', !get.length);
  }

  async function fontes() {
    var arqs = ['loja.html', 'loja.js', 'conta.html', 'conta.js', 'site.js', 'mestre.html', 'mestre.js'], textos = {};
    for (var i = 0; i < arqs.length; i++) textos[arqs[i]] = await le(BASE_SITE + arqs[i]);
    check('li as fontes do site (loja, conta, site.js e o painel do Mestre)', arqs.every(function (a) { return !!textos[a]; }),
          arqs.filter(function (a) { return !textos[a]; }).join(', '));
    // os preços da tabela da loja 2 (vinténs), os pacotes em reais (texto e centavos) e os vinténs
    // dos pacotes escritos com ponto. O 1000 cru fica de fora de propósito: é o milissegundo de um segundo.
    var vintens = [10000, 20000, 25000, 30000, 1500, 3900, 7900, 500, 800, 2250, 3600, 4500, 5000];
    var achados = [];
    function procura(f) {
      var re = new RegExp('(^|[^\\d.,])' + f.replace(/\./g, '\\.') + '(?![\\d.,])');
      arqs.forEach(function (a) { if (re.test(textos[a] || '')) achados.push(a + ': ' + f); });
    }
    vintens.forEach(function (n) { procura(String(n)); procura(SITE.num(n)); });
    PACOTES.forEach(function (pc) {
      procura(String(pc.centavos));
      procura(pc.preco.replace('R$ ', ''));
      procura(SITE.num(pc.vintens));
      if (pc.vintens !== 1000) procura(String(pc.vintens));
    });
    check('nenhum preço escrito no HTML ou no JS do site (vinténs da tabela, reais e centavos dos pacotes)', !achados.length, achados.join(', '));
    check('a loja não diz mais "nada de dinheiro de verdade", e diz de onde vêm os vinténs',
          !/nada de dinheiro de verdade/.test(textos['loja.html']) &&
          /Os vinténs vêm das descidas ou dos pacotes \(Pix ou cartão, pelo Mercado Pago\)/.test(textos['loja.html']));
    check('nenhuma página do site chama window.confirm', arqs.every(function (a) {
      return !/\bconfirm\s*\(/.test((textos[a] || '').replace(/SITE\.confirma\s*\(/g, '')); }));
    check('a navegação ao pagamento passa por SITE.ehMercadoPago antes do LOJA.vai',
          /SITE\.ehMercadoPago\(r\.endereco\)/.test(textos['loja.js']) && textos['loja.js'].indexOf('SITE.ehMercadoPago(r.endereco)') < textos['loja.js'].lastIndexOf('LOJA.vai(r.endereco)'));
  }

  async function roda(nome, fn) {
    try { await fn(); } catch (e) { check(nome + ': o roteiro não estoura', false, String(e && (e.stack || e.message) || e).slice(0, 300)); }
  }

  (async function () {
    try {
      await roda('unidades', unidades);
      await roda('em breve', cenaEmBreve);
      await roda('pacotes sem sessão', cenaPacotesSemSessao);
      await roda('comprar pacote', cenaCompraPacote);
      await roda('volta aprovada', cenaVolta);
      await roda('volta em análise', cenaVoltaPendente);
      await roda('volta aberta', cenaVoltaAberta);
      await roda('volta recusada', cenaVoltaRecusada);
      await roda('volta torta', cenaVoltaTorta);
      await roda('volta desligada', cenaVoltaDesligado);
      await roda('volta sem sessão', cenaVoltaSemSessao);
      await roda('a caminho', cenaACaminho);
      await roda('sem save sem crédito', cenaSemSaveSemCredito);
      await roda('pedidos com origem', cenaPedidosOrigem);
      await roda('seus pacotes', cenaSeusPacotes);
      await roda('menu do Mestre', cenaMenuMestre);
      await roda('avatar', cenaAvatar);
      await roda('avatar do Mestre', cenaAvatarMestre);
      await roda('avatar 401', cenaAvatar401);
      await roda('avatar sem servidor', cenaAvatarServidorVelho);
      await roda('avatar escape', cenaAvatarEscape);
      await roda('celular', cenaCelular);
      await roda('urls', urlsLimpas);
      await roda('fontes', fontes);
    } finally {
      palco.innerHTML = '';
      try {
        if (sessaoAntes === null) localStorage.removeItem(CHAVE); else localStorage.setItem(CHAVE, sessaoAntes);
      } catch (e) { /* sem storage */ }
      fecha();
    }
  })();
})();
