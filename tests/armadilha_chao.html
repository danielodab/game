<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>SOTERRA 2.0 — a armadilha do Xamã fica no chão</title>
<style>
  body{margin:0;background:#0f1216;color:#e8eef6;font:13px system-ui,Segoe UI,sans-serif}
  h1{font-size:15px;margin:10px 14px 2px}
  .sub{color:#8895a6;font-size:12px;margin:0 14px 6px;max-width:960px}
  #st{font:12px monospace;margin:0 14px 8px;padding:5px 9px;border-radius:5px}
  .allpass{background:#16241b;color:#7fe08a} .fail{background:#3d1414;color:#f77}
  #app{position:fixed;left:-4000px;top:0;width:900px;height:600px}
  canvas.folha{display:block;margin:0 14px 14px;border:1px solid #2b3542}
</style>
</head>
<body>
<h1>A armadilha armada, no chão e na cor do elemento</h1>
<div class="sub">O motor guarda <code>state.traps</code> desde sempre, mas o renderizador só reagia ao
instante em que ela dispara — armadilha posta não desenhava nada. Aqui uma de cada
elemento é armada numa sala real e fotografada.</div>
<div id="st">rodando…</div>
<canvas id="folha" class="folha"></canvas>
<div id="app"><canvas id="game-canvas"></canvas><div id="ui-root"></div></div>

<script src="save_sandbox.js"></script>
<script>
  window.__V = '?v=' + Date.now();
  var arquivos = [
    'vendor/three.min.js','vendor/GLTFLoader.js','vendor/CopyShader.js',
    'vendor/LuminosityHighPassShader.js','vendor/EffectComposer.js',
    'vendor/RenderPass.js','vendor/ShaderPass.js','vendor/UnrealBloomPass.js',
    'js/core/data/elements.js','js/core/data/classes.js','js/core/data/spells.js',
    'js/core/data/progression.js','js/core/data/monsters.js','js/core/data/dungeons.js',
    'js/core/data/fusions.js','js/core/data/pets.js','js/core/data/items.js',
    'js/core/data/items_extra.js',
    'js/core/engine.js','js/core/fusion.js','js/core/ai.js','js/core/progress.js','js/core/game.js',
    'assets/embedded/env-kit.js','js/render3d/models3d.js',
    'assets/embedded/fx-atlas.js','assets/embedded/fx-placas.js','assets/embedded/models-anims.js',
    'assets/embedded/models-heroes.js','assets/embedded/models-meshy.js','assets/embedded/models-meshy-jardim.js','assets/embedded/models-fusoes-sumo.js','assets/embedded/models-fusoes-minotauro.js','assets/embedded/models-monsters.js',
    'assets/embedded/models-bosses.js','assets/embedded/models-summons.js',
    'js/render3d/models3d_v2.js','js/render3d/fx3d_v2.js','js/render3d/renderer3d_v2.js',
    'js/render2d/art.js','js/ui/hud.js'];
  for (var i = 0; i < arquivos.length; i++)
    document.write('<scr' + 'ipt src="../' + arquivos[i] + window.__V + '"></scr' + 'ipt>');
</script>

<script>
(function () {
  'use strict';
  var ELEMS = ['fogo', 'agua', 'terra', 'ar', 'neutro'];
  var TW = 300, TH = 240;
  var st = document.getElementById('st');
  var problemas = [];

  window.addEventListener('DOMContentLoaded', function () {
    var R = JOGO.Renderer, G = JOGO.Game;
    try { R.init(document.getElementById('game-canvas')); }
    catch (e) { st.textContent = 'init: ' + e.message; window.__pronto = true; return; }
    try { JOGO.UI.init(); } catch (e) {}
    try { G.init(); } catch (e) {}

    var t0 = Date.now();
    (function espera() {
      var ok = false;
      try {
        ok = JOGO.Models3D2 && JOGO.Models3D2.isReady() &&
             JOGO.Models3D && JOGO.Models3D.isReady() && R.isReady();
      } catch (e) {}
      if (!ok && Date.now() - t0 < 60000) return setTimeout(espera, 250);
      try {
        var ids = JOGO.Progress.heroIds();
        while (ids.length < 2) {
          JOGO.Progress.createHero(ids.length ? 'curandeiro' : 'sumo');
          ids = JOGO.Progress.heroIds();
        }
        G.startRun(ids.slice(0, 2), 'greenhouse');
      } catch (e) { st.textContent = 'não desci: ' + e.message; window.__pronto = true; return; }
      roda();
    })();

    function roda() {
      var bt = G.state;
      if (!bt || !bt.grid) { st.textContent = 'sem sala'; window.__pronto = true; return; }
      var heroi = (bt.units || []).filter(function (u) { return u.alive; })[0];

      // arma uma de cada elemento, em fila, do jeito que o motor guarda
      var payload = { fogo: 'trap-fogo-brasa', agua: 'trap-agua-redemoinho',
                      terra: 'trap-terra-laco', ar: 'trap-ar-rajada',
                      neutro: 'trap-neutro-alarme' };
      bt.traps.length = 0;
      ELEMS.forEach(function (e, i) {
        bt.traps.push({ x: heroi.x + 1 + i, y: heroi.y + 1, trapId: payload[e],
                        ownerUid: heroi.uid, side: heroi.side, remaining: 5 });
      });

      for (var q = 0; q < 12; q++) { try { R.render(0.04); } catch (err) { problemas.push(err.message); } }

      // O teste NAO julga por foto: conta os nós que o renderizador criou.
      var cena = R.scene ? R.scene() : null;
      var achados = 0, cores = {};
      if (cena) {
        cena.children.forEach(function (g) {
          var temArco = false, cor = null;
          g.traverse(function (o) {
            if (o.isMesh && o.geometry && o.geometry.type === 'TorusGeometry') {
              temArco = true;
              if (o.material && o.material.color) cor = o.material.color.getHexString();
            }
          });
          if (temArco) { achados++; if (cor) cores[cor] = (cores[cor] || 0) + 1; }
        });
      }

      function check(nome, cond, extra) {
        if (!cond) problemas.push(nome + (extra ? ' — ' + extra : ''));
      }
      check('a armadilha armada aparece no chão', achados === ELEMS.length,
            achados + ' de ' + ELEMS.length + ' desenhadas');
      check('cada elemento tem a SUA cor', Object.keys(cores).length === ELEMS.length,
            Object.keys(cores).length + ' cores distintas: ' + Object.keys(cores).join(', '));

      // e some quando a armadilha sai do estado
      bt.traps.length = 0;
      for (var w = 0; w < 4; w++) { try { R.render(0.04); } catch (err) {} }
      var sobrou = 0;
      if (cena) cena.children.forEach(function (g) {
        g.traverse(function (o) {
          if (o.isMesh && o.geometry && o.geometry.type === 'TorusGeometry') sobrou++;
        });
      });
      check('some do chão quando dispara ou expira', sobrou === 0, sobrou + ' sobraram');

      // ---- a foto
      bt.traps.push({ x: heroi.x + 1, y: heroi.y + 1, trapId: 'trap-fogo-brasa',
                      ownerUid: heroi.uid, side: heroi.side, remaining: 5 });
      var folha = document.getElementById('folha');
      folha.width = TW * 2; folha.height = TH;
      var g2 = folha.getContext('2d');
      var src = document.getElementById('game-canvas');
      [['uma armadilha de fogo', 1], ['as cinco, uma por elemento', 5]].forEach(function (p, i) {
        bt.traps.length = 0;
        for (var k = 0; k < p[1]; k++) {
          bt.traps.push({ x: heroi.x + 1 + k, y: heroi.y + 1, trapId: payload[ELEMS[k]],
                          ownerUid: heroi.uid, side: heroi.side, remaining: 5 });
        }
        for (var r = 0; r < 10; r++) { try { R.render(0.04); } catch (e) {} }
        g2.drawImage(src, 0, 0, src.width, src.height, i * TW, 0, TW, TH);
        g2.fillStyle = 'rgba(8,10,14,0.84)'; g2.fillRect(i * TW, TH - 26, TW, 26);
        g2.fillStyle = '#ffd98a'; g2.font = 'bold 13px Segoe UI, sans-serif';
        g2.fillText(p[0], i * TW + 8, TH - 8);
        g2.strokeStyle = '#2b3542'; g2.strokeRect(i * TW + 0.5, 0.5, TW - 1, TH - 1);
      });

      st.className = problemas.length ? 'fail' : 'allpass';
      st.textContent = (problemas.length ? 'FALHAS — ' : 'TUDO PASSOU — ') +
        (problemas.length ? problemas.join(' | ')
                          : ELEMS.length + ' armadilhas, uma cor por elemento, e somem ao sair');
      window.__pronto = true;
    }
  });
})();
</script>
</body>
</html>
