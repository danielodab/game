<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0d10">
<title>SOTERRA 2.0</title>
<link rel="stylesheet" href="css/style.css?v=1">
</head>
<body>
<div id="app">
  <canvas id="game-canvas"></canvas>
  <div id="ui-root"></div>
</div>

<!--
  Entrada da versão 2 (isométrico 2D em PixiJS). O index.html continua servindo a
  versão 1 (3D) enquanto a v2 é montada; a troca acontece na integração.
  Ordem obrigatória: vendor → dados → núcleo → apresentação → interface → loop.
  Bump do ?v=N a cada entrega para invalidar cache de script.
-->
<script src="vendor/pixi.min.js?v=1"></script>

<script src="js/core/data/elements.js?v=1"></script>
<script src="js/core/data/classes.js?v=1"></script>
<script src="js/core/data/spells.js?v=1"></script>
<script src="js/core/data/progression.js?v=1"></script>
<script src="js/core/data/monsters.js?v=1"></script>
<script src="js/core/data/dungeons.js?v=1"></script>
<script src="js/core/data/fusions.js?v=1"></script>
<script src="js/core/data/pets.js?v=1"></script>
<script src="js/core/data/items.js?v=1"></script>
<script src="js/core/data/items_extra.js?v=1"></script>

<script src="js/core/engine.js?v=1"></script>
<script src="js/core/fusion.js?v=1"></script>
<script src="js/core/ai.js?v=1"></script>
<script src="js/core/progress.js?v=1"></script>
<script src="js/core/game.js?v=1"></script>

<script src="js/render2d/art.js?v=1"></script>
<script src="js/render2d/fx.js?v=1"></script>
<script src="js/render2d/renderer.js?v=1"></script>

<script src="js/ui/hud.js?v=1"></script>
<script src="js/main.js?v=1"></script>
</body>
</html>
